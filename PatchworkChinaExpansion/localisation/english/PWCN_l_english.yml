l_english:
 PWCN_FENGCHAO:0 "Drone Hives"
 PWCN_FENGCHAO_DESC:0 "Choose whether cities can hide drone hives that ambush enemy divisions in their states. On by default."
 PWCN_FENGCHAO_ON:0 "On (default)"
 PWCN_FENGCHAO_ON_DESC:0 "§YDeploying§!\n - From §Y2§! states held a city may hide §Y1§! hive, §Y2§! from §Y15§! and §Y3§! from §Y30§!; never in the capital.\n - Each costs §Y25§! political power and is ready after §Y14§! days; only its owner sees where it is.\n\n§YAmbush§!\n - When divisions of an enemy at war enter or take the state, they lose §Rhalf§! their organisation.\n - The hive is spent; its slot is free again after §Y180§! days."
 PWCN_FENGCHAO_OFF:0 "Off"
 PWCN_FENGCHAO_OFF_DESC:0 "§YDeploying§!\n - No hives can be hidden and the Hub panel has no Hives page."
 PWCN_INTRO:0 "Hide drone hives in your states other than the capital. When enemy divisions enter or take the state, they lose half their organisation and the hive is spent. Only you see where hives are."

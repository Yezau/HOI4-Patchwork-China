l_english:
 PWCQ_CHENGQU:0 "Smart Districts"
 PWCQ_CHENGQU_DESC:0 "Choose whether each city's capital lays out districts that grant bonuses when matching ones are adjacent. On by default."
 PWCQ_CHENGQU_ON:0 "On (default)"
 PWCQ_CHENGQU_ON_DESC:0 "§YLayout§!\n - Capitals lay out districts on a 3x3 grid; two adjacent districts that match grant a bonus, and a few pairs clash.\n - One click applies a balanced, industry, offence or defence layout; districts can also be swapped by hand.\n - The first change applies at once; later changes take §Y14§! days of building with no bonus meanwhile.\n\n§YGrowth§!\n - §Y5§! districts at the start, §Y7§! at §Y6§! states held and all §Y9§! at §Y15§!."
 PWCQ_CHENGQU_OFF:0 "Off"
 PWCQ_CHENGQU_OFF_DESC:0 "§YLayout§!\n - Capitals have no districts and the Hub panel has no Districts page."
 PWCQ_PRESETS:0 "Preset:"
 PWCQ_PRESET1_ON:0 "§YBalanced§!"
 PWCQ_PRESET1_OFF:0 "Balanced"
 PWCQ_PRESET1_TT:0 "§YBalanced layout§!\nThe best balanced layout for this capital, in one click."
 PWCQ_PRESET2_ON:0 "§YIndustry§!"

 PWCT_DONE_TEXT:0 "You picked [PWCT_LastName]\nBonuses are in the Mandate spirit"
 PWCT_CHOOSE:0 "Choose"
 PWCT_FACTORY_UNAVAILABLE:0 "§RThe capital state has no free building slot.§!\nFree a slot or choose another card."

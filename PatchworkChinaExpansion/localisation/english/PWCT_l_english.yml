l_english:
 PWCT_RULE_TIANMING:0 "Mandate"
 PWCT_RULE_TIANMING_DESC:0 "Choose whether cities draw Mandate cards at regular intervals; cards level up and form sets and combos. On by default."
 PWCT_RULE_TIANMING_ON:0 "On (default)"
 PWCT_RULE_TIANMING_ON_DESC:0 "§YMandate days§!\n - At the start and on every Mandate day, each city picks §Y1§! of §Y3§! cards.\n - Players have §Y30 days§!; after that the rarest available card is taken.\n - Each draw, §Y30§! and §Y60§! political power each swap in a new set.\n\n§YCards§!\n - Military, politics and economy cards §Gtake effect at once§! and can level up.\n - §Y3§! and §Y6§! different cards of one class grant set bonuses; three named cards grant a combo.\n - §Y3§! cards of one class at max level grant a school title and its bonus.\n - Legendary cards appear from Mandate day §Y3§!, at most §Y2§! per city, and carry a §Rdrawback§!.\n - After §Y3§! draws without a rare or legendary card, the next draw has one.\n\n§YBonuses§!\n - All bonuses are merged into one national spirit, Mandate."
 PWCT_RULE_TIANMING_OFF:0 "Off"
 PWCT_RULE_TIANMING_OFF_DESC:0 "§YOff§!\n - §RNo draws§!, no Mandate button and no Mandate decisions.\n - The other Mandate rules have no effect."
 PWCT_RULE_CADENCE:0 "Mandate: draw interval"
 PWCT_RULE_CADENCE_DESC:0 "Choose how many months pass between Mandate days. Applies only with Mandate on; every 6 months by default."
 PWCT_RULE_CADENCE_M3:0 "Every 3 months"
 PWCT_RULE_CADENCE_M3_DESC:0 "§YMandate days§!\n - After the opening draw, a draw every §Y3 months§!.\n - Cards grow about §Gtwice§! as fast as the default."
 PWCT_RULE_CADENCE_M6:0 "Every 6 months (default)"
 PWCT_RULE_CADENCE_M6_DESC:0 "§YMandate days§!\n - After the opening draw, a draw every §Y6 months§!: each 1 January and 1 July."
 PWCT_RULE_CADENCE_M12:0 "Every 12 months"
 PWCT_RULE_CADENCE_M12_DESC:0 "§YMandate days§!\n - After the opening draw, a draw every §Y12 months§!.\n - Cards grow about §Rhalf§! as fast as the default."
 PWCT_RULE_AI_PARTICIPATION:0 "Mandate: AI draws"
 PWCT_RULE_AI_PARTICIPATION_DESC:0 "Choose whether the AI also draws Mandate cards. Applies only with Mandate on; the AI draws by default."
 PWCT_RULE_AI_PARTICIPATION_ALL:0 "AI draws (default)"
 PWCT_RULE_AI_PARTICIPATION_ALL_DESC:0 "§YWho draws§!\n - Players and AI share one card pool and the same odds.\n - The AI picks on the day by personality and situation and §Rnever redraws§!.\n - On Extreme or Cataclysm AI difficulty, the AI picks from §Y4§! cards."
 PWCT_RULE_AI_PARTICIPATION_PLAYERS:0 "Players only"
 PWCT_RULE_AI_PARTICIPATION_PLAYERS_DESC:0 "§YWho draws§!\n - Only human players draw.\n - The AI §Rgets no§! Mandate cards or bonuses."
 PWCT_RULE_STRATAGEMS:0 "Mandate: stratagem cards"
 PWCT_RULE_STRATAGEMS_DESC:0 "Choose whether the pool holds single-use stratagem cards. Applies only with Mandate on; on by default."
 PWCT_RULE_STRATAGEMS_ON:0 "On (default)"
 PWCT_RULE_STRATAGEMS_ON_DESC:0 "§YStratagems§!\n - The pool holds §Y10§! stratagem cards. Drawn ones go to your hand, at most §Y2§!.\n - Play them as decisions: some help you, some hit an §Renemy at war§! with you.\n - Empty Fort is never played: held in hand, it foils the next enemy stratagem aimed at you.\n - Human players hit by one are notified."
 PWCT_RULE_STRATAGEMS_OFF:0 "Off"
 PWCT_RULE_STRATAGEMS_OFF_DESC:0 "§YStratagems§!\n - The pool §Rholds no§! stratagems; only military, politics and economy cards."
 PWCT_RULE_CATCH_UP:0 "Mandate: catch-up"
 PWCT_RULE_CATCH_UP_DESC:0 "Choose whether cities in trouble get an extra card on Mandate days. Applies only with Mandate on; on by default."
 PWCT_RULE_CATCH_UP_ON:0 "On (default)"
 PWCT_RULE_CATCH_UP_ON_DESC:0 "§YIn trouble if either holds§!\n - It lost states since the last Mandate day.\n - It is at war with a city holding §Y3§! times its states or more.\n\n§YCatch-up§!\n - Candidates rise from §Y3§! to §G4§!.\n - Pity drops from §Y3§! to §G2§! draws."
 PWCT_RULE_CATCH_UP_OFF:0 "Off"
 PWCT_RULE_CATCH_UP_OFF_DESC:0 "§YIn trouble§!\n - Never judged: candidates and pity do not change after setbacks."
 PWCT_RULE_OMENS:0 "Mandate: omens"
 PWCT_RULE_OMENS_DESC:0 "Choose whether each Mandate day draws one omen that applies to every city alike. Applies only with Mandate on; on by default."
 PWCT_RULE_OMENS_ON:0 "On (default)"
 PWCT_RULE_OMENS_ON_DESC:0 "§YOmens§!\n - Each Mandate day draws one of §Y7§! omens. It applies to every city alike until the next Mandate day.\n - Omen bonuses join the Mandate spirit; the Mandate panel names the current omen.\n - Purple Dawn §Gdoubles§! the odds of Rare and Legendary cards that day."
 PWCT_RULE_OMENS_OFF:0 "Off"
 PWCT_RULE_OMENS_OFF_DESC:0 "§YOmens§!\n - §RNo§! omens are drawn."
 PWCT_TITLE:0 "Mandate"
 PWCT_TOPBAR_PENDING:0 "§Y!§!"
 PWCT_TOPBAR_TT:0 "§YMandate§!\nOpen the Mandate panel. A §Y!§! on the icon means a pick is waiting."

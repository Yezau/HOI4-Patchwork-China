l_english:
 PWCO_GUIDAO:0 "Low Orbit"
 PWCO_GUIDAO_DESC:0 "Choose whether large cities can launch satellites and shoot down each other's. On by default."
 PWCO_GUIDAO_ON:0 "On (default)"
 PWCO_GUIDAO_ON_DESC:0 "§YLaunching§!\n - A city launches satellites once it holds §Y15§! states and a launch site, or §Y30§! states.\n - Launch sites: Alxa, Xinzhou, Liangshan, Hainan.\n - Up to §Y3§! slots (one more from §Y30§! and §Y50§! states); each satellite costs §Y50§! political power, reaches orbit after §Y30§! days and lasts §Y48§! months.\n\n§YDebris§!\n - Shooting down a satellite of an enemy at war adds §R10§! to the shared debris index.\n - Each satellite in orbit is lost each month with a chance of the debris index times §Y0.1%§!; debris falls by §Y1§! a month."
 PWCO_GUIDAO_OFF:0 "Off"
 PWCO_GUIDAO_OFF_DESC:0 "§YLaunching§!\n - No satellites can be launched and the Hub panel has no Orbit page."

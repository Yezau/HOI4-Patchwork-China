 PWC_EXPANSION_BADGE_TT:0 "§YPatchwork China Gameplay Expansion§!\nEnabled. Toggle each mode in the Gameplay Expansion group of the game rules:\n - Mandate: pick one card at regular intervals; cards level up and form sets and combos.\n - Heritage Sites: heritage sites in the states a city holds grant bonuses by category.\n - The Art of War: cities learn its thirteen chapters from their war record, each with a bonus.\n - Smart Districts: capital districts grant bonuses when matching ones are adjacent.\n - Drone Hives: hidden drone hives halve the organisation of enemy divisions that enter.\n - Low Orbit: large cities launch satellites; shooting them down fills orbit with debris.\n\nClick to open its Steam Workshop page."

 PWCZ_CANGZHEN:0 "Heritage Sites"
 PWCZ_CANGZHEN_DESC:0 "Choose whether the heritage sites in the states a city holds grant bonuses. On by default."
 PWCZ_CANGZHEN_ON:0 "On (default)"
 PWCZ_CANGZHEN_ON_DESC:0 "§YHolding§!\n - A heritage site counts for a city while it owns and controls the site's state; an occupied state counts for no one.\n - §Y142§! sites in §Y14§! categories.\n\n§YBonuses§!\n - Enough sites of one category grant a bonus, in up to two tiers.\n - §Y10§! wonders each grant a bonus of their own.\n - All bonuses combine into one national spirit, Heritage."
 PWCZ_CANGZHEN_OFF:0 "Off"
 PWCZ_CANGZHEN_OFF_DESC:0 "§YHolding§!\n - Heritage sites grant no bonuses and the Archive panel has no Heritage page."

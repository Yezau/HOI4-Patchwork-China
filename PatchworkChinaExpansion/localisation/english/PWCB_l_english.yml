l_english:
 PWCB_BINGSHU:0 "The Art of War"
 PWCB_BINGSHU_DESC:0 "Choose whether cities learn the thirteen chapters of The Art of War from their war record and gain their bonuses. On by default."
 PWCB_BINGSHU_ON:0 "On (default)"
 PWCB_BINGSHU_ON_DESC:0 "§YLearning§!\n - A city learns a chapter as soon as its war record meets the chapter's condition; players and the AI follow the same rules.\n - §Y13§! chapters, each learnt once and never lost.\n\n§YBonuses§!\n - Each chapter grants a bonus.\n - Learning all thirteen adds the Master of War bonus.\n - All bonuses combine into one national spirit, The Art of War."
 PWCB_BINGSHU_OFF:0 "Off"
 PWCB_BINGSHU_OFF_DESC:0 "§YLearning§!\n - No chapters are learnt and the Archive panel has no Art of War page."
 PWCB_SUBTITLE:0 "The Art of War: §Y[?pwcb_learnt]§!/13 chapters learnt"
 PWCB_S1:0 "1"
 PWCB_S1_DONE:0 "§YDone§!"
 PWCB_S1_TODO:0 "§Y0§!/1"
 PWCB_D1_TITLE:0 "§YLaying Plans§!"
 PWCB_D1_QUOTE:0 "“The general who makes many calculations wins.”"
 PWCB_D1_BODY_DONE:0 "Condition: Declare a war with at least as many divisions as the target\nProgress: §GLearnt§!\nBonus: §GPlanning Speed +10%§!"
 PWCB_D1_BODY_TODO:0 "Condition: Declare a war with at least as many divisions as the target\nProgress: §Y0§!/1\nBonus: §GPlanning Speed +10%§!"
 PWCB_S2:0 "2"
 PWCB_S2_DONE:0 "§YDone§!"
 PWCB_S2_TODO:0 "§Y0§!/1"
 PWCB_D2_TITLE:0 "§YWaging War§!"
 PWCB_D2_QUOTE:0 "“In war, let your great object be victory, not lengthy campaigns.”"
 PWCB_D2_BODY_DONE:0 "Condition: Eliminate a city within §Y6§! weeks of its war starting\nProgress: §GLearnt§!\nBonus: §GEquipment Capture Ratio Factor +10%§!"
 PWCB_D2_BODY_TODO:0 "Condition: Eliminate a city within §Y6§! weeks of its war starting\nProgress: §Y0§!/1\nBonus: §GEquipment Capture Ratio Factor +10%§!"

 PWCB_D4_QUOTE:0 "“First make yourself invincible, then wait for the enemy to be vulnerable.”"
 PWCB_D4_BODY_DONE:0 "Condition: Lose no state for §Y3§! months in a row against stronger enemies\nProgress: §GLearnt§!\nBonus: §GDivision Defense +5%§!, §GMax Entrenchment +1§!"

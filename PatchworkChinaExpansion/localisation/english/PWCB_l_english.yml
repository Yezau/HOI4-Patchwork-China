 PWCB_S3_TODO:0 "§Y0§!/1"
 PWCB_D3_TITLE:0 "§YAttack by Stratagem§!"
 PWCB_D3_QUOTE:0 "“Know the enemy and know yourself, and you need not fear a hundred battles.”"
 PWCB_D3_BODY_DONE:0 "Condition: Gain part of another city's home territory without war\nProgress: §GLearnt§!\nBonus: §GCompliance Growth Speed +10%§!"
 PWCB_D3_BODY_TODO:0 "Condition: Gain part of another city's home territory without war\nProgress: §Y0§!/1\nBonus: §GCompliance Growth Speed +10%§!"

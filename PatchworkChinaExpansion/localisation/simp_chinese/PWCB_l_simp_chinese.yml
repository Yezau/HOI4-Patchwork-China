 PWCB_BINGSHU:0 "兵书"
 PWCB_BINGSHU_DESC:0 "决定各势力是否按战绩自动领悟《孙子兵法》十三篇并获得加成；默认开启。"
 PWCB_BINGSHU_ON:0 "开启（默认）"
 PWCB_BINGSHU_ON_DESC:0 "§Y领悟§!\n·达成某篇的战绩即自动领悟该篇，玩家与电脑规则相同。\n·共§Y13§!篇，每篇只领悟一次，之后不会失去。\n\n§Y加成§!\n·每篇各带一项加成。\n·十三篇全部领悟另得「兵圣」加成。\n·全部加成合并为一个民族精神「兵书」。"
 PWCB_BINGSHU_OFF:0 "关闭"
 PWCB_BINGSHU_OFF_DESC:0 "§Y领悟§!\n·不领悟兵书篇章，图籍面板不显示兵书页。"

l_simp_chinese:
 PWCT_RULE_TIANMING:0 "天命"
 PWCT_RULE_TIANMING_DESC:0 "决定各势力是否定期抽取天命卡，卡牌可叠加升级、凑成套装与组合；默认开启。"
 PWCT_RULE_TIANMING_ON:0 "开启（默认）"
 PWCT_RULE_TIANMING_ON_DESC:0 "§Y天命日§!\n·开局与之后每个天命日，各势力从§Y3§!张候选中选择§Y1§!张。\n·真人玩家有§Y30天§!选择时间，超时自动选取可用候选中稀有度最高的一张。\n·每期可花费§Y30§!、§Y60§!政治点数各换一组候选。\n\n§Y卡牌§!\n·军、政、经三类卡§G立即生效§!，可升级。\n·同类不同卡达到§Y3§!、§Y6§!张时获得套装加成；集齐指定三张获得组合加成。\n·同类有§Y3§!张卡升到满级时获得流派称号与额外加成。\n·绝品卡从第§Y3§!次天命日起出现，每个势力最多§Y2§!张，附带§R代价§!。\n·连续§Y3§!次没有珍品或绝品时，下一次必出一张。\n\n§Y加成§!\n·全部加成合并为一个民族精神「天命」。"
 PWCT_RULE_TIANMING_OFF:0 "关闭"
 PWCT_RULE_TIANMING_OFF_DESC:0 "§Y关闭§!\n·§R不抽卡§!，不显示天命入口与相关决议。\n·其余天命规则不生效。"
 PWCT_RULE_CADENCE:0 "天命·抽卡间隔"
 PWCT_RULE_CADENCE_DESC:0 "决定两次天命日之间相隔几个月；仅在天命开启时生效，默认每6个月。"
 PWCT_RULE_CADENCE_M3:0 "每3个月"
 PWCT_RULE_CADENCE_M3_DESC:0 "§Y天命日§!\n·开局抽卡后，每§Y3个月§!抽卡一次。\n·卡牌成长约为默认节奏的§G2倍§!。"
 PWCT_RULE_CADENCE_M6:0 "每6个月（默认）"
 PWCT_RULE_CADENCE_M6_DESC:0 "§Y天命日§!\n·开局抽卡后，每§Y6个月§!抽卡一次，即每年1月1日与7月1日。"
 PWCT_RULE_CADENCE_M12:0 "每12个月"
 PWCT_RULE_CADENCE_M12_DESC:0 "§Y天命日§!\n·开局抽卡后，每§Y12个月§!抽卡一次。\n·卡牌成长约为默认节奏的§R一半§!。"
 PWCT_RULE_AI_PARTICIPATION:0 "天命·AI 抽卡"
 PWCT_RULE_AI_PARTICIPATION_DESC:0 "决定AI是否同样参与天命抽卡；仅在天命开启时生效，默认参与。"
 PWCT_RULE_AI_PARTICIPATION_ALL:0 "AI 参与（默认）"
 PWCT_RULE_AI_PARTICIPATION_ALL_DESC:0 "§Y参与范围§!\n·真人玩家与AI使用同一卡池和同样的抽取概率。\n·AI在天命日当天按性格与局势选卡，§R不换牌§!。\n·AI难度为极限或天灾时，AI从§Y4§!张候选中选择。"
 PWCT_RULE_AI_PARTICIPATION_PLAYERS:0 "仅真人玩家"
 PWCT_RULE_AI_PARTICIPATION_PLAYERS_DESC:0 "§Y参与范围§!\n·只有真人玩家抽卡。\n·AI§R不获得§!天命卡与相关加成。"
 PWCT_RULE_STRATAGEMS:0 "天命·奇谋卡"
 PWCT_RULE_STRATAGEMS_DESC:0 "决定卡池中是否包含一次性的奇谋卡；仅在天命开启时生效，默认开启。"
 PWCT_RULE_STRATAGEMS_ON:0 "开启（默认）"
 PWCT_RULE_STRATAGEMS_ON_DESC:0 "§Y奇谋卡§!\n·卡池包含§Y10§!张奇谋卡，抽中后进入手牌，手牌最多§Y2§!张。\n·通过决议使用：部分作用于自己，部分作用于§R交战势力§!。\n·「空城计」无需使用，留在手牌中自动化解下一次针对己方的敌方奇谋。\n·被奇谋卡作用的真人玩家会收到通知。"
 PWCT_RULE_STRATAGEMS_OFF:0 "关闭"
 PWCT_RULE_STRATAGEMS_OFF_DESC:0 "§Y奇谋卡§!\n·卡池§R不含§!奇谋卡，只抽军、政、经三类卡。"
 PWCT_RULE_CATCH_UP:0 "天命·逆风补偿"
 PWCT_RULE_CATCH_UP_DESC:0 "决定处于逆境的势力是否在天命日获得额外候选；仅在天命开启时生效，默认开启。"
 PWCT_RULE_CATCH_UP_ON:0 "开启（默认）"
 PWCT_RULE_CATCH_UP_ON_DESC:0 "§Y逆境判定（满足任一条）§!\n·自上个天命日以来失去过州。\n·正与州数达到己方§Y3§!倍及以上的势力交战。\n\n§Y补偿§!\n·候选从§Y3§!张增加到§G4§!张。\n·保底从连续§Y3§!次降为§G2§!次。"
 PWCT_RULE_CATCH_UP_OFF:0 "关闭"
 PWCT_RULE_CATCH_UP_OFF_DESC:0 "§Y逆境判定§!\n·不判定逆境：候选张数与保底次数不因失利改变。"
 PWCT_RULE_OMENS:0 "天命·天象"
 PWCT_RULE_OMENS_DESC:0 "决定每个天命日是否抽取一个对所有势力同样生效的天象；仅在天命开启时生效，默认开启。"
 PWCT_RULE_OMENS_ON:0 "开启（默认）"
 PWCT_RULE_OMENS_ON_DESC:0 "§Y天象§!\n·每个天命日从§Y7§!种天象中抽取一种，对所有势力同样生效，直到下一个天命日。\n·天象加成并入民族精神「天命」，天命面板显示当期天象。\n·「紫气东来」让当期珍品与绝品的出现率§G翻倍§!。"
 PWCT_RULE_OMENS_OFF:0 "关闭"
 PWCT_RULE_OMENS_OFF_DESC:0 "§Y天象§!\n·§R不抽取§!天象。"
 PWCT_TITLE:0 "天命"
 PWCT_TOPBAR_PENDING:0 "§Y!§!"
 PWCT_TOPBAR_TT:0 "§Y天命§!\n打开天命面板。图标上的§Y!§!表示本期尚未选卡。"

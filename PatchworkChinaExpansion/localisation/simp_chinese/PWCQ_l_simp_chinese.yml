l_simp_chinese:
 PWCQ_CHENGQU:0 "智慧城区"
 PWCQ_CHENGQU_DESC:0 "决定各势力的首都是否按功能区布局获得相邻搭配加成；默认开启。"
 PWCQ_CHENGQU_ON:0 "开启（默认）"
 PWCQ_CHENGQU_ON_DESC:0 "§Y布局§!\n·首都按3×3格布置功能区，相邻且能搭配的两区得一项加成，少数组合相冲。\n·可一键套用均衡、工业、进攻、防守布局，也可手动互换两区。\n·首次调整立即生效，之后每次调整需§Y14§!天施工，期间暂无加成。\n\n§Y扩建§!\n·开局开放§Y5§!区；拥有并控制§Y6§!个州开放§Y7§!区，§Y15§!个州开放全部§Y9§!区。"
 PWCQ_CHENGQU_OFF:0 "关闭"
 PWCQ_CHENGQU_OFF_DESC:0 "§Y布局§!\n·首都不设功能区，中枢面板不显示城区页。"
 PWCQ_PRESETS:0 "一键布局："
 PWCQ_PRESET1_ON:0 "§Y均衡§!"
 PWCQ_PRESET1_OFF:0 "均衡"
 PWCQ_PRESET1_TT:0 "§Y均衡布局§!\n按本城功能区与地形算好的均衡布局，一键套用。"
 PWCQ_PRESET2_ON:0 "§Y工业§!"
 PWCQ_PRESET2_OFF:0 "工业"
 PWCQ_PRESET2_TT:0 "§Y工业布局§!\n按本城功能区与地形算好的偏工业布局，一键套用。"
 PWCQ_PRESET3_ON:0 "§Y进攻§!"
 PWCQ_PRESET3_OFF:0 "进攻"
 PWCQ_PRESET3_TT:0 "§Y进攻布局§!\n按本城功能区与地形算好的偏进攻布局，一键套用。"
 PWCQ_PRESET4_ON:0 "§Y防守§!"

 pwco.1.t:0 "卫星被击毁"
 pwco.1.d:0 "[?pwco_report_by.GetName]用反卫星武器击毁了我们的一颗卫星。当前太空碎片指数为§Y[?global.pwco_debris]§!"
 pwco.2.t:0 "卫星损毁"
 pwco.2.d:0 "我们的一颗卫星被太空碎片击中损毁。当前碎片指数§Y[?global.pwco_debris]§!"
 pwco.3.t:0 "发射失败"
 pwco.3.d:0 "轨道上的碎片太多，这次发射没能入轨。当前碎片指数§Y[?global.pwco_debris]§!"
 pwco.4.t:0 "太空碎片增多"
 pwco.4.d:0 "反卫星打击让近地轨道布满碎片，指数已达§Y[?global.pwco_debris]§!。每颗在轨卫星每月都有更大风险损毁"
 pwco.5.t:0 "近地轨道开放"
 pwco.5.d:0 "我们的地盘与发射能力已足以把卫星送上近地轨道"

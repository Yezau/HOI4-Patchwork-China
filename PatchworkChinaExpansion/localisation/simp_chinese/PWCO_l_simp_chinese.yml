 PWCO_GUIDAO_ON_DESC:0 "§Y发射§!\n·拥有并控制§Y15§!个州且持有发射场，或拥有并控制§Y30§!个州，即可发射卫星\n·发射场：阿拉善、忻州、凉山、海南\n·轨位最多§Y3§!个（§Y30§!、§Y50§!个州起各加§Y1§!个）；每颗§Y50§!政治点数，§Y30§!天入轨，寿命§Y48§!个月\n\n§Y碎片§!\n·对交战敌方反卫星击毁其一颗卫星，全图太空碎片§R+10§!\n·每颗在轨卫星每月按碎片指数×§Y0.1%§!的概率损毁；碎片每月自然减少§Y1§!"
 PWCO_GUIDAO_OFF:0 "关闭"

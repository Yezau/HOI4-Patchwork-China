l_simp_chinese:
 PWCN_FENGCHAO:0 "蜂巢伏击"
 PWCN_FENGCHAO_DESC:0 "决定各势力能否在己方州暗藏无人机蜂巢伏击来犯敌军；默认开启"
 PWCN_FENGCHAO_ON:0 "开启（默认）"
 PWCN_FENGCHAO_ON_DESC:0 "§Y部署§!\n·拥有并控制§Y2§!个州起可藏§Y1§!处蜂巢，§Y15§!个州§Y2§!处，§Y30§!个州§Y3§!处；首都不能设\n·每处花费§Y25§!政治点数，§Y14§!天后待命；位置只有己方可见\n\n§Y伏击§!\n·交战敌方的师进入蜂巢所在州或夺取该州时，州内敌师组织度§R减半§!\n·伏击后蜂巢耗尽，§Y180§!天后名额可再用"
 PWCN_FENGCHAO_OFF:0 "关闭"
 PWCN_FENGCHAO_OFF_DESC:0 "§Y部署§!\n·不能藏蜂巢，中枢面板不显示蜂巢页"
 PWCN_INTRO:0 "在己方非首都州暗藏无人机蜂巢：交战敌方的师进入或夺取该州时，州内敌师组织度减半\n蜂巢随即耗尽，位置只有你能看到"

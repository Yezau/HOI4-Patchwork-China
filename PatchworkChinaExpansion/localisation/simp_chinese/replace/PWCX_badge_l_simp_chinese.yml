 PWC_EXPANSION_BADGE_TT:0 "§Y中国每人一小块地•玩法拓展§!\n已启用。可在开局规则的“玩法拓展”分组中开关：\n·天命：定期从候选卡中选择一张，卡牌叠加升级，凑成套装与组合。\n·风物：治下的地方风物按类别带来加成，十处天下名胜另有单独加成。\n·兵书：按战绩自动领悟《孙子兵法》十三篇，每篇各带加成。\n·智慧城区：首都功能区按相邻搭配获得加成，地盘越大开放的功能区越多。\n·蜂巢伏击：在己方非首都州暗藏无人机蜂巢，交战敌军进入时组织度减半。\n·近地轨道：地盘够大即可发射侦察、通信、导航卫星；反卫星会让全图太空碎片增多。\n\n点击打开创意工坊页面。"

l_simp_chinese:
 PWCZ_CANGZHEN:0 "风物"
 PWCZ_CANGZHEN_DESC:0 "决定各势力治下的地方风物是否带来加成；默认开启。"
 PWCZ_CANGZHEN_ON:0 "开启（默认）"
 PWCZ_CANGZHEN_ON_DESC:0 "§Y治下§!\n·拥有并控制风物所在的州，该处风物即在己方治下；州被占领期间不计入任何一方。\n·全图共§Y142§!处风物，分§Y14§!类。\n\n§Y加成§!\n·同类风物在治下达到规定处数得一档加成，最多两档。\n·§Y10§!处天下名胜各带一项单独加成。\n·全部加成合并为一个民族精神「风物」。"
 PWCZ_CANGZHEN_OFF:0 "关闭"
 PWCZ_CANGZHEN_OFF_DESC:0 "§Y治下§!\n·风物不带来加成，图籍面板不显示风物页。"

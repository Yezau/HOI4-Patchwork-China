 PWC_MODULE_TANK_GUN_120MM: "120mm 现代滑膛炮"
 PWC_MODULE_TANK_GUN_120MM_DESC: "滑膛主炮围绕现代直射弹药设计。炮管、装填空间与火控设备需要作为完整的武器系统共同布置。"

 PWC_MIO_LOGISTICS_POLICY_PRODUCTION_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。装备加成仅适用于$PWC_EQUIPMENT_MOTORIZED$、$PWC_EQUIPMENT_SUPPORT$。生产成本 -10%、可靠性 -5%。"

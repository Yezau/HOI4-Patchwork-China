 PWC_TECH_ELECTRONICS_RADAR_T1: "数字化基础探测"
 PWC_TECH_ELECTRONICS_RADAR_T1_DESC: "部署基础数字雷达与现代探测设备，并完善侦察单位的观测流程。"
 PWC_TECH_ELECTRONICS_RADAR_T2: "电子预警与探测"
 PWC_TECH_ELECTRONICS_RADAR_T2_DESC: "扩展预警覆盖与电子探测能力，为防空和态势判断提供更稳定的观测。"
 PWC_TECH_ELECTRONICS_RADAR_T4: "先进探测与电子战"
 PWC_TECH_ELECTRONICS_RADAR_T4_DESC: "完善先进探测网络与电子战设备，扩展雷达覆盖并支撑更复杂的协同行动。"
 PWC_TECH_ELECTRONICS_T1: "科研计算工具"
 PWC_TECH_ELECTRONICS_T1_DESC: "以现代计算设备和工程软件建立科研工作环境，并将可靠的数据处理流程引入师属与总部通信单位。"
 PWC_TECH_ELECTRONICS_T2: "数字通信与计算"
 PWC_TECH_ELECTRONICS_T2_DESC: "改进科研网络和数字通信流程，让工程团队可靠交换成果，也让通信单位更快传递和处理指令。"
 PWC_TECH_ELECTRONICS_T3: "综合传感与火控"
 PWC_TECH_ELECTRONICS_T3_DESC: "融合多源传感与火控信息，提高侦察连能力，并发展雷达探测和平台航电。"
 PWC_TECH_ELECTRONICS_T4: "网络化计算体系"
 PWC_TECH_ELECTRONICS_T4_DESC: "将分散计算资源组织成协作体系，支持复杂科研与模型验证，并持续提高师属和总部通信单位的协同效率。"
 PWC_TECH_FOLDER: "科技"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T2: "装配式施工与现场工程"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T2_DESC: "采用装配式构件和标准化现场流程，改善建设与受损设施抢修。"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T3: "快速建设与修复"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T3_DESC: "把预制构件、施工组织与抢修流程连成一套工程规范，缩短新建设施和受损建筑恢复使用的时间。"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T4: "集成工程管理"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T4_DESC: "统一工程设计、施工调度与抢修资源，加快新设施建设，并让受损建筑更快恢复运转。"
 PWC_TECH_INDUSTRY_MANUFACTURING_T1: "现代数控制造"
 PWC_TECH_INDUSTRY_MANUFACTURING_T1_DESC: "以现代数控设备、工艺管理和质量控制提高工厂与船坞产出，让新产线更快起步并达到更高效率。"
 PWC_TECH_INDUSTRY_T1: "工程标准化"
 PWC_TECH_INDUSTRY_T1_DESC: "统一工程图纸、施工工序与质量验收，让建设队伍按共同标准作业，也让受损设施能够迅速组织修复。"
 PWC_TECH_INDUSTRY_T2: "精益制造"
 PWC_TECH_INDUSTRY_T2_DESC: "精益生产从等待、搬运与返工等日常环节寻找问题。工序之间更清晰的衔接，使整个工厂能够围绕稳定的生产流程工作。"
 PWC_TECH_INDUSTRY_T3: "精密制造与复合材料"
 PWC_TECH_INDUSTRY_T3_DESC: "精密机床、复合材料与检测工艺共同提高工厂和船坞产能。标准化工装让生产线在切换型号时保留更多熟练经验。"
 PWC_TECH_INDUSTRY_T4: "先进生产体系"
 PWC_TECH_INDUSTRY_T4_DESC: "联通研发、制造和生产管理，提高工厂与船坞产能，让新产线更快起步，并更快积累熟练效率。"

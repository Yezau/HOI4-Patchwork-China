 PWC_MIO_INFANTRY_POLICY_INNOVATION_EFFECTS: "组织方针（50 政治点，180 天冷却，同时仅一个生效）：机构达到 10 级解锁。突破 +12%、软杀伤 +6%、生产成本 +6%。"
 PWC_MIO_INFANTRY_POLICY_PRODUCTION: "动员型兵工生产"
 PWC_MIO_INFANTRY_POLICY_PRODUCTION_DESC: "压缩非必要的制造与耐久标准，迅速扩大轻武器供给，并承担更高的维护与损耗压力。"
 PWC_MIO_INFANTRY_POLICY_PRODUCTION_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。生产成本 -12%、可靠性 -5%。"
 PWC_MIO_INFANTRY_POLICY_QUALITY: "班组压制火力"
 PWC_MIO_INFANTRY_POLICY_QUALITY_DESC: "提高班组武器的压制与推进能力，用额外制造投入支持步兵火力任务。"
 PWC_MIO_INFANTRY_POLICY_QUALITY_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。软杀伤 +9%、突破 +6%、生产成本 +5%。"
 PWC_MIO_INFANTRY_SIDE_1: "冲压机匣"
 PWC_MIO_INFANTRY_SIDE_1_DESC: "冲压机匣以成型工艺组织枪械主要结构的制造。模具、材料与装配要求共同决定零件如何进入稳定生产。"
 PWC_MIO_INFANTRY_SIDE_1_EFFECTS: "侧支特质：生产成本 -3%。"
 PWC_MIO_INFANTRY_SIDE_2: "分散兵工车间"
 PWC_MIO_INFANTRY_SIDE_2_DESC: "分散兵工车间依靠共同图纸与检验程序保持联系。不同地点的生产工作只有遵循统一标准，才能汇集为可互相配套的装备。"
 PWC_MIO_INFANTRY_SIDE_2_EFFECTS: "侧支特质：生产产能 +3%。"
 PWC_MIO_INFANTRY_SIDE_3: "防尘密封试验"
 PWC_MIO_INFANTRY_SIDE_3_DESC: "防尘密封试验研究武器在复杂环境中的实际工作状态。检查不仅关注新器材，也关注反复使用和保养之后的情况。"
 PWC_MIO_INFANTRY_SIDE_3_EFFECTS: "侧支特质：可靠性 +3%。"
 PWC_MIO_INFANTRY_SIDE_4: "突击武器配套"
 PWC_MIO_INFANTRY_SIDE_4_DESC: "突击武器配套围绕步兵接近与展开时的操作需求组织设计。携行、使用和班组协同需要在同一套装备安排中得到考虑。"
 PWC_MIO_INFANTRY_SIDE_4_EFFECTS: "侧支特质：突破 +3%。"
 PWC_MIO_INFANTRY_SIDE_5: "班组反装甲武器"
 PWC_MIO_INFANTRY_SIDE_5_DESC: "班组反装甲武器把专门任务带到步兵基层单位。武器携行、观察与射击职责需要与班组原有的分工共同安排。"
 PWC_MIO_INFANTRY_SIDE_5_EFFECTS: "交叉特质：硬杀伤 +3%。需先解锁 $PWC_MIO_INFANTRY_CHAIN_A_2$、$PWC_MIO_INFANTRY_CHAIN_B_2$ 之一。"
 PWC_MIO_INFANTRY_SIDE_6: "步兵武器靶场"
 PWC_MIO_INFANTRY_SIDE_6_DESC: "步兵武器靶场提供统一的试射和观察条件。设计人员与使用者能够围绕同样的记录讨论器材，而不是依赖各自零散的印象。"
 PWC_MIO_INFANTRY_SIDE_6_EFFECTS: "交叉特质：组织研发加成 +3%。"
 PWC_MIO_INFANTRY_SIDE_7: "阵地火力配套"
 PWC_MIO_INFANTRY_SIDE_7_DESC: "阵地火力配套把步兵武器的布置、观察与支援关系共同规划。各班组知道如何在同一防务安排中接续彼此的任务。"
 PWC_MIO_INFANTRY_SIDE_7_EFFECTS: "交叉特质：防御 +3%。"

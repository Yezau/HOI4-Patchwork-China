 PWC_MODULE_TANK_GUN_140MM_ETC: "140mm 电热化学炮"
 PWC_MODULE_TANK_GUN_140MM_ETC_DESC: "电热化学主炮探索新的发射控制与大口径武器配套。它是一项需要同时处理炮塔空间、能源和弹药组织的复杂工程。"
 PWC_MODULE_TANK_GUN_140MM_ETC_EFFECTS: "分组：大口径坦克火炮。可装：$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$。"

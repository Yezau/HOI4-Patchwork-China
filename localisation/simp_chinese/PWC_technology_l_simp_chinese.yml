 PWC_MIO_LOGISTICS_DESC: "后勤装备联合体关注车辆、通用器材与持续保障。它以可靠的工业协作连接前线需求，使看似普通的装备成为完整后勤体系的一部分。"
 PWC_MIO_LOGISTICS_EFFECTS: "初始特质提供生产产能 +3%、可靠性 +3%；两条专精路线互斥，选定一路后连同公共分支共可解锁 12 项特质。特质点随组织成长获得，可在 7 条政策中择一执行。"
 PWC_MIO_LOGISTICS_INITIAL: "后勤装备工程"
 PWC_MIO_LOGISTICS_INITIAL_DESC: "后勤装备工程从持续使用而非一次交付考虑器材。通用部件、制造规范与维修工作共同支撑部队日常的保障需求。"
 PWC_MIO_LOGISTICS_INITIAL_EFFECTS: "初始特质：生产产能 +3%、可靠性 +3%。"
 PWC_MIO_LOGISTICS_POLICY_COST: "低耗运输动力"
 PWC_MIO_LOGISTICS_POLICY_COST_DESC: "优化运输与保障车辆的动力效率，用于燃料紧张或需要快速机动的补给体系。"

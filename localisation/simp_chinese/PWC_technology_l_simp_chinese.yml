 PWC_EQUIPMENT_ANTI_AIR: "机动防空导弹系统"
 PWC_EQUIPMENT_ANTI_AIR_DESC: "由机动导弹、探测与火控设备承担随队防空，后续整合多目标交战和智能反无人机能力。"
 PWC_EQUIPMENT_ANTI_AIR_EFFECTS: "装备族基型，共 4 阶。0阶由 $PWC_TECH0_BASIC_INFANTRY$ 解锁，后续各代由科技或专项逐级解锁。"
 PWC_EQUIPMENT_ANTI_AIR_GEN0: "0阶·早期机动防空系统"
 PWC_EQUIPMENT_ANTI_AIR_GEN0_DESC: "早期机动防空系统依靠简单制导与警戒设备，主要掩护近程目标。"
 PWC_EQUIPMENT_ANTI_AIR_GEN0_EFFECTS: "装备属性：软杀伤 1.4、硬杀伤 2.1、穿透 7、对空 21、防御 3.5、突破 1.4、速度 8、燃油消耗 0.7、装甲 3.5、硬度 15、可靠性 72。造价 4.2 IC。由 $PWC_TECH0_BASIC_INFANTRY$ 解锁。"
 PWC_EQUIPMENT_ANTI_AIR_GEN1: "一代·机动近程防空导弹"
 PWC_EQUIPMENT_ANTI_AIR_GEN1_DESC: "$PWC_EQUIPMENT_ANTI_AIR_DESC$本代方案以成熟工艺建立通用的设计与保障基础。"
 PWC_EQUIPMENT_ANTI_AIR_GEN1_EFFECTS: "装备属性：软杀伤 2、硬杀伤 3、穿透 10、对空 32、防御 5、突破 2、速度 10、燃油消耗 1、装甲 5、硬度 15、可靠性 82。造价 6 IC。由 $PWC_TECH_MISSILE_DEFENSE_T1$ 解锁。"
 PWC_EQUIPMENT_ANTI_AIR_GEN2: "二代·多目标机动防空系统"
 PWC_EQUIPMENT_ANTI_AIR_GEN2_DESC: "$PWC_EQUIPMENT_ANTI_AIR_DESC$本代方案吸收服役经验，重新协调各部件与日常使用流程。"
 PWC_EQUIPMENT_ANTI_AIR_GEN2_EFFECTS: "装备属性：软杀伤 3、硬杀伤 4、穿透 12、对空 42、防御 6、突破 3、速度 11、燃油消耗 1.2、装甲 8、硬度 20、可靠性 85。造价 8 IC。由 $PWC_TECH_MISSILE_T3$ 解锁。"
 PWC_EQUIPMENT_ANTI_AIR_GEN3: "三代·分布式智能防空系统"
 PWC_EQUIPMENT_ANTI_AIR_GEN3_DESC: "$PWC_EQUIPMENT_ANTI_AIR_DESC$本代方案重视各项设备之间的衔接，使复杂任务能够围绕共同接口展开。"

 PWC_MODULE_AIR_SPECIAL_LO_COATING_DESC: "低可探测涂层是机体表面处理的一部分。材料施工、表面状态和后续维护需要遵循统一规范，才能与飞机整体设计相互配合。"
 PWC_MODULE_AIR_SPECIAL_LO_COATING_EFFECTS: "分组：低可探测涂层。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$。同组最多安装 1 个。"

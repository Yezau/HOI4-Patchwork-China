 PWC_MODULE_AIR_PAYLOAD_STANDOFF_BOMB: "防区外滑翔炸弹"
 PWC_MODULE_AIR_PAYLOAD_STANDOFF_BOMB_DESC: "滑翔炸弹将飞行控制与无动力滑翔结合，用于规划发射点之外的打击航迹。载机与弹药之间需要明确的任务信息交接。"

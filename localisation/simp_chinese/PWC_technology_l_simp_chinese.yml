 PWC_TECH_LOGISTICS_SUPPORT_T1: "维修与战地救护"
 PWC_TECH_LOGISTICS_SUPPORT_T1_DESC: "建立随队维修与战地救护编制，让现代保障器材能够转化为部队的持续作战能力。"
 PWC_TECH_LOGISTICS_SUPPORT_T2: "模块化野战保障"
 PWC_TECH_LOGISTICS_SUPPORT_T2_DESC: "用模块化备件、工兵器材和救护流程改善构筑、可靠性与人员回收。"
 PWC_TECH_LOGISTICS_SUPPORT_T3: "综合保障装备"
 PWC_TECH_LOGISTICS_SUPPORT_T3_DESC: "升级野战保障装备，以精密器材和维修诊断提高维护连的装备可靠性。"
 PWC_TECH_LOGISTICS_SUPPORT_T4: "无人抢修与智能救护"
 PWC_TECH_LOGISTICS_SUPPORT_T4_DESC: "将无人抢修、智能救护与现场工程协同起来，提高装备回收和人员救治能力。"
 PWC_TECH_LOGISTICS_T1: "仓储配送组织"
 PWC_TECH_LOGISTICS_T1_DESC: "现代仓储与配送为物资建立清晰的身份、位置与流转记录。补给由临时搬运逐渐转变为能够计划和追踪的日常工作。"
 PWC_TECH_LOGISTICS_T2: "重载公铁运输"
 PWC_TECH_LOGISTICS_T2_DESC: "运输投送体系把仓库、道路与车辆调度连成完整过程。物资不仅要被生产出来，还必须按照任务需要抵达能够使用它的地方。"
 PWC_TECH_LOGISTICS_T3: "战区运输与防护"
 PWC_TECH_LOGISTICS_T3_DESC: "战区后勤网络以多个节点和线路共同支撑部队。前线需求、后方储备与维修运输被放在一起协调，避免各单位独自应对保障问题。"
 PWC_TECH_LOGISTICS_T4: "综合投送保障"
 PWC_TECH_LOGISTICS_T4_DESC: "跨区投送需要让不同地区的运输与保障组织遵循共同规则。成熟的后勤体系能够把物资流转理解为跨越行政边界的连续过程。"
 PWC_TECH_MISSILE_DEFENSE_T1: "现代防空与反坦克导弹"
 PWC_TECH_MISSILE_DEFENSE_T1_DESC: "以车载防空导弹和便携式反坦克导弹建立现代防御火力，分别应对空中与装甲目标。"
 PWC_TECH_MISSILE_DEFENSE_T2: "目标识别与协同拦截"
 PWC_TECH_MISSILE_DEFENSE_T2_DESC: "改进目标识别与射击协同，增强现有防空和反坦克分队的拦截能力。"
 PWC_TECH_MISSILE_STRIKE_T3: "分布式目标指示"
 PWC_TECH_MISSILE_STRIKE_T3_DESC: "连接侦察、目标指示与无人发射单元，投入第三代火箭炮生产，并改善炮兵齐射与反装甲火力。"
 PWC_TECH_MISSILE_STRIKE_T4: "远程精确打击"
 PWC_TECH_MISSILE_STRIKE_T4_DESC: "投产第四代远程智能火箭炮，把协同目标信息用于地面精确打击。"
 PWC_TECH_MISSILE_T1: "车载火箭炮生产"
 PWC_TECH_MISSILE_T1_DESC: "发展可机动部署的现代车载多管火箭炮，建立使用独立火箭炮装备的齐射火力部队。"
 PWC_TECH_MISSILE_T2: "精确火箭弹药"
 PWC_TECH_MISSILE_T2_DESC: "通过制导弹药和模块化发射系统提高火箭炮的精确打击能力。"
 PWC_TECH_MISSILE_T3: "制导防御武器"
 PWC_TECH_MISSILE_T3_DESC: "发展更先进的制导、传感和发射设备，形成第二代防空与反坦克装备。"
 PWC_TECH_MISSILE_T4: "综合制导武器"
 PWC_TECH_MISSILE_T4_DESC: "将分布式探测、多模制导和反无人机手段整合到新一代防御系统。"
 PWC_TECH_NAVY_CARRIER_T1: "航母与舰载机生产"
 PWC_TECH_NAVY_CARRIER_T1_DESC: "同步建立航母与通用舰载机体的生产能力，配齐本阶段动力、航空武器与任务挂载。"
 PWC_TECH_NAVY_CARRIER_T2: "改进航母与舰载机"
 PWC_TECH_NAVY_CARRIER_T2_DESC: "同代升级航母与通用舰载机体，配套改进动力和航空挂载，使海上航空力量保持完整。"
 PWC_TECH_NAVY_CARRIER_T3: "远洋航母与舰载航空"
 PWC_TECH_NAVY_CARRIER_T3_DESC: "为远洋航母引入滑跃甲板，配套三代舰载机、超视距空空武器及更灵活的任务挂载。"
 PWC_TECH_NAVY_CARRIER_T4: "先进航母与舰载航空"
 PWC_TECH_NAVY_CARRIER_T4_DESC: "结合先进探测配套，为四代航母提供弹射甲板，并同步解锁高阶舰载机与航空武器。"
 PWC_TECH_NAVY_FLEET_T1: "巡洋舰生产"
 PWC_TECH_NAVY_FLEET_T1_DESC: "建立巡洋舰的建造、动力与舰炮配套，形成可持续升级的水面主力舰生产线。"
 PWC_TECH_NAVY_FLEET_T2: "改进巡洋舰"
 PWC_TECH_NAVY_FLEET_T2_DESC: "改进巡洋舰舰体、联合燃气轮机与舰炮，并引入基础声呐配套。"
 PWC_TECH_NAVY_FLEET_T3: "远洋导弹巡洋舰"
 PWC_TECH_NAVY_FLEET_T3_DESC: "为远洋巡洋舰配套综合电力、垂直发射系统、反舰与舰空导弹，强化水面打击和区域防空。"
 PWC_TECH_NAVY_FLEET_T4: "先进综合巡洋舰"
 PWC_TECH_NAVY_FLEET_T4_DESC: "结合先进探测火控，完善高阶巡洋舰、舰炮、垂直发射和声呐配套，延续巡洋舰的水面作战职责。"
 PWC_TECH_NAVY_SUBMARINE_T1: "潜艇生产"
 PWC_TECH_NAVY_SUBMARINE_T1_DESC: "建立潜艇建造、动力配套与艇员组织，使城市能够形成水下作战力量。"
 PWC_TECH_NAVY_SUBMARINE_T2: "改进水下平台"
 PWC_TECH_NAVY_SUBMARINE_T2_DESC: "改进潜艇平台并引入基础声呐配套，使水下力量具备持续换装的条件。"
 PWC_TECH_NAVY_SUBMARINE_T3: "远洋潜航"
 PWC_TECH_NAVY_SUBMARINE_T3_DESC: "发展远洋潜航平台与拖曳声呐，配套反舰导弹，为水下部队提供探测和对海打击配置。"
 PWC_TECH_NAVY_SUBMARINE_T4: "先进水下系统"
 PWC_TECH_NAVY_SUBMARINE_T4_DESC: "将先进声呐与高阶艇体配套，完善潜艇支线的水下任务能力。"
 PWC_TECH_NAVY_T1: "护航舰生产"
 PWC_TECH_NAVY_T1_DESC: "近海舰队围绕港口、沿岸航道与邻近海域组织任务。舰艇设计和岸上保障首先服务于城市能够长期维持的海上行动。"
 PWC_TECH_NAVY_T2: "区域护航与维护"
 PWC_TECH_NAVY_T2_DESC: "区域舰队需要不同舰艇在更广阔的海面上共同工作。动力、探测与武器配套开始围绕连续航行和协同交战进行整体设计。"
 PWC_TECH_NAVY_T3: "远洋驱逐舰"
 PWC_TECH_NAVY_T3_DESC: "将远洋驱逐舰与反舰、区域舰空导弹配套，使舰艇具备明确的对海攻击与舰队防空配置。"
 PWC_TECH_NAVY_T4: "综合护航系统"
 PWC_TECH_NAVY_T4_DESC: "下一代舰队以综合探测、任务系统与舰艇协同为核心。海上的每个平台都需要在更大的行动网络中理解自己的职责。"

 PWC_PROJECT_ACTIVE_PROTECTION: "主动防护体系"
 PWC_PROJECT_ACTIVE_PROTECTION_DESC: "主动防护研究将威胁探测、响应控制和平台安全纳入共同试验。项目关注各环节能否在实际环境中形成一致的防护过程。"
 PWC_PROJECT_ACTIVE_PROTECTION_EFFECTS: "完成后解锁：$PWC_MODULE_TANK_ARMOR_APS$、$PWC_MODULE_TANK_SPECIAL_SOFTKILL$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_EFFICIENT_MARINE_PROPULSION: "安静电力推进"
 PWC_PROJECT_EFFICIENT_MARINE_PROPULSION_DESC: "研制常规电力推进装置，以较低航速和额外造价换取长航程及潜艇静音能力。"
 PWC_PROJECT_EFFICIENT_MARINE_PROPULSION_EFFECTS: "完成后解锁：$PWC_MODULE_NAVY_ENGINE_QUIET_ELECTRIC$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_FIELD_RECOVERY: "装甲抢修车辆"
 PWC_PROJECT_FIELD_RECOVERY_DESC: "研制可随装甲部队进入受火区域的抢修车辆，建立机械牵引、回收和维修班组。"
 PWC_PROJECT_FIELD_RECOVERY_EFFECTS: "完成后解锁：$PWC_EQUIPMENT_ARMORED_RECOVERY_VEHICLE_GEN1$、$PWC_UNIT_ARMORED_RECOVERY$。需正常生产装备，并将支援连编入师。"
 PWC_PROJECT_FLEET_DAMAGE_CONTROL: "舰用自动损管"
 PWC_PROJECT_FLEET_DAMAGE_CONTROL_DESC: "把分舱监测、灭火与排水整合为自动损管模块，占用舰艇辅助设备空间。"
 PWC_PROJECT_FLEET_DAMAGE_CONTROL_EFFECTS: "完成后解锁：$PWC_MODULE_NAVY_AUX_AUTOMATED_DAMAGE_CONTROL$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_FLEXIBLE_MANUFACTURING: "装甲突击工程"
 PWC_PROJECT_FLEXIBLE_MANUFACTURING_DESC: "研制带防护的破障与架桥车辆，为进攻部队提供专门的突击工兵编制。"
 PWC_PROJECT_FLEXIBLE_MANUFACTURING_EFFECTS: "完成后解锁：$PWC_EQUIPMENT_ASSAULT_ENGINEER_VEHICLE_GEN1$、$PWC_UNIT_ASSAULT_ENGINEER$。需正常生产装备，并将支援连编入师。"
 PWC_PROJECT_FLIGHT_TEST_INSTRUMENTATION: "机载海上搜索雷达"
 PWC_PROJECT_FLIGHT_TEST_INSTRUMENTATION_DESC: "研制适合攻击机和无人机的海上搜索航电，提升装机后的水面与潜艇搜索能力。"
 PWC_PROJECT_FLIGHT_TEST_INSTRUMENTATION_EFFECTS: "完成后解锁：$PWC_MODULE_AIR_AVIONICS_MARITIME_RADAR$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_INTEGRATED_FLIGHT_TESTING: "航空自卫干扰系统"
 PWC_PROJECT_INTEGRATED_FLIGHT_TESTING_DESC: "把自卫干扰设备整合为独立吊舱，用机动性、可靠性与航程换取装机生存能力。"
 PWC_PROJECT_INTEGRATED_FLIGHT_TESTING_EFFECTS: "完成后解锁：$PWC_MODULE_AIR_SPECIAL_DEFENSIVE_JAMMER$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_MODULAR_NAVAL_REFIT: "舰载反潜航空"
 PWC_PROJECT_MODULAR_NAVAL_REFIT_DESC: "为驱逐舰与巡洋舰研制反潜直升机保障设施，将搜索和攻击范围延伸到舰外。"
 PWC_PROJECT_MODULAR_NAVAL_REFIT_EFFECTS: "完成后解锁：$PWC_MODULE_NAVY_SPECIAL_HELICOPTER_HANGAR$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_MODULAR_SHIPBUILDING: "无人猎潜任务舱"
 PWC_PROJECT_MODULAR_SHIPBUILDING_DESC: "为水面护航舰研制可收放猎潜设备的任务舱，增加反潜搜索和攻击手段。"
 PWC_PROJECT_MODULAR_SHIPBUILDING_EFFECTS: "完成后解锁：$PWC_MODULE_NAVY_SPECIAL_ASW_MISSION_BAY$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_NAVAL_NETWORK: "海军网络化作战"
 PWC_PROJECT_NAVAL_NETWORK_DESC: "海军网络化作战研究舰艇之间如何交换并理解任务信息。共同的数据、指挥流程与通信安排，使各舰能够围绕同一局势开展行动。"
 PWC_PROJECT_NAVAL_NETWORK_EFFECTS: "完成后解锁：$PWC_MODULE_NAVY_SPECIAL_STEALTH_QUIETING$、$PWC_MODULE_NAVY_SPECIAL_CIC$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_NEXT_GEN_ARMOR: "下一代装甲平台"
 PWC_PROJECT_NEXT_GEN_ARMOR_DESC: "下一代装甲平台项目重新协调车辆结构、武器与车组工作方式。它把成熟技术放入新的整体布局，而不是逐项堆叠互不相干的附件。"
 PWC_PROJECT_NEXT_GEN_ARMOR_EFFECTS: "完成后解锁：$PWC_MODULE_TANK_GUN_140MM_ETC$、$PWC_MODULE_TANK_TURRET_UNMANNED$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_NIGHT_FLIGHT_SYSTEMS: "多模夜航导航"
 PWC_PROJECT_NIGHT_FLIGHT_SYSTEMS_DESC: "将夜间导航和仪表引导整合到专用航电设备，降低装机夜战惩罚并扩展航程。"
 PWC_PROJECT_NIGHT_FLIGHT_SYSTEMS_EFFECTS: "完成后解锁：$PWC_MODULE_AIR_AVIONICS_NIGHT_NAVIGATION$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_PRECISION_PRODUCTION: "自行重迫击炮"
 PWC_PROJECT_PRECISION_PRODUCTION_DESC: "将重迫击炮、快速展开机构和弹药保障整合到专用车辆，形成近距离曲射火力支援。"
 PWC_PROJECT_PRECISION_PRODUCTION_EFFECTS: "完成后解锁：$PWC_EQUIPMENT_HEAVY_MORTAR_GEN1$、$PWC_UNIT_SUPPORT_HEAVY_MORTAR$。需正常生产装备，并将支援连编入师。"
 PWC_PROJECT_STEALTH_TECHNOLOGY: "低可探测技术"
 PWC_PROJECT_STEALTH_TECHNOLOGY_DESC: "低可探测技术研究平台如何向外部环境暴露自身。外形、材料和设备工作方式需要一起考虑，才能形成完整的工程方案。"
 PWC_PROJECT_STEALTH_TECHNOLOGY_EFFECTS: "完成后解锁：$PWC_MODULE_AIR_SPECIAL_STEALTH_SHAPING$。需在设计器安装，再生产或改装装备。"
 PWC_PROJECT_STRATEGIC_UAV: "战略无人系统"
 PWC_PROJECT_STRATEGIC_UAV_DESC: "战略无人系统项目把远程任务、地面控制与信息联系共同规划。飞机只是其中一个部分，完整工程还包括人员组织和长期运行的保障。"
 PWC_PROJECT_STRATEGIC_UAV_EFFECTS: "完成后解锁：$PWC_MODULE_TANK_SPECIAL_RECON_UAV$、$PWC_MODULE_AIR_SPECIAL_UAV_DATALINK$、$PWC_MODULE_AIR_AVIONICS_SENSOR_FUSION$。需在设计器安装，再生产或改装装备。"
 PWC_SF_MARINES_1: "濒海突击作战"
 PWC_SF_MARINES_1_DESC: "以小艇、舟桥与步兵火力协同打开登陆场，持续突破河岸和滨海阵地。"
 PWC_SF_MARINES_2: "远征岸滩保障"
 PWC_SF_MARINES_2_DESC: "以湿地训练、岸滩组织和轻量保障维持登陆部队的秩序，稳固先遣部队夺取的据点。"
 PWC_SF_MOUNTAINEERS_1: "高寒山地作战"
 PWC_SF_MOUNTAINEERS_1_DESC: "通过高寒训练和山口防御形成长期驻守能力，以适应性与韧性控制高地。"
 PWC_SF_MOUNTAINEERS_2: "山地机动作战"
 PWC_SF_MOUNTAINEERS_2_DESC: "以分队攀登和相互掩护越过山口，把复杂地形转化为进攻的接近路线。"
 PWC_SF_PARATROOPERS_1: "垂直突击"
 PWC_SF_PARATROOPERS_1_DESC: "以精确空投和迅速集结抢占纵深节点，把落地后的短暂窗口转化为局部主动。"
 PWC_SF_PARATROOPERS_2: "空降持续作战"
 PWC_SF_PARATROOPERS_2_DESC: "让分散着陆的部队尽快恢复联络，以轻装保障和据点防御等待后续兵力会合。"
 PWC_SF_RANGERS_1: "林地袭扰"
 PWC_SF_RANGERS_1_DESC: "把林地侦察、伏击和短促突击结合起来，依靠隐蔽接近与机动脱离维持压力。"
 PWC_SF_RANGERS_2: "丛林渗透"
 PWC_SF_RANGERS_2_DESC: "以热带生存和小队联络保障长程渗透，在道路稀少、植被茂密的战区持续行动。"
 PWC_TECH0_BASIC_INDUSTRY: "基础工业"
 PWC_TECH0_BASIC_INDUSTRY_DESC: "基础工业为城市提供修理、加工与维持生产的常用手段。它并不追求复杂工艺，而是确保日常制造有能够依靠的技术根基。"
 PWC_TECH0_BASIC_INFANTRY: "基础步兵装备"
 PWC_TECH0_BASIC_INFANTRY_DESC: "开局已掌握现役突击步枪、防护装具和基础步兵编制的生产与使用规范。"
 PWC_TECH0_COMMUNICATIONS: "基础通信"
 PWC_TECH0_COMMUNICATIONS_DESC: "基础通信把相互分离的岗位和单位连接起来。明确的联络程序与可用的设备，使消息不再完全依赖临时传递。"
 PWC_TECH0_ENGINEERS: "基础工兵装备"
 PWC_TECH0_ENGINEERS_DESC: "工兵的基础工具用于修筑、拆障与处理战场上的工程事务。它们让部队能够主动应对道路、阵地和地形带来的实际问题。"
 PWC_TECH0_TRANSPORT: "基础运输装备"
 PWC_TECH0_TRANSPORT_DESC: "基础运输装备承担人员与物资的日常移动。城市通过统一车辆使用和保障规范，为更大规模的调度建立起点。"
 PWC_TECH_AIR_STRIKE_T1: "远程轰炸机生产"
 PWC_TECH_AIR_STRIKE_T1_DESC: "建立远程轰炸机的制造和联队组织，为持续发展战略航空提供起点。"
 PWC_TECH_AIR_STRIKE_T2: "改进远程航空"
 PWC_TECH_AIR_STRIKE_T2_DESC: "改进远程机体的结构与任务系统，形成可继续升级的轰炸机生产型号。"
 PWC_TECH_AIR_STRIKE_T3: "空中加油与续航"
 PWC_TECH_AIR_STRIKE_T3_DESC: "为空中加油和额外燃油携带提供配套接口，扩大远程航空设计的续航选择。"
 PWC_TECH_AIR_STRIKE_T4: "远程打击平台"
 PWC_TECH_AIR_STRIKE_T4_DESC: "完善大型远程机体的整合与制造能力，配套空射巡航导弹，拓展轰炸机的任务挂载。"
 PWC_TECH_AIR_SUPPORT_T1: "对地支援航空"
 PWC_TECH_AIR_SUPPORT_T1_DESC: "建立攻击机与无人机的生产准备，并形成能够承担近距支援任务的航空部队。"
 PWC_TECH_AIR_SUPPORT_T2: "改进攻击与无人机"
 PWC_TECH_AIR_SUPPORT_T2_DESC: "改进攻击平台并扩展机炮挂载选择，使对地支援航空具备更多可生产的配置。"
 PWC_TECH_AIR_SUPPORT_T3: "战术航空载荷"
 PWC_TECH_AIR_SUPPORT_T3_DESC: "围绕任务载荷改进攻击机和无人平台，为更复杂的战术航空配置提供机体与挂载基础。"
 PWC_TECH_AIR_SUPPORT_T4: "协同支援航空"
 PWC_TECH_AIR_SUPPORT_T4_DESC: "以先进电子配套和防区外弹药完善对地支援，并为无人机提供空射巡航导弹挂载。"
 PWC_TECH_AIR_T1: "制空机生产"
 PWC_TECH_AIR_T1_DESC: "航空工业首先需要建立机体、动力与飞行保障的共同技术基础。能够稳定制造、维护并运用飞机，才是城市航空力量的起点。"
 PWC_TECH_AIR_T2: "改进制空机"
 PWC_TECH_AIR_T2_DESC: "新的作战飞机将动力、航电与武器挂载协调起来。设计人员开始从完整任务而非单一部件出发，处理飞机在实际运用中的矛盾。"
 PWC_TECH_AIR_T3: "先进制空平台"
 PWC_TECH_AIR_T3_DESC: "将中距空空导弹与先进制空机体配套，把目标信息、火控和武器运用连成完整的空中交战过程。"
 PWC_TECH_AIR_T4: "综合制空系统"
 PWC_TECH_AIR_T4_DESC: "先进制空机体与新一代空空导弹协同设计，完善战斗机的空中交战配置。"
 PWC_TECH_ARMY_AMPHIBIOUS_T1: "现代两栖坦克底盘"
 PWC_TECH_ARMY_AMPHIBIOUS_T1_DESC: "成熟浮航车体与常规光电观瞄组成可靠的登陆平台。"
 PWC_TECH_ARMY_AMPHIBIOUS_T2: "模块化两栖坦克底盘"
 PWC_TECH_ARMY_AMPHIBIOUS_T2_DESC: "模块化轻型防护与改进火控提高登陆后的持续作战能力。"
 PWC_TECH_ARMY_AMPHIBIOUS_T3: "智能防护两栖坦克底盘"
 PWC_TECH_ARMY_AMPHIBIOUS_T3_DESC: "一体化传感器与主动防护改善复杂岸滩环境中的生存和协同。"
 PWC_TECH_ARMY_AMPHIBIOUS_T4: "无人协同两栖坦克底盘"
 PWC_TECH_ARMY_AMPHIBIOUS_T4_DESC: "低轮廓无人炮塔与协同感知探索未来两栖装甲的作战方式。"
 PWC_TECH_ARMY_FIREPOWER_T1: "现代自行榴弹炮生产"
 PWC_TECH_ARMY_FIREPOWER_T1_DESC: "把现代榴弹炮、车辆底盘和数字火控整合为可生产的自行火炮，建立线列与支援炮兵。"
 PWC_TECH_ARMY_FIREPOWER_T2: "弹道计算与炮兵协同"
 PWC_TECH_ARMY_FIREPOWER_T2_DESC: "投产第二代自动装填自行榴弹炮，并统一弹道计算、目标通报和阵地协同。"
 PWC_TECH_ARMY_FIREPOWER_T3: "自动装填与精确弹药"
 PWC_TECH_ARMY_FIREPOWER_T3_DESC: "以无人炮塔、自动装填和精确弹药发展第三代自行榴弹炮，提高持续火力与反应能力。"
 PWC_TECH_ARMY_FIREPOWER_T4: "无人化炮兵协同"
 PWC_TECH_ARMY_FIREPOWER_T4_DESC: "将长身管火炮、自动化弹药处理和协同火控整合到第四代无人火炮平台。"
 PWC_TECH_ARMY_INFANTRY_T1: "当代步兵与警备编制"
 PWC_TECH_ARMY_INFANTRY_T1_DESC: "改进单兵武器体系，建立宪兵和总部警备编制。"
 PWC_TECH_ARMY_INFANTRY_T2: "模块化单兵武器"
 PWC_TECH_ARMY_INFANTRY_T2_DESC: "通过统一接口与模块化附件改进单兵武器，让瞄具、防护和班组火力形成可靠配套。"
 PWC_TECH_ARMY_INFANTRY_T3: "智能瞄准与综合防护"
 PWC_TECH_ARMY_INFANTRY_T3_DESC: "将智能瞄准、目标信息和综合防护整合到单兵装备中，提高复杂战场上的作战能力。"
 PWC_TECH_ARMY_INFANTRY_T4: "无人协同单兵系统"
 PWC_TECH_ARMY_INFANTRY_T4_DESC: "将集成火控武器与分布式目标信息整合，使班组更快组织精确火力。"
 PWC_TECH_ARMY_MOBILITY_T1: "轻装甲生产"
 PWC_TECH_ARMY_MOBILITY_T1_DESC: "建立轻型装甲与第一代履带步兵战车生产能力，形成轻装甲和机械化步兵编制。"
 PWC_TECH_ARMY_MOBILITY_T2: "机械化运输"
 PWC_TECH_ARMY_MOBILITY_T2_DESC: "投产第二代模块化轮式步兵战车和改进轻型底盘，为步兵提供伴随装甲部队的机动与防护。"
 PWC_TECH_ARMY_MOBILITY_T3: "机动底盘与动力"
 PWC_TECH_ARMY_MOBILITY_T3_DESC: "改进动力、悬挂和工程附件，使轻装甲与机械化运输获得进一步升级的基础。"
 PWC_TECH_ARMY_MOBILITY_T4: "先进机动系统"
 PWC_TECH_ARMY_MOBILITY_T4_DESC: "将混合动力与自适应悬挂用于机动平台，完善高阶轻装甲和机械化装备。"
 PWC_TECH_ARMY_T1: "现役主战与突击装甲"
 PWC_TECH_ARMY_T1_DESC: "直接以滑膛炮、复合装甲、热成像和数字通信建立现代主战与重装平台，并发展导弹歼击车。"
 PWC_TECH_ARMY_T2: "装甲火力与防护改型"
 PWC_TECH_ARMY_T2_DESC: "通过模块化防护、强化火炮和非视距反坦克武器，发展用途清晰的装甲改型。"
 PWC_TECH_ARMY_T3: "智能火控与复合防护"
 PWC_TECH_ARMY_T3_DESC: "围绕智能火控、先进反应装甲和多模导弹完善平台，强化协同与目标处理能力。"
 PWC_TECH_ARMY_T4: "无人协同陆战平台"
 PWC_TECH_ARMY_T4_DESC: "为无人协同和下一代动力预留整合空间；前沿主炮、无人炮塔与主动防护由对应特殊项目提供。"

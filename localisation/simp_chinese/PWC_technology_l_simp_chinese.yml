 PWC_TECH_SF_AIRBORNE_T4_DESC: "以运输机、伞降器材与集结训练组织垂直投送；空降仍需满足原生制空与航程条件。"
 PWC_TECH_SF_MARINES_T1: "现代海军陆战队"
 PWC_TECH_SF_MARINES_T1_DESC: "围绕河流、沼泽和登陆场组织步兵突击，在舰岸转换中保持作战秩序。"
 PWC_TECH_SF_MARINES_T2: "濒海突击编组"
 PWC_TECH_SF_MARINES_T2_DESC: "围绕河流、沼泽和登陆场组织步兵突击，在舰岸转换中保持作战秩序。"
 PWC_TECH_SF_MARINES_T3: "舰岸协同作战"
 PWC_TECH_SF_MARINES_T3_DESC: "围绕河流、沼泽和登陆场组织步兵突击，在舰岸转换中保持作战秩序。"
 PWC_TECH_SF_MARINES_T4: "远征登陆保障"
 PWC_TECH_SF_MARINES_T4_DESC: "围绕河流、沼泽和登陆场组织步兵突击，在舰岸转换中保持作战秩序。"
 PWC_TECH_SF_MOUNTAIN_T1: "现代山地部队"
 PWC_TECH_SF_MOUNTAIN_T1_DESC: "以专业登山训练和轻装编组克服山地与丘陵，降低高原行动对道路的依赖。"
 PWC_TECH_SF_MOUNTAIN_T2: "高寒生存与攀登"
 PWC_TECH_SF_MOUNTAIN_T2_DESC: "以专业登山训练和轻装编组克服山地与丘陵，降低高原行动对道路的依赖。"
 PWC_TECH_SF_MOUNTAIN_T3: "山地分队协同"
 PWC_TECH_SF_MOUNTAIN_T3_DESC: "以专业登山训练和轻装编组克服山地与丘陵，降低高原行动对道路的依赖。"
 PWC_TECH_SF_MOUNTAIN_T4: "全天候高原作战"
 PWC_TECH_SF_MOUNTAIN_T4_DESC: "以专业登山训练和轻装编组克服山地与丘陵，降低高原行动对道路的依赖。"
 PWC_TECH_SF_RANGERS_T1: "现代游骑兵"
 PWC_TECH_SF_RANGERS_T1_DESC: "以林地侦察、丛林生存和小队协同支撑渗透行动，在复杂植被中保持机动。"
 PWC_TECH_SF_RANGERS_T2: "林地侦察与伏击"
 PWC_TECH_SF_RANGERS_T2_DESC: "以林地侦察、丛林生存和小队协同支撑渗透行动，在复杂植被中保持机动。"
 PWC_TECH_SF_RANGERS_T3: "丛林分队协同"
 PWC_TECH_SF_RANGERS_T3_DESC: "以林地侦察、丛林生存和小队协同支撑渗透行动，在复杂植被中保持机动。"
 PWC_TECH_SF_RANGERS_T4: "纵深渗透保障"
 PWC_TECH_SF_RANGERS_T4_DESC: "以林地侦察、丛林生存和小队协同支撑渗透行动，在复杂植被中保持机动。"
 PWC_TECH_TIER_T1: "一阶"
 PWC_TECH_TIER_T2: "二阶"
 PWC_TECH_TIER_T3: "三阶"
 PWC_TECH_TIER_T4: "四阶"
 PWC_TEMPLATE_ARMORED_18W: "轻编装甲师"
 PWC_TEMPLATE_ARMORED_18W_DESC: "以三个现代坦克营和六个机械化步兵营组成十八宽装甲师。机械化步兵承担持久作战，坦克提供突击火力，适合逐步建立装甲力量。"
 PWC_TEMPLATE_ARMORED_18W_EFFECTS: "18 宽师型：$PWC_UNIT_TANK$ x3、$PWC_UNIT_MECHANIZED$ x6、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_RECON$ x1、$PWC_UNIT_SIGNAL$ x1、$PWC_UNIT_REGIMENTAL_TANK_DESTROYER$ x1、$PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INDUSTRY$、$PWC_TECH0_COMMUNICATIONS$、$PWC_TECH0_ENGINEERS$、$PWC_TECH0_TRANSPORT$、$PWC_TECH_ARMY_MOBILITY_T1$、$PWC_TECH_ARMY_T1$。"
 PWC_TEMPLATE_ARMORED_36W: "装甲师"
 PWC_TEMPLATE_ARMORED_36W_DESC: "这套装甲编制把坦克与配套部队组织为共同的作战力量。装甲行动需要步兵、支援与保障的衔接，才能超越单一车辆的能力。"
 PWC_TEMPLATE_ARMORED_36W_EFFECTS: "36 宽师型：$PWC_UNIT_TANK$ x8、$PWC_UNIT_HEAVY_TANK$ x2、$PWC_UNIT_TANK_DESTROYER$ x2、$PWC_UNIT_MECHANIZED$ x6、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_SIGNAL$ x1、$PWC_UNIT_LOGISTICS$ x1、$PWC_UNIT_MAINTENANCE$ x1、$PWC_UNIT_REGIMENTAL_TANK_DESTROYER$ x1、$PWC_UNIT_REGIMENTAL_ARMORED_ANTI_AIR$ x1、$PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INDUSTRY$、$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH0_COMMUNICATIONS$、$PWC_TECH0_ENGINEERS$、$PWC_TECH0_TRANSPORT$、$PWC_TECH_ARMY_MOBILITY_T2$、$PWC_TECH_ARMY_T1$、$PWC_TECH_ARMY_T2$、$PWC_TECH_LOGISTICS_SUPPORT_T1$、$PWC_TECH_LOGISTICS_T1$。"
 PWC_TEMPLATE_CITY_GARRISON_12W: "城防师"
 PWC_TEMPLATE_CITY_GARRISON_12W_DESC: "步兵与宪兵共同承担占领区驻军任务。将这套模板指定为占领驻军，可利用宪兵的镇压能力维持占领秩序。"
 PWC_TEMPLATE_CITY_GARRISON_12W_EFFECTS: "12 宽师型：$PWC_UNIT_INFANTRY$ x6、$PWC_UNIT_MILITARY_POLICE$ x1。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH_ARMY_INFANTRY_T1$。"
 PWC_TEMPLATE_INFANTRY_12W: "步兵师"
 PWC_TEMPLATE_INFANTRY_12W_DESC: "这套步兵师编制以普通步兵和基本支援为核心，适合建立容易理解和维持的地面部队。训练与保障围绕共同的基础组织展开。"
 PWC_TEMPLATE_INFANTRY_12W_EFFECTS: "12 宽师型：$PWC_UNIT_INFANTRY$ x6、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_REGIMENTAL_FIRE_SUPPORT$ x2。开局每座城市部署 5 个。前置科技：$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH0_ENGINEERS$。"
 PWC_TEMPLATE_MOBILE_18W: "机动师"
 PWC_TEMPLATE_MOBILE_18W_DESC: "这套机动编制把运输、步兵行动与支援组织联系起来。它要求各单位在转移与展开时保持共同节奏，而不只是拥有车辆。"
 PWC_TEMPLATE_MOBILE_18W_EFFECTS: "18 宽师型：$PWC_UNIT_MOTORIZED$ x6、$PWC_UNIT_ARTILLERY$ x2、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_RECON$ x1、$PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH0_COMMUNICATIONS$、$PWC_TECH0_ENGINEERS$、$PWC_TECH0_TRANSPORT$、$PWC_TECH_ARMY_FIREPOWER_T1$。"
 PWC_TEMPLATE_MOUNTAIN_18W: "山地师"
 PWC_TEMPLATE_MOUNTAIN_18W_DESC: "这套山地编制以适应崎岖地形的部队为基础。行动路线、保障安排与单位协作都需要考虑地形对常规组织方式的限制。"
 PWC_TEMPLATE_MOUNTAIN_18W_EFFECTS: "18 宽师型：$PWC_UNIT_MOUNTAIN$ x9、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_RECON$ x1、$PWC_UNIT_REGIMENTAL_FIRE_SUPPORT$ x2、$PWC_UNIT_REGIMENTAL_ANTI_TANK$ x1。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INDUSTRY$、$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH0_COMMUNICATIONS$、$PWC_TECH0_ENGINEERS$、$PWC_TECH_SF_MOUNTAIN_T1$。"
 PWC_UNIT_ANTI_AIR: "机动防空导弹营"
 PWC_UNIT_ANTI_AIR_DESC: "野战防空营为地面部队组织空中警戒与对空射击。观察报告、武器操作和行军保障共同构成随队防空工作。"
 PWC_UNIT_ANTI_AIR_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_AIR$ x36。"
 PWC_UNIT_ANTI_TANK: "反坦克导弹营"
 PWC_UNIT_ANTI_TANK_DESC: "反坦克营专门应对敌方装甲目标。武器、观察与阵地组织需要紧密配合，使部队能够在共同指挥下执行任务。"
 PWC_UNIT_ANTI_TANK_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_TANK$ x36。"
 PWC_UNIT_ARMORED_RECOVERY: "装甲抢修连"
 PWC_UNIT_ARMORED_RECOVERY_DESC: "以专用抢修车回收战场装备并帮助部队恢复，可靠性维护较弱，且增加车辆与燃油需求。"
 PWC_UNIT_ARMORED_RECOVERY_EFFECTS: "装备需求：$PWC_EQUIPMENT_ARMORED_RECOVERY_VEHICLE$ x15、$PWC_EQUIPMENT_SUPPORT$ x15。由 $PWC_PROJECT_FIELD_RECOVERY$ 解锁。与 $PWC_UNIT_MAINTENANCE$ 共用支援类型，只能择一编入。"
 PWC_UNIT_ARTILLERY: "自行榴弹炮营"
 PWC_UNIT_ARTILLERY_DESC: "野战炮兵营把火炮、观察和射击指挥组成共同的支援单位。它通过明确的通信与阵地工作，把火力纳入地面部队的行动。"
 PWC_UNIT_ARTILLERY_EFFECTS: "装备需求：$PWC_EQUIPMENT_ARTILLERY$ x24。"
 PWC_UNIT_ASSAULT_ENGINEER: "突击工兵连"
 PWC_UNIT_ASSAULT_ENGINEER_DESC: "专长攻坚、渡河和城区突击，堑壕能力较弱；需要突击工程车、支援器材和燃油。"
 PWC_UNIT_ASSAULT_ENGINEER_EFFECTS: "装备需求：$PWC_EQUIPMENT_ASSAULT_ENGINEER_VEHICLE$ x12、$PWC_EQUIPMENT_SUPPORT$ x20、$PWC_EQUIPMENT_INFANTRY$ x10。由 $PWC_PROJECT_FLEXIBLE_MANUFACTURING$ 解锁。与 $PWC_UNIT_ENGINEER$ 共用支援类型，只能择一编入。"
 PWC_UNIT_BOMBER: "轰炸机联队"
 PWC_UNIT_BOMBER_DESC: "轰炸机联队把任务规划、编队飞行和载荷准备结合起来。其行动依赖从地面整备到任务返回的完整组织。"
 PWC_UNIT_BOMBER_EFFECTS: "装备需求：$PWC_PLATFORM_BOMBER$ x1。"
 PWC_UNIT_CARRIER: "航空母舰"
 PWC_UNIT_CARRIER_DESC: "航空母舰把机场的主要工作带到海上。舰船航行、飞行甲板与航空保障必须共同组织，才能让舰载机持续承担任务。"
 PWC_UNIT_CARRIER_EFFECTS: "装备需求：$PWC_PLATFORM_CARRIER$ x1。"
 PWC_UNIT_CAS: "攻击机联队"
 PWC_UNIT_CAS_DESC: "攻击机联队围绕空地配合组织飞行与保障。地面态势、目标联络和出动准备需要在联队内部形成一致的工作流程。"
 PWC_UNIT_CAS_EFFECTS: "装备需求：$PWC_PLATFORM_CAS$ x1。"
 PWC_UNIT_CRUISER: "巡洋舰"

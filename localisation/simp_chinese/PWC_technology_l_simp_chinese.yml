 PWC_MODULE_TANK_GUN_105MM: "105mm 低后坐力线膛炮"
 PWC_MODULE_TANK_GUN_105MM_DESC: "线膛坦克炮以成熟的炮管与弹药技术承担直接射击任务。它代表了易于组织制造与维护的常规坦克主炮方案。"

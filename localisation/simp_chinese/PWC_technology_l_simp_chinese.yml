 PWC_MODULE_AIR_SPECIAL_LO_COATING: "宽频隐身涂层"
 PWC_MODULE_AIR_SPECIAL_LO_COATING_DESC: "低可探测涂层是机体表面处理的一部分。材料施工、表面状态和后续维护需要遵循统一规范，才能与飞机整体设计相互配合。"
 PWC_MODULE_AIR_SPECIAL_LO_COATING_EFFECTS: "分组：低可探测涂层。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$。同组最多安装 1 个。"
 PWC_MODULE_AIR_SPECIAL_STEALTH_SHAPING: "低可探测外形处理"
 PWC_MODULE_AIR_SPECIAL_STEALTH_SHAPING_DESC: "低可探测外形把机体几何与任务设备布置共同纳入设计。它要求整个飞机协调处理外形，而不是只更换某一块外板。"
 PWC_MODULE_AIR_SPECIAL_STEALTH_SHAPING_EFFECTS: "分组：低可探测外形。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$。同组最多安装 1 个。"
 PWC_MODULE_AIR_SPECIAL_UAV_DATALINK: "无人机数据链终端"

 PWC_MIO_ARMOR_CHAIN_B_3: "防护专精 III"
 PWC_MIO_ARMOR_CHAIN_B_3_DESC: "围绕防护专精进行连续的整机验证，协调局部改良与平台整体的使用条件。"

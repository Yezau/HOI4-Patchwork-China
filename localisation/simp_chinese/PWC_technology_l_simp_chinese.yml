 PWC_MODULE_AIR_SPECIAL_AAR_PROBE: "空中加油探头"
 PWC_MODULE_AIR_SPECIAL_AAR_PROBE_DESC: "空中加油探头为飞机与加油设备之间建立专门的连接。燃料系统、飞行操作与配套训练共同构成这种保障方式。"
 PWC_MODULE_AIR_SPECIAL_AAR_PROBE_EFFECTS: "分组：空中加油设备。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_SPECIAL_COMPOSITE_STRUCTURE: "复合材料机体结构"
 PWC_MODULE_AIR_SPECIAL_COMPOSITE_STRUCTURE_DESC: "复合材料结构把不同材料的特点应用于机体设计。连接、成型与检验工艺共同决定这些结构如何进入可靠的航空制造。"
 PWC_MODULE_AIR_SPECIAL_COMPOSITE_STRUCTURE_EFFECTS: "分组：机体结构材料。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_SPECIAL_DEFENSIVE_JAMMER: "自卫干扰吊舱"
 PWC_MODULE_AIR_SPECIAL_DEFENSIVE_JAMMER_DESC: "提升本机防御，消耗辅助槽位；额外设备降低机动性、航程和可靠性。"

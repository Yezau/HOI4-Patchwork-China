 PWC_MIO_AIR_SUPERIORITY_CHAIN_B_4_EFFECTS: "专精链特质：机动 +3%。"
 PWC_MIO_AIR_SUPERIORITY_DESC: "制空战机联合体围绕空战平台组织航空企业。机体、飞行控制与机载武器通过共同的研制工作形成相互配套的技术体系。"
 PWC_MIO_AIR_SUPERIORITY_EFFECTS: "初始特质提供机动 +3%；两条专精路线互斥，选定一路后连同公共分支共可解锁 12 项特质。特质点随组织成长获得，可在 7 条政策中择一执行。"
 PWC_MIO_AIR_SUPERIORITY_INITIAL: "制空战机工程"
 PWC_MIO_AIR_SUPERIORITY_INITIAL_DESC: "制空战机工程把机体、武器与飞行任务作为整体协调。航空企业通过共同的试验和设计语言组织空战平台的发展。"
 PWC_MIO_AIR_SUPERIORITY_INITIAL_EFFECTS: "初始特质：机动 +3%。"
 PWC_MIO_AIR_SUPERIORITY_POLICY_COST: "远程护航配置"
 PWC_MIO_AIR_SUPERIORITY_POLICY_COST_DESC: "优先保障远距离护航与空中生存，接受格斗机动下降以扩大覆盖范围。"
 PWC_MIO_AIR_SUPERIORITY_POLICY_COST_EFFECTS: "组织方针（50 政治点，180 天冷却，同时仅一个生效）：机构达到 10 级解锁。航程 +20%、空中防御 +5%、机动 -6%。"
 PWC_MIO_AIR_SUPERIORITY_POLICY_INNOVATION: "高速截击火控"
 PWC_MIO_AIR_SUPERIORITY_POLICY_INNOVATION_DESC: "投入更高制造成本，强化截击火力与速度，用于争夺重点空域。"
 PWC_MIO_AIR_SUPERIORITY_POLICY_INNOVATION_EFFECTS: "组织方针（50 政治点，180 天冷却，同时仅一个生效）：机构达到 10 级解锁。对空攻击 +12%、速度 +5%、生产成本 +6%。"
 PWC_MIO_AIR_SUPERIORITY_POLICY_PRODUCTION: "简化战斗机批产"
 PWC_MIO_AIR_SUPERIORITY_POLICY_PRODUCTION_DESC: "简化战斗机制造以扩大数量，接受机动性能下降，适合补充大规模制空机队。"
 PWC_MIO_AIR_SUPERIORITY_POLICY_PRODUCTION_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。生产成本 -10%、机动 -5%。"
 PWC_MIO_AIR_SUPERIORITY_POLICY_QUALITY: "格斗性能方案"
 PWC_MIO_AIR_SUPERIORITY_POLICY_QUALITY_DESC: "将机体资源集中于格斗机动与火力，牺牲部分航程以争夺近距离制空权。"
 PWC_MIO_AIR_SUPERIORITY_POLICY_QUALITY_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。机动 +10%、对空攻击 +5%、航程 -9%。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_1: "机体材料套裁"
 PWC_MIO_AIR_SUPERIORITY_SIDE_1_DESC: "机体材料套裁按照结构与制造顺序安排材料准备。不同板件与部件在进入装配前，就遵循一致的编号和加工记录。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_1_EFFECTS: "侧支特质：生产成本 -3%。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_2: "巡航燃油系统"
 PWC_MIO_AIR_SUPERIORITY_SIDE_2_DESC: "巡航燃油系统把储存、输送和飞行任务联系起来。机体空间与动力需求需要在共同的航空保障方案中安排。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_2_EFFECTS: "侧支特质：航程 +3%。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_3: "飞行控制冗余"
 PWC_MIO_AIR_SUPERIORITY_SIDE_3_DESC: "飞行控制冗余为重要控制环节安排相互配合的设备。工程人员需要理解各部分失去正常状态时，整个系统如何继续被管理。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_3_EFFECTS: "侧支特质：可靠性 +3%。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_4: "航电升级接口"
 PWC_MIO_AIR_SUPERIORITY_SIDE_4_DESC: "航电升级接口为设备更换和后续整合建立明确规则。新的任务器材能够沿共同标准接入，而不必重新组织全部机上连接。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_4_EFFECTS: "侧支特质：改装速度 +6%。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_5: "座舱与油箱防护"
 PWC_MIO_AIR_SUPERIORITY_SIDE_5_DESC: "座舱与油箱防护把人员工作区和燃料布置作为专门对象。结构安排与维修要求共同进入战机的整体设计。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_5_EFFECTS: "交叉特质：空中防御 +3%。需先解锁 $PWC_MIO_AIR_SUPERIORITY_CHAIN_A_2$、$PWC_MIO_AIR_SUPERIORITY_CHAIN_B_2$ 之一。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_6: "风洞试验中心"
 PWC_MIO_AIR_SUPERIORITY_SIDE_6_DESC: "风洞试验中心为气动研究提供稳定的观察条件。飞机外形的讨论由此能够依靠共同的试验资料，而不是各自的估计。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_6_EFFECTS: "交叉特质：组织研发加成 +3%。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_7: "空战系统整合"
 PWC_MIO_AIR_SUPERIORITY_SIDE_7_DESC: "空战系统整合把传感器、机组操作与武器使用放在同一流程中。平台的任务能力来自各部分的配合，而非设备清单的简单相加。"
 PWC_MIO_AIR_SUPERIORITY_SIDE_7_EFFECTS: "交叉特质：对空攻击 +3%、机动 +3%。"

 PWC_MIO_ARMOR_DESC: "装甲工业联合体协调车辆、装甲与武器企业的共同工程。它把零件制造、总装和部队使用经验连接为持续发展的装甲产业。"
 PWC_MIO_ARMOR_EFFECTS: "初始特质提供装甲 +3%、可靠性 +3%；两条专精路线互斥，选定一路后连同公共分支共可解锁 12 项特质。特质点随组织成长获得，可在 7 条政策中择一执行。"
 PWC_MIO_ARMOR_INITIAL: "装甲工程体系"
 PWC_MIO_ARMOR_INITIAL_DESC: "装甲工程把车体结构、防护材料与车辆保障放在同一套设计规范中。共同的技术基础使不同厂家能够理解彼此的接口与责任。"
 PWC_MIO_ARMOR_INITIAL_EFFECTS: "初始特质：装甲 +3%、可靠性 +3%。"
 PWC_MIO_ARMOR_POLICY_COST: "轻装机动方案"
 PWC_MIO_ARMOR_POLICY_COST_DESC: "轻型坦克优先考虑机动与扩编成本，削减装甲重量，用于快速机动而非正面硬抗。"
 PWC_MIO_ARMOR_POLICY_COST_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。装备加成仅适用于$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_AMPHIBIOUS_TANK$。速度 +10%、生产成本 -6%、装甲 -9%。"
 PWC_MIO_ARMOR_POLICY_INNOVATION: "反装甲火控体系"
 PWC_MIO_ARMOR_POLICY_INNOVATION_DESC: "为主战坦克和反坦克导弹车投入专用火控，提升对装甲目标的杀伤与穿透能力。"
 PWC_MIO_ARMOR_POLICY_INNOVATION_EFFECTS: "组织方针（50 政治点，180 天冷却，同时仅一个生效）：机构达到 10 级解锁。装备加成仅适用于$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。硬杀伤 +10%、穿甲 +10%、生产成本 +5%。"
 PWC_MIO_ARMOR_POLICY_PRODUCTION: "底盘换装流水线"
 PWC_MIO_ARMOR_POLICY_PRODUCTION_DESC: "为新旧底盘的换装与改装组织专用工序，缩短产线磨合，适合集中更新装甲装备。"
 PWC_MIO_ARMOR_POLICY_PRODUCTION_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。生产效率增长 +15%、改装速度 +20%。"
 PWC_MIO_ARMOR_POLICY_QUALITY: "重装突击方案"
 PWC_MIO_ARMOR_POLICY_QUALITY_DESC: "为主战与重装坦克加强防护和突击能力，接受机动速度降低，集中承担突破任务。"
 PWC_MIO_ARMOR_POLICY_QUALITY_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。装备加成仅适用于$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$。装甲 +9%、突破 +6%、速度 -5%。"
 PWC_MIO_ARMOR_SIDE_1: "装甲板套裁"
 PWC_MIO_ARMOR_SIDE_1_DESC: "装甲板套裁根据车体结构统一安排钢板的切割与分配。材料准备从零散下料转变为能够追踪的共同工序。"
 PWC_MIO_ARMOR_SIDE_1_EFFECTS: "侧支特质：生产成本 -3%。"
 PWC_MIO_ARMOR_SIDE_2: "底盘流水线"
 PWC_MIO_ARMOR_SIDE_2_DESC: "底盘流水线将结构加工、部件安装与检查交接连接起来。每个工位的工作都为后续装配准备明确的条件。"

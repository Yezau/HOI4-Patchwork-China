 PWC_PLATFORM_UAV: "无人机"
 PWC_PLATFORM_UAV_DESC: "无人机自身不载乘员，人的位置在地面：操作手、地面站与数据链编制随联队一同部署。传感器、任务载荷和数据联系共同决定这种飞机如何完成指定工作。"

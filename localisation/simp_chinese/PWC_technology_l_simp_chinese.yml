 PWC_MODULE_TANK_GUN_125MM: "125mm 高膛压精确火炮"
 PWC_MODULE_TANK_GUN_125MM_DESC: "高膛压滑膛炮以炮管、闭锁和弹药的整体设计承担重型直射任务。它要求车辆在武器安装与车组操作之间作出完整安排。"

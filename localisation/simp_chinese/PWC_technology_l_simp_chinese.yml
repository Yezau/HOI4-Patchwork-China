 PWC_MIO_LOGISTICS_POLICY_INNOVATION_EFFECTS: "组织方针（50 政治点，180 天冷却，同时仅一个生效）：机构达到 10 级解锁。装备加成仅适用于$PWC_EQUIPMENT_MECHANIZED$、$PWC_EQUIPMENT_ASSAULT_ENGINEER_VEHICLE$、$PWC_EQUIPMENT_ARMORED_RECOVERY_VEHICLE$、$PWC_EQUIPMENT_AMPHIBIOUS_MECHANIZED$。装甲 +10%、防御 +9%、生产成本 +6%。"

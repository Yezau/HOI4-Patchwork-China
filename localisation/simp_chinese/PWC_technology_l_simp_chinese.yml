 PWC_MODULE_NAVY_SONAR_TOWED_ARRAY_EFFECTS: "分组：声呐系统。可装：$PWC_PLATFORM_DESTROYER$、$PWC_PLATFORM_CRUISER$、$PWC_PLATFORM_SUBMARINE$。同组最多安装 1 个。"
 PWC_MODULE_NAVY_SPECIAL_ASW_MISSION_BAY: "无人猎潜任务舱"
 PWC_MODULE_NAVY_SPECIAL_ASW_MISSION_BAY_DESC: "携带猎潜搜索与攻击设备，增加本舰反潜能力；占用任务设备位置并降低航速。"
 PWC_MODULE_NAVY_SPECIAL_ASW_MISSION_BAY_EFFECTS: "分组：猎潜任务设备。可装：$PWC_PLATFORM_DESTROYER$、$PWC_PLATFORM_CRUISER$。同组最多安装 1 个。"
 PWC_MODULE_NAVY_SPECIAL_CIC: "自动化作战情报中心"
 PWC_MODULE_NAVY_SPECIAL_CIC_DESC: "自动化作战情报中心汇集舰上各类探测和任务消息。它让值班人员围绕共同的态势图景协调观察、判断与指挥工作。"
 PWC_MODULE_NAVY_SPECIAL_CIC_EFFECTS: "分组：作战情报系统。可装：$PWC_PLATFORM_DESTROYER$、$PWC_PLATFORM_CRUISER$、$PWC_PLATFORM_CARRIER$、$PWC_PLATFORM_SUBMARINE$。同组最多安装 1 个。"
 PWC_MODULE_NAVY_SPECIAL_COMPOSITE_SUPERSTRUCTURE: "复合材料上层建筑"
 PWC_MODULE_NAVY_SPECIAL_COMPOSITE_SUPERSTRUCTURE_DESC: "复合材料上层建筑把材料工程引入舰体上部结构。设备布置、结构连接与维护方法需要与传统船体形成完整配套。"
 PWC_MODULE_NAVY_SPECIAL_COMPOSITE_SUPERSTRUCTURE_EFFECTS: "分组：舰艇上层建筑。可装：$PWC_PLATFORM_DESTROYER$、$PWC_PLATFORM_CRUISER$、$PWC_PLATFORM_CARRIER$。水面可见度 -5%。同组最多安装 1 个。"
 PWC_MODULE_NAVY_SPECIAL_HELICOPTER_HANGAR: "反潜直升机机库"
 PWC_MODULE_NAVY_SPECIAL_HELICOPTER_HANGAR_DESC: "利用舰载直升机增强本舰搜索与反潜攻击，与无人猎潜任务舱择一安装，代价是造价和航速。"
 PWC_MODULE_NAVY_SPECIAL_HELICOPTER_HANGAR_EFFECTS: "分组：猎潜任务设备。可装：$PWC_PLATFORM_DESTROYER$、$PWC_PLATFORM_CRUISER$。同组最多安装 1 个。"
 PWC_MODULE_NAVY_SPECIAL_STEALTH_QUIETING: "舰体隐身与降噪设计"
 PWC_MODULE_NAVY_SPECIAL_STEALTH_QUIETING_DESC: "舰体隐身与降噪设计把外形、机械振动和设备布置共同考虑。它关注整艘舰船向外部环境暴露自身的不同方式。"
 PWC_MODULE_NAVY_SPECIAL_STEALTH_QUIETING_EFFECTS: "分组：舰体隐身与降噪。可装：$PWC_PLATFORM_DESTROYER$、$PWC_PLATFORM_CRUISER$、$PWC_PLATFORM_SUBMARINE$、$PWC_PLATFORM_CARRIER$。水面可见度 -15%。潜艇可见度 -15%。同组最多安装 1 个。"
 PWC_MODULE_TANK_ARMOR_APS: "主动防护系统"
 PWC_MODULE_TANK_ARMOR_APS_DESC: "主动防护系统将威胁探测、判断与防护装置联动起来。它为车组和基础装甲之外增加了一层专门的近距防护组织。"
 PWC_MODULE_TANK_ARMOR_APS_EFFECTS: "分组：主动防护。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_ARMOR_COMPOSITE_GEN1: "现代复合装甲"
 PWC_MODULE_TANK_ARMOR_COMPOSITE_GEN1_DESC: "现役复合装甲把多种材料整合进防护结构，作为现代装甲车辆可直接使用的基础防护。"
 PWC_MODULE_TANK_ARMOR_COMPOSITE_GEN1_EFFECTS: "分组：被动装甲。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_ARMOR_COMPOSITE_GEN2: "模块化复合装甲"
 PWC_MODULE_TANK_ARMOR_COMPOSITE_GEN2_DESC: "改进型复合装甲进一步协调材料层次与结构布置。防护不再只是外加的重量，而是车辆整体设计中的专门工程。"
 PWC_MODULE_TANK_ARMOR_COMPOSITE_GEN2_EFFECTS: "分组：被动装甲。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_ARMOR_ERA: "多层智能反应装甲"
 PWC_MODULE_TANK_ARMOR_ERA_DESC: "反应装甲以独立防护单元布置在车体之外。它作为基础装甲的专门补充，需要与车辆结构和维护规范共同考虑。"
 PWC_MODULE_TANK_ARMOR_ERA_EFFECTS: "分组：反应装甲。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_ARMOR_MODULAR: "自诊断模块化防护"
 PWC_MODULE_TANK_ARMOR_MODULAR_DESC: "模块化防护以能够独立配置的装甲组件构成体系。车辆可以围绕不同任务安排防护结构，而不必把每个部件永久固定在同一种布局中。"
 PWC_MODULE_TANK_ARMOR_MODULAR_EFFECTS: "分组：被动装甲。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_ARMOR_STEEL: "轻型焊接装甲"
 PWC_MODULE_TANK_ARMOR_STEEL_DESC: "轻型焊接装甲为侦察和支援车辆提供基础防护，便于制造、维修和机动。主战平台可直接选用现役复合装甲。"
 PWC_MODULE_TANK_ARMOR_STEEL_EFFECTS: "分组：被动装甲。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_ARMOR_STEEL_T0: "0阶·基础焊接钢装甲"
 PWC_MODULE_TANK_ARMOR_STEEL_T0_DESC: "基础焊接钢装甲采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"
 PWC_MODULE_TANK_ARMOR_STEEL_T0_EFFECTS: "分组：被动装甲。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_ATGM_ADVANCED: "非视距反坦克导弹系统"
 PWC_MODULE_TANK_ATGM_ADVANCED_DESC: "先进车载导弹系统将观瞄、制导和发射装置进行整体配套。它强调武器操作与平台任务之间的协调，而非简单增加一具发射器。"
 PWC_MODULE_TANK_ATGM_ADVANCED_EFFECTS: "分组：反坦克导弹武器。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。不能同装：动能穿甲弹药。"
 PWC_MODULE_TANK_ATGM_BASIC: "车载制导反坦克导弹"
 PWC_MODULE_TANK_ATGM_BASIC_DESC: "成熟的车载制导反坦克系统结合光电观瞄与导弹发射，作为现代歼击平台的一代武器。"
 PWC_MODULE_TANK_ATGM_BASIC_EFFECTS: "分组：反坦克导弹武器。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。不能同装：动能穿甲弹药。"

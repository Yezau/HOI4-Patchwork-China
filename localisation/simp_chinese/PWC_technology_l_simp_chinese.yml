 PWC_MIO_ARMOR_SIDE_5_EFFECTS: "交叉特质：突破 +3%。需先解锁 $PWC_MIO_ARMOR_CHAIN_A_2$、$PWC_MIO_ARMOR_CHAIN_B_2$ 之一。"
 PWC_MIO_ARMOR_SIDE_6: "装甲试验场"
 PWC_MIO_ARMOR_SIDE_6_DESC: "装甲试验场为车辆提供能够重复开展的工程试验环境。制造与使用中的问题可以在共同条件下记录、比较并交回设计单位。"
 PWC_MIO_ARMOR_SIDE_6_EFFECTS: "交叉特质：组织研发加成 +3%。"
 PWC_MIO_ARMOR_SIDE_7: "火力防护整合"

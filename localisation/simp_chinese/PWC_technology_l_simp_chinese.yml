 PWC_TEMPLATE_ARMORED_18W: "轻编装甲师"
 PWC_TEMPLATE_ARMORED_18W_DESC: "以三个现代坦克营和六个机械化步兵营组成十八宽装甲师。机械化步兵承担持久作战，坦克提供突击火力，适合逐步建立装甲力量。"
 PWC_TEMPLATE_ARMORED_18W_EFFECTS: "18 宽师型：$PWC_UNIT_TANK$ x3、$PWC_UNIT_MECHANIZED$ x6、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_RECON$ x1、$PWC_UNIT_SIGNAL$ x1、$PWC_UNIT_REGIMENTAL_TANK_DESTROYER$ x1、$PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INDUSTRY$、$PWC_TECH0_COMMUNICATIONS$、$PWC_TECH0_ENGINEERS$、$PWC_TECH0_TRANSPORT$、$PWC_TECH_ARMY_MOBILITY_T1$、$PWC_TECH_ARMY_T1$。"
 PWC_TEMPLATE_ARMORED_36W: "装甲师"
 PWC_TEMPLATE_ARMORED_36W_DESC: "这套装甲编制把坦克与配套部队组织为共同的作战力量。装甲行动需要步兵、支援与保障的衔接，才能超越单一车辆的能力。"
 PWC_TEMPLATE_ARMORED_36W_EFFECTS: "36 宽师型：$PWC_UNIT_TANK$ x8、$PWC_UNIT_HEAVY_TANK$ x2、$PWC_UNIT_TANK_DESTROYER$ x2、$PWC_UNIT_MECHANIZED$ x6、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_SIGNAL$ x1、$PWC_UNIT_LOGISTICS$ x1、$PWC_UNIT_MAINTENANCE$ x1、$PWC_UNIT_REGIMENTAL_TANK_DESTROYER$ x1、$PWC_UNIT_REGIMENTAL_ARMORED_ANTI_AIR$ x1、$PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INDUSTRY$、$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH0_COMMUNICATIONS$、$PWC_TECH0_ENGINEERS$、$PWC_TECH0_TRANSPORT$、$PWC_TECH_ARMY_MOBILITY_T2$、$PWC_TECH_ARMY_T1$、$PWC_TECH_ARMY_T2$、$PWC_TECH_LOGISTICS_SUPPORT_T1$、$PWC_TECH_LOGISTICS_T1$。"
 PWC_TEMPLATE_CITY_GARRISON_12W: "城防师"
 PWC_TEMPLATE_CITY_GARRISON_12W_DESC: "步兵与宪兵共同承担占领区驻军任务。将这套模板指定为占领驻军，可利用宪兵的镇压能力维持占领秩序。"
 PWC_TEMPLATE_CITY_GARRISON_12W_EFFECTS: "12 宽师型：$PWC_UNIT_INFANTRY$ x6、$PWC_UNIT_MILITARY_POLICE$ x1。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH_ARMY_INFANTRY_T1$。"
 PWC_TEMPLATE_INFANTRY_12W: "步兵师"
 PWC_TEMPLATE_INFANTRY_12W_DESC: "这套步兵师编制以普通步兵和基本支援为核心，适合建立容易理解和维持的地面部队。训练与保障围绕共同的基础组织展开。"
 PWC_TEMPLATE_INFANTRY_12W_EFFECTS: "12 宽师型：$PWC_UNIT_INFANTRY$ x6、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_REGIMENTAL_FIRE_SUPPORT$ x2。开局每座城市部署 5 个。前置科技：$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH0_ENGINEERS$。"
 PWC_TEMPLATE_MOBILE_18W: "机动师"
 PWC_TEMPLATE_MOBILE_18W_DESC: "这套机动编制把运输、步兵行动与支援组织联系起来。它要求各单位在转移与展开时保持共同节奏，而不只是拥有车辆。"
 PWC_TEMPLATE_MOBILE_18W_EFFECTS: "18 宽师型：$PWC_UNIT_MOTORIZED$ x6、$PWC_UNIT_ARTILLERY$ x2、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_RECON$ x1、$PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH0_COMMUNICATIONS$、$PWC_TECH0_ENGINEERS$、$PWC_TECH0_TRANSPORT$、$PWC_TECH_ARMY_FIREPOWER_T1$。"
 PWC_TEMPLATE_MOUNTAIN_18W: "山地师"
 PWC_TEMPLATE_MOUNTAIN_18W_DESC: "这套山地编制以适应崎岖地形的部队为基础。行动路线、保障安排与单位协作都需要考虑地形对常规组织方式的限制。"
 PWC_TEMPLATE_MOUNTAIN_18W_EFFECTS: "18 宽师型：$PWC_UNIT_MOUNTAIN$ x9、$PWC_UNIT_ENGINEER$ x1、$PWC_UNIT_RECON$ x1、$PWC_UNIT_REGIMENTAL_FIRE_SUPPORT$ x2、$PWC_UNIT_REGIMENTAL_ANTI_TANK$ x1。开局不部署，需自行编成。前置科技：$PWC_TECH0_BASIC_INDUSTRY$、$PWC_TECH0_BASIC_INFANTRY$、$PWC_TECH0_COMMUNICATIONS$、$PWC_TECH0_ENGINEERS$、$PWC_TECH_SF_MOUNTAIN_T1$。"
 PWC_UNIT_AMPHIBIOUS_MECHANIZED: "两栖机械化步兵营"
 PWC_UNIT_AMPHIBIOUS_MECHANIZED_DESC: "乘坐两栖步兵战车的海军陆战部队，在渡河和登陆时维持载员保护与机动，需要独立的两栖车辆补给。"
 PWC_UNIT_AMPHIBIOUS_MECHANIZED_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x100、$PWC_EQUIPMENT_AMPHIBIOUS_MECHANIZED$ x50。"
 PWC_UNIT_AMPHIBIOUS_TANK: "两栖坦克营"
 PWC_UNIT_AMPHIBIOUS_TANK_DESC: "使用专用两栖坦克的装甲营，为登陆和渡河提供直射火力；轻量化浮航车体不适合正面装甲对抗。"
 PWC_UNIT_AMPHIBIOUS_TANK_EFFECTS: "装备需求：$PWC_PLATFORM_AMPHIBIOUS_TANK$ x50。"
 PWC_UNIT_ANTI_AIR: "机动防空导弹营"
 PWC_UNIT_ANTI_AIR_DESC: "野战防空营为地面部队组织空中警戒与对空射击。观察报告、武器操作和行军保障共同构成随队防空工作。"
 PWC_UNIT_ANTI_AIR_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_AIR$ x36。"
 PWC_UNIT_ANTI_TANK: "反坦克导弹营"
 PWC_UNIT_ANTI_TANK_DESC: "反坦克营专门应对敌方装甲目标。武器、观察与阵地组织需要紧密配合，使部队能够在共同指挥下执行任务。"
 PWC_UNIT_ANTI_TANK_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_TANK$ x36。"
 PWC_UNIT_ARMORED_RECOVERY: "装甲抢修连"
 PWC_UNIT_ARMORED_RECOVERY_DESC: "以专用抢修车回收战场装备并帮助部队恢复，可靠性维护较弱，且增加车辆与燃油需求。"
 PWC_UNIT_ARMORED_RECOVERY_EFFECTS: "装备需求：$PWC_EQUIPMENT_ARMORED_RECOVERY_VEHICLE$ x15、$PWC_EQUIPMENT_SUPPORT$ x15。由 $PWC_PROJECT_FIELD_RECOVERY$ 解锁。与 $PWC_UNIT_MAINTENANCE$ 共用支援类型，只能择一编入。"
 PWC_UNIT_ARTILLERY: "自行榴弹炮营"
 PWC_UNIT_ARTILLERY_DESC: "野战炮兵营把火炮、观察和射击指挥组成共同的支援单位。它通过明确的通信与阵地工作，把火力纳入地面部队的行动。"
 PWC_UNIT_ARTILLERY_EFFECTS: "装备需求：$PWC_EQUIPMENT_ARTILLERY$ x24。"
 PWC_UNIT_ASSAULT_ENGINEER: "突击工兵连"
 PWC_UNIT_ASSAULT_ENGINEER_DESC: "专长攻坚、渡河和城区突击，堑壕能力较弱；需要突击工程车、支援器材和燃油。"
 PWC_UNIT_ASSAULT_ENGINEER_EFFECTS: "装备需求：$PWC_EQUIPMENT_ASSAULT_ENGINEER_VEHICLE$ x12、$PWC_EQUIPMENT_SUPPORT$ x20、$PWC_EQUIPMENT_INFANTRY$ x10。由 $PWC_PROJECT_FLEXIBLE_MANUFACTURING$ 解锁。与 $PWC_UNIT_ENGINEER$ 共用支援类型，只能择一编入。"
 PWC_UNIT_BOMBER: "轰炸机联队"
 PWC_UNIT_BOMBER_DESC: "轰炸机联队把任务规划、编队飞行和载荷准备结合起来。其行动依赖从地面整备到任务返回的完整组织。"
 PWC_UNIT_BOMBER_EFFECTS: "装备需求：$PWC_PLATFORM_BOMBER$ x1。"
 PWC_UNIT_CARRIER: "航空母舰"
 PWC_UNIT_CARRIER_DESC: "航空母舰把机场的主要工作带到海上。舰船航行、飞行甲板与航空保障必须共同组织，才能让舰载机持续承担任务。"
 PWC_UNIT_CARRIER_EFFECTS: "装备需求：$PWC_PLATFORM_CARRIER$ x1。"
 PWC_UNIT_CAS: "攻击机联队"
 PWC_UNIT_CAS_DESC: "攻击机联队围绕空地配合组织飞行与保障。地面态势、目标联络和出动准备需要在联队内部形成一致的工作流程。"
 PWC_UNIT_CAS_EFFECTS: "装备需求：$PWC_PLATFORM_CAS$ x1。"
 PWC_UNIT_CRUISER: "巡洋舰"
 PWC_UNIT_CRUISER_DESC: "巡洋舰以较完整的舰载设备承担持续的海上任务。指挥、探测与各类武器通过舰上组织形成一个能够独立工作的整体。"
 PWC_UNIT_CRUISER_EFFECTS: "装备需求：$PWC_PLATFORM_CRUISER$ x1。"
 PWC_UNIT_CV_CAS: "舰载攻击机联队"
 PWC_UNIT_CV_CAS_DESC: "在航母上组织多用途攻击机，以反舰与港口打击为主，也可为登陆部队提供对地支援；需要对应的舰载攻击机装备。"
 PWC_UNIT_CV_CAS_EFFECTS: "装备需求：$PWC_PLATFORM_CV_CAS$ x1。"
 PWC_UNIT_CV_FIGHTER: "舰载战斗机联队"
 PWC_UNIT_CV_FIGHTER_DESC: "在航母甲板上组织战斗机，执行制空、截击与训练任务；需要对应的舰载战斗机装备。"
 PWC_UNIT_CV_FIGHTER_EFFECTS: "装备需求：$PWC_PLATFORM_CV_FIGHTER$ x1。"
 PWC_UNIT_DESTROYER: "驱逐舰"
 PWC_UNIT_DESTROYER_DESC: "驱逐舰作为舰队中的多任务舰艇，需要让航海、探测与武器班组密切配合。它的职责取决于舰上设备与共同的海上计划。"
 PWC_UNIT_DESTROYER_EFFECTS: "装备需求：$PWC_PLATFORM_DESTROYER$ x1。"
 PWC_UNIT_ENGINEER: "工兵连"
 PWC_UNIT_ENGINEER_DESC: "工兵连处理部队前进、驻守与撤离中的工程问题。它以专业工具和训练连接道路、障碍与阵地建设。"
 PWC_UNIT_ENGINEER_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x30、$PWC_EQUIPMENT_INFANTRY$ x10。"
 PWC_UNIT_FIELD_HOSPITAL: "野战卫勤连"
 PWC_UNIT_FIELD_HOSPITAL_DESC: "随队救护、转运和野战诊疗帮助伤员归队，并保存部队积累的战斗经验。"
 PWC_UNIT_FIELD_HOSPITAL_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x30、$PWC_EQUIPMENT_MOTORIZED$ x20。"
 PWC_UNIT_FIGHTER: "战斗机联队"
 PWC_UNIT_FIGHTER_DESC: "战斗机联队将飞行员、飞机与地勤组织成持续执行空中任务的单位。编队协作和任务准备与单机飞行同样重要。"
 PWC_UNIT_FIGHTER_EFFECTS: "装备需求：$PWC_PLATFORM_FIGHTER$ x1。"
 PWC_UNIT_HEAVY_TANK: "重装突击营"
 PWC_UNIT_HEAVY_TANK_DESC: "重型坦克营以大型装甲车辆为核心，需要专门考虑道路、保障和协同。它的行动始终与周围部队和后方维修组织密切相关。"
 PWC_UNIT_HEAVY_TANK_EFFECTS: "装备需求：$PWC_PLATFORM_HEAVY_TANK$ x40。"
 PWC_UNIT_HQ_AIR_LIAISON: "总部航空联络组"
 PWC_UNIT_HQ_AIR_LIAISON_DESC: "总部航空联络组随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_AIR_LIAISON_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_HQ_COMMAND: "总部指挥连"
 PWC_UNIT_HQ_COMMAND_DESC: "总部指挥连随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_COMMAND_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x20。"
 PWC_UNIT_HQ_ENGINEER: "总部工兵连"
 PWC_UNIT_HQ_ENGINEER_DESC: "总部工兵连随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_ENGINEER_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x20、$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_HQ_FIELD_HOSPITAL: "总部卫勤连"
 PWC_UNIT_HQ_FIELD_HOSPITAL_DESC: "总部卫勤连随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_FIELD_HOSPITAL_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_HQ_INFANTRY: "总部警卫营"
 PWC_UNIT_HQ_INFANTRY_DESC: "总部警卫营随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_INFANTRY_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x60。"
 PWC_UNIT_HQ_LOGISTICS: "总部后勤连"
 PWC_UNIT_HQ_LOGISTICS_DESC: "总部后勤连随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_LOGISTICS_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_HQ_MAINTENANCE: "总部维修连"
 PWC_UNIT_HQ_MAINTENANCE_DESC: "总部维修连随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_MAINTENANCE_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_HQ_MILITARY_POLICE: "总部宪兵连"
 PWC_UNIT_HQ_MILITARY_POLICE_DESC: "总部宪兵连随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_MILITARY_POLICE_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_HQ_MOTORIZED: "总部摩托化警卫营"
 PWC_UNIT_HQ_MOTORIZED_DESC: "总部摩托化警卫营随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_MOTORIZED_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x60、$PWC_EQUIPMENT_MOTORIZED$ x20。"
 PWC_UNIT_HQ_NAVAL_LIAISON: "总部海军联络组"
 PWC_UNIT_HQ_NAVAL_LIAISON_DESC: "总部海军联络组随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_NAVAL_LIAISON_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_HQ_RECON: "总部侦察连"
 PWC_UNIT_HQ_RECON_DESC: "总部侦察连随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_RECON_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x20、$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_HQ_SIGNAL: "总部通信连"
 PWC_UNIT_HQ_SIGNAL_DESC: "总部通信连随集团军总部行动，保障指挥机关及其所属部队的协同。仅可编入集团军总部。"
 PWC_UNIT_HQ_SIGNAL_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10。"
 PWC_UNIT_INFANTRY: "步兵营"
 PWC_UNIT_INFANTRY_DESC: "步兵营是守备与地面作战的基本组织。士兵依靠共同训练、班组协作和随身装备，在复杂地形中执行持续的任务。"
 PWC_UNIT_INFANTRY_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x100。"
 PWC_UNIT_LIGHT_TANK: "轻型坦克营"
 PWC_UNIT_LIGHT_TANK_DESC: "轻型坦克营围绕轻型平台组织装甲行动。部队需要让观察、机动与支援保持衔接，在明确的任务安排下使用自己的车辆。"
 PWC_UNIT_LIGHT_TANK_EFFECTS: "装备需求：$PWC_PLATFORM_LIGHT_TANK$ x60。"
 PWC_UNIT_LOGISTICS: "后勤保障连"
 PWC_UNIT_LOGISTICS_DESC: "集中规划补给路线与油料分配，为作战部队维持稳定的物资供应。"
 PWC_UNIT_LOGISTICS_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x20、$PWC_EQUIPMENT_MOTORIZED$ x10。"
 PWC_UNIT_MAINTENANCE: "维修抢修连"
 PWC_UNIT_MAINTENANCE_DESC: "维修班组随队抢修受损装备，并回收战场上的可用器材。"
 PWC_UNIT_MAINTENANCE_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x25。"
 PWC_UNIT_MARINE: "海军陆战营"
 PWC_UNIT_MARINE_DESC: "海军陆战队为舰岸转换、强渡河流和湿地突击组织训练，以轻装火力夺取并巩固登陆场。"
 PWC_UNIT_MARINE_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x150、$PWC_EQUIPMENT_SPECIAL_FORCES$ x20。"
 PWC_UNIT_MECHANIZED: "机械化步兵营"
 PWC_UNIT_MECHANIZED_DESC: "机械化步兵把装甲输送与步兵行动连接起来。车组和乘员必须形成共同的观察、联络与行动程序，才能作为完整单位运用。"
 PWC_UNIT_MECHANIZED_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x100、$PWC_EQUIPMENT_MECHANIZED$ x40。"
 PWC_UNIT_MILITARY_POLICE: "宪兵连"
 PWC_UNIT_MILITARY_POLICE_DESC: "宪兵连负责军队与管辖地区中的秩序事务。巡查、登记与交通管理使部队行动和公共管理能够保持清晰的责任边界。"
 PWC_UNIT_MILITARY_POLICE_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10、$PWC_EQUIPMENT_INFANTRY$ x40。"
 PWC_UNIT_MOTORIZED: "摩托化步兵营"
 PWC_UNIT_MOTORIZED_DESC: "摩托化步兵以运输车辆组织行军，在接近任务地区后仍以步兵方式行动。车辆调度与下车作战需要同样清晰的训练。"
 PWC_UNIT_MOTORIZED_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x100、$PWC_EQUIPMENT_MOTORIZED$ x35。"
 PWC_UNIT_MOUNTAIN: "山地特战营"
 PWC_UNIT_MOUNTAIN_DESC: "专业山地步兵以攀登、高寒生存和轻装协同克服陡坡与山口，是受特种部队容量约束的高地作战力量。"
 PWC_UNIT_MOUNTAIN_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x140、$PWC_EQUIPMENT_SPECIAL_FORCES$ x20。"
 PWC_UNIT_PARATROOPER: "空降兵营"
 PWC_UNIT_PARATROOPER_DESC: "空降兵依靠运输机进入战场，在分散着陆后迅速集结并控制纵深节点。执行空降需要合格编制、航程和制空条件。"
 PWC_UNIT_PARATROOPER_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x130、$PWC_EQUIPMENT_SPECIAL_FORCES$ x20。"
 PWC_UNIT_RANGER: "游骑兵营"
 PWC_UNIT_RANGER_DESC: "游骑兵擅长森林与丛林中的侦察、伏击和渗透，以小队协同在道路稀少的战区保持行动能力。"
 PWC_UNIT_RANGER_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x140、$PWC_EQUIPMENT_SPECIAL_FORCES$ x20。"
 PWC_UNIT_RECON: "侦察连"
 PWC_UNIT_RECON_DESC: "侦察连在部队行动之前与侧翼寻找可靠信息。观察、机动与报告程序是它的核心工作，目的在于让指挥建立在经过核验的情况之上。"
 PWC_UNIT_RECON_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x10、$PWC_EQUIPMENT_MOTORIZED$ x10、$PWC_EQUIPMENT_INFANTRY$ x40。"
 PWC_UNIT_REGIMENTAL_ANTI_AIR: "团属防空导弹连"
 PWC_UNIT_REGIMENTAL_ANTI_AIR_DESC: "机动防空导弹为步兵和机动团提供近程防空，使用现有防空导弹装备并接受本线科研升级。"
 PWC_UNIT_REGIMENTAL_ANTI_AIR_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_AIR$ x12。"
 PWC_UNIT_REGIMENTAL_ANTI_TANK: "团属反坦克导弹连"
 PWC_UNIT_REGIMENTAL_ANTI_TANK_DESC: "伴随步兵行动的反坦克导弹分队，依靠制导武器和目标指示应对敌方装甲。"
 PWC_UNIT_REGIMENTAL_ANTI_TANK_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_TANK$ x16。"
 PWC_UNIT_REGIMENTAL_ARMORED_ANTI_AIR: "装甲团防空导弹连"
 PWC_UNIT_REGIMENTAL_ARMORED_ANTI_AIR_DESC: "随装甲和机动作战支援团部署的近程防空导弹分队，使用与其他团属防空连相同的装备。"
 PWC_UNIT_REGIMENTAL_ARMORED_ANTI_AIR_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_AIR$ x12。"
 PWC_UNIT_REGIMENTAL_ARTILLERY: "团属自行榴弹炮连"
 PWC_UNIT_REGIMENTAL_ARTILLERY_DESC: "自行榴弹炮随作战团转移，通过弹道计算与火力协同提供间接火力。可配属步兵、机动、装甲及其作战支援团。"
 PWC_UNIT_REGIMENTAL_ARTILLERY_EFFECTS: "装备需求：$PWC_EQUIPMENT_ARTILLERY$ x4。"
 PWC_UNIT_REGIMENTAL_FIRE_SUPPORT: "团属火力连"
 PWC_UNIT_REGIMENTAL_FIRE_SUPPORT_DESC: "团属火力连直接配属作战团，让团长就近调度火力。每个至少拥有三个营的兼容团可编入一个团级支援连。"
 PWC_UNIT_REGIMENTAL_FIRE_SUPPORT_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x30、$PWC_EQUIPMENT_SUPPORT$ x5。"
 PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE: "团属摩托化火力连"
 PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE_DESC: "团属摩托化火力连直接配属作战团，让团长就近调度火力。每个至少拥有三个营的兼容团可编入一个团级支援连。"
 PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE_EFFECTS: "装备需求：$PWC_EQUIPMENT_INFANTRY$ x30、$PWC_EQUIPMENT_SUPPORT$ x5、$PWC_EQUIPMENT_MOTORIZED$ x5。"
 PWC_UNIT_REGIMENTAL_ROCKET: "团属车载火箭炮连"
 PWC_UNIT_REGIMENTAL_ROCKET_DESC: "车载火箭炮以齐射火力支援作战团，随侦察与目标指示技术升级。可配属步兵、机动、装甲及其作战支援团。"
 PWC_UNIT_REGIMENTAL_ROCKET_EFFECTS: "装备需求：$PWC_EQUIPMENT_ROCKET$ x4。"
 PWC_UNIT_REGIMENTAL_TANK_DESTROYER: "团属反坦克歼击车连"
 PWC_UNIT_REGIMENTAL_TANK_DESTROYER_DESC: "反坦克歼击平台为装甲和机动作战支援团提供伴随反装甲火力，从储备反坦克炮车逐步升级为制导武器平台。"
 PWC_UNIT_REGIMENTAL_TANK_DESTROYER_EFFECTS: "装备需求：$PWC_PLATFORM_TANK_DESTROYER$ x10。"
 PWC_UNIT_ROCKET_ARTILLERY: "车载火箭炮营"
 PWC_UNIT_ROCKET_ARTILLERY_DESC: "火箭炮营以成组发射的武器组织火力支援。阵地准备、发射指挥和弹药运输必须围绕共同的任务节奏展开。"
 PWC_UNIT_ROCKET_ARTILLERY_EFFECTS: "装备需求：$PWC_EQUIPMENT_ROCKET$ x24。"
 PWC_UNIT_SIGNAL: "通信指挥连"
 PWC_UNIT_SIGNAL_DESC: "以通信节点和指挥终端连接各营连，缩短命令传递与协同反应的时间。"
 PWC_UNIT_SIGNAL_EFFECTS: "装备需求：$PWC_EQUIPMENT_SUPPORT$ x20、$PWC_EQUIPMENT_MOTORIZED$ x10。"
 PWC_UNIT_SUBMARINE: "潜艇"
 PWC_UNIT_SUBMARINE_DESC: "潜艇在水下环境中组织航行、观察与武器运用。艇员必须以严格的协同处理有限空间、隐蔽行动与长期值班。"
 PWC_UNIT_SUBMARINE_EFFECTS: "装备需求：$PWC_PLATFORM_SUBMARINE$ x1。"
 PWC_UNIT_SUPPORT_ANTI_AIR: "近程防空连"
 PWC_UNIT_SUPPORT_ANTI_AIR_DESC: "随队部署近程防空火力，掩护部队集结、行军与地面战斗。"
 PWC_UNIT_SUPPORT_ANTI_AIR_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_AIR$ x20。"
 PWC_UNIT_SUPPORT_ANTI_TANK: "反装甲支援连"
 PWC_UNIT_SUPPORT_ANTI_TANK_DESC: "集中反装甲武器与射击小组，为各作战营补充应对敌方装甲的火力。"
 PWC_UNIT_SUPPORT_ANTI_TANK_EFFECTS: "装备需求：$PWC_EQUIPMENT_ANTI_TANK$ x24。"
 PWC_UNIT_SUPPORT_ARTILLERY: "支援炮兵连"
 PWC_UNIT_SUPPORT_ARTILLERY_DESC: "以规模精干的炮兵分队提供间接火力，为主力营压制目标和掩护行动。"
 PWC_UNIT_SUPPORT_ARTILLERY_EFFECTS: "装备需求：$PWC_EQUIPMENT_ARTILLERY$ x12。"
 PWC_UNIT_SUPPORT_HEAVY_MORTAR: "重迫击炮支援连"
 PWC_UNIT_SUPPORT_HEAVY_MORTAR_DESC: "使用自行重迫击炮支援城区和森林作战；反装甲能力有限，必须供应专用炮车与燃油。"
 PWC_UNIT_SUPPORT_HEAVY_MORTAR_EFFECTS: "装备需求：$PWC_EQUIPMENT_HEAVY_MORTAR$ x12、$PWC_EQUIPMENT_SUPPORT$ x5。由 $PWC_PROJECT_PRECISION_PRODUCTION$ 解锁。与 $PWC_UNIT_SUPPORT_ARTILLERY$ 共用支援类型，只能择一编入。"
 PWC_UNIT_TANK: "坦克营"
 PWC_UNIT_TANK_DESC: "坦克营将装甲平台编成统一行动的地面力量。车组、指挥与维修保障共同承担任务，而不是让单车各自寻找战场上的位置。"
 PWC_UNIT_TANK_DESTROYER: "反坦克歼击车营"
 PWC_UNIT_TANK_DESTROYER_DESC: "歼击车营围绕反装甲任务组织观察与射击。车辆的选位、指挥和掩护共同服务于明确的战术用途。"
 PWC_UNIT_TANK_DESTROYER_EFFECTS: "装备需求：$PWC_PLATFORM_TANK_DESTROYER$ x40。"
 PWC_UNIT_TANK_EFFECTS: "装备需求：$PWC_PLATFORM_MEDIUM_TANK$ x50。"
 PWC_UNIT_TRANSPORT: "运输机联队"
 PWC_UNIT_TRANSPORT_DESC: "运输机联队承担伞降投送和空中补给。其任务能力来自运输机，不能替代用于制空或对地攻击的作战航空兵。"
 PWC_UNIT_TRANSPORT_EFFECTS: "装备需求：$PWC_EQUIPMENT_TRANSPORT$ x1。"
 PWC_UNIT_UAV: "无人机联队"
 PWC_UNIT_UAV_DESC: "无人机联队同时组织飞行平台与地面操控人员。任务规划、数据联系和设备维护共同决定这一航空单位如何持续工作。"
 PWC_UNIT_UAV_EFFECTS: "装备需求：$PWC_PLATFORM_UAV$ x1。"

 PWC_MODULE_TANK_HOWITZER_T0: "0阶·短管支援炮"
 PWC_MODULE_TANK_HOWITZER_T0_DESC: "短管支援炮采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"
 PWC_MODULE_TANK_HOWITZER_T0_EFFECTS: "分组：坦克火炮。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_KIT_HEAVY: "重装突击车体整合套件"
 PWC_MODULE_TANK_KIT_HEAVY_DESC: "重型整合套件为大型装甲平台协调结构、安装空间与装备配套。它处理的是重型车辆各项系统如何在同一底盘上共同工作。"
 PWC_MODULE_TANK_KIT_HEAVY_EFFECTS: "分组：重型车体整合。可装：$PWC_PLATFORM_HEAVY_TANK$。"
 PWC_MODULE_TANK_KIT_LIGHT: "轻型整合套件"
 PWC_MODULE_TANK_KIT_LIGHT_DESC: "轻型整合套件围绕紧凑底盘安排装备接口与内部配套。它将轻型平台的空间和任务要求落实到可以制造、装配的共同方案中。"
 PWC_MODULE_TANK_KIT_LIGHT_EFFECTS: "分组：轻型车体整合。可装：$PWC_PLATFORM_LIGHT_TANK$。"
 PWC_MODULE_TANK_KIT_MEDIUM: "现代整合套件"
 PWC_MODULE_TANK_KIT_MEDIUM_DESC: "现代整合套件协调通用坦克平台上的各项设备。武器、动力与任务附件在共同的接口规范下形成可持续维护的整体。"
 PWC_MODULE_TANK_KIT_MEDIUM_EFFECTS: "分组：现代车体整合。可装：$PWC_PLATFORM_MEDIUM_TANK$。"
 PWC_MODULE_TANK_KIT_TD: "歼击整合套件"
 PWC_MODULE_TANK_KIT_TD_DESC: "歼击车整合套件以反装甲任务为中心安排平台接口。观瞄、武器和车辆内部设备共同围绕明确的战术用途组织。"
 PWC_MODULE_TANK_KIT_TD_EFFECTS: "分组：歼击车体整合。可装：$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_RADIO_DIGITAL: "数字化车际网络电台"
 PWC_MODULE_TANK_RADIO_DIGITAL_DESC: "数字化车际通信把消息组织为能够在不同终端之间交换的数据。它使车组联络不再完全依赖连续的语音通话。"
 PWC_MODULE_TANK_RADIO_DIGITAL_EFFECTS: "分组：车际通信与指挥。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_RADIO_NETWORK: "分布式协同指挥终端"
 PWC_MODULE_TANK_RADIO_NETWORK_DESC: "网络化指挥终端把车组接入共同的信息环境。位置、任务和态势消息通过统一的操作方式在平台之间流转。"
 PWC_MODULE_TANK_RADIO_NETWORK_EFFECTS: "分组：车际通信与指挥。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_RADIO_VHF: "VHF 车际电台"
 PWC_MODULE_TANK_RADIO_VHF_DESC: "车际电台为各车组提供共同的语音联络渠道。明确的通信程序使车辆能够在行进和战斗中理解彼此的任务。"
 PWC_MODULE_TANK_RADIO_VHF_EFFECTS: "分组：车际通信与指挥。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_RADIO_VHF_T0: "0阶·基础车载电台"
 PWC_MODULE_TANK_RADIO_VHF_T0_DESC: "基础车载电台采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"
 PWC_MODULE_TANK_RADIO_VHF_T0_EFFECTS: "分组：车际通信与指挥。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_SPECIAL_APFSDS: "高密度长杆穿甲弹"
 PWC_MODULE_TANK_SPECIAL_APFSDS_DESC: "这类穿甲弹以细长弹芯和分离式弹托组织飞行与命中过程。它属于现代坦克直射武器配套中的专用反装甲弹药。"
 PWC_MODULE_TANK_SPECIAL_APFSDS_EFFECTS: "分组：动能穿甲弹药。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。不能同装：反坦克导弹武器。"
 PWC_MODULE_TANK_SPECIAL_DOZER: "工程推土套件"
 PWC_MODULE_TANK_SPECIAL_DOZER_DESC: "推土套件让装甲车辆能够承担有限的现场工程任务。车体与工程附件共同用于处理障碍、土方和简易阵地作业。"
 PWC_MODULE_TANK_SPECIAL_DOZER_EFFECTS: "分组：工程与城市战套件。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_SPECIAL_NBC: "三防与乘员生存系统"
 PWC_MODULE_TANK_SPECIAL_NBC_DESC: "三防与乘员生存系统把过滤、密封和内部环境保障结合起来。它关心的是车组在受污染或恶劣环境下如何维持基本工作条件。"
 PWC_MODULE_TANK_SPECIAL_NBC_EFFECTS: "分组：乘员生存设备。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_SPECIAL_RECON_UAV: "车载侦察无人机"
 PWC_MODULE_TANK_SPECIAL_RECON_UAV_DESC: "车载侦察无人机为车组提供独立于车体视线的观察手段。操控、回传与任务信息需要被纳入车辆原有的指挥工作。"
 PWC_MODULE_TANK_SPECIAL_RECON_UAV_EFFECTS: "分组：车载侦察设备。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_SPECIAL_SOFTKILL: "软杀伤对抗系统"
 PWC_MODULE_TANK_SPECIAL_SOFTKILL_DESC: "软杀伤对抗设备通过告警与干扰手段组织自卫。它关注如何破坏对方武器的观察和引导过程，而不是单纯依赖装甲承受命中。"
 PWC_MODULE_TANK_SPECIAL_SOFTKILL_EFFECTS: "分组：软杀伤对抗。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_SPECIAL_URBAN_KIT: "城市战套件"
 PWC_MODULE_TANK_SPECIAL_URBAN_KIT_DESC: "城市战套件围绕近距离观察、复杂障碍和车组防护进行配套。它使车辆设计能够更有针对性地面对街道与建筑密集的环境。"
 PWC_MODULE_TANK_SPECIAL_URBAN_KIT_EFFECTS: "分组：工程与城市战套件。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。同组最多安装 1 个。"
 PWC_MODULE_TANK_SUSPENSION_ADAPTIVE: "自适应悬挂"
 PWC_MODULE_TANK_SUSPENSION_ADAPTIVE_DESC: "自适应悬挂将行走系统的状态感知与调节机构结合起来。底盘能够围绕地面条件和车体状态采用更细致的控制方式。"
 PWC_MODULE_TANK_SUSPENSION_ADAPTIVE_EFFECTS: "分组：装甲车辆悬挂。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_SUSPENSION_HYDROPNEUMATIC: "液气悬挂"
 PWC_MODULE_TANK_SUSPENSION_HYDROPNEUMATIC_DESC: "液气悬挂以流体与气体元件共同承担行走系统的缓冲。它使底盘工程能够更细致地处理车体姿态与地面起伏。"
 PWC_MODULE_TANK_SUSPENSION_HYDROPNEUMATIC_EFFECTS: "分组：装甲车辆悬挂。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_SUSPENSION_TORSION: "扭杆悬挂"
 PWC_MODULE_TANK_SUSPENSION_TORSION_DESC: "扭杆悬挂利用弹性杆件承受履带车辆的行走载荷。它把车体结构、负重轮布置与维修方式联系在一起。"
 PWC_MODULE_TANK_SUSPENSION_TORSION_EFFECTS: "分组：装甲车辆悬挂。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_SUSPENSION_TORSION_T0: "0阶·基础扭杆悬挂"
 PWC_MODULE_TANK_SUSPENSION_TORSION_T0_DESC: "基础扭杆悬挂采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"
 PWC_MODULE_TANK_SUSPENSION_TORSION_T0_EFFECTS: "分组：装甲车辆悬挂。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$、$PWC_PLATFORM_TANK_DESTROYER$。"
 PWC_MODULE_TANK_TURRET_AUTOLOADER: "自动装弹机炮塔"
 PWC_MODULE_TANK_TURRET_AUTOLOADER_DESC: "自动装弹炮塔以机械装置组织弹药输送与装填。炮塔内部空间、武器操作和车组职责因此需要重新协调。"
 PWC_MODULE_TANK_TURRET_AUTOLOADER_EFFECTS: "分组：炮塔与装弹机构。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$。"
 PWC_MODULE_TANK_TURRET_AUTOLOADER_T0: "0阶·基础人工装填炮塔"
 PWC_MODULE_TANK_TURRET_AUTOLOADER_T0_DESC: "基础人工装填炮塔采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"
 PWC_MODULE_TANK_TURRET_AUTOLOADER_T0_EFFECTS: "分组：炮塔与装弹机构。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$。"
 PWC_MODULE_TANK_TURRET_UNMANNED: "无人炮塔"
 PWC_MODULE_TANK_TURRET_UNMANNED_DESC: "无人炮塔把武器机构与乘员工作区分离。观瞄、装填和控制设备需要通过可靠的内部连接完成过去由炮塔内人员直接承担的任务。"
 PWC_MODULE_TANK_TURRET_UNMANNED_EFFECTS: "分组：炮塔与装弹机构。可装：$PWC_PLATFORM_LIGHT_TANK$、$PWC_PLATFORM_MEDIUM_TANK$、$PWC_PLATFORM_HEAVY_TANK$。"
 PWC_PLATFORM_BOMBER: "轰炸机"
 PWC_PLATFORM_BOMBER_DESC: "轰炸机把载荷、航行与任务规划放在设计的核心。机组、航电和机体共同支撑从出发到返回的完整打击任务。"
 PWC_PLATFORM_BOMBER_EFFECTS: "$PWC_PLATFORM_BOMBER$设计基型，共 5 代，在飞机设计器中按模块自选，随空军科技分支解锁。一代由 $PWC_TECH0_BASIC_INDUSTRY$ 解锁，基础造价 30.24 IC。"
 PWC_PLATFORM_BOMBER_GEN0: "0阶·储备轰炸机"
 PWC_PLATFORM_BOMBER_GEN0_DESC: "旧式轰炸机提供初步远程投送能力，载荷、生存性和导航精度受限。"
 PWC_PLATFORM_BOMBER_GEN0_EFFECTS: "基础造价 30.24 IC。主武器必须安装攻击挂载。基础任务：战略轰炸、训练。其他任务由已安装武器开放。"
 PWC_PLATFORM_BOMBER_GEN1: "一代轰炸机"
 PWC_PLATFORM_BOMBER_GEN1_DESC: "$PWC_PLATFORM_BOMBER_DESC$本代方案以成熟工艺建立通用的设计与保障基础。"
 PWC_PLATFORM_BOMBER_GEN1_EFFECTS: "基础造价 35.6 IC。主武器必须安装攻击挂载。基础任务：战略轰炸、训练。其他任务由已安装武器开放。"
 PWC_PLATFORM_BOMBER_GEN2: "二代轰炸机"
 PWC_PLATFORM_BOMBER_GEN2_DESC: "$PWC_PLATFORM_BOMBER_DESC$本代方案吸收服役经验，重新协调各部件与日常使用流程。"
 PWC_PLATFORM_BOMBER_GEN2_EFFECTS: "基础造价 40.8 IC。主武器必须安装攻击挂载。基础任务：战略轰炸、训练。其他任务由已安装武器开放。"
 PWC_PLATFORM_BOMBER_GEN3: "三代轰炸机"
 PWC_PLATFORM_BOMBER_GEN3_DESC: "$PWC_PLATFORM_BOMBER_DESC$本代方案重视各项设备之间的衔接，使复杂任务能够围绕共同接口展开。"

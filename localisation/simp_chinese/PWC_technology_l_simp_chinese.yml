 PWC_MODULE_TANK_FCS_THERMAL: "热成像火控系统"
 PWC_MODULE_TANK_FCS_THERMAL_DESC: "热成像火控系统把热探测设备与瞄准、解算和武器控制连接起来。车组通过共同的观瞄信息组织射击过程。"

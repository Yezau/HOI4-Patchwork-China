 PWC_MODULE_TANK_GUN_105MM_T0: "0阶·基础105毫米线膛炮"
 PWC_MODULE_TANK_GUN_105MM_T0_DESC: "基础105毫米线膛炮采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"

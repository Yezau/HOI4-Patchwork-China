 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN1: "第一代涡扇发动机"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN1_DESC: "基础涡扇发动机为作战飞机建立成熟的喷气动力配套。进气、燃烧与机体安装需要作为相互衔接的航空工程处理。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN1_EFFECTS: "分组：涡扇发动机。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN1_T0: "0阶·基础涡扇发动机"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN1_T0_DESC: "基础涡扇发动机采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN1_T0_EFFECTS: "分组：涡扇发动机。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN2: "第二代涡扇发动机"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN2_DESC: "改进涡扇动力进一步协调发动机与机体的工作条件。设计人员围绕作战飞机的日常使用，处理动力装置的控制与保障问题。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN2_EFFECTS: "分组：涡扇发动机。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN3: "第三代涡扇发动机"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN3_DESC: "这一代涡扇动力围绕更复杂的飞行任务进行整合。发动机控制、气动配合与持续保障成为共同的设计重点。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN3_EFFECTS: "分组：涡扇发动机。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN4: "第四代大推力涡扇"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN4_DESC: "先进大推力涡扇把动力控制与复杂机体需求进一步结合。它是围绕整机任务设计的动力核心，而非孤立的发动机部件。"
 PWC_MODULE_AIR_ENGINE_TURBOFAN_GEN4_EFFECTS: "分组：涡扇发动机。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。"
 PWC_MODULE_AIR_PAYLOAD_BOMB_RACK: "通用挂架"
 PWC_MODULE_AIR_PAYLOAD_BOMB_RACK_DESC: "通用挂架为飞机携带任务载荷提供标准化的安装位置。载荷连接、释放和地面装卸都围绕共同的接口组织。"
 PWC_MODULE_AIR_PAYLOAD_BOMB_RACK_EFFECTS: "分组：对地与对海武器。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。开放任务：近距支援、后勤打击、对海攻击、港口打击。"
 PWC_MODULE_AIR_PAYLOAD_BOMB_RACK_T0: "0阶·基础通用炸弹挂架"
 PWC_MODULE_AIR_PAYLOAD_BOMB_RACK_T0_DESC: "基础通用炸弹挂架采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"

 PWC_TECH_LANE_MISSILE: "火箭炮与导弹"
 PWC_TECH_LANE_MISSILE_DEFENSE: "防空与反装甲"
 PWC_TECH_LANE_NAVY: "护航与驱逐舰"
 PWC_TECH_LANE_NAVY_CARRIER: "航母与舰载航空"
 PWC_TECH_LANE_NAVY_FLEET: "巡洋舰"

 PWC_MODULE_AIR_AVIONICS_SENSOR_FUSION_DESC: "传感器融合把不同设备提供的消息整理成共同的态势图景。机组可以围绕一致的信息工作，而不必逐一拼合互相分离的显示。"
 PWC_MODULE_AIR_AVIONICS_SENSOR_FUSION_EFFECTS: "分组：传感器融合航电。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_AVIONICS_TARGETING_POD: "瞄准吊舱"
 PWC_MODULE_AIR_AVIONICS_TARGETING_POD_DESC: "瞄准吊舱将观察、目标指示与相关控制设备集中在外挂组件中。机组通过它把地面目标信息接入飞机的任务流程。"

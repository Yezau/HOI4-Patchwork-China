 PWC_PLATFORM_UAV_GEN0: "0阶·储备无人机"
 PWC_PLATFORM_UAV_GEN0_DESC: "早期无人平台适合低强度侦察和支援，缺乏复杂环境下的持续作战能力。"
 PWC_PLATFORM_UAV_GEN0_EFFECTS: "基础造价 6.12 IC。主武器必须安装主攻击位。基础任务：后勤打击、近距支援、训练。其他任务由已安装武器开放。"
 PWC_PLATFORM_UAV_GEN1: "一代无人机"

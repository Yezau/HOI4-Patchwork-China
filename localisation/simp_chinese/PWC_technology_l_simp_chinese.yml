 PWC_MIO_UNMANNED_POLICY_COST_EFFECTS: "组织方针（50 政治点，180 天冷却，同时仅一个生效）：机构达到 10 级解锁。航程 +25%、对地攻击 -9%。"
 PWC_MIO_UNMANNED_POLICY_INNOVATION: "冗余航电体系"
 PWC_MIO_UNMANNED_POLICY_INNOVATION_DESC: "采用冗余航电与防护设计，以更高成本改善无人机的可靠性和空中生存能力。"
 PWC_MIO_UNMANNED_POLICY_INNOVATION_EFFECTS: "组织方针（50 政治点，180 天冷却，同时仅一个生效）：机构达到 10 级解锁。可靠性 +12%、空中防御 +9%、生产成本 +9%。"
 PWC_MIO_UNMANNED_POLICY_PRODUCTION: "消耗型无人机"
 PWC_MIO_UNMANNED_POLICY_PRODUCTION_DESC: "以低成本机体扩大无人机数量，接受耐久下降，用于持续补充消耗。"
 PWC_MIO_UNMANNED_POLICY_PRODUCTION_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。生产成本 -12%、可靠性 -10%。"
 PWC_MIO_UNMANNED_POLICY_QUALITY: "精确对地载荷"
 PWC_MIO_UNMANNED_POLICY_QUALITY_DESC: "把机体余量用于对地载荷，牺牲部分航程以提高近距离打击能力。"
 PWC_MIO_UNMANNED_POLICY_QUALITY_EFFECTS: "组织方针（25 政治点，180 天冷却，同时仅一个生效）：机构达到 6 级解锁。对地攻击 +12%、航程 -9%。"
 PWC_MIO_UNMANNED_SIDE_1: "商用电子部件"
 PWC_MIO_UNMANNED_SIDE_1_DESC: "商用电子部件为无人系统提供已有的器件与制造经验。工程人员需要通过专门的接口和验证，使这些部件适应平台任务。"
 PWC_MIO_UNMANNED_SIDE_1_EFFECTS: "侧支特质：生产成本 -3%。"
 PWC_MIO_UNMANNED_SIDE_2: "无人机批量总装"
 PWC_MIO_UNMANNED_SIDE_2_DESC: "无人机批量总装把机体、电子与地面配套设备纳入共同交付流程。制造单位按照完整系统而非单架飞机安排工作。"
 PWC_MIO_UNMANNED_SIDE_2_EFFECTS: "侧支特质：生产产能 +3%。"
 PWC_MIO_UNMANNED_SIDE_3: "链路冗余设计"
 PWC_MIO_UNMANNED_SIDE_3_DESC: "链路冗余设计研究操控与回传联系中的相互支持方式。平台和地面设备需要对通信变化采用能够共同理解的处理程序。"
 PWC_MIO_UNMANNED_SIDE_3_EFFECTS: "侧支特质：可靠性 +3%。"
 PWC_MIO_UNMANNED_SIDE_4: "低耗巡航控制"
 PWC_MIO_UNMANNED_SIDE_4_DESC: "巡航控制把飞行状态与动力管理共同考虑。任务规划人员和控制系统围绕持续飞行的实际需求协调工作。"
 PWC_MIO_UNMANNED_SIDE_4_EFFECTS: "侧支特质：航程 +3%。"
 PWC_MIO_UNMANNED_SIDE_5: "飞控响应优化"
 PWC_MIO_UNMANNED_SIDE_5_DESC: "飞控响应优化通过反复试验整理指令与平台动作之间的关系。控制逻辑、执行机构与操作人员需要围绕一致的飞行行为协作。"
 PWC_MIO_UNMANNED_SIDE_5_EFFECTS: "交叉特质：机动 +3%。需先解锁 $PWC_MIO_UNMANNED_CHAIN_A_2$、$PWC_MIO_UNMANNED_CHAIN_B_2$ 之一。"
 PWC_MIO_UNMANNED_SIDE_6: "快速迭代试验台"
 PWC_MIO_UNMANNED_SIDE_6_DESC: "快速迭代试验台让不同方案在相同条件下接受验证。小规模试验、记录与重新设计构成无人系统持续研发的日常流程。"
 PWC_MIO_UNMANNED_SIDE_6_EFFECTS: "交叉特质：组织研发加成 +5%。"
 PWC_MIO_UNMANNED_SIDE_7: "传感器载荷匹配"
 PWC_MIO_UNMANNED_SIDE_7_DESC: "传感器与载荷匹配研究平台如何把观察结果交给任务设备。不同部件需要共同理解目标、时间和操作顺序，而不仅是能够接通电源。"
 PWC_MIO_UNMANNED_SIDE_7_EFFECTS: "交叉特质：对地攻击 +3%。"
 PWC_MODULE_AIR_AVIONICS_AESA: "有源相控阵雷达"
 PWC_MODULE_AIR_AVIONICS_AESA_DESC: "有源相控阵雷达通过阵面上的多个工作单元组织探测。雷达控制与信息处理共同决定机组如何理解搜索得到的目标信息。"
 PWC_MODULE_AIR_AVIONICS_AESA_EFFECTS: "分组：机载雷达。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_AVIONICS_EW_SUITE: "综合电子战套件"
 PWC_MODULE_AIR_AVIONICS_EW_SUITE_DESC: "综合电子战套件连接电磁探测、告警与对抗设备。它让机组能够把电子环境作为任务的一部分进行组织，而不是被动接收零散提示。"
 PWC_MODULE_AIR_AVIONICS_EW_SUITE_EFFECTS: "分组：电子战航电。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_AVIONICS_INS: "惯性导航系统"
 PWC_MODULE_AIR_AVIONICS_INS_DESC: "惯性导航利用机载设备连续记录运动状态，为飞行员提供航向和位置参考。它是飞机任务导航中的独立组成部分。"
 PWC_MODULE_AIR_AVIONICS_INS_EFFECTS: "分组：导航航电。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_AVIONICS_INS_T0: "0阶·基础惯性导航"
 PWC_MODULE_AIR_AVIONICS_INS_T0_DESC: "基础惯性导航采用成熟工艺与通用部件，便于在工业规模有限时维持装备生产。"
 PWC_MODULE_AIR_AVIONICS_INS_T0_EFFECTS: "分组：导航航电。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_AVIONICS_MARITIME_RADAR: "海上搜索雷达"
 PWC_MODULE_AIR_AVIONICS_MARITIME_RADAR_DESC: "搜索水面目标和潜艇并改善对海瞄准；占用航电槽，增加造价并降低机动性。"
 PWC_MODULE_AIR_AVIONICS_MARITIME_RADAR_EFFECTS: "分组：海上搜索航电。可装：$PWC_PLATFORM_CAS$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_AVIONICS_NIGHT_NAVIGATION: "多模夜航导航设备"
 PWC_MODULE_AIR_AVIONICS_NIGHT_NAVIGATION_DESC: "减轻本机夜战惩罚并延长航程，与其他航电设备竞争槽位，增加造价和飞行阻力。"
 PWC_MODULE_AIR_AVIONICS_NIGHT_NAVIGATION_EFFECTS: "分组：导航航电。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"
 PWC_MODULE_AIR_AVIONICS_RWR: "雷达告警接收机"
 PWC_MODULE_AIR_AVIONICS_RWR_DESC: "雷达告警接收机把外部雷达照射转换为飞行员能够理解的提示。它帮助机组把看不见的电磁活动纳入态势判断。"
 PWC_MODULE_AIR_AVIONICS_RWR_EFFECTS: "分组：雷达告警。可装：$PWC_PLATFORM_FIGHTER$、$PWC_PLATFORM_CAS$、$PWC_PLATFORM_BOMBER$、$PWC_PLATFORM_UAV$、$PWC_PLATFORM_CV_FIGHTER$、$PWC_PLATFORM_CV_CAS$。同组最多安装 1 个。"

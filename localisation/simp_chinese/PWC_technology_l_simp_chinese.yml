 PWC_TECH_SF_AIRBORNE_T1: "战术空降与运输机"
 PWC_TECH_SF_AIRBORNE_T1_DESC: "以运输机、伞降器材与集结训练组织垂直投送；空降仍需满足原生制空与航程条件。"
 PWC_TECH_SF_AIRBORNE_T2: "精确投送与集结"
 PWC_TECH_SF_AIRBORNE_T2_DESC: "以运输机、伞降器材与集结训练组织垂直投送；空降仍需满足原生制空与航程条件。"
 PWC_TECH_SF_AIRBORNE_T3: "纵深空降指挥"
 PWC_TECH_SF_AIRBORNE_T3_DESC: "以运输机、伞降器材与集结训练组织垂直投送；空降仍需满足原生制空与航程条件。"

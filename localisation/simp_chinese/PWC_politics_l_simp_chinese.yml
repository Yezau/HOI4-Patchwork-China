 PWC_FOCUS_LAW_CONSTITUTIONAL_CONVENTION_EFFECTS: "35 天：政治点数 +100。"
 PWC_FOCUS_LAW_ECONOMY_REFORM: "经济动员改革"
 PWC_FOCUS_LAW_ECONOMY_REFORM_DESC: "工厂的机器、仓库的物资与街市的需求必须放在同一张计划表上。我们将为不同局势确立经济动员规则，避免每次危机都从头协调。"
 PWC_FOCUS_LAW_ECONOMY_REFORM_EFFECTS: "70 天：§Y解锁§!：§G战时经济与总体战经济等级§!。"
 PWC_FOCUS_LAW_EMERGENCY_POWERS: "紧急状态授权法"
 PWC_FOCUS_LAW_EMERGENCY_POWERS_DESC: "常规程序未必足以应对迫近的危机。我们将规定紧急授权的适用范围与责任，使城市在非常时期仍能以明确的法令行动。"
 PWC_FOCUS_LAW_EMERGENCY_POWERS_EFFECTS: "35 天：战争支持度 +3%；动员速度 +10%。"
 PWC_FOCUS_LAW_OVERSIGHT_COMMITTEE: "监察委员会"
 PWC_FOCUS_LAW_OVERSIGHT_COMMITTEE_DESC: "当权力迅速扩张，监督不能只靠自觉。我们将设立专门的监察机构，使公款、任命与行政命令都经得起追问。"
 PWC_FOCUS_LAW_OVERSIGHT_COMMITTEE_EFFECTS: "35 天：每日政治点数获取 +0.03；外部势力颠覆活动 -10%。"
 PWC_FOCUS_LAW_TRADE_REFORM: "贸易管制改革"
 PWC_FOCUS_LAW_TRADE_REFORM_DESC: "城市需要外来的原料，也必须守住维持自身运转的物资。我们要明确贸易开放与出口管制的权限，让商路和储备不再彼此牵制。"
 PWC_FOCUS_LAW_TRADE_REFORM_EFFECTS: "70 天：§Y解锁§!：§G限制出口与战时统制等级§!。"
 PWC_FOCUS_MIL_AIR_CAS_COMMAND: "对地航空司令部"
 PWC_FOCUS_MIL_AIR_CAS_COMMAND_DESC: "航空力量只有理解地面部队的处境，才能形成真正的支援。我们将建立专门的协调机构，让空地联络进入每一次作战筹划。"
 PWC_FOCUS_MIL_AIR_CAS_COMMAND_EFFECTS: "35 天：空军经验 +25；解锁 $PWC_MIO_GROUND_ATTACK$；一次性 空军科技 +25%。"
 PWC_FOCUS_MIL_AIR_DENIAL: "空域拒止"
 PWC_FOCUS_MIL_AIR_DENIAL_DESC: "守住空域需要持续的警戒与任务组织。我们将把空中防务作为完整的城市防御工作，协调飞行、观察与地面指挥之间的责任。"
 PWC_FOCUS_MIL_AIR_DENIAL_EFFECTS: "我们的飞行员首先要让敌人付出进入本土空域的代价。空中力量将优先用于截击，而非远方目标。\n\n35 天：空军经验 +10；§Y解锁§!：§G分层空域拒止§!；每日指挥点数增长 +0.05；截击任务效率 +5%。"
 PWC_FOCUS_MIL_AIR_DRONE_PROGRAM: "无人机项目"
 PWC_FOCUS_MIL_AIR_DRONE_PROGRAM_DESC: "无人平台让我们重新思考飞行任务与人员风险之间的关系。我们要把操控、数据链和任务设备作为一项完整的航空工程来发展。"
 PWC_FOCUS_MIL_AIR_DRONE_PROGRAM_EFFECTS: "35 天：解锁 $PWC_MIO_UNMANNED$；一次性 空军科技 +25%。"
 PWC_FOCUS_MIL_AIR_JOINT_STRIKE: "联合打击航空"
 PWC_FOCUS_MIL_AIR_JOINT_STRIKE_DESC: "航空打击需要与地面和其他空中任务共享目标与时间安排。我们将建立联合筹划，使每支力量都能理解自己在整体行动中的位置。"
 PWC_FOCUS_MIL_AIR_JOINT_STRIKE_EFFECTS: "我们要让航空兵参与地面战役的设计，而不是在战斗开始后才去寻找目标。防空任务必须作出让步。\n\n35 天：空军经验 +10；§Y解锁§!：§G前沿联合打击§!；每日指挥点数增长 +0.05；对地攻击效能 +10%。"
 PWC_FOCUS_MIL_AIR_WING: "空军联队"
 PWC_FOCUS_MIL_AIR_WING_DESC: "没有组织的飞机只能完成零散的任务。我们将把飞行员、地勤与指挥人员编成稳定的联队，让城市拥有持续运用航空力量的能力。"
 PWC_FOCUS_MIL_AIR_WING_EFFECTS: "35 天：空军经验 +25；解锁 $PWC_MIO_AIR_SUPERIORITY$；§Y解锁§!：§G纵深体系打击、空地协同体系、分层防空体系、空军参谋课程§!。"
 PWC_FOCUS_MIL_AMBUSH_FLOTILLAS: "伏击舰队"
 PWC_FOCUS_MIL_AMBUSH_FLOTILLAS_DESC: "小型舰队的行动尤其依赖准备、协同与明确的退出安排。我们将把近海作战经验整理为共同方法，而不让各舰只凭临场判断。"
 PWC_FOCUS_MIL_AMBUSH_FLOTILLAS_EFFECTS: "我们的舰队将在有利海域集中出击，不以远洋决战为目标。伏击窗口之外，船只必须回港整补。\n\n35 天：海军经验 +10；§Y解锁§!：§G海军学说研习、近海伏击§!；袭击运输船任务效率 +5%；鱼雷命中率 +10%。"
 PWC_FOCUS_MIL_APEX_CITY_MARSHAL: "统一军事指挥"
 PWC_FOCUS_MIL_APEX_CITY_MARSHAL_DESC: "各部队需要统一的指挥关系和明确的职责分工。我们将健全最高指挥机构与参谋制度，统筹作战计划和后勤调度，使各军种能够依照共同部署行动。"
 PWC_FOCUS_MIL_APEX_CITY_MARSHAL_EFFECTS: "70 天：授予 1 名元帅；计划速度 +5%；最大指挥点数 +50；每日指挥点数增长 +0.1。"
 PWC_FOCUS_MIL_ARMAMENTS_STANDARDIZATION: "战备物资统筹"
 PWC_FOCUS_MIL_ARMAMENTS_STANDARDIZATION_DESC: "战备物资若在各部门账上各有一种算法，部队便难以知道自己真正拥有些什么。我们要统一登记与调配，让装备准备形成共同秩序。"
 PWC_FOCUS_MIL_ARMAMENTS_STANDARDIZATION_EFFECTS: "我们的仓库不该只按账目分类，而要按下一场战役的消耗来组织。储备不是免费的产能。\n\n35 天：陆军经验 +10；§Y解锁§!：§G战备库存整顿§!；生产效率上限 +5%；补给卡车损耗 -5%。"
 PWC_FOCUS_MIL_BATTLEFIELD_INTERDICTION: "战场遮断"
 PWC_FOCUS_MIL_BATTLEFIELD_INTERDICTION_DESC: "战场不仅包含正在交火的地段，也包含支撑交战的道路与流动。我们将把这些联系纳入航空筹划，让任务服务于整场战役的判断。"
 PWC_FOCUS_MIL_BATTLEFIELD_INTERDICTION_EFFECTS: "我们要打断敌军进入战场的节奏。持续出动会磨损飞机和机组，战役窗口之后必须整补。\n\n35 天：空军经验 +10；§Y解锁§!：§G空军学说研习、战场遮断行动§!；近距支援任务效率 +10%；对地攻击效能 +10%。"
 PWC_FOCUS_MIL_COASTAL_SENSOR_LINE: "沿岸感知线"
 PWC_FOCUS_MIL_COASTAL_SENSOR_LINE_DESC: "沿岸各处的观察只有互相连接，才能形成完整的海面警戒。我们要建立共同报告程序，让港口与海岸哨位使用同一张态势图景。"
 PWC_FOCUS_MIL_COASTAL_SENSOR_LINE_EFFECTS: "我们的岸哨和舰艇必须看到同一片海。集中侦察能减少盲目出航，却不能代替真正的船只。\n\n35 天：海军经验 +10；§Y解锁§!：§G沿岸警戒§!；海军探测 +5%；索敌速度 +3%。"
 PWC_FOCUS_MIL_COMBINED_ARMS: "诸兵种合成"
 PWC_FOCUS_MIL_COMBINED_ARMS_DESC: "步兵、装甲与火力支援各自为战，只会浪费彼此的优势。我们要建立共同的指挥和联络方式，使不同兵种能够围绕同一目标行动。"
 PWC_FOCUS_MIL_COMBINED_ARMS_EFFECTS: "35 天：授予 1 名陆军将领；解锁 $PWC_MIO_FIREPOWER$；陆军师攻击 +5%；协同性 +5%。"
 PWC_FOCUS_MIL_CONVOY_COMMAND: "护航司令部"
 PWC_FOCUS_MIL_CONVOY_COMMAND_DESC: "护航需要商船、军舰与港口之间持续而清晰的协调。我们将设立统一的组织渠道，使不同航次能够遵循共同的准备和联络程序。"
 PWC_FOCUS_MIL_CONVOY_COMMAND_EFFECTS: "我们要按航线而不是按港口各自安排护航。集中护卫也意味着放弃同时四处袭扰的幻想。\n\n35 天：海军经验 +10；§Y解锁§!：§G集中护航§!；护航效率 +5%；舰队协同性 +5%。"
 PWC_FOCUS_MIL_COUNTERSTROKE: "战役反突击"
 PWC_FOCUS_MIL_COUNTERSTROKE_DESC: "反击需要指挥部看清局势，也需要部队具备共同的准备。我们将整理战役反突击的组织方法，使预备力量能够围绕明确的时机行动。"
 PWC_FOCUS_MIL_COUNTERSTROKE_EFFECTS: "我们等待的不是奇迹，而是敌人用尽进攻节奏的时刻。预备队投入之后，便不能再替下一场危机兜底。\n\n35 天：陆军经验 +10；§Y解锁§!：§G预备队反突击§!；突破 +5%；陆军组织度恢复 +10%。"
 PWC_FOCUS_MIL_DEEP_EXPLOITATION: "纵深穿插"
 PWC_FOCUS_MIL_DEEP_EXPLOITATION_DESC: "突破之后的道路往往比最初的接触线更难判断。我们要让穿插部队与后续力量保持联系，使深入敌后的行动始终有明确的任务与归属。"
 PWC_FOCUS_MIL_DEEP_EXPLOITATION_EFFECTS: "缺口不是胜利本身。我们要在敌军恢复秩序之前切断其联系，但绝不把油料和补给当成无限资源。\n\n35 天：陆军经验 +10；§Y解锁§!：§G纵深穿插战役§!；突破 +5%；陆军组织度恢复 +10%。"
 PWC_FOCUS_MIL_DEFENSE_CORPS: "城防军团"
 PWC_FOCUS_MIL_DEFENSE_CORPS_DESC: "城市的防务不能只靠各街区临时拼凑的武装。我们要将守备力量编入统一指挥的军团，使每一段防线都有明确的责任。"
 PWC_FOCUS_MIL_DEFENSE_CORPS_EFFECTS: "35 天：陆军师组织度 +5%；增援率 +1%；§Y解锁§!：§G分布式机动指挥、联合火力网络、战役统筹、分层国土防御§!。"
 PWC_FOCUS_MIL_DEFENSE_IN_DEPTH: "纵深防御"
 PWC_FOCUS_MIL_DEFENSE_IN_DEPTH_DESC: "前沿阵地只是防御体系的一部分。我们将共同规划后续阵地、交通与部队衔接，使一次局部受挫不至于让整条防线失去方向。"
 PWC_FOCUS_MIL_DEFENSE_IN_DEPTH_EFFECTS: "我们的防御不能在第一道阵地失守后就结束。交通壕、后备阵地与轮换命令必须相互接续。\n\n35 天：陆军经验 +10；§Y解锁§!：§G纵深阵地轮换§!；增援率 +2%；堑壕上限 +5%。"
 PWC_FOCUS_MIL_DELIBERATE_BREAKTHROUGH: "有限目标突破"
 PWC_FOCUS_MIL_DELIBERATE_BREAKTHROUGH_DESC: "每一次进攻都应当知道自己要打开哪一段局面。我们将以明确目标、周密准备与及时整顿组织突破，而不是让部队在不清楚的命令中无限推进。"
 PWC_FOCUS_MIL_DELIBERATE_BREAKTHROUGH_EFFECTS: "我们宁可明确突破到哪里、何时停下，也不把全线突击当作计划。缓慢集结将换来有限的优势窗口。\n\n35 天：陆军经验 +10；§Y解锁§!：§G有限目标攻势§!；突破 +5%；计划加成上限 +3%。"
 PWC_FOCUS_MIL_DISPERSED_AIRBASES: "分散机场"
 PWC_FOCUS_MIL_DISPERSED_AIRBASES_DESC: "航空力量不能把所有日常工作都寄托在单一场站。我们将组织分散驻地的联络、地勤与调度，使航空单位能够在不同地点维持共同秩序。"
 PWC_FOCUS_MIL_DISPERSED_AIRBASES_EFFECTS: "我们要让跑道受损不再意味着整支联队沉默。疏散、维修与备降也会占用日常出动能力。\n\n35 天：空军经验 +10；§Y解锁§!：§G机场疏散§!；空军事故几率 -5%；空域防卫效率 +10%。"
 PWC_FOCUS_MIL_ELASTIC_OPERATIONS: "弹性防御"
 PWC_FOCUS_MIL_ELASTIC_OPERATIONS_DESC: "防御不等于在每一个地点都拒绝移动。我们要让阵地、预备队与有计划的机动相互配合，在保存组织的前提下应对敌人的压力。"
 PWC_FOCUS_MIL_ELASTIC_OPERATIONS_EFFECTS: "我们守的是军队的秩序和城市的生存，不是每一寸无从支援的前沿。把预备队留给真正的危机。\n\n35 天：陆军经验 +10；§Y解锁§!：§G纵深弹性防御§!；每日指挥点数增长 +0.05；陆军师组织度恢复速率 +5%。"
 PWC_FOCUS_MIL_EXPEDITIONARY_SUPPORT: "远征保障"
 PWC_FOCUS_MIL_EXPEDITIONARY_SUPPORT_DESC: "离开本地港口后，舰队仍需要能够依靠的保障组织。我们要把远征中的物资、维修与人员安排纳入出航之前的完整计划。"
 PWC_FOCUS_MIL_EXPEDITIONARY_SUPPORT_EFFECTS: "我们的登陆计划必须从海上补给和撤收条件开始。把三个军种的时刻表协调起来，远征才不是赌博。\n\n35 天：海军经验 +10；§Y解锁§!：§G海军学说研习、登陆保障窗口§!；两栖登陆速度 +3%；登陆准备速度 +5%。"
 PWC_FOCUS_MIL_FIELD_WORKSHOPS: "野战修理所"
 PWC_FOCUS_MIL_FIELD_WORKSHOPS_DESC: "损坏的器材并不总能送回城市的大工厂。我们将组织贴近部队的野战维修，让检查、备件和修理经验能够随行动一道展开。"
 PWC_FOCUS_MIL_FIELD_WORKSHOPS_EFFECTS: "我们的装备不该因一个零件离开战场。抽调后方产能建立前线修理网，才能减少战役中的损耗。\n\n35 天：陆军经验 +10；§Y解锁§!：§G野战抢修§!；陆军师损耗 -5%；陆军组织度恢复 +10%。"
 PWC_FOCUS_MIL_FIREPOWER_OPERATIONS: "联合火力"
 PWC_FOCUS_MIL_FIREPOWER_OPERATIONS_DESC: "分散的火力无法自行组成一场战役。我们将协调观察、通信与射击筹划，让不同武器围绕同一套作战安排共同工作。"
 PWC_FOCUS_MIL_FIREPOWER_OPERATIONS_EFFECTS: "我们的火力必须打在已经确认的目标上。让侦察、校射、炮兵与步兵依同一节奏推进。\n\n35 天：陆军经验 +10；§Y解锁§!：§G侦察与联合火力§!；每日指挥点数增长 +0.05；侦查 +5%。"
 PWC_FOCUS_MIL_FORWARD_AIR_CONTROL: "前沿航空管制"
 PWC_FOCUS_MIL_FORWARD_AIR_CONTROL_DESC: "前沿部队最了解眼前的局势，却未必能把需求准确传给空中。我们将规范空地联络，让现场观察与航空任务使用能够相互理解的程序。"
 PWC_FOCUS_MIL_FORWARD_AIR_CONTROL_EFFECTS: "我们的地面部队要能告诉飞行员需要什么，而不只是请求更多飞机。前沿管制将把这种联系常态化。\n\n35 天：空军经验 +10；§Y解锁§!：§G近距支援集中出动§!；近距支援任务效率 +10%；对地攻击效能 +10%。"
 PWC_FOCUS_MIL_INFANTRY_DOCTRINE: "步兵操典"
 PWC_FOCUS_MIL_INFANTRY_DOCTRINE_DESC: "共同的操典使来自不同街区的士兵能够彼此理解。我们将整理步兵训练与作战经验，让班排之间的配合不再只凭个人习惯。"
 PWC_FOCUS_MIL_INFANTRY_DOCTRINE_EFFECTS: "35 天：陆军经验 +20；解锁 $PWC_MIO_INFANTRY$。"
 PWC_FOCUS_MIL_INTERCEPTION_NETWORK: "截击网"
 PWC_FOCUS_MIL_INTERCEPTION_NETWORK_DESC: "截击行动始于警戒信息，而不是飞机离地的一刻。我们将把观察、指挥与飞行任务衔接起来，让空中的行动建立在共同的判断之上。"
 PWC_FOCUS_MIL_INTERCEPTION_NETWORK_EFFECTS: "我们的雷达、观察哨和待命联队必须在同一条指挥链上。敌人的集中出动应当遭遇集中的回应。\n\n35 天：空军经验 +10；§Y解锁§!：§G空军学说研习、集中截击§!；截击探测能力 +5%；截击任务效率 +5%。"
 PWC_FOCUS_MIL_JOINT_OPERATIONS: "联合战役指挥"
 PWC_FOCUS_MIL_JOINT_OPERATIONS_DESC: "同一场战役中的不同军兵种，必须理解彼此的时间表与能力边界。我们将建立联合筹划程序，使共同目标能够转化为相互衔接的行动。"
 PWC_FOCUS_MIL_JOINT_OPERATIONS_EFFECTS: "我们要把地面的突破、空中的出动与海上的保障写进同一张时间表。联合指挥也意味着共同整补。\n\n35 天：陆军经验 +10；§Y解锁§!：§G联合战役窗口§!；最大指挥点数 +40；协同性 +5%。"
 PWC_FOCUS_MIL_LITTORAL_DENIAL: "近海拒止"
 PWC_FOCUS_MIL_LITTORAL_DENIAL_DESC: "近海水域的防务需要利用本地航道与沿岸保障。我们将围绕熟悉的海面组织舰艇行动，使有限的海上力量拥有清晰的任务边界。"
 PWC_FOCUS_MIL_LITTORAL_DENIAL_EFFECTS: "我们不必拥有每一片海面，只需让敌人无法轻易靠岸。轻型舰队将依托岸上感知组织伏击。\n\n35 天：海军经验 +10；§Y解锁§!：§G近海轻舰拒止§!；每日指挥点数增长 +0.05；舰队协同性 +5%。"
 PWC_FOCUS_MIL_LOGISTICS_COMMAND: "后勤指挥部"
 PWC_FOCUS_MIL_LOGISTICS_COMMAND_DESC: "前线的一切行动，都依赖后方有人把物资准确送到。我们要为运输、仓储与维修建立统一指挥，让补给不再是作战计划的附录。"
 PWC_FOCUS_MIL_LOGISTICS_COMMAND_EFFECTS: "35 天：授予 1 名陆军将领；解锁 $PWC_MIO_LOGISTICS$；补给消耗 -10%；补给卡车损耗 -5%。"
 PWC_FOCUS_MIL_MECHANIZED_INITIATIVE: "机械化倡议"
 PWC_FOCUS_MIL_MECHANIZED_INITIATIVE_DESC: "机械化不是简单地给步兵添置车辆。我们要让装甲平台、维修力量和步兵行动共同规划，使新的装备真正融入部队的组织。"
 PWC_FOCUS_MIL_MECHANIZED_INITIATIVE_EFFECTS: "35 天：解锁 $PWC_MIO_ARMOR$；一次性 装甲科技 +25%。"
 PWC_FOCUS_MIL_MEDICAL_EVACUATION: "战地后送体系"
 PWC_FOCUS_MIL_MEDICAL_EVACUATION_DESC: "伤员后送不能依赖战斗结束后的临时安排。我们要把救护、转运与后方接收组织成连续的工作，使前线知道伤员将被送往何处。"
 PWC_FOCUS_MIL_MEDICAL_EVACUATION_EFFECTS: "我们的救护、后送与补充部队必须有连续的交接。恢复组织比宣称人力无穷更有价值。\n\n35 天：陆军经验 +10；§Y解锁§!：§G伤员后送与整顿§!；陆军师组织度恢复速率 +5%；陆军师训练时间 -5%。"
 PWC_FOCUS_MIL_MOBILE_OPERATIONS: "纵深机动"
 PWC_FOCUS_MIL_MOBILE_OPERATIONS_DESC: "机动不只是更快抵达一个地点，而是在变化的局势中保持部队的组织。我们要让侦察、行军与后续行动围绕纵深作战共同筹划。"
 PWC_FOCUS_MIL_MOBILE_OPERATIONS_EFFECTS: "我们不必在敌人最坚固的阵地证明勇气。找到缺口、集中力量、向纵深推进，补给必须跟得上。\n\n35 天：陆军经验 +10；§Y解锁§!：§G纵深机动作战§!；每日指挥点数增长 +0.05；陆军师速度 +10%。"
 PWC_FOCUS_MIL_MOBILE_RESERVES: "机动预备队"
 PWC_FOCUS_MIL_MOBILE_RESERVES_DESC: "能够及时行动的预备队，需要在平时就明确道路、联络与任务准备。我们将把机动力量组织成可由指挥部统一调度的战役手段。"
 PWC_FOCUS_MIL_MOBILE_RESERVES_EFFECTS: "我们的预备队必须是一把能迅速出鞘的刀。集中机动力量的代价，是其他地段暂时变薄。\n\n35 天：陆军经验 +10；§Y解锁§!：§G集中机动预备队§!；陆军组织度恢复 +10%；增援率 +2%。"
 PWC_FOCUS_MIL_NAVAL_COMMAND: "海军司令部"
 PWC_FOCUS_MIL_NAVAL_COMMAND_DESC: "分散在不同港口的舰艇，需要清晰而持久的统一指挥。我们将建立海军司令部，把巡航、交战与保障纳入完整的海上计划。"
 PWC_FOCUS_MIL_NAVAL_COMMAND_EFFECTS: "35 天：海军经验 +25；授予 1 名海军将领；舰队协同性 +5%；海军探测 +5%。"
 PWC_FOCUS_MIL_NAVAL_EXPANSION: "海军扩军案"
 PWC_FOCUS_MIL_NAVAL_EXPANSION_DESC: "最初的舰队已不足以应对更复杂的海上任务。我们要为新舰艇配齐人员、训练与保障，使扩军不是一份只有船名的清单。"
 PWC_FOCUS_MIL_NAVAL_EXPANSION_EFFECTS: "35 天：海军经验 +25；解锁 $PWC_MIO_SUBMARINE$；授予 1 名海军将领。"
 PWC_FOCUS_MIL_NAVAL_PROGRAM: "海军建设计划"
 PWC_FOCUS_MIL_NAVAL_PROGRAM_DESC: "水面不是城市防务的边缘，而是另一条需要守卫的通道。我们要建立海军建设计划，使舰艇、船员与指挥机构能够一起成长。"
 PWC_FOCUS_MIL_NAVAL_PROGRAM_EFFECTS: "35 天：海军经验 +25；解锁 $PWC_MIO_SURFACE_NAVAL$；授予 1 名海军将领；§Y解锁§!：§G海上交通线控制、近海分散拒止、远海联合保障、海军参谋课程§!。"
 PWC_FOCUS_MIL_OFFICER_ACADEMY: "军官学校"
 PWC_FOCUS_MIL_OFFICER_ACADEMY_DESC: "军官不应只在战场上第一次学习如何指挥。我们要建立军事教育的共同场所，让地图、演习和实战经验成为同一套培养体系。"
 PWC_FOCUS_MIL_OFFICER_ACADEMY_EFFECTS: "35 天：授予 2 名陆军将领；陆军经验 +25；陆军经验获取 +5%；每日指挥点数增长 +0.1。"
 PWC_FOCUS_MIL_OPERATIONAL_INTELLIGENCE: "战役情报处"
 PWC_FOCUS_MIL_OPERATIONAL_INTELLIGENCE_DESC: "前线消息只有经过核验和整理，才能进入可靠的判断。我们要建立战役情报工作，把各单位看到的片段连接成能够支持指挥的局势。"
 PWC_FOCUS_MIL_OPERATIONAL_INTELLIGENCE_EFFECTS: "我们不能把每次接触都当成主攻。侦察、监听与战况复核必须进入同一张作战图。\n\n35 天：陆军经验 +10；§Y解锁§!：§G战场侦察§!；陆军情报 +5%；索敌速度 +5%。"
 PWC_FOCUS_MIL_RESERVE_SYSTEM: "战役预备队"
 PWC_FOCUS_MIL_RESERVE_SYSTEM_DESC: "预备队不是从战线上临时抽走的几个单位。我们将明确其集结、待命与投入程序，让指挥部始终保有应对局势变化的组织手段。"
 PWC_FOCUS_MIL_RESERVE_SYSTEM_EFFECTS: "我们不会把最后一支部队同时押上火线。轮换表与集结地域必须和防御计划一样明确。\n\n35 天：陆军经验 +10；§Y解锁§!：§G战线轮换§!；陆军组织度恢复 +10%；陆军师组织度恢复速率 +5%。"
 PWC_FOCUS_MIL_SEA_CONTROL: "海上交通线"
 PWC_FOCUS_MIL_SEA_CONTROL_DESC: "海上交通线关系着城市与外界的长期联系。我们将围绕航路、护航与持续保障组织舰队工作，使海上通行成为可以维持的公共秩序。"
 PWC_FOCUS_MIL_SEA_CONTROL_EFFECTS: "我们的海军首先要保证人员和物资抵达目的地。护航任务将得到优先编组与训练。\n\n35 天：海军经验 +10；§Y解锁§!：§G海上交通线护卫§!；每日指挥点数增长 +0.05；护航效率 +5%。"
 PWC_FOCUS_MIL_SENSOR_SHOOTER_NETWORK: "侦察校射网"
 PWC_FOCUS_MIL_SENSOR_SHOOTER_NETWORK_DESC: "发现目标与组织射击之间不能隔着迟缓而混乱的传话。我们要建立侦察和校射的固定联络方式，让观察结果能够被准确理解和使用。"
 PWC_FOCUS_MIL_SENSOR_SHOOTER_NETWORK_EFFECTS: "我们的观察哨要能把坐标直接送到火力单位。减少重复报告，才能把时间留给真正的目标。\n\n35 天：陆军经验 +10；§Y解锁§!：§G校射与侦察协同§!；侦查 +3%；协同性 +5%。"
 PWC_FOCUS_MIL_STAFF_WARGAMES: "参谋兵棋"
 PWC_FOCUS_MIL_STAFF_WARGAMES_DESC: "战役不能等到命令发出后才发现组织上的漏洞。我们将让参谋人员通过兵棋推演检验计划，在地图与讨论中先面对那些可能到来的难题。"
 PWC_FOCUS_MIL_STAFF_WARGAMES_EFFECTS: "我们要让命令在沙盘上先走一遍，再让士兵跨过真正的火线。统一的参谋课程将把经验变成制度。\n\n35 天：陆军经验 +10；§Y解锁§!：§G陆军参谋课程、陆军学说研习§!；最大指挥点数 +30；增援率 +2%。"
 PWC_FOCUS_MIL_URBAN_FORTIFICATION: "城市要塞化"
 PWC_FOCUS_MIL_URBAN_FORTIFICATION_DESC: "街道、桥梁与重要设施必须被纳入完整的防御计划。我们将利用城市本身的结构组织阵地，而不是等到敌人出现时才仓促设障。"
 PWC_FOCUS_MIL_URBAN_FORTIFICATION_EFFECTS: "35 天：首都新增 1 座地堡；陆军师核心领土防御 +5%；§Y解锁§!：§G反突击防御§!。"
 PWC_FOCUS_PANEL_ENDGAME_LABEL: "终局路线"
 PWC_FOCUS_PANEL_ENDGAME_STATUS: "[PWCGetFocusPanelEndgameStatus]"
 PWC_FOCUS_PANEL_ENDGAME_TT: "$PWC_FOCUS_PANEL_MUTEX_BODY$"
 PWC_FOCUS_PANEL_GATE: "科研门槛"
 PWC_FOCUS_PANEL_GATE_BODY: "§Y第四研究槽的建筑条件§!\n地区：§Y我方拥有且完全控制§!\n科技中心：§Y至少两级未受损建筑§!\n各地区的等级分别检查，受损等级不计入门槛。"
 PWC_FOCUS_PANEL_GATE_LABEL: "第四槽建筑条件"
 PWC_FOCUS_PANEL_GATE_STATUS: "[PWCGetFocusPanelGateStatus]"
 PWC_FOCUS_PANEL_GATE_SUMMARY: "第四研究槽需要自有且完全控制的地区保有至少两级未受损科技中心。"
 PWC_FOCUS_PANEL_GATE_TT: "$PWC_FOCUS_PANEL_GATE_BODY$"
 PWC_FOCUS_PANEL_GEO: "地理路线"
 PWC_FOCUS_PANEL_GEO_BODY: "开局可保留本城地理路线，或改用通用城市协作路线；本局不再改变。"
 PWC_FOCUS_PANEL_GEO_LABEL: "本城地理"
 PWC_FOCUS_PANEL_GEO_STATUS: "[PWCGetFocusPanelGeoStatus]"
 PWC_FOCUS_PANEL_GEO_SUMMARY: "开局可保留本城地理路线，或改用通用城市协作路线；本局不再改变。"
 PWC_FOCUS_PANEL_GEO_TT: "$PWC_FOCUS_PANEL_GEO_BODY$"
 PWC_FOCUS_PANEL_GUIDE: "开局说明"
 PWC_FOCUS_PANEL_GUIDE_TT: "查看版本、声明、MOD 玩法与特色建筑。"
 PWC_FOCUS_PANEL_MUTEX: "国防专精与终局"
 PWC_FOCUS_PANEL_MUTEX_BODY: "陆军 3 选 1，海军 2 选 1，空军 2 选 1；三军可兼修。终局 4 选 1。"
 PWC_FOCUS_PANEL_MUTEX_SUMMARY: "陆军 3 选 1，海军 2 选 1，空军 2 选 1；三军可兼修。终局 4 选 1。"
 PWC_FOCUS_PANEL_PROGRESS_TEXT: "已完成 [?pwc_var_focus_done|0] 个焦点"
 PWC_FOCUS_PANEL_PROGRESS_TT: "按单城最多可完成的焦点数计算进度。"
 PWC_FOCUS_PANEL_REWARD: "焦点精神"
 PWC_FOCUS_PANEL_REWARD_BODY: "同类焦点精神合并显示，后续奖励累计更新；终局精神独立保留。"
 PWC_FOCUS_PANEL_REWARD_SUMMARY: "同类焦点精神合并显示，后续奖励累计更新；终局精神独立保留。"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_DEFENSIVE_DOCTRINE: "防御主义"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_INTEGRATION_CHARTER: "整合宪章"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_OFFENSIVE_DOCTRINE: "进攻主义"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_PENDING: "未达成"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_TECHNOLOGICAL_SUPREMACY: "科技至上"
 PWC_FOCUS_PANEL_STATUS_GATE_MET: "已满足"
 PWC_FOCUS_PANEL_STATUS_GATE_UNMET: "未满足"
 PWC_FOCUS_PANEL_STATUS_GEO_COASTAL: "沿海"
 PWC_FOCUS_PANEL_STATUS_GEO_FRONTIER: "边疆"
 PWC_FOCUS_PANEL_STATUS_GEO_GENERIC: "通用"
 PWC_FOCUS_PANEL_STATUS_GEO_INLAND: "内陆"
 PWC_FOCUS_PANEL_STATUS_GEO_ISLAND: "岛屿"
 PWC_FOCUS_PANEL_TITLE: "焦点"
 PWC_FOCUS_WAR_ACCESS_AGREEMENTS: "通行协定网络"
 PWC_FOCUS_WAR_ACCESS_AGREEMENTS_DESC: "跨境调动需要周密的接洽与运输安排。我们将统一通行联络、行军计划和沿途补给的办事程序，使部队能在既有协定下有序行动。"
 PWC_FOCUS_WAR_ACCESS_AGREEMENTS_EFFECTS: "35 天：补给消耗 -5%；陆军师速度 +5%。"
 PWC_FOCUS_WAR_DIPLOMATIC_CORPS: "外交使团"
 PWC_FOCUS_WAR_DIPLOMATIC_CORPS_DESC: "可靠的使者不仅传递口信，也代表城市的承诺。我们将培养常设外交人员，使与邻城的往来能够跨越一时的猜疑与误解。"
 PWC_FOCUS_WAR_DIPLOMATIC_CORPS_EFFECTS: "35 天：§Y解锁§!：§G派遣使团与邀请援军决议（每次战争限一名和平城市援军）§!。"
 PWC_FOCUS_WAR_ESTABLISH_AGENCY: "组建情报机构"
 PWC_FOCUS_WAR_ESTABLISH_AGENCY_DESC: "在外交网络的基础上建立专门的情报机构，负责收集情报、保护通信与开展秘密行动。"
 PWC_FOCUS_WAR_ESTABLISH_AGENCY_EFFECTS: "在外交网络的基础上建立专门的情报机构，负责收集情报与开展秘密行动。\n\n35 天：§Y允许§!§G创建情报机构§!。"
 PWC_FOCUS_WAR_FOREIGN_OFFICE: "外事办公室"
 PWC_FOCUS_WAR_FOREIGN_OFFICE_DESC: "邻城之间的关系不能只由边境上的偶遇决定。我们要建立专门的外事机构，以有记录、有责任的交涉代替临时传话。"
 PWC_FOCUS_WAR_FOREIGN_OFFICE_EFFECTS: "35 天：政治点数 +25；改善关系持续花费 -10%；改善关系获得的评价 +10%。"
 PWC_FOCUS_WAR_INTELLIGENCE_BUREAU: "情报局"
 PWC_FOCUS_WAR_INTELLIGENCE_BUREAU_DESC: "重要的判断不能建立在街头流言之上。我们将集中整理情报来源、核验消息并保护通信，使城市能够在迷雾中作出自己的决定。"
 PWC_FOCUS_WAR_INTELLIGENCE_BUREAU_EFFECTS: "35 天：民政情报 +5%；陆军情报 +5%。"
 PWC_FOCUS_WAR_NAP_FRAMEWORK: "互不侵犯框架"
 PWC_FOCUS_WAR_NAP_FRAMEWORK_DESC: "互不侵犯的承诺只有形成共同理解，才能减少边境上的误判。我们将整理协商与通报程序，为相邻城市保留一条和平相处的道路。"
 PWC_FOCUS_WAR_NAP_FRAMEWORK_EFFECTS: "35 天：稳定度 +3%；敌方正当化战争目标所需时间 +10%。"
 PWC_FOCUS_WAR_OCCUPATION_AUTHORITY: "占领管理局"
 PWC_FOCUS_WAR_OCCUPATION_AUTHORITY_DESC: "接管一座城市并不意味着治理已经完成。我们要建立专门的占领管理机构，处理秩序、登记与公共服务，使军事接管能够转向日常行政。"
 PWC_FOCUS_WAR_OCCUPATION_AUTHORITY_EFFECTS: "35 天：顺从度增长速度 +3%；驻军需求 -5%。"
 PWC_FOCUS_WAR_PROPAGANDA_OFFICE: "宣传办公室"
 PWC_FOCUS_WAR_PROPAGANDA_OFFICE_DESC: "城市需要知道自己为何承受困难，也需要听得懂政府的目标。我们将统一公共传播，把零散的告示组织成能够持续说明局势的声音。"
 PWC_FOCUS_WAR_PROPAGANDA_OFFICE_EFFECTS: "35 天：战争支持度 +3%；防御战稳定度 +5%。"
 PWC_FOCUS_WAR_WAR_ROOM: "战争室"
 PWC_FOCUS_WAR_WAR_ROOM_DESC: "分散的战报与互相冲突的命令，必须在一处被整理成完整的局势。我们要让战争室成为指挥、参谋与后勤共同工作的中枢。"
 PWC_FOCUS_WAR_WAR_ROOM_EFFECTS: "35 天：计划加成上限 +3%；每日指挥点数增长 +0.1。"
 PWC_LAW_CONSCRIPTION: "征兵法"
 PWC_LAW_CONSCRIPTION_DESC: "兵役制度界定居民在城市防务中的责任，也划定社会日常生活与军队需求之间的边界。不同征集方式反映了城市对局势的不同判断。"
 PWC_LAW_CONSCRIPTION_EFFECTS: "共 5 级，开局处于第 1 级；逐级升级费用 75/100/150/200 政治点。更高等级需要先完成对应改革焦点。"
 PWC_LAW_CONSCRIPTION_L1: "志愿兵役"
 PWC_LAW_CONSCRIPTION_L1_DESC: "军队主要由自愿从军者组成。城市依靠职业与志愿服务维持防务，大多数居民仍留在原有的生产和生活岗位上。"
 PWC_LAW_CONSCRIPTION_L1_EFFECTS: "初始等级：可征募人口比例 +1.5%、稳定度 +10%。"
 PWC_LAW_CONSCRIPTION_L2: "有限征召"
 PWC_LAW_CONSCRIPTION_L2_DESC: "城市开始有计划地征集适龄居民，同时保留必要的豁免与民生安排。兵役不再只是一项个人选择，而成为有限度的公共责任。"
 PWC_LAW_CONSCRIPTION_L2_EFFECTS: "第 2 级：可征募人口比例 +2.5%、稳定度 +5%。升级到本级需要 75 政治点、10% 战争支持度。"
 PWC_LAW_CONSCRIPTION_L3: "扩大征召"
 PWC_LAW_CONSCRIPTION_L3_DESC: "征集范围进一步扩大，更多家庭需要适应成员离开原有岗位的生活。行政与军队必须共同处理兵员补充和社会运转之间的张力。"
 PWC_LAW_CONSCRIPTION_L3_EFFECTS: "第 3 级：可征募人口比例 +5%、训练时间 +5%。升级到本级需要 100 政治点、30% 战争支持度。"
 PWC_LAW_CONSCRIPTION_L4: "全面征召"
 PWC_LAW_CONSCRIPTION_L4_DESC: "城市将兵役确立为普遍而迫切的责任。家庭、学校和工作场所都必须围绕大规模征集重新安排自己的日常秩序。"
 PWC_LAW_CONSCRIPTION_L4_EFFECTS: "第 4 级：可征募人口比例 +10%、稳定度 -5%、训练时间 +10%、工厂产出 -5%、船坞产出 -5%。升级到本级需要 150 政治点、50% 战争支持度、对应改革焦点。"
 PWC_LAW_CONSCRIPTION_L5: "绝境动员"
 PWC_LAW_CONSCRIPTION_L5_DESC: "常规的兵役安排已让位于生存危机。城市动用最后的人力储备维持抵抗，许多原本不应中断的生活也被迫服从战争。"
 PWC_LAW_CONSCRIPTION_L5_EFFECTS: "第 5 级：可征募人口比例 +15%、稳定度 -10%、训练时间 +20%、工厂产出 -10%、船坞产出 -10%、建设速度 -10%。升级到本级需要 200 政治点、70% 战争支持度、对应改革焦点。"
 PWC_LAW_ECONOMY_MOBILIZATION: "经济动员法"
 PWC_LAW_ECONOMY_MOBILIZATION_DESC: "经济动员制度决定工厂、劳动力和物资如何在民生与战争之间分配。它规定的不是一时的产量目标，而是整个城市组织生产的方式。"
 PWC_LAW_ECONOMY_MOBILIZATION_EFFECTS: "共 5 级，开局处于第 2 级；逐级升级费用 75/100/150/200 政治点。更高等级需要先完成对应改革焦点。"
 PWC_LAW_ECONOMY_MOBILIZATION_L1: "民生经济"
 PWC_LAW_ECONOMY_MOBILIZATION_L1_DESC: "生产以居民生活和正常商业活动为中心。公共管理主要维持市场与服务的日常秩序，而不把整个经济置于战争指挥之下。"
 PWC_LAW_ECONOMY_MOBILIZATION_L1_EFFECTS: "第 1 级：生活消费品工厂基数 +30%、稳定度 +10%、民用工厂建造速度 +20%。"
 PWC_LAW_ECONOMY_MOBILIZATION_L2: "预备动员"
 PWC_LAW_ECONOMY_MOBILIZATION_L2_DESC: "城市保留民生经济的基本结构，同时开始准备应急产能与物资。各部门逐步学习如何在局势恶化时共同转入动员。"
 PWC_LAW_ECONOMY_MOBILIZATION_L2_EFFECTS: "初始等级：生活消费品工厂基数 +25%、民用工厂建造速度 +10%、军工厂建造速度 +10%、工厂产出 +5%、船坞产出 +5%。升级到本级需要 75 政治点、10% 战争支持度。"
 PWC_LAW_ECONOMY_MOBILIZATION_L3: "战前动员"
 PWC_LAW_ECONOMY_MOBILIZATION_L3_DESC: "战争准备开始影响主要的生产安排。城市提前协调工厂与建设任务，让关键行业能够在真正的紧急状态到来前完成衔接。"
 PWC_LAW_ECONOMY_MOBILIZATION_L3_EFFECTS: "第 3 级：生活消费品工厂基数 +20%、军工厂建造速度 +20%、工厂产出 +10%、船坞产出 +10%、建设速度 +5%。升级到本级需要 100 政治点、30% 战争支持度。"
 PWC_LAW_ECONOMY_MOBILIZATION_L4: "战时经济"
 PWC_LAW_ECONOMY_MOBILIZATION_L4_DESC: "战争需求成为经济调度的重要依据。工厂、建设与公共供给都必须纳入统一安排，民生和军需之间的每一次取舍都更加直接。"
 PWC_LAW_ECONOMY_MOBILIZATION_L4_EFFECTS: "第 4 级：生活消费品工厂基数 +15%、军工厂建造速度 +30%、工厂产出 +20%、船坞产出 +20%、建设速度 +10%。升级到本级需要 150 政治点、50% 战争支持度、对应改革焦点。"
 PWC_LAW_ECONOMY_MOBILIZATION_L5: "总体战经济"
 PWC_LAW_ECONOMY_MOBILIZATION_L5_DESC: "整个城市被组织成持续支撑战争的生产共同体。日常消费与企业自主安排让位于集中调度，经济生活几乎处处留下动员的痕迹。"
 PWC_LAW_ECONOMY_MOBILIZATION_L5_EFFECTS: "第 5 级：生活消费品工厂基数 +10%、军工厂建造速度 +40%、工厂产出 +30%、船坞产出 +30%、建设速度 +15%、稳定度 -10%。升级到本级需要 200 政治点、70% 战争支持度、对应改革焦点。"
 PWC_LAW_TRADE_CONTROL: "贸易管制法"
 PWC_LAW_TRADE_CONTROL_DESC: "贸易制度决定哪些资源留在城市、哪些进入外部交换。开放与管制之间的选择，也决定着城市如何面对外界的市场与风险。"
 PWC_LAW_TRADE_CONTROL_EFFECTS: "共 5 级，开局处于第 3 级；逐级升级费用 75/100/150/200 政治点。更高等级需要先完成对应改革焦点。"
 PWC_LAW_TRADE_CONTROL_L1: "自由贸易"
 PWC_LAW_TRADE_CONTROL_L1_DESC: "城市向外部交换保持广泛开放，商人和生产者拥有较大的交易空间。繁忙的联系也意味着本地供给更紧密地受到外部市场影响。"
 PWC_LAW_TRADE_CONTROL_L1_EFFECTS: "第 1 级：出口资源比例 +80%、科研速度 +15%、从石油获得的燃油 +10%、工厂产出 +20%、船坞产出 +20%、建设速度 +20%。"
 PWC_LAW_TRADE_CONTROL_L2: "扩大出口"
 PWC_LAW_TRADE_CONTROL_L2_DESC: "城市积极组织对外出售资源与产品，希望以稳定的商业往来维系外部联系。出口安排在资源分配中占据较为重要的位置。"
 PWC_LAW_TRADE_CONTROL_L2_EFFECTS: "第 2 级：出口资源比例 +65%、科研速度 +10%、从石油获得的燃油 +10%、工厂产出 +15%、船坞产出 +15%、建设速度 +15%。升级到本级需要 75 政治点、10% 战争支持度。"
 PWC_LAW_TRADE_CONTROL_L3: "均衡管制"
 PWC_LAW_TRADE_CONTROL_L3_DESC: "城市在外部交换与本地留用之间维持审慎平衡。贸易管理既不完全交给市场，也不把所有物资封闭在边界之内。"
 PWC_LAW_TRADE_CONTROL_L3_EFFECTS: "初始等级：出口资源比例 +50%、科研速度 +5%、工厂产出 +10%、船坞产出 +10%、建设速度 +10%。升级到本级需要 100 政治点、30% 战争支持度。"
 PWC_LAW_TRADE_CONTROL_L4: "限制出口"
 PWC_LAW_TRADE_CONTROL_L4_DESC: "本地工厂和公共需求被置于出口之前。城市收紧外运安排，以更明确的管制确保关键物资首先留在自己的生产体系中。"
 PWC_LAW_TRADE_CONTROL_L4_EFFECTS: "第 4 级：出口资源比例 +25%、战略资源获取效率 +15%、工厂产出 +5%、船坞产出 +5%、建设速度 +5%。升级到本级需要 150 政治点、50% 战争支持度、对应改革焦点。"
 PWC_LAW_TRADE_CONTROL_L5: "战时统制"
 PWC_LAW_TRADE_CONTROL_L5_DESC: "物资交换服从战争中的统一调度。城市把重要资源集中留用，对外贸易不再是独立的商业活动，而成为整体动员的一部分。"
 PWC_LAW_TRADE_CONTROL_L5_EFFECTS: "第 5 级：出口资源比例 +10%、战略资源获取效率 +25%、从石油获得的燃油 +15%、稳定度 -5%。升级到本级需要 200 政治点、70% 战争支持度、对应改革焦点。"
 PWC_POLITICS_CATEGORY: "内政"
 PWC_POLITICS_CATEGORY_DESC: "协调城市的人事安排与公共政策，在行政延续与制度调整之间作出选择。"
 PWC_SEAT_AIR_COMMAND: "空军总长"
 PWC_SEAT_AIR_COMMAND_DESC: "空军总长统筹飞行训练、航空作战与地勤保障，使城市的航空力量成为持续运作的整体。"
 PWC_SEAT_ARMY_COMMAND: "陆军总长"
 PWC_SEAT_ARMY_COMMAND_DESC: "陆军总长负责地面部队的训练、组织与作战准备，把不同单位纳入能够共同守卫城市的指挥体系。"
 PWC_SEAT_CIVIL_ADMIN: "民政总长"
 PWC_SEAT_CIVIL_ADMIN_DESC: "民政总长统筹街区行政、居民事务与公共服务，使城市的日常生活能够在动荡中保持秩序。"
 PWC_SEAT_ECONOMIC_PLANNING: "经济计划长"
 PWC_SEAT_ECONOMIC_PLANNING_DESC: "经济计划长连接建设部门与工厂，负责把长期发展、工程安排和生产需求放进同一套城市计划。"
 PWC_SEAT_FINANCE_TRADE: "财政贸易长"
 PWC_SEAT_FINANCE_TRADE_DESC: "财政贸易长管理城市的资源与产业周转，在原料供给、企业经营和生产安排之间寻找可持续的平衡。"
 PWC_SEAT_LOGISTICS_COMMAND: "后勤运输长"
 PWC_SEAT_LOGISTICS_COMMAND_DESC: "后勤运输长负责物资从生产线到部队手中的全过程，让仓储、运输、维修和回收围绕实际需求协同工作。"
 PWC_SEAT_MOBILIZATION_COMMAND: "兵役动员长"
 PWC_SEAT_MOBILIZATION_COMMAND_DESC: "兵役动员长连接兵员征集、训练与部队补充，使城市的人力能够有组织地投入防务，而不打乱整个社会。"
 PWC_SEAT_NAVY_COMMAND: "海军总长"
 PWC_SEAT_NAVY_COMMAND_DESC: "海军总长协调舰队、港口与海上任务，使舰艇的行动有完整的指挥、人员和岸上保障作为依托。"
 PWC_SEAT_SCIENCE_EDUCATION: "科研文教长"
 PWC_SEAT_SCIENCE_EDUCATION_DESC: "科研文教长负责连接研究机构、学校与专业训练，让知识能够从书本和实验室进入城市的实际事务。"
 PWC_SPIRIT_ACADEMY_SCHOLARSHIPS: "军校奖学金"
 PWC_SPIRIT_ACADEMY_SCHOLARSHIPS_DESC: "奖学金为有志从军的青年打开了进入军校的道路。军事教育不再只依赖个人家境，而成为城市可以主动组织的人才培养事业。"
 PWC_SPIRIT_ACADEMY_SCHOLARSHIPS_EFFECTS: "陆军军校精神：陆军将领初始等级 +1、陆军将领招募花费 -30%。消耗 20 点陆军经验。"
 PWC_SPIRIT_BEST_OF_THE_BEST: "精锐选拔"
 PWC_SPIRIT_BEST_OF_THE_BEST_DESC: "严格的选拔与集中的培养构成军校的办学传统。学院宁可投入更多心力，也要让进入指挥岗位的人具备扎实的准备。"
 PWC_SPIRIT_BEST_OF_THE_BEST_EFFECTS: "陆军军校精神：陆军将领初始等级 +2、陆军将领招募花费 +25%。消耗 20 点陆军经验。"
 PWC_SPIRIT_BEST_OF_THE_BEST_NAVAL: "海军精锐选拔"
 PWC_SPIRIT_BEST_OF_THE_BEST_NAVAL_DESC: "海军学院坚持严格挑选与精细培养。航海判断、舰上纪律与指挥责任被放在一起考察，使出校军官能够承担复杂的海上事务。"
 PWC_SPIRIT_BEST_OF_THE_BEST_NAVAL_EFFECTS: "海军军校精神：海军将领初始等级 +2、海军将领招募花费 +25%。消耗 20 点海军经验。"
 PWC_SPIRIT_GEO_GENERIC_APEX_CITY_COMMONWEALTH: "城市共同体"
 PWC_SPIRIT_GEO_GENERIC_APEX_CITY_COMMONWEALTH_DESC: "共同议事与共同承担已成为城市的制度。公共机构拥有持续运转的协调能力，受损设施的修复和战后恢复都有稳定依托。"
 PWC_SPIRIT_GEO_GENERIC_CITY_COOPERATION: "城市协作"
 PWC_SPIRIT_GEO_GENERIC_CITY_COOPERATION_DESC: "街区、工坊和公共机构形成了稳定的协作秩序。共同的议事渠道使政策能够传达到基层，也使城市更能抵御内部失序。"
 PWC_SPIRIT_GEO_GENERIC_DEFENSE_COOPERATION: "城防协作"
 PWC_SPIRIT_GEO_GENERIC_DEFENSE_COOPERATION_DESC: "驻军、工程队与居民熟悉彼此的职责。城市防线依托地方经验建立，守备准备更周全，工事也更能发挥作用。"
 PWC_SPIRIT_GEO_GENERIC_EMERGENCY_SUPPORT: "应急保障"
 PWC_SPIRIT_GEO_GENERIC_EMERGENCY_SUPPORT_DESC: "维修、救护和调剂队伍维持着前后方的联系。装备故障和人员疲劳能够更快处理，紧急情况不再轻易拖垮守备力量。"
 PWC_SPIRIT_GEO_GENERIC_INDUSTRIAL_COOPERATION: "产业协同"
 PWC_SPIRIT_GEO_GENERIC_INDUSTRIAL_COOPERATION_DESC: "统一规格与协作订单连接着分散的工坊。已有的机器和熟练工人得以互相补位，城市工业因此更加稳定。"
 PWC_SPIRIT_GEO_GENERIC_LOCAL_MOBILIZATION: "地方动员"
 PWC_SPIRIT_GEO_GENERIC_LOCAL_MOBILIZATION_DESC: "后备人员名册和常态训练扎根于街区与工作单位。城市拥有熟悉组织程序的动员骨干，临时扩军不再从零开始。"
 PWC_SPIRIT_GEO_GENERIC_LOGISTICS_COORDINATION: "物流统筹"
 PWC_SPIRIT_GEO_GENERIC_LOGISTICS_COORDINATION_DESC: "运输、仓储与配给遵循共同的调度。关键线路上的重复搬运和无谓等待减少了，有限补给能够支撑更持久的行动。"
 PWC_SPIRIT_GEO_GENERIC_PUBLIC_WELFARE: "民生保障"
 PWC_SPIRIT_GEO_GENERIC_PUBLIC_WELFARE_DESC: "市场、仓储和救济体系相互配合，基本生活供应有了可靠依托。市民对日常生活的信心减轻了城市维持秩序的负担。"
 PWC_SPIRIT_GROUP_ACADEMY: "陆军军校"
 PWC_SPIRIT_GROUP_ACADEMY_DESC: "陆军军校是指挥知识与部队传统汇集的场所。不同的教育方向决定军官如何理解组织、地形以及战场上的判断责任。"
 PWC_SPIRIT_GROUP_ACADEMY_EFFECTS: "军官团方向，共 8 项精神，每项消耗 20 点经验。"
 PWC_SPIRIT_GROUP_AIR_FORCE_ACADEMY_SPIRIT: "空军训练"
 PWC_SPIRIT_GROUP_AIR_FORCE_ACADEMY_SPIRIT_DESC: "空军训练将飞行技术、任务经验与安全规范汇入共同课程。培养速度、机队保存与老兵传承之间的选择，会塑造下一批机组。"
 PWC_SPIRIT_GROUP_AIR_FORCE_ACADEMY_SPIRIT_EFFECTS: "军官团方向，共 8 项精神，每项消耗 20 点经验。"
 PWC_SPIRIT_GROUP_AIR_FORCE_COMMAND_SPIRIT: "空军作战指挥"
 PWC_SPIRIT_GROUP_AIR_FORCE_COMMAND_SPIRIT_DESC: "空中作战指挥决定任务和机群的优先顺序。保卫空域、支援前线与打击纵深争用同一批人员和保障力量，需要明确的战役选择。"
 PWC_SPIRIT_GROUP_AIR_FORCE_COMMAND_SPIRIT_EFFECTS: "军官团方向，共 8 项精神，每项消耗 50 点经验。"
 PWC_SPIRIT_GROUP_AIR_FORCE_SPIRIT: "空军建制"
 PWC_SPIRIT_GROUP_AIR_FORCE_SPIRIT_DESC: "空军建制协调训练、地勤与机场网络。只有把机组轮换和地面保障接到一起，航空兵才能将纸面规模变为持续出动的能力。"
 PWC_SPIRIT_GROUP_AIR_FORCE_SPIRIT_EFFECTS: "军官团方向，共 8 项精神，每项消耗 35 点经验。"
 PWC_SPIRIT_GROUP_ARMY_SPIRIT: "陆军建制"
 PWC_SPIRIT_GROUP_ARMY_SPIRIT_DESC: "陆军建制连接参谋、补给与预备役。组织方式决定部队如何把日常训练、后方保障和前线轮换维持为同一套制度。"
 PWC_SPIRIT_GROUP_ARMY_SPIRIT_EFFECTS: "军官团方向，共 8 项精神，每项消耗 35 点经验。"
 PWC_SPIRIT_GROUP_DIVISION_COMMAND_SPIRIT: "陆军作战指挥"
 PWC_SPIRIT_GROUP_DIVISION_COMMAND_SPIRIT_DESC: "作战指挥规定一线部队如何理解任务并协调行动。分权机动、集中火力与纵深轮换各有适用的战场，也要求指挥员接受相应的取舍。"
 PWC_SPIRIT_GROUP_DIVISION_COMMAND_SPIRIT_EFFECTS: "军官团方向，共 8 项精神，每项消耗 50 点经验。"
 PWC_SPIRIT_GROUP_NAVAL_ACADEMY: "海军军校"
 PWC_SPIRIT_GROUP_NAVAL_ACADEMY_DESC: "海军军校将航海技术、舰上组织与指挥教育联系起来。学院选择的培养方式，会成为未来舰队共同的职业基础。"
 PWC_SPIRIT_GROUP_NAVAL_ACADEMY_EFFECTS: "军官团方向，共 8 项精神，每项消耗 20 点经验。"
 PWC_SPIRIT_GROUP_NAVAL_COMMAND_SPIRIT: "海军作战指挥"
 PWC_SPIRIT_GROUP_NAVAL_COMMAND_SPIRIT_DESC: "舰队指挥把有限舰艇集中到明确的海上任务。保护航路、隐蔽破交或保障登陆，都需要相应的警戒、协同与资源安排。"
 PWC_SPIRIT_GROUP_NAVAL_COMMAND_SPIRIT_EFFECTS: "军官团方向，共 8 项精神，每项消耗 50 点经验。"
 PWC_SPIRIT_GROUP_NAVY_SPIRIT: "海军建制"
 PWC_SPIRIT_GROUP_NAVY_SPIRIT_DESC: "舰队组织把港口、修理设施与出海任务连接起来。演训、维护和分散保障之间的优先顺序，决定舰艇能以何种节奏持续行动。"
 PWC_SPIRIT_GROUP_NAVY_SPIRIT_EFFECTS: "军官团方向，共 8 项精神，每项消耗 35 点经验。"
 PWC_SPIRIT_MASS_ASSAULT_ACADEMY: "动员集群教程"
 PWC_SPIRIT_MASS_ASSAULT_ACADEMY_DESC: "动员集群课程关注大规模部队如何形成清晰的组织。指挥层次、兵员补充和集体纪律，是学员必须反复练习的基本问题。"
 PWC_SPIRIT_MASS_ASSAULT_ACADEMY_EFFECTS: "陆军军校精神：陆军将领初始防御 +1、陆军将领招募花费 -15%。消耗 20 点陆军经验。"
 PWC_SPIRIT_MOBILE_WARFARE_ACADEMY: "机动战教程"
 PWC_SPIRIT_MOBILE_WARFARE_ACADEMY_DESC: "机动战课程要求学员理解时间、空间与部队协同的关系。地图作业与演习围绕变化中的局势展开，而不是机械重复固定答案。"
 PWC_SPIRIT_MOBILE_WARFARE_ACADEMY_EFFECTS: "陆军军校精神：陆军将领初始计划 +1、主动性 +5%。消耗 20 点陆军经验。"

l_simp_chinese:
 PWC_BONUS_MIL_AIR_CAS_COMMAND: "空军科技加速"
 PWC_BONUS_MIL_AIR_DRONE_PROGRAM: "空军科技加速"
 PWC_BONUS_MIL_MECHANIZED_INITIATIVE: "装甲科技加速"
 PWC_CABINET_CLOSE_TIP: "关闭内阁控制台"
 PWC_CABINET_REOPEN: "打开内阁控制台"
 PWC_CABINET_REOPEN_DESC: "重新显示被关闭的内阁控制台窗口。"
 PWC_CABINET_TITLE: "城市内阁控制台"
 PWC_CAND_AIR_ACE_TALENT_SCOUT: "王牌星探"
 PWC_CAND_AIR_ACE_TALENT_SCOUT_DESC: "这位选拔者善于发现飞行员在观察、协同与临场判断上的潜质。他希望把出众的个人培养成能够带动整个编队的骨干。"
 PWC_CAND_AIR_ACE_TALENT_SCOUT_EFFECTS: "空军总长席位候选人：王牌飞行员产生几率 +15%、对空攻击 +10%、每日空军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_AIR_ACE_TALENT_SCOUT_GUIDANCE: "空军总长：善于发现并培养优秀飞行员，让实战表现突出的人员成长为带动空战的骨干。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_AIR_AGILITY_INSTRUCTOR: "机动教官"
 PWC_CAND_AIR_AGILITY_INSTRUCTOR_DESC: "这位教官不满足于让学员完成规定动作。他关注飞行员如何在变化中保持判断，使机动训练真正服务于空战中的决策。"
 PWC_CAND_AIR_AGILITY_INSTRUCTOR_EFFECTS: "空军总长席位候选人：机动 +20%、对空攻击 +10%、战斗机探测 +10%、每日空军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_AIR_AGILITY_INSTRUCTOR_GUIDANCE: "空军总长：反复训练转向、阵位选择和接敌动作，依靠机动优势配合火力赢得空战主动权。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_AIR_DOGFIGHT_ACE: "空战王牌"
 PWC_CAND_AIR_DOGFIGHT_ACE_DESC: "这位空战老手重视对态势的判断与僚机之间的默契。他把个人飞行经验整理成联队能够共同练习的空战方法。"
 PWC_CAND_AIR_DOGFIGHT_ACE_EFFECTS: "空军总长席位候选人：对空攻击 +20%、机动 +10%、战斗机探测 +10%、每日空军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_AIR_DOGFIGHT_ACE_GUIDANCE: "空军总长：把进攻性空战训练作为核心，配合机动与空域搜索，适合主动争夺天空的空军。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_AIR_GROUND_CREW_INSPECTOR: "地勤监察长"
 PWC_CAND_AIR_GROUND_CREW_INSPECTOR_DESC: "在这位监察长看来，安全起飞始于地面上不被忽视的细节。他以检查、交接与维修记录连接地勤工作和飞行任务。"
 PWC_CAND_AIR_GROUND_CREW_INSPECTOR_EFFECTS: "空军总长席位候选人：空军事故几率 -15%、空中防御 +10%、王牌飞行员产生几率 +10%、每日空军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_AIR_GROUND_CREW_INSPECTOR_GUIDANCE: "空军总长：从维护纪律和飞行保障入手减少事故，让航空部队更安全地训练并保存骨干。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_AIR_SKY_SHIELD: "苍穹之盾"
 PWC_CAND_AIR_SKY_SHIELD_DESC: "这位空军指挥官把守住天空视为持续的组织工作。他重视警戒、编队互援和战后整备，使飞行员不必独自承担防空任务。"
 PWC_CAND_AIR_SKY_SHIELD_EFFECTS: "空军总长席位候选人：空中防御 +20%、机动 +10%、每日空军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_AIR_SKY_SHIELD_GUIDANCE: "空军总长：优先保存空中力量，以防御和机动减少交战损失；其能力作用于飞机而非地面防空炮。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ARM_BULWARK_COMMANDER: "坚盾指挥官"
 PWC_CAND_ARM_BULWARK_COMMANDER_DESC: "这位指挥官把预备阵地和后续计划看得与眼前防线同样重要。他希望士兵在敌人到来之前，就已经知道如何守住彼此的侧翼。"
 PWC_CAND_ARM_BULWARK_COMMANDER_EFFECTS: "陆军总长席位候选人：陆军师防御 +20%、陆军师核心领土防御 +10%、堑壕上限 +3、每日陆军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_ARM_BULWARK_COMMANDER_GUIDANCE: "陆军总长：围绕坚固阵地组织防御，以纵深部署和持续掘壕保存兵力，等待对手攻势衰竭。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ARM_FORTRESS_WARDEN: "要塞守备官"
 PWC_CAND_ARM_FORTRESS_WARDEN_DESC: "这位守备官将掩体、观察哨和交通壕视为同一个整体。他相信坚守来自细致准备，而不是在地图上给据点画一个醒目的符号。"
 PWC_CAND_ARM_FORTRESS_WARDEN_EFFECTS: "陆军总长席位候选人：陆军师核心领土防御 +20%、陆军师防御 +10%、堑壕速度 +10%、每日陆军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_ARM_FORTRESS_WARDEN_GUIDANCE: "陆军总长：把本土防区建设和快速构筑阵地放在首位，适合守住核心领土后再寻找反攻机会。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ARM_IRON_FIST_COMMANDER: "铁拳指挥官"
 PWC_CAND_ARM_IRON_FIST_COMMANDER_DESC: "这位指挥官习惯在明确目标后集中力量付诸行动。他要求侦察、火力和突击紧密衔接，避免部队在犹疑中失去作战节奏。"
 PWC_CAND_ARM_IRON_FIST_COMMANDER_EFFECTS: "陆军总长席位候选人：陆军师攻击 +20%、陆军师核心领土攻击 +10%、堑壕速度 +10%、每日陆军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_ARM_IRON_FIST_COMMANDER_GUIDANCE: "陆军总长：强调集中兵力与主动进攻，在推进之后迅速组织阵地，适合以陆军攻势争取主动权。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ARM_IRON_ORGANIZER: "铁腕整编官"
 PWC_CAND_ARM_IRON_ORGANIZER_DESC: "这位整编官善于处理编制混乱、命令不清与单位脱节的问题。他以统一训练和明确职责，把名册上的部队变成能够共同执行任务的军队。"
 PWC_CAND_ARM_IRON_ORGANIZER_EFFECTS: "陆军总长席位候选人：陆军师组织度 +20%、每日陆军经验获取 +0.12、陆军师攻击 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_ARM_IRON_ORGANIZER_GUIDANCE: "陆军总长：通过统一指挥和整编规范维持部队组织度，让陆军在连续作战中保持协调。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ARM_URBAN_ASSAULT_LEADER: "巷战突击队长"
 PWC_CAND_ARM_URBAN_ASSAULT_LEADER_DESC: "这位突击队长熟悉街道、楼宇与狭窄通道中的协同难题。他强调小队联络和行动纪律，避免城市战沦为互不相知的零散冲锋。"
 PWC_CAND_ARM_URBAN_ASSAULT_LEADER_EFFECTS: "陆军总长席位候选人：陆军师核心领土攻击 +20%、陆军师攻击 +10%、特种部队上限 +3、每日陆军经验获取 +0.12。任命或更换消耗 100 政治点。"
 PWC_CAND_ARM_URBAN_ASSAULT_LEADER_GUIDANCE: "陆军总长：熟悉本土街区与交通节点，侧重核心领土上的反击和突击部队运用；不提供独立城市地形加成。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_CIVIL_CITY_ANCHOR: "都市定盘星"
 PWC_CAND_CIVIL_CITY_ANCHOR_DESC: "这位协调者擅长在部门争执与街区诉求之间找到共同语言。对他而言，治理的首要任务是让居民相信城市仍有可以依靠的秩序。"
 PWC_CAND_CIVIL_CITY_ANCHOR_EFFECTS: "民政总长席位候选人：稳定度 +15%、政治点数 +10%、战争支持度 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_CIVIL_CITY_ANCHOR_GUIDANCE: "民政总长：以街区议事和公开协调稳住城市秩序，让日常行政与战时动员都能获得市民支持。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_CIVIL_CITY_PSYCHOLOGIST: "城市心理师"
 PWC_CAND_CIVIL_CITY_PSYCHOLOGIST_DESC: "长期动荡留下的焦虑无法只靠命令消除。这位城市心理师重视倾听与社区联络，试图让恐慌中的居民重新建立彼此信任。"
 PWC_CAND_CIVIL_CITY_PSYCHOLOGIST_EFFECTS: "民政总长席位候选人：每周稳定度 +0.3%、生活消费品工厂系数 -10%、政治点数 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_CIVIL_CITY_PSYCHOLOGIST_GUIDANCE: "民政总长：关注长期动荡造成的社会疲劳，通过社区沟通逐步修复信任，而不是只求一时声势。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_CIVIL_RALLY_ORATOR: "动员演说家"
 PWC_CAND_CIVIL_RALLY_ORATOR_DESC: "这位演说家能够把抽象的公共目标讲成居民听得懂的共同事业。他相信，城市要承受困难，就必须先解释为何值得坚持。"
 PWC_CAND_CIVIL_RALLY_ORATOR_EFFECTS: "民政总长席位候选人：战争支持度 +15%、稳定度 +10%、政治点数 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_CIVIL_RALLY_ORATOR_GUIDANCE: "民政总长：善于把分散的诉求凝聚成共同目标，用公开演说和基层动员争取城市的战争支持。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_CIVIL_VETERAN_ADMINISTRATOR: "政务老手"
 PWC_CAND_CIVIL_VETERAN_ADMINISTRATOR_DESC: "熟悉公文背后真实流程的政务老手，知道哪些事务需要协调、哪些问题必须立即拍板。他以日复一日的可靠执行维持行政运转。"
 PWC_CAND_CIVIL_VETERAN_ADMINISTRATOR_EFFECTS: "民政总长席位候选人：政治点数 +15%、稳定度 +10%、每周稳定度 +0.15%。任命或更换消耗 100 政治点。"
 PWC_CAND_CIVIL_VETERAN_ADMINISTRATOR_GUIDANCE: "民政总长：熟悉部门之间的办事流程，擅长疏通行政积压，把有限的政治资源用在持续治理上。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_CIVIL_WELFARE_OFFICER: "民生保障官"
 PWC_CAND_CIVIL_WELFARE_OFFICER_DESC: "这位保障官始终从居民的餐桌、住所和基本用品出发考虑政策。在他看来，公共机构的价值首先体现在日常生活是否得到照料。"
 PWC_CAND_CIVIL_WELFARE_OFFICER_EFFECTS: "民政总长席位候选人：生活消费品工厂系数 -15%、稳定度 +10%、战争支持度 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_CIVIL_WELFARE_OFFICER_GUIDANCE: "民政总长：优先保障居民生活所需，以有序配给和公共服务减少社会摩擦，为工业发展留出空间。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ECO_ARSENAL_DIRECTOR: "兵工厂长"
 PWC_CAND_ECO_ARSENAL_DIRECTOR_DESC: "这位兵工厂长将军队的需求翻译成车间能够执行的工艺与排程。他关注的不只是交付武器，也包括背后持续运转的工业组织。"
 PWC_CAND_ECO_ARSENAL_DIRECTOR_EFFECTS: "经济计划长席位候选人：军工厂建造速度 +20%、工厂产出 +10%、民用工厂建造速度 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_ECO_ARSENAL_DIRECTOR_GUIDANCE: "经济计划长：围绕前线需求安排兵工厂扩建与交货节奏，适合希望尽快扩大军备供给的城市。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ECO_CIVILIAN_FACTORY_DIRECTOR: "民用工厂厂长"
 PWC_CAND_ECO_CIVILIAN_FACTORY_DIRECTOR_DESC: "从日用品工厂成长起来的厂长，熟悉车间与市场之间的联系。他把稳定的民用制造视为城市长期发展的基本条件。"
 PWC_CAND_ECO_CIVILIAN_FACTORY_DIRECTOR_EFFECTS: "经济计划长席位候选人：民用工厂建造速度 +20%、工厂产出 +10%、建设速度 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_ECO_CIVILIAN_FACTORY_DIRECTOR_GUIDANCE: "经济计划长：把民用工业作为后续扩张的基础，先积累建设能力，再逐步支撑更庞大的生产网络。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ECO_INDUSTRIAL_CZAR: "工业沙皇"
 PWC_CAND_ECO_INDUSTRIAL_CZAR_DESC: "这位产业统筹者习惯从整片厂区而非单个车间观察问题。他重视供应、工序与建设之间的协调，力图把工业组织成相互支撑的网络。"
 PWC_CAND_ECO_INDUSTRIAL_CZAR_EFFECTS: "经济计划长席位候选人：工厂产出 +20%、民用工厂建造速度 +10%、军工厂建造速度 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_ECO_INDUSTRIAL_CZAR_GUIDANCE: "经济计划长：从原料进厂到成品交付统筹生产，把工厂扩建与军需订单组织成连续运转的工业体系。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ECO_INFRASTRUCTURE_ENGINEER: "基建工程师"
 PWC_CAND_ECO_INFRASTRUCTURE_ENGINEER_DESC: "道路、电力与公共设施在这位工程师眼中是一张彼此依赖的网络。他优先解决连接处的障碍，让城市的不同部分能够共同运转。"
 PWC_CAND_ECO_INFRASTRUCTURE_ENGINEER_EFFECTS: "经济计划长席位候选人：基础设施建造速度 +20%、建设速度 +10%、工厂产出 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_ECO_INFRASTRUCTURE_ENGINEER_GUIDANCE: "经济计划长：优先打通工业布局中的道路与工程瓶颈，让基础设施建设服务于后续工厂和城市扩张。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_ECO_MASTER_BUILDER: "建设总工"
 PWC_CAND_ECO_MASTER_BUILDER_DESC: "这位总工程师熟悉从测量放线到工程验收的每一个环节。他主张让设计、材料与施工队先形成共同计划，再把图纸变成街头的建筑。"
 PWC_CAND_ECO_MASTER_BUILDER_EFFECTS: "经济计划长席位候选人：建设速度 +20%、基础设施建造速度 +10%、工厂产出 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_ECO_MASTER_BUILDER_GUIDANCE: "经济计划长：以标准化施工和工程排期推进城市建设，适合需要同时扩充多类建筑的长期发展路线。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_FIN_CONVERSION_PLANNER: "转产规划师"
 PWC_CAND_FIN_CONVERSION_PLANNER_DESC: "这位规划师专门处理工厂改变生产任务时的衔接。设备、工人和物料必须一起安排，转产才不会变成推倒重来的混乱。"
 PWC_CAND_FIN_CONVERSION_PLANNER_EFFECTS: "财政贸易长席位候选人：民用工厂转军用工厂花费 -15%、生产效率增长 +10%、战略资源获取效率 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_FIN_CONVERSION_PLANNER_GUIDANCE: "财政贸易长：提前安排设备、厂房和人员转用，让民用工业转入军需生产时少走弯路。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_FIN_ENERGY_BROKER: "能源掮客"

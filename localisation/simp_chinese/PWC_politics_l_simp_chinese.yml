 PWC_DEC_MOVE_CAPITAL: "迁都"
 PWC_DEC_MOVE_CAPITAL_DESC: "在地图上选择省会、首府、直辖市或台北、港澳等指定重要城市，将首都迁入已整合的核心州。\n\n再次迁都间隔：§Y180天§!"
 PWC_DEC_SEND_ENVOYS: "派遣使团"
 PWC_DEC_SEND_ENVOYS_DESC: "派遣使团，与邻接势力缔结互不侵犯条约。"
 PWC_DEC_START_WAR_WARNING: "[ROOT.GetName] 即将对 [FROM.GetName] §Y发起宣战§!"
 PWC_DEC_START_WAR_WARNING_DESC: "发出战争警告，进入宣战准备。\n§R不可主动撤销§!；宣战条件失效时§Y自动取消§!。"
 PWC_DESIGNER_AIRCRAFT_MANUFACTURER: "航空平台承包商"
 PWC_DESIGNER_AIRCRAFT_MANUFACTURER_DESC: "航空装备的背后是设计、材料、发动机与试飞工作的长期协作。航空承包商负责让这些专业力量围绕共同的机型计划展开工作。"
 PWC_DESIGNER_AIRCRAFT_MANUFACTURER_EFFECTS: "研发与生产席位，共 3 家承包商可选，每家都为空军科技和对应军工组织提供加成。"
 PWC_DESIGNER_AIR_MIO_CONSORTIUM: "航空工业联合体"
 PWC_DESIGNER_AIR_MIO_CONSORTIUM_DESC: "航空工业联合体协调机体、动力与配套企业的长期合作。它把安全规范与技术组织放在一起，维持航空工程背后稳定的产业联系。"
 PWC_DESIGNER_AIR_MIO_CONSORTIUM_EFFECTS: "航空平台承包商候选：军工组织资金获取 +15%、空军事故几率 -10%，并为空军科技提供 +5% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_AIR_RESEARCH_BUREAU: "航空研究局"
 PWC_DESIGNER_AIR_RESEARCH_BUREAU_DESC: "航空研究局将气动、结构与飞行任务放在同一套设计论证中。它通过试验与技术交流，连接研究室里的构想和机场上的实际需求。"
 PWC_DESIGNER_AIR_RESEARCH_BUREAU_EFFECTS: "航空平台承包商候选：军工组织研究加成 +5%，并为空军科技提供 +9% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_AIR_SERIAL_WORKS: "航空量产工厂"
 PWC_DESIGNER_AIR_SERIAL_WORKS_DESC: "航空量产工厂把精细的飞机制造组织为可重复的装配过程。它关注工装、部件衔接与生产记录，使每批飞机都能继承成熟的制造经验。"
 PWC_DESIGNER_AIR_SERIAL_WORKS_EFFECTS: "航空平台承包商候选：工厂产出 +10%、生产效率增长 +10%，并为空军科技提供 +5% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_INDUSTRIAL_CONCERN: "城市工业集团"
 PWC_DESIGNER_INDUSTRIAL_CONCERN_DESC: "城市工业集团连接科研、建设和企业组织。它承担跨越单个工厂的协调工作，使城市能够围绕长期目标调动自己的产业力量。"
 PWC_DESIGNER_INDUSTRIAL_CONCERN_EFFECTS: "研发与生产席位，共 9 家承包商可选，每家都为工业科技和对应军工组织提供加成。"
 PWC_DESIGNER_INDUSTRY_CHEMICAL: "恒新化工集团"
 PWC_DESIGNER_INDUSTRY_CHEMICAL_DESC: "扩建合成炼油设施，改进原油加工与燃料回收，为持续运转的工业和军队提供能源。"
 PWC_DESIGNER_INDUSTRY_CHEMICAL_EFFECTS: "城市工业集团候选：合成炼油厂建造速度 +20%、从石油获得的燃油 +10%，并为工业科技提供 +5% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_INDUSTRY_CONSTRUCTION: "城建实业公司"
 PWC_DESIGNER_INDUSTRY_CONSTRUCTION_DESC: "统筹厂房、道路和市政施工，以标准化工程队为城市铺设持续扩张的工业基础。"
 PWC_DESIGNER_INDUSTRY_CONSTRUCTION_EFFECTS: "城市工业集团候选：民用工厂建造速度 +15%、基础设施建造速度 +10%，并为工业科技提供 +5% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_INDUSTRY_CONVERSION_WORKS: "工业改造集团"
 PWC_DESIGNER_INDUSTRY_CONVERSION_WORKS_DESC: "工业改造集团专门处理厂房、设备与生产任务之间的重新组合。它希望在改变用途时保留可用的工业基础，而不是把原有系统全部推倒。"
 PWC_DESIGNER_INDUSTRY_CONVERSION_WORKS_EFFECTS: "城市工业集团候选：民用工厂转军用工厂花费 -15%、工厂产出 +10%，并为工业科技提供 +5% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_INDUSTRY_ELECTRICAL: "华光电气公司"
 PWC_DESIGNER_INDUSTRY_ELECTRICAL_DESC: "从精密电气设备到雷达工程，依靠电子研发与现场施工团队建设城市的信息网络。"
 PWC_DESIGNER_INDUSTRY_ELECTRICAL_EFFECTS: "城市工业集团候选：雷达站建造速度 +20%、基础设施建造速度 +5%，并为电子科技提供 +10% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_INDUSTRY_MINING: "联合矿冶公司"
 PWC_DESIGNER_INDUSTRY_MINING_DESC: "将矿山勘采、冶炼和工厂用料统一调度，稳定原料供给并减少生产环节的浪费。"
 PWC_DESIGNER_INDUSTRY_MINING_EFFECTS: "城市工业集团候选：战略资源获取效率 +15%、生产效率上限 +5%，并为工业科技提供 +5% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_INDUSTRY_MIO_CONSORTIUM: "城市工业联合体"
 PWC_DESIGNER_INDUSTRY_MIO_CONSORTIUM_DESC: "城市工业联合体为研究单位和制造企业搭建共同的协调框架。它以长期合作连接分散的专业能力，使城市能够承担更复杂的产业计划。"
 PWC_DESIGNER_INDUSTRY_MIO_CONSORTIUM_EFFECTS: "城市工业集团候选：军工组织资金获取 +20%、军工组织研究加成 +3%，并为工业科技提供 +5% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_INDUSTRY_RAILWAY: "通达铁路工程局"
 PWC_DESIGNER_INDUSTRY_RAILWAY_DESC: "以铁路干线连接矿区、工业园和城市枢纽，让运输网络跟上工业发展的步伐。"
 PWC_DESIGNER_INDUSTRY_RAILWAY_EFFECTS: "城市工业集团候选：铁路建造速度 +20%、基础设施建造速度 +10%，并为工业科技提供 +5% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_INDUSTRY_RESEARCH_BUREAU: "工业研究院"
 PWC_DESIGNER_INDUSTRY_RESEARCH_BUREAU_DESC: "工业研究院关注研究成果如何进入城市的建设与制造。它把试验、工程标准和现场经验联系起来，为工业发展积累共同知识。"
 PWC_DESIGNER_INDUSTRY_RESEARCH_BUREAU_EFFECTS: "城市工业集团候选：建设速度 +10%，并为工业科技提供 +9% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_INDUSTRY_STEEL: "华兴重工集团"
 PWC_DESIGNER_INDUSTRY_STEEL_DESC: "以大型锻压、轧钢和成套设备生产支撑军工扩建，将重工业产能转化为新的生产车间。"
 PWC_DESIGNER_INDUSTRY_STEEL_EFFECTS: "城市工业集团候选：军工厂建造速度 +15%、民用工厂建造速度 +5%，并为工业科技提供 +5% 加速。任命或更换消耗 100 政治点。两个工业槽共享企业池，同一家企业只能任命一次。"
 PWC_DESIGNER_LAND_MIO_CONSORTIUM: "陆战工业联合体"
 PWC_DESIGNER_LAND_MIO_CONSORTIUM_DESC: "陆战工业联合体把多家专业单位纳入共同的装备计划。它重视订单、技术与投资的协调，让分散的厂商能够承担持续的陆战工程。"
 PWC_DESIGNER_LAND_MIO_CONSORTIUM_EFFECTS: "陆战平台承包商候选：军工组织资金获取 +15%、军工组织研究加成 +3%，并为装甲科技提供 +5% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_LAND_RESEARCH_BUREAU: "陆战研究局"
 PWC_DESIGNER_LAND_RESEARCH_BUREAU_DESC: "陆战研究局围绕装甲车辆和地面装备开展设计论证。研究人员与工厂保持共同的技术语言，让试验成果能够进入实际的装备工程。"
 PWC_DESIGNER_LAND_RESEARCH_BUREAU_EFFECTS: "陆战平台承包商候选：军工组织研究加成 +5%，并为装甲科技提供 +9% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_LAND_SERIAL_WORKS: "陆战量产工厂"
 PWC_DESIGNER_LAND_SERIAL_WORKS_DESC: "陆战量产工厂专注于把定型装备变成稳定的批次产品。工序布置、零件供应和装配纪律构成了这家承包商的工作核心。"
 PWC_DESIGNER_LAND_SERIAL_WORKS_EFFECTS: "陆战平台承包商候选：工厂产出 +10%、生产效率上限 +10%，并为装甲科技提供 +5% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_MATERIEL_MANUFACTURER: "军需承包商"
 PWC_DESIGNER_MATERIEL_MANUFACTURER_DESC: "军需装备种类繁多，却必须在部队中共同工作。军需承包商整理设计、采购与生产标准，为前线建立可靠的物资来源。"
 PWC_DESIGNER_MATERIEL_MANUFACTURER_EFFECTS: "研发与生产席位，共 3 家承包商可选，每家都为陆军科技和对应军工组织提供加成。"
 PWC_DESIGNER_MATERIEL_MIO_CONSORTIUM: "军需工业联合体"
 PWC_DESIGNER_MATERIEL_MIO_CONSORTIUM_DESC: "军需工业联合体为分散的生产单位协调原料与合同。它擅长在供给波动时维持企业间的合作，让保障物资有连续的生产来源。"
 PWC_DESIGNER_MATERIEL_MIO_CONSORTIUM_EFFECTS: "军需承包商候选：军工组织资金获取 +15%、资源短缺惩罚 -15%，并为陆军科技提供 +5% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_MATERIEL_RESEARCH_BUREAU: "军需研究局"
 PWC_DESIGNER_MATERIEL_RESEARCH_BUREAU_DESC: "军需研究局从前线使用与器材回收中寻找设计问题。它研究如何让不同来源的物资更容易理解、维护并重新投入部队。"
 PWC_DESIGNER_MATERIEL_RESEARCH_BUREAU_EFFECTS: "军需承包商候选：装备缴获比例 +5%，并为陆军科技提供 +9% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_MATERIEL_SERIAL_WORKS: "军需量产工厂"
 PWC_DESIGNER_MATERIEL_SERIAL_WORKS_DESC: "军需量产工厂依靠通用工艺与稳定供货组织生产。它把不起眼的日常器材视为一整套军队保障工作，而不是零散的小订单。"
 PWC_DESIGNER_MATERIEL_SERIAL_WORKS_EFFECTS: "军需承包商候选：工厂产出 +10%、补给消耗 -10%，并为陆军科技提供 +5% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_NAVAL_MANUFACTURER: "海事平台承包商"
 PWC_DESIGNER_NAVAL_MANUFACTURER_DESC: "舰艇需要在图纸、船坞和海上任务之间反复协调。海事承包商负责连接设计人员、建造单位与舰队，使复杂工程能够真正进入服役。"
 PWC_DESIGNER_NAVAL_MANUFACTURER_EFFECTS: "研发与生产席位，共 3 家承包商可选，每家都为海军科技和对应军工组织提供加成。"
 PWC_DESIGNER_NAVAL_MIO_CONSORTIUM: "海事工业联合体"
 PWC_DESIGNER_NAVAL_MIO_CONSORTIUM_DESC: "海事工业联合体将船坞、海运保障与专业制造商连接起来。它从舰船的完整服役过程考虑订单，使海上任务能够获得持续的工业支持。"
 PWC_DESIGNER_NAVAL_MIO_CONSORTIUM_EFFECTS: "海事平台承包商候选：军工组织资金获取 +15%、护航效率 +5%，并为海军科技提供 +5% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_NAVAL_RESEARCH_BUREAU: "海事研究局"
 PWC_DESIGNER_NAVAL_RESEARCH_BUREAU_DESC: "海事研究局研究舰体、动力与任务设备之间的关系。它以试验资料和工程评审帮助船坞理解舰队真正需要怎样的舰船。"
 PWC_DESIGNER_NAVAL_RESEARCH_BUREAU_EFFECTS: "海事平台承包商候选：军工组织研究加成 +5%，并为海军科技提供 +9% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_NAVAL_SERIAL_WORKS: "海事量产船坞"
 PWC_DESIGNER_NAVAL_SERIAL_WORKS_DESC: "海事量产船坞擅长协调大型舰船的建造顺序。分段制作、设备进场与舾装作业都服从同一张能够落实到现场的计划表。"
 PWC_DESIGNER_NAVAL_SERIAL_WORKS_EFFECTS: "海事平台承包商候选：船坞产出 +20%，并为海军科技提供 +5% 加速。任命或更换消耗 100 政治点。"
 PWC_DESIGNER_TANK_MANUFACTURER: "陆战平台承包商"
 PWC_DESIGNER_TANK_MANUFACTURER_DESC: "陆战平台的研制需要让车辆设计、兵工制造与部队使用彼此衔接。承包商承担着把城市的工业能力转化为可用装备的协调工作。"
 PWC_DESIGNER_TANK_MANUFACTURER_EFFECTS: "研发与生产席位，共 3 家承包商可选，每家都为装甲科技和对应军工组织提供加成。"
 PWC_DIPLOMACY_CATEGORY: "外交"
 PWC_DIPLOMACY_CATEGORY_DESC: "向邻接势力派遣使团，建立互不侵犯关系。"
 PWC_EV_ENDGAME_2040_CHECKPOINT_DESC: "到达 2040 结算点。最后存续势力获胜的规则仍然有效，可以选择继续游戏。"
 PWC_EV_ENDGAME_2040_CHECKPOINT_TITLE: "2040 结算点"
 PWC_EV_ENDGAME_CONTINUE: "继续游戏"
 PWC_EV_LAST_CITY_CHAMPION_DESC: "[event_target:pwc_champion.GetName]成为最后存续的势力。胜者已定，战争纪元落幕。"
 PWC_EV_LAST_CITY_CHAMPION_TITLE: "最后的势力"
 PWC_EV_OK: "知道了"
 PWC_FOCUS_CITY_GOVERNANCE_HUB: "城市治理中枢"
 PWC_FOCUS_CITY_GOVERNANCE_HUB_DESC: "街区不能只靠各自为政维持下去。我们要把分散的办事机构连接起来，让这座城市拥有能够统筹民生、产业与防务的治理中枢。"
 PWC_FOCUS_CITY_GOVERNANCE_HUB_EFFECTS: "7 天：开启焦点树。"
 PWC_FOCUS_ECO_APEX_POWERHOUSE: "完善产业体系"
 PWC_FOCUS_ECO_APEX_POWERHOUSE_DESC: "分散的工厂和商贸机构难以应对持续增长的生产需求。我们将完善产业配套，协调能源供应、货物流通与公共服务，为工业扩张提供稳定支撑。"
 PWC_FOCUS_ECO_APEX_POWERHOUSE_EFFECTS: "70 天：首都新增 1 座民用工厂；首都建筑槽 +1；首都新增 1 座军工厂；首都建筑槽 +1；工厂产出 +5%；建设速度 +5%。"
 PWC_FOCUS_ECO_ARMS_INDUSTRY: "军工产业"
 PWC_FOCUS_ECO_ARMS_INDUSTRY_DESC: "守卫城市所需的武器不能完全寄望于外部供应。我们要建立专门的兵工生产，让军队的装备来源与城市的工业能力相互衔接。"
 PWC_FOCUS_ECO_ARMS_INDUSTRY_EFFECTS: "35 天：首都新增 1 座军工厂；首都建筑槽 +1。"
 PWC_FOCUS_ECO_COMMERCE_DISTRICT: "中央商务区"
 PWC_FOCUS_ECO_COMMERCE_DISTRICT_DESC: "交易、金融与企业服务需要一个稳定的汇集地。我们将整理城市的商业核心，使市场活动与公共管理能够在清晰的规则下相互配合。"
 PWC_FOCUS_ECO_COMMERCE_DISTRICT_EFFECTS: "35 天：生活消费品工厂系数 -3%；每日政治点数获取 +0.03。"
 PWC_FOCUS_ECO_CONSTRUCTION_BUREAU: "建设局"
 PWC_FOCUS_ECO_CONSTRUCTION_BUREAU_DESC: "城市建设不能再由互不相通的临时工程队承担。我们要集中测绘、招工、材料调配与工程验收，使每一项工程都有可靠的组织。"
 PWC_FOCUS_ECO_CONSTRUCTION_BUREAU_EFFECTS: "35 天：建设速度 +5%；工厂修复速度 +10%。"
 PWC_FOCUS_ECO_FINANCE_REFORM: "财政改革"
 PWC_FOCUS_ECO_FINANCE_REFORM_DESC: "账面上的收入与街头的实际需求之间，不该隔着一团无人负责的乱账。我们要统一预算与拨款程序，让有限的财政资源用在明确的事务上。"
 PWC_FOCUS_ECO_FINANCE_REFORM_EFFECTS: "35 天：生活消费品工厂系数 -3%；基础生产效率 +5%。"
 PWC_FOCUS_ECO_FOURTH_RESEARCH_SLOT: "第四研究槽"
 PWC_FOCUS_ECO_FOURTH_RESEARCH_SLOT_DESC: "新的研究方向不应挤占现有课题的工作条件。我们将建立独立的研究团队与管理渠道，让更多领域能够同时得到持续投入。"
 PWC_FOCUS_ECO_FOURTH_RESEARCH_SLOT_EFFECTS: "70 天：研究槽 +1。"
 PWC_FOCUS_ECO_INDUSTRIAL_BASE: "工业基础"
 PWC_FOCUS_ECO_INDUSTRIAL_BASE_DESC: "想让城市站稳脚跟，首先要拥有能够修造日常器物的产业根基。我们将把分散的工坊与厂区纳入稳定的生产网络。"
 PWC_FOCUS_ECO_INDUSTRIAL_BASE_EFFECTS: "35 天：首都新增 1 座民用工厂；首都建筑槽 +1。"
 PWC_FOCUS_ECO_INDUSTRIAL_EXPANSION: "产业扩张"
 PWC_FOCUS_ECO_INDUSTRIAL_EXPANSION_DESC: "现有的厂房已无法承接城市不断增长的需求。我们将把成熟的生产经验带到新的厂区，让产业扩张有配套、有秩序地展开。"
 PWC_FOCUS_ECO_INDUSTRIAL_EXPANSION_EFFECTS: "35 天：首都新增 1 座军工厂；首都建筑槽 +1。"
 PWC_FOCUS_ECO_METROPOLITAN_ECONOMY: "都会经济圈"
 PWC_FOCUS_ECO_METROPOLITAN_ECONOMY_DESC: "单独发展的城区很容易重复建设、相互争夺资源。我们要把生产、就业和消费联系起来，让整座都会形成彼此支撑的经济网络。"
 PWC_FOCUS_ECO_METROPOLITAN_ECONOMY_EFFECTS: "35 天：工厂产出 +5%；地区最大工厂数 +5%。"
 PWC_FOCUS_ECO_MUNICIPAL_ENERGY: "城市能源体系"
 PWC_FOCUS_ECO_MUNICIPAL_ENERGY_DESC: "稳定的能源供应，是车间开工与居民生活共同依赖的基础。我们要把分散的能源设施连接为能够统一调度的城市体系。"
 PWC_FOCUS_ECO_MUNICIPAL_ENERGY_EFFECTS: "35 天：从石油获得的燃油 +10%；生产效率上限 +5%。"
 PWC_FOCUS_ECO_RESEARCH_INSTITUTE: "研究所"
 PWC_FOCUS_ECO_RESEARCH_INSTITUTE_DESC: "城市的科研需要能够长期协作的队伍。我们将延揽科学家，汇集工厂与院校的研究经验，让实验成果持续服务本地工业。"
 PWC_FOCUS_ECO_RESEARCH_INSTITUTE_EFFECTS: "35 天：科研速度 +3%；授予 1 名科学家。"
 PWC_FOCUS_ECO_RESOURCE_SURVEY: "资源勘察"
 PWC_FOCUS_ECO_RESOURCE_SURVEY_DESC: "我们不能只依赖旧地图上的矿点和仓库里剩余的材料。系统性的勘察将重新认识城市周边的土地，并为产业寻找可靠的原料来源。"
 PWC_FOCUS_ECO_RESOURCE_SURVEY_EFFECTS: "35 天：首都橡胶回收产能 +8（受资源开采和贸易法影响）；战略资源获取效率 +10%；资源短缺惩罚 -5%。"
 PWC_FOCUS_ECO_TRADE_HUB: "贸易枢纽"
 PWC_FOCUS_ECO_TRADE_HUB_DESC: "商路连接的不只是货物，也是城市与外界的关系。我们将整理仓储、交易与转运秩序，使往来的商人能够把这里视为可靠的节点。"
 PWC_FOCUS_ECO_TRADE_HUB_EFFECTS: "35 天：贸易影响力 +10%；生产许可购买花费 -10%。"
 PWC_FOCUS_ECO_URBAN_INDUSTRY: "都市工业"
 PWC_FOCUS_ECO_URBAN_INDUSTRY_DESC: "城市的劳动与技术不应困在零散作坊里。我们将整理厂区、完善配套，让制造业成为居民能够长久依靠的生计。"
 PWC_FOCUS_ECO_URBAN_INDUSTRY_EFFECTS: "35 天：首都新增 1 座民用工厂；首都建筑槽 +1。"
 PWC_FOCUS_ENDGAME_DEFENSIVE_DOCTRINE: "防御主义"
 PWC_FOCUS_ENDGAME_DEFENSIVE_DOCTRINE_DESC: "城市的力量不必消耗在每一次冒险中。我们选择把阵地、预备队与纵深组织为整体，以稳固防守等待能够决定局势的时机。"
 PWC_FOCUS_ENDGAME_DEFENSIVE_DOCTRINE_EFFECTS: "70 天：陆军师防御 +10%；陆军师核心领土防御 +10%；堑壕上限 +1；陆军经验 +25。"
 PWC_FOCUS_ENDGAME_INTEGRATION_CHARTER: "整合宪章"
 PWC_FOCUS_ENDGAME_INTEGRATION_CHARTER_DESC: "新的地区不能永远作为互不相通的辖区存在。我们要以共同宪章协调行政与公共责任，让扩大的城市共同体拥有能够长久维系的秩序。"
 PWC_FOCUS_ENDGAME_INTEGRATION_CHARTER_EFFECTS: "70 天：顺从度增长速度 +6%；抵抗增长速度 -9%；非核心领土可征募人口 +10%；政治点数 +100。"
 PWC_FOCUS_ENDGAME_OFFENSIVE_DOCTRINE: "进攻主义"
 PWC_FOCUS_ENDGAME_OFFENSIVE_DOCTRINE_DESC: "僵持会给对手留下恢复的时间。我们选择以主动进攻夺取战争节奏，使侦察、集结与突击服务于不断迫使敌人应变的作战构想。"
 PWC_FOCUS_ENDGAME_OFFENSIVE_DOCTRINE_EFFECTS: "70 天：陆军师攻击 +10%；突破 +10%；陆军师速度 +5%；陆军经验 +25。"
 PWC_FOCUS_ENDGAME_TECHNOLOGICAL_SUPREMACY: "科技至上"
 PWC_FOCUS_ENDGAME_TECHNOLOGICAL_SUPREMACY_DESC: "有限的土地不应成为知识的边界。我们将把研究、教育与工程实践视为城市长期立足之本，以持续创新寻找超越规模限制的道路。"
 PWC_FOCUS_ENDGAME_TECHNOLOGICAL_SUPREMACY_EFFECTS: "70 天：科研速度 +5%；生产效率上限 +5%；专项计划速度 +5%。"
 PWC_FOCUS_GEO_COAST_APEX_HARBOR_MASTER: "港务统筹"
 PWC_FOCUS_GEO_COAST_APEX_HARBOR_MASTER_DESC: "船坞、商路与海防需要共同的港务安排。我们将统一规划港口设施与岸上运输，协调造船、贸易和防务的需求，使沿海各项建设相互衔接。"
 PWC_FOCUS_GEO_COAST_APEX_HARBOR_MASTER_EFFECTS: "70 天：船坞产出 +10%；舰船改装速度 +10%。"
 PWC_FOCUS_GEO_COAST_BEACHHEAD_TRAINING: "滩头训练场"
 PWC_FOCUS_GEO_COAST_BEACHHEAD_TRAINING_DESC: "滩头不是普通的演习场。我们要让部队在潮汐、沙滩与岸线地形中训练，理解登陆行动与内陆行军截然不同的组织要求。"
 PWC_FOCUS_GEO_COAST_BEACHHEAD_TRAINING_EFFECTS: "35 天：两栖登陆速度 +10%；登陆师位 +3。"
 PWC_FOCUS_GEO_COAST_HINTERLAND_LINK: "腹地通道"
 PWC_FOCUS_GEO_COAST_HINTERLAND_LINK_DESC: "港口的繁忙只有连接到腹地才有意义。我们将疏通沿岸与内陆之间的运输脉络，让物资不再堆积在码头之外。"
 PWC_FOCUS_GEO_COAST_HINTERLAND_LINK_EFFECTS: "35 天：首都新增 1 座基础设施。"
 PWC_FOCUS_GEO_COAST_MARINE_FISHERIES: "海洋渔业"
 PWC_FOCUS_GEO_COAST_MARINE_FISHERIES_DESC: "近海的渔业连接着船民、市场与港口。我们要稳定这条日常生计的链条，让海洋资源能够持续进入城市的生活。"
 PWC_FOCUS_GEO_COAST_MARINE_FISHERIES_EFFECTS: "35 天：战略资源获取效率 +5%；每月人口 +3%。"
 PWC_FOCUS_GEO_COAST_MARITIME_TRADE: "海上商路"
 PWC_FOCUS_GEO_COAST_MARITIME_TRADE_DESC: "船舶带来的不只是远方货物，也有新的商业联系。我们将整理海关与转运程序，使沿海城市能够在繁忙的商路上保持可靠的秩序。"
 PWC_FOCUS_GEO_COAST_MARITIME_TRADE_EFFECTS: "35 天：生活消费品工厂系数 -3%；贸易影响力 +10%。"
 PWC_FOCUS_GEO_COAST_PORT_CITY: "港口城市"
 PWC_FOCUS_GEO_COAST_PORT_CITY_DESC: "港口把城市的街道延伸到了海上。我们将围绕码头、仓储和沿岸交通组织发展，让这扇面向海洋的大门真正服务整座城市。"
 PWC_FOCUS_GEO_COAST_PORT_CITY_EFFECTS: "35 天：首都新增 1 座海军船坞；首都建筑槽 +1。"
 PWC_FOCUS_GEO_COAST_SEA_DEFENSE: "海防要塞"
 PWC_FOCUS_GEO_COAST_SEA_DEFENSE_DESC: "开阔的海面并不保证城市安全。我们将把港口入口、沿岸阵地与守备部队纳入统一计划，使海防成为城市防务的一部分。"
 PWC_FOCUS_GEO_COAST_SEA_DEFENSE_EFFECTS: "35 天：首都新增 1 座海岸要塞；陆军师核心领土防御 +5%；海军探测 +5%。"
 PWC_FOCUS_GEO_COAST_SHIPYARD_EXPANSION: "船坞扩建"
 PWC_FOCUS_GEO_COAST_SHIPYARD_EXPANSION_DESC: "舰船与商船都需要能够可靠修造的船坞。我们要为船厂整理场地、设备与劳动力，使海上的需求不再受制于岸上的瓶颈。"
 PWC_FOCUS_GEO_COAST_SHIPYARD_EXPANSION_EFFECTS: "35 天：首都新增 1 座海军船坞；首都建筑槽 +1。"
 PWC_FOCUS_GEO_FRONTIER_APEX_GATEKEEPER: "边防协同"
 PWC_FOCUS_GEO_FRONTIER_APEX_GATEKEEPER_DESC: "边境守备需要前沿哨所、交通道路与纵深阵地相互配合。我们将统一部署边防部队，完善联络和补给安排，使各处守军能够及时支援彼此。"
 PWC_FOCUS_GEO_FRONTIER_APEX_GATEKEEPER_EFFECTS: "70 天：陆军师核心领土防御 +10%；陆军师防御 +5%。"
 PWC_FOCUS_GEO_FRONTIER_BORDER_GUARD: "边防军团"
 PWC_FOCUS_GEO_FRONTIER_BORDER_GUARD_DESC: "边界不能只存在于地图上。我们要组织熟悉沿线地形的边防部队，让巡逻、驻守与报告成为持续而有序的工作。"
 PWC_FOCUS_GEO_FRONTIER_BORDER_GUARD_EFFECTS: "35 天：陆军师核心领土防御 +5%；侦查 +5%。"
 PWC_FOCUS_GEO_FRONTIER_BORDER_TRADE: "边境贸易"

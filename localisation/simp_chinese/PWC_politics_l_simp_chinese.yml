 PWC_CAND_SCI_MILITARY_EDUCATOR_DESC: "这位教官善于把复杂的战场经历整理成能够传授的课程。他相信，部队的经验只有进入教学与复盘，才不会随着人员更替而散失。"
 PWC_CAND_SCI_MILITARY_EDUCATOR_EFFECTS: "科研文教长席位候选人：陆军经验获取 +15%、科研速度 +10%、空军经验获取 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_SCI_MILITARY_EDUCATOR_GUIDANCE: "科研文教长：把部队训练与战例整理为可传授的课程，使陆军经验能够更有效地服务于军制改进。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_SCI_NAVAL_ACADEMICIAN: "海军学监"
 PWC_CAND_SCI_NAVAL_ACADEMICIAN_DESC: "这位海军学监将航海、舰上纪律与战术教育视为同一门长期事业。他重视记录与复盘，让每次出海都能留下可传承的经验。"
 PWC_CAND_SCI_NAVAL_ACADEMICIAN_EFFECTS: "科研文教长席位候选人：海军经验获取 +15%、科研速度 +10%、陆军经验获取 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_SCI_NAVAL_ACADEMICIAN_GUIDANCE: "科研文教长：围绕航海、编队与海上协同建设教学体系，让海军经验成为持续改进的基础。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CAND_SCI_RESEARCH_DEAN: "研究院院长"
 PWC_CAND_SCI_RESEARCH_DEAN_DESC: "这位院长擅长为不同专业的研究人员建立共同问题。他希望实验室、工厂与军事部门彼此理解，而不是各自积累无法交流的成果。"
 PWC_CAND_SCI_RESEARCH_DEAN_EFFECTS: "科研文教长席位候选人：科研速度 +15%、陆军经验获取 +10%、海军经验获取 +10%。任命或更换消耗 100 政治点。"
 PWC_CAND_SCI_RESEARCH_DEAN_GUIDANCE: "科研文教长：协调研究机构与军方交流，把科研方法和实务经验结合起来，推动整体技术进步。\n任命或更换消耗 100 政治点；同席只能任命一人，更换后旧任加成失效，无额外冷却。"
 PWC_CIVIL_CABINET: "政务内阁"
 PWC_CIVIL_CABINET_DESC: "六席政务内阁：行政首席、民政、经济计划、财政贸易、科研文教、监察。"
 PWC_CONSTRUCTION_CATEGORY: "建设"
 PWC_CONSTRUCTION_CATEGORY_DESC: "在自有且完全控制的州建设科研设施；科技中心收益按势力全境最高有效等级计算。"

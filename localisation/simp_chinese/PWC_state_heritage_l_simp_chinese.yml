 PWC_HERITAGE_WUNU_MOUNTAIN_CITY_TT: "§H五女山山城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_wunu_mountain_city_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 本溪市桓仁满族自治县§!\n五女山城位于桓仁县城东北的五女山上，四周崖壁如削，一般认为是高句丽第一座都城纥升骨城，约公元前34年筑城。2004年随高句丽王城、王陵及贵族墓葬列入世界遗产。"
 PWC_HERITAGE_SHENYANG_PALACE_AND_TOMBS_TT: "§H沈阳故宫与福陵、昭陵§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_shenyang_palace_and_tombs_photo£\n\n\n\n\n\n\n\n§g宫殿与皇家园林 · 沈阳市§!\n沈阳故宫始建于1625年，是清入关前的皇宫，建筑群营建延续至1783年。城东北的福陵葬努尔哈赤，城北的昭陵葬皇太极，均已列入世界遗产。"
 PWC_HERITAGE_YONGLING_TOMB_TT: "§H清永陵§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yongling_tomb_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 抚顺市新宾满族自治县§!\n清永陵位于抚顺市新宾县永陵镇，始建于1598年，葬有努尔哈赤的先祖，辈分居盛京三陵之首而规模较小。2004年作为明清皇家陵寝的扩展部分列入世界遗产。"
 PWC_HERITAGE_NIUHELIANG_SITE_TT: "§H牛河梁红山文化遗址§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_niuheliang_site_photo£\n\n\n\n\n\n\n§g古城与聚落遗址 · 朝阳市建平县与凌源市交界§!\n牛河梁遗址地处朝阳市建平与凌源交界的山谷间，是红山文化晚期的祭祀与埋葬中心，距今约5500至5000年，发现女神庙、积石冢和祭坛，出土龙形等玉器。"
 PWC_HERITAGE_KOGURYO_JIAN_TT: "§H集安国内城、丸都山城与高句丽王陵§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_koguryo_jian_photo£\n\n\n\n\n\n\n§g古城与聚落遗址 · 通化市集安市§!\n国内城位于今集安市境内，是高句丽第二座都城，3世纪至427年定都于此；丸都山城是依山而建的守备城。部分王陵以跨度大、无立柱的墓顶结构著称，2004年列入世界遗产。"
 PWC_HERITAGE_JILIN_CONFUCIAN_TEMPLE_AND_ASHIHADA_TT: "§H吉林文庙与阿什哈达摩崖§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jilin_confucian_temple_and_ashihada_photo£\n\n\n\n\n\n\n\n§g书院、学宫与文庙 · 吉林市§!\n阿什哈达摩崖是松花江边悬崖上的两处明代石刻，与明朝在松花江设厂造船、经略东北有关。吉林文庙始建于1736年，是清朝在东北建立的第一座孔庙。"
 PWC_HERITAGE_JIN_SHANGJING_TT: "§H金上京会宁府遗址§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jin_shangjing_photo£\n\n\n\n\n\n\n§g古城与聚落遗址 · 哈尔滨市阿城区§!\n金上京会宁府遗址在哈尔滨阿城区，1115年至1153年为金朝都城。城址由南北二城和皇城组成，面积约6平方公里，皇城仿北宋东京营建，现存城墙和宫殿基址。"
 PWC_HERITAGE_YAGOU_CARVINGS_TT: "§H亚沟石刻§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yagou_carvings_photo£\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 哈尔滨市阿城区亚沟镇§!\n亚沟石刻位于哈尔滨阿城区亚沟街道，是金代女真人的摩崖画像，刻有一男一女，男像为手握短剑的武士装束。画像所指众说不一，是研究金代早期历史的实物。"
 PWC_HERITAGE_BOHAI_SHANGJING_TT: "§H渤海上京龙泉府遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_bohai_shangjing_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 牡丹江市宁安市渤海镇§!\n渤海国上京龙泉府遗址在宁安市渤海镇，755年起为渤海国都城，仿唐长安城格局兴建，分外城、内城和宫城，占地约16平方公里；926年渤海为辽所灭后城毁。"
 PWC_HERITAGE_BEIJING_CENTRAL_AXIS_TT: "§H北京中轴线与故宫§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_beijing_central_axis_photo£\n\n\n\n\n\n\n§g宫殿与皇家园林 · 北京老城§!\n北京中轴线纵贯老城南北，串联宫殿、坛庙和礼仪建筑，始于元大都，明清两代续建完善，体现《考工记》的理想都城规划。故宫1416至1911年为皇宫，中轴线2024年列入世界遗产。"
 PWC_HERITAGE_YUNJU_TEMPLE_STONE_SUTRAS_TT: "§H云居寺石经§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yunju_temple_stone_sutras_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 北京市房山区§!\n北京房山云居寺以石经山刻经和洞藏石经为核心遗存。自隋代起，僧人将佛经刻于石板并藏入山洞，历经唐、辽、金、元、明等时期续刻，形成延续时间很长的石刻佛经收藏，石经板达一万四千余块。"
 PWC_HERITAGE_JUYONGGUAN_BADALING_TT: "§H居庸关与八达岭长城§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_juyongguan_badaling_photo£\n\n\n\n\n\n\n§g关隘与城防 · 北京市昌平区、延庆区§!\n居庸关是明长城的著名关城，与附近的八达岭长城同为北京西北屏障，与倒马关、紫荆关合称内三关。长城自公元前3世纪修筑至明代，1987年列入世界遗产。"
 PWC_HERITAGE_DULE_TEMPLE_TT: "§H蓟州独乐寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dule_temple_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 天津市蓟州区§!\n独乐寺位于天津蓟州城区，是现存三大辽代寺院之一。山门与观音阁均建于辽统和二年（984年），是辽代木构建筑的代表作，梁思成称其上承唐代遗风、下启宋式营造。"
 PWC_HERITAGE_QIANXIANG_TEMPLE_CARVINGS_TT: "§H千像寺石刻§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qianxiang_temple_carvings_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 天津市蓟州区盘山§!\n千像寺造像位于天津蓟州盘山千像寺北坡，雕刻于唐、辽时期，晚至元明，是迄今发现规模最大的辽代石刻造像群，现为全国重点文物保护单位。"
 PWC_HERITAGE_GRAND_CANAL_TIANJIN_TT: "§H大运河天津段§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_grand_canal_tianjin_photo£\n\n\n\n\n\n\n\n§g古代水利与运河 · 天津市北运河、南运河沿线§!\n天津三岔口一带是北运河、南运河与海河的交汇处，这段河道是世界遗产大运河的组成部分。三岔河口也被视为天津城市最早的发祥地。"
 PWC_HERITAGE_SHANHAIGUAN_TT: "§H山海关§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_shanhaiguan_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 秦皇岛市山海关区§!\n山海关位于燕山与渤海之间，是明长城最东端的关隘，号称“天下第一关”。现有关隘修筑于1381年，崇祯年间又增建罗城、卫城等附属城池。"
 PWC_HERITAGE_ZHENGDING_OLD_TOWN_TT: "§H正定古城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhengding_old_town_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 石家庄市正定县§!\n正定古城以府城格局、城墙及密集古建筑群为主体，城内保存隆兴寺、开元寺、临济寺、广惠寺、天宁寺等重要遗存，体现隋唐以来佛教寺院、州府城市和传统街巷的叠加发展。配图为正定文庙牌坊。"
 PWC_HERITAGE_ZHAOZHOU_BRIDGE_TT: "§H赵州桥§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhaozhou_bridge_photo£\n\n\n\n\n\n\n\n§g古道与古桥 · 石家庄市赵县§!\n赵州桥又名安济桥，横跨赵县洨河，一般认为由隋代工匠李春设计，约建于605年，是敞肩单孔石拱桥的代表；历代多次整修，1950年代的大修改变了部分外形与结构。"
 PWC_HERITAGE_CHENGDE_MOUNTAIN_RESORT_TT: "§H承德避暑山庄及外八庙§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_chengde_mountain_resort_photo£\n\n\n\n\n\n\n\n§g宫殿与皇家园林 · 承德市§!\n避暑山庄建于1703至1792年，是清帝的夏季离宫，周围分布12座外八庙，部分采用少数民族建筑风格。康熙、乾隆常在此处理政务，接见各族首领和外国使节。"
 PWC_HERITAGE_PINGYAO_ANCIENT_CITY_TT: "§H平遥古城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_pingyao_ancient_city_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 晋中市平遥县§!\n平遥古城建于14世纪，城墙、街巷、店铺、民居和寺庙保存完整。19世纪至20世纪初这里是全国的金融中心，城外的双林寺与镇国寺也属世界遗产范围。"
 PWC_HERITAGE_YUNGANG_GROTTOES_TT: "§H云冈石窟§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yungang_grottoes_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 大同市云冈区§!\n云冈石窟位于大同，开凿于5世纪中叶至6世纪初的北魏时期，现存窟龛252个、造像约5.1万尊，由皇家主持开凿，其中昙曜五窟是早期佛教艺术的经典。"
 PWC_HERITAGE_MOUNT_WUTAI_TT: "§H五台山古建筑群§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_mount_wutai_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 忻州市五台县§!\n五台山有五座平顶山峰，是文殊菩萨信仰中心，寺庙营建自1世纪延续至20世纪初。佛光寺东大殿是规格最高的唐代木构遗存，殊像寺有明代五百尊悬塑。"
 PWC_HERITAGE_YINGXIAN_WOODEN_PAGODA_TT: "§H应县木塔§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yingxian_wooden_pagoda_photo£\n\n\n\n\n\n\n§g寺观与宗教建筑 · 朔州市应县§!\n应县木塔即佛宫寺释迦塔，建于辽清宁二年（1056年），通高67.31米，是现存最古老、最高的木构楼阁式塔，外观五层、内含暗层，历经地震与战火仍然屹立。"
 PWC_HERITAGE_MOUNT_TAI_TT: "§H泰山§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_mount_tai_photo£\n\n\n\n\n\n\n\n§g文化景观 · 泰安市§!\n泰山是中国最著名的圣山，秦始皇于公元前219年在此封禅。山上有22座庙宇和约1800方碑刻，历代帝王在此举行祭祀天地的仪式，1987年列入世界遗产。"
 PWC_HERITAGE_QUFU_THREE_CONFUCIAN_SITES_TT: "§H曲阜三孔§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qufu_three_confucian_sites_photo£\n\n\n\n\n\n\n\n§g书院、学宫与文庙 · 济宁市曲阜市§!\n曲阜是孔子故里。孔庙始建于公元前478年，现存104座金至清代建筑；孔林葬有孔子及十万余后裔；孔府由孔氏小宅发展为大型府第，1994年列入世界遗产。"
 PWC_HERITAGE_QI_GREAT_WALL_CHANGQING_TT: "§H齐长城·长清段§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qi_great_wall_changqing_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 济南市长清区§!\n齐长城是东周时期齐国修建的军事防御体系，西起济南长清区孝里街道广里村附近，东至青岛入黄海，全长600余公里，横跨山东多个地市。"
 PWC_HERITAGE_GRAND_CANAL_NANWANG_TT: "§H大运河南旺分水枢纽§!\n\n\n\n\n\n£PWC_HERITAGE_ART_grand_canal_nanwang_photo£\n\n\n\n\n\n§g古代水利与运河 · 济宁市汶上县§!\n南旺分水枢纽位于山东汶上南旺，是京杭大运河山东段解决高地水源和南北分流的关键工程。明代以戴村坝拦蓄汶河水，在南旺分水处调节水位，配合水柜、闸坝维持漕运；配图为工程关系示意图。"
 PWC_HERITAGE_GRAND_CANAL_TAIERZHUANG_TT: "§H大运河台儿庄段§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_grand_canal_taierzhuang_photo£\n\n\n\n\n\n\n§g古代水利与运河 · 枣庄市台儿庄区§!\n台儿庄段属大运河的中运河，是世界遗产大运河的组成河段之一。大运河在7世纪隋代首次作为统一漕运通道兴建，连接包括黄河、长江在内的五大水系。"
 PWC_HERITAGE_YINXU_TT: "§H殷墟§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yinxu_photo£\n\n\n\n\n\n\n§g古城与聚落遗址 · 安阳市殷都区§!\n殷墟位于安阳洹河两岸，是商代晚期都城，约公元前1300年盘庚迁殷后延续255年。遗址包括宫殿宗庙区和王陵区，出土的甲骨文是世界最早的文字之一。"
 PWC_HERITAGE_LONGMEN_GROTTOES_TT: "§H龙门石窟§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_longmen_grottoes_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 洛阳市洛龙区§!\n龙门石窟位于洛阳南郊伊河两岸，1公里崖壁上有2300余个窟龛、近11万尊佛像，主要开凿于5世纪末至8世纪中叶，唐代奉先寺大像是皇家石窟艺术的代表。"
 PWC_HERITAGE_DENGFENG_CENTRE_OF_HEAVEN_AND_EARTH_TT: "§H登封“天地之中”建筑群§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dengfeng_centre_of_heaven_and_earth_photo£\n\n\n\n\n\n\n§g寺观与宗教建筑 · 郑州市登封市§!\n嵩山脚下的八组建筑和遗址包括汉代三阙、中岳庙、嵩岳寺塔、少林寺建筑群、嵩阳书院和观星台，历经九个朝代营建，体现天地之中的观念，2010年列入世界遗产。"
 PWC_HERITAGE_WHITE_HORSE_TEMPLE_TT: "§H白马寺§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_white_horse_temple_photo£\n\n\n\n\n\n\n§g寺观与宗教建筑 · 洛阳市东郊§!\n白马寺位于洛阳老城以东，创建于东汉永平十一年（68年），被认为是佛教传入中国后兴建的第一座寺院，有“释源”“祖庭”之称，寺内保存元代夹纻干漆造像。"
 PWC_HERITAGE_GUANGFULIN_SITE_TT: "§H广富林遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_guangfulin_site_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 上海市松江区§!\n广富林遗址位于上海松江区，是距今约4000至2500年的古遗址，1958年由当地居民发现，其中一个文化层被命名为广富林文化，2013年列为全国重点文物保护单位。"
 PWC_HERITAGE_QINGLONG_TOWN_SITE_TT: "§H青龙镇遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qinglong_town_site_photo£\n\n\n\n\n\n\n\n§g港口与海丝遗迹 · 上海市青浦区§!\n青龙镇遗址位于上海青浦，唐宋时期是吴淞江下游的港市与交通节点。考古发现不同窑口瓷器、航运遗迹和隆平寺塔基，见证宋代海贸与江南水运；遗址2019年列入全国重点文物保护单位。"
 PWC_HERITAGE_ZHUJIAJIAO_TOWN_TT: "§H朱家角古镇§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhujiajiao_canal_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 上海市青浦区§!\n朱家角古镇位于上海青浦，河港、桥梁和沿水街巷构成江南水乡的历史空间。古镇保护范围保留传统民居、商业街和舟运联系，现作为上海历史文化风貌区持续保护利用；本图取老城运河一景。"
 PWC_HERITAGE_SONGJIANG_SQUARE_PAGODA_TT: "§H松江方塔§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_songjiang_fangta_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 上海市松江区§!\n松江方塔即兴圣教寺塔，位于上海方塔园，北宋熙宁至元祐年间（1068—1094）建成。塔身九层、平面方形，砖木结构与宋代塔院遗存相结合，1996年列入第四批全国重点文物保护单位。"
 PWC_HERITAGE_SUZHOU_CLASSICAL_GARDENS_TT: "§H苏州古典园林§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_suzhou_classical_gardens_photo£\n\n\n\n\n\n\n\n§g宫殿与皇家园林 · 苏州古城§!\n苏州古典园林以九座名园列入世界遗产，包括拙政园、留园、网师园、沧浪亭和狮子林等。最早的沧浪亭建于11世纪初，园林以咫尺山水再现自然。"
 PWC_HERITAGE_YANGZHOU_CANAL_AND_SALT_TT: "§H扬州运河与盐运遗产§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yangzhou_canal_and_salt_photo£\n\n\n\n\n\n\n\n§g古代水利与运河 · 扬州市§!\n扬州段淮扬运河为大运河世界遗产组成部分；盐商曾沿城河营造园林。配图上为运河、下为个园，分别对应两类组成遗产。"
 PWC_HERITAGE_QINGKOU_HYDRAULIC_HUB_TT: "§H清口水利枢纽§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qingkou_hydraulic_hub_photo£\n\n\n\n\n\n\n§g古代水利与运河 · 淮安市淮阴区§!\n清口位于江苏淮安，是黄河、淮河与大运河交汇处的古代水利节点。历代通过坝、闸、堤和引河控制三水关系，保障漕运并防止黄河泥沙倒灌；清代体系还与洪泽湖、高家堰及淮安运河网络相互配合。"
 PWC_HERITAGE_MING_XIAOLING_TT: "§H明孝陵§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_ming_xiaoling_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 南京市紫金山§!\n明孝陵位于南京紫金山，是明太祖朱元璋与马皇后的合葬陵。它开创了明清帝陵的基本规制，北京、湖北、辽宁等地的皇陵均仿其营建，2003年列入世界遗产。"
 PWC_HERITAGE_LIANGZHU_ANCIENT_CITY_TT: "§H良渚古城遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_liangzhu_ancient_city_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 杭州市余杭区§!\n良渚古城遗址位于杭州余杭，年代约为公元前3300至前2300年，由城址、外围水利系统和分等级墓地组成，出土大量象征信仰的玉器，是长江流域早期国家的代表。"
 PWC_HERITAGE_WEST_LAKE_TT: "§H西湖文化景观§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_west_lake_photo£\n\n\n\n\n\n\n\n§g文化景观 · 杭州市西湖区§!\n西湖三面环山、一面临城，两堤三岛由9至12世纪反复疏浚形成，湖畔寺塔亭园众多。南宋起评出的西湖十景影响了中国及日韩的园林设计，2011年列入世界遗产。"
 PWC_HERITAGE_GRAND_CANAL_HANGZHOU_TT: "§H大运河杭州段§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_grand_canal_hangzhou_photo£\n\n\n\n\n\n\n\n§g古代水利与运河 · 杭州市§!\n杭州段是中国大运河系统的南端河段，沟通京杭运河与钱塘江水系，沿线留下桥梁、仓储、街区和漕运遗存。中国大运河于2014年列入世界遗产，杭州段属于这一整体遗产，不单列为独立项目。"
 PWC_HERITAGE_LONGQUAN_KILNS_TT: "§H龙泉窑遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_longquan_kilns_photo£\n\n\n\n\n\n\n\n§g窑址与陶瓷遗存 · 丽水市龙泉市§!\n龙泉窑遗址分布于丽水龙泉大窑、金村等地，始烧于五代北宋，元明时期达到鼎盛。窑炉、匣钵、瓷片堆积和作坊遗迹共同呈现青瓷生产体系，配图为大窑枫洞岩窑址航拍。"
 PWC_HERITAGE_XIDI_HONGCUN_TT: "§H西递、宏村§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_xidi_hongcun_photo£\n\n\n\n\n\n\n§g传统村落与民居 · 黄山市黟县§!\n西递、宏村位于黄山市黟县，村落布局、建筑与装饰保留14至20世纪的徽州原貌。两村多由返乡的官员和商人营建，宏村依山傍溪，村中有月沼等水系。"
 PWC_HERITAGE_HUIZHOU_OLD_TOWN_AND_TANGYUE_TT: "§H徽州古城与棠樾牌坊群§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_huizhou_old_town_and_tangyue_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 黄山市歙县§!\n歙县自秦置县，长期是徽州首县，1986年列为国家历史文化名城。县内棠樾村的七座牌坊建于明永乐至清嘉庆年间，旌表忠孝节义，其中一座表彰两淮盐商鲍漱芳父子捐资。"
 PWC_HERITAGE_SHOUXIAN_CITY_WALL_TT: "§H寿县古城墙§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_shouxian_city_wall_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 淮南市寿县§!\n寿县古城墙位于淮南市寿县，是保存完好的古代城墙之一，四门及瓮城仍存。寿县历史上是军事重镇，又易受淮河水患，城墙屡经整修，现存城墙为南宋时重筑。"
 PWC_HERITAGE_QUANZHOU_MARITIME_HERITAGE_TT: "§H泉州古城及宋元海丝遗产§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_quanzhou_maritime_heritage_photo£\n\n\n\n\n\n\n\n§g港口与海丝遗迹 · 泉州市§!\n泉州在10至14世纪的宋元时期是世界性海港，阿拉伯文献称其为刺桐。遗产包括清净寺、伊斯兰教墓、石码头、窑址、冶铁遗址、古桥和古塔等，2021年列入世界遗产。"
 PWC_HERITAGE_FUJIAN_TULOU_YONGDING_TT: "§H福建土楼·永定§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_fujian_tulou_yongding_photo£\n\n\n\n\n\n\n\n§g传统村落与民居 · 龙岩市永定区§!\n福建土楼以夯土为承重墙，平面呈圆形或方形，只设一个出入口，兼具居住与防御功能。土楼主要分布于龙岩永定区和漳州南靖、华安等县，2008年有46座列入世界遗产。"
 PWC_HERITAGE_FUJIAN_TULOU_ZHANGZHOU_TT: "§H福建土楼·南靖、华安§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_fujian_tulou_zhangzhou_photo£\n\n\n\n\n\n\n\n§g传统村落与民居 · 漳州市南靖县、华安县§!\n福建土楼一座可住数百人，由整个宗族聚居，各户纵向分得每层两三间房，外墙厚重而内部装饰讲究。土楼主要分布于龙岩永定区和漳州南靖、华安等县，2008年有46座列入世界遗产。"
 PWC_HERITAGE_CHENGCUN_HAN_CITY_TT: "§H武夷山城村汉城遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_chengcun_han_city_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 南平市武夷山市§!\n城村汉城遗址位于武夷山市兴田镇城村，是一座汉代城池遗址，建造者尚有争议，也称闽越王城遗址。它作为武夷山世界文化与自然遗产的组成部分，1999年列入名录。"
 PWC_HERITAGE_FUZHOU_THREE_LANES_SEVEN_ALLEYS_TT: "§H福州三坊七巷§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_fuzhou_three_lanes_seven_alleys_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 福州市鼓楼区§!\n三坊七巷位于福州鼓楼区，以南后街为轴，西为三坊、东为七巷，是保存完好的里坊街区，有明清古建筑博物馆之称，现为全国重点文物保护单位，并列入世界遗产预备名单。"
 PWC_HERITAGE_TAMSUI_FORT_SANTO_DOMINGO_TT: "§H淡水红毛城及河口历史建筑§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tamsui_fort_santo_domingo_photo£\n\n\n\n\n\n\n\n§g港口与海丝遗迹 · 新北市淡水区§!\n红毛城位于新北市淡水区，1628年西班牙人在此建圣多明各城，1644年荷兰人于原址附近重建，因当时汉人称荷兰人为红毛而得名。1724年清朝官员整修并增建外围城门。"
 PWC_HERITAGE_ANPING_FORT_TT: "§H安平古堡§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_anping_fort_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 台南市§!\n安平古堡原为荷兰东印度公司所建的热兰遮城，1624年在原址重建堡垒，1634年竣工，是台湾最早的要塞建筑，曾是荷兰及明郑统治台湾的中枢，现存城垣遗迹。"
 PWC_HERITAGE_LUKANG_OLD_STREET_TT: "§H鹿港老街与龙山寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_lukang_longshan_temple_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 彰化县鹿港镇§!\n鹿港龙山寺是清代港镇的重要宗教建筑，相传前身小庙创建于1653年，后形成山门、戏台、正殿和后殿的三进格局。老街周边保存传统街屋与商贸空间，反映台湾西岸港镇的宗族与民间信仰。"
 PWC_HERITAGE_KINMEN_SETTLEMENTS_TT: "§H金门传统聚落§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_kinmen_shuitou_village_photo£\n\n\n\n\n\n\n\n§g传统村落与民居 · 金门§!\n金门传统聚落以水头、珠山等村落为代表，闽式合院与侨乡洋楼并存。商人返乡营建的宅院、宗祠和庙宇保存宗族组织与海岛移民交流的痕迹；本条以水头聚落为配图示例。"
 PWC_HERITAGE_WUDANG_MOUNTAINS_TT: "§H武当山古建筑群§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_wudang_mountains_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 十堰市丹江口市§!\n武当山自唐初成为道教中心，明代永乐年间大规模营建，形成九宫九观等庞大体系。现存53座古建筑和9处遗址，包括1307年铸造的古铜殿和1419年的石砌紫禁城。"
 PWC_HERITAGE_JINGZHOU_CITY_WALL_TT: "§H荆州古城墙§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jingzhou_city_wall_photo£\n\n\n\n\n\n\n§g关隘与城防 · 荆州市荆州区§!\n荆州古城墙现存砖城为明代所筑，东西长3.75公里、南北宽1.2公里，周长11.28公里，墙高9米，城墙整体保存完好，已列入世界遗产预备名单中的明清城墙项目。"
 PWC_HERITAGE_GULONGZHONG_TT: "§H古隆中§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_gulongzhong_photo£\n\n\n\n\n\n\n\n§g文化景观 · 襄阳市襄城区§!\n古隆中位于湖北襄阳，是一处明清古建筑遗产，1956年以隆中诸葛亮故居之名列为湖北省第一批文物保护单位，1996年列入第四批全国重点文物保护单位。"
 PWC_HERITAGE_MING_XIANLING_TT: "§H明显陵§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_ming_xianling_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 荆门市钟祥市§!\n明显陵位于湖北钟祥，是明世宗生父母的合葬陵，也是明代帝陵中最大的单体陵墓。一陵两冢的布局和龙形神道在明代帝陵中独一无二，2000年列入世界遗产。"
 PWC_HERITAGE_YUELU_ACADEMY_TT: "§H岳麓书院§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yuelu_academy_photo£\n\n\n\n\n\n\n\n§g书院、学宫与文庙 · 长沙市岳麓区§!\n岳麓书院位于长沙岳麓山东麓，始建于北宋开宝九年（976年），为中国古代四大书院之一，历经宋元明清，1903年改为湖南高等学堂，至今仍是湖南大学的办学机构。"
 PWC_HERITAGE_FENGHUANG_OLD_TOWN_TT: "§H凤凰古城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_fenghuang_old_town_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 湘西土家族苗族自治州凤凰县§!\n凤凰古城位于湘西凤凰县沱江镇，明清时为五寨司城，是西南交通要地和镇竿总兵驻地。清初有“六千居民八千兵”的屯边要塞之称，乾隆年间商业繁荣。"
 PWC_HERITAGE_TONGGUAN_KILNS_TT: "§H长沙铜官窑遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tongguan_kilns_photo£\n\n\n\n\n\n\n\n§g窑址与陶瓷遗存 · 长沙市望城区§!\n长沙铜官窑位于长沙望城区，是唐五代时期的南方民窑，创烧于中唐，晚唐五代最盛。出土大量釉下彩器物，被视为釉下彩装饰的源头，1988年列为全国重点文物保护单位。"
 PWC_HERITAGE_YUEYANG_TOWER_TT: "§H岳阳楼§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yueyang_tower_photo£\n\n\n\n\n\n\n\n§g文化景观 · 岳阳市岳阳楼区§!\n岳阳楼位于岳阳古城西门之上，下临洞庭湖，因范仲淹《岳阳楼记》闻名。前身相传为东吴鲁肃的阅军楼，中唐始称岳阳楼，是江南三大名楼中唯一保持原貌的古建筑。"
 PWC_HERITAGE_LUSHAN_BAILUDONG_ACADEMY_TT: "§H庐山与白鹿洞书院§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_lushan_bailudong_academy_photo£\n\n\n\n\n\n\n§g书院、学宫与文庙 · 九江市庐山市§!\n庐山北临长江、南濒鄱阳湖，有200余处历史建筑。白鹿洞书院始建于940年，南宋时朱熹重建并亲自讲学，确立书院学规，被誉为海内第一书院。"
 PWC_HERITAGE_JINGDEZHEN_IMPERIAL_KILNS_TT: "§H景德镇古窑址与御窑遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jingdezhen_imperial_kilns_photo£\n\n\n\n\n\n\n\n§g窑址与陶瓷遗存 · 景德镇市§!\n景德镇手工瓷业遗存反映10至19世纪的制瓷体系，包括御窑与民窑、湖田古窑址及高岭土矿遗址。瓷石加高岭土的二元配方和青花瓷使其成为世界瓷业中心，2026年列入世界遗产。"
 PWC_HERITAGE_LONGHU_MOUNTAIN_TT: "§H龙虎山道教遗迹与崖墓§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_longhu_mountain_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 鹰潭市龙虎山§!\n龙虎山位于江西贵溪，丹霞峰林属世界遗产中国丹霞。这里是正一道祖庭，有嗣汉天师府和大上清宫；仙水岩一带两千多年前古越人的悬棺崖墓群是全国重点文物保护单位。"
 PWC_HERITAGE_TENGWANG_PAVILION_TT: "§H滕王阁§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tengwang_pavilion_photo£\n\n\n\n\n\n\n\n§g文化景观 · 南昌市东湖区§!\n滕王阁位于南昌赣江东岸，与岳阳楼、黄鹤楼并称江南三大名楼。历史上屡毁屡建，现存楼阁为1989年在原址重建，方案参考梁思成的草图，采用宋代木构风格。"
 PWC_HERITAGE_NANYUE_PALACE_AND_TOMB_TT: "§H南越国宫署遗址与南越文王墓§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_nanyue_palace_and_tomb_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 广州市越秀区§!\n南越国宫署遗址位于广州越秀区，发现南越国宫殿、御花园和南汉宫殿遗迹。象岗山的南越文王墓葬南越国第二代君主赵眜，出土文帝行玺金印，是岭南已发现规模最大的陵墓。"
 PWC_HERITAGE_NANHAI_GOD_TEMPLE_TT: "§H南海神庙§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_nanhai_god_temple_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 广州市黄埔区§!\n南海神庙又称波罗庙，位于广州黄埔区，始建于隋开皇年间，是古代皇帝祭祀南海神的场所，也是四海神庙中唯一完整保存的建筑遗迹，2013年列为全国重点文物保护单位。"
 PWC_HERITAGE_HUAISHENG_LIGHTHOUSE_MINARET_TT: "§H怀圣寺光塔§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_huaisheng_lighthouse_minaret_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 广州市越秀区§!\n怀圣寺位于广州越秀区光塔路，始建于唐代，是中国现存最早的清真寺之一。寺内怀圣塔原为诵经之所，因旧时临近珠江、入夜灯光可为船只导航而称光塔。"
 PWC_HERITAGE_CHAOZHOU_OLD_TOWN_TT: "§H潮州古城与广济桥§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_chaozhou_guangji_bridge_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 潮州市湘桥区§!\n潮州古城依韩江而建，广济桥位于湘桥区东门外，南宋乾道七年（1171）始建，后屡经重修。桥由石墩、梁桥和可启闭的浮桥舟组成，是古代韩江交通与潮州府城历史的实物见证。"
 PWC_HERITAGE_LINGQU_CANAL_TT: "§H灵渠§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_lingqu_canal_photo£\n\n\n\n\n\n\n\n§g古代水利与运河 · 桂林市兴安县§!\n灵渠位于桂林兴安县，开凿于秦代，沟通长江水系的湘江和珠江水系的漓江，是已知最古老的运河之一，自古为岭南与中原之间的水路要道，2018年列入世界灌溉工程遗产。"
 PWC_HERITAGE_ZUOJIANG_HUASHAN_ROCK_ART_TT: "§H左江花山岩画§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zuojiang_huashan_rock_art_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 崇左市宁明县§!\n左江花山岩画分布在左江及明江沿岸的峭壁上，共38处，绘制于公元前5世纪至公元2世纪，由骆越人所作，描绘与铜鼓文化相关的祭祀场景，2016年列入世界遗产。"
 PWC_HERITAGE_HEPU_HAN_TOMBS_AND_PORT_TT: "§H合浦汉墓群及古港§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_hepu_han_tombs_and_port_photo£\n\n\n\n\n\n\n\n§g港口与海丝遗迹 · 北海市合浦县§!\n合浦汉墓群及古港位于北海合浦，自西汉至东汉持续使用，墓群与港址共同见证合浦作为海上丝绸之路始发地的历史。配图为博物馆墓群分布图，古港范围另据文献核定。"
 PWC_HERITAGE_HUANGYAO_OLD_TOWN_TT: "§H黄姚古镇§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_huangyao_old_town_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 贺州市昭平县§!\n黄姚位于贺州昭平县，是有近千年历史的古镇，发祥于宋代，兴建于明万历年间，鼎盛于清乾隆年间。四面环山、交通闭塞，至今保留大量明清建筑和古戏台、宗祠。"
 PWC_HERITAGE_YAZHOU_OLD_TOWN_TT: "§H崖州古城与学宫§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yazhou_old_town_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 三亚市崖州区§!\n崖州城墙为古代崖州州城，现存南门及北段部分墙体。城中的崖城学宫即崖州州学，始建于北宋，现存建筑为清道光年间迁至今址后重建。"
 PWC_HERITAGE_DONGPO_ACADEMY_TT: "§H东坡书院§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dongpo_academy_photo£\n\n\n\n\n\n\n\n§g书院、学宫与文庙 · 儋州市中和镇§!\n东坡书院位于儋州中和镇东郊，为苏轼故居遗址，明清时期改建，文革时被毁、文物荡然无存，1982年重建，现有载酒亭、载酒堂等，辟为陈列馆。"
 PWC_HERITAGE_LI_BOAT_SHAPED_HOUSES_TT: "§H黎族船形屋聚落§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_li_boat_shaped_houses_photo£\n\n\n\n\n\n\n§g传统村落与民居 · 东方市江边乡白查村§!\n船形屋是海南黎族的传统民居，白查村是世界遗产预备项目海南热带雨林和黎族传统聚落中的代表村落之一。明清时期的《琼黎风俗图》等已记录船形屋村落。"
 PWC_HERITAGE_PING_SHAN_HERITAGE_TRAIL_TT: "§H屏山文物径与聚星楼§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_ping_shan_heritage_trail_photo£\n\n\n\n\n\n\n\n§g传统村落与民居 · 香港元朗区屏山§!\n屏山文物径是香港第一条文物径，1993年开放，串联屏山邓族的祠堂、书室、庙宇和围村。沿途的聚星楼据族谱为邓族七世祖邓彦通所建，是香港唯一的古塔。"
 PWC_HERITAGE_WALLED_VILLAGES_LUNG_YEUK_TAU_KAM_TIN_TT: "§H龙跃头与锦田古围村§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_walled_villages_lung_yeuk_tau_kam_tin_photo£\n\n\n\n\n\n\n\n§g传统村落与民居 · 香港北区、元朗区§!\n龙跃头邓氏源自江西吉水，元末由锦田迁入粉岭一带，逐渐形成五围六村，包括老围、麻笏围、永宁围等。锦田同为邓族聚居地，以吉庆围等围村著称。"
 PWC_HERITAGE_TUNG_LUNG_FORT_TT: "§H东龙洲炮台§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tung_lung_fort_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 香港西贡区东龙洲§!\n东龙洲炮台位于西贡东龙洲东北端，俯瞰佛堂门海峡。据《新安县志》建于清康熙年间以防海盗，另有文献记为两广总督杨琳在1719至1724年间下令修建，设兵房15间、炮8门。"
 PWC_HERITAGE_HISTORIC_CENTRE_OF_MACAO_TT: "§H澳门历史城区§!\n\n\n\n£PWC_HERITAGE_ART_historic_centre_of_macao_photo£\n\n\n\n§g古城、古镇与历史街区 · 澳门半岛§!\n澳门历史城区由22座主要建筑和公共空间组成，见证16世纪中叶以来中西方在贸易、宗教、建筑和技术上的长期交汇，包括中国最古老的灯塔，2005年列入世界遗产。"
 PWC_HERITAGE_MACAO_A_MA_TEMPLE_AND_RUINS_TT: "§H妈阁庙、大三巴与大炮台§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_macao_a_ma_temple_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 澳门半岛§!\n妈阁庙、大三巴牌坊遗址与大炮台均位于澳门半岛，属于澳门历史城区。妈阁庙延续港口妈祖信仰，大三巴保留圣保禄教堂石砌正立面，大炮台见证早期海防，三处共同呈现中西交流的港口历史。"
 PWC_HERITAGE_DUJIANGYAN_AND_QINGCHENG_TT: "§H都江堰与青城山§!\n\n\n\n\n£PWC_HERITAGE_ART_dujiangyan_and_qingcheng_photo£\n\n\n\n\n§g古代水利与运河 · 成都市都江堰市§!\n都江堰约于公元前256年修建，不筑坝而利用地形分水，由鱼嘴、飞沙堰和宝瓶口组成，至今仍灌溉成都平原。附近的青城山是道教发源地之一，两者2000年同列世界遗产。"
 PWC_HERITAGE_SANXINGDUI_SITE_TT: "§H三星堆遗址§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_sanxingdui_site_photo£\n\n\n\n\n\n\n§g古城与聚落遗址 · 德阳市广汉市§!\n三星堆遗址位于广汉市三星堆镇鸭子河畔，年代约为公元前2800至前1100年，是古蜀青铜文明的代表，证明四川上古时期拥有高度发达的文明，与金沙遗址一同列入世界遗产预备名单。"
 PWC_HERITAGE_JINSHA_SITE_TT: "§H金沙遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jinsha_site_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 成都市青羊区§!\n金沙遗址位于成都青羊区，2001年发现，面积超过5平方公里，年代约为公元前1250至前650年，代表古蜀政治中心的一次转移，与三星堆遗址一同列入世界遗产预备名单。"
 PWC_HERITAGE_JIANMEN_SHU_ROAD_TT: "§H剑门蜀道§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jianmen_shu_road_photo£\n\n\n\n\n\n\n\n§g古道与古桥 · 广元市剑阁县§!\n剑门关位于广元剑阁县，是古代关隘，与雁门关、函谷关、仙霞关并称四大古关，有剑门天下险之称。蜀道金牛道即经广元越大小剑山出川。"
 PWC_HERITAGE_DAZU_ROCK_CARVINGS_TT: "§H大足石刻§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dazu_rock_carvings_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 重庆市大足区§!\n大足石刻分布在重庆大足区的五处崖壁上，雕刻于9至13世纪。北山有一万余尊造像，石篆山佛、道、儒三教并列的布局罕见，宝顶山是密宗造像的巅峰，1999年列入世界遗产。"
 PWC_HERITAGE_DIAOYU_FORTRESS_TT: "§H钓鱼城遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_diaoyu_fortress_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 重庆市合川区§!\n钓鱼城位于重庆合川嘉陵江南岸的钓鱼山上，是南宋四川抗蒙山城之一。1259年守军在此抗击蒙古军，蒙古大汗蒙哥死于此役，被称为中国保存最完好的古战场遗址。"
 PWC_HERITAGE_BAIDI_CITY_TT: "§H白帝城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_baidi_city_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 重庆市奉节县§!\n白帝城位于重庆奉节瞿塘峡口的长江北岸，背倚高峡、面对峡口。除明清时期的白帝庙外，还有石器时代到明清各时期的遗址，2006年列为全国重点文物保护单位。"
 PWC_HERITAGE_LIJIANG_OLD_TOWN_TT: "§H丽江古城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_lijiang_old_town_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 丽江市古城区§!\n丽江古城海拔2400米，由大研古城、白沙和束河三部分组成。大研在明代作为商业中心兴起，民居融合汉、藏建筑元素，体现纳西文化，古老的供水网络至今仍在使用。"
 PWC_HERITAGE_HONGHE_HANI_TERRACES_TT: "§H元阳哈尼梯田§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_honghe_hani_terraces_photo£\n\n\n\n\n\n\n§g文化景观 · 红河哈尼族彝族自治州元阳县§!\n哈尼梯田位于红河南岸的哀牢山坡，哈尼族在1300年间开垦出层层梯田，引山林之水灌溉，形成牛、鸭、鱼与红米共生的农业系统，82个村寨多为蘑菇房。"
 PWC_HERITAGE_DALI_THREE_PAGODAS_TT: "§H大理三塔§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dali_three_pagodas_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 大理市§!\n崇圣寺三塔位于大理古城西北，是南诏末期修建的三座砖塔，主塔千寻塔为密檐式，南北两座小塔为楼阁式。明清多次修缮，1978至1981年大修时出土大量文物。"
 PWC_HERITAGE_JIANSHUI_OLD_TOWN_TT: "§H建水古城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jianshui_old_city_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 红河哈尼族彝族自治州建水县§!\n建水古城古称临安，位于云南红河建水县，街巷、城门、文庙和传统民居共同构成滇南府城格局。明清以来的商贸与科举文化在古城留下会馆、宗祠和书院等遗存，朝阳门附近仍可见老城生活空间。"
 PWC_HERITAGE_SHAXI_OLD_TOWN_TT: "§H沙溪古镇§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_shaxi_old_theatre_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 大理白族自治州剑川县§!\n沙溪古镇位于云南大理剑川县，因茶马古道贸易形成驿镇，寺登街、古戏台、兴教寺和商旅院落保存传统空间。古镇展示滇西山地交通、白族聚落与跨区域贸易的历史联系。"
 PWC_HERITAGE_HAILONGTUN_TT: "§H海龙屯土司遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_hailongtun_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 遵义市汇川区§!\n海龙屯位于遵义汇川区龙岩山上，是播州杨氏土司的军事城堡，杨氏统治播州27世，1600年平播之役后城毁。它作为土司遗址的组成部分，2015年列入世界遗产。"
 PWC_HERITAGE_ZHENYUAN_OLD_TOWN_TT: "§H镇远古城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhenyuan_ancient_town_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 黔东南苗族侗族自治州镇远县§!\n镇远古城位于贵州黔东南镇远县舞阳河畔，依山临水，城垣、街巷、会馆和民居沿河展开。它是黔东地区山地城镇与多民族商贸往来的历史见证，现存格局以明清以来遗存为主。"
 PWC_HERITAGE_QINGYAN_OLD_TOWN_TT: "§H青岩古镇§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qingyan_old_town_photo£\n\n\n\n\n\n\n\n§g古城、古镇与历史街区 · 贵阳市花溪区§!\n青岩古镇位于贵阳花溪区，建于明洪武十年（1378年），原为军事要塞，镇内明清古建筑密布，寺庙楼阁雕梁画栋，是贵州四大古镇之一和中国历史文化名镇。"
 PWC_HERITAGE_BAOJIATUN_WATERWORKS_TT: "§H鲍家屯古水利§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_baojiatun_waterworks_photo£\n\n\n\n\n\n\n\n§g古代水利与运河 · 安顺市西秀区§!\n鲍屯位于安顺西秀区大西桥镇，是明初调北征南后留军屯田形成的屯堡村落。村中明代古水利以拦河坝和鱼嘴分水引水灌溉，600多年来仍在发挥作用。"
 PWC_HERITAGE_XANADU_SITE_TT: "§H元上都遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_xanadu_site_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 锡林郭勒盟正蓝旗§!\n元上都位于锡林郭勒正蓝旗，由忽必烈的谋士刘秉忠于1256年规划，1263至1273年为元朝首都，此后为夏都。城址保留宫城、皇城和外城，体现游牧与农耕文化的融合。"
 PWC_HERITAGE_JUYAN_SITE_TT: "§H居延遗址与汉简§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_juyan_site_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 阿拉善盟额济纳旗§!\n居延遗址与汉简位于额济纳河下游及黑城一带，是汉代边塞屯戍与文书行政遗存。烽燧、城障和道路遗迹见证边防体系，出土汉简保存军政、粮秣和往来文书；配图为博物馆所藏汉简。"
 PWC_HERITAGE_QIN_STRAIGHT_ROAD_TT: "§H秦直道遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qin_straight_road_photo£\n\n\n\n\n\n\n\n§g古道与古桥 · 鄂尔多斯市§!\n秦直道始建于公元前212年，是秦代修筑的交通干道。内蒙古段已确定路段北起达拉特旗，穿过鄂尔多斯高原中部，南至伊金霍洛旗，沿途丘陵经过开凿，山谷有垫土。"
 PWC_HERITAGE_YILIN_POST_STATION_TT: "§H伊林驿站遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yilin_post_station_photo£\n\n\n\n\n\n\n\n§g古道与古桥 · 锡林郭勒盟二连浩特市§!\n伊林驿站遗址位于内蒙古二连浩特市区东北约9公里的盐池西北坡，占地约1600平方米，是张家口—二连—库伦古茶叶之路的重要遗存。遗址反映清代北方驿运、商旅往来与中蒙交通。"
 PWC_HERITAGE_DAZHAO_TEMPLE_TT: "§H大召寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dazhao_temple_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 呼和浩特市玉泉区§!\n大召寺位于呼和浩特玉泉区，始建于明万历年间，是蒙古地区重要的藏传佛教寺院。寺内银佛、龙雕和壁画等遗存体现草原城市的宗教与商贸交流，现存建筑多经后世修缮。"
 PWC_HERITAGE_WEIYANG_PALACE_TT: "§H汉长安城未央宫遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_weiyang_palace_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 西安市未央区§!\n未央宫是汉长安城的主要宫殿，公元前200年由萧何主持营建，西汉时长期作为皇帝居所和中央政府所在地。现存夯土台基等遗迹，2014年作为丝绸之路组成部分列入世界遗产。"
 PWC_HERITAGE_QIN_MAUSOLEUM_TT: "§H秦始皇陵及兵马俑§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qin_mausoleum_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 西安市临潼区§!\n秦始皇陵位于西安临潼骊山北麓，公元前246年开始修建，封土现高51.3米。周围近200座陪葬坑出土数以千计的真人大小陶俑、陶马和铜车马，1987年列入世界遗产。"
 PWC_HERITAGE_ZHANG_QIAN_TOMB_BAOXIE_ROAD_TT: "§H张骞墓与褒斜道§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhang_qian_tomb_baoxie_road_photo£\n\n\n\n\n\n\n\n§g古道与古桥 · 汉中市城固县、褒河谷口§!\n张骞墓位于汉中城固，褒斜道沿褒河过石门穿越秦岭。配图上为张骞墓、下为石门栈道景区；原石门部分已因水库建设没入水下。"
 PWC_HERITAGE_FAMEN_TEMPLE_CRYPT_TT: "§H法门寺地宫§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_famen_temple_crypt_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 宝鸡市扶风县§!\n法门寺位于扶风县法门镇，有关中塔庙始祖之称。1987年地宫被发现，出土佛指骨舍利和八重宝函等数千件唐代珍宝，使其在佛教和考古界享有很高地位。"
 PWC_HERITAGE_MOGAO_CAVES_TT: "§H敦煌莫高窟§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_mogao_caves_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 酒泉市敦煌市§!\n莫高窟开凿在敦煌绿洲东南的崖壁上，始建于366年，现存492个洞窟、约4.5万平方米壁画和2000多身彩塑，跨越4至14世纪，是丝路文化交流的佛教艺术宝库。"
 PWC_HERITAGE_YUMEN_AND_YANG_PASSES_TT: "§H玉门关与阳关§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yumen_and_yang_passes_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 酒泉市敦煌市§!\n玉门关俗称小方盘城，汉武帝时设置，因西域玉石取道于此得名，出关为北道；西南的阳关把守南道，两关合称二关。玉门关遗址属丝绸之路世界遗产。"
 PWC_HERITAGE_MAIJISHAN_GROTTOES_TT: "§H麦积山石窟§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_maijishan_grottoes_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 天水市麦积区§!\n麦积山石窟位于天水麦积区，始建于后秦，此后十余个朝代续凿，现存洞窟194个、塑像约7200身，以泥塑著称，2014年作为丝绸之路组成部分列入世界遗产。"
 PWC_HERITAGE_BINGLING_TEMPLE_GROTTOES_TT: "§H炳灵寺石窟§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_bingling_temple_grottoes_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 临夏回族自治州永靖县§!\n炳灵寺石窟开凿在永靖县黄河北岸大寺沟的峭壁上，第169窟有西秦建弘元年（420年）墨书题记，是此处最早的纪年。现存洞窟34个、龛149个，属丝绸之路世界遗产。"
 PWC_HERITAGE_LEITAI_HAN_TOMB_TT: "§H武威雷台汉墓§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_leitai_han_tomb_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 武威市凉州区§!\n雷台汉墓位于甘肃武威雷台，年代约为东汉晚期至魏晋初期，墓中出土铜奔马、仪仗俑等随葬品。遗存展示河西地区汉晋墓葬制度、交通和社会生活，2001年列入全国重点文物保护单位。"
 PWC_HERITAGE_WESTERN_XIA_TOMBS_TT: "§H西夏陵§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_western_xia_tombs_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 银川市贺兰山东麓§!\n西夏陵位于银川贺兰山东麓，是西夏王朝的皇家陵园，包括9座帝陵、271座陪葬墓和32处防洪设施。党项人于1038年建立西夏，1227年亡于蒙古，陵园2025年列入世界遗产。"
 PWC_HERITAGE_XUMISHAN_GROTTOES_TT: "§H须弥山石窟§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_xumishan_grottoes_photo£\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 固原市原州区§!\n须弥山石窟位于固原市原州区西北的须弥山上，是北朝至唐代开凿的石窟群，部分为明清时开凿。周边原有的佛道寺庙已毁，1982年列为全国重点文物保护单位。"
 PWC_HERITAGE_HELAN_ROCK_ART_TT: "§H贺兰山岩画§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_helan_rock_art_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 银川市贺兰县贺兰口§!\n贺兰山岩画分布在贺兰山中，北至石嘴山、南至中卫，1969年首先在贺兰口发现，题材以人面像和游牧生活为主，还有部分西夏文；断代尚无定论。"
 PWC_HERITAGE_GUYUAN_OLD_CITY_TT: "§H固原古城遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_guyuan_old_city_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 固原市§!\n固原古城始建于西汉元鼎三年（公元前114年），北周新建外城，此后屡毁屡修。1920年海原大地震严重损毁，城墙后多被拆除，仅存外城西北角，2013年列为全国重点文物保护单位。"
 PWC_HERITAGE_JIAOHE_GAOCHANG_TT: "§H交河故城与高昌故城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jiaohe_gaochang_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 吐鲁番市高昌区§!\n交河故城约建于公元前2世纪，是规模最大的生土城市遗址，曾为车师前国都城；高昌故城是公元前1世纪到14世纪吐鲁番盆地的中心城镇。两城均毁于14世纪战火，同属丝路世界遗产。"
 PWC_HERITAGE_KIZIL_SUBASHI_TT: "§H克孜尔石窟与苏巴什佛寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_kizil_subashi_photo£\n\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 阿克苏地区拜城县、库车市§!\n克孜尔千佛洞位于拜城县克孜尔镇东南的明屋塔格山崖壁上，现存编号洞窟236个，81窟存有壁画，是古龟兹国文化遗存；库车的苏巴什佛寺遗址又称昭怙厘大寺，两处同属丝路世界遗产。"
 PWC_HERITAGE_BEITING_ANCIENT_CITY_TT: "§H北庭故城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_beiting_ancient_city_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 昌吉回族自治州吉木萨尔县§!\n北庭故城位于吉木萨尔县，一般认为即史籍中的别失八里，唐代为庭州和北庭大都护府城，840年后曾为高昌回鹘都城和陪都，15世纪毁于战争，现为丝路世界遗产组成部分。"
 PWC_HERITAGE_TURPAN_KAREZ_TT: "§H吐鲁番坎儿井§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_turpan_karez_photo£\n\n\n\n\n\n\n\n§g古代水利与运河 · 吐鲁番市§!\n坎儿井由明渠、暗渠、竖井和涝坝组成，暗渠把地下水引至龙口流出地面。吐鲁番地区共有1100余条，年径流约2.94亿立方米，灌溉当地约三成耕地，已列入世界遗产预备名单。"
 PWC_HERITAGE_JIRZANKAL_CEMETERY_TT: "§H吉尔赞喀勒墓地§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jirzankal_cemetery_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 喀什地区塔什库尔干塔吉克自治县§!\n吉尔赞喀勒墓地位于塔什库尔干县曲曼村的河岸台地，地表铺设黑白石条，测年距今约2500年，出土木质火坛，被认为是欧亚大陆首次发现的约公元前500年琐罗亚斯德教遗迹。"
 PWC_HERITAGE_RIYUE_MOUNTAIN_TANG_TIBET_ROAD_TT: "§H日月山与唐蕃古道§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_riyue_mountain_tang_tibet_road_photo£\n\n\n\n\n\n\n\n§g古道与古桥 · 西宁市湟源县§!\n日月山古称赤岭，位于湟源县西南，是青海农区与牧区的天然分界线，也是唐蕃古道等道路的必经之地。822年唐朝与吐蕃议和，在此一带划定边界。"
 PWC_HERITAGE_KUMBUM_MONASTERY_TT: "§H塔尔寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_kumbum_monastery_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 西宁市湟中区§!\n塔尔寺位于西宁湟中区鲁沙尔镇，是格鲁派六大寺院之一，寺址为宗喀巴诞生地。1379年其母在此修建纪念塔，1560年僧人在塔旁建寺，此后经明清持续扩建。"
 PWC_HERITAGE_DULAN_RESHUI_TOMBS_TT: "§H都兰热水墓群§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dulan_reshui_tombs_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 海西蒙古族藏族自治州都兰县§!\n热水墓群位于都兰县热水乡察汗乌苏河两岸，是吐谷浑和吐蕃时期的墓葬群，两岸共有墓葬近300座，1982年发现后多次发掘，1996年列为全国重点文物保护单位。"
 PWC_HERITAGE_POTALA_JOKHANG_NORBULINGKA_TT: "§H布达拉宫、大昭寺与罗布林卡§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_potala_jokhang_norbulingka_photo£\n\n\n\n\n\n\n\n§g宫殿与皇家园林 · 拉萨市§!\n布达拉宫依拉萨红山而建，最初由吐蕃赞普松赞干布兴建，17世纪重建后成为历代达赖喇嘛的冬宫；大昭寺同建于7世纪，罗布林卡是18世纪修建的夏宫。"
 PWC_HERITAGE_SAMYE_MONASTERY_TT: "§H桑耶寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_samye_monastery_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 山南市扎囊县§!\n桑耶寺位于山南扎囊县雅鲁藏布江北岸，始建于8世纪吐蕃王朝时期，是西藏第一座剃度僧人出家的寺院。寺内建筑按佛教宇宙观布局，中心佛殿融合藏、汉、印度三种风格。"
 PWC_HERITAGE_SAKYA_MONASTERY_TT: "§H萨迦寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_sakya_monastery_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 日喀则市萨迦县§!\n萨迦寺位于日喀则萨迦县本波山下，是萨迦派主寺。1073年昆·贡却杰布在此出资建寺，后逐渐形成萨迦派；寺内文物收藏极其丰富，被誉为第二敦煌。"
 PWC_HERITAGE_TASHILHUNPO_MONASTERY_TT: "§H扎什伦布寺§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tashilhunpo_monastery_photo£\n\n\n\n\n\n\n§g寺观与宗教建筑 · 日喀则市桑珠孜区§!\n扎什伦布寺位于日喀则主城区日光山南麓，始建于1447年，是后藏最大的寺院和历代班禅喇嘛驻锡地，旧时为后藏政教中心，与拉萨三大寺等并为格鲁派六大寺。"
 PWC_HERITAGE_PELKOR_CHODE_MONASTERY_TT: "§H白居寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_pelkor_chode_monastery_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 日喀则市江孜县§!\n白居寺位于江孜镇宗山脚下，创建于1418至1436年，萨迦、夏鲁、格鲁三派共存。寺内吉祥多门塔始建于1414年，高42.4米，有108个门和76间佛殿，又称十万佛塔。"
 PWC_HERITAGE_GUGE_KINGDOM_RUINS_TT: "§H古格王国遗址§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_guge_kingdom_ruins_photo£\n\n\n\n\n\n\n\n§g古城与聚落遗址 · 阿里地区札达县§!\n古格王国是西藏西部的古代王国，始于10世纪末，1635年为拉达克所灭。遗址位于阿里地区札达县，记录了10世纪末藏传佛教再度兴盛的历史，已列入世界遗产预备名单。"
 PWC_HERITAGE_LESHAN_GIANT_BUDDHA_TT: "§H乐山大佛与凌云寺§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_leshan_giant_buddha_photo£\n\n\n\n\n\n\n§g石窟、石刻与岩画 · 乐山市市中区凌云山§!\n乐山大佛依凌云山栖鸾峰临江崖壁开凿，唐代开元至贞元间历九十年告成。佛像与凌云寺俯瞰三江汇流，展现摩崖造像和山水营造相融的盛唐气象。"
 PWC_HERITAGE_JIAYUGUAN_PASS_TT: "§H嘉峪关关城与长城§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jiayuguan_pass_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 嘉峪关市嘉峪关关城§!\n嘉峪关踞河西走廊西端祁连山与黑山之间，为明代长城西端重关。内城、外城、瓮城、罗城与烽燧连成严整防线，展现边塞防御工程的完整形制。"
 PWC_HERITAGE_JINCI_TEMPLE_TT: "§H晋祠§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jinci_temple_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 太原市晋源区悬瓮山麓§!\n晋祠位于太原悬瓮山麓，为晋国宗祠。圣母殿、鱼沼飞梁与献殿构成核心组群，宋代减柱造木构、彩塑侍女像与难老泉相映，见证北方祠庙建筑艺术。"
 PWC_HERITAGE_EASTERN_QING_TOMBS_TT: "§H清东陵§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_eastern_qing_tombs_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 唐山市遵化市昌瑞山§!\n清东陵依遵化昌瑞山而建，为清入关后首处皇家陵寝。顺治孝陵、康熙景陵、乾隆裕陵等依山错落，神道、石牌坊、大碑楼与隆恩殿保存清代丧葬礼制。"
 PWC_HERITAGE_XUANKONG_TEMPLE_TT: "§H恒山悬空寺§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_xuankong_temple_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 大同市浑源县恒山金龙峡§!\n悬空寺挂于北岳恒山金龙峡绝壁，依崖凿石插木为梁架设栈道。殿阁层叠，释、道、儒三教造像同处一寺，是中国古代崖壁木构建筑的奇观。"
 PWC_HERITAGE_KAIFENG_IRON_PAGODA_TT: "§H开封铁塔与繁塔§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_kaifeng_iron_pagoda_photo£\n\n\n\n\n\n\n\n§g寺观与宗教建筑 · 开封市城区§!\n开封铁塔为开宝寺舍利佛塔，八角十三层，因褐色琉璃砖如铁铸得名；繁塔始于北宋开宝年间，保存佛塔形制与砖雕。二塔共同见证东京城佛教建筑格局。"
 PWC_HERITAGE_TIANYI_PAVILION_TT: "§H天一阁§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tianyi_pavilion_photo£\n\n\n\n\n\n\n\n§g书院、学宫与文庙 · 宁波市海曙区§!\n天一阁由范钦主持营建，是现存最古老的私家藏书楼之一。藏书楼以天一池防火，和园林、假山、碑刻相结合，保存明清文献储藏与江南园林相融的形制。"
 PWC_HERITAGE_QIANLING_MAUSOLEUM_TT: "§H乾陵与无字碑§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qianling_mausoleum_photo£\n\n\n\n\n\n\n\n§g陵墓与墓葬 · 咸阳市乾县梁山§!\n乾陵依梁山三峰为陵，为唐高宗与武则天合葬之帝陵。神道北进，两侧列置华表、翼马、石人与无字碑，展现盛唐依山为陵的宏阔皇陵空间。"
 PWC_HERITAGE_GANZHOU_SONG_CITY_WALL_TT: "§H赣州宋代古城墙§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_ganzhou_song_city_wall_photo£\n\n\n\n\n\n\n\n§g关隘与城防 · 赣州市章贡区§!\n赣州古城三面临江，现存宋代砖石城墙绵延三千余米。城门、炮台与福寿沟排水系统兼具防洪、交通和军事功能，是江南宋城保存完整的城市遗存。"
 PWC_HERITAGE_JINGMAI_TEA_FOREST_TT: "§H普洱景迈山古茶林§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jingmai_tea_forest_photo£\n\n\n\n\n\n\n\n§g文化景观 · 普洱市澜沧拉祜族自治县景迈山§!\n景迈山古茶林由布朗族与傣族先民在约十世纪起持续营建，古茶树、森林、村寨与水源林相依相生。山地茶园保存人与自然协作的传统农业景观。"

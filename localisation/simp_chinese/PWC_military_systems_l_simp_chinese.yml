 pwc_military.107.d:0 "[FROM.GetName]正在准备“战场侦察”。准备期为 3 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n这会提升执行方的侦察效率，不会揭示敌方隐藏变量或强制扣除敌军属性。"
 pwc_military.107.t:0 "敌军战役准备报告"
 pwc_military.108.a:0 "更新作战图。"
 pwc_military.108.d:0 "[FROM.GetName]正在准备“战备库存整顿”。准备期为 7 天，条件仍满足时将获得 30 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n以执行方的军工产出换取一段时间的补给效率；整补前不能切换到其他保障计划。"
 pwc_military.108.t:0 "敌军战役准备报告"
 pwc_military.109.a:0 "更新作战图。"
 pwc_military.109.d:0 "[FROM.GetName]正在准备“野战抢修”。准备期为 3 天，条件仍满足时将获得 30 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n只能减少损耗，不能凭空补齐库存；抢修占用后方生产能力。"
 pwc_military.109.t:0 "敌军战役准备报告"
 pwc_military.110.a:0 "更新作战图。"
 pwc_military.110.d:0 "[FROM.GetName]正在准备“伤员后送与整顿”。准备期为 3 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n加速组织恢复而非发放免费人力；后送期间推进速度降低。"
 pwc_military.110.t:0 "敌军战役准备报告"
 pwc_military.111.a:0 "更新作战图。"
 pwc_military.111.d:0 "[FROM.GetName]正在准备“战线轮换”。准备期为 2 天，条件仍满足时将获得 14 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n可应对敌军短时攻势，但会占用陆军战役组，期间不能再叠加进攻行动。"
 pwc_military.111.t:0 "敌军战役准备报告"
 pwc_military.112.a:0 "更新作战图。"
 pwc_military.112.d:0 "[FROM.GetName]正在准备“反突击防御”。准备期为 2 天，条件仍满足时将获得 14 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n以进攻效率换防御；提前启用可能被敌军等待窗口结束后再进攻。"
 pwc_military.112.t:0 "敌军战役准备报告"
 pwc_military.113.a:0 "更新作战图。"
 pwc_military.113.d:0 "[FROM.GetName]正在准备“集中机动预备队”。准备期为 3 天，条件仍满足时将获得 14 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n集中兵力带来防御和补给代价；敌方可攻击薄弱地段或延缓接战。"
 pwc_military.113.t:0 "敌军战役准备报告"
 pwc_military.114.a:0 "更新作战图。"
 pwc_military.114.d:0 "[FROM.GetName]正在准备“纵深穿插战役”。准备期为 7 天，条件仍满足时将获得 14 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n七天公开集结后仅有十四天窗口；纵深轮换和补给消耗可以拖垮进攻节奏。"
 pwc_military.114.t:0 "敌军战役准备报告"
 pwc_military.115.a:0 "更新作战图。"
 pwc_military.115.d:0 "[FROM.GetName]正在准备“校射与侦察协同”。准备期为 5 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n提供计划与侦察而非即时攻击；敌方可变更主防方向迫使重新部署。"
 pwc_military.115.t:0 "敌军战役准备报告"
 pwc_military.116.a:0 "更新作战图。"
 pwc_military.116.d:0 "[FROM.GetName]正在准备“有限目标攻势”。准备期为 10 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n十天公开准备，推进更慢且补给更重；可转移重心、抢先反击或等待其整补。"
 pwc_military.116.t:0 "敌军战役准备报告"
 pwc_military.117.a:0 "更新作战图。"
 pwc_military.117.d:0 "[FROM.GetName]正在准备“纵深阵地轮换”。准备期为 3 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n核心防御不保护新占领的非核心地区；迟缓的调动可能遭到转向进攻。"
 pwc_military.117.t:0 "敌军战役准备报告"
 pwc_military.118.a:0 "更新作战图。"
 pwc_military.118.d:0 "[FROM.GetName]正在准备“预备队反突击”。准备期为 3 天，条件仍满足时将获得 10 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n只有十天反击窗口；诱使其提前投入后，漫长整补期会暴露预备队空缺。"
 pwc_military.118.t:0 "敌军战役准备报告"
 pwc_military.119.a:0 "更新作战图。"
 pwc_military.119.d:0 "[FROM.GetName]正在准备“机场疏散”。准备期为 2 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n以对地支援效率换本土空防；敌方可转而争夺地面节奏。"
 pwc_military.119.t:0 "敌军战役准备报告"
 pwc_military.120.a:0 "更新作战图。"
 pwc_military.120.d:0 "[FROM.GetName]正在准备“集中截击”。准备期为 2 天，条件仍满足时将获得 14 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n强截击不等于强对地；可压低出动或在对方空中整补期再集中打击。"
 pwc_military.120.t:0 "敌军战役准备报告"
 pwc_military.121.a:0 "更新作战图。"
 pwc_military.121.d:0 "[FROM.GetName]正在准备“近距支援集中出动”。准备期为 4 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n出动强度增加损耗风险；分散地面交战或加强截击可降低收益。"
 pwc_military.121.t:0 "敌军战役准备报告"
 pwc_military.122.a:0 "更新作战图。"
 pwc_military.122.d:0 "[FROM.GetName]正在准备“战场遮断行动”。准备期为 7 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n七天集结会暴露打击周期；拒止航空可用较短准备期迎击。"
 pwc_military.122.t:0 "敌军战役准备报告"
 pwc_military.123.a:0 "更新作战图。"
 pwc_military.123.d:0 "[FROM.GetName]正在准备“沿岸警戒”。准备期为 3 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n岸海警戒会分走护航资源；敌方可转向运输线施压。"
 pwc_military.123.t:0 "敌军战役准备报告"
 pwc_military.124.a:0 "更新作战图。"
 pwc_military.124.d:0 "[FROM.GetName]正在准备“近海伏击”。准备期为 7 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n攻击运输与近海目标，不提供无条件全舰队攻防；护航与绕航可以降低收益。"
 pwc_military.124.t:0 "敌军战役准备报告"
 pwc_military.125.a:0 "更新作战图。"
 pwc_military.125.d:0 "[FROM.GetName]正在准备“集中护航”。准备期为 3 天，条件仍满足时将获得 21 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n护航与破交不能同时集中；敌方可避开护航线，等待护卫舰整补。"
 pwc_military.125.t:0 "敌军战役准备报告"
 pwc_military.126.a:0 "更新作战图。"
 pwc_military.126.d:0 "[FROM.GetName]正在准备“登陆保障窗口”。准备期为 10 天，条件仍满足时将获得 14 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n行动不改变合法宣战目标；登陆仍须满足原生运输和制海条件，公开准备给予守方调动时间。"
 pwc_military.126.t:0 "敌军战役准备报告"
 pwc_military.127.a:0 "更新作战图。"
 pwc_military.127.d:0 "[FROM.GetName]正在准备“联合战役窗口”。准备期为 10 天，条件仍满足时将获得 14 天的行动窗口。\n这是向交战各方公开的准备信号。我们可以调整部署、投入反制或等待其整补。\n同时锁定陆、海、空三个组，不能再叠三种专项行动；失败后整补成本尤其高。"
 pwc_military.127.t:0 "敌军战役准备报告"

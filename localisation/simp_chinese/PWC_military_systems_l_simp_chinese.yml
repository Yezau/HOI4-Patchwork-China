l_simp_chinese:
 PWC_GRAND_GRAND_BATTLEPLAN:0 "战役统筹"
 PWC_GRAND_GRAND_BATTLEPLAN_DESC:0 "用严密计划协调步兵、装甲与保障力量，换取较高的计划上限。准备速度较慢，临时改换主攻方向会损失已投入的组织优势。"
 PWC_GRAND_MASS_ASSAULT:0 "分层国土防御"
 PWC_GRAND_MASS_ASSAULT_DESC:0 "以地方部队、纵深阵地和轮换预备队维持战线，提高恢复与增援能力。较慢的整体行军速度限制追击，优势来自持续防守而非无代价扩张。"
 PWC_GRAND_NEW_BASE_STRIKE:0 "远海联合保障"
 PWC_GRAND_NEW_BASE_STRIKE_DESC:0 "以集中协同和登陆准备支撑远海行动，让舰队服务于陆上目标。破交收益让位于保障任务，登陆仍必须满足原生运输与制海条件。"
 PWC_GRAND_NEW_BATTLEFIELD_SUPPORT:0 "空地协同体系"
 PWC_GRAND_NEW_BATTLEFIELD_SUPPORT_DESC:0 "让空中出动围绕地面战役组织，以攻击机和无人机协助突破。截击体系投入减少，需要主动争夺制空或与拒止力量配合。"
 PWC_GRAND_NEW_CONVOY_RAIDING:0 "近海分散拒止"
 PWC_GRAND_NEW_CONVOY_RAIDING_DESC:0 "用潜艇、轻舰和岸海侦察分割敌方航路，避免不利的舰队决战。护航效率较低，需要在拒止敌人与保护自身运输之间取舍。"
 PWC_GRAND_NEW_FLEET_IN_BEING:0 "海上交通线控制"
 PWC_GRAND_NEW_FLEET_IN_BEING_DESC:0 "围绕巡洋舰和护航舰建立交通线控制，把可靠运输放在破交之前。舰队需要持续部署，突袭商船的效率相应下降。"
 PWC_GRAND_NEW_MOBILE_WARFARE:0 "分布式机动指挥"
 PWC_GRAND_NEW_MOBILE_WARFARE_DESC:0 "将行动权限下放给战斗群，以更快的转进和准备捕捉战机。长时间集中计划的收益较低，需依靠机动预备队和可靠补给维持节奏。"
 PWC_GRAND_NEW_OPERATIONAL_INTEGRITY:0 "分层防空体系"
 PWC_GRAND_NEW_OPERATIONAL_INTEGRITY_DESC:0 "以分散起降、探测和截击保护己方空域，降低持续作战中的非战斗损失。战略轰炸能力较弱，适合保存机队并拒止敌方突击。"
 PWC_GRAND_NEW_STRATEGIC_DESTRUCTION:0 "纵深体系打击"
 PWC_GRAND_NEW_STRATEGIC_DESTRUCTION_DESC:0 "将护航和重型轰炸力量用于压制敌方工业与战役纵深。近距支援资源受到挤占，必须先取得可持续的空中通道。"
 PWC_GRAND_SUPERIOR_FIREPOWER:0 "联合火力网络"
 PWC_GRAND_SUPERIOR_FIREPOWER_DESC:0 "将侦察、炮兵和装甲火力纳入统一火力网，提高火力单位的效能。弹药与运输需求随之上升，缺乏补给的推进难以维持。"

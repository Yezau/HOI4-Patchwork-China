 PWC_STATE_OPERATIONS_SUPPLY_STAGING_TOOLTIP:0 "§H补给预置§!\n缓解部队在此地块缺乏补给时的惩罚。补给充足时没有额外收益，不增加补给量或装备库存。\n\n§H地块加成§!\n缺乏补给惩罚：§G-10%§!\n目标：己方控制或敌对地块。\n仅影响发起势力在此地块的陆军。\n\n消耗：§Y15 指挥点§!\n持续：§Y10 天§! · 立即生效\n同类再次下达：§Y30 天后§!\n所需焦点：§Y战备物资统筹§!\n\n§H行动规则§!\n战术、保障各限一项。\n同类冷却全图共享。\n旧行动与联合战役冷却可能阻止下达。\n海空决议仍在决议页。\n占领后保留剩余时间。\n停战、势力退出时结束。\n转交非敌对势力时结束。\n提前结束不退费，冷却继续。"

 PWC_STATE_OPERATIONS_ACTIVE:0 "§G地块生效§!"
 PWC_STATE_OPERATIONS_COST_BLOCKED:0 "§R指挥点不足§!"
 PWC_STATE_OPERATIONS_DEEP_THRUST_CAPTION:0 "机动穿插"
 PWC_STATE_OPERATIONS_DEEP_THRUST_COST:0 "20 指挥点"
 PWC_STATE_OPERATIONS_DEEP_THRUST_TOOLTIP:0 "§H机动穿插§!\n以较弱的攻防专精换取机动，攻占后加快部队在此地块的行军。防御下降，适合继续推进而非固守。\n\n§H地块加成§!\n陆军攻击：§G+5%§!\n突破：§G+5%§!\n陆军速度：§G+10%§!\n陆军防御：§R-5%§!\n目标：敌对地块。\n仅影响发起势力在此地块的陆军。\n战斗加成也适用于进攻此地块。\n行军按部队所在地块结算。\n\n消耗：§Y20 指挥点§!\n持续：§Y7 天§! · 立即生效\n同类再次下达：§Y21 天后§!\n所需焦点：§Y机动预备队 或 纵深穿插§!\n\n§H行动规则§!\n战术、保障各限一项。\n同类冷却全图共享。\n旧行动与联合战役冷却可能阻止下达。\n海空决议仍在决议页。\n占领后保留剩余时间。\n停战、势力退出时结束。\n转交非敌对势力时结束。\n提前结束不退费，冷却继续。"
 PWC_STATE_OPERATIONS_DELIBERATE_ASSAULT_CAPTION:0 "突击掩护"
 PWC_STATE_OPERATIONS_DELIBERATE_ASSAULT_COST:0 "20 指挥点"
 PWC_STATE_OPERATIONS_DELIBERATE_ASSAULT_TOOLTIP:0 "§H突击掩护§!\n为突击部队提供掩护，提高进攻时的突破属性，减轻承受的敌方火力。不增加攻击伤害。\n\n§H地块加成§!\n突破：§G+10%§!\n目标：敌对地块。\n仅影响发起势力在此地块的陆军。\n战斗加成也适用于进攻此地块。\n\n消耗：§Y20 指挥点§!\n持续：§Y7 天§! · 立即生效\n同类再次下达：§Y21 天后§!\n所需焦点：§Y战役预备队 或 有限目标突破 或 战役反突击§!\n\n§H行动规则§!\n战术、保障各限一项。\n同类冷却全图共享。\n旧行动与联合战役冷却可能阻止下达。\n海空决议仍在决议页。\n占领后保留剩余时间。\n停战、势力退出时结束。\n转交非敌对势力时结束。\n提前结束不退费，冷却继续。"
 PWC_STATE_OPERATIONS_ELASTIC_COUNTERATTACK_CAPTION:0 "阵地防御"
 PWC_STATE_OPERATIONS_ELASTIC_COUNTERATTACK_COST:0 "20 指挥点"
 PWC_STATE_OPERATIONS_ELASTIC_COUNTERATTACK_TOOLTIP:0 "§H阵地防御§!\n加强驻守部队的防御，适合守住己方阵地或巩固新占地块。不提高进攻伤害或突破。\n\n§H地块加成§!\n陆军防御：§G+10%§!\n目标：己方控制或敌对地块。\n仅影响发起势力在此地块的陆军。\n战斗加成也适用于进攻此地块。\n\n消耗：§Y20 指挥点§!\n持续：§Y7 天§! · 立即生效\n同类再次下达：§Y21 天后§!\n所需焦点：§Y纵深防御 或 城市要塞化§!\n\n§H行动规则§!\n战术、保障各限一项。\n同类冷却全图共享。\n旧行动与联合战役冷却可能阻止下达。\n海空决议仍在决议页。\n占领后保留剩余时间。\n停战、势力退出时结束。\n转交非敌对势力时结束。\n提前结束不退费，冷却继续。"
 PWC_STATE_OPERATIONS_EVACUATION_POSTS_CAPTION:0 "战地休整"
 PWC_STATE_OPERATIONS_EVACUATION_POSTS_COST:0 "15 指挥点"
 PWC_STATE_OPERATIONS_EVACUATION_POSTS_TOOLTIP:0 "§H战地休整§!\n安排后送与轮换，提高部队在此地块的组织恢复速度。不立即补满组织，不增加组织上限或人力。\n\n§H地块加成§!\n陆军组织恢复：§G+10%§!\n目标：己方控制或敌对地块。\n仅影响发起势力在此地块的陆军。\n组织恢复按部队所在地块结算。\n\n消耗：§Y15 指挥点§!\n持续：§Y10 天§! · 立即生效\n同类再次下达：§Y30 天后§!\n所需焦点：§Y战地后送体系 或 战役预备队§!\n\n§H行动规则§!\n战术、保障各限一项。\n同类冷却全图共享。\n旧行动与联合战役冷却可能阻止下达。\n海空决议仍在决议页。\n占领后保留剩余时间。\n停战、势力退出时结束。\n转交非敌对势力时结束。\n提前结束不退费，冷却继续。"
 PWC_STATE_OPERATIONS_FIRE_COORDINATION_CAPTION:0 "集中火力"
 PWC_STATE_OPERATIONS_FIRE_COORDINATION_COST:0 "20 指挥点"
 PWC_STATE_OPERATIONS_FIRE_COORDINATION_TOOLTIP:0 "§H集中火力§!\n集中观察与火力支援，提高目标地块的陆军攻击。适合需要增加伤害的正面交战，不增加突破或速度。\n\n§H地块加成§!\n陆军攻击：§G+10%§!\n目标：敌对地块。\n仅影响发起势力在此地块的陆军。\n战斗加成也适用于进攻此地块。\n\n消耗：§Y20 指挥点§!\n持续：§Y7 天§! · 立即生效\n同类再次下达：§Y21 天后§!\n所需焦点：§Y战役情报处 或 侦察校射网§!\n\n§H行动规则§!\n战术、保障各限一项。\n同类冷却全图共享。\n旧行动与联合战役冷却可能阻止下达。\n海空决议仍在决议页。\n占领后保留剩余时间。\n停战、势力退出时结束。\n转交非敌对势力时结束。\n提前结束不退费，冷却继续。"

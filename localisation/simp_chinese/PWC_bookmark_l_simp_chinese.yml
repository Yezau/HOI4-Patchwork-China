 PWC_NEVER_SELECTED: "(未使用)"
 PWC_OCCUPATION_LAW_MILITARY_ADMIN: "城市军事管制"
 PWC_OCCUPATION_LAW_MILITARY_ADMIN_DESC: "军事接管后的城市需要恢复街区秩序、居民登记与基本行政。军管机构承担这一过渡阶段的公共事务，逐步把临时控制转化为可持续的治理。"
 PWC_REGION_CENTRAL_CHINA: "华中组"
 PWC_REGION_EAST_CHINA: "华东组"
 PWC_REGION_MUNICIPALITIES: "直辖市组"
 PWC_REGION_NORTHEAST: "东北组"
 PWC_REGION_NORTHWEST: "西北组"
 PWC_REGION_NORTH_CHINA: "华北组"
 PWC_REGION_SOUTHWEST: "西南组"
 PWC_REGION_SOUTH_CHINA: "华南组"
 PWC_RULE_ADMINISTRATIVE_PRESSURE: "行政压力"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_DESC: "每个额外未整合城市增加 0.5% 消费品，已成为核心的城市增加 0.2%；总上限 10%，首都免计。"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_KEEP: "保留"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_KEEP_DESC: "首都之外，每个自有非核心州增加 0.5% 消费品系数，核心州增加 0.2%；总上限为 10%。领土变化或核心整合后重新计算。"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_REMOVE: "移除"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_REMOVE_DESC: "不再因拥有额外城市州施加行政压力消费品修正。扩张与核心整合仍正常进行，其他来源的消费品需求不受影响。"
 PWC_RULE_AI_DIFFICULTY: "AI 难度"
 PWC_RULE_AI_DIFFICULTY_DESC: "仅 AI 城市获得对应比例的科研、建造、生产与补给加成。玩家接管后移除。"
 PWC_RULE_AI_DIFFICULTY_T0: "0%"
 PWC_RULE_AI_DIFFICULTY_T0_DESC: "AI 不获得额外难度加成，与玩家使用相同的城市基础规则。"
 PWC_RULE_AI_DIFFICULTY_T0_EFFECTS: "AI 城市不获得任何加成。"
 PWC_RULE_AI_DIFFICULTY_T10: "10%"
 PWC_RULE_AI_DIFFICULTY_T10_DESC: "仅 AI 城市的科研、建造、工厂产出和补给获得 10% 加成；玩家城市不受益，玩家接管城市后也不保留该加成。"
 PWC_RULE_AI_DIFFICULTY_T10_EFFECTS: "每个 AI 城市获得 +10% 的科研速度、建设速度、工厂产出、补给效率。"
 PWC_RULE_AI_DIFFICULTY_T20: "20%"
 PWC_RULE_AI_DIFFICULTY_T20_DESC: "仅 AI 城市的科研、建造、工厂产出和补给获得 20% 加成；玩家城市不受益，玩家接管城市后也不保留该加成。"
 PWC_RULE_AI_DIFFICULTY_T20_EFFECTS: "每个 AI 城市获得 +20% 的科研速度、建设速度、工厂产出、补给效率。"
 PWC_RULE_AI_DIFFICULTY_T30: "30%"
 PWC_RULE_AI_DIFFICULTY_T30_DESC: "仅 AI 城市的科研、建造、工厂产出和补给获得 30% 加成；玩家城市不受益，玩家接管城市后也不保留该加成。"
 PWC_RULE_AI_DIFFICULTY_T30_EFFECTS: "每个 AI 城市获得 +30% 的科研速度、建设速度、工厂产出、补给效率。"
 PWC_RULE_AI_WAR_PACING: "AI 宣战节奏"
 PWC_RULE_AI_WAR_PACING_DESC: "调整 AI 城市宣战的时间分布，避免保护期一结束全体同时开战。分波解锁与战后冷却都只作用于 AI，玩家始终可以自由宣战。"
 PWC_RULE_AI_WAR_PACING_OFF: "关闭"
 PWC_RULE_AI_WAR_PACING_OFF_DESC: "不做任何错峰：保护期结束后全体 AI 城市同日解锁宣战，战争结束后也没有冷却。只建议用于对照测试。"
 PWC_RULE_AI_WAR_PACING_SLOW: "慢速"
 PWC_RULE_AI_WAR_PACING_SLOW_DESC: "更平缓的错峰：AI 解锁窗口拉长到约 300 天，战争结束后冷却 150 天。适合希望前期更安静的玩家。只作用于 AI。"
 PWC_RULE_AI_WAR_PACING_STAGGERED: "错峰"
 PWC_RULE_AI_WAR_PACING_STAGGERED_DESC: "保护期结束后，AI 城市按固定分型散列分成若干波次，在约 180 天内陆续解锁宣战；每场战争结束后 AI 胜者冷却 30 天再考虑下一场。只作用于 AI，玩家始终不受限制。"
 PWC_RULE_AI_WAR_TENDENCY: "AI 战争倾向"
 PWC_RULE_AI_WAR_TENDENCY_AGGRESSIVE: "激进"
 PWC_RULE_AI_WAR_TENDENCY_AGGRESSIVE_DESC: "AI 更积极：提高发起宣战的倾向，并降低所需兵力优势。战争通常更频繁；保护期、合法目标与跨海战备条件仍然生效。"
 PWC_RULE_AI_WAR_TENDENCY_DESC: "调整 AI 的宣战评分与所需兵力优势。陆地目标须与当前领土接壤；两岸跨海另需港口和 AI 战备条件。保护期与城市存续检查仍然生效。"
 PWC_RULE_AI_WAR_TENDENCY_STANDARD: "标准"
 PWC_RULE_AI_WAR_TENDENCY_STANDARD_DESC: "AI 使用标准宣战倾向与兵力优势门槛，结合各城分型评估目标。不会绕过保护期、接壤条件或跨海战备检查。"
 PWC_RULE_AI_WAR_TENDENCY_STEADY: "稳健"
 PWC_RULE_AI_WAR_TENDENCY_STEADY_DESC: "AI 更谨慎：降低发起宣战的倾向，并要求更大的兵力优势。适合较长的发展期；保护期、合法目标和跨海战备条件仍然生效。"
 PWC_RULE_ALLOW_GUARANTEES: "保证独立：封锁"
 PWC_RULE_ALLOW_GUARANTEES_DESC: "势力不能保证其他势力独立，战争资格由城市战争规则决定。"
 PWC_RULE_ALLOW_RELEASE_NATIONS: "释放势力：封锁"
 PWC_RULE_ALLOW_RELEASE_NATIONS_DESC: "已淘汰的势力不能通过释放势力重新进入本局。"
 PWC_RULE_ALLOW_REVOKE_GUARANTEES: "撤销保证：封锁"
 PWC_RULE_ALLOW_REVOKE_GUARANTEES_DESC: "本局禁止建立或撤销保证，所有城市共用固定的外交约束。"
 PWC_RULE_ALLOW_WARGOALS: "宣战入口：城市战争规则"
 PWC_RULE_ALLOW_WARGOALS_DESC: "通过城市宣战决议发起战争，并遵守本局保护期和合法目标限制。"
 PWC_RULE_ARCHETYPE_SEED: "城市 AI 分型"
 PWC_RULE_ARCHETYPE_SEED_DESC: "随机模式在各城合法分型池中开局抽取一次，存档保留结果；不改变真实地理、初始部队与资源。"
 PWC_RULE_ARCHETYPE_SEED_FIXED: "固定分型"
 PWC_RULE_ARCHETYPE_SEED_FIXED_DESC: "各城市沿用名册预设的 AI 分型，开局战略偏好固定，便于比较不同对局。"
 PWC_RULE_ARCHETYPE_SEED_RANDOM: "每局随机"
 PWC_RULE_ARCHETYPE_SEED_RANDOM_DESC: "新局为每座城市从其合法分型池随机选择一次，并将结果保存在存档中。读档不会重抽，也不改变真实地理、初始部队或资源。"
 PWC_RULE_DEMOBILIZATION: "动员与复员"
 PWC_RULE_DEMOBILIZATION_AI_ONLY: "仅 AI"
 PWC_RULE_DEMOBILIZATION_AI_ONLY_DESC: "只有 AI 受和平动员上限和停战后 90 天复员规则约束；玩家不强制复员。AI 的和平征兵法与经济动员法上限为 3 级。"
 PWC_RULE_DEMOBILIZATION_DESC: "和平时期征兵法与经济动员法最高为 3 级；停战后给予 90 天复员期，期满回落至 3 级。"
 PWC_RULE_DEMOBILIZATION_OFF: "关闭"
 PWC_RULE_DEMOBILIZATION_OFF_DESC: "关闭玩家与 AI 的和平动员上限及自动复员。停战不会因为本规则自动降低征兵法或经济动员法。"
 PWC_RULE_DEMOBILIZATION_STANDARD: "标准"
 PWC_RULE_DEMOBILIZATION_STANDARD_DESC: "玩家与 AI 的和平征兵法、经济动员法最高为 3 级；停战后给予 90 天复员宽限，期满仍处于和平时，超出部分降回 3 级。"
 PWC_RULE_FIXED: "固定"
 PWC_RULE_GEOGRAPHIC_SUPPLY: "地域补给"
 PWC_RULE_GEOGRAPHIC_SUPPLY_DESC: "为新疆、青海、甘肃、宁夏与内蒙古的城市州提供 1 点当地补给；不包括 NTR，不随国策地理模式变化。"
 PWC_RULE_GEOGRAPHIC_SUPPLY_KEEP: "保留"
 PWC_RULE_GEOGRAPHIC_SUPPLY_KEEP_DESC: "为新疆、青海、甘肃、宁夏和内蒙古的城市州保留 1 点额外当地补给。不包括 NTR，与是否选择通用地理国策无关。"
 PWC_RULE_GEOGRAPHIC_SUPPLY_REMOVE: "移除"
 PWC_RULE_GEOGRAPHIC_SUPPLY_REMOVE_DESC: "取消指定西北与内蒙古城市州的额外当地补给。普通补给机制、基础设施和真实地理保持原样。"
 PWC_RULE_GEOGRAPHY_MODE: "城市地理国策"
 PWC_RULE_GEOGRAPHY_MODE_CURRENT: "当前"
 PWC_RULE_GEOGRAPHY_MODE_CURRENT_DESC: "保留本城所属地理类型的 8 个专属国策，延续当地的发展特色。真实地理和其他开局规则独立保留。"
 PWC_RULE_GEOGRAPHY_MODE_DESC: "当前保留本城专属的 8 个地理国策；通用改用 8 个城市协作国策。两档均保留真实地理与公共规则选择。"
 PWC_RULE_GEOGRAPHY_MODE_GENERIC: "通用"
 PWC_RULE_GEOGRAPHY_MODE_GENERIC_DESC: "将本城的 8 个专属地理国策替换为 8 个通用城市协作国策。只改变国策内容，不把港口、边境或岛屿等真实地理改成通用类型。"
 PWC_RULE_GROUP_COMMON: "通用化规则"
 PWC_RULE_GROUP_FIXED: "固定世界规则"
 PWC_RULE_GROUP_GEOGRAPHY: "城市独特地理"
 PWC_RULE_INDUSTRY_CALIBRATION: "工业校准"
 PWC_RULE_INDUSTRY_CALIBRATION_BALANCE: "平衡"
 PWC_RULE_INDUSTRY_CALIBRATION_BALANCE_DESC: "新局移除城市的地图外民用、军用工厂，并将每座城市州的地图工厂统一为 2 座民工、1 座军工，保留船坞。只在开局执行一次。"
 PWC_RULE_INDUSTRY_CALIBRATION_DESC: "保持沿用地图；正常化移除城市地图外民军工厂；平衡另将每城地图工厂设为 2 民工、1 军工，保留船坞。"
 PWC_RULE_INDUSTRY_CALIBRATION_KEEP: "保持"
 PWC_RULE_INDUSTRY_CALIBRATION_KEEP_DESC: "沿用各城现有的地图工厂与地图外民用、军用工厂。保留开局工业差异，不进行工业校准。"
 PWC_RULE_INDUSTRY_CALIBRATION_NORMALIZE: "正常化"
 PWC_RULE_INDUSTRY_CALIBRATION_NORMALIZE_DESC: "新局移除城市的地图外民用、军用工厂；地图内工厂及船坞保持原样。只在开局执行一次，读档不会重复清除后来获得的工厂。"
 PWC_RULE_INTEGRATION_SPEED: "战后整合速度"
 PWC_RULE_INTEGRATION_SPEED_DESC: "调整城市军事管理的顺从度增长。自有且完整控制的非核心州，顺从度达到 80% 时若有军工厂则移除一级；达到 90% 时自动成为核心。"
 PWC_RULE_INTEGRATION_SPEED_FAST: "快速"
 PWC_RULE_INTEGRATION_SPEED_FAST_DESC: "采用快速城市军事管理，顺从度基础增长为 0.6，更快完成战后整合。80% 时的军工整编与 90% 时的自动核心整合条件不变；不会立即获得核心。"
 PWC_RULE_INTEGRATION_SPEED_STANDARD: "标准"
 PWC_RULE_INTEGRATION_SPEED_STANDARD_DESC: "采用标准城市军事管理，顺从度基础增长为 0.3。自有且完全控制的非核心州，80% 顺从度时若有军工厂则移除一级，90% 时自动成为核心。实际速度仍受其他修正影响。"
 PWC_RULE_INTEGRATION_SPEED_STRICT: "严格"
 PWC_RULE_INTEGRATION_SPEED_STRICT_DESC: "采用严格城市军事管理，顺从度基础增长为 0.15，战后整合耗时更长。仍须自有且完全控制该州；80% 军工整编与 90% 自动核心整合的阈值不变。"
 PWC_RULE_OPTION_BLOCKED: "已封锁"
 PWC_RULE_PEACE_CONFERENCE: "和平会议"
 PWC_RULE_PEACE_CONFERENCE_DESC: "开启时由和平会议决定领土与独立存续；最终被吞并的城市才永久淘汰。关闭时沿用自动分配。"
 PWC_RULE_PEACE_CONFERENCE_OFF: "关闭（自动结算）"
 PWC_RULE_PEACE_CONFERENCE_OFF_DESC: "投降后使用模组的自动领土结算，不进入和平会议；按现有规则分配败方领土并处理城市淘汰。"
 PWC_RULE_PEACE_CONFERENCE_ON: "开启"
 PWC_RULE_PEACE_CONFERENCE_ON_DESC: "投降后交给原生和平会议决定领土与势力存续，允许会议保留败方独立。只有最终被吞并、已经消失的势力才永久淘汰。"
 PWC_RULE_PROTECTION_PERIOD: "开局战争节奏"
 PWC_RULE_PROTECTION_PERIOD_DAYS_180: "标准（180 天）"
 PWC_RULE_PROTECTION_PERIOD_DAYS_180_DESC: "从 2026 年 1 月 1 日起，全体城市享有 180 天战争保护。期间不能发起城市战争，保护结束后按本局宣战告警选项处理。"
 PWC_RULE_PROTECTION_PERIOD_DAYS_90: "快速（90 天）"
 PWC_RULE_PROTECTION_PERIOD_DAYS_90_DESC: "从 2026 年 1 月 1 日起，全体城市享有 90 天战争保护。期间不能发起城市战争，保护结束后按本局宣战告警选项处理。"
 PWC_RULE_PROTECTION_PERIOD_DESC: "从 2026 年 1 月 1 日起统一计时；保护期内所有城市均不能发起战争。"
 PWC_RULE_PROTECTION_PERIOD_NONE: "无保护期"
 PWC_RULE_PROTECTION_PERIOD_NONE_DESC: "开局即允许符合条件的城市发起战争，不等待统一保护期。已选择的宣战告警和合法目标限制仍然生效。"
 PWC_RULE_STATE_TRANSFER: "州转移工具"
 PWC_RULE_STATE_TRANSFER_DESC: "玩家可选择和平州与存续城市，预览后确认转移。禁止首都、最后一州、NTR 和会议中的领土。"
 PWC_RULE_STATE_TRANSFER_OFF: "关闭"
 PWC_RULE_STATE_TRANSFER_OFF_DESC: "关闭玩家的州转移工具。领土仍可通过战争结算和本局其他正常机制发生变化。"
 PWC_RULE_STATE_TRANSFER_ON: "开启（玩家可用）"
 PWC_RULE_STATE_TRANSFER_ON_DESC: "向所有人类城市玩家开放州转移：选择来源州与接收城市，预览后确认。只能转移和平中完全控制的自有州；首都、最后一州、NTR 与会议中的领土除外。"
 PWC_RULE_UNIT_LIMIT: "部队规模限制"
 PWC_RULE_UNIT_LIMIT_AI_ONLY: "仅 AI"
 PWC_RULE_UNIT_LIMIT_AI_ONLY_DESC: "只有 AI 受部队容量及超额惩罚约束；玩家不受该惩罚。AI 容量为基础 8 师，每个拥有且完全控制的州增加 4 师，最高 500 师。"
 PWC_RULE_UNIT_LIMIT_DESC: "基础容量 8 师，每个拥有且控制的城市再增加 4 师。超额部队降低组织恢复并增加补给消耗。"
 PWC_RULE_UNIT_LIMIT_OFF: "关闭"
 PWC_RULE_UNIT_LIMIT_OFF_DESC: "玩家与 AI 均不受本模组的部队容量及超额惩罚约束。部队仍需要正常的人力、装备和补给。"
 PWC_RULE_UNIT_LIMIT_STANDARD: "标准"
 PWC_RULE_UNIT_LIMIT_STANDARD_DESC: "玩家与 AI 均实行部队容量：基础 8 师，每个拥有且完全控制的州增加 4 师，最高 500 师。超额降低组织恢复并增加补给消耗，惩罚最高 25%。"
 PWC_RULE_WAR_WARNING: "宣战告警"
 PWC_RULE_WAR_WARNING_DESC: "目标须与当前领土接壤，或满足两岸港口跨海条件。关闭告警后立即宣战；保护期、撕毁互不侵犯条约和取消军通仍然生效。"
 PWC_RULE_WAR_WARNING_OFF: "关闭（立即宣战）"
 PWC_RULE_WAR_WARNING_OFF_DESC: "合法宣战请求立即开战，不产生告警等待期。仍须通过保护期、合法目标检查，并照常处理互不侵犯条约和军事通行权。"
 PWC_RULE_WAR_WARNING_ON: "开启（30 天）"
 PWC_RULE_WAR_WARNING_ON_DESC: "合法请求发出§Y30 天§!告警，结束后自动宣战，§R不可手动取消§!。保护期、合法目标与外交关系清理仍然检查。"
 PWC_SETUP_APPLY: "应用"
 PWC_SETUP_APPLY_TT: "应用当前规则并返回选城界面；开始游戏后，本局规则锁定。"
 PWC_SETUP_ENTRY: "开局规则"
 PWC_SETUP_ENTRY_TT: "设置本局的 AI、战争节奏、动员、整合与城市规则。悬停选项可查看具体影响。"
 PWC_SETUP_LOAD: "加载方案"
 PWC_SETUP_LOAD_TT: "打开已保存的规则方案列表。加载后可以继续调整，再应用到本局。"
 PWC_SETUP_RESET: "恢复默认"
 PWC_SETUP_RESET_TT: "将全部开局规则恢复为默认选项。"
 PWC_SETUP_SAVE: "保存方案"
 PWC_SETUP_SAVE_TT: "为当前规则组合命名并保存，便于以后新局再次使用。"
 PWC_SETUP_TITLE: "开局规则"
 PWC_TRANSFER_ALL: "全选"
 PWC_TRANSFER_ALL_TT: "§H同国全选§!  §YCtrl+A§!\n加入当前地区拥有者完全控制的全部合法地区，包含首都。\n已有清单时仅可添加同一来源势力；重复点击不会重复添加。"
 PWC_TRANSFER_BACK: "返回"
 PWC_TRANSFER_BACK_TT: "返回修改清单，保留所选地区与接收方，取消当前预览。"
 PWC_TRANSFER_CLEAR: "清空"
 PWC_TRANSFER_CLEAR_TT: "§H清空选择§!  §YCtrl+X§!\n清空清单和接收方，取消当前预览。"
 PWC_TRANSFER_CONFIRM: "确认转交"
 PWC_TRANSFER_CONFIRM_TT: "转交清单中的所有地块，核心归属不变。执行前会再次检查拥有者与控制权。\n来源方交出最后一块领土时将被淘汰。修改清单或接收方后须重新预览。"
 PWC_TRANSFER_CURRENT_STATE: "[This.GetName]"

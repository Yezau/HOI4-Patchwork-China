 PWC_UI_SCENARIO_OVERVIEW: "从一块地开始"
 PWC_UI_UNIT_CAPACITY_BREAKDOWN: "§H部队规模§!\n容量 [?pwc_unit_capacity|Y0] 师 = 基础 8 师 + 完全控制州 [?pwc_setup_controlled_states|Y0] × 4，上限 500 师\n现有 [?num_divisions|Y0] 师\n超额惩罚：组织恢复 -[?pwc_unit_penalty_percent|R0]%，补给消耗 +[?pwc_unit_penalty_percent|R0]%"
 PWC_UI_UNIT_CAPACITY_BREAKDOWN_DESC: "§H部队规模§!\n这一行是本势力能维持的师数：容量等于基础 8 师，加上每座完全控制的州 4 师，最多 500 师；右侧进度条＝现有师数 / 容量。\n超出容量会拖慢组织恢复并抬高补给消耗；无论是否超额，部队都仍然需要正常的人力、装备与补给。"

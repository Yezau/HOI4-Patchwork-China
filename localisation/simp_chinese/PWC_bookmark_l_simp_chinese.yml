 PWC_RULE_ADMINISTRATIVE_PRESSURE: "扩张带来的消费品负担"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_DESC: "决定玩家与 AI 拥有额外城市时是否承担消费品工厂系数修正。首都免计，核心城市的负担低于非核心城市。"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_KEEP: "扩张增加消费品"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_KEEP_DESC: "§Y适用范围§!\n - 玩家与 AI；§Y首都免计§!。\n\n§Y消费品负担§!\n - 每个自有非核心州：§R+0.5%§! 消费品工厂系数。\n - 每个自有核心州：§R+0.2%§! 消费品工厂系数。\n - 合计上限：§Y10%§!。\n\n§Y注意§!\n - 修正消费品系数，不是扣除固定数量的工厂。\n - 丢失控制权§R不免除§!自有州负担。\n - 核心化会§G降低该州负担§!。"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_REMOVE: "扩张不增加消费品"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_REMOVE_DESC: "§Y效果§!\n - 玩家与 AI §G不再承担§!额外城市的行政消费品负担。\n\n§Y仍然生效§!\n - 扩张与核心整合正常进行。\n - 其他来源的消费品需求照常计算。"
 PWC_RULE_AI_ADJACENT_PLAYER_WAR: "AI 对玩家相邻即宣"
 PWC_RULE_AI_ADJACENT_PLAYER_WAR_DESC: "AI 与玩家接壤时自动立即宣战，开局保护期沿用对应设置；默认关闭。"
 PWC_RULE_AI_ADJACENT_PLAYER_WAR_OFF: "关闭（默认）"
 PWC_RULE_AI_ADJACENT_PLAYER_WAR_OFF_DESC: "§Y正常宣战§!\n - AI 按好战程度、战备与开战节奏选择目标。\n - 与玩家接壤不会自动触发宣战。\n\n§Y仍然生效§!\n - 宣战等待时间、开局保护期与省内优先设置。"
 PWC_RULE_AI_ADJACENT_PLAYER_WAR_ON: "开启"
 PWC_RULE_AI_ADJACENT_PLAYER_WAR_ON_DESC: "§Y相邻即宣§!\n - AI 与玩家当前领土接壤时，§R立即向玩家宣战§!。\n - 后续扩张形成的新接壤同样生效。\n\n§Y优先规则§!\n - 开局保护期按对应设置执行；选择无保护期时，开局即可触发。\n - 跳过宣战等待、AI 战备、开战节奏与省内优先。\n - 解除双方互不侵犯与军事通行。\n\n§Y适用范围§!\n - 仅 AI 对玩家生效，不包含跨海目标。\n - 休战、同阵营、属国、投降与和会限制仍然生效。"
 PWC_RULE_AI_DIFFICULTY: "AI 难度"
 PWC_RULE_AI_DIFFICULTY_DESC: "简单优先补足基础装备；标准及以上加强主战坦克生产与换装。挑战起增加数值加成，困难与极限还提供额外装备和军工组织扶持；极限会随剩余势力减少进一步增强 AI。"
 PWC_RULE_AI_DIFFICULTY_T0: "简单"
 PWC_RULE_AI_DIFFICULTY_T0_DESC: "§YAI 行为§!\n - 优先补足基础装备。\n - 不额外优先发展主战坦克。\n\n§Y难度加成§!\n - 科研、建造、工厂产出、补给：§Y无额外加成§!。"
 PWC_RULE_AI_DIFFICULTY_T0_EFFECTS: "§YAI 行为§!\n - 优先补足基础装备。\n - 不额外优先发展主战坦克。\n\n§Y难度加成§!\n - 科研、建造、工厂产出、补给：§Y无额外加成§!。"
 PWC_RULE_AI_DIFFICULTY_T10: "挑战"
 PWC_RULE_AI_DIFFICULTY_T10_DESC: "§YAI 行为§!\n - 沿用标准档的生产与部队换装策略。\n\n§YAI 加成§!\n - 科研、建造、工厂产出与补给：§G适度增强§!。\n\n§Y玩家接管§!\n - 基础加成在§Y下次月度检查§!时移除。"
 PWC_RULE_AI_DIFFICULTY_T10_EFFECTS: "§YAI 行为§!\n - 沿用标准档的生产与部队换装策略。\n\n§YAI 加成§!\n - 科研、建造、工厂产出与补给：§G适度增强§!。\n\n§Y玩家接管§!\n - 基础加成在§Y下次月度检查§!时移除。"
 PWC_RULE_AI_DIFFICULTY_T20: "困难"
 PWC_RULE_AI_DIFFICULTY_T20_DESC: "§YAI 加成§!\n - 沿用标准档的生产与部队换装策略。\n - 科研、建造、工厂产出与补给：§G较强增强§!。\n\n§Y国策装备援助§!\n - 完成国策时可能§G获得额外装备§!。\n - 受库存需求、援助额度与间隔限制。\n\n§Y军工组织扶持§!\n - 需要 §YArms Against Tyranny DLC§!。\n - AI 军工组织§G成长加快§!，可用强化专属组织。\n - 玩家§R不可选择§! AI 专属组织。\n\n§Y玩家接管§!\n - 基础难度加成在§Y下次月度检查§!时移除。"
 PWC_RULE_AI_DIFFICULTY_T20_EFFECTS: "§YAI 加成§!\n - 沿用标准档的生产与部队换装策略。\n - 科研、建造、工厂产出与补给：§G较强增强§!。\n\n§Y国策装备援助§!\n - 完成国策时可能§G获得额外装备§!。\n - 受库存需求、援助额度与间隔限制。\n\n§Y军工组织扶持§!\n - 需要 §YArms Against Tyranny DLC§!。\n - AI 军工组织§G成长加快§!，可用强化专属组织。\n - 玩家§R不可选择§! AI 专属组织。\n\n§Y玩家接管§!\n - 基础难度加成在§Y下次月度检查§!时移除。"
 PWC_RULE_AI_DIFFICULTY_T30: "极限"
 PWC_RULE_AI_DIFFICULTY_T30_DESC: "§YAI 加成§!\n - 沿用标准档的生产与部队换装策略。\n - 科研、建造、工厂产出与补给：§G最高档增强§!。\n\n§Y国策装备援助§!\n - 完成国策时可能§G获得额外装备§!，数量可高于困难档。\n - 受库存需求、援助额度与间隔限制。\n\n§Y军工组织扶持§!\n - 需要 §YArms Against Tyranny DLC§!。\n - AI 军工组织§G成长更快§!，专属组织更强。\n - 玩家§R不可选择§! AI 专属组织。\n\n§Y玩家接管§!\n - 基础难度加成在§Y下次月度检查§!时移除。\n\n§Y极限难度：争霸追加加成§!\n剩余势力降至 §Y100/50/20/10/5§! 个时，AI 按对应档位额外获得：\n（势力数量包含玩家，不含中立区）\n  - 陆军攻击：§G+5%/+10%/+15%/+20%/+25%§!\n  - 陆军防御：§G+5%/+10%/+15%/+20%/+25%§!\n  - 陆军组织度：§G+5%/+10%/+15%/+20%/+25%§!\n  - 工厂产出：§G+10%/+20%/+30%/+40%/+50%§!\n  - 建造速度：§G+10%/+20%/+30%/+40%/+50%§!\n§Y每周刷新§!，仅取当前最高一档。\n§R失效条件§!：玩家接管、势力淘汰或只剩一个势力。"
 PWC_RULE_AI_DIFFICULTY_T30_EFFECTS: "§YAI 加成§!\n - 沿用标准档的生产与部队换装策略。\n - 科研、建造、工厂产出与补给：§G最高档增强§!。\n\n§Y国策装备援助§!\n - 完成国策时可能§G获得额外装备§!，数量可高于困难档。\n - 受库存需求、援助额度与间隔限制。\n\n§Y军工组织扶持§!\n - 需要 §YArms Against Tyranny DLC§!。\n - AI 军工组织§G成长更快§!，专属组织更强。\n - 玩家§R不可选择§! AI 专属组织。\n\n§Y玩家接管§!\n - 基础难度加成在§Y下次月度检查§!时移除。\n\n§Y极限难度：争霸追加加成§!\n剩余势力降至 §Y100/50/20/10/5§! 个时，AI 按对应档位额外获得：\n（势力数量包含玩家，不含中立区）\n  - 陆军攻击：§G+5%/+10%/+15%/+20%/+25%§!\n  - 陆军防御：§G+5%/+10%/+15%/+20%/+25%§!\n  - 陆军组织度：§G+5%/+10%/+15%/+20%/+25%§!\n  - 工厂产出：§G+10%/+20%/+30%/+40%/+50%§!\n  - 建造速度：§G+10%/+20%/+30%/+40%/+50%§!\n§Y每周刷新§!，仅取当前最高一档。\n§R失效条件§!：玩家接管、势力淘汰或只剩一个势力。"
 PWC_RULE_AI_DIFFICULTY_TSTANDARD: "标准"
 PWC_RULE_AI_DIFFICULTY_TSTANDARD_DESC: "§YAI 行为§!\n - §Y推荐默认档§!。\n - 衔接主战坦克科研、生产与部队换装。\n - 基础装备充足后，优先用剩余产能发展主战坦克。\n\n§Y难度加成§!\n - 科研、建造、工厂产出、补给：§Y无额外加成§!。"
 PWC_RULE_AI_DIFFICULTY_TSTANDARD_EFFECTS: "§YAI 行为§!\n - §Y推荐默认档§!。\n - 衔接主战坦克科研、生产与部队换装。\n - 基础装备充足后，优先用剩余产能发展主战坦克。\n\n§Y难度加成§!\n - 科研、建造、工厂产出、补给：§Y无额外加成§!。"
 PWC_RULE_AI_WAR_PACING: "AI 开战与战后等待"
 PWC_RULE_AI_WAR_PACING_DESC: "调整 AI 首次获得宣战资格的时间，以及敌对城市投降后发起新宣战请求的等待时间。本项不限制玩家，也不停止现有战争；其他开战条件仍生效。"
 PWC_RULE_AI_WAR_PACING_OFF: "同时解锁、无战后等待"
 PWC_RULE_AI_WAR_PACING_OFF_DESC: "§YAI 宣战资格§!\n - 保护期结束后，AI §Y同时获得宣战资格§!。\n - 不再分批解锁；敌对城市投降后也无需额外等待。\n\n§Y仍然生效§!\n - 仅影响 AI，§Y不保证同时开战§!。\n - 兵力、战备、目标条件与宣战等待时间仍生效。"
 PWC_RULE_AI_WAR_PACING_SLOW: "分批更慢、战后等待更久"
 PWC_RULE_AI_WAR_PACING_SLOW_DESC: "§YAI 分批开战§!\n - 保护期结束后，AI 在约 §Y300 天§!内分批获得宣战资格。\n\n§Y投降后的等待§!\n - 敌对城市投降后，参与对其作战的 AI 等待 §Y150 天§!。\n - 等待期间§R不能发起新的宣战请求§!。\n - 现有战争继续。\n - 已发出的告警，仍按到期时的条件决定是否开战。\n\n§Y适用范围§!\n - 本项仅影响 AI；玩家仍须遵守保护期和目标限制。"
 PWC_RULE_AI_WAR_PACING_STAGGERED: "分批开战（默认）"
 PWC_RULE_AI_WAR_PACING_STAGGERED_DESC: "§YAI 分批开战§!\n - 保护期结束后，AI 在约 §Y180 天§!内分批获得宣战资格。\n\n§Y投降后的等待§!\n - 敌对城市投降后，参与对其作战的 AI 等待 §Y30 天§!。\n - 等待期间§R不能发起新的宣战请求§!。\n - 现有战争继续。\n - 已发出的告警，仍按到期时的条件决定是否开战。\n\n§Y适用范围§!\n - 本项仅影响 AI；玩家仍须遵守保护期和目标限制。"
 PWC_RULE_AI_WAR_TENDENCY: "AI 好战程度"
 PWC_RULE_AI_WAR_TENDENCY_AGGRESSIVE: "激进"
 PWC_RULE_AI_WAR_TENDENCY_AGGRESSIVE_DESC: "§YAI 好战程度§!\n - 发起宣战的倾向：§Y更高§!。\n - 要求的兵力优势：§Y更低§!。\n - 战争通常更频繁。\n\n§Y仍然生效§!\n - 保护期、合法目标、接壤条件与跨海战备检查。"
 PWC_RULE_AI_WAR_TENDENCY_DESC: "调整 AI 的宣战评分与所需兵力优势。陆地目标须与当前领土接壤；两岸跨海另需港口和 AI 战备条件。保护期与城市存续检查仍然生效。"
 PWC_RULE_AI_WAR_TENDENCY_STANDARD: "标准"
 PWC_RULE_AI_WAR_TENDENCY_STANDARD_DESC: "§YAI 好战程度§!\n - 宣战倾向与兵力优势门槛：§Y标准§!。\n - 结合各城发展风格评估目标。\n\n§Y仍然生效§!\n - 保护期、合法目标、接壤条件与跨海战备检查。"
 PWC_RULE_AI_WAR_TENDENCY_STEADY: "谨慎"
 PWC_RULE_AI_WAR_TENDENCY_STEADY_DESC: "§YAI 好战程度§!\n - 发起宣战的倾向：§Y更低§!。\n - 要求的兵力优势：§Y更大§!。\n - 适合较长的发展期。\n\n§Y仍然生效§!\n - 保护期、合法目标、接壤条件与跨海战备检查。"
 PWC_RULE_ALLOW_GUARANTEES: "保证独立：封锁"
 PWC_RULE_ALLOW_GUARANTEES_DESC: "§Y保证独立§!\n  - §R不能保证其他势力独立§!。\n  - 战争资格由城市战争规则决定。"
 PWC_RULE_ALLOW_RELEASE_NATIONS: "释放势力：封锁"
 PWC_RULE_ALLOW_RELEASE_NATIONS_DESC: "§Y释放势力§!\n  - 已淘汰势力§R不能通过释放重新进入本局§!。"
 PWC_RULE_ALLOW_REVOKE_GUARANTEES: "撤销保证：封锁"
 PWC_RULE_ALLOW_REVOKE_GUARANTEES_DESC: "§Y固定外交约束§!\n  - §R禁止建立或撤销保证§!。\n  - 所有城市共用本项限制。"
 PWC_RULE_ALLOW_WARGOALS: "宣战入口：城市战争规则"
 PWC_RULE_ALLOW_WARGOALS_DESC: "§Y宣战方式§!\n  - 使用§Y城市宣战决议§!发起战争。\n  - 仍须遵守保护期和合法目标限制。"
 PWC_RULE_ARCHETYPE_SEED: "AI 城市发展风格"
 PWC_RULE_ARCHETYPE_SEED_DESC: "随机模式在开局为各城选择一次 AI 发展风格，存档保留结果；不改变真实地理、初始部队与资源。"
 PWC_RULE_ARCHETYPE_SEED_FIXED: "固定风格"
 PWC_RULE_ARCHETYPE_SEED_FIXED_DESC: "§Y发展风格§!\n - 各城市沿用预设的 AI 发展风格。\n - 开局战略偏好固定，便于比较不同对局。"
 PWC_RULE_ARCHETYPE_SEED_RANDOM: "每局随机"
 PWC_RULE_ARCHETYPE_SEED_RANDOM_DESC: "§Y随机风格§!\n - 新局为每座城市随机选择一种适合它的 AI 发展风格。\n - 结果保存在存档中，读档§Y不会重抽§!。\n\n§Y影响范围§!\n - 真实地理、初始部队和资源保持原样。"
 PWC_RULE_DEMOBILIZATION: "和平动员上限与复员"
 PWC_RULE_DEMOBILIZATION_AI_ONLY: "仅限制 AI"
 PWC_RULE_DEMOBILIZATION_AI_ONLY_DESC: "§Y和平动员上限§!\n - 适用：§Y只有 AI§!；玩家不受本项限制。\n - 和平且不在复员宽限期时：\n - 征兵法最高：§Y$PWC_LAW_CONSCRIPTION_L3$§!。\n - 经济动员法最高：§Y$PWC_LAW_ECONOMY_MOBILIZATION_L3$§!。\n\n§Y停战后复员§!\n - 仍使用更高级法案时，给予 §Y90 天§!宽限期。\n - 宽限期内仍可保留或调整高级法案。\n - 期满仍和平：§R仅把更高级法案降回上述档位§!。\n\n§Y再次开战§!\n - §G取消复员倒计时§!；本规则不会解散部队。"
 PWC_RULE_DEMOBILIZATION_DESC: "决定玩家与 AI 是否需要在停战后的宽限期结束时降低过高的征兵法与经济动员法。只调整法案，不会自动解散部队；再次开战会取消复员倒计时。"
 PWC_RULE_DEMOBILIZATION_OFF: "不限制、不自动复员"
 PWC_RULE_DEMOBILIZATION_OFF_DESC: "§Y和平动员§!\n - 玩家与 AI 均§G不受和平动员上限及自动复员约束§!。\n\n§Y停战后§!\n - 本规则不会自动降低征兵法或经济动员法。"
 PWC_RULE_DEMOBILIZATION_STANDARD: "玩家和 AI 均受限"
 PWC_RULE_DEMOBILIZATION_STANDARD_DESC: "§Y和平动员上限§!\n - 适用：§Y玩家与 AI§!。\n - 和平且不在复员宽限期时：\n - 征兵法最高：§Y$PWC_LAW_CONSCRIPTION_L3$§!。\n - 经济动员法最高：§Y$PWC_LAW_ECONOMY_MOBILIZATION_L3$§!。\n\n§Y停战后复员§!\n - 仍使用更高级法案时，给予 §Y90 天§!宽限期。\n - 宽限期内仍可保留或调整高级法案。\n - 期满仍和平：§R仅把更高级法案降回上述档位§!。\n\n§Y再次开战§!\n - §G取消复员倒计时§!；本规则不会解散部队。"
 PWC_RULE_FIXED: "固定"
 PWC_RULE_GEOGRAPHIC_SUPPLY: "西北与内蒙古额外补给"
 PWC_RULE_GEOGRAPHIC_SUPPLY_DESC: "决定西北与内蒙古城市州是否保留额外当地补给。"
 PWC_RULE_GEOGRAPHIC_SUPPLY_KEEP: "保留额外补给"
 PWC_RULE_GEOGRAPHIC_SUPPLY_KEEP_DESC: "§Y适用地区§!\n - 新疆、青海、甘肃、宁夏和内蒙古的城市州。\n - §R不包括中立区§!。\n\n§Y补给效果§!\n - 保留§G额外当地补给能力§!，缓解驻军补给压力。\n - 改用通用城市国策也会保留此加成。"
 PWC_RULE_GEOGRAPHIC_SUPPLY_REMOVE: "取消额外补给"
 PWC_RULE_GEOGRAPHIC_SUPPLY_REMOVE_DESC: "§Y适用地区§!\n - 新疆、青海、甘肃、宁夏和内蒙古的城市州。\n\n§Y补给效果§!\n - §R取消额外当地补给§!，驻军可能面临更大补给压力。\n\n§Y影响范围§!\n - 普通补给来源、基础设施和真实地理保持原样。"
 PWC_RULE_GEOGRAPHY_MODE: "城市地理特色国策"
 PWC_RULE_GEOGRAPHY_MODE_CURRENT: "保留本城特色国策"
 PWC_RULE_GEOGRAPHY_MODE_CURRENT_DESC: "§Y国策内容§!\n - 保留符合本城地理特色的 §Y8§! 个国策。\n - 延续当地的发展特色。\n\n§Y影响范围§!\n - 真实地理和其他开局规则独立保留。"
 PWC_RULE_GEOGRAPHY_MODE_DESC: "选择保留 8 个地理类型国策，或改用 8 个通用城市协作国策。两档均保留真实地理与公共规则选择。"
 PWC_RULE_GEOGRAPHY_MODE_GENERIC: "改用通用城市国策"
 PWC_RULE_GEOGRAPHY_MODE_GENERIC_DESC: "§Y国策内容§!\n - 将本城 §Y8§! 个地理类型国策替换为：\n - §Y8§! 个通用城市协作国策。\n\n§Y影响范围§!\n - 只改变这组国策内容。\n - 港口、边境、岛屿等真实地理保持原样。"
 PWC_RULE_GROUP_COMMON: "常用设置"
 PWC_RULE_GROUP_FIXED: "固定规则（不可调整）"
 PWC_RULE_GROUP_GEOGRAPHY: "城市与经济"
 PWC_RULE_GROUP_MILITARY: "军队与动员"
 PWC_RULE_GROUP_TOOLS: "领土与工具"
 PWC_RULE_GROUP_WAR: "宣战与扩张"
 PWC_RULE_INDUSTRY_CALIBRATION: "开局工厂分配"
 PWC_RULE_INDUSTRY_CALIBRATION_BALANCE: "各城统一工厂数量"
 PWC_RULE_INDUSTRY_CALIBRATION_BALANCE_DESC: "§Y开局调整§!\n - §R移除§!城市的地图外民用、军用工厂。\n - 每座城市州的地图工厂统一为：\n - §Y2§! 座民用工厂、§Y1§! 座军用工厂。\n - 船坞保持原样。\n\n§Y执行时机§!\n - 只在新局开局执行§Y一次§!。\n\n§Y地图外工厂§!\n - 不位于具体州，但计入国家产能。"
 PWC_RULE_INDUSTRY_CALIBRATION_DESC: "可保留各城原有工厂、只移除地图外民用与军用工厂，或在移除后将各城地图工厂统一为 2 座民工、1 座军工。船坞保持原样。"
 PWC_RULE_INDUSTRY_CALIBRATION_KEEP: "保留各城差异"
 PWC_RULE_INDUSTRY_CALIBRATION_KEEP_DESC: "§Y开局工厂§!\n - 沿用各城现有的地图工厂。\n - 保留地图外民用、军用工厂及各城工业差异。\n\n§Y地图外工厂§!\n - 不位于具体州，但计入国家产能。"
 PWC_RULE_INDUSTRY_CALIBRATION_NORMALIZE: "只移除地图外工厂"
 PWC_RULE_INDUSTRY_CALIBRATION_NORMALIZE_DESC: "§Y开局调整§!\n - §R移除§!城市的地图外民用、军用工厂。\n - 地图内工厂及船坞保持原样。\n\n§Y执行时机§!\n - 只在新局开局执行§Y一次§!。\n - 读档不会重复清除后来获得的工厂。\n\n§Y地图外工厂§!\n - 不位于具体州，但计入国家产能。"
 PWC_RULE_INTEGRATION_SPEED: "占领法案（核心化速度）"
 PWC_RULE_INTEGRATION_SPEED_DESC: "调整占领法案，让占领地更快或更慢成为核心。自有且完全控制的非核心州， 顺从度达到 80% 时若有军工厂则移除一级；达到 90% 时自动成为核心。"
 PWC_RULE_INTEGRATION_SPEED_FAST: "快速"
 PWC_RULE_INTEGRATION_SPEED_FAST_DESC: "§Y占领法案§!\n - 玩家与 AI 共用：§Y更快核心化§!。\n - 额外每日顺从度增长修正：§G+0.6 个百分点§!。\n - 实际每日净增长还受其他修正与高顺从度衰减影响。\n\n§Y核心化条件§!\n - 仅限§Y自有且完全控制的非核心州§!。\n - 顺从度 §Y80%§!：若有军工厂，§R移除一级军工厂§!。\n - 顺从度 §Y90%§!：§G自动成为核心§!。\n\n§Y生效时间§!\n - 开始游戏后，本局档位§R锁定§!。"
 PWC_RULE_INTEGRATION_SPEED_STANDARD: "标准"
 PWC_RULE_INTEGRATION_SPEED_STANDARD_DESC: "§Y占领法案§!\n - 玩家与 AI 共用：§Y标准速度§!。\n - 额外每日顺从度增长修正：§G+0.3 个百分点§!。\n - 实际每日净增长还受其他修正与高顺从度衰减影响。\n\n§Y核心化条件§!\n - 仅限§Y自有且完全控制的非核心州§!。\n - 顺从度 §Y80%§!：若有军工厂，§R移除一级军工厂§!。\n - 顺从度 §Y90%§!：§G自动成为核心§!。\n\n§Y生效时间§!\n - 开始游戏后，本局档位§R锁定§!。"
 PWC_RULE_INTEGRATION_SPEED_STRICT: "慢速"
 PWC_RULE_INTEGRATION_SPEED_STRICT_DESC: "§Y占领法案§!\n - 玩家与 AI 共用：§Y更慢核心化§!。\n - 额外每日顺从度增长修正：§G+0.15 个百分点§!。\n - 实际每日净增长还受其他修正与高顺从度衰减影响。\n\n§Y核心化条件§!\n - 仅限§Y自有且完全控制的非核心州§!。\n - 顺从度 §Y80%§!：若有军工厂，§R移除一级军工厂§!。\n - 顺从度 §Y90%§!：§G自动成为核心§!。\n\n§Y生效时间§!\n - 开始游戏后，本局档位§R锁定§!。"
 PWC_RULE_OPTION_BLOCKED: "已封锁"
 PWC_RULE_PEACE_CONFERENCE: "战后领土分配"
 PWC_RULE_PEACE_CONFERENCE_DESC: "选择由模组自动分配战败城市的领土，还是交给原生和平会议处理。自动分配会淘汰败方；和平会议可以保留败方独立。"
 PWC_RULE_PEACE_CONFERENCE_OFF: "自动分配（默认）"
 PWC_RULE_PEACE_CONFERENCE_OFF_DESC: "§Y投降结果§!\n - 城市投降后自动分地，§R淘汰败方§!。\n - 不进入和平会议。\n\n§Y分地顺序§!\n - 已被敌国控制的败方州：归该控制国。\n - 剩余领土：优先归§Y首都占领者§!。\n - 无法确定时：归本次取得败方州数§Y最多§!的存续敌国。"
 PWC_RULE_PEACE_CONFERENCE_ON: "通过和平会议"
 PWC_RULE_PEACE_CONFERENCE_ON_DESC: "§Y投降结果§!\n - 由原生和平会议决定领土和势力存续。\n - 会议§G可以保留败方独立§!。\n\n§Y淘汰条件§!\n - 仅在势力最终被吞并、已经消失后，才§R永久淘汰§!。"
 PWC_RULE_PLAYER_PROVINCE_WAR_PRIORITY: "玩家省份优先开战"
 PWC_RULE_PLAYER_PROVINCE_WAR_PRIORITY_DESC: "优先开放玩家所在省份的 AI 宣战资格，其他省份按原有批次解锁；默认关闭。"
 PWC_RULE_PLAYER_PROVINCE_WAR_PRIORITY_OFF: "按原有批次（默认）"
 PWC_RULE_PLAYER_PROVINCE_WAR_PRIORITY_OFF_DESC: "§Y开战顺序§!\n - AI 按所选开战节奏获得宣战资格。\n - 玩家所在省份§Y不享有优先权§!。"
 PWC_RULE_PLAYER_PROVINCE_WAR_PRIORITY_ON: "玩家省份优先"
 PWC_RULE_PLAYER_PROVINCE_WAR_PRIORITY_ON_DESC: "§Y优先开战§!\n - 保护期结束后，玩家所在省份的 AI §G优先获得宣战资格§!，无需等待开战批次。\n - 其他省份的 AI 仍按原有批次解锁。\n\n§Y适用范围§!\n - 多人游戏中，所有玩家所在省份均享有优先权。\n - 省份按开局城市固定，迁都不改变归属。\n - 北京、天津 → §Y河北§!；上海 → §Y江苏§!。\n - 重庆 → §Y四川§!；香港、澳门 → §Y广东§!。\n\n§Y仍然生效§!\n - 兵力、战备、目标条件、宣战告警与战后等待仍生效，§Y不保证立即开战§!。\n - 无玩家或 AI 同时解锁时，本项不改变开战顺序。"
 PWC_RULE_PROTECTION_PERIOD: "开局保护期"
 PWC_RULE_PROTECTION_PERIOD_DAYS_180: "180 天（默认）"
 PWC_RULE_PROTECTION_PERIOD_DAYS_180_DESC: "§Y开局保护§!\n - 适用：§Y玩家与 AI§!。\n - 从 §Y2026 年 1 月 1 日§!起持续 §Y180 天§!。\n - 保护期内§R不能发起城市战争§!。\n\n§Y保护期结束后§!\n - 仍须满足目标条件与本局宣战等待时间。\n - AI 仍受分批开战设置影响。"
 PWC_RULE_PROTECTION_PERIOD_DAYS_90: "90 天"
 PWC_RULE_PROTECTION_PERIOD_DAYS_90_DESC: "§Y开局保护§!\n - 适用：§Y玩家与 AI§!。\n - 从 §Y2026 年 1 月 1 日§!起持续 §Y90 天§!。\n - 保护期内§R不能发起城市战争§!。\n\n§Y保护期结束后§!\n - 仍须满足目标条件与本局宣战等待时间。\n - AI 仍受分批开战设置影响。"
 PWC_RULE_PROTECTION_PERIOD_DESC: "从 2026 年 1 月 1 日起统一计时；保护期内所有城市均不能发起战争。"
 PWC_RULE_PROTECTION_PERIOD_NONE: "无保护期"
 PWC_RULE_PROTECTION_PERIOD_NONE_DESC: "§Y开局保护§!\n - §G取消统一保护期§!。\n - 玩家开局即可向符合条件的目标发起宣战请求。\n\n§Y仍然生效§!\n - 宣战等待时间和目标限制仍生效。\n - AI 仍受“AI 开战与战后等待”约束。\n - 分批模式下，AI §R不会全部在开局立即获得宣战资格§!。"
 PWC_RULE_PROVINCE_PRIORITY: "必须先统一本省"
 PWC_RULE_PROVINCE_PRIORITY_DESC: "先统一开局所在省份，再向省外扩张；玩家与 AI 共用限制，默认关闭。"
 PWC_RULE_PROVINCE_PRIORITY_OFF: "不限制（默认）"
 PWC_RULE_PROVINCE_PRIORITY_OFF_DESC: "§Y宣战范围§!\n - 玩家与 AI §G无需先统一本省§!。\n - 可以向符合条件的省外势力宣战。\n\n§Y仍然生效§!\n - 保护期、宣战告警与接壤／跨海条件。"
 PWC_RULE_PROVINCE_PRIORITY_ON: "统一后才能对外宣战"
 PWC_RULE_PROVINCE_PRIORITY_ON_DESC: "§Y宣战限制§!\n - 玩家与 AI 统一本省前，§R不得向省外势力宣战§!。\n - 本省势力及占据本省城市的势力§G仍可攻击§!。\n - 防御不受限制。\n\n§Y统一条件§!\n - 拥有并完全控制本省§Y全部城市§!，无需核心整合。\n - 省份按开局城市固定，迁都不改变归属。\n\n§Y特殊归属§!\n - 北京、天津 → §Y河北§!；上海 → §Y江苏§!。\n - 重庆 → §Y四川§!；香港、澳门 → §Y广东§!。"
 PWC_RULE_STATE_TRANSFER: "玩家领土转让"
 PWC_RULE_STATE_TRANSFER_DESC: "是否向城市玩家开放领土调整工具。可调整其他玩家或 AI 城市的领土，转走最后一州会淘汰来源城市；操作需先预览再确认。"
 PWC_RULE_STATE_TRANSFER_OFF: "关闭"
 PWC_RULE_STATE_TRANSFER_OFF_DESC: "§Y领土工具§!\n - §R不开启§!玩家领土调整工具。\n\n§Y正常获取领土§!\n - 玩家仍可通过战争结算等正常方式获得领土。"
 PWC_RULE_STATE_TRANSFER_ON: "允许玩家转让"
 PWC_RULE_STATE_TRANSFER_ON_DESC: "§Y操作范围§!\n - 所有城市玩家均可使用领土调整工具。\n - 来源与接收城市可为其他玩家或 AI。\n - 不限自己的领土，也§Y不要求和平§!。\n\n§Y操作步骤§!\n - 选择来源城市的州和另一接收城市。\n - §Y先预览，再确认§!。\n\n§Y转让条件§!\n - 所选州须由其拥有者§Y完全控制§!。\n - §R排除§!中立区、和平会议参与方与待结算势力。\n - 首都与最后一州§G也可以转移§!。\n\n§Y最后一州§!\n - §R转走最后一州会淘汰来源城市§!。\n - 由接收方§R吞并来源城市的剩余部队§!。"
 PWC_RULE_UNIT_LIMIT: "部队容量与超额惩罚"
 PWC_RULE_UNIT_LIMIT_AI_ONLY: "仅限制 AI"
 PWC_RULE_UNIT_LIMIT_AI_ONLY_DESC: "§Y免惩罚容量§!\n - 适用：§Y只有 AI§!。\n - 基础 8 师，每个自有且完全控制的州 §G+4 师§!。\n - 容量最多 §Y500 师§!。\n\n§Y超额惩罚§!\n - 超额比例越大，惩罚越重：\n - §R组织恢复降低§!，最高 §R25%§!。\n - §R补给消耗增加§!，最高 §R25%§!。\n\n§Y招募说明§!\n - 玩家不受该容量与惩罚约束，可以继续招募。\n - 人力、装备和补给需求仍照常计算。"
 PWC_RULE_UNIT_LIMIT_DESC: "决定哪些势力因部队超出容量受到组织恢复和补给惩罚。容量是免惩罚标准，不是玩家无法超过的招募上限。"
 PWC_RULE_UNIT_LIMIT_OFF: "不限制"
 PWC_RULE_UNIT_LIMIT_OFF_DESC: "§Y部队容量§!\n - 玩家与 AI 均§G不受容量与超额惩罚约束§!。\n\n§Y正常需求§!\n - 部队仍需要人力、装备和补给。"
 PWC_RULE_UNIT_LIMIT_STANDARD: "限制玩家和 AI"
 PWC_RULE_UNIT_LIMIT_STANDARD_DESC: "§Y免惩罚容量§!\n - 适用：§Y玩家与 AI§!。\n - 基础 8 师，每个自有且完全控制的州 §G+4 师§!。\n - 容量最多 §Y500 师§!。\n\n§Y超额惩罚§!\n - 超额比例越大，惩罚越重：\n - §R组织恢复降低§!，最高 §R25%§!。\n - §R补给消耗增加§!，最高 §R25%§!。\n\n§Y招募说明§!\n - 玩家§G仍可超额招募§!。\n - AI 达到容量后也会降低扩军目标。"
 PWC_RULE_WAR_WARNING: "宣战等待时间"
 PWC_RULE_WAR_WARNING_DESC: "决定合法宣战请求立即执行，还是先告警 30 天。到期仍须符合宣战条件；这项设置不解除保护期、目标范围或 AI 开战节奏限制。"
 PWC_RULE_WAR_WARNING_OFF: "立即宣战"
 PWC_RULE_WAR_WARNING_OFF_DESC: "§Y立即宣战§!\n - 适用：§Y玩家与 AI§!。\n - 合法宣战请求§Y立即开战§!，不再等待 30 天。\n\n§Y仍须满足§!\n - 开局保护期、省内优先与接壤／跨海目标条件。\n - AI 还须满足战备与开战节奏要求。"
 PWC_RULE_WAR_WARNING_ON: "等待 30 天"
 PWC_RULE_WAR_WARNING_ON_DESC: "§Y宣战告警§!\n - 适用：§Y玩家与 AI§!。\n - 合法宣战请求先向目标发出 §Y30 天§!告警。\n - 到期仍满足目标条件与 AI 所需战备条件，才自动宣战。\n\n§Y限制§!\n - 告警§R不可手动取消§!。\n - 目标失效或条件不再满足时，§R不会开战§!。\n - 保护期和省内优先等限制仍生效。"
 PWC_SETUP_APPLY: "应用"
 PWC_SETUP_APPLY_TT: "应用当前规则并返回选城界面；开始游戏后，本局规则锁定。"
 PWC_SETUP_ENTRY: "开局设置"
 PWC_SETUP_ENTRY_TT: "常用设置：AI 难度、占领法案（核心化速度）、开局保护期。\n其他设置按宣战、军队、城市经济与领土工具分类。\n悬停选项查看具体影响；开始游戏后本局设置锁定。"
 PWC_SETUP_LOAD: "加载方案"
 PWC_SETUP_LOAD_TT: "打开已保存的规则方案列表。加载后可以继续调整，再应用到本局。"
 PWC_SETUP_RESET: "恢复默认"
 PWC_SETUP_RESET_TT: "将全部开局规则恢复为默认选项。"
 PWC_SETUP_SAVE: "保存方案"
 PWC_SETUP_SAVE_TT: "为当前规则组合命名并保存，便于以后新局再次使用。"
 PWC_SETUP_TITLE: "开局设置"
 PWC_TRANSFER_ALL: "全选"
 PWC_TRANSFER_ALL_TT: "§H同国全选§!  §YCtrl+A§!\n加入当前地区拥有者完全控制的全部合法地区，包含首都。\n已有清单时仅可添加同一来源势力；重复点击不会重复添加。"

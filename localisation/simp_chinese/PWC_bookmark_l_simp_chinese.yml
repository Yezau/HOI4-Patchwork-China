 PWC_TRANSFER_MARK: "选州"
 PWC_TRANSFER_MARKED: "§G已选§!"
 PWC_TRANSFER_MARK_TT: "§H选择／取消当前地区§!  §YCtrl+Z§!\n把当前地块加入清单，再点一次取消。一次只能选择同一来源势力的地块。\n地块须由拥有者完全控制；中立区、正在参与和平会议的势力除外。"

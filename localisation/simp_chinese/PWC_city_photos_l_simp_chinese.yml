l_simp_chinese:
 PWC_CITY_PHOTO_8_TT: "§H大兴安岭§!\n大兴安岭横卧黑龙江西北部，黑龙江沿其北缘蜿蜒成中俄界河。广阔的寒温带林海与呼玛河、额木尔河共同塑造了这片北方林区。"
 PWC_CITY_PHOTO_9_TT: "§H呼伦贝尔§!\n呼伦贝尔因呼伦湖、贝尔湖得名，大兴安岭将辽阔草原、森林与东部河谷分隔开来。额尔古纳河沿西缘流淌，也是中俄边界的一段。"
 PWC_CITY_PHOTO_12_TT: "§H黑河§!\n黑河旧称瑷珲，与俄罗斯布拉戈维申斯克隔黑龙江相望。小兴安岭北段的森林与界河航道相连，使这里成为北方边境贸易的重要口岸。"
 PWC_CITY_PHOTO_13_TT: "§H伊春§!\n伊春位于小兴安岭南段，汤旺河纵贯林区，素有“林都”之称。漫长的林木采伐与加工历史，深深影响了城市格局和地方产业。"
 PWC_CITY_PHOTO_14_TT: "§H阿勒泰§!\n阿勒泰市坐落于新疆北部阿勒泰山麓，是阿勒泰地区的行政中心。周边山地与河谷交织，哈萨克等多民族文化为这座边疆城市增添特色。"
 PWC_CITY_PHOTO_15_TT: "§H齐齐哈尔§!\n齐齐哈尔立于松嫩平原西部，嫩江自北向南贯穿市境。这里曾长期担任黑龙江省会，近代又发展出机械制造等重工业传统。"
 PWC_CITY_PHOTO_16_TT: "§H佳木斯§!\n佳木斯位于三江平原腹地，松花江横贯市区，东北隔黑龙江与俄罗斯相望。低平的湿地、农田与边境河流构成其鲜明的东部边疆景观。"
 PWC_CITY_PHOTO_17_TT: "§H鹤岗§!\n鹤岗处在小兴安岭与三江平原交接处，北临黑龙江、南近松花江。煤炭开采曾是城市发展的核心，山地林木与河谷农田并存。"
 PWC_CITY_PHOTO_18_TT: "§H绥化§!\n绥化位于小兴安岭西麓与松嫩平原东部之间，呼兰河贯穿市境。水稻、玉米和大豆种植支撑着这一黑土地农业重镇。"
 PWC_CITY_PHOTO_19_TT: "§H兴安§!\n兴安盟处在大兴安岭中段向松嫩平原过渡的地带，洮儿河等河流向东汇入嫩江。乌兰浩特所在的河谷连接草原、林地与农耕区。"
 PWC_CITY_PHOTO_20_TT: "§H双鸭山§!\n双鸭山位于三江平原东部，完达山和老爷岭在南侧抬升，乌苏里江沿东缘构成国界。煤田开发与平原农业共同塑造当地经济。"
 PWC_CITY_PHOTO_21_TT: "§H大庆§!\n大庆坐落于湖沼密布的松嫩平原，因大庆油田而成为中国重要的石油工业城市。石油开采与炼化业，留下了鲜明的城市工业印记。"
 PWC_CITY_PHOTO_22_TT: "§H塔城§!\n塔城市位于新疆西北部，旧称塔尔巴哈台绥靖城，是塔城地区的行政中心。多民族聚居与边境往来，构成这座西北城市的历史底色。"
 PWC_CITY_PHOTO_23_TT: "§H锡林郭勒§!\n锡林郭勒盟横跨内蒙古高原中东部，锡林河与乌拉盖河流经广阔草原。畜牧业历史悠久，二连浩特则是连接蒙古国的重要陆路口岸。"
 PWC_CITY_PHOTO_24_TT: "§H哈尔滨§!\n哈尔滨是东北地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，是东北先进制造业基地、向北开放门户、区域性科技创新高地、国际冰雪旅游目的地。"
 PWC_CITY_PHOTO_25_TT: "§H鸡西§!\n鸡西位于三江平原南缘，穆棱河穿境东流，南部毗邻兴凯湖。煤炭与石墨矿产的开采，使这座中俄边境城市具有浓厚的工业色彩。"
 PWC_CITY_PHOTO_26_TT: "§H白城§!\n白城位于松嫩平原西缘和科尔沁草原东部，洮儿河横贯市境后汇向嫩江。众多湖沼散布在草原与农田间，形成鲜明的湿地景观。"
 PWC_CITY_PHOTO_27_TT: "§H七台河§!\n七台河处于三江平原与完达山交会地带，倭肯河横贯中部。煤炭矿业推动了城市兴起，周围低山与河谷仍保留东北东部的地貌特色。"
 PWC_CITY_PHOTO_29_TT: "§H牡丹江§!\n牡丹江夹在张广才岭与老爷岭之间，因牡丹江穿城而得名。上游镜泊湖由火山熔岩阻塞河道形成，东南还通往绥芬河边境口岸。"
 PWC_CITY_PHOTO_30_TT: "§H通辽§!\n通辽位于科尔沁草原与西辽河冲积平原之间，西拉木伦河和老哈河在附近汇成西辽河。这里是蒙古族聚居的重要地区，草原与农耕文化交错。"
 PWC_CITY_PHOTO_31_TT: "§H嘉峪关§!\n嘉峪关位于河西走廊西段，明长城关城扼守昔日通往西域的要道。近代镜铁山铁矿开发和酒泉钢铁公司建设，又催生了工业城市。"
 PWC_CITY_PHOTO_32_TT: "§H昌吉§!\n昌吉坐落于天山北麓、准噶尔盆地南缘，是昌吉回族自治州的州府。北疆铁路与公路穿过绿洲，长期连接乌鲁木齐和新疆北部。"
 PWC_CITY_PHOTO_34_TT: "§H松原§!\n松原地处松花江与嫩江之间的松嫩平原，旧称伯都讷。两江汇流和查干湖、大布苏湖等湖泊，赋予这里丰富的水域与湿地景观。"
 PWC_CITY_PHOTO_35_TT: "§H博尔塔拉§!\n博尔塔拉因博尔塔拉河得名，意为“棕色的草原”，州府设于博乐。新疆西北部的河谷与草原，承载着蒙古族等多民族生活传统。"
 PWC_CITY_PHOTO_36_TT: "§H长春§!\n长春是东北地区重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市，是东北先进制造业基地、区域性科技创新高地、面向东北亚开放门户。"
 PWC_CITY_PHOTO_37_TT: "§H赤峰§!\n赤峰位于内蒙古高原东南缘，西拉木伦河与老哈河在东部汇成西辽河。草原、山地和平原在此衔接，昭乌达盟的历史仍留在地方记忆中。"
 PWC_CITY_PHOTO_38_TT: "§H哈密§!\n哈密处于天山东端，巴里坤山等山脉将草原与南麓戈壁绿洲分开。当地因哈密瓜闻名，也曾是连接新疆与河西走廊的交通门户。"
 PWC_CITY_PHOTO_39_TT: "§H伊犁§!\n伊犁哈萨克自治州位于新疆西北部，州府伊宁坐落于伊犁河谷。河谷绿洲与周围山地相拥，哈萨克等民族文化和边疆交流在此交汇。"
 PWC_CITY_PHOTO_40_TT: "§H吉林§!\n吉林市沿松花江展开，满语“吉林乌拉”有“沿江”之意。江水穿越群山间的城区，这座昔日吉林省会因此获得“北国江城”的别称。"
 PWC_CITY_PHOTO_41_TT: "§H延边§!\n延边位于长白山北段，图们江沿南缘构成中朝界河，东部又与俄罗斯接壤。作为朝鲜族自治州，山地边疆与朝鲜族文化共同构成其特色。"
 PWC_CITY_PHOTO_42_TT: "§H辽源§!\n辽源因处在东辽河源头而得名，位于长白山余脉与松嫩平原交接处。清代这里曾属盛京围场，东辽河从山地向西流经市境。"
 PWC_CITY_PHOTO_43_TT: "§H乌海§!\n乌海坐落于乌兰布和沙漠南缘，黄河由南向北贯穿城市。乌达与海勃湾两地因煤矿开发兴起，后来合并形成这座资源型城市。"
 PWC_CITY_PHOTO_44_TT: "§H四平§!\n四平位于辽河平原北端，东辽河穿过市境中部。它处在吉林、辽宁与内蒙古相接的通道上，铁路交通使其成为东北内陆重要的节点。"
 PWC_CITY_PHOTO_45_TT: "§H乌鲁木齐§!\n乌鲁木齐是西部地区重要的中心城市，国际性综合交通枢纽城市，是面向中亚西亚交往中心、国际商贸物流中心。丝绸之路经济带、新亚欧大陆桥及天山北坡城市群核心城市。"
 PWC_CITY_PHOTO_46_TT: "§H吐鲁番§!\n吐鲁番深居天山南麓盆地，艾丁湖洼地是中国陆地的低处。炽热干燥的气候与山前绿洲相映，孕育出独特的葡萄种植景观。"
 PWC_CITY_PHOTO_47_TT: "§H巴音郭楞§!\n巴音郭楞蒙古自治州横跨天山南麓与塔里木盆地，首府库尔勒坐落于绿洲。广袤沙漠与山地之间，石油天然气资源影响着当地产业。"
 PWC_CITY_PHOTO_48_TT: "§H铁岭§!\n铁岭位于辽河平原北段，东侧渐入长白山余脉。辽河与招苏台河、清河等支流汇流，使这里成为连接辽宁中部和吉林西南部的河谷通道。"
 PWC_CITY_PHOTO_49_TT: "§H乌兰察布§!\n乌兰察布横跨阴山大青山，北侧是内蒙古高原，南侧为黄土丘陵。黄河、永定河及内陆河三大水系在此分界，地貌变化格外鲜明。"
 PWC_CITY_PHOTO_50_TT: "§H沈阳§!\n沈阳是东北亚国际化中心城市、国家历史文化名城、国际性综合交通枢纽城市，核心功能定位是全国先进制造业基地、东北现代服务业中心、区域性科技创新高地。沈阳还是满文化的发源地和兴盛地，是环渤海地区连接朝鲜半岛的重要枢纽，也是东北地区的政治、经济、金融、商业、交通、文化、商贸中心。"
 PWC_CITY_PHOTO_51_TT: "§H通化§!\n通化深处长白山南部，浑江自东向西穿过山间盆地，鸭绿江沿南缘成为中朝界河。境内集安曾为高句丽都城，留下丰厚的古迹。"
 PWC_CITY_PHOTO_53_TT: "§H阜新§!\n阜新位于科尔沁沙地与辽河平原交界，曾依靠煤炭开采兴起。矿藏逐渐枯竭后，这里成为中国较早开展资源型城市转型的试点。"
 PWC_CITY_PHOTO_54_TT: "§H白山§!\n白山市旧称浑江市，坐落在吉林东南部的长白山腹地。长白山天池位于东缘，南侧鸭绿江与朝鲜相隔，浑江则穿过市区向西流去。"
 PWC_CITY_PHOTO_55_TT: "§H酒泉§!\n酒泉位于河西走廊西端，是汉代河西四郡之一。祁连山下的绿洲与疏勒河水系支撑了丝路交通，辖内敦煌也保存了重要的古代文化遗产。"
 PWC_CITY_PHOTO_56_TT: "§H阿拉善§!\n阿拉善盟覆盖内蒙古西部高原，巴丹吉林、腾格里和乌兰布和沙漠依次展开。额济纳河向北流入居延海，贺兰山则守护东南缘。"
 PWC_CITY_PHOTO_57_TT: "§H包头§!\n包头北接戈壁、南临黄河河套平原，是内蒙古的冶金工业重镇。钢铁、机械制造与稀土资源开发，共同塑造了城市的产业面貌。"
 PWC_CITY_PHOTO_58_TT: "§H阿克苏§!\n阿克苏市位于天山南麓、塔里木盆地西北缘，因阿克苏河得名，名称意为“白水”。山前河流滋养绿洲，也使这里成为南疆的区域中心。"
 PWC_CITY_PHOTO_59_TT: "§H承德§!\n承德处在坝上高原与燕山交界，武烈河穿过城区汇入滦河。清代避暑山庄及周围寺庙群的兴建，使昔日热河成为皇家行宫所在。"
 PWC_CITY_PHOTO_60_TT: "§H抚顺§!\n抚顺位于辽河平原东缘，浑河自东向西横贯市境。煤矿开发曾令其享有“煤都”之名，石油化工和冶金工业也构成近代工业传统。"
 PWC_CITY_PHOTO_61_TT: "§H巴彦淖尔§!\n巴彦淖尔位于黄河北岸，阴山将河套平原与乌拉特草原分开。黄河在这里转而向东，灌溉农业与草原牧业在山脉两侧并行。"
 PWC_CITY_PHOTO_62_TT: "§H朝阳§!\n朝阳位于辽西丘陵，大凌河横贯其间，自古是华北进入东北的通道。古称龙城的历史与周边河谷地貌，为这座边关城市留下鲜明印记。"
 PWC_CITY_PHOTO_63_TT: "§H张家口§!\n张家口地处冀晋蒙交界，阴山将坝上高原与坝下河谷分开。大境门曾是长城关口，往来草原与北京的商路由此经过。"
 PWC_CITY_PHOTO_64_TT: "§H锦州§!\n锦州位于辽西丘陵和辽河平原过渡地带，小凌河与女儿河在城区附近交汇。这里扼守东北入关通道，曾是辽沈战役的重要战场。"
 PWC_CITY_PHOTO_65_TT: "§H本溪§!\n本溪地处森林覆盖的辽东山区，太子河向西穿城而过。铁矿、焦煤和特种钢支撑了悠久的钢铁工业，桓仁等水库又点缀山间河谷。"
 PWC_CITY_PHOTO_66_TT: "§H鞍山§!\n鞍山位于千山山脉与辽河平原之间，东南为丘陵，西北趋于平坦。大型钢铁工业在此发展，使城市长久以“钢都”闻名。"
 PWC_CITY_PHOTO_67_TT: "§H辽阳§!\n辽阳古称襄平，位于太子河畔，曾长期担任东北地区的政治与军事重镇。如今辽东山地向辽河平原过渡的地势，仍影响着城市分布。"
 PWC_CITY_PHOTO_69_TT: "§H盘锦§!\n盘锦坐落于辽河下游、辽东湾北岸，辽河油田带动了石油工业。河口湿地与沼泽广布，使能源设施和滨海生态景观并置。"
 PWC_CITY_PHOTO_70_TT: "§H克孜勒苏§!\n克孜勒苏柯尔克孜自治州位于新疆西部，名称有“红水”之意。柯尔克孜族生活传统与高山河谷相伴，边境地理塑造了独特的地方文化。"
 PWC_CITY_PHOTO_71_TT: "§H呼和浩特§!\n呼和浩特是华北地区重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市和区域性先进制造业基地，旧称“归绥”"
 PWC_CITY_PHOTO_72_TT: "§H葫芦岛§!\n葫芦岛旧称锦西，位于辽宁与河北交界的辽东湾海岸。燕山余脉向海滨平原下降，铁路通道、港口工业与兴城古城并存。"
 PWC_CITY_PHOTO_73_TT: "§H丹东§!\n丹东坐落于鸭绿江入海处，与朝鲜新义州隔江相望。河流口岸、辽东丘陵和黄海海岸相连，使其成为中国东北重要的边境港城。"
 PWC_CITY_PHOTO_74_TT: "§H北京§!\n北京是中华民族的发祥地之一，世界著名古都和现代化国际城市，荟萃了自元、明、清以来的中华优秀传统文化成果，拥有众多名胜古迹和人文景观，是全球拥有世界文化遗产数量最多的城市。"
 PWC_CITY_PHOTO_75_TT: "§H营口§!\n营口位于辽河入海口附近，面向渤海辽东湾。作为辽宁较早对外开埠的口岸，港口贸易与河口航运推动了城市成长。"
 PWC_CITY_PHOTO_76_TT: "§H鄂尔多斯§!\n鄂尔多斯位于黄河三面环绕的高原，库布其与毛乌素两片沙漠分列北、南。煤炭和天然气开发，使草原牧业地区逐渐发展出能源工业。"
 PWC_CITY_PHOTO_77_TT: "§H大同§!\n大同古称平城，位于大同盆地北缘、桑干河流域。北魏曾在此建都，云冈石窟与后世边塞遗迹，见证了它作为北方重镇的历史。"
 PWC_CITY_PHOTO_78_TT: "§H秦皇岛§!\n秦皇岛濒临渤海，燕山丘陵向海岸平原逐渐下降。山海关扼守长城东端的陆路通道，北戴河海滨则形成另一种沿海城市景观。"
 PWC_CITY_PHOTO_79_TT: "§H唐山§!\n唐山北依燕山、南临渤海，开平煤矿带动了近代工业兴起。经历地震后的重建，城市仍以钢铁、能源和曹妃甸港区为重要支柱。"
 PWC_CITY_PHOTO_80_TT: "§H朔州§!\n朔州位于大同盆地西南部，桑干河穿过中东部平原。周围群山环抱，煤电、陶瓷与畜牧业共同构成这座晋北城市的产业脉络。"
 PWC_CITY_PHOTO_81_TT: "§H喀什§!\n喀什位于塔里木盆地西缘，是古丝绸之路的重要绿洲城市，以老城街巷和多元商贸文化闻名。"
 PWC_CITY_PHOTO_82_TT: "§H天津§!\n天津是中国重要的中心城市，国家历史文化名城，现代海洋城市，国际性综合交通枢纽城市，全国先进制造研发基地、北方国际航运核心区、金融创新运营示范区。完整定位为“国际港口城市、北方经济中心、生态城市”"
 PWC_CITY_PHOTO_83_TT: "§H大连§!\n大连位于辽东半岛南端，濒临黄海与渤海，是东北重要的港口、造船和海运城市。"
 PWC_CITY_PHOTO_84_TT: "§H克拉玛依§!\n克拉玛依位于准噶尔盆地西北缘，因石油勘探和开采而兴起。油田生产深刻改变了原有荒漠地貌，也形成这座城市鲜明的工业身份。"
 PWC_CITY_PHOTO_85_TT: "§H保定§!\n保定位于河北中部、太行山东麓，地处北京以南的华北平原，是历史悠久的区域中心。"
 PWC_CITY_PHOTO_86_TT: "§H张掖§!\n张掖古称甘州，坐落在祁连山北麓与黑河滋养的河西走廊绿洲。汉代列为河西四郡之一，地名寄托着打通西域交通的愿望。"
 PWC_CITY_PHOTO_87_TT: "§H忻州§!\n忻州横跨黄土高原东部的山地与盆地，滹沱河发源于境内五台山。佛教名山五台山的寺院群，使这片晋北山地具有深厚的宗教文化。"
 PWC_CITY_PHOTO_88_TT: "§H和田§!\n和田位于塔克拉玛干沙漠南缘绿洲，是古代丝绸之路上的重镇。和田玉、地毯与丝绸工艺，延续了绿洲贸易的悠久传统。"
 PWC_CITY_PHOTO_89_TT: "§H榆林§!\n榆林处于毛乌素沙地与黄土高原之间，明长城横穿北部，曾是重要的边塞重镇。地下煤、油、气等资源又推动了现代能源产业。"
 PWC_CITY_PHOTO_90_TT: "§H廊坊§!\n廊坊位于北京与天津之间的华北平原，永定河和大清河流经境内。北部三河、香河与大厂形成被京津分隔的飞地，地域格局颇为独特。"
 PWC_CITY_PHOTO_91_TT: "§H武威§!\n武威古称凉州，位于祁连山与腾格里沙漠之间的河西走廊东端。曾为汉代河西四郡之一，多朝政权在此建都，丝路交通贯穿其历史。"
 PWC_CITY_PHOTO_92_TT: "§H海西§!\n海西州位于青海西部，柴达木盆地的荒漠、盐湖与周边高山构成主要景观。蒙古族、藏族等民族长期在高原上生活，矿产开发也影响当地发展。"
 PWC_CITY_PHOTO_93_TT: "§H海北§!\n海北州位于祁连山中段南麓，南部延伸至青海湖北岸。平行山脉、草原和湖滨平原交替分布，大通河从西北向东南穿过州境。"
 PWC_CITY_PHOTO_94_TT: "§H阳泉§!\n阳泉位于太行山西麓的山间盆地，桃河穿过城区。正太铁路开通后，煤炭开采与冶铁业迅速发展，使其成为晋东工业重镇。"
 PWC_CITY_PHOTO_95_TT: "§H金昌§!\n金昌处在河西走廊东缘，南倚祁连山、北临龙首山。丰富的镍矿及其他有色金属资源，催生了以冶炼为核心的“镍都”。"
 PWC_CITY_PHOTO_96_TT: "§H沧州§!\n沧州东临渤海，南运河与子牙新河穿越华北平原。沿海盐业历史悠久，石油资源和港口交通又赋予这座运河城市新的产业面貌。"
 PWC_CITY_PHOTO_97_TT: "§H银川§!\n银川是西北地区重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市，是全国重要的能源产业基地、西北先进制造业基地。黄河由南向北流贯中部，境内湖泊湿地众多，又被称为塞上湖城。"
 PWC_CITY_PHOTO_98_TT: "§H石家庄§!\n石家庄是京津冀地区重要的中心城市，全国性综合交通枢纽城市。石家庄市是人类文明开发较早、文化底蕴深厚的地区，战国中山国文化是其历史文化脉络中的重要一环。"
 PWC_CITY_PHOTO_99_TT: "§H吕梁§!\n吕梁山纵贯吕梁市境，黄河沿西缘南流，汾河则经过东部谷地。山地间蕴藏丰富主焦煤，煤矿开发长期影响晋西经济。"
 PWC_CITY_PHOTO_103_TT: "§H衡水§!\n衡水位于河北东南部的华北平原，滏阳河、滹沱河等水系穿境而过。多条铁路在此交汇，使低平的农业地区成为冀东南交通节点。"
 PWC_CITY_PHOTO_104_TT: "§H太原§!\n太原是中国中部地区重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市，华北先进制造业基地，被称为“龙城”"
 PWC_CITY_PHOTO_105_TT: "§H石嘴山§!\n石嘴山位于贺兰山与黄河之间的银川平原北部。太西煤开采推动煤炭及能源化工发展，使其成为宁夏北部的工业城市。"
 PWC_CITY_PHOTO_106_TT: "§H滨州§!\n滨州位于渤海西岸的黄河三角洲腹地，黄河、小清河等河流塑造平原。这里也是孙武故乡，吕剧发源于境内，兼具滨海与地方文化特色。"
 PWC_CITY_PHOTO_107_TT: "§H吴忠§!\n吴忠位于宁夏中部黄河东岸，引黄灌区与鄂尔多斯高原在此衔接。回族文化、滩羊牧养和河谷农田共同形成当地鲜明的生活景观。"
 PWC_CITY_PHOTO_108_TT: "§H东营§!\n东营坐落于黄河入海处，三角洲湿地不断由泥沙堆积而成。胜利油田开发催生石油工业，使海岸生态与能源生产并置。"
 PWC_CITY_PHOTO_109_TT: "§H晋中§!\n晋中位于太行山西麓至汾河谷地的过渡地带，东部山地与西部平原差异鲜明。潇河等河流穿境，铁路交通连接山西腹地和河北平原。"
 PWC_CITY_PHOTO_110_TT: "§H德州§!\n德州地处山东西北部黄河下游冲积平原，京杭大运河穿过市境。它扼守冀鲁交通通道，河道与平原农田共同塑造城市风貌。"
 PWC_CITY_PHOTO_111_TT: "§H烟台§!\n烟台位于胶东半岛中北部，北临渤海、南濒黄海。曲折海岸和芝罘等港湾支撑了近代开埠贸易，葡萄种植与酿酒也成为地方特色。"
 PWC_CITY_PHOTO_112_TT: "§H中卫§!\n中卫位于黄河穿过腾格里沙漠南缘的地带，沙坡头呈现沙漠与河流相邻的景观。沿河绿洲和南部黄土丘陵，让宁甘蒙交界处地貌多样。"
 PWC_CITY_PHOTO_113_TT: "§H邢台§!\n邢台位于太行山南段东麓，山地向华北平原逐渐展开。古称邢州，先后与邢国、钜鹿等历史地名相连，留下漫长的建城脉络。"
 PWC_CITY_PHOTO_114_TT: "§H白银§!\n白银位于黄河上游，峡谷、盆地与绿洲在黄土高原边缘交替。明代设白银厂开矿，近代铜矿和有色金属冶炼又使其享有“铜城”之称。"
 PWC_CITY_PHOTO_115_TT: "§H威海§!\n威海占据山东半岛最东端，三面濒临黄海，海湾与岛礁密布。刘公岛见证近代海防历史，曲折海岸也孕育了港口和渔业。"
 PWC_CITY_PHOTO_116_TT: "§H延安§!\n延安位于黄土高原腹地，延河从山间沟谷流过。红军长征抵达陕北后，这里成为革命根据地的重要中心，宝塔山留存鲜明的历史记忆。"
 PWC_CITY_PHOTO_117_TT: "§H西宁§!\n西宁是西北地区重要的中心城市，全国性综合交通枢纽城市，是青藏高原综合服务保障基地、国际生态旅游目的地，素有“西海锁钥、海藏咽喉”之称。"
 PWC_CITY_PHOTO_118_TT: "§H潍坊§!\n潍坊位于山东半岛中部，南有丘陵、北有莱州湾滩涂。胶济铁路穿境，潍县风筝传统又让这座连接内陆与胶东的城市有了“鸢都”之称。"
 PWC_CITY_PHOTO_119_TT: "§H济南§!\n济南是黄河流域重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市，北方先进制造业基地、北方商贸物流中心、区域性科技创新高地。"
 PWC_CITY_PHOTO_120_TT: "§H青海·海南§!\n海南藏族自治州位于青海湖以南，北有湖滨盆地，中部为共和盆地。黄河绕行州境并在龙羊峡蓄水，湖泊、草原与峡谷相映。"
 PWC_CITY_PHOTO_122_TT: "§H庆阳§!\n庆阳位于陕甘宁交界的陇东黄土高原，子午岭和泾河支流勾勒出沟壑地貌。古称庆州，农耕村落沿河谷与塬面展开。"
 PWC_CITY_PHOTO_123_TT: "§H淄博§!\n淄博处在山东丘陵与华北平原交接带，临淄曾是齐国都城。陶瓷制作和石油化工延续着城市的工业传统，齐文化遗迹散布其间。"
 PWC_CITY_PHOTO_124_TT: "§H海东§!\n海东位于祁连山东段与黄土高原、青藏高原交汇处，山地沟壑密集。湟水穿越中部，黄河流经南部，河谷串起青海东部的城镇与农田。"
 PWC_CITY_PHOTO_125_TT: "§H长治§!\n长治古称上党，坐落于太行山和太岳山之间的上党盆地。浊漳河多支流在此汇合，晋冀豫交界的山口使其具有重要的交通位置。"
 PWC_CITY_PHOTO_126_TT: "§H青岛§!\n青岛坐落于胶东半岛南岸，近代港口与铁路建设推动城市兴起。德租时期的街区建筑和此后形成的纺织工业，记录了滨海商埠的变迁。"
 PWC_CITY_PHOTO_128_TT: "§H邯郸§!\n邯郸位于太行山东麓与华北平原之间，滏阳河穿过市境。这里曾为战国赵国都城，磁山文化遗址又将地方历史追溯到更早的时代。"
 PWC_CITY_PHOTO_129_TT: "§H兰州§!\n兰州是西部地区重要的中心城市，全国性综合交通枢纽城市，是西北先进制造业基地、区域性科技创新高地。古就是“联络四域、襟带万里”的交通枢纽和军事要塞。"
 PWC_CITY_PHOTO_130_TT: "§H聊城§!\n聊城位于鲁豫冀交界的黄河冲积平原，京杭大运河流经古城。东昌府的商业历史与黄河农耕景观交融，形成鲜明的运河文化。"
 PWC_CITY_PHOTO_131_TT: "§H临汾§!\n临汾古称平阳，汾河沿盆地南流，东西两侧为太岳山与吕梁山。陶寺遗址和尧都传说，使这片黄河东岸土地与早期文明相连。"
 PWC_CITY_PHOTO_132_TT: "§H固原§!\n固原位于宁夏南部的六盘山区，山脉纵贯黄土丘陵。清水河、泾河等河流发源于境内，古原州的地理位置连接关中与西北腹地。"
 PWC_CITY_PHOTO_133_TT: "§H那曲§!\n那曲位于藏北高原，广阔草原与高寒山地绵延。藏语地名意为“黑河”，当地河流和牧场共同构成高原游牧生活的自然背景。"
 PWC_CITY_PHOTO_134_TT: "§H泰安§!\n泰安依泰山南麓而建，山体与城区相接，主峰玉皇顶耸立其北。泰山长期承载祭祀与登山传统，大汶河则滋养周边平原。"
 PWC_CITY_PHOTO_135_TT: "§H安阳§!\n安阳位于太行山东麓，洹河从城区北部蜿蜒而过。商代殷墟出土的甲骨文与宫殿遗址，使这座古都成为研究早期中国的重要地点。"
 PWC_CITY_PHOTO_136_TT: "§H玉树§!\n玉树位于青藏高原腹地，唐古拉山、巴颜喀拉山等山脉环绕。长江、黄河与澜沧江的源区分布于此，通天河穿行高寒山地。"
 PWC_CITY_PHOTO_137_TT: "§H濮阳§!\n濮阳地处冀鲁豫交界的黄河北岸平原，金堤河和卫河流经境内。中原油田的发现推动城市建设，也形成石油化工产业。"
 PWC_CITY_PHOTO_138_TT: "§H临沂§!\n临沂位于沂蒙山区与沂沭河平原之间，北部群山逐渐过渡到南部农田。沂河、沭河从山地发源，古琅琊与沂州的历史留下深厚文化积淀。"
 PWC_CITY_PHOTO_139_TT: "§H黄南§!\n黄南州位于青藏高原东部、阿尼玛卿山北麓，黄河绕行州境。隆务河注入黄河，山间盆地与河谷孕育了同仁一带的藏族聚居地。"
 PWC_CITY_PHOTO_140_TT: "§H临夏§!\n临夏古称河州，位于黄土高原与青藏高原交界，黄河与洮河穿境而过。古代丝路和唐蕃古道在此交汇，茶马贸易留下深刻印记。"
 PWC_CITY_PHOTO_141_TT: "§H定西§!\n定西位于陇西黄土高原与西秦岭山地之间，渭河发源于境内渭源县。古代丝路经过此地，马铃薯种植又成为当代鲜明的农业特色。"
 PWC_CITY_PHOTO_142_TT: "§H晋城§!\n晋城位于太行山与王屋山之间，丹河和沁河向南流出山地。古泽州曾扼守山西通往中原的门户，盆地与山口孕育了丰富的历史遗存。"
 PWC_CITY_PHOTO_143_TT: "§H日照§!\n日照面向黄海，北部五莲山余脉逐渐下降至海滨。港口贸易与渔业依托海岸发展，“日出初光先照”的地名也映照其临海位置。"
 PWC_CITY_PHOTO_144_TT: "§H济宁§!\n济宁位于鲁中南山地与黄淮平原交界，京杭运河穿过市区。南部微山湖等湖泊组成南四湖，水运与湖泊渔业塑造了地方生活。"
 PWC_CITY_PHOTO_145_TT: "§H菏泽§!\n菏泽古称曹州，坐落于鲁苏皖豫交界的黄河冲积平原。牡丹栽培历史悠久，花卉产业成为城市标识，黄河沿北部边界流过。"
 PWC_CITY_PHOTO_146_TT: "§H新乡§!\n新乡地处太行山东南麓与黄河、卫河冲积平原之间，卫河横贯市区。牧野之战等古代事件与近代铁路工业，共同构成豫北城市记忆。"
 PWC_CITY_PHOTO_147_TT: "§H渭南§!\n渭南位于关中平原东部，渭河穿境后注入黄河，南侧升起秦岭。地处陕西通往中原的门户，河谷平原与黄土台塬相互交错。"
 PWC_CITY_PHOTO_148_TT: "§H运城§!\n运城古称河东，位于黄河弯曲环抱的晋西南盆地，中条山横亘南侧。盐湖与河谷农业相伴，蒲阪等古代都邑传说丰富了地方历史。"
 PWC_CITY_PHOTO_149_TT: "§H平凉§!\n平凉地处陇东黄土高原与六盘山交接处，泾河穿行其间。这里曾是丝绸之路通往西域的重镇，道教名山崆峒山也坐落于此。"
 PWC_CITY_PHOTO_151_TT: "§H阿里§!\n阿里位于西藏西部的高寒高原，喜马拉雅山与冈底斯山在此绵延。印度河等大河的源区分布于此，辽阔山地保留着独特的高原景观。"
 PWC_CITY_PHOTO_152_TT: "§H果洛§!\n果洛横跨黄河上游草原，巴颜喀拉山与阿尼玛卿山分列南北。鄂陵湖、扎陵湖点缀高原，牧业长期塑造了当地的生活方式。"
 PWC_CITY_PHOTO_154_TT: "§H铜川§!\n铜川处在关中盆地通向黄土高原的过渡地带，历来是关中与陕北之间的通道。煤炭开采曾支撑城市发展，也留下工业转型的鲜明印记。"
 PWC_CITY_PHOTO_155_TT: "§H甘南§!\n甘南位于青藏高原与黄土高原交接处，草原、山地和黄河河谷在此相遇。作为传统安多藏区的一部分，藏族文化与高原牧业深植当地。"
 PWC_CITY_PHOTO_157_TT: "§H咸阳§!\n咸阳坐落于渭河与泾河交汇的关中腹地，曾为秦朝都城。此后多个王朝以周边地区为京畿，使古都遗迹与关中平原的历史紧密相连。"
 PWC_CITY_PHOTO_158_TT: "§H枣庄§!\n枣庄位于山东丘陵与黄淮平原交界，京杭运河穿过境内。台儿庄古城与战役遗址见证运河商贸及近代战争，西侧还有微山湖湿地。"
 PWC_CITY_PHOTO_159_TT: "§H焦作§!\n焦作倚太行山南麓、临黄河北岸，近代煤矿开发催生了工业城市。当地也是太极拳的重要发源地，山地与武术传统构成鲜明风貌。"
 PWC_CITY_PHOTO_160_TT: "§H济源§!\n济源位于黄河北岸的豫西北山前地带，因古济水源头而得名。隋代设县后延续地名，铁路与能源工业又塑造了现代城市。"
 PWC_CITY_PHOTO_161_TT: "§H天水§!\n天水位于渭河上游，黄土高原与秦岭山地在此交会。作为丝绸之路旧驿，城外麦积山石窟保存了跨越多个朝代的佛教造像。"
 PWC_CITY_PHOTO_162_TT: "§H宝鸡§!\n宝鸡古称陈仓，位于关中平原西端和秦岭北麓，渭河横贯市境。陇海、宝成与宝中铁路在这里交会，使其成为西北与四川之间的交通节点。"
 PWC_CITY_PHOTO_163_TT: "§H连云港§!\n连云港面向黄海，背靠苏北平原，云台山主峰为江苏最高峰。作为陇海铁路的东端港口，它连接内陆运输线与沿海航运。"
 PWC_CITY_PHOTO_164_TT: "§H三门峡§!\n三门峡坐落在黄河南岸的豫西山地，古称陕州。三门峡水利枢纽的建设推动了现代城市形成，也改变了这一段黄河的景观。"
 PWC_CITY_PHOTO_165_TT: "§H开封§!\n开封位于黄河边的中原平原，曾以汴京之名成为北宋都城。长期的黄河泛滥使古城层层叠压，留下独特的城摞城遗存。"
 PWC_CITY_PHOTO_166_TT: "§H洛阳§!\n洛阳在黄河流域长期承担都城角色，曾是丝绸之路向西延伸的重要起点。白马寺与龙门石窟见证佛教在中原传播的历程。"
 PWC_CITY_PHOTO_167_TT: "§H郑州§!\n郑州是中国中部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，中部先进制造业基地、商贸物流中心、对外开放门户和区域性科技创新高地。郑州是华夏文明的重要发祥地，中国八大古都之一，古称商都，今为绿城。"
 PWC_CITY_PHOTO_168_TT: "§H徐州§!\n徐州位于江苏西北部，是连接华东与中原的交通枢纽，历史上以彭城闻名。"
 PWC_CITY_PHOTO_169_TT: "§H商丘§!\n商丘位于黄淮冲积平原，古称宋州、归德，长期是豫东的交通要地。陇海与京九铁路在此交叉，使历史商埠延续为铁路枢纽。"
 PWC_CITY_PHOTO_170_TT: "§H西安§!\n西安是中国西部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，国家重要科研和文教中心，西部经济中心、科技创新中心、先进制造业基地、对外交往中心以及国际旅游目的地，是中国历史上第一个被称为京的城市，是中华文明和中华民族重要发祥地之一。"
 PWC_CITY_PHOTO_172_TT: "§H宿州§!\n宿州地处皖北平原，位于安徽与江苏、山东、河南相接的区域。濉河、新汴河等水道流过平坦农地，使这里成为淮海地区的交通和农业节点。"
 PWC_CITY_PHOTO_173_TT: "§H淮南§!\n淮南横跨淮河，北部平原与南部江淮丘陵在此过渡。煤矿开采带动电力和化工发展，使这座沿河城市成为重要的能源工业基地。"
 PWC_CITY_PHOTO_174_TT: "§H陇南§!\n陇南位于秦岭与岷山之间的陕甘川交界地带，嘉陵江及白龙江穿行山谷。山间盆地与较温润的气候，使这里呈现不同于甘肃北部的景观。"
 PWC_CITY_PHOTO_175_TT: "§H商洛§!\n商洛因商山与洛水得名，位于秦岭东段南坡。境内山谷分属黄河与长江两大水系，使这片山地成为关中通往鄂豫的过渡地带。"
 PWC_CITY_PHOTO_176_TT: "§H盐城§!\n盐城面向黄海，海岸滩涂与河渠交织成广阔的滨海湿地。候鸟沿东亚迁飞路线在此停歇，部分栖息地已列入世界自然遗产。"
 PWC_CITY_PHOTO_177_TT: "§H平顶山§!\n平顶山因市区北侧平坦的山峰得名，位于伏牛山与黄淮平原之间。丰富的煤炭资源推动现代工业城市兴起，周边仍保留应国等古代遗迹。"
 PWC_CITY_PHOTO_178_TT: "§H许昌§!\n许昌地处伏牛山丘陵与豫东平原过渡地带，颍河流过市境。古称许州的城市与汉末魏初历史联系紧密，至今仍保留建安文化记忆。"
 PWC_CITY_PHOTO_179_TT: "§H鹤壁§!\n鹤壁位于太行山东南麓，淇河与卫河流经山前丘陵和平原。煤炭开采推动城市兴起，而淇河谷地保存了这一带较早的人文脉络。"
 PWC_CITY_PHOTO_180_TT: "§H漯河§!\n漯河位于豫中南平原，沙河、澧河等水道贯穿城区。依托粮食产区和交通网络，肉制品、面食与其他食品加工成为当地鲜明产业。"
 PWC_CITY_PHOTO_181_TT: "§H宿迁§!\n宿迁位于苏北平原，京杭运河与黄河故道贯穿河网。洪泽湖和骆马湖分列南北，使这座城市兼有运河沿线与湖区水乡的风貌。"
 PWC_CITY_PHOTO_183_TT: "§H阿坝§!\n阿坝位于四川西北高原，山地、草原与岷江上游河谷交错分布。藏族与羌族文化在这里相遇，九寨沟等高山湖泊景观也闻名于世。"
 PWC_CITY_PHOTO_184_TT: "§H周口§!\n周口坐落在豫东平原，沙河、颍河和贾鲁河在此交会。古陈州、淮阳的历史与河道商贸相连，水路曾推动城镇繁荣。"
 PWC_CITY_PHOTO_185_TT: "§H淮北§!\n淮北位于皖北平原，濉河与沱河穿过黄泛区边缘。近代煤矿开发促成城市扩展，酿酒传统则留下口子窖等地方名产。"
 PWC_CITY_PHOTO_186_TT: "§H毫州§!\n亳州地处黄淮平原，涡河斜贯城境，古时称谯。这里长期以中药材集散与种植闻名，药业传统与古城历史共同塑造了城市面貌。"
 PWC_CITY_PHOTO_187_TT: "§H淮安§!\n淮安位于江淮平原河湖密布的地带，京杭运河穿过城区。作为漕运要地，淮安的历史与洪泽湖、淮河及运河水系紧密相连。"
 PWC_CITY_PHOTO_188_TT: "§H甘孜§!\n甘孜横跨四川西部的横断山地与高原河谷，传统上属于康区。高山、草原和藏族聚落共同构成多样景观，河谷历来是川藏往来的通道。"
 PWC_CITY_PHOTO_190_TT: "§H汉中§!\n汉中位于秦岭与大巴山之间的汉水盆地，是陕甘川交会处的山间通道。温润河谷与北侧关中形成对照，古栈道曾连接两地。"
 PWC_CITY_PHOTO_191_TT: "§H安康§!\n安康位于秦岭与大巴山之间，汉水由西向东穿过山谷盆地。川陕鄂之间的水陆交通长期经过这里，形成兼具山地与河港特色的城市。"
 PWC_CITY_PHOTO_192_TT: "§H南阳§!\n南阳坐落于伏牛山、桐柏山环抱的盆地，连接汉水上游与淮河源区。古称宛的城镇长期扼守中原通往荆襄的通道。"
 PWC_CITY_PHOTO_193_TT: "§H阜阳§!\n阜阳位于皖西北的淮北平原，颍河由西北向东南贯穿市境并汇入淮河。河流和沃野支撑农业，也将这座城镇接入淮河水路。"
 PWC_CITY_PHOTO_194_TT: "§H驻马店§!\n驻马店位于豫西山地向豫东平原过渡的地带，汝河与洪河流经境内。古称汝南、蔡州，驿路交通留下今天的城市名称。"
 PWC_CITY_PHOTO_196_TT: "§H蚌埠§!\n蚌埠沿淮河两岸展开，京沪铁路与淮南铁路在此交会。铁路枢纽和河运共同催生近代工商业，也使皖北平原与江淮地区相连。"
 PWC_CITY_PHOTO_197_TT: "§H扬州§!\n扬州位于长江北岸，京杭运河与江河水路使它成为历代漕运和盐业重镇。古城园林、街巷与淮扬菜延续着运河商贸留下的文化。"
 PWC_CITY_PHOTO_198_TT: "§H十堰§!\n十堰地处秦岭、大巴山与武当山之间，汉水横贯山地。武当山道教建筑群和丹江口水库分别见证宗教历史与现代水利工程。"
 PWC_CITY_PHOTO_199_TT: "§H滁州§!\n滁州位于皖东丘陵与江淮平原之间，河流分属长江和淮河两大水系。琅琊山与欧阳修笔下的醉翁亭，使山水成为古城记忆的一部分。"
 PWC_CITY_PHOTO_200_TT: "§H泰州§!\n泰州位于长江北岸的江淮平原，南部沿江、北部河网密布。古称海陵，运河和长江航道共同支撑了地方商业与工农业发展。"
 PWC_CITY_PHOTO_201_TT: "§H绵阳§!\n绵阳沿涪江展开，西北龙门山与东南丘陵形成鲜明地形过渡。古称绵州的城市是川北交通节点，也以电子与科研产业闻名。"
 PWC_CITY_PHOTO_202_TT: "§H广元§!\n广元位于四川盆地北缘、嘉陵江上游，米仓山与大巴山夹出入川通道。古称利州，连接蜀地与陕甘的驿路赋予它门户地位。"
 PWC_CITY_PHOTO_203_TT: "§H六安§!\n六安位于大别山北麓，山地向皖西丘陵与淮河平原递降。淠河、史河上游多座水库调蓄山洪，也构成独特的山水景观。"
 PWC_CITY_PHOTO_204_TT: "§H巴中§!\n巴中位于米仓山和大巴山南麓，山地逐渐向四川盆地丘陵过渡。南江汇入巴河，山谷与河道长期构成川东北的往来路径。"
 PWC_CITY_PHOTO_205_TT: "§H南通§!\n南通处在长江入海口北侧，同时面向黄海与长江航道。海岸、港口与河网使这座旧称通州的城市兼具海运和江运传统。"
 PWC_CITY_PHOTO_206_TT: "§H信阳§!\n信阳位于淮河上游，桐柏山和大别山环绕其南西两侧。山地茶园孕育信阳毛尖，南北过渡的地理位置也塑造了当地风物。"
 PWC_CITY_PHOTO_207_TT: "§H合肥§!\n合肥是江淮地区重要的行政中心、商埠和军事重镇，素有“淮右襟喉、江南唇齿”、“江淮首郡、吴楚要冲”、“三国故地、包拯故里、淮军摇篮”之称。长三角地区重要的中心城市，全国性综合交通枢纽城市，中部先进制造业基地、区域性科技创新高地、国际航空货运集散中心。"
 PWC_CITY_PHOTO_208_TT: "§H襄阳§!\n襄阳横跨汉水中游，古城位于南北交通要道。城墙和河道见证历代军事争夺，周边盆地则连接中原与江汉平原。"
 PWC_CITY_PHOTO_209_TT: "§H昌都§!\n昌都位于藏东横断山脉，金沙江、澜沧江与怒江水系纵切高山。作为传统康区的重要中心，山间河谷承载了川藏往来的交通。"
 PWC_CITY_PHOTO_210_TT: "§H随州§!\n随州位于桐柏山与大洪山之间，涢水贯穿鄂北丘陵。古代曾国遗址出土编钟，使这座城与中国早期礼乐文化紧密相连。"
 PWC_CITY_PHOTO_211_TT: "§H达州§!\n达州位于四川东北部，是川渝陕交界地区的交通节点。图中的达州站体现了城市的铁路枢纽地位。"
 PWC_CITY_PHOTO_212_TT: "§H马鞍山§!\n马鞍山横跨长江沿岸平原与皖东丘陵，处在安徽通往南京的江岸。近代钢铁工业塑造城市，采石矶等沿江胜景保留古老的诗文记忆。"
 PWC_CITY_PHOTO_213_TT: "§H镇江§!\n镇江位于长江南岸，京杭运河在此与大江相接。古称京口的城镇因水陆要冲而兴，金山等江岸名胜承载悠久的历史传说。"
 PWC_CITY_PHOTO_214_TT: "§H南京§!\n南京是东部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，是全国先进制造业基地、东部产业创新中心和区域性科技创新高地、东部现代服务业中心、区域性航运物流中心。有“六朝古都”“十代都会”之称，城市的文化辐射力达整个东亚地区。长期是中国南方的政治文化中心，亦长期被视为华夏之正朔所在。"
 PWC_CITY_PHOTO_215_TT: "§H常州§!\n常州地处长江与太湖之间的苏南平原，京杭运河穿城而过。古称延陵、毗陵的城镇延续江南工商业传统，河网仍塑造城市格局。"
 PWC_CITY_PHOTO_216_TT: "§H苏州§!\n苏州地处长江三角洲、太湖东岸，以古典园林和水乡风貌闻名，也是重要的制造业城市。"
 PWC_CITY_PHOTO_217_TT: "§H南充§!\n南充沿嘉陵江中游展开，川东北丘陵围绕河谷。古称果州、顺庆，丝绸与柑橘生产形成地方特色，水路也连接四川盆地各地。"
 PWC_CITY_PHOTO_218_TT: "§H神农架§!\n神农架位于湖北西北山地，以连续的森林、高山草甸和丰富野生动植物闻名。神农传说赋予山名，林区的自然生态也使其受到长期保护。"
 PWC_CITY_PHOTO_219_TT: "§H无锡§!\n无锡位于太湖北岸、长江南侧，河湖与运河交织成江南水网。近代工商业和纺织业在此兴盛，宜兴的陶器传统也延续至今。"
 PWC_CITY_PHOTO_220_TT: "§H孝感§!\n孝感位于江汉平原北缘，府河与澴河在城区附近汇合。北面丘陵渐入桐柏山和大别山，南面水网则把城市接向汉水流域。"
 PWC_CITY_PHOTO_221_TT: "§H崇明岛§!\n崇明岛由长江入海口的泥沙逐渐淤积而成，岛上大片平坦土地仍受河海共同影响。它横卧上海市区以北的江口，保留典型河口冲积岛地貌。"
 PWC_CITY_PHOTO_222_TT: "§H日喀则§!\n日喀则位于后藏腹地，是藏传佛教重要的宗教与文化中心。班禅喇嘛驻锡的扎什伦布寺与高原山谷共同塑造了这座古城的面貌。"
 PWC_CITY_PHOTO_223_TT: "§H德阳§!\n德阳坐落在成都平原北缘，龙门山地向平原延伸。重型机械与磷矿工业是地方特色，广汉三星堆遗址又揭示了更早的古蜀文明。"
 PWC_CITY_PHOTO_224_TT: "§H宜昌§!\n宜昌位于长江西陵峡出口，山地在此渐入江汉平原。三峡水道和清江支流塑造交通格局，也使这里成为大型水利工程的重要节点。"
 PWC_CITY_PHOTO_225_TT: "§H荆门§!\n荆门位于江汉平原西北缘，汉水纵贯市境，北侧渐入荆山余脉。平原、湖泊与山前通道相接，使这里成为湖北中部的交通节点。"
 PWC_CITY_PHOTO_226_TT: "§H黄冈§!\n黄冈坐落于大别山南麓、长江北岸，山间河流向南汇入大江。古黄州因苏轼贬居留下深厚文学记忆，山水与诗文相互映照。"
 PWC_CITY_PHOTO_228_TT: "§H上海§!\n上海是中国最大的国际经济中心和重要的国际金融中心，是中国国际经济、金融、贸易、航运、科技创新中心。"
 PWC_CITY_PHOTO_229_TT: "§H成都§!\n成都是中国西部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，西部经济中心、西部科技创新中心、西部对外交往中心、全国先进制造业基地。西南地区的政治、经济、文化、军事中心的重要城市。"
 PWC_CITY_PHOTO_230_TT: "§H芜湖§!\n芜湖位于青弋江汇入长江之处，沿江平原提供了天然水运条件。古称鸠兹，近代港口商贸和工业逐渐塑造了这座皖南城市。"
 PWC_CITY_PHOTO_231_TT: "§H铜陵§!\n铜陵依长江而建，南部丘陵蕴藏丰富铜矿。当地采铜冶铜的历史可上溯古代，青铜文化与现代有色金属工业在此相连。"
 PWC_CITY_PHOTO_232_TT: "§H宣城§!\n宣城位于皖南山地与长江平原的过渡地带，青弋江、水阳江向北流去。古称宣州，山水与诗歌、宣纸制作传统共同延续地方文脉。"
 PWC_CITY_PHOTO_233_TT: "§H安庆§!\n安庆坐落于长江北岸、大别山南缘，江湾与湖泊环绕旧城。这里曾是安徽省会，近代沿江商贸和文化活动留下鲜明的城市历史。"
 PWC_CITY_PHOTO_234_TT: "§H遂宁§!\n遂宁地处四川盆地中部丘陵，涪江由北向南穿过城区。河谷连接川中各地，纺织与食品加工也成为这座沿江城市的地方产业。"
 PWC_CITY_PHOTO_235_TT: "§H湖州§!\n湖州位于太湖南岸，东、西苕溪在城区附近汇流入湖。水网与桑蚕养殖相伴，湖丝贸易曾使这座江南古城远近闻名。"
 PWC_CITY_PHOTO_236_TT: "§H拉萨§!\n拉萨是国家历史文化名城，全国性综合交通枢纽城市，是具有雪域高原特色的国际旅游目的地。拉萨以风光秀丽、历史悠久、风俗民情独特、宗教色彩浓厚而闻名于世。全年日照时间在3000小时以上，素有“日光城”的美誉。"
 PWC_CITY_PHOTO_237_TT: "§H嘉兴§!\n嘉兴地处杭嘉湖平原，京杭运河与密布的河港穿过水乡。古称秀州，南湖和运河沿岸遗存见证江南商贸与近代历史。"
 PWC_CITY_PHOTO_238_TT: "§H重庆§!\n重庆是中国重要的中心城市，国家历史文化名城和国际性综合交通枢纽城市，是全国先进制造业基地、西部科技创新中心和对外开放门户、长江上游航运中心。重庆市是巴渝文化发祥地，有三千余年建城史。"
 PWC_CITY_PHOTO_239_TT: "§H雅安§!\n雅安位于四川盆地西缘，青衣江横穿多雨的山间谷地。这里曾是西康省会，也是通向川西高原的门户，周边山林栖息着大熊猫。"
 PWC_CITY_PHOTO_240_TT: "§H恩施§!\n恩施位于鄂西南武陵山区，清江切出深谷，土家族与苗族村寨散布山间。多民族文化与险峻河谷共同形成有别于江汉平原的风貌。"
 PWC_CITY_PHOTO_241_TT: "§H广安§!\n广安位于四川盆地东部丘陵，华蓥山纵贯市境，渠江与嘉陵江滋养河谷。这里是邓小平的故乡，山地农业与近代历史相互交织。"
 PWC_CITY_PHOTO_242_TT: "§H池州§!\n池州位于长江南岸与皖南山区之间，秋浦河从山中流向大江。九华山的佛教传统与沿江湖泊、山地景观共同塑造了地方风貌。"
 PWC_CITY_PHOTO_243_TT: "§H资阳§!\n资阳位于四川盆地中部丘陵，沱江纵贯城区。河谷农田与周边丘陵支撑粮食、花生及养猪业，也使这里成为成都与重庆之间的过渡地带。"
 PWC_CITY_PHOTO_244_TT: "§H荆州§!\n荆州位于江汉平原腹地，长江蜿蜒穿过众多湖泊与河汊。古江陵城墙承载楚地历史，水网则长期支撑农业与航运。"
 PWC_CITY_PHOTO_245_TT: "§H林芝§!\n林芝位于雅鲁藏布江中下游，高山深谷与相对湿润的河谷并存。藏族、门巴族等文化与森林、雪山景观交织，呈现藏东南的独特风貌。"
 PWC_CITY_PHOTO_246_TT: "§H武汉§!\n武汉是中国中部地区的中心城市，国家历史文化名城，国际性综合交通枢纽城市，中部经济中心、科技创新中心、商贸物流中心、对外交往中心以及长江中游航运中心。武汉是楚文化的重要发祥地，春秋战国以来一直是中国南方的军事和商业重镇。武汉素有“九省通衢”之称，是中国内陆最大的水陆空交通枢纽，其高铁网辐射大半个中国，可直航全球五大洲。"
 PWC_CITY_PHOTO_247_TT: "§H潜江§!\n潜江地处江汉平原腹地，汉水沿北缘流过，平坦土地上河渠纵横。江汉油田的开发与农场农业共同塑造了这座水网城市的近代面貌。"
 PWC_CITY_PHOTO_248_TT: "§H杭州§!\n杭州是东部地区重要的中心城市，国家历史文化名城，国际性综合交通枢纽城市，全国数字经济创新中心和区域性科技创新高地、先进制造业基地、东部现代服务业中心、国际旅游目的地。因风景秀丽，素有“人间天堂”的美誉，以西湖文化、钱塘江文化、运河文化为代表。"
 PWC_CITY_PHOTO_249_TT: "§H黄山§!\n黄山市位于皖南新安江上游，原为徽州地区。黄山奇峰与徽派村落、建筑传统相映，使山地景观与徽州文化紧密相连。"
 PWC_CITY_PHOTO_250_TT: "§H仙桃§!\n仙桃位于汉水与东荆河之间的江汉平原，低平土地上湖泊和河渠密布。古称沔阳，水网农业与渔业延续了水乡生活。"
 PWC_CITY_PHOTO_251_TT: "§H天门§!\n天门位于江汉平原中部，古称竟陵，河湖水网连接汉水流域。茶学家陆羽出生于此，使这座平原城市与中国茶文化结下深厚渊源。"
 PWC_CITY_PHOTO_253_TT: "§H眉山§!\n眉山位于成都平原南缘，岷江纵贯市境，丘陵与河谷相间。北宋苏洵、苏轼、苏辙父子三人出自这里，三苏祠延续其文学记忆。"
 PWC_CITY_PHOTO_254_TT: "§H鄂州§!\n鄂州位于长江南岸，梁子湖等湖泊散布丘陵和平原之间。古铜镜制作留下工艺传统，武昌鱼也使这片滨湖水域广为人知。"
 PWC_CITY_PHOTO_255_TT: "§H宁波§!\n宁波面向杭州湾与东海，港口航运和经商传统延续已久。作为海上丝绸之路的重要门户，近代通商口岸和临港产业又推动城市发展。"
 PWC_CITY_PHOTO_256_TT: "§H舟山§!\n舟山由东海中的群岛组成，位于长江口南侧与杭州湾外缘。丰富渔场和深水港口支撑海洋产业，岛屿间的航道始终是地方命脉。"
 PWC_CITY_PHOTO_257_TT: "§H黄石§!\n黄石沿长江南岸展开，大冶湖等湖泊散布幕阜山北缘。矿产开发带动冶金与原材料工业，留下鲜明的沿江工业景观。"
 PWC_CITY_PHOTO_258_TT: "§H绍兴§!\n绍兴位于杭州湾南岸的水网平原，古称会稽、越州，是越文化的重要中心。黄酒酿造与纺织业延续了江南手工业传统。"
 PWC_CITY_PHOTO_259_TT: "§H咸宁§!\n咸宁位于长江中游南岸，丘陵与湖区平原相接。温泉、桂花和砖茶是当地特色，山地农产与武汉周边的交通联系共同塑造城市。"
 PWC_CITY_PHOTO_260_TT: "§H常德§!\n常德位于湖南北部、洞庭湖西侧，沅江穿城而过，是湘西北重要的交通和商贸中心。"
 PWC_CITY_PHOTO_261_TT: "§H内江§!\n内江位于四川盆地中部丘陵，沱江穿城南流。当地长期种植甘蔗并发展制糖业，甜城之名留下这段产业与饮食记忆。"
 PWC_CITY_PHOTO_262_TT: "§H景德镇§!\n景德镇坐落于昌江河畔，古称昌南，明清时已是著名瓷器生产中心。窑业和陶瓷贸易使瓷都之名远播，近代又发展出航空制造业。"
 PWC_CITY_PHOTO_263_TT: "§H乐山§!\n乐山位于岷江、大渡河和青衣江交汇处，江岸石壁上凿有乐山大佛。附近峨眉山的佛教文化与三江山水共同构成城市特色。"
 PWC_CITY_PHOTO_264_TT: "§H张家界§!\n张家界位于武陵山腹地，砂岩峰林、峡谷与岩溶洞穴构成奇特地貌。武陵源的峰林景观列入世界自然遗产，山地也是土家族生活之地。"
 PWC_CITY_PHOTO_265_TT: "§H岳阳§!\n岳阳位于洞庭湖东岸，湘江与长江水系在此相接。岳阳楼俯瞰湖面，因历代诗文而闻名，港埠历史也与江湖航运紧密相连。"
 PWC_CITY_PHOTO_266_TT: "§H九江§!\n九江扼长江与鄱阳湖相接的水口，庐山耸立在城南。古称江州、浔阳，湖江航运与山地胜景共同塑造这座江西北部门户。"
 PWC_CITY_PHOTO_267_TT: "§H山南§!\n山南位于雅鲁藏布江中下游河谷，冈底斯山脉以南的高原孕育早期吐蕃历史。乃东一带的古寺与遗址保留了西藏文明形成时期的记忆。"
 PWC_CITY_PHOTO_268_TT: "§H金华§!\n金华位于浙中金衢盆地，东阳江与武义江在城边汇成金华江。铁路交通与周边商贸相连，古婺州的历史也延续于地方文化。"
 PWC_CITY_PHOTO_269_TT: "§H上饶§!\n上饶位于赣皖浙闽交界山地，信江与饶河向西流入鄱阳湖。德兴铜矿及光学、光伏制造，使山地资源与现代工业相连。"
 PWC_CITY_PHOTO_270_TT: "§H自贡§!\n自贡位于四川盆地南部丘陵，盐井开采与制盐业延续千年。恐龙化石和灯会又为这座盐都增添了鲜明的自然与民俗记忆。"
 PWC_CITY_PHOTO_271_TT: "§H湘西§!\n湘西位于武陵山区，酉水、武水穿过山间盆地与峡谷。土家族和苗族聚落保留多样建筑与节俗，使山水和民族文化密不可分。"
 PWC_CITY_PHOTO_272_TT: "§H益阳§!\n益阳地处雪峰山向洞庭湖平原过渡的地带，资水横贯市境注入湖区。西部山地与东部水网交接，形成兼具丘陵农业和湖区航运的地方风貌。"
 PWC_CITY_PHOTO_273_TT: "§H衢州§!\n衢州坐落在金衢盆地西端，常山港、江山港等河流在附近汇集。浙皖闽赣之间的山口使其久为通道，江郎山则以丹霞地貌著称。"
 PWC_CITY_PHOTO_275_TT: "§H泸州§!\n泸州位于长江与沱江交汇处，赤水河流经南部山地。沿江航运与悠久酿酒传统相伴，泸州老窖等白酒使酒城之名流传。"
 PWC_CITY_PHOTO_276_TT: "§H台州§!\n台州位于浙江东部山海之间，天台山与东海沿岸塑造了多样地貌。当地民营制造业发达，医药、汽车零部件和模具产业具有鲜明特色。"
 PWC_CITY_PHOTO_277_TT: "§H凉山§!\n凉山地处四川西南部的横断山地，金沙江深切群山，形成复杂的峡谷与高原。这里是彝族文化的重要地区，州府西昌也是攀西地区的中心城市之一。"
 PWC_CITY_PHOTO_278_TT: "§H宜宾§!\n宜宾坐落于岷江与金沙江汇成川江之处，因而有“万里长江第一城”之称。这里兼有蜀南竹海的山水景观与悠久的酿酒传统。"
 PWC_CITY_PHOTO_279_TT: "§H迪庆§!\n迪庆位于云南西北部的横断山地，雪山、深谷和澜沧江流域交错。藏族文化在此延续，香格里拉与梅里雪山是当地最具代表性的地理标识。"
 PWC_CITY_PHOTO_280_TT: "§H遵义§!\n遵义位于贵州北部，是黔北的交通与工业中心。红色历史与山地风貌构成了城市的鲜明特色。"
 PWC_CITY_PHOTO_281_TT: "§H南昌§!\n南昌是长江中游地区重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市和区域先进制造业基地。有“粤户闽庭，吴头楚尾”、“襟三江而带五湖”之称，“控蛮荆而引瓯越”之地"
 PWC_CITY_PHOTO_282_TT: "§H宜春§!\n宜春地处赣西丘陵与鄱阳湖平原的过渡地带，袁河穿过境内。明月山温泉和宜春古称“袁州”的历史，共同构成这座城市的地方特色。"
 PWC_CITY_PHOTO_283_TT: "§H铜仁§!\n铜仁位于黔湘渝交界的武陵山区，乌江及其支流切出深谷。梵净山以独特的山体和丰富的生物多样性闻名，是当地重要的自然地标。"
 PWC_CITY_PHOTO_284_TT: "§H怀化§!\n怀化坐落在湘西群山与沅水水系之间，历来是连接湖南、贵州和广西的交通要道。洪江古商城留下了内河商贸兴盛的历史痕迹。"
 PWC_CITY_PHOTO_285_TT: "§H丽水§!\n丽水位于浙江西南部山地，瓯江上游贯穿丘陵与河谷。古称处州的这片区域保存着龙泉青瓷、宝剑等传统手工艺。"
 PWC_CITY_PHOTO_286_TT: "§H昭通§!\n昭通处于滇川黔交会的乌蒙山区，金沙江峡谷与高原山地相接。它曾是南方丝绸之路上的通道，天麻等山地物产颇具地方特色。"
 PWC_CITY_PHOTO_287_TT: "§H长沙§!\n长沙是长江中游地区中心城市，国家历史文化名城，全国性综合交通枢纽城市，中部先进制造业基地、中部现代服务业中心、区域性科技创新高地。"
 PWC_CITY_PHOTO_288_TT: "§H鹰潭§!\n鹰潭位于江西东北部的信江流域，南面接武夷山余脉。龙虎山的丹霞地貌与道教历史，使这座赣东北城市具有鲜明的山水文化气息。"
 PWC_CITY_PHOTO_289_TT: "§H温州§!\n温州依瓯江入海口而建，海岛、河口与浙南山地相互映衬。悠久的海贸传统和活跃的民营经济，塑造了这座城市独特的商业文化。"
 PWC_CITY_PHOTO_292_TT: "§H抚州§!\n抚州古称临川，位于赣东丘陵与河谷之间，是临川文化的发源地。王安石、汤显祖等历史人物，使其在中国文学与思想史上留名。"
 PWC_CITY_PHOTO_293_TT: "§H南平§!\n南平坐落于福建北部的山地与建溪流域，武夷山横亘其西北。茶叶种植和朱子文化沿着山间河谷延续，形成鲜明的闽北风貌。"
 PWC_CITY_PHOTO_295_TT: "§H怒江§!\n怒江沿横断山脉的深谷展开，怒江、澜沧江与高黎贡山塑造了险峻地形。傈僳族等民族文化与山地村寨，是这片边境地区的重要特色。"
 PWC_CITY_PHOTO_296_TT: "§H娄底§!\n娄底位于湘中丘陵与雪峰山东缘，涟水流经境内。冷水江一带的矿冶工业和曾国藩故里双峰，呈现出不同的地方历史面貌。"
 PWC_CITY_PHOTO_298_TT: "§H新余§!\n新余处于江西中西部的山间盆地，袁河横贯市域。这里以钢铁工业闻名，仙女湖的岛屿与湖湾又为工业城市增添了湖光山色。"
 PWC_CITY_PHOTO_299_TT: "§H湘潭§!\n湘潭位于湘江中游，历来是湖南内河航运与商贸的重要节点。当地以湘莲闻名，也是近代湖南重要人物的故乡。"
 PWC_CITY_PHOTO_300_TT: "§H株洲§!\n株洲位于湘江东岸与罗霄山西麓之间，是连接华中和华南的铁路枢纽。轨道交通装备及航空动力产业，构成其制造业特色。"
 PWC_CITY_PHOTO_301_TT: "§H萍乡§!\n萍乡地处赣湘交界，武功山绵延于市境南部。近代煤矿开发推动了城市工业化，如今山地草甸与旧矿业遗迹并存。"
 PWC_CITY_PHOTO_302_TT: "§H吉安§!\n吉安古称庐陵，赣江纵贯境内，西部渐入罗霄山脉。庐陵文化孕育了众多文人，井冈山则承载着近代革命历史。"
 PWC_CITY_PHOTO_303_TT: "§H丽江§!\n丽江位于横断山脉与云贵高原交接处，玉龙雪山俯瞰河谷。纳西族东巴文化与依水而建的丽江古城，构成独特的人文景观。"
 PWC_CITY_PHOTO_304_TT: "§H毕节§!\n毕节坐落于贵州西北部的乌蒙山区，乌江上游穿过高原峡谷。百里杜鹃的花海和织金洞的喀斯特景观，展现了当地多样的山地地貌。"
 PWC_CITY_PHOTO_305_TT: "§H邵阳§!\n邵阳古称宝庆，位于湘中丘陵向南岭过渡的地带。资江贯穿市域，崀山的丹霞地貌与当地悠久的商贸传统相映成趣。"
 PWC_CITY_PHOTO_306_TT: "§H宁德§!\n宁德位于福建东北沿海，三都澳与曲折海岸提供了天然港湾。山海之间分布着太姥山和霞浦滩涂，兼具海洋渔业与山地景观。"
 PWC_CITY_PHOTO_307_TT: "§H黔东南§!\n黔东南位于贵州东南部的清水江、都柳江流域，山谷村寨密布。苗族与侗族的鼓楼、风雨桥及节庆，保留着丰富的地方文化。"
 PWC_CITY_PHOTO_308_TT: "§H衡阳§!\n衡阳位于湘江与蒸水汇流的湘中盆地，是湖南南北交通的重要节点。南岳衡山耸立于市域北部，素有宗教与山水名胜之名。"
 PWC_CITY_PHOTO_309_TT: "§H黔南§!\n黔南地处贵州南部喀斯特山区，峰丛、溶洞与河谷交错。布依族、苗族聚居于此，荔波的森林和水景是当地著名的自然景观。"
 PWC_CITY_PHOTO_310_TT: "§H攀枝花§!\n攀枝花坐落于金沙江河谷，山高谷深而气候温暖。城市因三线建设中的钢铁开发而兴起，钒钛资源与热带水果同为地方特色。"
 PWC_CITY_PHOTO_311_TT: "§H贵阳§!\n贵阳是西南地区重要的中心城市，全国性综合交通枢纽城市，是西部数字经济创新基地、全国生态休闲旅游目的地，西部地区沟通珠三角、长三角的交通通信枢纽和物流集散地，生态旅游休闲度假旅游城市。"
 PWC_CITY_PHOTO_312_TT: "§H赣州§!\n赣州位于江西南部，章江、贡江汇合后始称赣江。这里是客家文化的重要地区，宋代城墙与围屋见证了不同阶段的聚落历史。"
 PWC_CITY_PHOTO_313_TT: "§H三明§!\n三明处于福建西部山地，闽江上游支流贯穿群山。沙县小吃源自当地，泰宁丹霞与永安石林则展现了闽中复杂的地貌。"
 PWC_CITY_PHOTO_314_TT: "§H曲靖§!\n曲靖位于云南东部高原，是滇黔之间的重要通道。珠江源头在市境北部，罗平的喀斯特峰林与油菜花田形成鲜明景观。"
 PWC_CITY_PHOTO_315_TT: "§H永州§!\n永州古称零陵，潇水与湘江在此相汇，山地向南岭延伸。柳宗元笔下的山水与江永女书，丰富了当地独特的文化记忆。"
 PWC_CITY_PHOTO_316_TT: "§H郴州§!\n郴州地处湘粤赣交界的南岭山地，既是湖南通往岭南的门户，也有丰富的矿产资源。东江湖与莽山展现了高山和水库景观。"
 PWC_CITY_PHOTO_317_TT: "§H六盘水§!\n六盘水坐落于贵州西部乌蒙山区，处在长江与珠江流域的分水岭附近。煤炭资源带动了工业发展，山地气候也赋予当地清凉的夏季。"
 PWC_CITY_PHOTO_318_TT: "§H大理§!\n大理依苍山、临洱海而建，是滇西高原上的历史交通与商贸中心。白族村落、三塔和古城延续着南诏、大理国以来的文化脉络。"
 PWC_CITY_PHOTO_319_TT: "§H福州§!\n福州是东南沿海重要的中心城市，国家历史文化名城，全国性综合交通枢纽城市，东南沿海对外开放门户、区域性科技创新高地以及海峡两岸融合发展、交流合作重要承载地。"
 PWC_CITY_PHOTO_320_TT: "§H安顺§!\n安顺位于贵州中西部喀斯特高原，黄果树瀑布群坐落于境内。屯堡村落保存着明代军屯文化，与山地水景共同构成地方特色。"
 PWC_CITY_PHOTO_321_TT: "§H楚雄§!\n楚雄位于云南中部山地，是连接滇中与滇西的走廊。彝族文化在此鲜明可见，禄丰的恐龙化石也记录了远古地质历史。"
 PWC_CITY_PHOTO_323_TT: "§H昆明§!\n昆明是面向南亚东南亚的区域性中心城市，国家历史文化名城，国际性综合交通枢纽城市，面向南亚东南亚和环印度洋地区开放门户、西部先进制造业基地、国际旅游目的地，素以“春城”著称。"
 PWC_CITY_PHOTO_324_TT: "§H桂林§!\n桂林沿漓江展开，石灰岩峰林和河流共同塑造了典型的喀斯特山水。两江四湖与阳朔的田园景观，使其成为中国山水文化的代表之一。"
 PWC_CITY_PHOTO_325_TT: "§H黔西南§!\n黔西南位于贵州西南部的南、北盘江流域，喀斯特峰林密集。布依族与苗族文化交融，万峰林和马岭河峡谷展现了独特的地形。"
 PWC_CITY_PHOTO_326_TT: "§H柳州§!\n柳州位于广西中北部，柳江绕城而过，山地与河谷相连。它是广西重要的工业城市，汽车制造与螺蛳粉都具有鲜明的地方标识。"
 PWC_CITY_PHOTO_327_TT: "§H龙岩§!\n龙岩地处闽西山地，是客家文化的重要地区。永定土楼以独特的夯土建筑闻名，连城冠豸山和汀江流域展现了山地聚落风貌。"
 PWC_CITY_PHOTO_328_TT: "§H泉州§!\n泉州面向台湾海峡，宋元时期曾是繁盛的海上贸易港口。多种宗教遗迹与闽南街巷并存，见证了跨海交流的悠久历史。"
 PWC_CITY_PHOTO_329_TT: "§H保山§!\n保山位于云南西部的高黎贡山与怒山之间，是通往滇西边境的历史通道。腾冲火山、热海和古道遗迹，记录了地质与商旅的双重脉络。"
 PWC_CITY_PHOTO_330_TT: "§H莆田§!\n莆田位于福建中部沿海，木兰溪入海前形成平原与滩涂。湄洲岛的妈祖信俗与莆仙戏，体现了当地深厚的海洋和民间文化。"
 PWC_CITY_PHOTO_331_TT: "§H河池§!\n河池地处广西北部喀斯特山区，河谷与峰丛交错。红水河穿境而过，宜州的刘三姐传说与少数民族歌圩增添了地方文化色彩。"
 PWC_CITY_PHOTO_332_TT: "§H韶关§!\n韶关位于粤湘赣交界，北江水系穿过南岭山地，是广东北上的传统门户。丹霞山的红色砂岩地貌成为当地醒目的自然地标。"
 PWC_CITY_PHOTO_333_TT: "§H德宏§!\n德宏位于云南西部边境，瑞丽江流经热带与亚热带河谷。傣族、景颇族文化和与缅甸相连的口岸贸易，构成独特的边境风貌。"
 PWC_CITY_PHOTO_334_TT: "§H台北§!\n台北被全球最权威的世界城市研究机构之一GaWC评为世界一线城市。以台北为中心与周边市镇所联结而成台北都会区，是台湾人口最多的都会区。其作为台北都会区的发展核心，中国台湾地区规模最大的公司、企业、银行、商店均总部设于此地。"
 PWC_CITY_PHOTO_335_TT: "§H清远§!\n清远地处广东北部，北江纵贯山地与河谷。英德茶区、连州地下河和瑶族聚居的山乡，使其兼具岭南水道与南岭风貌。"
 PWC_CITY_PHOTO_336_TT: "§H漳州§!\n漳州位于福建南部的九龙江流域，平原面向台湾海峡。沿海渔业、闽南文化与南靖土楼，呈现出山海交织的地方景观。"
 PWC_CITY_PHOTO_337_TT: "§H贺州§!\n贺州坐落于桂湘粤交界的山地，河流穿过喀斯特丘陵。黄姚古镇保留了传统街巷，瑶族村落则体现出多样的地方文化。"
 PWC_CITY_PHOTO_338_TT: "§H新竹§!\n新竹位于台湾西北海岸，九降风为当地带来鲜明的季风气候。古城街区与科学园区并存，半导体产业塑造了现代城市面貌。"
 PWC_CITY_PHOTO_339_TT: "§H百色§!\n百色位于广西西部的右江流域，山地通向云南与越南边境。右江河谷曾是重要的交通通道，百色起义也留下了近代历史印记。"
 PWC_CITY_PHOTO_340_TT: "§H临沧§!\n临沧位于云南西南部，澜沧江与山脉切出深谷，西南面向缅甸。双江茶区和佤族、傣族等民族文化，展现了边地山水与生活传统。"
 PWC_CITY_PHOTO_341_TT: "§H玉溪§!\n玉溪处于云南中部高原，抚仙湖以清澈深邃的湖水著称。哀牢山延伸至市域西部，烟草种植与加工也是当地产业的重要部分。"
 PWC_CITY_PHOTO_342_TT: "§H梅州§!\n梅州位于粤闽赣交界的丘陵山地，被视为客家文化的重要中心。围龙屋、客家话和迁徙历史，构成这片山区鲜明的人文脉络。"
 PWC_CITY_PHOTO_343_TT: "§H厦门§!\n厦门位于福建东南沿海，厦门岛与大陆隔水相望，并与金门隔海相邻。鼓浪屿的近代建筑和经济特区的发展，呈现海港城市的不同年代。"
 PWC_CITY_PHOTO_344_TT: "§H普洱§!\n普洱地处云南南部山地，澜沧江穿过茶山与河谷。普洱茶的种植和贸易历史深厚，热带森林与多民族文化共同塑造了地方风貌。"
 PWC_CITY_PHOTO_345_TT: "§H河源§!\n河源位于广东东北部的东江上游，群山与河谷相接。万绿湖是东江流域的重要水源地，客家聚落也保留着山区生活传统。"
 PWC_CITY_PHOTO_346_TT: "§H红河§!\n红河州横跨云南南部的高原与红河河谷，地形落差显著。哈尼梯田依山而筑，蒙自和个旧又留下近代铁路与矿业的历史痕迹。"
 PWC_CITY_PHOTO_347_TT: "§H文山§!\n文山位于云南东南部，喀斯特山地延伸至越南边境。壮族、苗族文化与普者黑的湖泊峰林相映，三七种植也是当地特色产业。"
 PWC_CITY_PHOTO_348_TT: "§H台中§!\n台中位于台湾中部，西临台湾海峡，东接中央山脉。旧城街区、港口和精密机械产业并存，展现了平原城市与山海腹地的联系。"
 PWC_CITY_PHOTO_349_TT: "§H来宾§!\n来宾位于广西中部的红水河流域，山地与盆地交错。这里是壮族文化的重要地区，河流沿线的甘蔗种植与制糖业颇具地方特色。"
 PWC_CITY_PHOTO_350_TT: "§H梧州§!\n梧州位于浔江与桂江汇合形成西江之处，历来是广西通往广东的重要内河港口。骑楼街与六堡茶贸易，保存了岭南商埠的历史气息。"
 PWC_CITY_PHOTO_351_TT: "§H肇庆§!\n肇庆沿西江展开，背靠粤西山地，是珠江三角洲西缘的门户。七星岩的峰林湖泊与鼎湖山的森林，构成兼具山水与历史的城市景观。"
 PWC_CITY_PHOTO_352_TT: "§H花莲§!\n花莲位于台湾东岸，中央山脉与海岸山脉夹出狭长的纵谷。太鲁阁峡谷和面向太平洋的海岸，使其以壮阔的山海地貌闻名。"
 PWC_CITY_PHOTO_353_TT: "§H潮州§!\n潮州位于广东东部的韩江下游，古城长期是潮汕文化中心。广济桥、牌坊街与潮州工夫茶，体现了当地深厚的工艺和生活传统。"
 PWC_CITY_PHOTO_354_TT: "§H南宁§!\n南宁是华南地区重要的中心城市，全国性综合交通枢纽城市，面向东盟开放门户。古称邕州，别称绿城。素有“中国绿城”“天下民歌眷恋的地方”等美誉。"
 PWC_CITY_PHOTO_355_TT: "§H惠州§!\n惠州位于东江流域与南海沿岸之间，既有罗浮山也有大亚湾。惠州西湖承载着古代文人的记忆，沿海工业则塑造了近代城市发展。"
 PWC_CITY_PHOTO_356_TT: "§H贵港§!\n贵港坐落于郁江中游，是广西内河航运的重要节点。城中荷塘留下“荷城”之名，平原农业与港口物流共同形成地方特色。"
 PWC_CITY_PHOTO_357_TT: "§H广州§!\n广州是首批国家历史文化名城，海上丝绸之路的起点之一，被誉为“千年商都”；自古就是中外文化交融之地，广府文化发祥地之一。主要语言为粤语、普通话。"
 PWC_CITY_PHOTO_358_TT: "§H台南§!\n台南位于台湾西南部的嘉南平原，古迹集中于旧城街区。安平港、赤崁楼与传统庙宇，记录了这座城市多层次的海贸与殖民历史。"
 PWC_CITY_PHOTO_359_TT: "§H揭阳§!\n揭阳位于粤东榕江流域，河网连通沿海平原与丘陵。古城、潮汕方言和玉器加工，反映了当地商贸与工艺传统。"
 PWC_CITY_PHOTO_360_TT: "§H汕头§!\n汕头位于韩江三角洲入海处，是潮汕地区的重要海港。开埠后形成的骑楼街区和侨乡联系，记录了近代海外贸易与人口迁徙。"
 PWC_CITY_PHOTO_361_TT: "§H高雄§!\n高雄坐落于台湾西南海岸，天然港湾带动了航运与工业发展。寿山、爱河与港区相连，呈现出海港城市的山水与工业景观。"
 PWC_CITY_PHOTO_362_TT: "§H台东§!\n台东位于台湾东南部，中央山脉与太平洋之间形成狭长的海岸和纵谷。原住民族文化、稻田与离岸岛屿，构成鲜明的东部风貌。"
 PWC_CITY_PHOTO_363_TT: "§H佛山§!\n佛山位于珠江三角洲腹地，水网孕育了陶瓷、金属加工和传统商贸。石湾陶艺与岭南武术传承，使这座制造业城市保有深厚的地方文化。"
 PWC_CITY_PHOTO_364_TT: "§H汕尾§!\n汕尾位于广东东南沿海，海陆丰平原连接莲花山地与南海。渔港、红海湾与海陆丰民俗，构成其独特的滨海文化。"
 PWC_CITY_PHOTO_366_TT: "§H崇左§!\n崇左位于广西西南边境，左江穿过喀斯特山地并通向越南。花山岩画记录了古代骆越文化，口岸贸易延续着边境往来。"
 PWC_CITY_PHOTO_367_TT: "§H云浮§!\n云浮位于广东西部的丘陵地带，西江支流穿过山谷。云石加工和新兴的石材产业闻名，六祖文化也在新兴县留下深远影响。"
 PWC_CITY_PHOTO_368_TT: "§H玉林§!\n玉林位于广西东南部，丘陵与河谷连通粤西。当地商贸传统悠久，容县真武阁与侨乡文化保留了岭南地区的历史面貌。"
 PWC_CITY_PHOTO_369_TT: "§H东莞§!\n东莞地处珠江三角洲东岸，河网与城镇密布。虎门销烟留下近代历史印记，制造业集群则推动了这座城市的现代转型。"
 PWC_CITY_PHOTO_370_TT: "§H江门§!\n江门位于珠江三角洲西岸，西江支流通向南海。五邑侨乡与开平碉楼记录了海外迁徙和建筑交流，形成独特的地方景观。"
 PWC_CITY_PHOTO_371_TT: "§H深圳§!\n深圳是中国改革开放的窗口和新兴移民城市，创造了举世瞩目的“深圳速度”，被誉为“中国硅谷”；还是粤港澳大湾区四大中心城市之一、国家物流枢纽、国际科技产业创新中心、中国三大全国性金融中心之一。"
 PWC_CITY_PHOTO_372_TT: "§H中山§!\n中山位于珠江口西岸，河道与平原连接周边港口。城市旧称香山，以孙中山故乡而得今名，侨乡文化与制造业同样鲜明。"
 PWC_CITY_PHOTO_373_TT: "§H钦州§!\n钦州面向北部湾，钦江入海形成港湾与滩涂。历史上的海贸与今日的港口产业相连，坭兴陶则是延续至今的地方工艺。"
 PWC_CITY_PHOTO_374_TT: "§H茂名§!\n茂名位于粤西沿海，山地向南延伸至海湾。石油化工曾深刻塑造城市，荔枝种植与滨海渔业也体现了当地多样的经济面貌。"
 PWC_CITY_PHOTO_375_TT: "§H阳江§!\n阳江濒临南海，漠阳江流过沿海平原。海陵岛的海滩与渔港相伴，阳江刀剪则传承了当地的金属加工技艺。"
 PWC_CITY_PHOTO_376_TT: "§H西双版纳§!\n西双版纳位于云南最南端，澜沧江贯穿热带河谷。傣族寺院、泼水节与热带雨林，呈现出鲜明的边境文化和生态景观。"
 PWC_CITY_PHOTO_377_TT: "§H香港§!\n香港是一座高度繁荣的自由港和国际大都市，与纽约、伦敦并称为“纽伦港”，是全球第三大金融中心，重要的国际金融、贸易、航运中心和国际创新科技中心，也是全球最自由经济体和最具竞争力城市之一，被GaWC评为世界一线城市。"
 PWC_CITY_PHOTO_379_TT: "§H珠海§!\n珠海位于珠江口西岸，众多岛屿散布海面，与澳门相邻。海岸城市格局和经济特区的发展，使其成为大湾区的重要门户。"
 PWC_CITY_PHOTO_380_TT: "§H防城港§!\n防城港位于广西南部北部湾沿岸，港湾靠近越南边境。海港贸易、京族聚居的沿海村落与山海相接的地形，形成独特的边境风貌。"
 PWC_CITY_PHOTO_381_TT: "§H澳门§!\n澳门有400多年的中西文化交流历史，形成了“以中为主，中葡结合”的多元化色彩的共融文化，并存在有不少中西合璧的景点和文物古迹。同时，澳门为世界上人口密度最高的地区，每平方公里人口超过2万"
 PWC_CITY_PHOTO_383_TT: "§H北海§!\n北海面向北部湾，合浦一带曾是古代海上丝绸之路的重要港口。近代骑楼街区、银滩与珍珠养殖，延续了滨海商贸传统。"
 PWC_CITY_PHOTO_384_TT: "§H湛江§!\n湛江位于雷州半岛，三面临海，港湾连接南海航道。广州湾的近代历史、火山地貌与海洋渔业，共同塑造了这座港口城市。"
 PWC_CITY_PHOTO_385_TT: "§H儋州§!\n儋州位于海南岛西北部，海岸与低山丘陵相连。东坡书院见证苏轼贬居海南的历史，洋浦港则承载着现代航运与工业发展。"
 PWC_CITY_PHOTO_387_TT: "§H海南§!\n海南岛隔琼州海峡与雷州半岛相望，岛心山地向四周海岸伸展。热带雨林、黎族文化与滨海聚落，构成这座南海大岛的独特面貌。"
 PWC_CITY_PHOTO_388_TT: "§H海口§!\n海口地处热带，是一座富有海滨自然旖旎风光的南方滨海城市。海口是国家历史文化名城，国际性综合交通枢纽城市，区域性现代服务业高地、全国滨海旅游目的地。"
 PWC_CITY_PHOTO_391_TT: "§H三亚§!\n三亚位于海南岛南端，山脉与南海之间分布海湾和沙滩。崖州的历史遗存与热带滨海旅游，呈现了这座城市的两重风貌。"
 PWC_CITY_PHOTO_434_TT: "§H墨拉萨丁§!\n墨拉萨丁位于不丹东部山地，由墨拉和萨丁两地组成。高海拔山谷与分散村落塑造了这一边远地区的生活环境。"
 PWC_CITY_PHOTO_435_TT: "§H藏南§!\n藏南是中方对麦克马洪线以南一处中印争议地区的称呼，位于喜马拉雅山南麓。该地区主要由印度作为阿鲁纳恰尔邦的一部分实际管辖。"
 PWC_CITY_PHOTO_505_TT: "§H宜兰§!\n宜兰位于台湾东北部，山脉围合兰阳平原，河流最终注入太平洋。温泉、稻田与沿海渔港，构成此地兼具山海的生活景观。"
 PWC_CITY_PHOTO_506_TT: "§H新北§!\n新北环绕台北，辖域从淡水河口延伸至东北角海岸。九份山城、淡水港史与密集的都市聚落，展现了多样的地形和城市层次。"
 PWC_CITY_PHOTO_507_TT: "§H桃园§!\n桃园位于台湾西北部，台地与埤塘曾塑造独特的灌溉景观。国际机场及周边工业区，使这里成为连接台湾与外界的重要门户。"
 PWC_CITY_PHOTO_508_TT: "§H苗栗§!\n苗栗西临台湾海峡，东倚雪山山脉，河谷穿过丘陵。客家文化在当地鲜明可见，三义木雕和山线铁路留下工艺与交通记忆。"
 PWC_CITY_PHOTO_509_TT: "§H南投§!\n南投是台湾本岛唯一不临海的县，中央山脉与丘陵围出多样的盆地。日月潭、茶区及原住民族聚落，展现了岛屿腹地的山地风貌。"
 PWC_CITY_PHOTO_510_TT: "§H彰化§!\n彰化位于台湾中部西岸，八卦山与彰化平原相接。鹿港古镇保留了昔日海贸的街巷和庙宇，平原农业也延续着地方经济传统。"
 PWC_CITY_PHOTO_511_TT: "§H嘉义§!\n嘉义位于嘉南平原，东侧丘陵通往阿里山。日治时期的林业铁路以这里为起点，旧城街区仍保留着木材贸易的历史痕迹。"
 PWC_CITY_PHOTO_512_TT: "§H云林§!\n云林位于台湾中西部的浊水溪以南，平原向台湾海峡展开。农业、渔业与北港朝天宫的妈祖信俗，共同塑造了地方生活。"
 PWC_CITY_PHOTO_513_TT: "§H屏东§!\n屏东位于台湾南端，平原、中央山脉与热带海岸交汇。恒春半岛的珊瑚礁海岸与原住民族聚落，展现了多样的自然和文化景观。"
 PWC_CITY_PHOTO_524_TT: "§H澎湖§!\n澎湖是台湾海峡中的群岛，玄武岩海岸与季风塑造了岛屿地貌。马公老街、石沪渔法和海上交通，保留了悠久的海岛生活传统。"
 PWC_CITY_PHOTO_525_TT: "§H金门§!\n金门群岛位于厦门湾口，与厦门隔海相望。闽南聚落、洋楼与冷战时期的军事遗迹并存，记录了海峡两岸交往和对峙的历史。"
 PWC_CITY_PHOTO_526_TT: "§H连江§!\n连江在此指马祖列岛，散布于福建沿海外海，由台湾方面实际管辖。花岗岩岛屿、闽东石屋与战地遗迹，形成鲜明的海岛景观。"

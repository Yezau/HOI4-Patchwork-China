l_simp_chinese:
 LOADING_TIP_0:0 "天下大势，分久必合，合久必分。\n——罗贯中"
 LOADING_TIP_1:0 "政治是不流血的战争，战争是流血的政治。\n——毛泽东"
 LOADING_TIP_2:0 "存人失地，人地皆存；存地失人，人地皆失。\n——毛泽东"
 LOADING_TIP_3:0 "将军百战死，壮士十年归。\n——《木兰辞》"
 LOADING_TIP_4:0 "敌进我退，敌退我追，敌驻我扰，敌疲我打。\n——毛泽东"
 LOADING_TIP_5:0 "黑云压城城欲摧，甲光向日金鳞开。\n——李贺"
 LOADING_TIP_6:0 "夜阑卧听风吹雨，铁马冰河入梦来。\n——陆游"
 LOADING_TIP_7:0 "须知没有平时很好的练兵，战时就不能很好的用兵，犹之手中没有积蓄的钱，就无钱可用。\n——刘伯承"
 LOADING_TIP_8:0 "必须巩固海防，只有巩固海防才能巩固国防，没有海防就没有国防。\n——粟裕"
 LOADING_TIP_9:0 "拼将十万头颅血，须把乾坤力挽回。\n——秋瑾"
 LOADING_TIP_10:0 "僵卧孤村不自哀，尚思为国戍轮台。\n——陆游"
 LOADING_TIP_11:0 "四海翻腾云水怒，五洲震荡风雷激。\n——毛泽东"
 LOADING_TIP_12:0 "钟山风雨起苍黄，百万雄师过大江。\n——毛泽东"
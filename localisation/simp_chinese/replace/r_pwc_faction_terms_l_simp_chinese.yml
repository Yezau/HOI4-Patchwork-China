 spy_master_goal_desc: "我们应指定一位成员势力专精于间谍与情报工作，由其负责统筹并指导阵营的各项非行动。"
 strength_in_unity_goal_desc: "让我们这片土地上的势力紧密团结一致。唯有立一个强大的阵营，我们将拥有保持独立与中立的最佳机会。"
 super_heavy_railway_gun_equipment_1_desc: "一种威力和精度都无与伦比的巨型武器，将成为我方对军事优势不懈追求的见证。"
 super_heavy_railway_gun_equipment_desc: "一种威力和精度都无与伦比的巨型武器，将成为我方对军事优势不懈追求的见证。"
 suppress_regional_democracy_goal_desc: "所谓的民主势力是对我们理念的最大威胁。我们需要确保它们在[ROOT.GetCountryContinent]中只占少数。"
 suppress_regional_fascism_goal_desc: "法西斯主义如燎原之火肆虐全球，其蔓延之势令人忧心。每多一方势力沦陷于其魔爪之下，世界局势便愈发岌岌可危。"
 the_arteries_of_trade_goal_desc: "为保障成员势力的生存与发展，主要航运线路必须牢牢掌控在我方手中。"

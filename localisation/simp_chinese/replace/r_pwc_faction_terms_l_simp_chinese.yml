 upgrade_airforce_department_desc: "§L空军情报部将成为我方情报局的一个有益分支，负责渗透敌方空军并搜集有关敌军飞机动向的情报。§!"
 upgrade_anti_partisan_desc: "§L政治宣传是保证我方国民忠诚的有力工具，但在敌方领土制造顺从氛围相比之下则困难重重。通过训练特工渗透敌方抵抗运动，我们能展开高效的抓捕并终止他们的破坏活动。到那时，敌方游击队恢复旧政权的幻想必将被一手打破。§!"
 upgrade_army_department_desc: "§L敌人的军事情报有无可比拟的重要性，因此建立军事情报部门是必要的。我方特工将受训渗透敌方军队，扮演上至将军下到士兵的角色并向我们回报他们在敌后刺探的机密。§!"
 upgrade_crypto_strength_desc: "§L密码与暗号目前为止仍是建立和保护我方海外间谍网最高效的手段。政府通讯指挥中心需要致力于创造复杂的新型加密手段以使敌方解密工作无从下手。§!"
 upgrade_diplo_training_desc: "§L训练我方特工“公关”一批外部势力投资者与外交人员可能使他们感受我方恩泽并让他们背离我方的敌人。§!"
 upgrade_economy_civilian_desc: "§L我方特工将受训伪装成平民以在敌方领土的工业及民用领域活动，搜集工业与经济情报。§!"
 upgrade_passive_defense_desc: "§L国安人员有成为我方情报系统重要旗子的潜能。通过给国安人员及卫戍部队进行谍报与反间谍训练，我们将保证本土长城永驻，即使我局专家们有其他任务缠身时也如此。§!"
 upgrade_plastic_explosives_desc: "§L塑胶炸药泥一般的材质让其成为破坏敌方生产的理想道具，我们用该物质武装其他势力游击队也顺理成章。炸弹能轻易以避人耳目的方式放置于敌方工厂的脆弱环节，而该物质的可塑性则让它成为公开政治刺杀的完美选择……§!"
 upgrade_psycho_warfare_desc: "§L宣传是在势力内确保我们意识形态的有效工具，但没有任何工具比得上散播敌方政权可能给势力带来的恐惧更有效。通过把我们的特工与外部势力的反意识形态运动相结合，我们必将更有效地在国际上传播我们的意识形态……§!"

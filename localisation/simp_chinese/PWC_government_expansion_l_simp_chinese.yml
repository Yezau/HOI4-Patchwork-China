 pwc_advisor_superiority_training: "空军训练官"
 pwc_advisor_superiority_training_desc: "她坚持循序渐进的飞行训练，帮助部队积累可复用的经验。\n\n负责制空作战，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"

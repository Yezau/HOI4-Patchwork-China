 pwc_cand_executive_coordination_industrial: "实业推动者"
 pwc_cand_executive_coordination_industrial_desc: "她从工厂现场寻找流程瓶颈，主张先理顺生产再扩大投入。\n\n行政首席。使对应施政计划费用减少10政治点：工业整顿计划、生产换装计划。任命费用100政治点。"
 pwc_cand_executive_coordination_integration: "区域协调官"
 pwc_cand_executive_coordination_integration_desc: "她擅长统一跨地区的办事规则，减少新旧组织之间的磨合成本。\n\n行政首席。使对应施政计划费用减少10政治点：行政整合计划、生产换装计划。任命费用100政治点。"
 pwc_cand_general_staff_defense: "防御协调官"
 pwc_cand_general_staff_defense_desc: "她重视防御准备与轮换秩序，宁愿慢一点，也要先把部署组织好。\n\n负责总参谋长，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_cand_general_staff_joint: "联合作战统筹官"
 pwc_cand_general_staff_joint_desc: "她用统一的联络规则协调各军种，减少联合行动中的等待。\n\n负责总参谋长，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_cand_general_staff_mobility: "机动作战参谋"
 pwc_cand_general_staff_mobility_desc: "她熟悉部队转场的节奏，倾向以机动与补给安排争取主动。\n\n负责总参谋长，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_cand_general_staff_planning: "战役筹划官"
 pwc_cand_general_staff_planning_desc: "她把战役准备细分到各阶段，以更充分的计划换取执行效率。\n\n负责总参谋长，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_cand_general_staff_refit: "装备整编参谋"
 pwc_cand_general_staff_refit_desc: "她长期处理换装协调，善于安排旧装备退出与新装备接替。\n\n负责总参谋长，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_cand_government_oversight_administration: "行政督导官"
 pwc_cand_government_oversight_administration_desc: "她擅长梳理审批责任，让行政整合与工业整顿有清晰的执行边界。\n\n监察总长。在批准对应施政计划时消除附带代价：行政整合计划、工业整顿计划。任命费用100政治点。"
 pwc_cand_government_oversight_civic: "民生监察官"
 pwc_cand_government_oversight_civic_desc: "她坚持走访服务对象，以实际生活状况核对部门的施政报告。\n\n监察总长。在批准对应施政计划时消除附带代价：民生保障计划、行政整合计划。任命费用100政治点。"
 pwc_cand_government_oversight_industry: "工业审计官"
 pwc_cand_government_oversight_industry_desc: "她沿着账目追踪生产问题，要求每一次整顿都有可核查的依据。\n\n监察总长。在批准对应施政计划时消除附带代价：工业整顿计划、生产换装计划。任命费用100政治点。"
 pwc_cand_government_oversight_logistics: "运输稽核官"
 pwc_cand_government_oversight_logistics_desc: "她习惯核对仓库与车站的两套记录，及时发现运输链条中的遗漏。\n\n监察总长。在批准对应施政计划时消除附带代价：交通整备计划、生产换装计划。任命费用100政治点。"
 pwc_cand_government_oversight_military: "军需监察官"
 pwc_cand_government_oversight_military_desc: "她把军需审查带到训练场，关注计划代价是否被转嫁给一线。\n\n监察总长。在批准对应施政计划时消除附带代价：防务整训计划、交通整备计划。任命费用100政治点。"

 pwc_cabinet_agendas: "内阁施政"
 pwc_cabinet_agendas_desc: "完成内阁宪章并任命至少三位原职能部长后，可启动施政计划。每次同时执行一项，持续90天；匹配行政首席减费，匹配监察总长免除附带代价。计划启动后更换部长不改变期限或方案。"
 pwc_cand_executive_coordination_civic: "市政改革官"
 pwc_cand_executive_coordination_civic_desc: "她常从居民来信中发现制度漏洞，倾向以民生服务推动行政改革。\n\n行政首席。使对应施政计划费用减少10政治点：民生保障计划、行政整合计划。任命费用100政治点。"
 pwc_cand_executive_coordination_coordinator: "综合协调官"
 pwc_cand_executive_coordination_coordinator_desc: "她善于把部门间搁置的事项拆成可执行清单，让民生与交通事务按期推进。\n\n行政首席。使对应施政计划费用减少10政治点：民生保障计划、交通整备计划。任命费用100政治点。"
 pwc_cand_executive_coordination_defense: "战备统筹官"

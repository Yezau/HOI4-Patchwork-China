 pwc_advisor_submarine_survival: "潜艇生存专家"
 pwc_advisor_submarine_survival_desc: "她关心潜艇能否平安归航，以生存训练维持部队的持续出勤。\n\n负责潜艇作战，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_advisor_superiority_interception: "截击引导官"

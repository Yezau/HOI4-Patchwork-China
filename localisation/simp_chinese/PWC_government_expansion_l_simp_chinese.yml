 pwc_advisor_armor_assault: "装甲突击专家"
 pwc_advisor_armor_assault_desc: "她强调装甲集中使用，以突击时的协调换取突破机会。\n\n负责装甲协同，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_advisor_armor_defense: "装甲防御专家"
 pwc_advisor_armor_defense_desc: "她主张装甲部队先稳住阵线，依靠防御协同保存战斗力。\n\n负责装甲协同，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_advisor_armor_mobile: "装甲机动专家"
 pwc_advisor_armor_mobile_desc: "她擅长安排装甲部队转场，在行动速度与燃料负担之间作取舍。\n\n负责装甲协同，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_advisor_infantry_defense: "步兵防御专家"
 pwc_advisor_infantry_defense_desc: "她注重步兵阵地组织，以扎实的防御准备补足正面压力。\n\n负责步兵训练，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_advisor_infantry_recruit: "新兵训练官"
 pwc_advisor_infantry_recruit_desc: "她强调可重复的基础操练，优先帮助新兵建立稳定的训练习惯。\n\n负责步兵训练，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_advisor_infantry_special: "特战教练"
 pwc_advisor_infantry_special_desc: "她以严格的小队协作训练培养特战骨干，重视任务准备。\n\n负责步兵训练，以专业组织换取明确优势与代价。每日获得对应军种经验0.12；其余修正作用于列出的兵种或任务。没有受益部队时可提前任命。任命费用100政治点。"
 pwc_advisor_submarine_ambush: "潜艇伏击专家"

l_english:
LOADING_TIP_0: "Give me fifty DC-3s, and I will not care whether the Japanese occupy the Burma Road.\n— Chiang Kai-shek"
LOADING_TIP_1: "Politics is war without bloodshed, while war is politics with bloodshed.\n— Mao Zedong"
LOADING_TIP_2: "Preserve the people and lose the land, and both can be recovered; preserve the land and lose the people, and both are lost.\n— Mao Zedong"
LOADING_TIP_3: "We must win. We must consider the overall campaign plan and the next strategic phase. These are the three principles never to forget when launching the first battle of the counteroffensive.\n— Mao Zedong"
LOADING_TIP_4: "When the enemy advances, we retreat; when the enemy retreats, we pursue; when the enemy camps, we harass; when the enemy tires, we attack.\n— Mao Zedong"
LOADING_TIP_5: "Against a weak enemy, fight as if it were strong; against a strong enemy, fight as if it were even stronger.\n— Xu Xiangqian"
LOADING_TIP_6: "Modern warfare requires commanders of all branches—army, navy, and air force—to be familiar with their weapons. Poor technical knowledge will undermine tactics.\n— Ye Jianying"
LOADING_TIP_7: "Without good training in peacetime, there can be no effective fighting in wartime—just as without savings in hand, there is no money to spend.\n— Liu Bocheng"
LOADING_TIP_8: "We must strengthen coastal defense. Only with strong coastal defense can national defense be secured; without it, there is no national defense.\n— Su Yu"
LOADING_TIP_9: "The battle will be eight hundred thousand against six hundred thousand. The advantage is ours!\n— Chiang Kai-shek"
LOADING_TIP_10: "Pacify the interior before resisting external threats.\n— Chiang Kai-shek"
LOADING_TIP_11: "Existence is everything; everything is for existence.\n— Yan Xishan"
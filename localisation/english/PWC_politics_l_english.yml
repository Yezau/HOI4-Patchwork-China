 PWC_FOCUS_GOV_URBAN_PLANNING: "Urban Master Planning"
 PWC_FOCUS_GOV_URBAN_PLANNING_DESC: "Factories, homes, and transport routes cannot keep competing for every vacant plot. A coherent city plan will connect immediate construction with long-term needs."
 PWC_FOCUS_GOV_URBAN_PLANNING_EFFECTS: "35 days: +1 capital building slot."
 PWC_FOCUS_LAW_CABINET_CHARTER: "Cabinet Charter"
 PWC_FOCUS_LAW_CABINET_CHARTER_DESC: "The city cannot rely forever on informal agreements. A written cabinet charter will define offices, appointments, deliberation, and accountability."
 PWC_FOCUS_LAW_CABINET_CHARTER_EFFECTS: "35 days: §YUnlocks:§! §Gsix cabinet programmes (requires three functional ministers)§!."
 PWC_FOCUS_LAW_CIVIL_SERVICE_EXAM: "Civil Service Examinations"
 PWC_FOCUS_LAW_CIVIL_SERVICE_EXAM_DESC: "Public service should not be allocated through family connections. Open examinations will give capable residents a recognized path into the city administration."
 PWC_FOCUS_LAW_CIVIL_SERVICE_EXAM_EFFECTS: "35 days: +3% political power gain; -10% leader promotion cost."
 PWC_FOCUS_LAW_CONSCRIPTION_REFORM: "Conscription Law Reform"
 PWC_FOCUS_LAW_CONSCRIPTION_REFORM_DESC: "Turning residents into soldiers requires more than a hurried order. Revised recruitment, exemption, and replacement rules will prepare military service for sustained mobilization."
 PWC_FOCUS_LAW_CONSCRIPTION_REFORM_EFFECTS: "70 days: §YUnlocks:§! §Gfull conscription and last-stand mobilization levels§!."
 PWC_FOCUS_LAW_CONSTITUTIONAL_CONVENTION: "Constitutional Convention"
 PWC_FOCUS_LAW_CONSTITUTIONAL_CONVENTION_DESC: "Temporary arrangements cannot define the city's future forever. A constitutional convention will establish a shared settlement on rights, responsibilities, and public authority."
 PWC_FOCUS_LAW_CONSTITUTIONAL_CONVENTION_EFFECTS: "35 days: +100 political power."
 PWC_FOCUS_LAW_ECONOMY_REFORM: "Economic Mobilization Reform"
 PWC_FOCUS_LAW_ECONOMY_REFORM_DESC: "Machines, inventories, and civilian demand belong in a common plan. Defined mobilization rules will spare the city from rebuilding its economic arrangements during every crisis."
 PWC_FOCUS_LAW_ECONOMY_REFORM_EFFECTS: "70 days: §YUnlocks:§! §Gwar economy and total war economy levels§!."
 PWC_FOCUS_LAW_EMERGENCY_POWERS: "Emergency Powers Act"
 PWC_FOCUS_LAW_EMERGENCY_POWERS_DESC: "Ordinary procedures may not meet an approaching crisis. Emergency powers need defined purposes and responsibilities so that exceptional action still rests on clear law."
 PWC_FOCUS_LAW_EMERGENCY_POWERS_EFFECTS: "35 days: +3% war support; +10% mobilization speed."
 PWC_FOCUS_LAW_OVERSIGHT_COMMITTEE: "Oversight Committee"
 PWC_FOCUS_LAW_OVERSIGHT_COMMITTEE_DESC: "Expanding authority cannot be supervised by goodwill alone. A dedicated oversight committee will scrutinize public spending, appointments, and administrative decisions."
 PWC_FOCUS_LAW_OVERSIGHT_COMMITTEE_EFFECTS: "35 days: +0.03 daily political power; -10% foreign subversive activities."
 PWC_FOCUS_LAW_TRADE_REFORM: "Trade Control Reform"
 PWC_FOCUS_LAW_TRADE_REFORM_DESC: "The city needs imported materials while retaining supplies essential to survival. Clear trade rules will reconcile commercial exchange with the protection of local reserves."
 PWC_FOCUS_LAW_TRADE_REFORM_EFFECTS: "70 days: §YUnlocks:§! §Gexport restrictions and wartime control levels§!."
 PWC_FOCUS_MIL_AIR_CAS_COMMAND: "Ground Attack Air Command"
 PWC_FOCUS_MIL_AIR_CAS_COMMAND_DESC: "Air support must understand the situation on the ground. A dedicated command will make coordination between aircraft and ground formations part of every operation."
 PWC_FOCUS_MIL_AIR_CAS_COMMAND_EFFECTS: "35 days: +25 air XP; unlock $PWC_MIO_GROUND_ATTACK$; one-time +25% air research."
 PWC_FOCUS_MIL_AIR_DENIAL: "Airspace Denial"
 PWC_FOCUS_MIL_AIR_DENIAL_DESC: "Air denial requires continuous warning and mission organization. Flying units, observers, and ground command must share defined responsibilities in the city's defense."
 PWC_FOCUS_MIL_AIR_DENIAL_EFFECTS: "Enemy aircraft must pay for entering our airspace. Interception comes before distant targets.\n\n35 days: +10 air XP; §YUnlocks:§! §GLayered Airspace Denial§!; +0.05 daily command power gain; +5% interception efficiency."
 PWC_FOCUS_MIL_AIR_DRONE_PROGRAM: "Drone Program"
 PWC_FOCUS_MIL_AIR_DRONE_PROGRAM_DESC: "Unmanned platforms change the relationship between air missions and human risk. Control systems, data links, and mission equipment must develop as one aviation program."
 PWC_FOCUS_MIL_AIR_DRONE_PROGRAM_EFFECTS: "35 days: unlock $PWC_MIO_UNMANNED$; one-time +25% air research."
 PWC_FOCUS_MIL_AIR_JOINT_STRIKE: "Joint Strike Aviation"
 PWC_FOCUS_MIL_AIR_JOINT_STRIKE_DESC: "Air strikes must share objectives and timing with ground and other air operations. Joint planning will give each force a defined place in the larger effort."
 PWC_FOCUS_MIL_AIR_JOINT_STRIKE_EFFECTS: "Our air arm will help design the ground campaign, accepting a reduced defensive emphasis.\n\n35 days: +10 air XP; §YUnlocks:§! §GForward Joint Strike§!; +0.05 daily command power gain; +10% ground attack."
 PWC_FOCUS_MIL_AIR_WING: "Air Wing"
 PWC_FOCUS_MIL_AIR_WING_DESC: "Scattered aircraft can only fly scattered missions. A permanent air wing will unite pilots, ground crews, and command staff in a lasting aviation organization."
 PWC_FOCUS_MIL_AIR_WING_EFFECTS: "35 days: +25 air XP; unlock $PWC_MIO_AIR_SUPERIORITY$; §YUnlocks:§! §GDeep Systems Strike, Joint Air-Ground System, Layered Air Defence, Air Staff Course§!."
 PWC_FOCUS_MIL_AMBUSH_FLOTILLAS: "Ambush Flotillas"
 PWC_FOCUS_MIL_AMBUSH_FLOTILLAS_DESC: "Small flotillas depend on preparation, coordination, and clear recovery arrangements. Shared procedures will organize littoral experience beyond individual improvisation."
 PWC_FOCUS_MIL_AMBUSH_FLOTILLAS_EFFECTS: "Our flotillas will attack from favourable waters and recover rather than seek a distant decisive battle.\n\n35 days: +10 navy XP; §YUnlocks:§! §GNaval Doctrine Study, Littoral Ambush§!; +5% convoy raiding efficiency; +10% torpedo hit chance."
 PWC_FOCUS_MIL_APEX_CITY_MARSHAL: "Unified Military Command"
 PWC_FOCUS_MIL_APEX_CITY_MARSHAL_DESC: "Our formations need clear responsibilities and a unified chain of command. We will establish a permanent high command and staff system to coordinate operational planning and logistics across the armed forces."
 PWC_FOCUS_MIL_APEX_CITY_MARSHAL_EFFECTS: "70 days: grant 1 field marshal; +5% planning speed; +50 maximum command power; +0.1 daily command power gain."
 PWC_FOCUS_MIL_ARMAMENTS_STANDARDIZATION: "War Reserve Administration"
 PWC_FOCUS_MIL_ARMAMENTS_STANDARDIZATION_DESC: "War materiel cannot be managed through incompatible departmental records. Shared accounting and allocation will give equipment preparation a common order."
 PWC_FOCUS_MIL_ARMAMENTS_STANDARDIZATION_EFFECTS: "Our depots will be organised for the next campaign, not merely for the ledger.\n\n35 days: +10 army XP; §YUnlocks:§! §GWar Reserve Preparation§!; +5% production efficiency cap; -5% supply truck attrition."
 PWC_FOCUS_MIL_BATTLEFIELD_INTERDICTION: "Battlefield Interdiction"
 PWC_FOCUS_MIL_BATTLEFIELD_INTERDICTION_DESC: "The battlefield includes the routes and movements sustaining the fight. Air planning must consider these connections as part of the wider campaign."
 PWC_FOCUS_MIL_BATTLEFIELD_INTERDICTION_EFFECTS: "We will disrupt the enemy's approach, then rest the aircraft and crews that made it possible.\n\n35 days: +10 air XP; §YUnlocks:§! §GAir Doctrine Study, Battlefield Interdiction§!; +10% close air support efficiency; +10% ground attack."
 PWC_FOCUS_MIL_COASTAL_SENSOR_LINE: "Coastal Sensor Line"
 PWC_FOCUS_MIL_COASTAL_SENSOR_LINE_DESC: "Coastal observations become useful together. Shared reporting procedures will connect ports and watch stations in a common maritime picture."
 PWC_FOCUS_MIL_COASTAL_SENSOR_LINE_EFFECTS: "Shore stations and patrols must share the same picture of the sea.\n\n35 days: +10 navy XP; §YUnlocks:§! §GCoastal Watch§!; +5% naval detection; +3% spotting speed."
 PWC_FOCUS_MIL_COMBINED_ARMS: "Combined Arms"
 PWC_FOCUS_MIL_COMBINED_ARMS_DESC: "Infantry, armor, and supporting fire cannot realize their purpose in isolation. Shared command and communications will let different arms act toward the same objective."
 PWC_FOCUS_MIL_COMBINED_ARMS_EFFECTS: "35 days: grant 1 general; unlock $PWC_MIO_FIREPOWER$; +5% division attack; +5% coordination."
 PWC_FOCUS_MIL_CONVOY_COMMAND: "Convoy Command"
 PWC_FOCUS_MIL_CONVOY_COMMAND_DESC: "Convoy work requires lasting coordination among merchant vessels, warships, and ports. A common command will organize preparation and communications across voyages."
 PWC_FOCUS_MIL_CONVOY_COMMAND_EFFECTS: "Escorts will be assigned by route rather than by port, instead of dispersing on raids.\n\n35 days: +10 navy XP; §YUnlocks:§! §GEscort Surge§!; +5% convoy escort efficiency; +5% fleet coordination."
 PWC_FOCUS_MIL_COUNTERSTROKE: "Operational Counterstroke"
 PWC_FOCUS_MIL_COUNTERSTROKE_DESC: "A counterstroke requires both a clear assessment and prepared forces. Operational procedures will organize reserves around a deliberate moment of action."
 PWC_FOCUS_MIL_COUNTERSTROKE_EFFECTS: "We will strike when the enemy's momentum is spent, committing a reserve we cannot use twice.\n\n35 days: +10 army XP; §YUnlocks:§! §GReserve Counterstroke§!; +5% breakthrough; +10% army organization regain."
 PWC_FOCUS_MIL_DEEP_EXPLOITATION: "Deep Exploitation"
 PWC_FOCUS_MIL_DEEP_EXPLOITATION_DESC: "The situation beyond a breakthrough is rarely clear. Exploiting forces must remain connected with follow-up formations and a defined operational purpose."
 PWC_FOCUS_MIL_DEEP_EXPLOITATION_EFFECTS: "A breach is only a beginning. We must exploit it before the enemy reorganises.\n\n35 days: +10 army XP; §YUnlocks:§! §GDeep Exploitation Operation§!; +5% breakthrough; +10% army organization regain."
 PWC_FOCUS_MIL_DEFENSE_CORPS: "City Defense Corps"
 PWC_FOCUS_MIL_DEFENSE_CORPS_DESC: "City defense cannot depend on improvised district forces. A unified defense corps will assign responsibility for every sector and bring local units under common command."
 PWC_FOCUS_MIL_DEFENSE_CORPS_EFFECTS: "35 days: +5% division organization; +3% reinforce rate; §YUnlocks:§! §GDistributed Manoeuvre Command, Integrated Fires Network, Operational Coordination, Layered Territorial Defence§!."
 PWC_FOCUS_MIL_DEFENSE_IN_DEPTH: "Defence in Depth"
 PWC_FOCUS_MIL_DEFENSE_IN_DEPTH_DESC: "Forward positions are only part of a defense. Successive lines, routes, and unit handovers must ensure that a local setback does not disorganize the whole system."
 PWC_FOCUS_MIL_DEFENSE_IN_DEPTH_EFFECTS: "Fallback positions and rotation orders will keep the defence alive after the first line falls.\n\n35 days: +10 army XP; §YUnlocks:§! §GDefence-in-Depth Rotation§!; +5% reinforce rate; +5% max entrenchment."
 PWC_FOCUS_MIL_DELIBERATE_BREAKTHROUGH: "Deliberate Breakthrough"
 PWC_FOCUS_MIL_DELIBERATE_BREAKTHROUGH_DESC: "An attack must know what it is intended to achieve. Defined objectives, deliberate preparation, and timely reorganization will guide a controlled breakthrough."
 PWC_FOCUS_MIL_DELIBERATE_BREAKTHROUGH_EFFECTS: "We will define both the objective and the stopping line before committing the assault.\n\n35 days: +10 army XP; §YUnlocks:§! §GLimited-Objective Offensive§!; +5% breakthrough; +3% max planning."
 PWC_FOCUS_MIL_DISPERSED_AIRBASES: "Dispersed Airfields"
 PWC_FOCUS_MIL_DISPERSED_AIRBASES_DESC: "Aviation cannot depend on one operating site. Communications, ground support, and dispatch procedures will link dispersed bases within a common organization."
 PWC_FOCUS_MIL_DISPERSED_AIRBASES_EFFECTS: "Dispersal and alternate strips will preserve our wings, at a cost to routine sorties.\n\n35 days: +10 air XP; §YUnlocks:§! §GAirfield Dispersal§!; -5% air accidents chance; +10% home air defence."
 PWC_FOCUS_MIL_ELASTIC_OPERATIONS: "Elastic Defence"
 PWC_FOCUS_MIL_ELASTIC_OPERATIONS_DESC: "Defense need not mean refusing movement at every point. Positions, reserves, and planned maneuver must work together without sacrificing the formation's organization."
 PWC_FOCUS_MIL_ELASTIC_OPERATIONS_EFFECTS: "We defend the army's cohesion and the city's survival, not every exposed position.\n\n35 days: +10 army XP; §YUnlocks:§! §GElastic Defence in Depth§!; +0.05 daily command power gain; +5% division recovery rate."
 PWC_FOCUS_MIL_EXPEDITIONARY_SUPPORT: "Expeditionary Support"
 PWC_FOCUS_MIL_EXPEDITIONARY_SUPPORT_DESC: "A fleet still needs dependable support beyond its home ports. Expeditionary supply, maintenance, and personnel arrangements must be planned before departure."
 PWC_FOCUS_MIL_EXPEDITIONARY_SUPPORT_EFFECTS: "An expedition begins with a supply and withdrawal plan, not with its first landing craft.\n\n35 days: +10 navy XP; §YUnlocks:§! §GNaval Doctrine Study, Landing Support Window§!; +3% amphibious invasion speed; +5% naval invasion preparation speed."
 PWC_FOCUS_MIL_FIELD_WORKSHOPS: "Field Workshops"
 PWC_FOCUS_MIL_FIELD_WORKSHOPS_DESC: "Damaged equipment cannot always return to a city factory. Field workshops will bring inspection, spares, and repair knowledge closer to moving formations."
 PWC_FOCUS_MIL_FIELD_WORKSHOPS_EFFECTS: "We will divert part of rear production to return damaged equipment to service.\n\n35 days: +10 army XP; §YUnlocks:§! §GField Repair Surge§!; -5% division attrition; +10% army organization regain."
 PWC_FOCUS_MIL_FIREPOWER_OPERATIONS: "Integrated Fires"
 PWC_FOCUS_MIL_FIREPOWER_OPERATIONS_DESC: "Separate weapons do not organize themselves into a campaign. Observation, communications, and fire planning must bring them into a common operational sequence."
 PWC_FOCUS_MIL_FIREPOWER_OPERATIONS_EFFECTS: "Reconnaissance, observation, artillery and infantry will advance to a common rhythm.\n\n35 days: +10 army XP; §YUnlocks:§! §GReconnaissance and Fires§!; +0.05 daily command power gain; +5% reconnaissance."
 PWC_FOCUS_MIL_FORWARD_AIR_CONTROL: "Forward Air Control"
 PWC_FOCUS_MIL_FORWARD_AIR_CONTROL_DESC: "Forward troops know the local situation but need a reliable way to communicate it. Common air-ground procedures will connect their observations with aviation missions."
 PWC_FOCUS_MIL_FORWARD_AIR_CONTROL_EFFECTS: "Forward controllers will turn requests for aircraft into precise requests for support.\n\n35 days: +10 air XP; §YUnlocks:§! §GClose Support Surge§!; +10% close air support efficiency; +10% ground attack."
 PWC_FOCUS_MIL_INFANTRY_DOCTRINE: "Infantry Doctrine"
 PWC_FOCUS_MIL_INFANTRY_DOCTRINE_DESC: "A common doctrine lets soldiers from different districts understand one another. Standard infantry training will replace incompatible habits with shared methods of fighting."
 PWC_FOCUS_MIL_INFANTRY_DOCTRINE_EFFECTS: "35 days: +20 army XP; unlock $PWC_MIO_INFANTRY$."
 PWC_FOCUS_MIL_INTERCEPTION_NETWORK: "Interception Network"
 PWC_FOCUS_MIL_INTERCEPTION_NETWORK_DESC: "Interception begins with warning information, not takeoff. Observation, command, and flight assignments must form a connected process."
 PWC_FOCUS_MIL_INTERCEPTION_NETWORK_EFFECTS: "Our sensors and ready squadrons will answer concentrated enemy sorties together.\n\n35 days: +10 air XP; §YUnlocks:§! §GAir Doctrine Study, Interception Surge§!; +5% interception detection; +5% interception efficiency."
 PWC_FOCUS_MIL_JOINT_OPERATIONS: "Joint Operations Command"
 PWC_FOCUS_MIL_JOINT_OPERATIONS_DESC: "Different services in the same campaign must understand one another's schedules and limits. Joint planning will turn a shared objective into coordinated action."
 PWC_FOCUS_MIL_JOINT_OPERATIONS_EFFECTS: "Land, air and maritime support will share one timetable, including recovery.\n\n35 days: +10 army XP; §YUnlocks:§! §GJoint Operation Window§!; +40 maximum command power; +5% coordination."
 PWC_FOCUS_MIL_LITTORAL_DENIAL: "Littoral Denial"
 PWC_FOCUS_MIL_LITTORAL_DENIAL_DESC: "Littoral defense depends on local waterways and shore support. Fleet operations will be organized around familiar waters and clearly defined missions."
 PWC_FOCUS_MIL_LITTORAL_DENIAL_EFFECTS: "We need not own every sea, only deny the enemy an easy approach to our coast.\n\n35 days: +10 navy XP; §YUnlocks:§! §GLittoral Flotilla Denial§!; +0.05 daily command power gain; +5% fleet coordination."
 PWC_FOCUS_MIL_LOGISTICS_COMMAND: "Logistics Command"
 PWC_FOCUS_MIL_LOGISTICS_COMMAND_DESC: "Every action at the front depends on supplies arriving from the rear. Transport, storage, and maintenance need a unified command within operational planning."
 PWC_FOCUS_MIL_LOGISTICS_COMMAND_EFFECTS: "35 days: grant 1 general; unlock $PWC_MIO_LOGISTICS$; -10% supply consumption; -5% supply truck attrition."
 PWC_FOCUS_MIL_MECHANIZED_INITIATIVE: "Mechanization Initiative"
 PWC_FOCUS_MIL_MECHANIZED_INITIATIVE_DESC: "Mechanization means more than issuing vehicles. Armored platforms, maintenance teams, and infantry operations must be planned as parts of the same organization."
 PWC_FOCUS_MIL_MECHANIZED_INITIATIVE_EFFECTS: "35 days: unlock $PWC_MIO_ARMOR$; one-time +25% armor research."
 PWC_FOCUS_MIL_MEDICAL_EVACUATION: "Medical Evacuation"
 PWC_FOCUS_MIL_MEDICAL_EVACUATION_DESC: "Medical evacuation cannot wait for improvised arrangements after battle. Treatment, transport, and reception must form a continuous system understood at the front."
 PWC_FOCUS_MIL_MEDICAL_EVACUATION_EFFECTS: "Evacuation and replacement must form an unbroken chain, restoring units rather than inventing manpower.\n\n35 days: +10 army XP; §YUnlocks:§! §GEvacuation and Recovery§!; +5% division recovery rate; -5% division training time."
 PWC_FOCUS_MIL_MOBILE_OPERATIONS: "Deep Manoeuvre"
 PWC_FOCUS_MIL_MOBILE_OPERATIONS_DESC: "Mobility means preserving organization while the situation changes. Reconnaissance, movement, and follow-up actions must be planned together for operations in depth."
 PWC_FOCUS_MIL_MOBILE_OPERATIONS_EFFECTS: "We will seek gaps rather than prove our courage against the strongest position.\n\n35 days: +10 army XP; §YUnlocks:§! §GDeep Manoeuvre§!; +0.05 daily command power gain; +10% division speed."
 PWC_FOCUS_MIL_MOBILE_RESERVES: "Mobile Reserves"
 PWC_FOCUS_MIL_MOBILE_RESERVES_DESC: "A mobile reserve needs routes, communications, and preparation before the crisis. We will organize maneuver forces as a coherent operational resource."
 PWC_FOCUS_MIL_MOBILE_RESERVES_EFFECTS: "Our reserve must move quickly; concentration necessarily thins another sector.\n\n35 days: +10 army XP; §YUnlocks:§! §GConcentrate Mobile Reserves§!; +10% army organization regain; +5% reinforce rate."
 PWC_FOCUS_MIL_NAVAL_COMMAND: "Naval Command"
 PWC_FOCUS_MIL_NAVAL_COMMAND_DESC: "Ships based in separate ports need clear and lasting direction. A naval command will integrate patrols, combat, and support into a complete maritime plan."
 PWC_FOCUS_MIL_NAVAL_COMMAND_EFFECTS: "35 days: +25 navy XP; grant 1 admiral; +5% fleet coordination; +5% naval detection."
 PWC_FOCUS_MIL_NAVAL_EXPANSION: "Naval Expansion"
 PWC_FOCUS_MIL_NAVAL_EXPANSION_DESC: "The first fleet is no longer enough for more demanding maritime tasks. Expansion must provide trained personnel and support, not merely a longer list of ships."
 PWC_FOCUS_MIL_NAVAL_EXPANSION_EFFECTS: "35 days: +25 navy XP; unlock $PWC_MIO_SUBMARINE$; grant 1 admiral."
 PWC_FOCUS_MIL_NAVAL_PROGRAM: "Naval Program"
 PWC_FOCUS_MIL_NAVAL_PROGRAM_DESC: "The water is another approach to the city, not an empty boundary. A naval program will develop vessels, crews, and command institutions together."
 PWC_FOCUS_MIL_NAVAL_PROGRAM_EFFECTS: "35 days: +25 navy XP; unlock $PWC_MIO_SURFACE_NAVAL$; grant 1 admiral; §YUnlocks:§! §GSea Lane Control, Dispersed Littoral Denial, Expeditionary Fleet Support, Naval Staff Course§!."
 PWC_FOCUS_MIL_OFFICER_ACADEMY: "Officer Academy"
 PWC_FOCUS_MIL_OFFICER_ACADEMY_DESC: "Officers should not learn command for the first time in battle. An academy will unite map exercises, field training, and combat experience in a common education."
 PWC_FOCUS_MIL_OFFICER_ACADEMY_EFFECTS: "35 days: grant 2 generals; +25 army XP; +5% army experience gain; +0.1 daily command power gain."
 PWC_FOCUS_MIL_OPERATIONAL_INTELLIGENCE: "Operational Intelligence"
 PWC_FOCUS_MIL_OPERATIONAL_INTELLIGENCE_DESC: "Reports become useful only after assessment. An operational intelligence office will connect the fragments observed by separate units into a picture commanders can use."
 PWC_FOCUS_MIL_OPERATIONAL_INTELLIGENCE_EFFECTS: "Reconnaissance, signals and contact reports must feed one operational map.\n\n35 days: +10 army XP; §YUnlocks:§! §GBattlefield Reconnaissance§!; +5% army intelligence; +5% spotting speed."
 PWC_FOCUS_MIL_RESERVE_SYSTEM: "Operational Reserve"
 PWC_FOCUS_MIL_RESERVE_SYSTEM_DESC: "A reserve is more than units hurriedly taken from the line. Defined assembly, readiness, and commitment procedures will preserve an organized response to changing conditions."
 PWC_FOCUS_MIL_RESERVE_SYSTEM_EFFECTS: "Our last battalion must not be committed with the first. Rotation is part of the plan.\n\n35 days: +10 army XP; §YUnlocks:§! §GFront Rotation§!; +10% army organization regain; +5% division recovery rate."
 PWC_FOCUS_MIL_SEA_CONTROL: "Sea Lines of Communication"
 PWC_FOCUS_MIL_SEA_CONTROL_DESC: "Sea routes sustain the city's external connections. Fleet work must bring navigation, escort, and continuing support into a dependable maritime system."
 PWC_FOCUS_MIL_SEA_CONTROL_EFFECTS: "Our navy will first ensure that people and supplies reach their destination.\n\n35 days: +10 navy XP; §YUnlocks:§! §GSea Lane Defence§!; +0.05 daily command power gain; +5% convoy escort efficiency."
 PWC_FOCUS_MIL_SENSOR_SHOOTER_NETWORK: "Sensor-to-Shooter Network"
 PWC_FOCUS_MIL_SENSOR_SHOOTER_NETWORK_DESC: "Target observation must not be separated from fire direction by confused messages. Shared reconnaissance and correction procedures will connect observers with the units they support."
 PWC_FOCUS_MIL_SENSOR_SHOOTER_NETWORK_EFFECTS: "Observers must send usable coordinates directly to the units delivering fire.\n\n35 days: +10 army XP; §YUnlocks:§! §GFire and Reconnaissance Coordination§!; +3% reconnaissance; +5% coordination."
 PWC_FOCUS_MIL_STAFF_WARGAMES: "Staff Wargames"
 PWC_FOCUS_MIL_STAFF_WARGAMES_DESC: "Operational plans should reveal their weaknesses before orders are issued. Staff wargames will test assumptions and coordination on the map before the city faces them in battle."
 PWC_FOCUS_MIL_STAFF_WARGAMES_EFFECTS: "We will test our orders on the map before our soldiers cross the line of fire.\n\n35 days: +10 army XP; §YUnlocks:§! §GArmy Staff Course, Army Doctrine Study§!; +30 maximum command power; +5% reinforce rate."
 PWC_FOCUS_MIL_URBAN_FORTIFICATION: "Urban Fortification"
 PWC_FOCUS_MIL_URBAN_FORTIFICATION_DESC: "Streets, bridges, and essential facilities belong in a complete defense plan. The city's structure must become part of prepared positions rather than improvised barricades."
 PWC_FOCUS_MIL_URBAN_FORTIFICATION_EFFECTS: "35 days: add 1 land fort in the capital; +5% division defense on core territory; §YUnlocks:§! §GAnti-Assault Defence§!."
 PWC_FOCUS_PANEL_ENDGAME_LABEL: "Endgame path"
 PWC_FOCUS_PANEL_ENDGAME_STATUS: "[PWCGetFocusPanelEndgameStatus]"
 PWC_FOCUS_PANEL_ENDGAME_TT: "$PWC_FOCUS_PANEL_MUTEX_BODY$"
 PWC_FOCUS_PANEL_GATE: "Research requirement"
 PWC_FOCUS_PANEL_GATE_BODY: "§YBuilding requirement for the fourth research slot§!\nState: §Yowned and fully controlled by us§!\nTechnology centre: §Yat least 2 undamaged levels§!\nEach state is checked separately; damaged levels do not count."
 PWC_FOCUS_PANEL_GATE_LABEL: "Fourth slot: building gate"
 PWC_FOCUS_PANEL_GATE_STATUS: "[PWCGetFocusPanelGateStatus]"
 PWC_FOCUS_PANEL_GATE_SUMMARY: "Fourth slot: own and fully control a state with at least 2 undamaged technology centre levels."
 PWC_FOCUS_PANEL_GATE_TT: "$PWC_FOCUS_PANEL_GATE_BODY$"
 PWC_FOCUS_PANEL_GEO: "Geographic route"
 PWC_FOCUS_PANEL_GEO_BODY: "At setup, keep the city's geographic route or choose the generic city cooperation route. The choice stays fixed for this game."
 PWC_FOCUS_PANEL_GEO_LABEL: "City geography"
 PWC_FOCUS_PANEL_GEO_STATUS: "[PWCGetFocusPanelGeoStatus]"
 PWC_FOCUS_PANEL_GEO_SUMMARY: "At setup, keep the city's geographic route or choose the generic city cooperation route. The choice stays fixed for this game."

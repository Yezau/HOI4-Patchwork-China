 PWC_FOCUS_PANEL_REWARD_SUMMARY: "Related focus spirit bonuses share one entry and accumulate with later focuses. Endgame spirits remain separate."
 PWC_FOCUS_PANEL_STATUS_ENDGAME_DEFENSIVE_DOCTRINE: "Defensive Doctrine"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_INTEGRATION_CHARTER: "Integration Charter"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_OFFENSIVE_DOCTRINE: "Offensive Doctrine"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_PENDING: "Pending"
 PWC_FOCUS_PANEL_STATUS_ENDGAME_TECHNOLOGICAL_SUPREMACY: "Technological Supremacy"
 PWC_FOCUS_PANEL_STATUS_GATE_MET: "Met"
 PWC_FOCUS_PANEL_STATUS_GATE_UNMET: "Not met"
 PWC_FOCUS_PANEL_STATUS_GEO_COASTAL: "Coastal"
 PWC_FOCUS_PANEL_STATUS_GEO_FRONTIER: "Frontier"
 PWC_FOCUS_PANEL_STATUS_GEO_GENERIC: "Generic"
 PWC_FOCUS_PANEL_STATUS_GEO_INLAND: "Inland"
 PWC_FOCUS_PANEL_STATUS_GEO_ISLAND: "Island"
 PWC_FOCUS_PANEL_TITLE: "Focuses"
 PWC_FOCUS_WAR_ACCESS_AGREEMENTS: "Access Agreement Network"
 PWC_FOCUS_WAR_ACCESS_AGREEMENTS_DESC: "Cross-border movements require careful liaison and transport planning. Shared procedures for access, marching schedules, and supply will help our forces operate under existing agreements."
 PWC_FOCUS_WAR_ACCESS_AGREEMENTS_EFFECTS: "35 days: -5% supply consumption; +5% division speed."
 PWC_FOCUS_WAR_DIPLOMATIC_CORPS: "Diplomatic Corps"
 PWC_FOCUS_WAR_DIPLOMATIC_CORPS_DESC: "Reliable envoys carry the city's commitments as well as its messages. A permanent diplomatic corps will maintain relations beyond moments of suspicion and misunderstanding."
 PWC_FOCUS_WAR_DIPLOMATIC_CORPS_EFFECTS: "35 days: §YUnlocks:§! §GSend Envoys and Invite Support (one peaceful city per war)§!."
 PWC_FOCUS_WAR_ESTABLISH_AGENCY: "Establish Intelligence Agency"
 PWC_FOCUS_WAR_ESTABLISH_AGENCY_DESC: "Build a dedicated intelligence agency upon our diplomatic network to gather information, protect communications, and conduct covert operations."
 PWC_FOCUS_WAR_ESTABLISH_AGENCY_EFFECTS: "Build an intelligence agency upon our diplomatic network to gather intelligence.\n\n35 days: §YAllows:§! §GIntelligence agency creation§!."
 PWC_FOCUS_WAR_FOREIGN_OFFICE: "Foreign Office"
 PWC_FOCUS_WAR_FOREIGN_OFFICE_DESC: "Relations with neighboring cities cannot rest on chance encounters. A foreign office will replace informal messages with recorded negotiations and clear responsibility."
 PWC_FOCUS_WAR_FOREIGN_OFFICE_EFFECTS: "35 days: +25 political power; -10% improve relations maintain cost; +10% improve relations opinion."
 PWC_FOCUS_WAR_INTELLIGENCE_BUREAU: "Intelligence Bureau"
 PWC_FOCUS_WAR_INTELLIGENCE_BUREAU_DESC: "Important decisions cannot rest on street rumors. An intelligence bureau will assess sources, verify reports, and protect communications so the city can judge for itself."
 PWC_FOCUS_WAR_INTELLIGENCE_BUREAU_EFFECTS: "35 days: +5% civilian intelligence; +5% army intelligence."
 PWC_FOCUS_WAR_NAP_FRAMEWORK: "Non-Aggression Framework"
 PWC_FOCUS_WAR_NAP_FRAMEWORK_DESC: "Non-aggression promises need a shared understanding to prevent border misjudgments. Agreed consultation and notification procedures will preserve a path to peaceful coexistence."
 PWC_FOCUS_WAR_NAP_FRAMEWORK_EFFECTS: "35 days: +3% stability; +10% enemy justify war goal time."
 PWC_FOCUS_WAR_OCCUPATION_AUTHORITY: "Occupation Authority"
 PWC_FOCUS_WAR_OCCUPATION_AUTHORITY_DESC: "Taking a city does not mean governing it. A dedicated occupation authority will organize order, registration, and public services during the transition from military control."
 PWC_FOCUS_WAR_OCCUPATION_AUTHORITY_EFFECTS: "35 days: +3% compliance growth in our occupied states; -5% required garrisons."
 PWC_FOCUS_WAR_PROPAGANDA_OFFICE: "Propaganda Office"
 PWC_FOCUS_WAR_PROPAGANDA_OFFICE_DESC: "Residents need to understand both their hardships and the government's purpose. A public information office will turn scattered announcements into sustained communication."
 PWC_FOCUS_WAR_PROPAGANDA_OFFICE_EFFECTS: "35 days: +3% war support; +5% stability in a defensive war."
 PWC_FOCUS_WAR_WAR_ROOM: "War Room"
 PWC_FOCUS_WAR_WAR_ROOM_DESC: "Scattered reports and conflicting orders must become a coherent picture. The war room will bring commanders, staff officers, and logistical planners together."
 PWC_FOCUS_WAR_WAR_ROOM_EFFECTS: "35 days: +3% max planning; +0.1 daily command power gain."
 PWC_LAW_CONSCRIPTION: "Conscription Law"
 PWC_LAW_CONSCRIPTION_DESC: "Military service defines residents' obligations in defense and the boundary between civilian life and military needs. Each recruitment system reflects a different assessment of the situation."
 PWC_LAW_CONSCRIPTION_EFFECTS: "5 levels, starting at level 1; upgrades cost 75/100/150/200 political power in turn. Higher levels need the matching reform focus first."
 PWC_LAW_CONSCRIPTION_L1: "Volunteer Service"
 PWC_LAW_CONSCRIPTION_L1_DESC: "The armed forces rely primarily on volunteers. Most residents remain in civilian occupations while military service is maintained as a voluntary commitment."
 PWC_LAW_CONSCRIPTION_L1_EFFECTS: "Starting level: +1% recruitable population share, +5% stability."
 PWC_LAW_CONSCRIPTION_L2: "Limited Conscription"
 PWC_LAW_CONSCRIPTION_L2_DESC: "The city begins planned recruitment while retaining exemptions and civilian safeguards. Service becomes a limited public obligation rather than only an individual choice."
 PWC_LAW_CONSCRIPTION_L2_EFFECTS: "Level 2: +1.5% recruitable population share, +3% stability. Reaching this level needs 75 political power, 10% war support."
 PWC_LAW_CONSCRIPTION_L3: "Expanded Conscription"
 PWC_LAW_CONSCRIPTION_L3_DESC: "Recruitment reaches a wider part of society. Government and military institutions must manage the strain between replacements for the armed forces and the continuity of civilian work."
 PWC_LAW_CONSCRIPTION_L3_EFFECTS: "Level 3: +2.5% recruitable population share. Reaching this level needs 100 political power, 30% war support."
 PWC_LAW_CONSCRIPTION_L4: "Full Conscription"
 PWC_LAW_CONSCRIPTION_L4_DESC: "Military service becomes a broad and urgent obligation. Households, schools, and workplaces must reorganize daily life around extensive recruitment."
 PWC_LAW_CONSCRIPTION_L4_EFFECTS: "Level 4: +5% recruitable population share, -5% stability, +5% training time. Reaching this level needs 150 political power, 50% war support, the matching reform focus."
 PWC_LAW_CONSCRIPTION_L5: "Last-Stand Mobilization"
 PWC_LAW_CONSCRIPTION_L5_DESC: "Ordinary service arrangements give way to a struggle for survival. The city calls on its last reserves of manpower, forcing civilian routines to yield to the war."
 PWC_LAW_CONSCRIPTION_L5_EFFECTS: "Level 5: +10% recruitable population share, -10% stability, +10% training time. Reaching this level needs 200 political power, 70% war support, the matching reform focus."
 PWC_LAW_ECONOMY_MOBILIZATION: "Economic Mobilization Law"
 PWC_LAW_ECONOMY_MOBILIZATION_DESC: "Economic mobilization determines how factories, labor, and supplies are divided between civilian life and war. It defines the organization of production across the city."
 PWC_LAW_ECONOMY_MOBILIZATION_EFFECTS: "5 levels, starting at level 2; upgrades cost 75/100/150/200 political power in turn. Higher levels need the matching reform focus first."
 PWC_LAW_ECONOMY_MOBILIZATION_L1: "Civilian Economy"
 PWC_LAW_ECONOMY_MOBILIZATION_L1_DESC: "Production centers on civilian needs and ordinary commerce. Public administration maintains markets and services without placing the economy under wartime direction."
 PWC_LAW_ECONOMY_MOBILIZATION_L1_EFFECTS: "Level 1: +6% consumer goods factories, +5% stability."
 PWC_LAW_ECONOMY_MOBILIZATION_L2: "Preliminary Mobilization"
 PWC_LAW_ECONOMY_MOBILIZATION_L2_DESC: "Civilian economic structures remain in place while the city prepares emergency capacity and supplies. Departments begin learning how to move into coordinated mobilization."
 PWC_LAW_ECONOMY_MOBILIZATION_L2_EFFECTS: "Starting level: +3% consumer goods factories, +5% arms factory construction speed. Reaching this level needs 75 political power, 10% war support."
 PWC_LAW_ECONOMY_MOBILIZATION_L3: "Pre-War Mobilization"
 PWC_LAW_ECONOMY_MOBILIZATION_L3_DESC: "Preparation for war begins to shape major production decisions. Factories and construction programs are coordinated before a full emergency arrives."
 PWC_LAW_ECONOMY_MOBILIZATION_L3_EFFECTS: "Level 3: +0% consumer goods factories, +10% arms factory construction speed, +3% factory output. Reaching this level needs 100 political power, 30% war support."
 PWC_LAW_ECONOMY_MOBILIZATION_L4: "War Economy"
 PWC_LAW_ECONOMY_MOBILIZATION_L4_DESC: "Wartime demand directs economic coordination. Factories, construction, and public supplies enter a common system in which choices between civilian and military needs are immediate."
 PWC_LAW_ECONOMY_MOBILIZATION_L4_EFFECTS: "Level 4: -3% consumer goods factories, +15% arms factory construction speed, +6% factory output, +5% construction speed. Reaching this level needs 150 political power, 50% war support, the matching reform focus."
 PWC_LAW_ECONOMY_MOBILIZATION_L5: "Total War Economy"
 PWC_LAW_ECONOMY_MOBILIZATION_L5_DESC: "The whole city becomes a production community sustaining the war. Central direction displaces ordinary consumption and independent business decisions throughout economic life."
 PWC_LAW_ECONOMY_MOBILIZATION_L5_EFFECTS: "Level 5: -6% consumer goods factories, +20% arms factory construction speed, +10% factory output, -5% stability. Reaching this level needs 200 political power, 70% war support, the matching reform focus."
 PWC_LAW_TRADE_CONTROL: "Trade Control Law"
 PWC_LAW_TRADE_CONTROL_DESC: "Trade policy determines which resources remain at home and which enter exchange. The balance between openness and control shapes the city's relationship with outside markets and risks."
 PWC_LAW_TRADE_CONTROL_EFFECTS: "5 levels, starting at level 3; upgrades cost 75/100/150/200 political power in turn. Higher levels need the matching reform focus first."
 PWC_LAW_TRADE_CONTROL_L1: "Free Trade"
 PWC_LAW_TRADE_CONTROL_L1_DESC: "The city remains broadly open to outside exchange. Merchants and producers enjoy considerable freedom, while local supplies are closely connected to external markets."
 PWC_LAW_TRADE_CONTROL_L1_EFFECTS: "Level 1: +80% resources exported, +9% research speed, +6% fuel gain per oil."
 PWC_LAW_TRADE_CONTROL_L2: "Export Expansion"
 PWC_LAW_TRADE_CONTROL_L2_DESC: "The city actively organizes exports of resources and products. Sustained commercial exchange plays an important role in its allocation of supplies and outside relationships."
 PWC_LAW_TRADE_CONTROL_L2_EFFECTS: "Level 2: +66% resources exported, +6% research speed, +5% fuel gain per oil. Reaching this level needs 75 political power, 10% war support."
 PWC_LAW_TRADE_CONTROL_L3: "Balanced Control"
 PWC_LAW_TRADE_CONTROL_L3_DESC: "Trade administration seeks a measured balance between exchange and domestic retention, neither leaving all allocation to the market nor closing the city's supplies within its borders."
 PWC_LAW_TRADE_CONTROL_L3_EFFECTS: "Starting level: +50% resources exported, +5% research speed. Reaching this level needs 100 political power, 30% war support."
 PWC_LAW_TRADE_CONTROL_L4: "Export Restrictions"
 PWC_LAW_TRADE_CONTROL_L4_DESC: "Local industry and public needs take priority over exports. Tighter controls retain essential materials for the city's own production system."
 PWC_LAW_TRADE_CONTROL_L4_EFFECTS: "Level 4: +33% resources exported, +3% research speed, +5% resource gain efficiency. Reaching this level needs 150 political power, 50% war support, the matching reform focus."
 PWC_LAW_TRADE_CONTROL_L5: "Wartime Control"
 PWC_LAW_TRADE_CONTROL_L5_DESC: "Trade is subordinated to wartime allocation. Essential resources are retained centrally, and external exchange becomes part of the mobilization system rather than an independent commercial activity."
 PWC_LAW_TRADE_CONTROL_L5_EFFECTS: "Level 5: +20% resources exported, +10% resource gain efficiency, -3% stability. Reaching this level needs 200 political power, 70% war support, the matching reform focus."
 PWC_POLITICS_CATEGORY: "Domestic Affairs"
 PWC_POLITICS_CATEGORY_DESC: "Coordinate appointments and public policy, balancing administrative continuity with institutional change."
 PWC_SEAT_AIR_COMMAND: "Chief of Air Command"
 PWC_SEAT_AIR_COMMAND_DESC: "The air command office oversees flying instruction, air operations, and ground support, organizing aviation as a continuous service rather than isolated sorties."
 PWC_SEAT_ARMY_COMMAND: "Chief of Army Command"
 PWC_SEAT_ARMY_COMMAND_DESC: "The army command office directs training, organization, and operational preparation, bringing ground formations into a shared system of command."
 PWC_SEAT_CIVIL_ADMIN: "Chief of Civil Administration"
 PWC_SEAT_CIVIL_ADMIN_DESC: "The civil administration office coordinates districts, resident affairs, and public services, maintaining the ordinary routines on which city life depends."
 PWC_SEAT_ECONOMIC_PLANNING: "Director of Economic Planning"
 PWC_SEAT_ECONOMIC_PLANNING_DESC: "The economic planning office connects construction agencies and factories, bringing long-term development and immediate production needs into a common plan."
 PWC_SEAT_FINANCE_TRADE: "Director of Finance & Trade"
 PWC_SEAT_FINANCE_TRADE_DESC: "The finance and trade office manages resources and industrial circulation, balancing material supplies, business operations, and production commitments."
 PWC_SEAT_LOGISTICS_COMMAND: "Chief of Logistics & Transport"
 PWC_SEAT_LOGISTICS_COMMAND_DESC: "The logistics office follows supplies from factories to formations, coordinating storage, transport, maintenance, and recovery around practical needs."
 PWC_SEAT_MOBILIZATION_COMMAND: "Chief of Mobilization & Conscription"
 PWC_SEAT_MOBILIZATION_COMMAND_DESC: "The mobilization office connects recruitment, training, and replacements, organizing the city's manpower for defense without losing sight of civilian society."
 PWC_SEAT_NAVY_COMMAND: "Chief of Navy Command"
 PWC_SEAT_NAVY_COMMAND_DESC: "The naval command office coordinates fleets, ports, and maritime missions, connecting ship operations with crews, direction, and shore support."
 PWC_SEAT_SCIENCE_EDUCATION: "Director of Science & Education"
 PWC_SEAT_SCIENCE_EDUCATION_DESC: "The science and education office links research institutions, schools, and professional training, bringing knowledge into the practical work of the city."
 PWC_SPIRIT_ACADEMY_SCHOLARSHIPS: "Academy Scholarships"
 PWC_SPIRIT_ACADEMY_SCHOLARSHIPS_DESC: "Scholarships open military education to aspiring officers who could not otherwise attend, making recruitment a deliberate civic investment in talent."
 PWC_SPIRIT_ACADEMY_SCHOLARSHIPS_EFFECTS: "Army Academy spirit: +1 army leader starting level, -30% army leader cost. Costs 20 army experience."
 PWC_SPIRIT_BEST_OF_THE_BEST: "Best of the Best"
 PWC_SPIRIT_BEST_OF_THE_BEST_DESC: "The academy follows a tradition of demanding selection and concentrated education, investing substantial effort in preparing each future commander."
 PWC_SPIRIT_BEST_OF_THE_BEST_EFFECTS: "Army Academy spirit: +2 army leader starting level, +25% army leader cost. Costs 20 army experience."
 PWC_SPIRIT_BEST_OF_THE_BEST_NAVAL: "Naval Best of the Best"
 PWC_SPIRIT_BEST_OF_THE_BEST_NAVAL_DESC: "The naval academy combines demanding selection with careful education, assessing seamanship, discipline, and command responsibility together."
 PWC_SPIRIT_BEST_OF_THE_BEST_NAVAL_EFFECTS: "Naval Academy spirit: +2 navy leader starting level, +25% navy leader cost. Costs 20 navy experience."
 PWC_SPIRIT_GEO_GENERIC_APEX_CITY_COMMONWEALTH: "City Commonwealth"
 PWC_SPIRIT_GEO_GENERIC_APEX_CITY_COMMONWEALTH_DESC: "Shared deliberation and responsibility are established civic institutions. Durable coordination gives repairs and postwar recovery a reliable foundation."
 PWC_SPIRIT_GEO_GENERIC_CITY_COOPERATION: "City Cooperation"
 PWC_SPIRIT_GEO_GENERIC_CITY_COOPERATION_DESC: "Districts, workshops and public institutions share a stable working order. Common channels connect policy to local action and help hold the city together."
 PWC_SPIRIT_GEO_GENERIC_DEFENSE_COOPERATION: "Cooperative City Defense"
 PWC_SPIRIT_GEO_GENERIC_DEFENSE_COOPERATION_DESC: "Garrisons, engineers and residents know their respective duties. Local knowledge strengthens defensive preparations and helps fortifications serve their purpose."
 PWC_SPIRIT_GEO_GENERIC_EMERGENCY_SUPPORT: "Emergency Support"
 PWC_SPIRIT_GEO_GENERIC_EMERGENCY_SUPPORT_DESC: "Repair, medical and supply teams connect the front with the rear. Equipment failures and fatigue receive prompt attention, helping defenses withstand disruption."
 PWC_SPIRIT_GEO_GENERIC_INDUSTRIAL_COOPERATION: "Industrial Cooperation"
 PWC_SPIRIT_GEO_GENERIC_INDUSTRIAL_COOPERATION_DESC: "Common specifications and coordinated orders connect separate workshops. Existing machines and skilled workers support a steadier industrial system."
 PWC_SPIRIT_GEO_GENERIC_LOCAL_MOBILIZATION: "Local Mobilization"
 PWC_SPIRIT_GEO_GENERIC_LOCAL_MOBILIZATION_DESC: "Reserve rolls and regular training are rooted in districts and workplaces. Experienced organizers ensure that emergency mobilization no longer starts from zero."
 PWC_SPIRIT_GEO_GENERIC_LOGISTICS_COORDINATION: "Logistics Coordination"
 PWC_SPIRIT_GEO_GENERIC_LOGISTICS_COORDINATION_DESC: "Transport, storage and allocation follow a common schedule. Less wasted handling and waiting on vital routes allows limited supplies to sustain longer operations."
 PWC_SPIRIT_GEO_GENERIC_PUBLIC_WELFARE: "Public Welfare"
 PWC_SPIRIT_GEO_GENERIC_PUBLIC_WELFARE_DESC: "Markets, public stores and relief services keep basic supplies dependable. Confidence in daily life eases the burden of maintaining civic order."
 PWC_SPIRIT_GROUP_ACADEMY: "Army Academy"
 PWC_SPIRIT_GROUP_ACADEMY_DESC: "The army academy brings command knowledge and service traditions together. Its educational priorities shape how officers understand organization, terrain, and responsibility in battle."
 PWC_SPIRIT_GROUP_ACADEMY_EFFECTS: "An officer-corps branch with 8 spirits, each costing 20 experience."
 PWC_SPIRIT_GROUP_AIR_FORCE_ACADEMY_SPIRIT: "Air Training"
 PWC_SPIRIT_GROUP_AIR_FORCE_ACADEMY_SPIRIT_DESC: "Air training brings flying skills, mission experience, and safety into one curriculum. Its priorities shape the preparation and continuity of aircrews."
 PWC_SPIRIT_GROUP_AIR_FORCE_ACADEMY_SPIRIT_EFFECTS: "An officer-corps branch with 8 spirits, each costing 20 experience."
 PWC_SPIRIT_GROUP_AIR_FORCE_COMMAND_SPIRIT: "Air Operations Command"
 PWC_SPIRIT_GROUP_AIR_FORCE_COMMAND_SPIRIT_DESC: "Air operations command sets mission priorities. Air defence, frontline support, and deep strikes compete for crews and support, requiring a clear operational choice."
 PWC_SPIRIT_GROUP_AIR_FORCE_COMMAND_SPIRIT_EFFECTS: "An officer-corps branch with 8 spirits, each costing 50 experience."
 PWC_SPIRIT_GROUP_AIR_FORCE_SPIRIT: "Air Force Organisation"
 PWC_SPIRIT_GROUP_AIR_FORCE_SPIRIT_DESC: "Air force organisation coordinates training, ground crews, and airfields. Connecting crew rotation with ground support turns fleet size into sustained flying."
 PWC_SPIRIT_GROUP_AIR_FORCE_SPIRIT_EFFECTS: "An officer-corps branch with 8 spirits, each costing 35 experience."
 PWC_SPIRIT_GROUP_ARMY_SPIRIT: "Army Organisation"
 PWC_SPIRIT_GROUP_ARMY_SPIRIT_DESC: "Army organisation connects staff work, supply, and reserves. Its priorities shape how training, sustainment, and frontline rotation work together."
 PWC_SPIRIT_GROUP_ARMY_SPIRIT_EFFECTS: "An officer-corps branch with 8 spirits, each costing 35 experience."
 PWC_SPIRIT_GROUP_DIVISION_COMMAND_SPIRIT: "Division Command"
 PWC_SPIRIT_GROUP_DIVISION_COMMAND_SPIRIT_DESC: "Division command shapes how frontline units interpret missions and coordinate action. Initiative, concentrated fires, and rotation each serve different needs."
 PWC_SPIRIT_GROUP_DIVISION_COMMAND_SPIRIT_EFFECTS: "An officer-corps branch with 8 spirits, each costing 50 experience."
 PWC_SPIRIT_GROUP_NAVAL_ACADEMY: "Naval Academy"
 PWC_SPIRIT_GROUP_NAVAL_ACADEMY_DESC: "The naval academy connects seamanship, shipboard organization, and command education, establishing the professional foundations shared by future fleet officers."
 PWC_SPIRIT_GROUP_NAVAL_ACADEMY_EFFECTS: "An officer-corps branch with 8 spirits, each costing 20 experience."
 PWC_SPIRIT_GROUP_NAVAL_COMMAND_SPIRIT: "Fleet Command"
 PWC_SPIRIT_GROUP_NAVAL_COMMAND_SPIRIT_DESC: "Fleet command directs limited ships toward a defined maritime mission. Escort, concealed raiding, and landing support demand different arrangements."
 PWC_SPIRIT_GROUP_NAVAL_COMMAND_SPIRIT_EFFECTS: "An officer-corps branch with 8 spirits, each costing 50 experience."
 PWC_SPIRIT_GROUP_NAVY_SPIRIT: "Naval Organisation"
 PWC_SPIRIT_GROUP_NAVY_SPIRIT_DESC: "Naval organisation connects ports, repair facilities, and sea duties. Priorities among exercises, maintenance, and dispersed support shape the fleet's endurance."
 PWC_SPIRIT_GROUP_NAVY_SPIRIT_EFFECTS: "An officer-corps branch with 8 spirits, each costing 35 experience."
 PWC_SPIRIT_MASS_ASSAULT_ACADEMY: "Mass Mobilisation Curriculum"
 PWC_SPIRIT_MASS_ASSAULT_ACADEMY_DESC: "The mass mobilization curriculum studies the organization of large formations, emphasizing command structure, replacements, and collective discipline."
 PWC_SPIRIT_MASS_ASSAULT_ACADEMY_EFFECTS: "Army Academy spirit: +1 army leader starting defence, -15% army leader cost. Costs 20 army experience."
 PWC_SPIRIT_MOBILE_WARFARE_ACADEMY: "Mobile Warfare Curriculum"
 PWC_SPIRIT_MOBILE_WARFARE_ACADEMY_DESC: "The mobile warfare curriculum teaches the relationship between time, space, and cooperation, using exercises that demand judgment as situations change."
 PWC_SPIRIT_MOBILE_WARFARE_ACADEMY_EFFECTS: "Army Academy spirit: +1 army leader starting planning, +5% initiative. Costs 20 army experience."
 PWC_SPIRIT_NAVAL_ACADEMY_SCHOLARSHIPS: "Naval Academy Scholarships"
 PWC_SPIRIT_NAVAL_ACADEMY_SCHOLARSHIPS_DESC: "Naval scholarships bring a wider range of capable students into formal training, broadening the future officer corps beyond established families and circles."
 PWC_SPIRIT_NAVAL_ACADEMY_SCHOLARSHIPS_EFFECTS: "Naval Academy spirit: +1 navy leader starting level, -40% navy leader cost. Costs 20 navy experience."
 PWC_SPIRIT_PWC_AIR_ADVERSARY_TRAINING_SPIRIT: "Dissimilar Air Combat"
 PWC_SPIRIT_PWC_AIR_ADVERSARY_TRAINING_SPIRIT_DESC: "Dissimilar aircraft sharpen manoeuvre and mission learning through opposition exercises. Frequent intensive flying uses more fuel."
 PWC_SPIRIT_PWC_AIR_ADVERSARY_TRAINING_SPIRIT_EFFECTS: "Air Training spirit: +5% agility, +6% air wing mission experience gain, +5% air fuel consumption. Costs 20 air experience."
 PWC_SPIRIT_PWC_AIR_COMBAT_LEADER_SCHOOL_SPIRIT: "Air Combat Leader School"
 PWC_SPIRIT_PWC_AIR_COMBAT_LEADER_SCHOOL_SPIRIT_DESC: "Leadership courses concentrate on promising combat pilots, improving the chance of producing aces while slowing general training."
 PWC_SPIRIT_PWC_AIR_COMBAT_LEADER_SCHOOL_SPIRIT_EFFECTS: "Air Training spirit: +10% ace generation chance, -5% air wing training experience gain. Costs 20 air experience."
 PWC_SPIRIT_PWC_AIR_FUEL_MANAGEMENT_SPIRIT: "Aviation Fuel Management"
 PWC_SPIRIT_PWC_AIR_FUEL_MANAGEMENT_SPIRIT_DESC: "Fuel planning and economical routes conserve fuel and extend range. Strict sortie schedules reduce mission efficiency."
 PWC_SPIRIT_PWC_AIR_FUEL_MANAGEMENT_SPIRIT_EFFECTS: "Air Force Organisation spirit: -9% air fuel consumption, +3% air range, -5% air mission efficiency. Costs 35 air experience."
 PWC_SPIRIT_PWC_AIR_GROUND_CONTROL_SPIRIT: "Forward Air Control"
 PWC_SPIRIT_PWC_AIR_GROUND_CONTROL_SPIRIT_DESC: "Place air liaison teams on the main axis for stronger support at an interception cost."
 PWC_SPIRIT_PWC_AIR_GROUND_CONTROL_SPIRIT_EFFECTS: "Air Operations Command spirit: +6% close air support efficiency, +5% ground attack, -5% interception efficiency. Costs 50 air experience."
 PWC_SPIRIT_PWC_AIR_INTENSIVE_TRAINING_SPIRIT: "Intensive Flight Training"
 PWC_SPIRIT_PWC_AIR_INTENSIVE_TRAINING_SPIRIT_DESC: "Accelerate training experience through intensive flying at a higher accident risk."
 PWC_SPIRIT_PWC_AIR_INTENSIVE_TRAINING_SPIRIT_EFFECTS: "Air Training spirit: +10% air wing training experience gain, +3% air accidents chance. Costs 20 air experience."
 PWC_SPIRIT_PWC_AIR_MAINTENANCE_SPIRIT: "Professional Ground Crews"
 PWC_SPIRIT_PWC_AIR_MAINTENANCE_SPIRIT_DESC: "Improve reliability and mission efficiency with less time allocated to training."
 PWC_SPIRIT_PWC_AIR_MAINTENANCE_SPIRIT_EFFECTS: "Air Force Organisation spirit: -6% air accidents chance, +3% air mission efficiency, -5% air wing training experience gain. Costs 35 air experience."
 PWC_SPIRIT_PWC_AIR_RADAR_CONTROL_NETWORK_SPIRIT: "Radar Control Network"
 PWC_SPIRIT_PWC_AIR_RADAR_CONTROL_NETWORK_SPIRIT_DESC: "Radar stations and controllers share contacts for superiority and interception missions. Continuous watch reduces training time."
 PWC_SPIRIT_PWC_AIR_RADAR_CONTROL_NETWORK_SPIRIT_EFFECTS: "Air Force Organisation spirit: +9% fighter detection, +6% interception detection, -5% air wing training experience gain. Costs 35 air experience."

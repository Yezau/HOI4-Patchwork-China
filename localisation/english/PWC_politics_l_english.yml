 PWC_FOCUS_GEO_ISLAND_FISHING_FLEET: "Deep-Sea Fishing Fleet"
 PWC_FOCUS_GEO_ISLAND_FISHING_FLEET_DESC: "Fishing vessels sustain the island and preserve its seamanship. Organized harbors and support services will give the distant-water fleet a dependable home."

 PWC_FOCUS_CITY_GOVERNANCE_HUB: "City Governance Hub"
 PWC_FOCUS_CITY_GOVERNANCE_HUB_DESC: "Our districts cannot endure as isolated administrations. We must connect their offices into a government capable of coordinating civilian life, industry, and defense."
 PWC_FOCUS_CITY_GOVERNANCE_HUB_EFFECTS: "7 days: starts the focus tree."
 PWC_FOCUS_ECO_APEX_POWERHOUSE: "Integrate Our Industries"
 PWC_FOCUS_ECO_APEX_POWERHOUSE_DESC: "Our factories and trading firms need reliable support as production grows. We will coordinate industrial supply chains, energy, transport, and public services to sustain further expansion."
 PWC_FOCUS_ECO_APEX_POWERHOUSE_EFFECTS: "70 days: add 1 civilian factory in the capital; +1 shared building slots in the capital; add 1 military factory in the capital; +1 shared building slots in the capital; +5% factory output; +5% construction speed."
 PWC_FOCUS_ECO_ARMS_INDUSTRY: "Arms Industry"
 PWC_FOCUS_ECO_ARMS_INDUSTRY_DESC: "The city's defenders cannot depend entirely on outside weapons. Dedicated armaments production will connect military equipment needs with our own industrial capabilities."

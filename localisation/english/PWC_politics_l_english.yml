 PWC_FOCUS_ENDGAME_DEFENSIVE_DOCTRINE: "Defensive Doctrine"
 PWC_FOCUS_ENDGAME_DEFENSIVE_DOCTRINE_DESC: "The city's strength need not be spent on every gamble. We choose a defense built from prepared positions, reserves, and depth, preserving the means to act at the decisive moment."

 PWC_CAND_NAVY_LANDING_MASTER: "Landing Master"
 PWC_CAND_NAVY_LANDING_MASTER_DESC: "This officer specializes in amphibious sequencing, aligning embarkation, passage, and landing so that naval and ground plans meet at the shore."

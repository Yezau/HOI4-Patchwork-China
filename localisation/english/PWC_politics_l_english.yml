 PWC_DESIGNER_AIRCRAFT_MANUFACTURER: "Air Platform Contractor"
 PWC_DESIGNER_AIRCRAFT_MANUFACTURER_DESC: "Aircraft development depends on lasting cooperation between design, materials, engines, and flight testing. The aviation contractor brings these disciplines into a common program."
 PWC_DESIGNER_AIRCRAFT_MANUFACTURER_EFFECTS: "A research-and-production seat with 3 contractors to choose from, each boosting air research and the matching military industrial organizations."
 PWC_DESIGNER_AIR_MIO_CONSORTIUM: "Aerospace Consortium"
 PWC_DESIGNER_AIR_MIO_CONSORTIUM_DESC: "The aviation consortium sustains cooperation among airframe, engine, and equipment firms, connecting technical organization with shared safety practices."
 PWC_DESIGNER_AIR_MIO_CONSORTIUM_EFFECTS: "Candidate for Air Platform Contractor: +15% military industrial organization funds, -10% air accidents chance, and +5% air research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_AIR_RESEARCH_BUREAU: "Aeronautics Bureau"
 PWC_DESIGNER_AIR_RESEARCH_BUREAU_DESC: "The aviation bureau brings aerodynamics, structures, and mission requirements into a common design process, linking laboratory ideas with operational needs."
 PWC_DESIGNER_AIR_RESEARCH_BUREAU_EFFECTS: "Candidate for Air Platform Contractor: +5% military industrial organization research, and +9% air research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_AIR_SERIAL_WORKS: "Air Serial Works"
 PWC_DESIGNER_AIR_SERIAL_WORKS_DESC: "The air serial works organizes aircraft manufacturing into repeatable assembly processes, preserving proven methods through tooling, component coordination, and production records."
 PWC_DESIGNER_AIR_SERIAL_WORKS_EFFECTS: "Candidate for Air Platform Contractor: +10% factory output, +10% production efficiency growth, and +5% air research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_INDUSTRIAL_CONCERN: "Municipal Industrial Group"
 PWC_DESIGNER_INDUSTRIAL_CONCERN_DESC: "The industrial concern links research, construction, and business organization, coordinating tasks that extend beyond any single factory."
 PWC_DESIGNER_INDUSTRIAL_CONCERN_EFFECTS: "A research-and-production seat with 9 contractors to choose from, each boosting industrial research and the matching military industrial organizations."
 PWC_DESIGNER_INDUSTRY_CHEMICAL: "Hengxin Chemical Industries"
 PWC_DESIGNER_INDUSTRY_CHEMICAL_DESC: "Synthetic refineries and improved oil processing supply fuel for industry and the armed forces."
 PWC_DESIGNER_INDUSTRY_CHEMICAL_EFFECTS: "Candidate for Municipal Industrial Group: +20% synthetic refinery construction speed, +10% fuel gain per oil, and +5% industrial research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_INDUSTRY_CONSTRUCTION: "Municipal Construction Corporation"
 PWC_DESIGNER_INDUSTRY_CONSTRUCTION_DESC: "Standardized engineering teams coordinate factories, roads and municipal construction."
 PWC_DESIGNER_INDUSTRY_CONSTRUCTION_EFFECTS: "Candidate for Municipal Industrial Group: +15% civilian factory construction speed, +10% infrastructure construction speed, and +5% industrial research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_INDUSTRY_CONVERSION_WORKS: "Conversion Works"
 PWC_DESIGNER_INDUSTRY_CONVERSION_WORKS_DESC: "The industrial conversion group reorganizes buildings, machinery, and production tasks while preserving usable industrial foundations during a change of purpose."
 PWC_DESIGNER_INDUSTRY_CONVERSION_WORKS_EFFECTS: "Candidate for Municipal Industrial Group: -15% civilian to military conversion cost, +10% factory output, and +5% industrial research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_INDUSTRY_ELECTRICAL: "Huaguang Electrical Works"
 PWC_DESIGNER_INDUSTRY_ELECTRICAL_DESC: "Electronics laboratories and installation teams develop radar and urban electrical networks."
 PWC_DESIGNER_INDUSTRY_ELECTRICAL_EFFECTS: "Candidate for Municipal Industrial Group: +20% radar station construction speed, +5% infrastructure construction speed, and +10% electronics research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_INDUSTRY_MINING: "United Mining and Metallurgy"
 PWC_DESIGNER_INDUSTRY_MINING_DESC: "Coordinated mining, smelting and material supply improve resource yields and factory efficiency."
 PWC_DESIGNER_INDUSTRY_MINING_EFFECTS: "Candidate for Municipal Industrial Group: +15% resource gain efficiency, +5% production efficiency cap, and +5% industrial research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_INDUSTRY_MIO_CONSORTIUM: "Municipal Consortium"
 PWC_DESIGNER_INDUSTRY_MIO_CONSORTIUM_DESC: "The city industrial consortium provides a shared framework for research institutions and manufacturers, combining specialist capabilities through long-term cooperation."
 PWC_DESIGNER_INDUSTRY_MIO_CONSORTIUM_EFFECTS: "Candidate for Municipal Industrial Group: +20% military industrial organization funds, +3% military industrial organization research, and +5% industrial research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_INDUSTRY_RAILWAY: "Tongda Railway Engineering"
 PWC_DESIGNER_INDUSTRY_RAILWAY_DESC: "Railway engineers connect mines, industrial districts and urban transport hubs."
 PWC_DESIGNER_INDUSTRY_RAILWAY_EFFECTS: "Candidate for Municipal Industrial Group: +20% railway construction speed, +10% infrastructure construction speed, and +5% industrial research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_INDUSTRY_RESEARCH_BUREAU: "Industrial Institute"
 PWC_DESIGNER_INDUSTRY_RESEARCH_BUREAU_DESC: "The industrial research institute connects experiments, engineering standards, and practical experience so that new knowledge can enter construction and manufacturing."
 PWC_DESIGNER_INDUSTRY_RESEARCH_BUREAU_EFFECTS: "Candidate for Municipal Industrial Group: +10% construction speed, and +9% industrial research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_INDUSTRY_STEEL: "Huaxing Heavy Industries"
 PWC_DESIGNER_INDUSTRY_STEEL_DESC: "Heavy forging, rolled steel and industrial machinery support new arms factories."
 PWC_DESIGNER_INDUSTRY_STEEL_EFFECTS: "Candidate for Municipal Industrial Group: +15% arms factory construction speed, +5% civilian factory construction speed, and +5% industrial research. Appointing or replacing costs 100 political power. The two industrial seats share this pool; each company can be appointed once."
 PWC_DESIGNER_LAND_MIO_CONSORTIUM: "Land Industrial Consortium"
 PWC_DESIGNER_LAND_MIO_CONSORTIUM_DESC: "The land industrial consortium coordinates orders, technology, and investment among specialist firms, sustaining equipment programs beyond the reach of a single manufacturer."
 PWC_DESIGNER_LAND_MIO_CONSORTIUM_EFFECTS: "Candidate for Land Platform Contractor: +15% military industrial organization funds, +3% military industrial organization research, and +5% armor research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_LAND_RESEARCH_BUREAU: "Land Warfare Bureau"
 PWC_DESIGNER_LAND_RESEARCH_BUREAU_DESC: "The land warfare bureau studies armored vehicles and ground equipment, maintaining a shared technical language between research teams and manufacturing plants."
 PWC_DESIGNER_LAND_RESEARCH_BUREAU_EFFECTS: "Candidate for Land Platform Contractor: +5% military industrial organization research, and +9% armor research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_LAND_SERIAL_WORKS: "Land Serial Works"
 PWC_DESIGNER_LAND_SERIAL_WORKS_DESC: "The land serial works turns approved designs into dependable production batches through organized processes, component supply, and assembly discipline."
 PWC_DESIGNER_LAND_SERIAL_WORKS_EFFECTS: "Candidate for Land Platform Contractor: +10% factory output, +10% production efficiency cap, and +5% armor research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_MATERIEL_MANUFACTURER: "Materiel Contractor"
 PWC_DESIGNER_MATERIEL_MANUFACTURER_DESC: "Military materiel takes many forms but must work together in service. The contractor organizes design, purchasing, and manufacturing standards around dependable supply."
 PWC_DESIGNER_MATERIEL_MANUFACTURER_EFFECTS: "A research-and-production seat with 3 contractors to choose from, each boosting army research and the matching military industrial organizations."
 PWC_DESIGNER_MATERIEL_MIO_CONSORTIUM: "Materiel Consortium"
 PWC_DESIGNER_MATERIEL_MIO_CONSORTIUM_DESC: "The materiel consortium coordinates materials and contracts across dispersed producers, preserving cooperation when supplies fluctuate."
 PWC_DESIGNER_MATERIEL_MIO_CONSORTIUM_EFFECTS: "Candidate for Materiel Contractor: +15% military industrial organization funds, -15% lack of resources penalty, and +5% army research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_MATERIEL_RESEARCH_BUREAU: "Materiel Bureau"
 PWC_DESIGNER_MATERIEL_RESEARCH_BUREAU_DESC: "The materiel bureau studies equipment through field use and recovery, seeking designs that can be understood, maintained, and returned to service."
 PWC_DESIGNER_MATERIEL_RESEARCH_BUREAU_EFFECTS: "Candidate for Materiel Contractor: +5% equipment capture ratio, and +9% army research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_MATERIEL_SERIAL_WORKS: "Materiel Serial Works"
 PWC_DESIGNER_MATERIEL_SERIAL_WORKS_DESC: "The materiel serial works organizes standard processes and reliable deliveries, treating everyday equipment as a complete support system rather than scattered small orders."
 PWC_DESIGNER_MATERIEL_SERIAL_WORKS_EFFECTS: "Candidate for Materiel Contractor: +10% factory output, -10% supply consumption, and +5% army research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_NAVAL_MANUFACTURER: "Naval Platform Contractor"
 PWC_DESIGNER_NAVAL_MANUFACTURER_DESC: "Ships require coordination between drawing offices, yards, and maritime operations. The naval contractor connects designers, builders, and the fleet throughout development."
 PWC_DESIGNER_NAVAL_MANUFACTURER_EFFECTS: "A research-and-production seat with 3 contractors to choose from, each boosting naval research and the matching military industrial organizations."
 PWC_DESIGNER_NAVAL_MIO_CONSORTIUM: "Maritime Consortium"
 PWC_DESIGNER_NAVAL_MIO_CONSORTIUM_DESC: "The naval consortium links yards, maritime support, and specialist suppliers, planning industrial cooperation around the full service life of a vessel."
 PWC_DESIGNER_NAVAL_MIO_CONSORTIUM_EFFECTS: "Candidate for Naval Platform Contractor: +15% military industrial organization funds, +5% convoy escort efficiency, and +5% naval research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_NAVAL_RESEARCH_BUREAU: "Naval Research Bureau"
 PWC_DESIGNER_NAVAL_RESEARCH_BUREAU_DESC: "The naval bureau studies hulls, propulsion, and mission equipment, using trials and engineering reviews to connect shipyards with fleet requirements."
 PWC_DESIGNER_NAVAL_RESEARCH_BUREAU_EFFECTS: "Candidate for Naval Platform Contractor: +5% military industrial organization research, and +9% naval research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_NAVAL_SERIAL_WORKS: "Naval Serial Yards"
 PWC_DESIGNER_NAVAL_SERIAL_WORKS_DESC: "The naval serial yards coordinate the sequence of large ship construction, aligning sections, equipment deliveries, and outfitting in a practical yard schedule."
 PWC_DESIGNER_NAVAL_SERIAL_WORKS_EFFECTS: "Candidate for Naval Platform Contractor: +20% dockyard output, and +5% naval research. Appointing or replacing costs 100 political power."
 PWC_DESIGNER_TANK_MANUFACTURER: "Land Platform Contractor"
 PWC_DESIGNER_TANK_MANUFACTURER_DESC: "Land platforms require coordination between vehicle design, manufacturing, and service use. The contractor connects the city's industrial capabilities with practical equipment development."
 PWC_DESIGNER_TANK_MANUFACTURER_EFFECTS: "A research-and-production seat with 3 contractors to choose from, each boosting armor research and the matching military industrial organizations."

 PWC_FOCUS_GOV_STREAMLINED_ADMINISTRATION: "Streamlined Administration"
 PWC_FOCUS_GOV_STREAMLINED_ADMINISTRATION_DESC: "Duplicated approvals and endless referrals exhaust the city. Clear responsibilities and shorter administrative chains will let decisions reach the people who must carry them out."

l_english:
 PWC_BONUS_MIL_AIR_CAS_COMMAND: "air research bonus"
 PWC_BONUS_MIL_AIR_DRONE_PROGRAM: "air research bonus"
 PWC_BONUS_MIL_MECHANIZED_INITIATIVE: "armor research bonus"
 PWC_CABINET_CLOSE_TIP: "Close the cabinet console"
 PWC_CABINET_REOPEN: "Open the Cabinet Console"
 PWC_CABINET_REOPEN_DESC: "Show the cabinet console window again after closing it."
 PWC_CABINET_TITLE: "City Cabinet Console"
 PWC_CAND_AIR_ACE_TALENT_SCOUT: "Ace Talent Scout"
 PWC_CAND_AIR_ACE_TALENT_SCOUT_DESC: "This talent scout recognizes observation, teamwork, and judgment in promising pilots, developing individuals who can strengthen an entire formation."
 PWC_CAND_AIR_ACE_TALENT_SCOUT_EFFECTS: "Candidate for the Chief of Air Command seat: +10% ace generation chance, +10% air attack, +0.12 daily air experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_AIR_ACE_TALENT_SCOUT_GUIDANCE: "Chief of Air Command: Identifies promising pilots and develops combat performers into effective aces.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_AIR_AGILITY_INSTRUCTOR: "Agility Instructor"
 PWC_CAND_AIR_AGILITY_INSTRUCTOR_DESC: "This instructor teaches more than prescribed maneuvers. He develops judgment under changing conditions so that flying skills serve decisions in combat."
 PWC_CAND_AIR_AGILITY_INSTRUCTOR_EFFECTS: "Candidate for the Chief of Air Command seat: +15% agility, +10% air attack, +5% fighter detection, +0.12 daily air experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_AIR_AGILITY_INSTRUCTOR_GUIDANCE: "Chief of Air Command: Drills manoeuvring and positioning to combine agility with offensive firepower.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_AIR_DOGFIGHT_ACE: "Dogfight Ace"
 PWC_CAND_AIR_DOGFIGHT_ACE_DESC: "This veteran fighter pilot values situational judgment and cooperation between wingmen, turning personal experience into methods the whole wing can practice."
 PWC_CAND_AIR_DOGFIGHT_ACE_EFFECTS: "Candidate for the Chief of Air Command seat: +15% air attack, +10% agility, +5% fighter detection, +0.12 daily air experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_AIR_DOGFIGHT_ACE_GUIDANCE: "Chief of Air Command: Centres training on offensive air combat, agility and finding the enemy.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_AIR_GROUND_CREW_INSPECTOR: "Ground Crew Inspector"
 PWC_CAND_AIR_GROUND_CREW_INSPECTOR_DESC: "This inspector believes a safe sortie begins with overlooked details on the ground. Checks, handovers, and maintenance records connect ground crews with flying operations."
 PWC_CAND_AIR_GROUND_CREW_INSPECTOR_EFFECTS: "Candidate for the Chief of Air Command seat: -10% air accidents chance, +10% air defense, +5% ace generation chance, +0.12 daily air experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_AIR_GROUND_CREW_INSPECTOR_GUIDANCE: "Chief of Air Command: Reduces accidents through maintenance discipline and reliable ground support.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_AIR_SKY_SHIELD: "Sky Shield"
 PWC_CAND_AIR_SKY_SHIELD_DESC: "This air commander treats air defense as a continuous organization of warning, mutual support, and recovery rather than a burden carried by isolated pilots."
 PWC_CAND_AIR_SKY_SHIELD_EFFECTS: "Candidate for the Chief of Air Command seat: +15% air defense, +10% agility, +0.12 daily air experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_AIR_SKY_SHIELD_GUIDANCE: "Chief of Air Command: Protects aircraft through defence and agility, not bonuses to ground anti-aircraft guns.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ARM_BULWARK_COMMANDER: "Bulwark Commander"
 PWC_CAND_ARM_BULWARK_COMMANDER_DESC: "This commander values reserve positions and follow-up plans as much as the front line, preparing units to protect one another before the enemy arrives."
 PWC_CAND_ARM_BULWARK_COMMANDER_EFFECTS: "Candidate for the Chief of Army Command seat: +15% division defense, +10% division defense on core territory, +0.5 max entrenchment, +0.12 daily army experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_ARM_BULWARK_COMMANDER_GUIDANCE: "Chief of Army Command: Preserves forces through layered defensive positions and sustained entrenchment.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ARM_FORTRESS_WARDEN: "Fortress Warden"
 PWC_CAND_ARM_FORTRESS_WARDEN_DESC: "This garrison officer connects shelters, observation posts, and covered routes. He sees a fortress as careful preparation, not merely a symbol on a map."
 PWC_CAND_ARM_FORTRESS_WARDEN_EFFECTS: "Candidate for the Chief of Army Command seat: +15% division defense on core territory, +10% division defense, +5% entrenchment speed, +0.12 daily army experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_ARM_FORTRESS_WARDEN_GUIDANCE: "Chief of Army Command: Prioritises core-territory defence and rapid entrenchment before counterattacking.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ARM_IRON_FIST_COMMANDER: "Iron Fist Commander"
 PWC_CAND_ARM_IRON_FIST_COMMANDER_DESC: "This commander concentrates forces around a clear objective, joining reconnaissance, supporting fire, and assault in a determined operational sequence."
 PWC_CAND_ARM_IRON_FIST_COMMANDER_EFFECTS: "Candidate for the Chief of Army Command seat: +15% division attack, +10% division attack on core territory, +5% entrenchment speed, +0.12 daily army experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_ARM_IRON_FIST_COMMANDER_GUIDANCE: "Chief of Army Command: Concentrates force for offensive action and organises positions after each advance.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ARM_IRON_ORGANIZER: "Iron Organizer"
 PWC_CAND_ARM_IRON_ORGANIZER_DESC: "This organizer tackles confused formations and unclear orders. Common training and responsibilities turn units on a roster into a functioning army."
 PWC_CAND_ARM_IRON_ORGANIZER_EFFECTS: "Candidate for the Chief of Army Command seat: +15% division organization, +0.12 daily army experience gain, +10% division attack. Appointing or replacing costs 100 political power."
 PWC_CAND_ARM_IRON_ORGANIZER_GUIDANCE: "Chief of Army Command: Maintains army organisation through consistent command and unit reorganisation.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ARM_URBAN_ASSAULT_LEADER: "Urban Assault Leader"
 PWC_CAND_ARM_URBAN_ASSAULT_LEADER_DESC: "This assault leader understands fighting among streets and buildings. Small-unit communication and discipline keep urban operations from becoming isolated charges."
 PWC_CAND_ARM_URBAN_ASSAULT_LEADER_EFFECTS: "Candidate for the Chief of Army Command seat: +15% division attack on core territory, +10% division attack, +2 special forces cap, +0.12 daily army experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_ARM_URBAN_ASSAULT_LEADER_GUIDANCE: "Chief of Army Command: Favours counterattacks on core territory; this role adds no separate urban-terrain bonus.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_CIVIL_CITY_ANCHOR: "City Anchor"
 PWC_CAND_CIVIL_CITY_ANCHOR_DESC: "This coordinator finds common ground between departments and districts. His first concern is preserving residents' trust in a dependable civic order."
 PWC_CAND_CIVIL_CITY_ANCHOR_EFFECTS: "Candidate for the Chief of Civil Administration seat: +10% stability, +5% political power gain, +5% war support. Appointing or replacing costs 100 political power."
 PWC_CAND_CIVIL_CITY_ANCHOR_GUIDANCE: "Chief of Civil Administration: Builds public trust through neighbourhood councils and open coordination.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_CIVIL_CITY_PSYCHOLOGIST: "City Psychologist"
 PWC_CAND_CIVIL_CITY_PSYCHOLOGIST_DESC: "Prolonged turmoil cannot be answered by orders alone. This civic psychologist emphasizes listening and community contact to rebuild trust among anxious residents."
 PWC_CAND_CIVIL_CITY_PSYCHOLOGIST_EFFECTS: "Candidate for the Chief of Civil Administration seat: +0.1% weekly stability, -5% consumer goods factories, +5% political power gain. Appointing or replacing costs 100 political power."
 PWC_CAND_CIVIL_CITY_PSYCHOLOGIST_GUIDANCE: "Chief of Civil Administration: Rebuilds community trust steadily after prolonged unrest rather than chasing headlines.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_CIVIL_RALLY_ORATOR: "Rally Orator"
 PWC_CAND_CIVIL_RALLY_ORATOR_DESC: "This speaker turns abstract public aims into a cause residents can understand. He believes endurance begins with explaining what the city is working to preserve."
 PWC_CAND_CIVIL_RALLY_ORATOR_EFFECTS: "Candidate for the Chief of Civil Administration seat: +10% war support, +5% stability, +5% political power gain. Appointing or replacing costs 100 political power."
 PWC_CAND_CIVIL_RALLY_ORATOR_GUIDANCE: "Chief of Civil Administration: Unites competing local concerns behind a common cause and support for the war effort.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_CIVIL_VETERAN_ADMINISTRATOR: "Veteran Administrator"
 PWC_CAND_CIVIL_VETERAN_ADMINISTRATOR_DESC: "An experienced administrator who understands how offices actually work. He keeps government functioning through patient coordination and dependable decisions."
 PWC_CAND_CIVIL_VETERAN_ADMINISTRATOR_EFFECTS: "Candidate for the Chief of Civil Administration seat: +10% political power gain, +5% stability, +0.05% weekly stability. Appointing or replacing costs 100 political power."
 PWC_CAND_CIVIL_VETERAN_ADMINISTRATOR_GUIDANCE: "Chief of Civil Administration: Clears administrative backlogs and turns political capital into reliable government.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_CIVIL_WELFARE_OFFICER: "Welfare Officer"
 PWC_CAND_CIVIL_WELFARE_OFFICER_DESC: "This welfare officer starts with food, shelter, and everyday necessities. He judges public administration by how well it cares for ordinary life."
 PWC_CAND_CIVIL_WELFARE_OFFICER_EFFECTS: "Candidate for the Chief of Civil Administration seat: -10% consumer goods factories, +5% stability, +5% war support. Appointing or replacing costs 100 political power."
 PWC_CAND_CIVIL_WELFARE_OFFICER_GUIDANCE: "Chief of Civil Administration: Protects essential services and household supplies while easing pressure on industry.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ECO_ARSENAL_DIRECTOR: "Arsenal Director"
 PWC_CAND_ECO_ARSENAL_DIRECTOR_DESC: "This arsenal director translates military requirements into workshop processes and schedules, treating dependable industrial organization as part of every delivery."
 PWC_CAND_ECO_ARSENAL_DIRECTOR_EFFECTS: "Candidate for the Director of Economic Planning seat: +15% arms factory construction speed, +10% factory output, +10% civilian factory construction speed. Appointing or replacing costs 100 political power."
 PWC_CAND_ECO_ARSENAL_DIRECTOR_GUIDANCE: "Director of Economic Planning: Expands arsenals and schedules deliveries around the immediate needs of the front.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ECO_CIVILIAN_FACTORY_DIRECTOR: "Civilian Factory Director"
 PWC_CAND_ECO_CIVILIAN_FACTORY_DIRECTOR_DESC: "A factory director shaped by civilian manufacturing. He understands the link between workshops and markets and sees everyday production as the city's foundation."
 PWC_CAND_ECO_CIVILIAN_FACTORY_DIRECTOR_EFFECTS: "Candidate for the Director of Economic Planning seat: +15% civilian factory construction speed, +10% factory output, +10% construction speed. Appointing or replacing costs 100 political power."
 PWC_CAND_ECO_CIVILIAN_FACTORY_DIRECTOR_GUIDANCE: "Director of Economic Planning: Builds civilian industry first to sustain a larger construction and production network.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ECO_INDUSTRIAL_CZAR: "Industrial Czar"
 PWC_CAND_ECO_INDUSTRIAL_CZAR_DESC: "This industrial coordinator looks beyond individual workshops. He organizes supplies, processes, and factory development as parts of an interconnected system."
 PWC_CAND_ECO_INDUSTRIAL_CZAR_EFFECTS: "Candidate for the Director of Economic Planning seat: +15% factory output, +10% civilian factory construction speed, +10% arms factory construction speed. Appointing or replacing costs 100 political power."
 PWC_CAND_ECO_INDUSTRIAL_CZAR_GUIDANCE: "Director of Economic Planning: Coordinates factory expansion and military orders into a continuous industrial programme.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ECO_INFRASTRUCTURE_ENGINEER: "Infrastructure Engineer"
 PWC_CAND_ECO_INFRASTRUCTURE_ENGINEER_DESC: "This engineer sees roads, utilities, and public works as one network. He focuses on the connections that let the city's separate districts function together."
 PWC_CAND_ECO_INFRASTRUCTURE_ENGINEER_EFFECTS: "Candidate for the Director of Economic Planning seat: +15% infrastructure construction speed, +10% construction speed, +10% factory output. Appointing or replacing costs 100 political power."
 PWC_CAND_ECO_INFRASTRUCTURE_ENGINEER_GUIDANCE: "Director of Economic Planning: Removes infrastructure bottlenecks before further factory and urban expansion.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_ECO_MASTER_BUILDER: "Master Builder"
 PWC_CAND_ECO_MASTER_BUILDER_DESC: "This chief engineer understands construction from surveying to inspection. He brings designs, materials, and crews into a common plan before work begins."
 PWC_CAND_ECO_MASTER_BUILDER_EFFECTS: "Candidate for the Director of Economic Planning seat: +15% construction speed, +10% infrastructure construction speed, +10% factory output. Appointing or replacing costs 100 political power."
 PWC_CAND_ECO_MASTER_BUILDER_GUIDANCE: "Director of Economic Planning: Uses standard construction methods and scheduling to support broad urban development.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_FIN_CONVERSION_PLANNER: "Conversion Planner"
 PWC_CAND_FIN_CONVERSION_PLANNER_DESC: "This planner specializes in changing a factory's task. Equipment, workers, and materials must move together if conversion is to avoid becoming a complete restart."
 PWC_CAND_FIN_CONVERSION_PLANNER_EFFECTS: "Candidate for the Director of Finance & Trade seat: -10% civilian to military conversion cost, +10% production efficiency growth, +10% resource gain efficiency. Appointing or replacing costs 100 political power."
 PWC_CAND_FIN_CONVERSION_PLANNER_GUIDANCE: "Director of Finance & Trade: Plans machinery and workforce conversion before civilian factories shift to military work.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_FIN_ENERGY_BROKER: "Energy Broker"
 PWC_CAND_FIN_ENERGY_BROKER_DESC: "This energy broker knows suppliers, transport links, and factory needs. He searches for alternative channels when shortages threaten the city's essential flows."
 PWC_CAND_FIN_ENERGY_BROKER_EFFECTS: "Candidate for the Director of Finance & Trade seat: +15% fuel gain per oil, +10% resource gain efficiency, +10% production efficiency growth. Appointing or replacing costs 100 political power."
 PWC_CAND_FIN_ENERGY_BROKER_GUIDANCE: "Director of Finance & Trade: Coordinates energy and resource supply to support fuel generation and factory output.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_FIN_LEAN_MANAGER: "Lean Manager"
 PWC_CAND_FIN_LEAN_MANAGER_DESC: "This manager treats idle time, waiting, and rework as organizational problems. He turns workshop experience into clear, shared production routines."
 PWC_CAND_FIN_LEAN_MANAGER_EFFECTS: "Candidate for the Director of Finance & Trade seat: +15% production efficiency growth, +10% production efficiency cap, -5% civilian to military conversion cost. Appointing or replacing costs 100 political power."
 PWC_CAND_FIN_LEAN_MANAGER_GUIDANCE: "Director of Finance & Trade: Improves workflows and shop-floor coordination so production lines mature sooner.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_FIN_OUTPUT_OPTIMIZER: "Output Optimizer"
 PWC_CAND_FIN_OUTPUT_OPTIMIZER_DESC: "This organizer studies bottlenecks and equipment use rather than simply demanding longer shifts. He seeks a stable rhythm across the entire production process."
 PWC_CAND_FIN_OUTPUT_OPTIMIZER_EFFECTS: "Candidate for the Director of Finance & Trade seat: +15% production efficiency cap, +10% production efficiency growth, +10% fuel gain per oil. Appointing or replacing costs 100 political power."
 PWC_CAND_FIN_OUTPUT_OPTIMIZER_GUIDANCE: "Director of Finance & Trade: Raises the long-term potential of mature lines through stable processes and supplies.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_FIN_RESOURCE_SURVEYOR: "Resource Surveyor"
 PWC_CAND_FIN_RESOURCE_SURVEYOR_DESC: "This surveyor trusts field records over optimistic estimates. He examines the whole path from a resource deposit to a usable industrial supply."
 PWC_CAND_FIN_RESOURCE_SURVEYOR_EFFECTS: "Candidate for the Director of Finance & Trade seat: +15% resource gain efficiency, +10% fuel gain per oil, +10% production efficiency cap. Appointing or replacing costs 100 political power."
 PWC_CAND_FIN_RESOURCE_SURVEYOR_GUIDANCE: "Director of Finance & Trade: Organises surveys and extraction to make better use of domestic resources.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_LOG_FUEL_STEWARD: "Fuel Steward"
 PWC_CAND_LOG_FUEL_STEWARD_DESC: "This fuel steward follows every handover between depots and vehicles, aligning storage, distribution, and use so that scarce fuel has a clear destination."
 PWC_CAND_LOG_FUEL_STEWARD_EFFECTS: "Candidate for the Chief of Logistics & Transport seat: -10% army fuel consumption, -10% division attrition, -10% supply consumption. Appointing or replacing costs 100 political power."
 PWC_CAND_LOG_FUEL_STEWARD_GUIDANCE: "Chief of Logistics & Transport: Cuts army fuel use through vehicle discipline; it does not cut naval or aircraft fuel use.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_LOG_RETOOLING_MASTER: "Retooling Master"
 PWC_CAND_LOG_RETOOLING_MASTER_DESC: "This coordinator manages materials and equipment during production changes, carrying useful experience from old processes into new assignments."
 PWC_CAND_LOG_RETOOLING_MASTER_EFFECTS: "Candidate for the Chief of Logistics & Transport seat: +15% production efficiency retention, -10% supply consumption, -5% non-combat out of supply penalties. Appointing or replacing costs 100 political power."
 PWC_CAND_LOG_RETOOLING_MASTER_GUIDANCE: "Chief of Logistics & Transport: Preserves production efficiency during equipment changes and eases supply demand.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_LOG_SALVAGE_EXPERT: "Battlefield Salvage Expert"
 PWC_CAND_LOG_SALVAGE_EXPERT_DESC: "This recovery specialist organizes the identification, collection, and repair of battlefield equipment, returning usable material to the support system."
 PWC_CAND_LOG_SALVAGE_EXPERT_EFFECTS: "Candidate for the Chief of Logistics & Transport seat: -15% supply consumption, +5% equipment capture ratio, -10% division attrition. Appointing or replacing costs 100 political power."
 PWC_CAND_LOG_SALVAGE_EXPERT_GUIDANCE: "Chief of Logistics & Transport: Recovers battlefield equipment and reuses scarce supplies for units still in action.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_LOG_SUPPLY_GUARDIAN: "Supply Guardian"
 PWC_CAND_LOG_SUPPLY_GUARDIAN_DESC: "This logistician works backward from the soldier's last usable tool, emphasizing storage, maintenance, and reliable handovers throughout the supply chain."
 PWC_CAND_LOG_SUPPLY_GUARDIAN_EFFECTS: "Candidate for the Chief of Logistics & Transport seat: -15% division attrition, -5% non-combat out of supply penalties, -10% supply consumption. Appointing or replacing costs 100 political power."
 PWC_CAND_LOG_SUPPLY_GUARDIAN_GUIDANCE: "Chief of Logistics & Transport: Limits attrition through preventive maintenance and careful use of supplies.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_LOG_SUPPLY_LINE_ENGINEER: "Supply Line Engineer"
 PWC_CAND_LOG_SUPPLY_LINE_ENGINEER_DESC: "This engineer treats roads, hubs, and transport organization as one supply line, preparing alternatives when a single connection fails."
 PWC_CAND_LOG_SUPPLY_LINE_ENGINEER_EFFECTS: "Candidate for the Chief of Logistics & Transport seat: -10% non-combat out of supply penalties, -10% division attrition, -5% army fuel consumption. Appointing or replacing costs 100 political power."
 PWC_CAND_LOG_SUPPLY_LINE_ENGINEER_GUIDANCE: "Chief of Logistics & Transport: Mitigates out-of-supply penalties on advancing fronts without creating supply capacity.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_MOB_DEEP_OPERATIONS_SCHOLAR: "Deep Operations Scholar"
 PWC_CAND_MOB_DEEP_OPERATIONS_SCHOLAR_DESC: "This scholar asks what follows the first action, studying depth, later echelons, and long-term aims rather than planning only for the initial line of contact."
 PWC_CAND_MOB_DEEP_OPERATIONS_SCHOLAR_EFFECTS: "Candidate for the Chief of Mobilization & Conscription seat: +10% max planning, +5% planning speed, +5% entrenchment speed. Appointing or replacing costs 100 political power."
 PWC_CAND_MOB_DEEP_OPERATIONS_SCHOLAR_GUIDANCE: "Chief of Mobilization & Conscription: Develops thorough operational plans and prepared positions for sustained campaigns.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_MOB_FORCED_MARCH_INSTRUCTOR: "Forced March Instructor"
 PWC_CAND_MOB_FORCED_MARCH_INSTRUCTOR_DESC: "This instructor teaches formations to preserve order on long marches, combining endurance, rotation, and communication so they arrive ready to act together."
 PWC_CAND_MOB_FORCED_MARCH_INSTRUCTOR_EFFECTS: "Candidate for the Chief of Mobilization & Conscription seat: -10% org loss when moving, +10% division recovery rate, +5% reinforce rate. Appointing or replacing costs 100 political power."
 PWC_CAND_MOB_FORCED_MARCH_INSTRUCTOR_GUIDANCE: "Chief of Mobilization & Conscription: Preserves organisation on the march rather than directly increasing movement speed.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_MOB_GRAND_PLANNER: "Grand Planner"
 PWC_CAND_MOB_GRAND_PLANNER_DESC: "This planner assigns responsibility for every stage before an operation, treating preparation as the means by which separate units acquire a common rhythm."
 PWC_CAND_MOB_GRAND_PLANNER_EFFECTS: "Candidate for the Chief of Mobilization & Conscription seat: +10% planning speed, +5% max planning, +10% division recovery rate. Appointing or replacing costs 100 political power."
 PWC_CAND_MOB_GRAND_PLANNER_GUIDANCE: "Chief of Mobilization & Conscription: Schedules deployments and planning for forces that must prepare successive offensives.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_MOB_MORALE_INSPIRER: "Morale Inspirer"
 PWC_CAND_MOB_MORALE_INSPIRER_DESC: "This mobilization officer connects demanding preparation with a shared purpose, using clear plans and sustained communication to preserve a sense of common effort."
 PWC_CAND_MOB_MORALE_INSPIRER_EFFECTS: "Candidate for the Chief of Mobilization & Conscription seat: +15% division recovery rate, +5% planning speed, -5% training time. Appointing or replacing costs 100 political power."
 PWC_CAND_MOB_MORALE_INSPIRER_GUIDANCE: "Chief of Mobilization & Conscription: Sustains unit recovery through training and morale work between engagements.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_MOB_REINFORCEMENT_SPECIALIST: "Reinforcement Specialist"
 PWC_CAND_MOB_REINFORCEMENT_SPECIALIST_DESC: "This specialist follows recruits from registration through training to their assigned formations, treating replacements as people joining units rather than figures on a list."
 PWC_CAND_MOB_REINFORCEMENT_SPECIALIST_EFFECTS: "Candidate for the Chief of Mobilization & Conscription seat: +10% reinforce rate, +500 weekly manpower, -5% training time. Appointing or replacing costs 100 political power."
 PWC_CAND_MOB_REINFORCEMENT_SPECIALIST_GUIDANCE: "Chief of Mobilization & Conscription: Coordinates reserves and training to improve combat reinforcement and manpower supply.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_NAVY_AMPHIBIOUS_CHIEF: "Amphibious Chief of Staff"
 PWC_CAND_NAVY_AMPHIBIOUS_CHIEF_DESC: "This staff officer plans landing craft, ships, ground troops, and yard support together, treating amphibious warfare as a joint organizational task."
 PWC_CAND_NAVY_AMPHIBIOUS_CHIEF_EFFECTS: "Candidate for the Chief of Navy Command seat: +2 naval invasion capacity, +5% naval invasion preparation speed, +10% dockyard output, +0.12 daily navy experience gain. Appointing or replacing costs 100 political power."
 PWC_CAND_NAVY_AMPHIBIOUS_CHIEF_GUIDANCE: "Chief of Navy Command: Coordinates invasion capacity with dockyard support for larger amphibious operations.\nAppointing or replacing costs 100 political power. Only one candidate may hold this seat; replacement removes the previous bonuses. No additional cooldown."
 PWC_CAND_NAVY_BLUE_WATER_ADMIRAL: "Blue-Water Admiral"
 PWC_CAND_NAVY_BLUE_WATER_ADMIRAL_DESC: "This admiral plans for the whole voyage, bringing routes, replenishment, and cooperation between ships into an operation before the fleet leaves port."
 PWC_CAND_NAVY_BLUE_WATER_ADMIRAL_EFFECTS: "Candidate for the Chief of Navy Command seat: +10% naval max range, +0.12 daily navy experience gain, +5% convoy escort efficiency. Appointing or replacing costs 100 political power."

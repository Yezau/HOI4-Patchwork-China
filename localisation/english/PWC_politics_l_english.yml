 PWC_FOCUS_GOV_CIVIL_DEFENSE: "Civil Defense System"
 PWC_FOCUS_GOV_CIVIL_DEFENSE_DESC: "War will not stop at the city boundary. Shelters, medical aid, firefighting, and district communications must form an organized system of civilian protection."

 PWC_FOCUS_GOV_MAYORS_OFFICE_UPGRADE: "Empowered Mayor's Office"
 PWC_FOCUS_GOV_MAYORS_OFFICE_UPGRADE_DESC: "A city in crisis needs an office capable of coordinating its departments. A clearer executive mandate will turn competing proposals into decisions rather than circulating paperwork."

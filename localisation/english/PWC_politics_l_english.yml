 PWC_FOCUS_PANEL_GUIDE: "Campaign guide"
 PWC_FOCUS_PANEL_GUIDE_TT: "View the version, notices, mod features and buildings."
 PWC_FOCUS_PANEL_MUTEX: "Military specialisation and endgame"
 PWC_FOCUS_PANEL_MUTEX_BODY: "Army: 1 of 3. Navy: 1 of 2. Air: 1 of 2. All services can develop. Endgame: 1 of 4."
 PWC_FOCUS_PANEL_MUTEX_SUMMARY: "Army: 1 of 3. Navy: 1 of 2. Air: 1 of 2. All services can develop. Endgame: 1 of 4."

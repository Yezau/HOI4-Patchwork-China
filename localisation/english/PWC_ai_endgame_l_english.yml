l_english:
 pwc_dm_ai_sustained_offensive: "Sustained offensive"
 pwc_dm_ai_sustained_offensive_desc: "After at least 120 days of war against AI opponents, a clear strength advantage supports a sustained offensive. Disabled if a human joins the enemy side or the advantage is lost."
 pwc_dm_coalition_muster: "Joint attack member"
 pwc_dm_coalition_muster_desc: "Mobilising with other neighbours to attack [?pwc_coalition_target.GetName]."
 pwc_dm_coalition_warning: "Neighbours mobilising against us"
 pwc_dm_coalition_warning_desc: "Our industrial size or recent expansion has alarmed our neighbours. [?pwc_coalition_count|0] bordering powers are forming a joint army and will declare war on us together within a week after mobilisation (Standard/Challenge 60 days, Hard 45, Extreme/Cataclysm 30). A non-aggression pact or another war makes a member drop out; if too few members, troops or factories remain, the attack is called off."

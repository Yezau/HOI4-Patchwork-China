l_english:
 pwc_dm_ai_sustained_offensive: "Sustained offensive"
 pwc_dm_ai_sustained_offensive_desc: "After at least 120 days of war against AI opponents, a clear strength advantage supports a sustained offensive. Disabled if a human joins the enemy side or the advantage is lost."
 pwc_dm_coalition_muster: "Coalition participant"
 pwc_dm_coalition_muster_desc: "Mobilising to attack [?pwc_coalition_target.GetName] with other neighbours."
 pwc_dm_coalition_warning: "Coalition mobilising against us"
 pwc_dm_coalition_warning_desc: "Our industrial lead or recent expansion has alarmed our neighbours. [?pwc_coalition_count|0] powers are coordinating an attack. They may declare war within a week after mobilisation (Standard/Challenge 60 days, Hard 45, Extreme 30). Non-aggression pacts, losses or other wars can break up the coalition."

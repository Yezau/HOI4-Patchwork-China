l_english:
 PWC_GRAND_GRAND_BATTLEPLAN:0 "Operational Coordination"
 PWC_GRAND_GRAND_BATTLEPLAN_DESC:0 "Coordinate infantry, armour and sustainment through deliberate operational planning. Higher planning potential takes longer to prepare and rewards commitment to a chosen axis."
 PWC_GRAND_MASS_ASSAULT:0 "Layered Territorial Defence"
 PWC_GRAND_MASS_ASSAULT_DESC:0 "Sustain the front through local formations, depth and rotating reserves. Better recovery and reinforcement come with slower movement, favouring endurance over pursuit."
 PWC_GRAND_NEW_BASE_STRIKE:0 "Expeditionary Fleet Support"
 PWC_GRAND_NEW_BASE_STRIKE_DESC:0 "Concentrate fleet coordination and invasion preparation on supporting distant operations. Raiding receives fewer resources, and landings still require transport capacity and naval superiority."
 PWC_GRAND_NEW_BATTLEFIELD_SUPPORT:0 "Joint Air-Ground System"
 PWC_GRAND_NEW_BATTLEFIELD_SUPPORT_DESC:0 "Organise sorties around the ground campaign, using attack aircraft and drones to support breakthroughs. Reduced interception efficiency requires active air superiority or complementary defences."
 PWC_GRAND_NEW_CONVOY_RAIDING:0 "Dispersed Littoral Denial"
 PWC_GRAND_NEW_CONVOY_RAIDING_DESC:0 "Disrupt enemy routes with submarines, light forces and reconnaissance while avoiding unfavourable fleet engagements. Weaker escort performance creates a real cost to protecting your own shipping."
 PWC_GRAND_NEW_FLEET_IN_BEING:0 "Sea Lane Control"
 PWC_GRAND_NEW_FLEET_IN_BEING_DESC:0 "Centre cruisers and escorts on secure sea lanes, prioritising reliable transport over commerce raiding. The fleet must remain available for sustained protection."
 PWC_GRAND_NEW_MOBILE_WARFARE:0 "Distributed Manoeuvre Command"
 PWC_GRAND_NEW_MOBILE_WARFARE_DESC:0 "Delegate execution to battle groups for faster movement and preparation. Lower maximum planning rewards initiative and reliable reserves instead of prolonged concentration."
 PWC_GRAND_NEW_OPERATIONAL_INTEGRITY:0 "Layered Air Defence"
 PWC_GRAND_NEW_OPERATIONAL_INTEGRITY_DESC:0 "Protect home airspace through dispersed operations, detection and interception. Lower non-combat losses preserve the force at the expense of strategic bombing efficiency."
 PWC_GRAND_NEW_STRATEGIC_DESTRUCTION:0 "Deep Systems Strike"
 PWC_GRAND_NEW_STRATEGIC_DESTRUCTION_DESC:0 "Combine escorts and heavy bombers against industry and operational depth. Close support receives less attention, so success depends on sustained access to enemy airspace."
 PWC_GRAND_SUPERIOR_FIREPOWER:0 "Integrated Fires Network"
 PWC_GRAND_SUPERIOR_FIREPOWER_DESC:0 "Link reconnaissance, artillery and armour through a common fire network. More effective fires demand additional ammunition and transport, making supply the limiting factor."

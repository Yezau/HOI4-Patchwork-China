 pwc_military.107.a:0 "Update the operational map."
 pwc_military.107.d:0 "[FROM.GetName] is preparing Battlefield Reconnaissance. Preparation takes 3 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nImproves our reconnaissance; it neither reveals hidden variables nor debuffs enemies."
 pwc_military.107.t:0 "Enemy Operational Preparation"
 pwc_military.108.a:0 "Update the operational map."
 pwc_military.108.d:0 "[FROM.GetName] is preparing War Reserve Preparation. Preparation takes 7 days, followed by a 30-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nDiverts military output into supply efficiency and occupies the sustainment group."
 pwc_military.108.t:0 "Enemy Operational Preparation"
 pwc_military.109.a:0 "Update the operational map."
 pwc_military.109.d:0 "[FROM.GetName] is preparing Field Repair Surge. Preparation takes 3 days, followed by a 30-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nReduces losses rather than creating equipment, while using rear production."
 pwc_military.109.t:0 "Enemy Operational Preparation"
 pwc_military.110.a:0 "Update the operational map."
 pwc_military.110.d:0 "[FROM.GetName] is preparing Evacuation and Recovery. Preparation takes 3 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nRestores organisation rather than granting manpower; evacuation slows movement."
 pwc_military.110.t:0 "Enemy Operational Preparation"
 pwc_military.111.a:0 "Update the operational map."
 pwc_military.111.d:0 "[FROM.GetName] is preparing Front Rotation. Preparation takes 2 days, followed by a 14-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nCounters a short offensive but occupies the land group instead of stacking with an attack."
 pwc_military.111.t:0 "Enemy Operational Preparation"
 pwc_military.112.a:0 "Update the operational map."
 pwc_military.112.d:0 "[FROM.GetName] is preparing Anti-Assault Defence. Preparation takes 2 days, followed by a 14-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nTrades attack for defence; an enemy can wait out an early commitment."
 pwc_military.112.t:0 "Enemy Operational Preparation"
 pwc_military.113.a:0 "Update the operational map."
 pwc_military.113.d:0 "[FROM.GetName] is preparing Concentrate Mobile Reserves. Preparation takes 3 days, followed by a 14-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nConcentration weakens defence and supply; attack a thin sector or delay contact."
 pwc_military.113.t:0 "Enemy Operational Preparation"
 pwc_military.114.a:0 "Update the operational map."
 pwc_military.114.d:0 "[FROM.GetName] is preparing Deep Exploitation Operation. Preparation takes 7 days, followed by a 14-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nA seven-day warning precedes a fourteen-day window; depth and supply pressure can exhaust it."
 pwc_military.114.t:0 "Enemy Operational Preparation"
 pwc_military.115.a:0 "Update the operational map."
 pwc_military.115.d:0 "[FROM.GetName] is preparing Fire and Reconnaissance Coordination. Preparation takes 5 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nImproves planning and reconnaissance, not immediate attack; shift the main defensive effort."
 pwc_military.115.t:0 "Enemy Operational Preparation"
 pwc_military.116.a:0 "Update the operational map."
 pwc_military.116.d:0 "[FROM.GetName] is preparing Limited-Objective Offensive. Preparation takes 10 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nTen days of public preparation; slow and supply-heavy. Shift, pre-empt or await recovery."
 pwc_military.116.t:0 "Enemy Operational Preparation"
 pwc_military.117.a:0 "Update the operational map."
 pwc_military.117.d:0 "[FROM.GetName] is preparing Defence-in-Depth Rotation. Preparation takes 3 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nCore defence does not protect newly occupied non-cores; slow movement invites a shift in attack."
 pwc_military.117.t:0 "Enemy Operational Preparation"
 pwc_military.118.a:0 "Update the operational map."
 pwc_military.118.d:0 "[FROM.GetName] is preparing Reserve Counterstroke. Preparation takes 3 days, followed by a 10-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nOnly ten days of counterattack; baiting an early commitment exposes the long recovery period."
 pwc_military.118.t:0 "Enemy Operational Preparation"
 pwc_military.119.a:0 "Update the operational map."
 pwc_military.119.d:0 "[FROM.GetName] is preparing Airfield Dispersal. Preparation takes 2 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nTrades close air support for home defence; contest the ground timetable instead."
 pwc_military.119.t:0 "Enemy Operational Preparation"
 pwc_military.120.a:0 "Update the operational map."
 pwc_military.120.d:0 "[FROM.GetName] is preparing Interception Surge. Preparation takes 2 days, followed by a 14-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nStrong interception is not strong ground support; reduce sorties or strike during recovery."
 pwc_military.120.t:0 "Enemy Operational Preparation"
 pwc_military.121.a:0 "Update the operational map."
 pwc_military.121.d:0 "[FROM.GetName] is preparing Close Support Surge. Preparation takes 4 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nSortie intensity increases accident risk; disperse ground combat or strengthen interception."
 pwc_military.121.t:0 "Enemy Operational Preparation"
 pwc_military.122.a:0 "Update the operational map."
 pwc_military.122.d:0 "[FROM.GetName] is preparing Battlefield Interdiction. Preparation takes 7 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nA seven-day build-up exposes the sortie cycle; denial aviation can respond faster."
 pwc_military.122.t:0 "Enemy Operational Preparation"
 pwc_military.123.a:0 "Update the operational map."
 pwc_military.123.d:0 "[FROM.GetName] is preparing Coastal Watch. Preparation takes 3 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nCoastal surveillance draws resources from escorts; pressure transport routes instead."
 pwc_military.123.t:0 "Enemy Operational Preparation"
 pwc_military.124.a:0 "Update the operational map."
 pwc_military.124.d:0 "[FROM.GetName] is preparing Littoral Ambush. Preparation takes 7 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nTargets shipping and littoral opportunities, not universal fleet strength; escort or reroute."
 pwc_military.124.t:0 "Enemy Operational Preparation"
 pwc_military.125.a:0 "Update the operational map."
 pwc_military.125.d:0 "[FROM.GetName] is preparing Escort Surge. Preparation takes 3 days, followed by a 21-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nEscort and raiding cannot both concentrate; avoid the defended route and await recovery."
 pwc_military.125.t:0 "Enemy Operational Preparation"
 pwc_military.126.a:0 "Update the operational map."
 pwc_military.126.d:0 "[FROM.GetName] is preparing Landing Support Window. Preparation takes 10 days, followed by a 14-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nDoes not change legal war targets; invasions still require native transport capacity and naval supremacy. Public preparations give defenders time to redeploy."
 pwc_military.126.t:0 "Enemy Operational Preparation"
 pwc_military.127.a:0 "Update the operational map."
 pwc_military.127.d:0 "[FROM.GetName] is preparing Joint Operation Window. Preparation takes 10 days, followed by a 14-day window if conditions still hold.\nThis signal is public to current enemies. Redeploy, counter, or wait for recovery.\nLocks all service groups instead of stacking three specialised actions; recovery is costly."
 pwc_military.127.t:0 "Enemy Operational Preparation"

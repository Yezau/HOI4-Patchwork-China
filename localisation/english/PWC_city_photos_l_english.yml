l_english:
 PWC_CITY_PHOTO_8_TT: "§HDaxinganling§!\nDaxing'anling lies in northwestern Heilongjiang, in the northern Greater Khingan Range. Forested hills dominate the landscape, and the Amur River marks its border with Russia."
 PWC_CITY_PHOTO_9_TT: "§HHulunbuir§!\nNamed after Hulun and Buir lakes, Hulunbuir is crossed by the Greater Khingan Range. Its landscape spans western grasslands, central forests, and eastern river valleys."
 PWC_CITY_PHOTO_12_TT: "§HHeihe§!\nFormerly Aihui, Heihe faces Russia's Blagoveshchensk across the Amur River. Its border location and forests in the northern Lesser Khingan Range have made it a center of cross-border trade."
 PWC_CITY_PHOTO_13_TT: "§HHeilongjiang Yichun§!\nYichun lies in the southern Lesser Khingan Range, where the Tangwang River runs through extensive forests. Known as the 'Forest Capital,' it long relied on logging and timber processing."
 PWC_CITY_PHOTO_14_TT: "§HAltay§!\nAltay City lies in northern Xinjiang and serves as the seat of Altay Prefecture. Its center stands beside the Kelan River, and its residents include Han, Kazakh, and Uyghur communities."
 PWC_CITY_PHOTO_15_TT: "§HQiqihaer§!\nQiqihar stands in the western Songnen Plain, with the Nen River running through its territory. Once Heilongjiang's capital, it has a long urban history and a tradition of heavy industry."
 PWC_CITY_PHOTO_16_TT: "§HJiamusi§!\nJiamusi lies in the Sanjiang Plain, where the Songhua River crosses the city. It faces Russia across the Ussuri River and once served as the capital of Hejiang Province."
 PWC_CITY_PHOTO_17_TT: "§HHegang§!\nHegang stands where the Lesser Khingan Range meets the Sanjiang Plain, near the Amur and Songhua rivers. Coal mining shaped this border city's industrial character."
 PWC_CITY_PHOTO_18_TT: "§HSuihua§!\nSuihua lies in the eastern Songnen Plain, below the Lesser Khingan Range. The Hulan River crosses its territory, where rice, corn, and soybeans are major crops."
 PWC_CITY_PHOTO_19_TT: "§HXingan§!\nHinggan League spans the transition from the Greater Khingan Range to the Songnen Plain. Rivers such as the Tao'er flow east toward the Nen; its seat is Ulanhot, and its name derives from a Manchu word for 'hills.'"
 PWC_CITY_PHOTO_20_TT: "§HShuangyashan§!\nShuangyashan lies in the eastern Sanjiang Plain, with the Ussuri River on its border and the Wandashan Mountains to the south. Coal deposits helped build its mining and power industries."
 PWC_CITY_PHOTO_21_TT: "§HDaqing§!\nDaqing stands amid the lakes and marshes of the Songnen Plain. The Daqing Oilfield made it a major oil city, with extraction and petrochemicals anchoring its economy."
 PWC_CITY_PHOTO_22_TT: "§HTacheng§!\nTacheng lies in northwestern Xinjiang and serves as the center of Tacheng Prefecture. Its former name is linked to the Tarbagatai Mountains, and the city is near the Kazakhstan border."
 PWC_CITY_PHOTO_23_TT: "§HXilingol§!\nXilingol League stretches across the central Inner Mongolian Plateau. Livestock and horse breeding thrive on its grasslands, while Erenhot is a major crossing into Mongolia."
 PWC_CITY_PHOTO_24_TT: "§HHaerbin§!\nA northern manufacturing gateway and international rail hub."
 PWC_CITY_PHOTO_25_TT: "§HJixi§!\nJixi lies in southeastern Heilongjiang, crossed by the Muling River and bordering Lake Khanka to the south. Coal and graphite deposits have shaped its industry."
 PWC_CITY_PHOTO_26_TT: "§HBaicheng§!\nBaicheng lies in northwestern Jilin, at the eastern edge of the Horqin grasslands. The Tao'er River crosses the western Songnen Plain here, amid grasslands, lakes, and wetlands."
 PWC_CITY_PHOTO_27_TT: "§HQitaihe§!\nQitaihe lies between the western Sanjiang Plain and southern Wandashan Mountains, with the Woken River running across it. Its growth has been tied to coal mining."
 PWC_CITY_PHOTO_29_TT: "§HMudanjiang§!\nMudanjiang stands between the Zhangguangcai and Laoye ranges and takes its name from the river crossing the city. Upstream Jingpo Lake and forested mountains define its landscape."
 PWC_CITY_PHOTO_30_TT: "§HTongliao§!\nTongliao lies between the Inner Mongolian Plateau and Songliao Plain, amid Horqin grasslands and sandy land. The Xilamulun and Laoha rivers meet here to form the West Liao River."
 PWC_CITY_PHOTO_31_TT: "§HJiayuguan§!\nJiayuguan stands in the western Hexi Corridor, named after the pass at the western end of the Ming Great Wall. Its growth was tied to the Jingtieshan iron mine and Jiuquan Iron and Steel."
 PWC_CITY_PHOTO_32_TT: "§HChangji§!\nChangji City lies on the northern slopes of the Tianshan Mountains, at the Junggar Basin's southern edge. Seat of Changji Hui Autonomous Prefecture, it lies on routes between Ürümqi and western Xinjiang."
 PWC_CITY_PHOTO_34_TT: "§HSongyuan§!\nSongyuan lies on the Songnen Plain between the Songhua and Nen rivers, which meet in its northern territory. Chagan Lake to the northwest is Jilin's largest lake."
 PWC_CITY_PHOTO_35_TT: "§HBortala§!\nBortala Mongol Autonomous Prefecture lies in northwestern Xinjiang and is named for the Bortala River; its Mongolian name means 'brown grassland.' Its seat is Bole."
 PWC_CITY_PHOTO_36_TT: "§HChangchun§!\nA major northeastern manufacturing and transport centre."
 PWC_CITY_PHOTO_37_TT: "§HChifeng§!\nChifeng lies at the southeastern edge of the Inner Mongolian Plateau. The Xilamulun crosses its territory and joins the Laoha to form the West Liao River; the city was once the seat of Ju Ud League."
 PWC_CITY_PHOTO_38_TT: "§HHami§!\nHami lies in eastern Xinjiang, where branches of the Tianshan divide oasis and desert from northern grasslands. Famous for Hami melons, it lies in a corridor linking Xinjiang and Gansu."
 PWC_CITY_PHOTO_39_TT: "§HIli§!\nIli Kazakh Autonomous Prefecture lies in northwestern Xinjiang, with Yining in the Ili River valley as its seat. Oases, mountains, Kazakh culture, and border trade shape the region."
 PWC_CITY_PHOTO_40_TT: "§HJilin§!\nJilin City stretches along the Songhua River. Its old Manchu name, 'Jilin Ula,' refers to the riverside; once the provincial capital, it is known for the river and surrounding mountains."
 PWC_CITY_PHOTO_41_TT: "§HYanbian§!\nYanbian lies in eastern Jilin, facing North Korea across the Tumen River and bordering Russia to the east. Its mountain frontier and Korean communities give the autonomous prefecture its character."
 PWC_CITY_PHOTO_42_TT: "§HLiaoyuan§!\nLiaoyuan takes its name from the source of the East Liao River and lies where southern Jilin's hills give way to plains. Once part of the Qing imperial hunting grounds, it was renamed from Xi'an to Liaoyuan."
 PWC_CITY_PHOTO_43_TT: "§HWuhai§!\nWuhai lies at the southern edge of the Ulan Buh Desert, with the Yellow River flowing north through it. Formed by merging Wuda and Haibowan, it grew around coal mining."
 PWC_CITY_PHOTO_44_TT: "§HSiping§!\nSiping lies at the northern end of the Liao River Plain, crossed by the East Liao River. Routes toward Jilin, Liaoning, and Inner Mongolia converge here, making it a transport hub."
 PWC_CITY_PHOTO_45_TT: "§HUrumqi§!\nA Silk Road trade and logistics centre facing Central Asia."
 PWC_CITY_PHOTO_46_TT: "§HTurpan§!\nTurpan lies south of the eastern Tianshan Mountains, where basin, Gobi, and desert landscapes meet. Ayding Lake lies below sea level and is mainland China's lowest land point."
 PWC_CITY_PHOTO_47_TT: "§HBayingolin§!\nBayingolin Mongol Autonomous Prefecture covers a vast area of central Xinjiang, with its seat at Korla. It has oil and natural gas reserves, while Bayinbuluke Grassland lies in Hejing County."
 PWC_CITY_PHOTO_48_TT: "§HTieling§!\nTieling lies in northern Liaoning, where the Liao River Plain extends south between hills. The Liao River crosses its west, joined by tributaries including the Qing and Chai rivers."
 PWC_CITY_PHOTO_49_TT: "§HUlanqab§!\nUlanqab lies in west-central Inner Mongolia, where the Yin Mountains divide contrasting plateau landscapes. Its Mongolian name means 'red cliffs.'"
 PWC_CITY_PHOTO_50_TT: "§HShenyang§!\nNortheast China's historic political and heavy-industrial centre."
 PWC_CITY_PHOTO_51_TT: "§HTonghua§!\nTonghua lies deep in the Changbai Mountains, crossed by the Hun River and bordered to the south by the Yalu River and North Korea. Ji'an within its territory was once a Goguryeo capital."
 PWC_CITY_PHOTO_53_TT: "§HFuxin§!\nFuxin lies where the Horqin sandy land meets the Liao River Plain. Built around coal mining, it became an early pilot city for economic transition as its deposits were depleted."
 PWC_CITY_PHOTO_54_TT: "§HBaishan§!\nBaishan, formerly Hunjiang, lies in the Changbai Mountains of southeastern Jilin. The Hun River crosses its west, while the Yalu River marks its southern border with North Korea."
 PWC_CITY_PHOTO_55_TT: "§HJiuquan§!\nJiuquan lies at the western end of the Hexi Corridor, with oases between the Qilian Mountains and Gobi. One of the four Han-era Hexi commanderies, it long guarded the Silk Road toward the Western Regions."
 PWC_CITY_PHOTO_56_TT: "§HAlxa§!\nAlxa League lies in western Inner Mongolia, spanning the Badain Jaran, Tengger, and Ulan Buh deserts. The Ejin River flows north into Juyan Lake."
 PWC_CITY_PHOTO_57_TT: "§HBaotou§!\nBaotou lies between the Gobi to the north and the Yellow River's Hetao Plain to the south. A major industrial center of Inner Mongolia, it is known for metallurgy, rare earths, and machinery."
 PWC_CITY_PHOTO_58_TT: "§HAksu§!\nAksu City lies south of the Tianshan Mountains, at the Tarim Basin's northwestern edge. Named for the Aksu River, meaning 'white water,' its oasis farms grow crops including cotton."
 PWC_CITY_PHOTO_59_TT: "§HChengde§!\nChengde lies where the Bashang Plateau meets the Yan Mountains, with the Wulie River crossing its urban centre. The Qing Mountain Resort and surrounding temples made old Rehe an imperial retreat."
 PWC_CITY_PHOTO_60_TT: "§HFushun§!\nFushun lies in eastern Liaoning, where the Hun River rises and flows west through the city. Once called the 'Coal Capital,' it later developed petrochemical, metallurgical, and machinery industries."
 PWC_CITY_PHOTO_61_TT: "§HBayannur§!\nBayannur lies north of the Yellow River, where the Yin Mountains separate the Hetao Plain from the Urad grasslands. Its Mongolian name means 'rich lakes.'"
 PWC_CITY_PHOTO_62_TT: "§HChaoyang§!\nChaoyang lies in the hills of western Liaoning, crossed by the Daling River. Known in antiquity as Longcheng, it occupies a route between North China and the northeast."
 PWC_CITY_PHOTO_63_TT: "§HZhangjiakou§!\nZhangjiakou lies in northwestern Hebei, with the Yin Mountains dividing its highland Bashang area from lower lands. The Great Border Gate was a key Great Wall passage, and the city was once a trading gateway between Beijing and the Mongolian steppe."
 PWC_CITY_PHOTO_64_TT: "§HJinzhou§!\nJinzhou stands on Liaodong Bay, on a major route between North China and the northeast. The Battles of Songjin and Liaoshen were fought here; its center lies at the confluence of the Xiaoling and Nü'er rivers."
 PWC_CITY_PHOTO_65_TT: "§HBenxi§!\nBenxi lies in the mountains of eastern Liaoning, with the Taizi River crossing its center. Forests and mineral deposits supported coking coal, iron mining, and specialty steel."
 PWC_CITY_PHOTO_66_TT: "§HAnshan§!\nAnshan lies between the Qianshan Mountains and the Liao River Plain, with land descending from southeast to northwest. Its steel industry earned it the name 'Steel Capital.'"
 PWC_CITY_PHOTO_67_TT: "§HLiaoyang§!\nLiaoyang, known in antiquity as Xiangping, stands beside the Taizi River. One of northeastern China's oldest cities, it evolved from a political center of ancient Liaodong into a petrochemical base."
 PWC_CITY_PHOTO_69_TT: "§HPanjin§!\nPanjin lies near the lower Liao River on the northern shore of Liaodong Bay, amid extensive wetlands. Development of the Liaohe Oilfield made it a major oil city in Liaoning."
 PWC_CITY_PHOTO_70_TT: "§HKizilsu§!\nKizilsu lies in Xinjiang's far west, where the Pamir and Tianshan mountains meet. It borders Kyrgyzstan and Tajikistan, and its name means 'red river.'"
 PWC_CITY_PHOTO_71_TT: "§HHohhot§!\nInner Mongolia's historic administrative and manufacturing centre."
 PWC_CITY_PHOTO_72_TT: "§HHuludao§!\nHuludao stands on the Bohai coast at the Liaoning-Hebei border, where hills give way to coastal plains. Its industries include port operations, shipbuilding, and chemicals."
 PWC_CITY_PHOTO_73_TT: "§HDandong§!\nDandong lies where the Yalu River reaches the Yellow Sea, facing Sinuiju in North Korea. Both a border crossing and coastal city, it is a land gateway to the Korean Peninsula."
 PWC_CITY_PHOTO_74_TT: "§HBeijing§!\nHistoric national capital and political centre of northern China."
 PWC_CITY_PHOTO_75_TT: "§HYingkou§!\nYingkou stands at the mouth of the Liao River on Liaodong Bay. One of Liaoning's earliest treaty ports, it remains closely tied to maritime trade."
 PWC_CITY_PHOTO_76_TT: "§HOrdos§!\nOrdos lies on a plateau enclosed on three sides by the Yellow River, with the Kubuqi and Mu Us deserts across its territory. Coal, oil, and natural gas resources support its economy."
 PWC_CITY_PHOTO_77_TT: "§HDatong§!\nDatong lies in northern Shanxi, where the Sanggan River crosses a basin leading toward Inner Mongolia. It served as the Northern Wei capital and a secondary capital under the Liao and Jin, and was also known as Yunzhong and Pingcheng."
 PWC_CITY_PHOTO_78_TT: "§HQinghuangdao§!\nQinhuangdao stands between the Yan Mountains and the Bohai Sea and is a major Hebei port. Shanhai Pass guards a Great Wall route, while Beidaihe is a renowned seaside resort."
 PWC_CITY_PHOTO_79_TT: "§HTangshan§!\nTangshan lies between the Yan Mountains and the Bohai Sea. The Kaiping coal mine spurred its modern industry; after rebuilding from a major earthquake, steel, coal, and ceramics remain prominent."
 PWC_CITY_PHOTO_80_TT: "§HShuozhou§!\nShuozhou lies in the southwestern Datong Basin, with the Sanggan River crossing its mountain-ringed plains. Alongside coal power, dairy farming and ceramics are local specialties."
 PWC_CITY_PHOTO_81_TT: "§HKashgar§!\nKashgar is an oasis city on the western edge of the Tarim Basin. A historic Silk Road crossroads, it is known for its old city and trading traditions."
 PWC_CITY_PHOTO_82_TT: "§HTianjin§!\nA northern port city and advanced manufacturing centre."
 PWC_CITY_PHOTO_83_TT: "§HDalian§!\nAt the southern tip of the Liaodong Peninsula, Dalian is a major northeastern port and shipbuilding centre between the Yellow Sea and the Bohai Sea."
 PWC_CITY_PHOTO_84_TT: "§HKaramay§!\nKaramay stands on the northwestern edge of the Junggar Basin. Its growth was closely tied to the Xinjiang oilfields, making it a major petroleum city."
 PWC_CITY_PHOTO_85_TT: "§HBaoding§!\nBaoding lies on the North China Plain, south of Beijing and east of the Taihang Mountains. It is a historic regional centre of central Hebei."
 PWC_CITY_PHOTO_86_TT: "§HZhangye§!\nZhangye, formerly Ganzhou, lies in the central Hexi Corridor, crossed by the Heihe River. One of the four Han-era Hexi commanderies, its name expressed an ambition to extend westward."
 PWC_CITY_PHOTO_87_TT: "§HXinzhou§!\nXinzhou spans mountains and basins in north-central Shanxi, with Mount Wutai in the east. This Buddhist sacred mountain and the Hutuo River, which rises nearby, shape the local landscape."
 PWC_CITY_PHOTO_88_TT: "§HHotan§!\nHotan City lies in an oasis on the southern edge of the Taklamakan Desert. An ancient Silk Road center, it is traditionally known for jade, carpets, and silk."
 PWC_CITY_PHOTO_89_TT: "§HShaanxi Yulin§!\nYulin lies between the Mu Us Desert and the Loess Plateau, with the Ming Great Wall crossing its north. Coal, oil, natural gas, and salt make it an important energy-producing area."
 PWC_CITY_PHOTO_90_TT: "§HLangfang§!\nLangfang lies on the North China Plain between Beijing and Tianjin; the two municipalities divide its territory into separate parts. Rivers of the Hai River system, including the Yongding, cross the area."
 PWC_CITY_PHOTO_91_TT: "§HWuwei§!\nWuwei, formerly Liangzhou, lies at the eastern end of the Hexi Corridor between the Qilian Mountains and the Tengger Desert. One of the Han-era Hexi commanderies, it also served as a capital for several ancient states."
 PWC_CITY_PHOTO_92_TT: "§HHaixi§!\nHaixi lies in western Qinghai, where the Qaidam Basin combines desert, salt lakes, and surrounding mountains. Mongolian and Tibetan communities have long lived here, while mineral extraction also shapes the region."
 PWC_CITY_PHOTO_93_TT: "§HHaibei§!\nHaibei lies on the southern slopes of the Qilian Mountains, reaching the grasslands along Qinghai Lake's northern shore. The Datong River cuts across its mountains, valleys, and lakeside plains."
 PWC_CITY_PHOTO_94_TT: "§HYangquan§!\nYangquan lies in a mountain basin on the western slopes of the Taihang Mountains, with the Tao River crossing the city. After a station opened on the Zhengding-Taiyuan Railway, coal and iron production made it an eastern Shanxi industrial center."
 PWC_CITY_PHOTO_95_TT: "§HJinchang§!\nJinchang lies at the eastern edge of the Hexi Corridor between the Qilian and Longshou mountains. Rich nickel and other nonferrous metal deposits earned it the name 'Nickel Capital.'"
 PWC_CITY_PHOTO_96_TT: "§HCangzhou§!\nCangzhou borders the Bohai Sea on the flat North China Plain, crossed by the Southern Grand Canal and the Ziya New River. Sea salt and oil resources underpin local industry."
 PWC_CITY_PHOTO_97_TT: "§HYinchuan§!\nA Yellow River energy centre amid Ningxia's lakes and wetlands."
 PWC_CITY_PHOTO_98_TT: "§HShijiazhuang§!\nA strategic rail junction in the Beijing-Tianjin-Hebei region."
 PWC_CITY_PHOTO_99_TT: "§HLvliang§!\nLüliang lies east of the Yellow River, with the Lüliang Mountains running through it and the Taiyuan Basin to the east. Rich coking coal deposits support western Shanxi's coal industry."
 PWC_CITY_PHOTO_103_TT: "§HHengshui§!\nHengshui lies on the low plains of southeastern Hebei, crossed by the Fuyang and Hutuo rivers of the Hai River system. Several rail lines meet here, forming a regional transport hub."
 PWC_CITY_PHOTO_104_TT: "§HTaiyuan§!\nA historic northern industrial city known as the Dragon City."
 PWC_CITY_PHOTO_105_TT: "§HShizuishan§!\nShizuishan lies between the Helan Mountains and the Yellow River, in the northern Yinchuan Plain. Rich coal deposits, especially Taixi coal, helped build its energy and heavy chemical industries."
 PWC_CITY_PHOTO_106_TT: "§HShandong Binzhou§!\nBinzhou lies in the Yellow River Delta on the western Bohai coast. Local tradition links it to Sun Wu, while Lüju opera originated in Lüyi Town in Binzhou."
 PWC_CITY_PHOTO_107_TT: "§HWuzhong§!\nWuzhong lies on the eastern bank of the Yellow River in central Ningxia, where irrigated farmland meets the Ordos Plateau. Tan sheep and grain production are local agricultural specialties."
 PWC_CITY_PHOTO_108_TT: "§HDongying§!\nDongying arose in the Yellow River Delta at the Bohai Sea through development of the Shengli Oilfield. Estuary wetlands and the oil industry define the city."
 PWC_CITY_PHOTO_109_TT: "§HJinzhong§!\nJinzhong lies on the western slopes of the Taihang Mountains, at the eastern edge of the Taiyuan Basin. Its terrain descends toward the Fen River valley, while several railways link it with the rest of Shanxi and beyond."
 PWC_CITY_PHOTO_110_TT: "§HDezhou§!\nDezhou lies on the Yellow River's alluvial plain in northwestern Shandong. The Grand Canal crosses its territory and the Yellow River follows its southern edge, shaping a landscape of waterways and farmland."
 PWC_CITY_PHOTO_111_TT: "§HYangtai§!\nYantai lies in the north-central Shandong Peninsula, facing the Bohai Sea to the north and Yellow Sea to the south. Low hills, bays, and islands surround this port city, historically known as Zhifu."
 PWC_CITY_PHOTO_112_TT: "§HZhongwei§!\nZhongwei lies on the southern edge of the Tengger Desert, with the Yellow River crossing its north. Shapotou's meeting of desert and river landscapes has made it a well-known tourist destination."
 PWC_CITY_PHOTO_113_TT: "§HXingtai§!\nXingtai lies east of the Taihang Mountains, where western highlands descend to the North China Plain. Formerly known as Xingzhou, it has links to Shang-era states and the later State of Xing."
 PWC_CITY_PHOTO_114_TT: "§HBaiyin§!\nBaiyin lies on the upper Yellow River, which winds through gorges, basins, and oases. The city takes its name from Ming-era mines, and copper and other nonferrous metals underpinned its industry."
 PWC_CITY_PHOTO_115_TT: "§HWeihai§!\nWeihai stands at the eastern tip of the Shandong Peninsula, surrounded on three sides by the Yellow Sea. Its indented coast includes Liugong Island; formerly Weihaiwei, it is a harbor city shaped by the sea."
 PWC_CITY_PHOTO_116_TT: "§HYanan§!\nYan'an lies on the Loess Plateau of northern Shaanxi, where the Yan River cuts through rugged hills. After the Red Army's Long March reached northern Shaanxi, it became the political center of the revolutionary base."
 PWC_CITY_PHOTO_117_TT: "§HXining§!\nA gateway and service centre for the Qinghai-Tibet Plateau."
 PWC_CITY_PHOTO_118_TT: "§HWeifang§!\nWeifang lies in central Shandong Peninsula, between southern hills and the tidal flats of Laizhou Bay. Formerly Weizhou and Weixian, it is also renowned as China's 'Kite Capital.'"
 PWC_CITY_PHOTO_119_TT: "§HJinan§!\nA Yellow River manufacturing, logistics, and transport centre."
 PWC_CITY_PHOTO_120_TT: "§HQinghai Hainan§!\nHainan Tibetan Autonomous Prefecture lies in the eastern Tibetan Plateau, between Qinghai Lake to the north and the Amne Machin Mountains to the south. The Yellow River winds through it, forming Longyangxia Reservoir."
 PWC_CITY_PHOTO_122_TT: "§HQingyang§!\nQingyang lies on the Loess Plateau of eastern Gansu, near the borders of Shaanxi and Ningxia. Gullies and hills cover the area, crossed by rivers such as the Malian; it was once known as Qingzhou."
 PWC_CITY_PHOTO_123_TT: "§HZibo§!\nZibo lies where the Shandong Hills meet the North China Plain. Linzi was once the capital of Qi, while Qi culture, ceramics, and petrochemicals all shape the city today."
 PWC_CITY_PHOTO_124_TT: "§HHaidong§!\nHaidong lies between the Tibetan and Loess plateaus, among the eastern ranges of the Qilian Mountains. The Huangshui River crosses its center, while the Yellow River flows through the south."
 PWC_CITY_PHOTO_125_TT: "§HChangzhi§!\nChangzhi, formerly Shangdang, lies in the Shangdang Basin between the Taihang and Taiyue mountains. Branches of the Zhuozhang River meet here before flowing east out of Shanxi."
 PWC_CITY_PHOTO_126_TT: "§HQingdao§!\nQingdao lies on the southern Shandong Peninsula, where its port and railway drove rapid modern growth. Port building during the German lease and later textile manufacturing left a lasting mark on the city."
 PWC_CITY_PHOTO_128_TT: "§HHandan§!\nHandan lies east of the Taihang Mountains near the meeting of four provinces, with mountains in the west and plains in the east. A capital of Zhao in the Warring States period, it is also home to the much older Cishan archaeological site."
 PWC_CITY_PHOTO_129_TT: "§HLanzhou§!\nA Yellow River corridor linking northwestern China."
 PWC_CITY_PHOTO_130_TT: "§HLiaocheng§!\nLiaocheng lies on the Yellow River Plain where Shandong, Henan, and Hebei meet. The Grand Canal and Yellow River cross its territory; formerly Dongchang Prefecture, it retains a heritage of canal trade and farming."
 PWC_CITY_PHOTO_131_TT: "§HLinfen§!\nLinfen, formerly Pingyang, lies along the Fen River between the Taiyue and Lüliang mountains. The Taosi site and legends of Emperor Yao link it to early Chinese civilization."
 PWC_CITY_PHOTO_132_TT: "§HGuyuan§!\nGuyuan, formerly Yuanzhou, lies in southern Ningxia amid the north-south Liupan Mountains. Rivers including the Qingshui and Jing rise in the surrounding hills."
 PWC_CITY_PHOTO_133_TT: "§HNagqu§!\nNagqu lies on the high plateau of northern Tibet; its Tibetan name means 'black river.' The vast Changtang grasslands and cold mountain terrain define the region."
 PWC_CITY_PHOTO_134_TT: "§HTaian§!\nTai’an sits below Mount Tai, whose summit rises north of the city. The mountain has a long tradition of ritual worship and pilgrimage, while the Dawen River waters the surrounding plain."
 PWC_CITY_PHOTO_135_TT: "§HAnyang§!\nAnyang lies east of the Taihang Mountains, with the Huan River crossing its northern urban area. The Shang-era Yinxu ruins and oracle bone inscriptions make it central to the study of early Chinese civilization."
 PWC_CITY_PHOTO_136_TT: "§HYushu§!\nYushu Tibetan Autonomous Prefecture lies in the central Tibetan Plateau among the Tanggula, Kunlun, and Bayan Har ranges. The Yangtze, Yellow, and Lancang rivers all rise within the prefecture."
 PWC_CITY_PHOTO_137_TT: "§HPuyang§!\nPuyang lies on the alluvial plain north of the Yellow River, near the borders of Hebei, Shandong, and Henan. Development of the Zhongyuan Oilfield spurred its establishment and its petrochemical and equipment industries."
 PWC_CITY_PHOTO_138_TT: "§HLinyi§!\nLinyi, formerly Langya and Yizhou, lies where the Yimeng Mountains give way to southern plains. The Yi and Shu rivers rise in the surrounding hills and cross its wide territory."
 PWC_CITY_PHOTO_139_TT: "§HHuangnan§!\nHuangnan Tibetan Autonomous Prefecture lies in the eastern Tibetan Plateau, north of the Amne Machin Mountains. The Yellow River flows west along its southern edge before turning east along the north."
 PWC_CITY_PHOTO_140_TT: "§HLinxia§!\nLinxia Hui Autonomous Prefecture lies where the Loess and Tibetan plateaus meet, crossed by the Yellow, Tao, and Daxia rivers. Its seat, formerly Hezhou, was a center of Silk Road and tea-horse trade."
 PWC_CITY_PHOTO_141_TT: "§HDingxi§!\nDingxi lies where the Longxi Loess Plateau meets the western Qinling Mountains, and the Wei River rises within its territory. Once a Silk Road center, it is also known for potato growing."
 PWC_CITY_PHOTO_142_TT: "§HJincheng§!\nJincheng lies between the Taihang, Wangwu, and Zhongtiao mountains, with the Dan and Qin rivers flowing south. Formerly Zezhou, it is a gateway from Shanxi to the Central Plains."
 PWC_CITY_PHOTO_143_TT: "§HRizhao§!\nRizhao faces the Yellow Sea and takes its name from the first light of sunrise. Coastal trade, fishing, and Rizhao Port shape this southern Shandong city."
 PWC_CITY_PHOTO_144_TT: "§HJining§!\nJining, formerly Rencheng and Jizhou, is crossed by the Grand Canal. Nanyang and Weishan lakes in the south form part of the Southern Four Lakes, an important northern freshwater lake group."
 PWC_CITY_PHOTO_145_TT: "§HHeze§!\nHeze, formerly Caozhou, lies on the Yellow River's alluvial plain near the borders of Shandong, Jiangsu, Anhui, and Henan. Its extensive peony cultivation earned it the name 'Peony Capital of China.'"
 PWC_CITY_PHOTO_146_TT: "§HXinxiang§!\nXinxiang lies southeast of the Taihang Mountains, with the Yellow River on its southern edge and the Wei River crossing the city. It is an industrial center of northern Henan and a stop on the Beijing-Guangzhou Railway."
 PWC_CITY_PHOTO_147_TT: "§HWeinan§!\nWeinan takes its name from its position south of the Wei River, in the eastern Guanzhong Plain. The Wei crosses its territory to meet the Yellow River, and the area has long been a gateway from the Central Plains to the northwest."
 PWC_CITY_PHOTO_148_TT: "§HYuncheng§!\nYuncheng, formerly Hedong, lies in southwestern Shanxi's Yuncheng Basin, facing Shaanxi across the Yellow River. Legends placing the capitals of Shun and Yu here link it to early Chinese civilization."
 PWC_CITY_PHOTO_149_TT: "§HPingliang§!\nPingliang sits where the Loess Plateau meets the Liupan Mountains, with the Jing River crossing the region. A Silk Road waypoint, it is also home to the Taoist Kongtong Mountains."
 PWC_CITY_PHOTO_151_TT: "§HNgari§!\nNgari occupies the high plateau of western Tibet, where the Himalayas and Gangdise range extend across the landscape. Headwaters of major rivers, including the Indus, lie among its vast mountains."
 PWC_CITY_PHOTO_152_TT: "§HGolog§!\nGolog spans grasslands along the upper Yellow River, between the Bayan Har and Amne Machin ranges. Lakes Eling and Zhaling dot the plateau, where pastoral life has long shaped the region."
 PWC_CITY_PHOTO_154_TT: "§HTongchuan§!\nTongchuan lies on the passage from the Guanzhong Basin to the Loess Plateau. Coal mining long drove its growth, leaving a distinct industrial legacy as the city changes course."
 PWC_CITY_PHOTO_155_TT: "§HGannan§!\nGannan lies where the Tibetan and Loess plateaus meet, bringing together grasslands, mountains and the Yellow River valley. Tibetan culture and highland pastoralism are rooted in this Amdo region."
 PWC_CITY_PHOTO_157_TT: "§HXianyang§!\nXianyang stands near the meeting of the Wei and Jing rivers in the heart of Guanzhong. Once the Qin capital, it remained within the capital region of later dynasties."
 PWC_CITY_PHOTO_158_TT: "§HZaozhuang§!\nZaozhuang lies between Shandong's hills and the Huanghuai Plain, crossed by the Grand Canal. Taierzhuang preserves traces of canal trade and a major wartime battle, while Weishan Lake lies to the west."
 PWC_CITY_PHOTO_159_TT: "§HJiaozuo§!\nJiaozuo stands below the southern Taihang Mountains and north of the Yellow River. Modern coal mining built its industry, while the area is closely associated with the origins of tai chi."
 PWC_CITY_PHOTO_160_TT: "§HJiyuan§!\nJiyuan lies north of the Yellow River in northwestern Henan and takes its name from the source of the ancient Ji River. Its name dates to Sui times, while rail and energy industries shaped the modern city."
 PWC_CITY_PHOTO_161_TT: "§HTianshui§!\nTianshui lies on the upper Wei River where the Loess Plateau meets the Qinling Mountains. A former Silk Road stop, it is known for the Buddhist sculptures of the Maijishan Grottoes."
 PWC_CITY_PHOTO_162_TT: "§HBaoji§!\nBaoji, once called Chencang, lies at the western end of the Guanzhong Plain below the Qinling Mountains. The Wei River and three major rail lines make it a link between the northwest and Sichuan."
 PWC_CITY_PHOTO_163_TT: "§Hlianyungang§!\nLianyungang faces the Yellow Sea from northern Jiangsu, beneath the province's highest summit in the Yuntai Mountains. Its port links the eastern end of the Longhai Railway with coastal shipping."
 PWC_CITY_PHOTO_164_TT: "§HSanmenxia§!\nSanmenxia stands on the Yellow River's south bank amid western Henan's hills, in the old Shaanzhou region. Construction of the Sanmenxia Dam shaped the modern city and this stretch of the river."
 PWC_CITY_PHOTO_165_TT: "§HKaifeng§!\nKaifeng lies on the central plains beside the Yellow River and served as the Northern Song capital of Bianjing. Repeated flooding buried successive city layers, creating its distinctive stacked-city remains."
 PWC_CITY_PHOTO_166_TT: "§HLuoyang§!\nLuoyang served as a capital across many dynasties and as an eastern gateway of the Silk Road. White Horse Temple and the Longmen Grottoes trace the spread of Buddhism through the central plains."
 PWC_CITY_PHOTO_167_TT: "§HZhengzhou§!\nA central rail, logistics, manufacturing, and commercial hub."
 PWC_CITY_PHOTO_168_TT: "§HXuzhou§!\nXuzhou, historically known as Pengcheng, is a transport junction in northwestern Jiangsu linking eastern China with the Central Plains."
 PWC_CITY_PHOTO_169_TT: "§HShangqiu§!\nShangqiu lies on the Huanghuai alluvial plain and was known as Songzhou and Guide. The Longhai and Beijing–Kowloon railways cross here, extending its long role as a transport hub."
 PWC_CITY_PHOTO_170_TT: "§HXian§!\nAn ancient capital and western research, industry, and transport centre."
 PWC_CITY_PHOTO_172_TT: "§HAnhui Suzhou§!\nSuzhou lies on northern Anhui's plain near the meeting of four provinces. The Sui and Xinbian rivers cross its farmland, making it a transport and agricultural link in the Huaihai region."
 PWC_CITY_PHOTO_173_TT: "§HHuainan§!\nHuainan straddles the Huai River where northern plains give way to the Jianghuai hills. Coal mining fostered power generation and chemicals, giving the riverside city a strong industrial character."
 PWC_CITY_PHOTO_174_TT: "§HLongnan§!\nLongnan sits between the Qinling and Min Mountains near the Shaanxi–Gansu–Sichuan border. The Jialing and Bailong rivers carve valleys whose mild climate contrasts with northern Gansu."
 PWC_CITY_PHOTO_175_TT: "§HShangluo§!\nShangluo takes its name from Mount Shang and the Luo River on the Qinling Mountains' southern slopes. Its valleys drain toward both the Yellow and Yangtze rivers, linking Guanzhong with Hubei and Henan."
 PWC_CITY_PHOTO_176_TT: "§HYancheng§!\nYancheng faces the Yellow Sea, where tidal flats and waterways form extensive coastal wetlands. Migratory birds stop here along the East Asian flyway, and some habitats are World Heritage sites."
 PWC_CITY_PHOTO_177_TT: "§HPingdingshan§!\nPingdingshan is named for the flat-topped hills north of its urban center, between the Funiu Mountains and Huanghuai Plain. Coal built the modern industrial city, beside older remains of the Ying state."
 PWC_CITY_PHOTO_178_TT: "§HXuchang§!\nXuchang lies where the Funiu foothills meet eastern Henan’s plain, crossed by the Ying River. Historically called Xu Prefecture, it retains a strong connection to the late Han and early Wei era."
 PWC_CITY_PHOTO_179_TT: "§HHebi§!\nHebi sits below the southeastern Taihang Mountains, where the Qi and Wei rivers pass through hills and plains. Coal mining drove its urban growth, while the Qi valley preserves an older cultural landscape."
 PWC_CITY_PHOTO_180_TT: "§HLuohe§!\nLuohe lies on southern Henan's plains, crossed by the Sha and Li rivers. Its farming hinterland and transport links support a prominent food industry, including meat and flour products."
 PWC_CITY_PHOTO_181_TT: "§HSuqian§!\nSuqian lies on northern Jiangsu's plain, crossed by the Grand Canal and the former Yellow River course. Hongze and Luoma lakes frame a landscape of canals, waterways and lakeside towns."
 PWC_CITY_PHOTO_183_TT: "§HAba§!\nAba spans northwestern Sichuan's highlands, mixing mountains, grasslands and upper Min River valleys. Tibetan and Qiang cultures meet here, alongside the alpine lakes of Jiuzhaigou."
 PWC_CITY_PHOTO_184_TT: "§HZhoukou§!\nZhoukou stands on eastern Henan's plain where the Sha, Ying and Jialu rivers meet. The histories of ancient Chenzhou and Huaiyang are closely tied to trade along these waterways."
 PWC_CITY_PHOTO_185_TT: "§HHuaibei§!\nHuaibei lies on northern Anhui's plain, crossed by the Sui and Tuo rivers. Modern coal mining drove its expansion, while its brewing tradition survives in local spirits such as Kouzijiao."
 PWC_CITY_PHOTO_186_TT: "§HHaozhou§!\nBozhou lies on the Huanghuai Plain beside the Guo River and was once called Qiao. Its long tradition of growing and trading medicinal herbs shapes the city alongside its historic core."
 PWC_CITY_PHOTO_187_TT: "§HHuaian§!\nHuai'an sits among the rivers and lakes of the Jianghuai Plain, with the Grand Canal crossing the city. Its canal transport history is bound to Hongze Lake and the Huai River system."
 PWC_CITY_PHOTO_188_TT: "§HGanzi§!\nGarzê spans the Hengduan Mountains and highland valleys of western Sichuan, within the traditional Kham region. Mountains, grasslands and Tibetan settlements line historic routes between Sichuan and Tibet."
 PWC_CITY_PHOTO_190_TT: "§HHanzhong§!\nHanzhong occupies the Han River basin between the Qinling and Daba Mountains, a passage among Shaanxi, Gansu and Sichuan. Its mild valley contrasts with Guanzhong, once linked by mountain plank roads."
 PWC_CITY_PHOTO_191_TT: "§HAnkang§!\nAnkang lies between the Qinling and Daba Mountains, with the Han River running through its valleys. Routes among Sichuan, Shaanxi and Hubei have long passed through this mountain and river town."
 PWC_CITY_PHOTO_192_TT: "§HNanyang§!\nNanyang occupies a basin ringed by the Funiu and Tongbai mountains, between the upper Han and Huai river systems. Known in antiquity as Wan, it guarded routes from the central plains toward Jingxiang."
 PWC_CITY_PHOTO_193_TT: "§HFuyang§!\nFuyang lies on northwestern Anhui's plain, where the Ying River flows southeast into the Huai. Its waterways and fertile fields sustained farming and linked the city to Huai River trade."
 PWC_CITY_PHOTO_194_TT: "§HZhumadian§!\nZhumadian lies where western Henan's hills descend toward the eastern plain, crossed by the Ru and Hong rivers. Formerly Runan and Caizhou, it bears a name that recalls its old postal routes."
 PWC_CITY_PHOTO_196_TT: "§HBengbu§!\nBengbu grew along the Huai River where the Beijing–Shanghai and Huainan railways meet. Rail and river transport fostered modern commerce and industry, linking northern Anhui with the Jianghuai region."
 PWC_CITY_PHOTO_197_TT: "§HYangzhou§!\nYangzhou stands north of the Yangtze, where the Grand Canal made it a center of grain transport and the salt trade. Gardens, old lanes and Huaiyang cuisine preserve that mercantile heritage."
 PWC_CITY_PHOTO_198_TT: "§HShiyan§!\nShiyan lies among the Qinling, Daba and Wudang mountains, crossed by the Han River. Wudang's Taoist buildings and the Danjiangkou Reservoir mark its religious and engineering histories."
 PWC_CITY_PHOTO_199_TT: "§HChuzhou§!\nChuzhou lies between eastern Anhui's hills and the Jianghuai Plain, across the Yangtze and Huai watersheds. Mount Langya and the Drunkard's Pavilion celebrated by Ouyang Xiu anchor its literary landscape."
 PWC_CITY_PHOTO_200_TT: "§HJiangsu Taizhou§!\nTaizhou lies on the Jianghuai Plain north of the Yangtze, with riverfront land to the south and dense waterways to the north. Once Hailing, it grew through canal and river trade."
 PWC_CITY_PHOTO_201_TT: "§HMianyang§!\nMianyang follows the Fu River from the Longmen Mountains toward Sichuan's northern hills. Formerly Mianzhou, it is a transport link known also for electronics and research industries."
 PWC_CITY_PHOTO_202_TT: "§HGuangyuan§!\nGuangyuan lies on the upper Jialing River at Sichuan Basin's northern edge. The Micang and Daba mountains frame routes toward Shaanxi and Gansu, giving old Lizhou its gateway role."
 PWC_CITY_PHOTO_203_TT: "§HLuan§!\nLu'an lies below the Dabie Mountains, where uplands descend toward western Anhui's hills and the Huai plain. Reservoirs on the Pi and Shi rivers tame mountain waters and shape its landscape."
 PWC_CITY_PHOTO_204_TT: "§HBazhong§!\nBazhong lies south of the Micang and Daba mountains, where rugged land gives way to Sichuan Basin hills. The Nan River joins the Ba River, and their valleys have long carried travel through the northeast."
 PWC_CITY_PHOTO_205_TT: "§HNantong§!\nNantong stands north of the Yangtze estuary, facing both the Yellow Sea and the river shipping lane. Its coast, port and waterways gave old Tongzhou a dual maritime and river trade tradition."
 PWC_CITY_PHOTO_206_TT: "§HXinyang§!\nXinyang lies on the upper Huai River between the Tongbai and Dabie mountains. Its hill tea gardens produce Xinyang Maojian, while its location blends northern and southern landscapes."
 PWC_CITY_PHOTO_207_TT: "§HHefei§!\nA Jianghuai administrative, research, and manufacturing centre."
 PWC_CITY_PHOTO_208_TT: "§HXiangyang§!\nXiangyang straddles the middle Han River on a historic north–south route. Its walls and river recall centuries of military contest, while the surrounding basin links the central plains and Jianghan Plain."
 PWC_CITY_PHOTO_209_TT: "§HChamdo§!\nQamdo lies in eastern Tibet's Hengduan Mountains, deeply cut by the Jinsha, Lancang and Nu river systems. Its valleys have long carried routes through the traditional Kham region."
 PWC_CITY_PHOTO_210_TT: "§HSuizhou§!\nSuizhou lies between the Tongbai and Dahong mountains, crossed by the Yun River. Bronze bells excavated from the ancient Zeng state tie the city to early Chinese ritual music."
 PWC_CITY_PHOTO_211_TT: "§HDazhou§!\nDazhou is a transport junction in northeastern Sichuan, near Chongqing and Shaanxi. The photograph shows Dazhou railway station."
 PWC_CITY_PHOTO_212_TT: "§HMaanshan§!\nMa'anshan sits where the Yangtze plain meets eastern Anhui's hills near Nanjing. Steel shaped the modern city, while river sites such as Caishiji preserve a literary heritage."
 PWC_CITY_PHOTO_213_TT: "§HZhenjiang§!\nZhenjiang stands on the Yangtze's south bank where the Grand Canal meets the river. Known as Jingkou, it grew at this transport crossing, with Jinshan preserving stories of its past."
 PWC_CITY_PHOTO_214_TT: "§HNanjing§!\nA former imperial capital and major lower-Yangtze industrial centre."
 PWC_CITY_PHOTO_215_TT: "§HChangzhou§!\nChangzhou lies on southern Jiangsu's plain between the Yangtze and Lake Tai, crossed by the Grand Canal. Old Yanling and Piling grew through Jiangnan commerce and industry amid a lasting canal network."
 PWC_CITY_PHOTO_216_TT: "§HJiangsu Suzhou§!\nSuzhou lies east of Lake Tai in the Yangtze River Delta. Known for its classical gardens and canals, it is also a major manufacturing city."
 PWC_CITY_PHOTO_217_TT: "§HNanchong§!\nNanchong follows the middle Jialing River through northeastern Sichuan's hills. Once Guozhou and Shunqing, it is associated with silk and citrus, and the river links it across the basin."
 PWC_CITY_PHOTO_218_TT: "§HShennongjia§!\nShennongjia occupies northwestern Hubei's mountains, known for extensive forests, alpine meadows and diverse wildlife. Its name recalls the Shennong legend, while its ecosystems remain protected."
 PWC_CITY_PHOTO_219_TT: "§HWuxi§!\nWuxi lies north of Lake Tai and south of the Yangtze amid a network of canals and lakes. Modern commerce and textiles flourished here, alongside Yixing's enduring pottery tradition."
 PWC_CITY_PHOTO_220_TT: "§HXiaogan§!\nXiaogan sits at the northern edge of the Jianghan Plain, near the meeting of the Fu and Huan rivers. Hills rise to the north, while southern waterways link it to the Han River basin."
 PWC_CITY_PHOTO_221_TT: "§HChongming§!\nChongming Island formed from sediment at the Yangtze estuary. Its flat land is shaped by both river and sea, preserving the landscape of an alluvial island north of central Shanghai."
 PWC_CITY_PHOTO_222_TT: "§HShigatse§!\nShigatse lies in the heart of Tsang, a center of Tibetan Buddhist culture. Tashilhunpo Monastery, seat of the Panchen Lamas, anchors the historic town amid plateau valleys."
 PWC_CITY_PHOTO_223_TT: "§HDeyang§!\nDeyang stands where the Longmen Mountains descend to the Chengdu Plain. Heavy machinery marks the modern city, while Sanxingdui near Guanghan reveals ancient Shu culture."
 PWC_CITY_PHOTO_224_TT: "§HYichang§!\nYichang stands at the exit of Xiling Gorge, where mountains open onto the Jianghan Plain. The Three Gorges waterway and Qing River have shaped transport and major hydropower works."
 PWC_CITY_PHOTO_225_TT: "§HJingmen§!\nJingmen lies on the northwestern edge of the Jianghan Plain, crossed by the Han River and backed by the Jingshan foothills. Plains, lakes and mountain routes meet here."
 PWC_CITY_PHOTO_226_TT: "§HHuanggang§!\nHuanggang lies below the Dabie Mountains on the Yangtze's north bank. Old Huangzhou is closely tied to Su Shi's writings during his exile."
 PWC_CITY_PHOTO_228_TT: "§HShanghai§!\nChina's leading financial, trade, shipping, and industrial centre."
 PWC_CITY_PHOTO_229_TT: "§HChengdu§!\nA western economic, technology, cultural, and transport centre."
 PWC_CITY_PHOTO_230_TT: "§HWuhu§!\nWuhu stands where the Qingyi River joins the Yangtze, a natural setting for river trade. Once called Jiuzi, its port, commerce and industry shaped southern Anhui."
 PWC_CITY_PHOTO_231_TT: "§HTongling§!\nTongling grew beside the Yangtze, with copper deposits in nearby hills. Ancient mining and smelting link Bronze Age culture with its modern metals industry."
 PWC_CITY_PHOTO_232_TT: "§HXuancheng§!\nXuancheng sits where southern Anhui's mountains descend toward the Yangtze plain. Old Xuanzhou is associated with poetry, landscapes and Xuan paper."
 PWC_CITY_PHOTO_233_TT: "§HAnqing§!\nAnqing stands on the Yangtze's north bank below the Dabie Mountains, amid river bends and lakes. A former Anhui capital, it retains a history of river commerce."
 PWC_CITY_PHOTO_234_TT: "§HSuining§!\nSuining lies in the hills of central Sichuan Basin, with the Fu River passing through the city. Its valley links nearby regions, while textiles and food processing shape local industry."
 PWC_CITY_PHOTO_235_TT: "§HHuzhou§!\nHuzhou stands on Lake Tai's southern shore, where two Tiao streams meet. Its waterways supported sericulture, and Huzhou silk became known far beyond the region."
 PWC_CITY_PHOTO_236_TT: "§HLhasa§!\nA high-altitude religious, administrative, and tourism centre."
 PWC_CITY_PHOTO_237_TT: "§HJiaxing§!\nJiaxing lies on the Hangzhou–Jiaxing–Huzhou Plain, threaded by the Grand Canal. Once called Xiuzhou, it preserves trade heritage and modern history around South Lake."
 PWC_CITY_PHOTO_238_TT: "§HChongqing§!\nAn upper-Yangtze manufacturing, shipping, and mountain metropolis."
 PWC_CITY_PHOTO_239_TT: "§HYaan§!\nYa'an lies at Sichuan Basin's western edge, where the Qingyi River crosses a rainy valley. A former Xikang capital and plateau gateway, its forests shelter giant pandas."
 PWC_CITY_PHOTO_240_TT: "§HEnshi§!\nEnshi lies in southwestern Hubei's Wuling Mountains, where the Qing River cuts deep valleys. Tujia and Miao communities give the region a distinct cultural landscape."
 PWC_CITY_PHOTO_241_TT: "§HGuangan§!\nGuang'an lies among eastern Sichuan's hills, crossed by the Huaying Mountains and the Qu and Jialing rivers. The birthplace of Deng Xiaoping, it combines farming valleys with modern history."
 PWC_CITY_PHOTO_242_TT: "§HChizhou§!\nChizhou sits between the Yangtze and southern Anhui's mountains, with the Qiupu River running northward. Mount Jiuhua's Buddhist heritage joins lakes and hills in its landscape."
 PWC_CITY_PHOTO_243_TT: "§HZiyang§!\nZiyang lies in the hills of central Sichuan Basin, crossed by the Tuo River. Valley farms support grain, peanuts and pig raising between Chengdu and Chongqing."
 PWC_CITY_PHOTO_244_TT: "§Hjingzhou§!\nJingzhou lies in the Jianghan Plain, where the Yangtze winds among lakes and channels. Old Jiangling's walls recall Chu history, while waterways support farming and shipping."
 PWC_CITY_PHOTO_245_TT: "§HNyingchi§!\nNyingchi occupies the middle and lower Yarlung Tsangpo valley, where deep gorges meet mild river country. Tibetan and Monpa cultures share forests and snow peaks."
 PWC_CITY_PHOTO_246_TT: "§HWuhan§!\nA great Yangtze crossing and central Chinese transport hub."
 PWC_CITY_PHOTO_247_TT: "§HQianjiang§!\nQianjiang lies in the Jianghan Plain, with the Han River to the north and canals crossing flat farmland. The Jianghan oilfield and farm agriculture shaped its modern landscape."
 PWC_CITY_PHOTO_248_TT: "§HHangzhou§!\nA historic canal city and modern digital economy centre."
 PWC_CITY_PHOTO_249_TT: "§HHuangshan§!\nHuangshan lies on the upper Xin'an River in the former Huizhou region. Dramatic peaks stand beside Huizhou villages and architecture, binding landscape and culture."
 PWC_CITY_PHOTO_250_TT: "§HXiantao§!\nXiantao lies between the Han and Dongjing rivers on the Jianghan Plain, amid lakes and canals. Once Mianyang, its farming and fishing reflect a water-country way of life."
 PWC_CITY_PHOTO_251_TT: "§HTianmen§!\nTianmen lies in the central Jianghan Plain, where waterways connect to the Han River. Formerly Jingling, it is the birthplace of Lu Yu, a major figure in Chinese tea culture."
 PWC_CITY_PHOTO_253_TT: "§HMeishan§!\nMeishan lies south of the Chengdu Plain, with the Min River running through hills and valleys. It is home to Song writers Su Xun, Su Shi and Su Zhe, remembered at the Three Su Shrine."
 PWC_CITY_PHOTO_254_TT: "§HEzhou§!\nEzhou sits on the Yangtze's south bank amid lakes such as Liangzi. Historic bronze-mirror making and the local Wuchang fish are tied to this lakeside setting."
 PWC_CITY_PHOTO_255_TT: "§HNingbo§!\nNingbo faces Hangzhou Bay and the East China Sea, with long shipping and trading traditions. A Maritime Silk Road port, it later grew through treaty-port trade and harbor industries."
 PWC_CITY_PHOTO_256_TT: "§HZhoushan§!\nZhoushan is an East China Sea archipelago south of the Yangtze estuary. Rich fishing grounds and deepwater ports sustain its maritime economy and island waterways."
 PWC_CITY_PHOTO_257_TT: "§HHuangshi§!\nHuangshi stretches along the Yangtze's south bank, with lakes below the Mufu Mountains. Mining fostered metallurgy and materials industries, leaving a riverside industrial landscape."
 PWC_CITY_PHOTO_258_TT: "§HShaoxing§!\nShaoxing lies on the watery plain south of Hangzhou Bay. Ancient Kuaiji and Yuezhou were centers of Yue culture, while rice wine and textiles carry on craft traditions."
 PWC_CITY_PHOTO_259_TT: "§HXianning§!\nXianning lies south of the middle Yangtze, where hills meet lake-dotted plains. Hot springs, osmanthus and brick tea are local hallmarks linked to upland farming."
 PWC_CITY_PHOTO_260_TT: "§HChangde§!\nChangde stands on the Yuan River, west of Dongting Lake in northern Hunan, and serves as a transport and commercial centre for the province's northwest."
 PWC_CITY_PHOTO_261_TT: "§HNeijiang§!\nNeijiang lies in central Sichuan's hills, with the Tuo River flowing through the city. Sugarcane cultivation and sugar making gave it the nickname Sweet City."
 PWC_CITY_PHOTO_262_TT: "§HJingdezhen§!\nJingdezhen stands beside the Chang River and was once called Changnan. Porcelain kilns made it a renowned ceramics center, while aircraft manufacturing emerged in modern times."
 PWC_CITY_PHOTO_263_TT: "§HLeshan§!\nLeshan stands where the Min, Dadu and Qingyi rivers meet, beneath the cliff-carved Giant Buddha. Nearby Mount Emei adds a Buddhist landscape to its three-river setting."
 PWC_CITY_PHOTO_264_TT: "§HZhangjiajie§!\nZhangjiajie lies in the Wuling Mountains, with sandstone pillars, gorges and caves. Wulingyuan's peaks are a World Heritage landscape amid Tujia communities."
 PWC_CITY_PHOTO_265_TT: "§HYueyang§!\nYueyang stands east of Dongting Lake where the Xiang and Yangtze waterways meet. Yueyang Tower overlooks the lake, while its port grew through river and lake shipping."
 PWC_CITY_PHOTO_266_TT: "§HJiujiang§!\nJiujiang stands where Poyang Lake meets the Yangtze, with Mount Lu to the south. Once Jiangzhou and Xunyang, it combines shipping with celebrated mountain scenery."
 PWC_CITY_PHOTO_267_TT: "§HShannan§!\nShannan lies along the Yarlung Tsangpo valley south of the Gangdise range. Temples and historic sites around Nedong preserve memories of Tibet's early imperial era."
 PWC_CITY_PHOTO_268_TT: "§HJinhua§!\nJinhua lies in central Zhejiang's basin, where the Dongyang and Wuyi rivers form the Jinhua River. Rail links support trade, while old Wuzhou's heritage endures."
 PWC_CITY_PHOTO_269_TT: "§HShangrao§!\nShangrao lies near the Jiangxi, Anhui, Zhejiang and Fujian borders. The Xin and Rao rivers flow toward Poyang Lake, while Dexing copper and optical and solar industries shape its economy."
 PWC_CITY_PHOTO_270_TT: "§HZigong§!\nZigong lies in southern Sichuan's hills, where salt wells supported a long salt-making history. Dinosaur fossils and lantern festivals add to the old Salt Capital's heritage."
 PWC_CITY_PHOTO_271_TT: "§HXiangxi§!\nXiangxi lies in the Wuling Mountains, where the You and Wu rivers cross basins and gorges. Tujia and Miao communities preserve varied buildings and customs."
 PWC_CITY_PHOTO_272_TT: "§HYiyang§!\nYiyang lies where the Xuefeng Mountains descend toward Dongting Lake, with the Zi River running east. Hillside farming and lake transport meet in this landscape."
 PWC_CITY_PHOTO_273_TT: "§HQuzhou§!\nQuzhou sits at the western end of the Jinhua–Quzhou Basin, where rivers converge. Mountain passes link four provinces, while Jianglang Mountain is known for Danxia formations."
 PWC_CITY_PHOTO_275_TT: "§HLuzhou§!\nLuzhou stands where the Tuo joins the Yangtze, with the Chishui River crossing its southern hills. River shipping and a long distilling tradition made its spirits well known."
 PWC_CITY_PHOTO_276_TT: "§HZhejiang Taizhou§!\nTaizhou lies between the mountains of eastern Zhejiang and the East China Sea. Its varied coast and landscapes frame a strong private manufacturing sector known for pharmaceuticals, auto parts, and molds."
 PWC_CITY_PHOTO_277_TT: "§HLiangshan§!\nLiangshan occupies the rugged mountains of southwestern Sichuan, where the Jinsha River cuts deep gorges. It is a major centre of Yi culture, and its capital, Xichang, is a centre of the Panxi region."
 PWC_CITY_PHOTO_278_TT: "§HYibin§!\nYibin stands where the Min and Jinsha rivers join to form the upper Yangtze. Known as the First City on the Yangtze, it combines the Shunan Bamboo Sea with a long tradition of distilling spirits."
 PWC_CITY_PHOTO_279_TT: "§HDiqing§!\nDiqing lies amid the snow peaks and deep valleys of northwestern Yunnan. Tibetan culture remains prominent here, while Shangri-La and Meili Snow Mountain are defining landmarks."
 PWC_CITY_PHOTO_280_TT: "§HZunyi§!\nZunyi is an industrial and transport centre in northern Guizhou, known for its mountain setting and its role in modern Chinese history."
 PWC_CITY_PHOTO_281_TT: "§HNanchang§!\nA central Yangtze transport hub and regional manufacturing base."
 PWC_CITY_PHOTO_282_TT: "§HJiangxi Yichun§!\nYichun sits where the hills of western Jiangxi meet the Poyang Lake plain, with the Yuan River running through it. Mount Mingyue's hot springs and the city's former name, Yuanzhou, reflect its landscape and history."
 PWC_CITY_PHOTO_283_TT: "§HTongren§!\nTongren lies in the Wuling Mountains near the Guizhou, Hunan, and Chongqing borders. Rivers have carved deep valleys here, while Mount Fanjing is known for its striking peaks and biodiversity."
 PWC_CITY_PHOTO_284_TT: "§HHuaihua§!\nHuaihua lies among the mountains and Yuan River waterways of western Hunan. Long a route between Hunan, Guizhou, and Guangxi, it retains a record of river commerce in Hongjiang Ancient Commercial Town."
 PWC_CITY_PHOTO_285_TT: "§HLishui§!\nLishui occupies the mountains of southwestern Zhejiang, along the upper Ou River. Historically called Chuzhou, the area preserves traditions of Longquan celadon and sword making."
 PWC_CITY_PHOTO_286_TT: "§HZhaotong§!\nZhaotong stands in the Wumeng Mountains where Yunnan, Sichuan, and Guizhou meet. The Jinsha River gorges shape its terrain; the ancient Southern Silk Road and mountain crops such as gastrodia mark its history and economy."
 PWC_CITY_PHOTO_287_TT: "§HChangsha§!\nA manufacturing and service centre on the middle Yangtze."
 PWC_CITY_PHOTO_288_TT: "§HYingtan§!\nYingtan lies in the Xin River basin of northeastern Jiangxi, near the Wuyi foothills. The red sandstone landforms and Taoist heritage of Mount Longhu give the area a distinctive character."
 PWC_CITY_PHOTO_289_TT: "§HWenzhou§!\nWenzhou grew around the mouth of the Ou River, between islands, estuary, and southern Zhejiang's hills. Maritime trade and an energetic private economy have long shaped its commercial culture."
 PWC_CITY_PHOTO_292_TT: "§HJiangxi Fuzhou§!\nFuzhou, formerly Linchuan, lies among the hills and river valleys of eastern Jiangxi. The area's literary and intellectual legacy includes Wang Anshi and the playwright Tang Xianzu."
 PWC_CITY_PHOTO_293_TT: "§HNanping§!\nNanping lies among the mountains and Jian River valleys of northern Fujian, with the Wuyi Mountains to the northwest. Tea growing and the legacy of Zhu Xi remain part of the region's identity."
 PWC_CITY_PHOTO_295_TT: "§HNujiang§!\nNujiang follows deep valleys of the Hengduan Mountains, between the Nu and Lancang rivers and Mount Gaoligong. Lisu culture and scattered mountain villages are central to this border region."
 PWC_CITY_PHOTO_296_TT: "§HLoudi§!\nLoudi lies in the hills of central Hunan, east of the Xuefeng Mountains, with the Lian River crossing the area. The mining and metal industries around Lengshuijiang contrast with the historical legacy of Shuangfeng, Zeng Guofan's birthplace."
 PWC_CITY_PHOTO_298_TT: "§HXinyu§!\nXinyu sits in a basin of west-central Jiangxi, crossed by the Yuan River. Steelmaking has shaped the city, while the islands and coves of Fairy Lake add a very different landscape."
 PWC_CITY_PHOTO_299_TT: "§HXiangtan§!\nXiangtan lies on the middle Xiang River and was long a center of inland shipping and trade. It is known for Xiangtan lotus seeds and as the hometown of notable figures in modern Hunan history."
 PWC_CITY_PHOTO_300_TT: "§HZhuzhou§!\nZhuzhou stands by the Xiang River below the Luoxiao Mountains and is a major rail junction between central and southern China. Rail equipment and aero-engine industries shape its manufacturing base."
 PWC_CITY_PHOTO_301_TT: "§HPingxiang§!\nPingxiang lies on the Jiangxi–Hunan border, with the Wugong Mountains to the south. Coal mining drove its early industrial growth; alpine meadows now share the landscape with remnants of that mining past."
 PWC_CITY_PHOTO_302_TT: "§HJian§!\nJi'an, historically Luling, is crossed by the Gan River and rises westward toward the Luoxiao Mountains. Luling produced many scholars, while Jinggangshan preserves sites of modern revolutionary history."
 PWC_CITY_PHOTO_303_TT: "§HLijiang§!\nLijiang lies where the Hengduan Mountains meet the Yunnan–Guizhou Plateau, beneath Jade Dragon Snow Mountain. Naxi Dongba culture and the water-lined streets of its old town define its cultural landscape."
 PWC_CITY_PHOTO_304_TT: "§HBijie§!\nBijie occupies the Wumeng Mountains of northwestern Guizhou, above the upper Wu River. The azaleas of Baili Dujuan and the karst formations of Zhijin Cave show the area's varied highland terrain."
 PWC_CITY_PHOTO_305_TT: "§HShaoyang§!\nShaoyang, formerly Baoqing, lies between the hills of central Hunan and the Nanling Mountains. The Zi River crosses the area, while Langshan's red sandstone scenery stands alongside a long trading tradition."
 PWC_CITY_PHOTO_306_TT: "§HNingde§!\nNingde lies on Fujian's northeastern coast, where Sandu Bay forms a natural harbor. Mount Taimu and the tidal flats of Xiapu illustrate the close meeting of mountains, sea, and fishing communities."
 PWC_CITY_PHOTO_307_TT: "§HQiandongnan§!\nQiandongnan covers the Qingshui and Duliu river valleys of southeastern Guizhou. Miao and Dong villages preserve drum towers, covered bridges, and festivals that give the area a rich cultural landscape."
 PWC_CITY_PHOTO_308_TT: "§HHengyang§!\nHengyang sits where the Xiang and Zheng rivers meet in a basin of central Hunan. An important north–south crossroads, it also includes Mount Heng, a longstanding religious and scenic landmark."
 PWC_CITY_PHOTO_309_TT: "§HQiannan§!\nQiannan lies in southern Guizhou's karst country, among clustered peaks, caves, and river valleys. Bouyei and Miao communities share the region, and Libo is noted for its forests and waterways."
 PWC_CITY_PHOTO_310_TT: "§HPanzhihua§!\nPanzhihua grew in the warm, steep Jinsha River valley. Steelmaking during the Third Front era shaped the city, while vanadium and titanium resources and tropical fruit remain distinctive local products."
 PWC_CITY_PHOTO_311_TT: "§HGuiyang§!\nA southwestern transport centre and digital economy base."
 PWC_CITY_PHOTO_312_TT: "§HGanzhou§!\nGanzhou lies in southern Jiangxi, where the Zhang and Gong rivers join to form the Gan River. A major center of Hakka culture, it preserves Song-era walls and traditional enclosed houses."
 PWC_CITY_PHOTO_313_TT: "§HSanming§!\nSanming lies in western Fujian's mountains, crossed by upper Min River tributaries. Shaxian snacks originated here, while Taining's red sandstone and Yong'an's stone forest reveal varied terrain."
 PWC_CITY_PHOTO_314_TT: "§HQujing§!\nQujing occupies eastern Yunnan's highlands and an old route toward Guizhou. The Pearl River rises in its northern area, and Luoping is known for karst peaks amid fields of rapeseed flowers."
 PWC_CITY_PHOTO_315_TT: "§HYongzhou§!\nYongzhou, historically Lingling, lies where the Xiao and Xiang rivers meet before the land rises toward the Nanling Mountains. Liu Zongyuan's writings and Jiangyong women's script enrich its cultural legacy."
 PWC_CITY_PHOTO_316_TT: "§HHunan Binzhou§!\nChenzhou lies in the Nanling Mountains where Hunan, Guangdong, and Jiangxi meet. Long a southern gateway with mineral resources, it also includes Dongjiang Lake and the forested Mangshan Mountains."
 PWC_CITY_PHOTO_317_TT: "§HLiupanshui§!\nLiupanshui occupies the Wumeng Mountains of western Guizhou near the divide between the Yangtze and Pearl river basins. Coal fostered its industries, while the highland climate brings cool summers."
 PWC_CITY_PHOTO_318_TT: "§HDali§!\nDali stands between the Cangshan Mountains and Erhai Lake, on a historic western Yunnan trade route. Bai villages, the Three Pagodas, and the old town recall the cultures of the Nanzhao and Dali kingdoms."
 PWC_CITY_PHOTO_319_TT: "§HFujian Fuzhou§!\nA historic southeastern port facing the Taiwan Strait."
 PWC_CITY_PHOTO_320_TT: "§HAnshun§!\nAnshun sits on the karst plateau of west-central Guizhou and is home to the Huangguoshu waterfall group. Tunpu villages preserve elements of Ming military-settlement culture amid the limestone scenery."
 PWC_CITY_PHOTO_321_TT: "§HChuxiong§!\nChuxiong lies in central Yunnan's mountains along the route from central to western Yunnan. Yi culture is prominent, and dinosaur fossils from Lufeng reveal a much older geological past."
 PWC_CITY_PHOTO_323_TT: "§HKunming§!\nThe Spring City and China's gateway to South and Southeast Asia."
 PWC_CITY_PHOTO_324_TT: "§HGuilin§!\nGuilin follows the Li River through a celebrated landscape of limestone peaks. Its lakes and the rural scenery around Yangshuo have long made the area a symbol of Chinese landscape art."
 PWC_CITY_PHOTO_325_TT: "§HQianxinan§!\nQianxinan occupies the Nanpan and Beipan river basins in southwestern Guizhou. Bouyei and Miao traditions meet among dense karst peaks, notably at Wanfenglin and Maling River Gorge."
 PWC_CITY_PHOTO_326_TT: "§HLiuzhou§!\nLiuzhou sits on a bend of the Liu River amid the hills of north-central Guangxi. It is a major industrial city known for automobile manufacturing and the local rice-noodle dish luosifen."
 PWC_CITY_PHOTO_327_TT: "§HLongyan§!\nLongyan lies in the hills of western Fujian, a major Hakka cultural area. Yongding's earthen buildings are especially distinctive, while Mount Guanzhai and the Ting River shape the mountain settlements."
 PWC_CITY_PHOTO_328_TT: "§HQuanzhou§!\nQuanzhou faces the Taiwan Strait and flourished as a maritime trading port during the Song and Yuan periods. Religious sites and Minnan streets preserve traces of centuries of overseas exchange."
 PWC_CITY_PHOTO_329_TT: "§HBaoshan§!\nBaoshan lies between the Gaoligong and Nu mountains in western Yunnan, along old routes toward the border. Tengchong's volcanoes, hot springs, and trade-route remains reveal both geological and commercial histories."
 PWC_CITY_PHOTO_330_TT: "§HPutian§!\nPutian lies on Fujian's central coast, where the Mulan River reaches coastal plains and tidal flats. Mazu worship centered on Meizhou Island and Puxian opera express its maritime and folk traditions."
 PWC_CITY_PHOTO_331_TT: "§HHechi§!\nHechi occupies the karst mountains of northern Guangxi, where the Hongshui River passes through valleys and clustered peaks. The Liu Sanjie tradition around Yizhou and ethnic song gatherings enrich its cultural life."
 PWC_CITY_PHOTO_332_TT: "§HShaoguan§!\nShaoguan lies where Guangdong meets Hunan and Jiangxi, with the Bei River crossing the Nanling Mountains. It has long been a northern gateway to Guangdong, and Mount Danxia is its striking sandstone landmark."
 PWC_CITY_PHOTO_333_TT: "§HDehong§!\nDehong lies on Yunnan's western border, where the Ruili River crosses warm valleys. Dai and Jingpo cultures and trade through crossings into Myanmar give it a distinctive border character."
 PWC_CITY_PHOTO_334_TT: "§HTaibei§!\nTaiwan's largest metropolitan, commercial, and administrative centre."
 PWC_CITY_PHOTO_335_TT: "§HQingyuan§!\nQingyuan stretches along the Bei River through northern Guangdong's mountains. Yingde tea, Lianzhou's underground river, and Yao mountain communities bring together Lingnan waterways and Nanling highlands."
 PWC_CITY_PHOTO_336_TT: "§HZhangzhou§!\nZhangzhou lies in southern Fujian’s Jiulong River basin, where plains open toward the Taiwan Strait. Coastal fishing, Minnan culture, and Nanjing County’s tulou reflect its meeting of mountains and sea."
 PWC_CITY_PHOTO_337_TT: "§HHezhou§!\nHezhou lies in the mountains where Guangxi, Hunan, and Guangdong meet. Rivers cross its karst hills, while Huangyao's old streets and Yao villages preserve varied local traditions."
 PWC_CITY_PHOTO_338_TT: "§HXinzhu§!\nHsinchu stands on Taiwan's northwestern coast, known for the strong seasonal winds called the Nine-Descending Wind. Old urban streets coexist with a science park whose semiconductor industry shapes the modern city."
 PWC_CITY_PHOTO_339_TT: "§HBose§!\nBaise lies in the You River basin of western Guangxi, where mountains lead toward Yunnan and Vietnam. The river valley was an old transport corridor, and the Baise Uprising left a mark on modern history."
 PWC_CITY_PHOTO_340_TT: "§HLincang§!\nLincang lies in southwestern Yunnan, where the Lancang River and mountains form deep valleys near Myanmar. Tea around Shuangjiang and the traditions of Wa and Dai communities shape the border region."
 PWC_CITY_PHOTO_341_TT: "§HYuxi§!\nYuxi occupies central Yunnan's highlands and is home to the clear, deep waters of Fuxian Lake. The Ailao Mountains reach its west, while tobacco growing and processing have long supported local industry."
 PWC_CITY_PHOTO_342_TT: "§HMeizhou§!\nMeizhou lies in the hills where Guangdong, Fujian, and Jiangxi meet and is a major center of Hakka culture. Enclosed houses, the Hakka language, and histories of migration define the area."
 PWC_CITY_PHOTO_343_TT: "§HXiamen§!\nXiamen lies on Fujian’s southeastern coast and includes offshore Xiamen Island and mainland districts. Gulangyu’s historic buildings and the later special economic zone trace chapters of its port-city history."
 PWC_CITY_PHOTO_344_TT: "§HPuer§!\nPu'er occupies the mountains of southern Yunnan, where the Lancang River runs through tea hills and valleys. A long history of tea cultivation and trade meets tropical forests and diverse ethnic traditions."
 PWC_CITY_PHOTO_345_TT: "§HHeyuan§!\nHeyuan lies in the upper Dong River basin of northeastern Guangdong, where hills surround river valleys. Wanlu Lake is an important water source, and Hakka settlements retain mountain traditions."
 PWC_CITY_PHOTO_346_TT: "§HHonghe§!\nHonghe spans the highlands and Red River valley of southern Yunnan. Hani rice terraces climb the hillsides, while Mengzi and Gejiu preserve histories of railways and mining."
 PWC_CITY_PHOTO_347_TT: "§HWenshan§!\nWenshan occupies karst mountains of southeastern Yunnan near Vietnam. Zhuang and Miao cultures share the area with Puzhehei's lakes and peaks, while notoginseng is a distinctive crop."
 PWC_CITY_PHOTO_348_TT: "§HTaizhong§!\nTaichung lies in central Taiwan, between the Taiwan Strait and the Central Mountain Range. Old streets, a harbor, and precision machinery link its urban plain to the wider mountain and coastal region."
 PWC_CITY_PHOTO_349_TT: "§HLaibin§!\nLaibin lies in central Guangxi's Hongshui River basin, where hills meet lower valleys. Zhuang culture is prominent, and sugarcane growing and refining have long followed the river corridor."
 PWC_CITY_PHOTO_350_TT: "§HWuzhou§!\nWuzhou stands where the Xun and Gui rivers meet to form the Xi River, making it an old inland port between Guangxi and Guangdong. Arcaded streets and Liubao tea recall its trading past."
 PWC_CITY_PHOTO_351_TT: "§HZhaoqing§!\nZhaoqing follows the Xi River at the western edge of the Pearl River Delta. The limestone peaks and lakes of Seven Star Crags and the forests of Mount Dinghu define its landscape."
 PWC_CITY_PHOTO_352_TT: "§HHualian§!\nHualien lies on Taiwan's east coast, with a narrow valley between the Central and Coastal mountain ranges. Taroko Gorge and the Pacific shore make its mountain-and-sea scenery especially dramatic."
 PWC_CITY_PHOTO_353_TT: "§HChaozhou§!\nChaozhou stands on the lower Han River and has long been a center of Chaoshan culture. Guangji Bridge, historic lanes, and gongfu tea express its craft and everyday traditions."
 PWC_CITY_PHOTO_354_TT: "§HNanning§!\nA green southern gateway linking China with Southeast Asia."
 PWC_CITY_PHOTO_355_TT: "§HHuizhou§!\nHuizhou spans the Dong River basin and the South China Sea coast, from Mount Luofu to Daya Bay. West Lake recalls its literary past, while coastal industry has shaped more recent growth."
 PWC_CITY_PHOTO_356_TT: "§HGuigang§!\nGuigang stands on the middle Yu River, an important inland shipping route in Guangxi. Lotus ponds gave it a local nickname, while plain farming and port logistics remain central to the area."
 PWC_CITY_PHOTO_357_TT: "§HGuangzhou§!\nA historic southern port and centre of Cantonese commerce and culture."
 PWC_CITY_PHOTO_358_TT: "§HTainan§!\nTainan lies on the Chianan Plain of southwestern Taiwan, with many historic sites in its old center. Anping Harbor, Chihkan Tower, and traditional temples record layers of maritime trade and colonial history."
 PWC_CITY_PHOTO_359_TT: "§HJieyang§!\nJieyang lies along the Rong River in eastern Guangdong, where waterways connect coastal plains and hills. Its old town, Chaoshan speech, and jade carving reflect trading and craft traditions."
 PWC_CITY_PHOTO_360_TT: "§HShantou§!\nShantou stands at the mouth of the Han River delta and is a major Chaoshan port. Arcaded streets from the treaty-port era and ties with emigrant communities recall maritime trade and migration."
 PWC_CITY_PHOTO_361_TT: "§HGaoxiong§!\nKaohsiung lies on Taiwan's southwest coast, where a natural harbor fostered shipping and industry. Shoushan, the Love River, and the port form its distinctive urban landscape."
 PWC_CITY_PHOTO_362_TT: "§HTaidong§!\nTaitung occupies a narrow strip between Taiwan's Central Mountain Range and the Pacific. Indigenous cultures, rice fields, and offshore islands lend the eastern region its distinctive character."
 PWC_CITY_PHOTO_363_TT: "§HFoshan§!\nFoshan lies amid the waterways of the Pearl River Delta, which supported ceramics, metalworking, and trade. Shiwan pottery and Lingnan martial arts keep deep local traditions visible in a manufacturing city."
 PWC_CITY_PHOTO_364_TT: "§HShanwei§!\nShanwei lies on Guangdong's southeastern coast, where the Hailufeng plain meets the Lianhua Mountains and South China Sea. Fishing ports, Red Bay, and local customs shape its coastal culture."
 PWC_CITY_PHOTO_366_TT: "§HChongzuo§!\nChongzuo lies on Guangxi's southwestern border, where the Zuo River crosses karst country toward Vietnam. The Huashan rock paintings recall ancient Luoyue culture, while border trade continues today."
 PWC_CITY_PHOTO_367_TT: "§HYunfu§!\nYunfu lies in the hills of western Guangdong, crossed by tributaries of the Xi River. Stone cutting and processing are local specialties, while Xinxing County is associated with the legacy of the Buddhist master Huineng."
 PWC_CITY_PHOTO_368_TT: "§HGuangxi Yulin§!\nYulin lies among hills and valleys of southeastern Guangxi, connected to western Guangdong. Rongxian's Zhenwu Pavilion and overseas Chinese ties reflect its long trading history."
 PWC_CITY_PHOTO_369_TT: "§HDongguan§!\nDongguan occupies the eastern Pearl River Delta, with dense waterways and towns. The destruction of opium at Humen is a landmark of modern history, while manufacturing has transformed the city."
 PWC_CITY_PHOTO_370_TT: "§HJiangmen§!\nJiangmen lies west of the Pearl River Delta, where waterways lead toward the sea. The Wuyi emigrant communities and Kaiping diaolou record overseas migration and architectural exchange."
 PWC_CITY_PHOTO_371_TT: "§HShenzhen§!\nA reform-era technology, logistics, and financial metropolis."
 PWC_CITY_PHOTO_372_TT: "§HZhongshan§!\nZhongshan sits on the west side of the Pearl River estuary, amid rivers and lowland towns. Formerly Xiangshan, it took its present name from Sun Yat-sen, and retains strong emigrant and manufacturing traditions."
 PWC_CITY_PHOTO_373_TT: "§HQinzhou§!\nQinzhou faces the Gulf of Tonkin, where the Qin River reaches sheltered coastal waters. Port trade follows older maritime routes, while Nixing pottery remains a local craft."
 PWC_CITY_PHOTO_374_TT: "§HMaoming§!\nMaoming lies on Guangdong's western coast, where hills descend toward the sea. Petrochemicals shaped its urban growth, while lychee orchards and coastal fishing show its varied economy."
 PWC_CITY_PHOTO_375_TT: "§HYangjiang§!\nYangjiang faces the South China Sea, with the Moyang River crossing its coastal plain. Hailing Island's beaches and fishing ports stand alongside a tradition of knife and scissor making."
 PWC_CITY_PHOTO_376_TT: "§HXishuangbanna§!\nXishuangbanna lies in southernmost Yunnan, where the Lancang River crosses tropical valleys. Dai temples, the Water-Splashing Festival, and rainforests give the border region its distinct character."
 PWC_CITY_PHOTO_377_TT: "§HHongkong§!\nA global free port, financial centre, and maritime gateway."
 PWC_CITY_PHOTO_379_TT: "§HZhuhai§!\nZhuhai lies on the west side of the Pearl River estuary, beside Macau and among numerous offshore islands. Its coastal layout and development as a special economic zone made it a gateway of the Greater Bay Area."
 PWC_CITY_PHOTO_380_TT: "§HFangchenggang§!\nFangchenggang occupies the Gulf of Tonkin coast near the Vietnam border. Port trade, coastal Jing communities, and the meeting of mountains and sea shape its border landscape."
 PWC_CITY_PHOTO_381_TT: "§HMacau§!\nA dense trading port shaped by centuries of Chinese-Portuguese exchange."
 PWC_CITY_PHOTO_383_TT: "§HBeihai§!\nBeihai faces the Gulf of Tonkin, and nearby Hepu was an important port on early maritime trade routes. Arcaded streets, Silver Beach, and pearl cultivation continue its coastal traditions."
 PWC_CITY_PHOTO_384_TT: "§HZhanjiang§!\nZhanjiang occupies the Leizhou Peninsula, with harbors linking it to South China Sea routes. Its former Guangzhouwan history, volcanic terrain, and fisheries shape this port city."
 PWC_CITY_PHOTO_385_TT: "§HDanzhou§!\nDanzhou lies on the northwestern side of Hainan Island, between coast and low hills. Dongpo Academy recalls Su Shi's exile on the island, while Yangpu Port supports modern shipping and industry."
 PWC_CITY_PHOTO_387_TT: "§HHainan§!\nHainan Island faces the Leizhou Peninsula across the Qiongzhou Strait, with central mountains sloping toward its coasts. Tropical rainforest, Li culture, and seaside settlements give the South China Sea island its character."
 PWC_CITY_PHOTO_388_TT: "§HHaikou§!\nHainan's tropical port, service centre, and coastal destination."
 PWC_CITY_PHOTO_391_TT: "§HSanya§!\nSanya lies at the southern end of Hainan Island, where mountains meet bays and beaches. Yazhou's historic sites and tropical coastal tourism reveal two sides of the city."
 PWC_CITY_PHOTO_434_TT: "§HMerag-Sagteng§!\nMerag-Sagteng lies in the mountains of eastern Bhutan and comprises the Merag and Sakten areas. High valleys and scattered villages shape life in this remote region."
 PWC_CITY_PHOTO_435_TT: "§HSouthern Tibet§!\nSouthern Tibet is the Chinese name for a disputed area south of the McMahon Line on the Himalayan foothills. India administers most of it as part of Arunachal Pradesh, while China also claims the territory."
 PWC_CITY_PHOTO_505_TT: "§HYilan§!\nYilan lies in northeastern Taiwan, where mountains enclose the Lanyang Plain and rivers run toward the Pacific. Hot springs, rice fields, and fishing ports shape its mountain-and-sea setting."
 PWC_CITY_PHOTO_506_TT: "§HXinbei§!\nNew Taipei surrounds Taipei and extends from the Tamsui River mouth to the northeast coast. Jiufen's hillside streets, Tamsui's port history, and dense urban districts show its varied terrain and settlement."
 PWC_CITY_PHOTO_507_TT: "§HTaoyuan§!\nTaoyuan lies on northwestern Taiwan's terraces, where ponds once formed a distinctive irrigation landscape. Its international airport and surrounding industrial areas make it a major gateway."
 PWC_CITY_PHOTO_508_TT: "§HMiaoli§!\nMiaoli runs from the Taiwan Strait to the Snow Mountains, with river valleys crossing the hills. Hakka culture, Sanyi wood carving, and the mountain railway preserve craft and travel traditions."
 PWC_CITY_PHOTO_509_TT: "§HNantou§!\nNantou is Taiwan Island's only landlocked county, with mountains and hills enclosing varied basins. Sun Moon Lake, tea-growing districts, and Indigenous communities reveal its interior landscape."
 PWC_CITY_PHOTO_510_TT: "§HZhanghua§!\nChanghua lies on Taiwan's central west coast, between the Bagua Hills and the coastal plain. Lukang's old streets and temples recall maritime trade, while farming remains part of the plain's economy."
 PWC_CITY_PHOTO_511_TT: "§HJiayi§!\nChiayi sits on the Chianan Plain, with hills rising toward Alishan to the east. The forest railway began here, and old city streets preserve traces of the timber trade."
 PWC_CITY_PHOTO_512_TT: "§HYunlin§!\nYunlin lies south of the Zhuoshui River on Taiwan's central-western plain. Farming, fishing, and Mazu worship centered on Beigang Chaotian Temple shape local life."
 PWC_CITY_PHOTO_513_TT: "§HPingdong§!\nPingtung occupies Taiwan's southern end, where plains meet the Central Mountains and tropical shores. Hengchun's coral coast and Indigenous communities add to its varied landscape and culture."
 PWC_CITY_PHOTO_524_TT: "§HPenghu§!\nPenghu is an archipelago in the Taiwan Strait, shaped by basalt shores and seasonal winds. Magong's old streets, stone tidal fish weirs, and sea routes preserve a long island tradition."
 PWC_CITY_PHOTO_525_TT: "§HJinmen§!\nThe Kinmen islands lie at the mouth of Xiamen Bay, just across the water from Xiamen. Minnan villages, Western-style houses, and Cold War military sites record both exchange and confrontation across the strait."
 PWC_CITY_PHOTO_526_TT: "§HLianjiang§!\nHere Lienchiang refers to the Matsu Islands off the Fujian coast, administered by Taiwan. Granite islands, eastern Fujian stone houses, and former military sites give the archipelago its character."

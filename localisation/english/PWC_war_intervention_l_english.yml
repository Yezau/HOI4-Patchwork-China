 pwc_dec_select_support_war:0 "Select support war: [FROM.GetName]"
 pwc_dec_select_support_war_desc:0 "Select the enemy first, then invite one peaceful city that borders it. Both sides may invite. One accepted supporter per continuous war; supporters cannot invite others."
 pwc_dec_invite_support:0 "Invite support: [FROM.GetName]"
 pwc_dec_invite_support_desc:0 "Invite [FROM.GetName] against [?pwc_support_enemy.GetName] for 25 political power. Only cities bordering that enemy can be invited. They have 7 days to reply. Rejection does not consume the slot or refund the cost. After declining, they receive no support invitations from any country for 180 days. A city at war or bound by a pact with the enemy cannot join."
 pwc_support_title:0 "Invitation to war"
 pwc_support_desc:0 "[event_target:pwc_support_host.GetName] asks us to fight our neighbour [event_target:pwc_support_opponent.GetName]. Accepting joins the war without creating a faction. We cannot invite additional supporters. Remaining neutral stops support invitations from all countries for 180 days."
 pwc_support_decline:0 "Remain neutral"
 pwc_support_accept:0 "Accept and join the war"
 pwc_support_unavailable:0 "Cannot join; close invitation"
 pwc_support_unavailable_desc:0 "We cannot accept this invitation.\n\n§YReason:§! [GetPwcSupportUnavailableReason]\n\nClosing it does not start the 180-day refusal period."
 pwc_support_unavailable_tt:0 "[GetPwcSupportUnavailableReason]\nClose without joining the war or starting the 180-day refusal period."
 pwc_support_unavailable_war:0 "We are already at war. Only a peaceful city can accept a support invitation."
 pwc_support_unavailable_invitation:0 "The invitation expired or was withdrawn, or its sender no longer has an ongoing war and an available support slot."

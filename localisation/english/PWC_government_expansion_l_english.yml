 pwc_cabinet_agendas: "Cabinet Programmes"
 pwc_cabinet_agendas_desc: "Complete the Cabinet Charter and fill at least three original functional seats. Only one programme runs at a time for 90 days. A matching executive reduces its cost; a matching inspector removes its penalty. Later appointments do not alter the adopted plan."
 pwc_cand_executive_coordination_civic: "Civic Reformer"
 pwc_cand_executive_coordination_civic_desc: "She uses residents requests to identify administrative gaps and improve public services.\n\nExecutive Coordinator. Reduces the programme cost by 10 political power: Civic Relief Programme, Administrative Integration Programme. Appointment costs 100 political power."
 pwc_cand_executive_coordination_coordinator: "General Coordinator"
 pwc_cand_executive_coordination_coordinator_desc: "She turns stalled interdepartmental matters into practical welfare and transport schedules.\n\nExecutive Coordinator. Reduces the programme cost by 10 political power: Civic Relief Programme, Transport Preparation Programme. Appointment costs 100 political power."
 pwc_cand_executive_coordination_defense: "Defence Coordinator"
 pwc_cand_executive_coordination_defense_desc: "She coordinates peacetime training and transport preparation on a shared timetable.\n\nExecutive Coordinator. Reduces the programme cost by 10 political power: Defence Training Programme, Transport Preparation Programme. Appointment costs 100 political power."
 pwc_cand_executive_coordination_industrial: "Industrial Advocate"
 pwc_cand_executive_coordination_industrial_desc: "She traces bottlenecks on factory floors before recommending new investment.\n\nExecutive Coordinator. Reduces the programme cost by 10 political power: Industrial Improvement Programme, Production Retooling Programme. Appointment costs 100 political power."
 pwc_cand_executive_coordination_integration: "Regional Coordinator"
 pwc_cand_executive_coordination_integration_desc: "She standardises procedures across regions to reduce friction between old and new organisations.\n\nExecutive Coordinator. Reduces the programme cost by 10 political power: Administrative Integration Programme, Production Retooling Programme. Appointment costs 100 political power."
 pwc_cand_general_staff_defense: "Defence Coordinator"
 pwc_cand_general_staff_defense_desc: "She prioritises defensive preparation and orderly rotation before committing forces.\n\nResponsible for Chief of General Staff, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_cand_general_staff_joint: "Joint Operations Coordinator"
 pwc_cand_general_staff_joint_desc: "She uses shared liaison procedures to reduce delays between service branches.\n\nResponsible for Chief of General Staff, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_cand_general_staff_mobility: "Mobile Operations Staff Officer"
 pwc_cand_general_staff_mobility_desc: "She coordinates troop movements and supply schedules to keep mobile operations moving.\n\nResponsible for Chief of General Staff, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_cand_general_staff_planning: "Campaign Planner"
 pwc_cand_general_staff_planning_desc: "She breaks campaign preparation into stages to improve execution.\n\nResponsible for Chief of General Staff, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_cand_general_staff_refit: "Refit Coordinator"
 pwc_cand_general_staff_refit_desc: "She coordinates the handover from old equipment to new equipment.\n\nResponsible for Chief of General Staff, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_cand_government_oversight_administration: "Administrative Inspector"
 pwc_cand_government_oversight_administration_desc: "She clarifies approval responsibilities in administrative integration and industrial reform.\n\nInspector General. Removes the penalty when the programme is adopted: Administrative Integration Programme, Industrial Improvement Programme. Appointment costs 100 political power."
 pwc_cand_government_oversight_civic: "Civic Inspector"
 pwc_cand_government_oversight_civic_desc: "She checks departmental reports against the daily lives of the people they serve.\n\nInspector General. Removes the penalty when the programme is adopted: Civic Relief Programme, Administrative Integration Programme. Appointment costs 100 political power."
 pwc_cand_government_oversight_industry: "Industrial Auditor"
 pwc_cand_government_oversight_industry_desc: "She follows production accounts and demands traceable evidence for each improvement.\n\nInspector General. Removes the penalty when the programme is adopted: Industrial Improvement Programme, Production Retooling Programme. Appointment costs 100 political power."
 pwc_cand_government_oversight_logistics: "Transport Inspector"
 pwc_cand_government_oversight_logistics_desc: "She compares warehouse and station records to find gaps in transport chains.\n\nInspector General. Removes the penalty when the programme is adopted: Transport Preparation Programme, Production Retooling Programme. Appointment costs 100 political power."
 pwc_cand_government_oversight_military: "Military Inspector"
 pwc_cand_government_oversight_military_desc: "She takes supply audits to training grounds and checks costs passed to frontline units.\n\nInspector General. Removes the penalty when the programme is adopted: Defence Training Programme, Transport Preparation Programme. Appointment costs 100 political power."

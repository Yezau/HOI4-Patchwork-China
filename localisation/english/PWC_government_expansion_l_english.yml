 pwc_advisor_armor_assault: "Armoured Assault Expert"
 pwc_advisor_armor_assault_desc: "She concentrates armour and coordinates assaults to create breakthrough opportunities.\n\nResponsible for Armoured Coordination, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_armor_defense: "Armoured Defence Expert"
 pwc_advisor_armor_defense_desc: "She preserves armoured strength through defensive coordination.\n\nResponsible for Armoured Coordination, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_armor_mobile: "Armoured Manoeuvre Expert"

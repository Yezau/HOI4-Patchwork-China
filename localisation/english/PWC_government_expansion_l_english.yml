 pwc_advisor_infantry_recruit: "Recruit Training Officer"
 pwc_advisor_infantry_recruit_desc: "She builds recruits confidence through consistent basic drills.\n\nResponsible for Infantry Training, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_infantry_special: "Special Forces Instructor"
 pwc_advisor_infantry_special_desc: "She develops special forces cadres through demanding small-team preparation.\n\nResponsible for Infantry Training, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_submarine_ambush: "Submarine Ambush Expert"
 pwc_advisor_submarine_ambush_desc: "She organises submarine attacks around carefully chosen ambush opportunities.\n\nResponsible for Submarine Warfare, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_submarine_raiding: "Commerce Raiding Organiser"
 pwc_advisor_submarine_raiding_desc: "She organises sustained commerce-raiding operations against shipping routes.\n\nResponsible for Submarine Warfare, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_submarine_survival: "Submarine Survival Expert"
 pwc_advisor_submarine_survival_desc: "She emphasises submarine survival training and sustained operational availability.\n\nResponsible for Submarine Warfare, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_superiority_interception: "Interception Controller"
 pwc_advisor_superiority_interception_desc: "She directs interceptors toward the airspace where they are most needed.\n\nResponsible for Air Superiority, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_superiority_patrol: "Air Patrol Controller"
 pwc_advisor_superiority_patrol_desc: "She coordinates patrol coverage to reduce gaps in air-superiority missions.\n\nResponsible for Air Superiority, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_superiority_training: "Air Training Officer"
 pwc_advisor_superiority_training_desc: "She builds reusable flying experience through progressive training.\n\nResponsible for Air Superiority, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_support_coordination: "Air Ground Coordinator"
 pwc_advisor_support_coordination_desc: "She translates ground-force requests into air-support coordination.\n\nResponsible for Ground Support, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_support_mission: "Support Mission Instructor"
 pwc_advisor_support_mission_desc: "She reviews support missions to improve reliable execution of recurring tasks.\n\nResponsible for Ground Support, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_support_strike: "Close Support Strike Expert"
 pwc_advisor_support_strike_desc: "She focuses close-support training on ground-attack timing and coordination.\n\nResponsible for Ground Support, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_surface_escort: "Convoy Escort Organiser"
 pwc_advisor_surface_escort_desc: "She prioritises merchant safety through organised escort routes and ship cooperation.\n\nResponsible for Surface Warfare, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_surface_gunnery: "Capital Ship Gunnery Expert"
 pwc_advisor_surface_gunnery_desc: "She focuses capital-ship gunnery training on the rhythm of fleet engagements.\n\nResponsible for Surface Warfare, trading one capability for another. Grants 0.12 daily service experience; other bonuses apply to listed units or missions. Appointment costs 100 political power."
 pwc_advisor_surface_screen: "Screen Coordination Expert"

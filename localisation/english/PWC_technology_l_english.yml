 PWC_TECH_ELECTRONICS_COMPUTING_T3_DESC: "Applies edge computing and data fusion to research and command, accelerating model validation and improving the response of divisional and headquarters signals."
 PWC_TECH_ELECTRONICS_RADAR_T1: "Digital Detection"
 PWC_TECH_ELECTRONICS_RADAR_T1_DESC: "Deploys basic digital radar and contemporary detection equipment while improving reconnaissance."
 PWC_TECH_ELECTRONICS_RADAR_T2: "Electronic Early Warning"
 PWC_TECH_ELECTRONICS_RADAR_T2_DESC: "Expands electronic early warning and detection coverage for air defense and situational awareness."
 PWC_TECH_ELECTRONICS_RADAR_T4: "Advanced Detection and EW"
 PWC_TECH_ELECTRONICS_RADAR_T4_DESC: "Develops advanced detection networks and electronic warfare for wider coverage and cooperation."
 PWC_TECH_ELECTRONICS_T1: "Scientific Computing"
 PWC_TECH_ELECTRONICS_T1_DESC: "Establishes modern computing tools for research and reliable data processing for divisional and headquarters signals."
 PWC_TECH_ELECTRONICS_T2: "Digital Communications and Computing"
 PWC_TECH_ELECTRONICS_T2_DESC: "Improves research networks and digital communications so engineering teams share results reliably and signals process orders faster."
 PWC_TECH_ELECTRONICS_T3: "Integrated Sensors and Fire Control"
 PWC_TECH_ELECTRONICS_T3_DESC: "Fuses sensors and fire control to improve reconnaissance companies, radar coverage, and platform electronics."
 PWC_TECH_ELECTRONICS_T4: "Networked Computing"
 PWC_TECH_ELECTRONICS_T4_DESC: "Coordinates distributed computing for advanced research and model validation while improving cooperation through divisional and headquarters signals."
 PWC_TECH_FOLDER: "Technology"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T2: "Prefabricated Field Engineering"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T2_DESC: "Uses prefabricated components and standardized field workflows to improve construction and repairs."
 PWC_TECH_INDUSTRY_CONSTRUCTION_T3: "Rapid Construction and Repair"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T3_DESC: "Connects prefabrication, construction planning, and repair procedures so new and damaged facilities enter service sooner."
 PWC_TECH_INDUSTRY_CONSTRUCTION_T4: "Integrated Engineering"
 PWC_TECH_INDUSTRY_CONSTRUCTION_T4_DESC: "Coordinates design, construction schedules, and repair resources to complete new facilities and restore damaged buildings sooner."
 PWC_TECH_INDUSTRY_MANUFACTURING_T1: "Modern CNC Manufacturing"
 PWC_TECH_INDUSTRY_MANUFACTURING_T1_DESC: "Uses modern CNC machinery and quality control to raise factory and dockyard output, with stronger initial production and a higher efficiency ceiling."
 PWC_TECH_INDUSTRY_T1: "Engineering Standards"
 PWC_TECH_INDUSTRY_T1_DESC: "Standardizes plans, construction methods, and inspections so crews build efficiently and organize repairs to damaged facilities."
 PWC_TECH_INDUSTRY_T2: "Lean Manufacturing"
 PWC_TECH_INDUSTRY_T2_DESC: "Lean production examines waiting, handling, and rework. Clearer connections between processes let the factory operate around a stable and understood workflow."
 PWC_TECH_INDUSTRY_T3: "Precision Manufacturing and Composites"
 PWC_TECH_INDUSTRY_T3_DESC: "Precision tooling, composites, and inspection raise factory and dockyard output, while standardized tooling preserves more production efficiency during model changes."
 PWC_TECH_INDUSTRY_T4: "Advanced Production"
 PWC_TECH_INDUSTRY_T4_DESC: "Connects research, manufacturing, and production management to raise factory and dockyard output, start new lines efficiently, and build production efficiency faster."

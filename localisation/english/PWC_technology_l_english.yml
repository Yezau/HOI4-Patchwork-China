 PWC_UNIT_MOUNTAIN: "Mountain Battalion"
 PWC_UNIT_MOUNTAIN_DESC: "Specialist mountain troops combine climbing, cold-weather survival and light teams to fight across steep slopes and passes. They count toward the special-forces limit."

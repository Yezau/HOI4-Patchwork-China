 PWC_TECH_LOGISTICS_SUPPORT_T1: "Maintenance and Field Medicine"
 PWC_TECH_LOGISTICS_SUPPORT_T1_DESC: "Organizes maintenance and field medicine so contemporary support equipment can sustain formations."
 PWC_TECH_LOGISTICS_SUPPORT_T2: "Modular Field Support"
 PWC_TECH_LOGISTICS_SUPPORT_T2_DESC: "Modular spares, engineering equipment, and medical procedures improve fortification, reliability, and casualty recovery."
 PWC_TECH_LOGISTICS_SUPPORT_T3: "Integrated Support Equipment"
 PWC_TECH_LOGISTICS_SUPPORT_T3_DESC: "Upgrades field-support equipment and repair diagnostics to improve maintenance-company reliability."
 PWC_TECH_LOGISTICS_SUPPORT_T4: "Robotic Repair and Smart Medicine"
 PWC_TECH_LOGISTICS_SUPPORT_T4_DESC: "Coordinates robotic repair, smart medical support, and field engineering to recover equipment and personnel more effectively."
 PWC_TECH_LOGISTICS_T1: "Modern Warehousing and Distribution"
 PWC_TECH_LOGISTICS_T1_DESC: "Modern storage and distribution gives supplies clear identities, locations, and movement records, turning improvised handling into planned and traceable work."
 PWC_TECH_LOGISTICS_T2: "Transportation and Deployment System"
 PWC_TECH_LOGISTICS_T2_DESC: "A transport system connects depots, routes, and vehicle dispatch, ensuring that produced supplies can reach the places where missions require them."
 PWC_TECH_LOGISTICS_T3: "Theater Logistics Network"
 PWC_TECH_LOGISTICS_T3_DESC: "A theater logistics network supports formations through connected hubs and routes, coordinating frontline demand, rear reserves, repairs, and transport."
 PWC_TECH_LOGISTICS_T4: "Cross-Region Deployment and Sustainment"
 PWC_TECH_LOGISTICS_T4_DESC: "Cross-regional support requires transport and supply organizations to follow shared procedures, treating movement as a continuous process across administrative boundaries."
 PWC_TECH_MISSILE_DEFENSE_T1: "Modern Air Defense and Anti-Tank Missiles"
 PWC_TECH_MISSILE_DEFENSE_T1_DESC: "Establishes modern defensive firepower with mobile air-defense missiles and portable ATGMs."
 PWC_TECH_MISSILE_DEFENSE_T2: "Coordinated Interception"
 PWC_TECH_MISSILE_DEFENSE_T2_DESC: "Improves target identification and coordinated engagement for existing air-defense and AT teams."
 PWC_TECH_MISSILE_STRIKE_T3: "Distributed Target Designation"
 PWC_TECH_MISSILE_STRIKE_T3_DESC: "Introduces third-generation unmanned launchers and shared targeting, while improving rocket salvos and anti-armor fire."
 PWC_TECH_MISSILE_STRIKE_T4: "Long-Range Precision Strike"
 PWC_TECH_MISSILE_STRIKE_T4_DESC: "Introduces fourth-generation smart rocket launchers with shared targeting for precise ground fire."
 PWC_TECH_MISSILE_T1: "Truck-Mounted Rocket Artillery"
 PWC_TECH_MISSILE_T1_DESC: "Fields contemporary truck-mounted rocket launchers and formations that consume their own dedicated rocket-artillery equipment."
 PWC_TECH_MISSILE_T2: "Precision Rocket Ammunition"
 PWC_TECH_MISSILE_T2_DESC: "Improves rocket precision through guided ammunition and modular launch systems."
 PWC_TECH_MISSILE_T3: "Guided Defensive Weapons"
 PWC_TECH_MISSILE_T3_DESC: "Advances guidance, sensors, and launch equipment for second-generation defensive weapons."
 PWC_TECH_MISSILE_T4: "Integrated Guided Weapons"
 PWC_TECH_MISSILE_T4_DESC: "Integrates distributed detection, multimode guidance, and counter-drone methods into advanced defense."
 PWC_TECH_NAVY_CARRIER_T1: "Carrier and Naval Aircraft Production"
 PWC_TECH_NAVY_CARRIER_T1_DESC: "Establishes carrier, carrier fighter, and carrier attack aircraft production with matching propulsion, weapons, and mission payloads."
 PWC_TECH_NAVY_CARRIER_T2: "Improved Carriers and Naval Aircraft"
 PWC_TECH_NAVY_CARRIER_T2_DESC: "Upgrades carriers and both carrier aircraft types together with improved engines and payloads."
 PWC_TECH_NAVY_CARRIER_T3: "Ocean-Going Carriers and Naval Aviation"
 PWC_TECH_NAVY_CARRIER_T3_DESC: "Adds STOBAR flight decks and third-generation carrier aircraft with beyond-visual-range air-to-air weapons and flexible mission payloads."
 PWC_TECH_NAVY_CARRIER_T4: "Advanced Carriers and Naval Aviation"
 PWC_TECH_NAVY_CARRIER_T4_DESC: "Integrates advanced detection, catapult flight decks, and fourth-generation carrier aircraft with their aviation weapons."
 PWC_TECH_NAVY_FLEET_T1: "Cruiser Production"
 PWC_TECH_NAVY_FLEET_T1_DESC: "Establishes cruiser construction, propulsion, and guns for a dedicated surface combatant line."
 PWC_TECH_NAVY_FLEET_T2: "Improved Cruisers"
 PWC_TECH_NAVY_FLEET_T2_DESC: "Improves cruiser hulls, combined gas turbines, naval guns, and basic sonar support."
 PWC_TECH_NAVY_FLEET_T3: "Ocean-Going Missile Cruisers"
 PWC_TECH_NAVY_FLEET_T3_DESC: "Equips ocean-going cruisers with integrated electric propulsion, vertical launch systems, anti-ship missiles, and naval air defense."
 PWC_TECH_NAVY_FLEET_T4: "Advanced Multirole Cruisers"
 PWC_TECH_NAVY_FLEET_T4_DESC: "Integrates advanced sensing with the final cruiser hulls, guns, vertical launch systems, and sonar for surface combat."
 PWC_TECH_NAVY_SUBMARINE_T1: "Submarine Production"
 PWC_TECH_NAVY_SUBMARINE_T1_DESC: "Establishes submarine construction, propulsion support, and crew organization for undersea operations."
 PWC_TECH_NAVY_SUBMARINE_T2: "Improved Undersea Platforms"
 PWC_TECH_NAVY_SUBMARINE_T2_DESC: "Improves submarine platforms and introduces basic sonar support for continued fleet modernization."
 PWC_TECH_NAVY_SUBMARINE_T3: "Ocean-Going Submarines"
 PWC_TECH_NAVY_SUBMARINE_T3_DESC: "Develops ocean-going submarines, towed sonar, and anti-ship missiles for undersea detection and surface-strike configurations."
 PWC_TECH_NAVY_SUBMARINE_T4: "Advanced Undersea Systems"
 PWC_TECH_NAVY_SUBMARINE_T4_DESC: "Pairs advanced sonar with the final submarine hulls to complete the undersea capability line."
 PWC_TECH_NAVY_T1: "Coastal Defense Fleet"
 PWC_TECH_NAVY_T1_DESC: "A coastal fleet organizes its missions around ports, nearby routes, and local waters, matching vessel design and shore support to sustainable maritime operations."
 PWC_TECH_NAVY_T2: "Regional Combat Fleet"
 PWC_TECH_NAVY_T2_DESC: "A regional fleet brings different vessels together across a wider sea area, coordinating propulsion, detection, and armament for sustained voyages and joint action."
 PWC_TECH_NAVY_T3: "Blue-Water Combat Fleet"

 PWC_UNIT_AMPHIBIOUS_TANK: "Amphibious Tank Battalion"
 PWC_UNIT_AMPHIBIOUS_TANK_DESC: "Dedicated amphibious tanks provide direct fire during landings and river crossings, with lighter protection than land armor."
 PWC_UNIT_AMPHIBIOUS_TANK_EFFECTS: "Equipment needed: $PWC_PLATFORM_AMPHIBIOUS_TANK$ x50."
 PWC_UNIT_ANTI_AIR: "Field Anti-Air Battalion"
 PWC_UNIT_ANTI_AIR_DESC: "A field anti-aircraft battalion organizes warning and air-defense weapons for ground forces, linking observation, operation, and movement support."

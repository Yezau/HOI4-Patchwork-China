 PWC_EQUIPMENT_AMPHIBIOUS_MECHANIZED: "Amphibious Infantry Fighting Vehicles"
 PWC_EQUIPMENT_AMPHIBIOUS_MECHANIZED_DESC: "Amphibious infantry fighting vehicles combine protected troop transport with water mobility and autocannon support."
 PWC_EQUIPMENT_AMPHIBIOUS_MECHANIZED_EFFECTS: "Equipment family archetype with 4 generations. Stage 1 unlocks with $PWC_TECH_ARMY_MOBILITY_T1$; later generations unlock through techs or special projects."
 PWC_EQUIPMENT_AMPHIBIOUS_MECHANIZED_GEN1: "Modern Amphibious Infantry Fighting Vehicle"
 PWC_EQUIPMENT_AMPHIBIOUS_MECHANIZED_GEN1_DESC: "Modern Amphibious Infantry Fighting Vehicle with a buoyant hull, wave deflector and waterjet propulsion."
 PWC_EQUIPMENT_AMPHIBIOUS_MECHANIZED_GEN1_EFFECTS: "Equipment stats: soft attack 5, hard attack 3, piercing 15, armor 11.25, defense 30, breakthrough 8, hardness 55, speed 9, fuel consumption 1.65. Build cost 9.6 IC. Unlocked by $PWC_TECH_ARMY_MOBILITY_T1$."

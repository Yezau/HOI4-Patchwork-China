 PWC_EQUIPMENT_ANTI_AIR: "Mobile Air Defense Systems"
 PWC_EQUIPMENT_ANTI_AIR_DESC: "Mobile missiles, detection, and fire control provide formation air defense, progressing toward multiple-target engagement and smart counter-drone capabilities."
 PWC_EQUIPMENT_ANTI_AIR_EFFECTS: "Equipment family archetype with 4 generations. Stage 0 unlocks with $PWC_TECH0_BASIC_INFANTRY$; later generations unlock through techs or special projects."
 PWC_EQUIPMENT_ANTI_AIR_GEN0: "Reserve Mobile SAM System"
 PWC_EQUIPMENT_ANTI_AIR_GEN0_DESC: "An early mobile SAM system uses basic guidance and warning equipment for short-range protection."
 PWC_EQUIPMENT_ANTI_AIR_GEN0_EFFECTS: "Equipment stats: soft attack 1.4, hard attack 2.1, piercing 7, air attack 21, defense 3.5, breakthrough 1.4, speed 8, fuel consumption 0.7, armor 3.5, hardness 15, reliability 72. Build cost 4.2 IC. Unlocked by $PWC_TECH0_BASIC_INFANTRY$."
 PWC_EQUIPMENT_ANTI_AIR_GEN1: "Gen 1 · Mobile Short-Range Air Defense"
 PWC_EQUIPMENT_ANTI_AIR_GEN1_DESC: "$PWC_EQUIPMENT_ANTI_AIR_DESC$ This generation establishes common design and support practices using proven engineering."
 PWC_EQUIPMENT_ANTI_AIR_GEN1_EFFECTS: "Equipment stats: soft attack 2, hard attack 3, piercing 10, air attack 32, defense 5, breakthrough 2, speed 10, fuel consumption 1, armor 5, hardness 15, reliability 82. Build cost 6 IC. Unlocked by $PWC_TECH_MISSILE_DEFENSE_T1$."
 PWC_EQUIPMENT_ANTI_AIR_GEN2: "Gen 2 · Mobile Multiple-Target Air Defense"
 PWC_EQUIPMENT_ANTI_AIR_GEN2_DESC: "$PWC_EQUIPMENT_ANTI_AIR_DESC$ This generation incorporates service experience to refine component integration and operating routines."
 PWC_EQUIPMENT_ANTI_AIR_GEN2_EFFECTS: "Equipment stats: soft attack 3, hard attack 4, piercing 12, air attack 42, defense 6, breakthrough 3, speed 11, fuel consumption 1.2, armor 8, hardness 20, reliability 85. Build cost 8 IC. Unlocked by $PWC_TECH_MISSILE_T3$."
 PWC_EQUIPMENT_ANTI_AIR_GEN3: "Gen 3 · Distributed Smart Air Defense"
 PWC_EQUIPMENT_ANTI_AIR_GEN3_DESC: "$PWC_EQUIPMENT_ANTI_AIR_DESC$ This generation emphasizes equipment integration and common interfaces for more demanding tasks."
 PWC_EQUIPMENT_ANTI_AIR_GEN3_EFFECTS: "Equipment stats: soft attack 4, hard attack 5, piercing 15, air attack 55, defense 7, breakthrough 4, speed 12, fuel consumption 1.5, armor 10, hardness 25, reliability 88. Build cost 10 IC. Unlocked by $PWC_TECH_MISSILE_T4$."
 PWC_EQUIPMENT_ANTI_TANK: "Portable Anti-Tank Systems"
 PWC_EQUIPMENT_ANTI_TANK_DESC: "Portable guided weapons counter armor through progressively better sensors, guidance, and coordinated engagement."
 PWC_EQUIPMENT_ANTI_TANK_EFFECTS: "Equipment family archetype with 4 generations. Stage 0 unlocks with $PWC_TECH0_BASIC_INFANTRY$; later generations unlock through techs or special projects."

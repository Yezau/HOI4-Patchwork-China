 PWC_TEMPLATE_ARMORED_18W: "Compact Armored Division"
 PWC_TEMPLATE_ARMORED_18W_DESC: "Three modern tank battalions and six mechanized infantry battalions form an affordable eighteen-width armored division, combining assault firepower with infantry endurance."
 PWC_TEMPLATE_ARMORED_18W_EFFECTS: "Width-18 division template: $PWC_UNIT_TANK$ x3, $PWC_UNIT_MECHANIZED$ x6, $PWC_UNIT_ENGINEER$ x1, $PWC_UNIT_RECON$ x1, $PWC_UNIT_SIGNAL$ x1, $PWC_UNIT_REGIMENTAL_TANK_DESTROYER$ x1, $PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2. None are deployed at game start; build them yourself. Requires $PWC_TECH0_BASIC_INDUSTRY$, $PWC_TECH0_COMMUNICATIONS$, $PWC_TECH0_ENGINEERS$, $PWC_TECH0_TRANSPORT$, $PWC_TECH_ARMY_MOBILITY_T1$, $PWC_TECH_ARMY_T1$."
 PWC_TEMPLATE_ARMORED_36W: "Armored Division"
 PWC_TEMPLATE_ARMORED_36W_DESC: "This armored formation brings tanks and supporting units into a common force, relying on infantry cooperation and sustainment rather than isolated vehicle performance."
 PWC_TEMPLATE_ARMORED_36W_EFFECTS: "Width-36 division template: $PWC_UNIT_TANK$ x8, $PWC_UNIT_HEAVY_TANK$ x2, $PWC_UNIT_TANK_DESTROYER$ x2, $PWC_UNIT_MECHANIZED$ x6, $PWC_UNIT_ENGINEER$ x1, $PWC_UNIT_SIGNAL$ x1, $PWC_UNIT_LOGISTICS$ x1, $PWC_UNIT_MAINTENANCE$ x1, $PWC_UNIT_REGIMENTAL_TANK_DESTROYER$ x1, $PWC_UNIT_REGIMENTAL_ARMORED_ANTI_AIR$ x1, $PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2. None are deployed at game start; build them yourself. Requires $PWC_TECH0_BASIC_INDUSTRY$, $PWC_TECH0_BASIC_INFANTRY$, $PWC_TECH0_COMMUNICATIONS$, $PWC_TECH0_ENGINEERS$, $PWC_TECH0_TRANSPORT$, $PWC_TECH_ARMY_MOBILITY_T2$, $PWC_TECH_ARMY_T1$, $PWC_TECH_ARMY_T2$, $PWC_TECH_LOGISTICS_SUPPORT_T1$, $PWC_TECH_LOGISTICS_T1$."
 PWC_TEMPLATE_CITY_GARRISON_12W: "City Garrison Division"
 PWC_TEMPLATE_CITY_GARRISON_12W_DESC: "Infantry and military police provide occupation garrisons. Assign this template to occupied territories to use the military police suppression bonus."
 PWC_TEMPLATE_CITY_GARRISON_12W_EFFECTS: "Width-12 division template: $PWC_UNIT_INFANTRY$ x6, $PWC_UNIT_MILITARY_POLICE$ x1. None are deployed at game start; build them yourself. Requires $PWC_TECH0_BASIC_INFANTRY$, $PWC_TECH_ARMY_INFANTRY_T1$."
 PWC_TEMPLATE_INFANTRY_12W: "Infantry Division"
 PWC_TEMPLATE_INFANTRY_12W_DESC: "This infantry division centers on ordinary infantry and basic support, providing a straightforward ground formation with common training and sustainment needs."
 PWC_TEMPLATE_INFANTRY_12W_EFFECTS: "Width-12 division template: $PWC_UNIT_INFANTRY$ x6, $PWC_UNIT_ENGINEER$ x1, $PWC_UNIT_REGIMENTAL_FIRE_SUPPORT$ x2. Every city starts with 5 of them. Requires $PWC_TECH0_BASIC_INFANTRY$, $PWC_TECH0_ENGINEERS$."
 PWC_TEMPLATE_MOBILE_18W: "Mobile Division"
 PWC_TEMPLATE_MOBILE_18W_DESC: "This mobile formation connects transport, infantry action, and support, keeping units coordinated during movement and deployment rather than merely supplying vehicles."
 PWC_TEMPLATE_MOBILE_18W_EFFECTS: "Width-18 division template: $PWC_UNIT_MOTORIZED$ x6, $PWC_UNIT_ARTILLERY$ x2, $PWC_UNIT_ENGINEER$ x1, $PWC_UNIT_RECON$ x1, $PWC_UNIT_REGIMENTAL_MOTORIZED_FIRE$ x2. None are deployed at game start; build them yourself. Requires $PWC_TECH0_BASIC_INFANTRY$, $PWC_TECH0_COMMUNICATIONS$, $PWC_TECH0_ENGINEERS$, $PWC_TECH0_TRANSPORT$, $PWC_TECH_ARMY_FIREPOWER_T1$."
 PWC_TEMPLATE_MOUNTAIN_18W: "Mountain Division"
 PWC_TEMPLATE_MOUNTAIN_18W_DESC: "This mountain formation is built around troops trained for difficult terrain, adapting routes, support, and cooperation to the limits imposed by the landscape."
 PWC_TEMPLATE_MOUNTAIN_18W_EFFECTS: "Width-18 division template: $PWC_UNIT_MOUNTAIN$ x9, $PWC_UNIT_ENGINEER$ x1, $PWC_UNIT_RECON$ x1, $PWC_UNIT_REGIMENTAL_FIRE_SUPPORT$ x2, $PWC_UNIT_REGIMENTAL_ANTI_TANK$ x1. None are deployed at game start; build them yourself. Requires $PWC_TECH0_BASIC_INDUSTRY$, $PWC_TECH0_BASIC_INFANTRY$, $PWC_TECH0_COMMUNICATIONS$, $PWC_TECH0_ENGINEERS$, $PWC_TECH_SF_MOUNTAIN_T1$."
 PWC_UNIT_AMPHIBIOUS_MECHANIZED: "Amphibious Mechanized"
 PWC_UNIT_AMPHIBIOUS_MECHANIZED_DESC: "Marines in amphibious infantry fighting vehicles retain protection and mobility during crossings and require dedicated vehicles."

 PWC_PROJECT_FLEET_DAMAGE_CONTROL_EFFECTS: "Unlocks $PWC_MODULE_NAVY_AUX_AUTOMATED_DAMAGE_CONTROL$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_FLEXIBLE_MANUFACTURING: "Armored Assault Engineering"
 PWC_PROJECT_FLEXIBLE_MANUFACTURING_DESC: "Develop protected breaching and bridging vehicles for dedicated assault engineers."
 PWC_PROJECT_FLEXIBLE_MANUFACTURING_EFFECTS: "Unlocks $PWC_EQUIPMENT_ASSAULT_ENGINEER_VEHICLE_GEN1$, $PWC_UNIT_ASSAULT_ENGINEER$. Produce the equipment and add the support company to a division."
 PWC_PROJECT_FLIGHT_TEST_INSTRUMENTATION: "Airborne Maritime Search Radar"
 PWC_PROJECT_FLIGHT_TEST_INSTRUMENTATION_DESC: "Develop maritime search avionics for attack aircraft and UAVs to locate ships and submarines."
 PWC_PROJECT_FLIGHT_TEST_INSTRUMENTATION_EFFECTS: "Unlocks $PWC_MODULE_AIR_AVIONICS_MARITIME_RADAR$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_INTEGRATED_FLIGHT_TESTING: "Airborne Defensive Jamming"
 PWC_PROJECT_INTEGRATED_FLIGHT_TESTING_DESC: "Package defensive jamming in a pod, trading agility, reliability and range for survivability."
 PWC_PROJECT_INTEGRATED_FLIGHT_TESTING_EFFECTS: "Unlocks $PWC_MODULE_AIR_SPECIAL_DEFENSIVE_JAMMER$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_MODULAR_NAVAL_REFIT: "Shipborne ASW Aviation"
 PWC_PROJECT_MODULAR_NAVAL_REFIT_DESC: "Develop ASW helicopter facilities for destroyers and cruisers to extend their search and attack reach."
 PWC_PROJECT_MODULAR_NAVAL_REFIT_EFFECTS: "Unlocks $PWC_MODULE_NAVY_SPECIAL_HELICOPTER_HANGAR$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_MODULAR_SHIPBUILDING: "Uncrewed ASW Mission Bay"
 PWC_PROJECT_MODULAR_SHIPBUILDING_DESC: "Develop a mission bay for surface escorts to deploy uncrewed ASW search and attack systems."
 PWC_PROJECT_MODULAR_SHIPBUILDING_EFFECTS: "Unlocks $PWC_MODULE_NAVY_SPECIAL_ASW_MISSION_BAY$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_NAVAL_NETWORK: "Networked Naval Warfare"
 PWC_PROJECT_NAVAL_NETWORK_DESC: "Naval networking research studies how vessels exchange and interpret mission information through shared data, command procedures, and communications."
 PWC_PROJECT_NAVAL_NETWORK_EFFECTS: "Unlocks $PWC_MODULE_NAVY_SPECIAL_STEALTH_QUIETING$, $PWC_MODULE_NAVY_SPECIAL_CIC$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_NEXT_GEN_ARMOR: "Next-Generation Armor Platform"
 PWC_PROJECT_NEXT_GEN_ARMOR_DESC: "The next-generation armored platform project reconsiders vehicle structure, armament, and crew arrangements as a complete layout rather than a collection of separate additions."
 PWC_PROJECT_NEXT_GEN_ARMOR_EFFECTS: "Unlocks $PWC_MODULE_TANK_GUN_140MM_ETC$, $PWC_MODULE_TANK_TURRET_UNMANNED$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_NIGHT_FLIGHT_SYSTEMS: "Multimode Night Navigation"
 PWC_PROJECT_NIGHT_FLIGHT_SYSTEMS_DESC: "Integrate night navigation and instrument guidance to reduce night penalties and extend range."
 PWC_PROJECT_NIGHT_FLIGHT_SYSTEMS_EFFECTS: "Unlocks $PWC_MODULE_AIR_AVIONICS_NIGHT_NAVIGATION$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_PRECISION_PRODUCTION: "Self-Propelled Heavy Mortars"
 PWC_PROJECT_PRECISION_PRODUCTION_DESC: "Integrate heavy mortars, rapid deployment gear and ammunition handling on a dedicated vehicle."
 PWC_PROJECT_PRECISION_PRODUCTION_EFFECTS: "Unlocks $PWC_EQUIPMENT_HEAVY_MORTAR_GEN1$, $PWC_UNIT_SUPPORT_HEAVY_MORTAR$. Produce the equipment and add the support company to a division."
 PWC_PROJECT_STEALTH_TECHNOLOGY: "Low-Observable Technology"
 PWC_PROJECT_STEALTH_TECHNOLOGY_DESC: "Low-observable technology studies the ways a platform reveals itself, considering shape, materials, and equipment operation as parts of one engineering approach."
 PWC_PROJECT_STEALTH_TECHNOLOGY_EFFECTS: "Unlocks $PWC_MODULE_AIR_SPECIAL_STEALTH_SHAPING$. Fit the modules in the designer, then produce or refit."
 PWC_PROJECT_STRATEGIC_UAV: "Strategic Unmanned Systems"
 PWC_PROJECT_STRATEGIC_UAV_DESC: "The strategic unmanned systems project joins long-range missions, ground control, and information links, treating aircraft, personnel, and continuing support as one program."
 PWC_PROJECT_STRATEGIC_UAV_EFFECTS: "Unlocks $PWC_MODULE_TANK_SPECIAL_RECON_UAV$, $PWC_MODULE_AIR_SPECIAL_UAV_DATALINK$, $PWC_MODULE_AIR_AVIONICS_SENSOR_FUSION$. Fit the modules in the designer, then produce or refit."
 PWC_SF_MARINES_1: "Littoral Assault"
 PWC_SF_MARINES_1_DESC: "Boat teams and coordinated infantry fire open landing sites and breach defended riverbanks."
 PWC_SF_MARINES_2: "Expeditionary Shore Support"
 PWC_SF_MARINES_2_DESC: "Wetland training and light shore logistics preserve cohesion after the first landing."
 PWC_SF_MOUNTAINEERS_1: "Alpine Warfare"
 PWC_SF_MOUNTAINEERS_1_DESC: "Cold-weather training and prepared mountain positions sustain control of the highlands."
 PWC_SF_MOUNTAINEERS_2: "Mountain Maneuver"
 PWC_SF_MOUNTAINEERS_2_DESC: "Climbing teams and mutual support turn broken terrain into covered approach routes."
 PWC_SF_PARATROOPERS_1: "Vertical Assault"
 PWC_SF_PARATROOPERS_1_DESC: "Accurate drops and rapid assembly turn the first moments on the ground into local initiative."
 PWC_SF_PARATROOPERS_2: "Sustained Airborne Operations"
 PWC_SF_PARATROOPERS_2_DESC: "Restore contact after dispersed landings and hold key positions until the main force arrives."
 PWC_SF_RANGERS_1: "Forest Raiding"
 PWC_SF_RANGERS_1_DESC: "Forest reconnaissance and short assaults maintain pressure through concealed movement."
 PWC_SF_RANGERS_2: "Jungle Infiltration"
 PWC_SF_RANGERS_2_DESC: "Tropical survival and small-team communications sustain operations beyond the road network."
 PWC_TECH0_BASIC_INDUSTRY: "Basic Industry"
 PWC_TECH0_BASIC_INDUSTRY_DESC: "Basic industry provides common means of repair, processing, and production, giving everyday manufacturing a dependable technical foundation."
 PWC_TECH0_BASIC_INFANTRY: "Basic Infantry Equipment"
 PWC_TECH0_BASIC_INFANTRY_DESC: "Contemporary rifles, protective equipment, and basic infantry organization are available from the start."
 PWC_TECH0_COMMUNICATIONS: "Basic Communications"
 PWC_TECH0_COMMUNICATIONS_DESC: "Basic communications links separated posts and units, replacing improvised messages with usable equipment and defined procedures."
 PWC_TECH0_ENGINEERS: "Basic Engineer Equipment"
 PWC_TECH0_ENGINEERS_DESC: "Basic engineering tools support construction, obstacle clearance, and field work, allowing troops to address practical problems of roads, positions, and terrain."
 PWC_TECH0_TRANSPORT: "Basic Transport Equipment"
 PWC_TECH0_TRANSPORT_DESC: "Basic transport equipment carries people and supplies, providing the city with common vehicle procedures and support practices for larger movements."
 PWC_TECH_AIR_STRIKE_T1: "Long-Range Bomber Production"
 PWC_TECH_AIR_STRIKE_T1_DESC: "Establishes bomber manufacturing and wing organization as the starting point for strategic aviation."
 PWC_TECH_AIR_STRIKE_T2: "Improved Long-Range Aviation"
 PWC_TECH_AIR_STRIKE_T2_DESC: "Improves long-range airframe structure and mission systems for the next bomber production model."
 PWC_TECH_AIR_STRIKE_T3: "Aerial Refueling and Endurance"
 PWC_TECH_AIR_STRIKE_T3_DESC: "Adds refueling and external fuel options to broaden the endurance choices available to long-range aircraft."
 PWC_TECH_AIR_STRIKE_T4: "Long-Range Strike Platforms"
 PWC_TECH_AIR_STRIKE_T4_DESC: "Integrates advanced bomber airframes and air-launched cruise missiles for a broader choice of mission payloads."
 PWC_TECH_AIR_SUPPORT_T1: "Ground Support Aviation"
 PWC_TECH_AIR_SUPPORT_T1_DESC: "Establishes production and wing organization for attack aircraft and unmanned ground-support platforms."
 PWC_TECH_AIR_SUPPORT_T2: "Improved Attack and Unmanned Aircraft"
 PWC_TECH_AIR_SUPPORT_T2_DESC: "Improves attack platforms and gun-pod options for a broader range of producible ground-support designs."
 PWC_TECH_AIR_SUPPORT_T3: "Tactical Aviation Payloads"
 PWC_TECH_AIR_SUPPORT_T3_DESC: "Improves attack and unmanned airframes around mission payloads for more capable tactical aviation designs."
 PWC_TECH_AIR_SUPPORT_T4: "Coordinated Support Aviation"
 PWC_TECH_AIR_SUPPORT_T4_DESC: "Combines advanced electronics and stand-off weapons with attack aircraft, including cruise-missile payloads for unmanned platforms."
 PWC_TECH_AIR_T1: "Basic Aviation Industry"
 PWC_TECH_AIR_T1_DESC: "Aviation industry begins with shared foundations in airframes, propulsion, and flight support. Dependable manufacture, maintenance, and operation come before ambitious designs."
 PWC_TECH_AIR_T2: "Second-Generation Combat Aircraft"
 PWC_TECH_AIR_T2_DESC: "The next aircraft generation coordinates propulsion, avionics, and weapons carriage, addressing operational requirements as complete missions rather than isolated components."
 PWC_TECH_AIR_T3: "Third-Generation Combat Aircraft"
 PWC_TECH_AIR_T3_DESC: "Pairs beyond-visual-range missiles with advanced fighter airframes and coordinated fire control."
 PWC_TECH_AIR_T4: "Fourth-Generation Fighters and Unmanned Warfare"
 PWC_TECH_AIR_T4_DESC: "Coordinates advanced fighter airframes and the next generation of air-to-air missiles."
 PWC_TECH_ARMY_AMPHIBIOUS_T1: "Modern Amphibious Tank Chassis"
 PWC_TECH_ARMY_AMPHIBIOUS_T1_DESC: "Modern amphibious hulls combine water mobility with lightweight armor and direct fire support."
 PWC_TECH_ARMY_AMPHIBIOUS_T2: "Modular Amphibious Tank Chassis"
 PWC_TECH_ARMY_AMPHIBIOUS_T2_DESC: "Modular amphibious hulls combine water mobility with lightweight armor and direct fire support."
 PWC_TECH_ARMY_AMPHIBIOUS_T3: "Smart Protection Amphibious Tank Chassis"
 PWC_TECH_ARMY_AMPHIBIOUS_T3_DESC: "Smart Protection amphibious hulls combine water mobility with lightweight armor and direct fire support."
 PWC_TECH_ARMY_AMPHIBIOUS_T4: "Cooperative Amphibious Tank Chassis"
 PWC_TECH_ARMY_AMPHIBIOUS_T4_DESC: "Cooperative amphibious hulls combine water mobility with lightweight armor and direct fire support."
 PWC_TECH_ARMY_FIREPOWER_T1: "Modern Self-Propelled Artillery"
 PWC_TECH_ARMY_FIREPOWER_T1_DESC: "Integrates a contemporary howitzer, vehicle chassis, and digital fire control into producible self-propelled artillery for line and support formations."
 PWC_TECH_ARMY_FIREPOWER_T2: "Ballistics and Fire Coordination"
 PWC_TECH_ARMY_FIREPOWER_T2_DESC: "Introduces second-generation autoloading howitzers and coordinated ballistics, target reporting, and position defense."
 PWC_TECH_ARMY_FIREPOWER_T3: "Autoloaders and Precision Ammunition"
 PWC_TECH_ARMY_FIREPOWER_T3_DESC: "Combines unmanned turrets, autoloading, and precision ammunition in third-generation howitzers."
 PWC_TECH_ARMY_FIREPOWER_T4: "Unmanned Artillery Coordination"
 PWC_TECH_ARMY_FIREPOWER_T4_DESC: "Integrates long-barreled artillery and cooperative fire control in fourth-generation unmanned platforms."
 PWC_TECH_ARMY_INFANTRY_T1: "Modern Infantry and Security Formations"
 PWC_TECH_ARMY_INFANTRY_T1_DESC: "Improve infantry weapons and establish military police and headquarters security units."
 PWC_TECH_ARMY_INFANTRY_T2: "Modular Infantry Weapons"
 PWC_TECH_ARMY_INFANTRY_T2_DESC: "Standard interfaces and modular accessories connect sights, protection, and squad firepower."
 PWC_TECH_ARMY_INFANTRY_T3: "Smart Sights and Protection"
 PWC_TECH_ARMY_INFANTRY_T3_DESC: "Integrates smart sights, target information, and personal protection for complex battlefields."
 PWC_TECH_ARMY_INFANTRY_T4: "Cooperative Infantry Systems"
 PWC_TECH_ARMY_INFANTRY_T4_DESC: "Integrates advanced infantry fire control with shared target information."
 PWC_TECH_ARMY_MOBILITY_T1: "Light Armor Production"
 PWC_TECH_ARMY_MOBILITY_T1_DESC: "Establishes light armor and first-generation tracked IFV production, with light armored and mechanized infantry battalions."
 PWC_TECH_ARMY_MOBILITY_T2: "Mechanized Transport"
 PWC_TECH_ARMY_MOBILITY_T2_DESC: "Introduces second-generation modular wheeled IFVs and improved light chassis for protected infantry mobility alongside armor."
 PWC_TECH_ARMY_MOBILITY_T3: "Mobile Chassis and Propulsion"
 PWC_TECH_ARMY_MOBILITY_T3_DESC: "Develops propulsion, suspension, and engineering attachments for improved light armor and mechanized transport."
 PWC_TECH_ARMY_MOBILITY_T4: "Advanced Mobility Systems"
 PWC_TECH_ARMY_MOBILITY_T4_DESC: "Applies hybrid propulsion and adaptive suspension to advanced light armor and mechanized equipment."
 PWC_TECH_ARMY_T1: "Contemporary Battle and Assault Armor"
 PWC_TECH_ARMY_T1_DESC: "Starts battle and assault armor with smoothbore guns, composite protection, thermal sights, and digital radios, alongside dedicated missile carriers."
 PWC_TECH_ARMY_T2: "Modular Armor and Firepower"
 PWC_TECH_ARMY_T2_DESC: "Develops distinct armored roles through modular protection, improved guns, and NLOS missiles."
 PWC_TECH_ARMY_T3: "Smart Fire Control and Protection"
 PWC_TECH_ARMY_T3_DESC: "Advances the platforms with smart fire control, reactive protection, and multimode missiles."
 PWC_TECH_ARMY_T4: "Cooperative Land Platforms"
 PWC_TECH_ARMY_T4_DESC: "Provides integration space for cooperative vehicles and advanced propulsion; frontier guns, unmanned turrets, and active protection come from their corresponding special projects."

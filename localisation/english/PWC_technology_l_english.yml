 PWC_UNIT_SUPPORT_ANTI_TANK: "Anti-Armor Company"
 PWC_UNIT_SUPPORT_ANTI_TANK_DESC: "Concentrates anti-armor weapons and teams to reinforce the battalions against enemy armor."
 PWC_UNIT_SUPPORT_ANTI_TANK_EFFECTS: "Equipment needed: $PWC_EQUIPMENT_ANTI_TANK$ x24."
 PWC_UNIT_SUPPORT_ARTILLERY: "Self-Propelled Artillery Support"
 PWC_UNIT_SUPPORT_ARTILLERY_DESC: "A compact artillery element supplies indirect fire to suppress targets and cover the battalions."
 PWC_UNIT_SUPPORT_ARTILLERY_EFFECTS: "Equipment needed: $PWC_EQUIPMENT_ARTILLERY$ x12."
 PWC_UNIT_SUPPORT_HEAVY_MORTAR: "Heavy Mortar Support Company"
 PWC_UNIT_SUPPORT_HEAVY_MORTAR_DESC: "Uses self-propelled heavy mortars in urban and forest combat; limited against armor and dependent on specialist vehicles and fuel."
 PWC_UNIT_SUPPORT_HEAVY_MORTAR_EFFECTS: "Equipment needed: $PWC_EQUIPMENT_HEAVY_MORTAR$ x12, $PWC_EQUIPMENT_SUPPORT$ x5. Unlocked by $PWC_PROJECT_PRECISION_PRODUCTION$. Shares the support class of $PWC_UNIT_SUPPORT_ARTILLERY$; choose one."
 PWC_UNIT_TANK: "Tank Battalion"
 PWC_UNIT_TANK_DESC: "A tank battalion organizes armored platforms as a common ground force, joining crews, command, and maintenance in collective operations."
 PWC_UNIT_TANK_DESTROYER: "Anti-Tank Missile Vehicle Battalion"
 PWC_UNIT_TANK_DESTROYER_DESC: "A tank-destroyer battalion organizes observation and fire for anti-armor tasks, coordinating vehicle positions, direction, and supporting protection."
 PWC_UNIT_TANK_DESTROYER_EFFECTS: "Equipment needed: $PWC_PLATFORM_TANK_DESTROYER$ x40."
 PWC_UNIT_TANK_EFFECTS: "Equipment needed: $PWC_PLATFORM_MEDIUM_TANK$ x50."
 PWC_UNIT_TRANSPORT: "Transport Wing"
 PWC_UNIT_TRANSPORT_DESC: "Transport wings conduct paradrops and air supply. Their aircraft carry troops and supplies and have no air-superiority or ground-attack mission."
 PWC_UNIT_TRANSPORT_EFFECTS: "Equipment needed: $PWC_EQUIPMENT_TRANSPORT$ x1."
 PWC_UNIT_UAV: "UAV Wing"
 PWC_UNIT_UAV_DESC: "An unmanned wing organizes aircraft and ground operators together through mission planning, data links, and equipment maintenance."
 PWC_UNIT_UAV_EFFECTS: "Equipment needed: $PWC_PLATFORM_UAV$ x1."

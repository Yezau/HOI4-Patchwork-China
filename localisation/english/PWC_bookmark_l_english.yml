 PWC_BOOKMARK_2026_DESC: "Hundreds of factions, each with a future to shape. Mountains divide them; roads, ports and trade bring them together.\n\nBuild industry, advance technology and defend your home. Find your faction's path through cooperation and rivalry.\n\nBrowse 32 recommended factions, or open the map and choose your own starting point."

 PWC_OCCUPATION_LAW_MILITARY_ADMIN: "City Military Administration"
 PWC_OCCUPATION_LAW_MILITARY_ADMIN_DESC: "A city under military administration needs restored district order, resident records, and basic public services. The occupation authority manages this transition toward lasting governance."
 PWC_REGION_CENTRAL_CHINA: "Central China"
 PWC_REGION_EAST_CHINA: "East China"
 PWC_REGION_MUNICIPALITIES: "Municipalities"
 PWC_REGION_NORTHEAST: "Northeast"
 PWC_REGION_NORTHWEST: "Northwest"
 PWC_REGION_NORTH_CHINA: "North China"
 PWC_REGION_SOUTHWEST: "Southwest"
 PWC_REGION_SOUTH_CHINA: "South China"
 PWC_RULE_ADMINISTRATIVE_PRESSURE: "Administrative pressure"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_DESC: "Each extra non-core city adds 0.5% consumer goods, or 0.2% if cored; capped at 10%."
 PWC_RULE_ADMINISTRATIVE_PRESSURE_KEEP: "Keep"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_KEEP_DESC: "Beyond the capital, each owned non-core state adds 0.5% consumer-goods factor and each core state 0.2%, capped at 10%. Recalculated after territory changes or core integration."
 PWC_RULE_ADMINISTRATIVE_PRESSURE_REMOVE: "Remove"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_REMOVE_DESC: "Extra city states no longer add the administrative-pressure consumer-goods modifier. Expansion, core integration and consumer-goods requirements from other sources remain."
 PWC_RULE_AI_DIFFICULTY: "AI difficulty"
 PWC_RULE_AI_DIFFICULTY_DESC: "Standard retains the usual pace. Challenging and above improve production and upgrades; Hard and Extreme also support MIO growth. AI only; disabled under human control."
 PWC_RULE_AI_DIFFICULTY_T0: "Standard"
 PWC_RULE_AI_DIFFICULTY_T0_DESC: "For regular play. AI keeps its usual development and refit pace, with basic shortage recovery only. No enhanced reserves, accelerated model switching or bonuses."
 PWC_RULE_AI_DIFFICULTY_T0_EFFECTS: "For regular play. AI keeps its usual development and refit pace, with basic shortage recovery only. No enhanced reserves, accelerated model switching or bonuses."
 PWC_RULE_AI_DIFFICULTY_T10: "Challenging"
 PWC_RULE_AI_DIFFICULTY_T10_DESC: "AI plans equipment reserves, model switching and template upgrades, with moderate research, construction, production and supply support. Disabled under human control."
 PWC_RULE_AI_DIFFICULTY_T10_EFFECTS: "AI plans equipment reserves, model switching and template upgrades, with moderate research, construction, production and supply support. Disabled under human control."
 PWC_RULE_AI_DIFFICULTY_T20: "Hard"
 PWC_RULE_AI_DIFFICULTY_T20_DESC: "AI receives strong research, construction, production and supply support, with faster MIO funding and lower size-up requirements. MIO support requires Arms Against Tyranny. Disabled under human control."
 PWC_RULE_AI_DIFFICULTY_T20_EFFECTS: "AI receives strong research, construction, production and supply support, with faster MIO funding and lower size-up requirements. MIO support requires Arms Against Tyranny. Disabled under human control."
 PWC_RULE_AI_DIFFICULTY_T30: "Extreme"
 PWC_RULE_AI_DIFFICULTY_T30_DESC: "AI receives extensive research, construction, production and supply support, with much faster MIO funding and further reduced size-up requirements. MIO support requires Arms Against Tyranny. Disabled under human control."
 PWC_RULE_AI_DIFFICULTY_T30_EFFECTS: "AI receives extensive research, construction, production and supply support, with much faster MIO funding and further reduced size-up requirements. MIO support requires Arms Against Tyranny. Disabled under human control."
 PWC_RULE_AI_WAR_PACING: "AI war pacing"
 PWC_RULE_AI_WAR_PACING_DESC: "Shapes when AI cities declare war so the whole map does not open at once. Both the wave unlock and the post-war cooldown apply to AI only; players are never restricted."
 PWC_RULE_AI_WAR_PACING_OFF: "Disabled"
 PWC_RULE_AI_WAR_PACING_OFF_DESC: "No staggering at all. Every AI city unlocks war on the same day after protection, and wars carry no cooldown. Intended for comparison testing only."
 PWC_RULE_AI_WAR_PACING_SLOW: "Slow"
 PWC_RULE_AI_WAR_PACING_SLOW_DESC: "Gentler pacing. The AI unlock window stretches to about 300 days and the post-war cooldown is 150 days. AI only."
 PWC_RULE_AI_WAR_PACING_STAGGERED: "Staggered"
 PWC_RULE_AI_WAR_PACING_STAGGERED_DESC: "After protection ends, AI cities unlock war in fixed hash waves spread over about 180 days, and AI winners wait 30 days after each war before starting another. AI only; players are never restricted."
 PWC_RULE_AI_WAR_TENDENCY: "AI war tendency"
 PWC_RULE_AI_WAR_TENDENCY_AGGRESSIVE: "Aggressive"
 PWC_RULE_AI_WAR_TENDENCY_AGGRESSIVE_DESC: "AI cities request war more readily and accept smaller strength advantages. Wars may be more frequent; protection, legal targets and cross-strait readiness remain."
 PWC_RULE_AI_WAR_TENDENCY_DESC: "Changes AI war scores and required strength advantages. Land targets must border current territory. Cross-strait wars require ports and AI readiness. Protection and city survival checks still apply."
 PWC_RULE_AI_WAR_TENDENCY_STANDARD: "Standard"
 PWC_RULE_AI_WAR_TENDENCY_STANDARD_DESC: "AI uses standard war propensity and strength thresholds, adjusted by city archetype. Protection, adjacency and cross-strait readiness checks remain in force."
 PWC_RULE_AI_WAR_TENDENCY_STEADY: "Cautious"
 PWC_RULE_AI_WAR_TENDENCY_STEADY_DESC: "AI cities request war less readily and require a larger strength advantage. Protection, legal targets and cross-strait readiness still apply."
 PWC_RULE_ALLOW_GUARANTEES: "Guarantees: blocked"
 PWC_RULE_ALLOW_GUARANTEES_DESC: "Cities cannot guarantee another country's independence."
 PWC_RULE_ALLOW_RELEASE_NATIONS: "Nation release: blocked"
 PWC_RULE_ALLOW_RELEASE_NATIONS_DESC: "Eliminated cities cannot return through nation release."
 PWC_RULE_ALLOW_REVOKE_GUARANTEES: "Revoking guarantees: blocked"
 PWC_RULE_ALLOW_REVOKE_GUARANTEES_DESC: "Guarantee creation and revocation remain blocked for this game."
 PWC_RULE_ALLOW_WARGOALS: "War entry: city war rules"
 PWC_RULE_ALLOW_WARGOALS_DESC: "Use city war decisions, subject to opening protection and legal target checks."
 PWC_RULE_ARCHETYPE_SEED: "City AI archetypes"
 PWC_RULE_ARCHETYPE_SEED_DESC: "Random mode draws once from each city's eligible pool and saves it without changing geography."
 PWC_RULE_ARCHETYPE_SEED_FIXED: "Fixed assignment"
 PWC_RULE_ARCHETYPE_SEED_FIXED_DESC: "Each city keeps its roster-assigned AI archetype, giving repeatable opening preferences."
 PWC_RULE_ARCHETYPE_SEED_RANDOM: "Random each game"
 PWC_RULE_ARCHETYPE_SEED_RANDOM_DESC: "Draw once from each city's eligible archetype pool at the start and save the result. Reloading does not reroll it or change geography, starting units or resources."
 PWC_RULE_DEMOBILIZATION: "Mobilization and demobilization"
 PWC_RULE_DEMOBILIZATION_AI_ONLY: "AI only"
 PWC_RULE_DEMOBILIZATION_AI_ONLY_DESC: "Only AI cities must observe the peacetime level-3 law cap and demobilize after 90 days of peace. Players are exempt from forced demobilization."
 PWC_RULE_DEMOBILIZATION_DESC: "Peacetime conscription and economy laws are capped at level 3 after a 90-day grace."
 PWC_RULE_DEMOBILIZATION_OFF: "Disabled"
 PWC_RULE_DEMOBILIZATION_OFF_DESC: "Disable the peacetime law cap and automatic demobilization for players and AI. Peace no longer lowers conscription or economy laws through this rule."
 PWC_RULE_DEMOBILIZATION_STANDARD: "Standard"
 PWC_RULE_DEMOBILIZATION_STANDARD_DESC: "Players and AI have a peacetime level-3 cap on conscription and economy laws. After 90 days of peace, higher levels return to 3."
 PWC_RULE_FIXED: "Fixed"
 PWC_RULE_GEOGRAPHIC_SUPPLY: "Regional supply"
 PWC_RULE_GEOGRAPHIC_SUPPLY_DESC: "Adds 1 local supply in listed Xinjiang, Qinghai, Gansu, Ningxia and Inner Mongolia cities."
 PWC_RULE_GEOGRAPHIC_SUPPLY_KEEP: "Keep"
 PWC_RULE_GEOGRAPHIC_SUPPLY_KEEP_DESC: "Keep 1 extra local supply in city states of Xinjiang, Qinghai, Gansu, Ningxia and Inner Mongolia. NTR is excluded; focus geography mode does not affect this bonus."
 PWC_RULE_GEOGRAPHIC_SUPPLY_REMOVE: "Remove"
 PWC_RULE_GEOGRAPHIC_SUPPLY_REMOVE_DESC: "Remove the extra local-supply bonus from the listed northwest and Inner Mongolia city states. Normal supply, infrastructure and geography remain unchanged."
 PWC_RULE_GEOGRAPHY_MODE: "City geography focuses"
 PWC_RULE_GEOGRAPHY_MODE_CURRENT: "Current"
 PWC_RULE_GEOGRAPHY_MODE_CURRENT_DESC: "Keep the eight focuses tied to the city's geographic type. Physical geography and other opening-rule choices remain independent."
 PWC_RULE_GEOGRAPHY_MODE_DESC: "Choose the city's existing 8 geographic focuses or 8 generic city focuses; geography stays intact."
 PWC_RULE_GEOGRAPHY_MODE_GENERIC: "Generic"
 PWC_RULE_GEOGRAPHY_MODE_GENERIC_DESC: "Replace the city's eight geographic focuses with eight generic city-cooperation focuses. Physical ports, borders and islands retain their real geography."
 PWC_RULE_GROUP_COMMON: "Common rules"
 PWC_RULE_GROUP_FIXED: "Fixed world rules"
 PWC_RULE_GROUP_GEOGRAPHY: "City geography"
 PWC_RULE_INDUSTRY_CALIBRATION: "Industry calibration"
 PWC_RULE_INDUSTRY_CALIBRATION_BALANCE: "Balance"
 PWC_RULE_INDUSTRY_CALIBRATION_BALANCE_DESC: "At the start, remove city off-map civilian and military factories, then set each city state's map factories to 2 civilian and 1 military. Dockyards are kept; runs once."
 PWC_RULE_INDUSTRY_CALIBRATION_DESC: "Normalize removes off-map civilian and military factories; balance also sets each city to 2/1."
 PWC_RULE_INDUSTRY_CALIBRATION_KEEP: "Keep"
 PWC_RULE_INDUSTRY_CALIBRATION_KEEP_DESC: "Keep existing map and off-map civilian and military factories, preserving each city's starting industrial differences."
 PWC_RULE_INDUSTRY_CALIBRATION_NORMALIZE: "Normalize"
 PWC_RULE_INDUSTRY_CALIBRATION_NORMALIZE_DESC: "At the start, remove off-map civilian and military factories from cities while keeping map factories and dockyards. Runs once; reloading does not remove later gains."
 PWC_RULE_INTEGRATION_SPEED: "Postwar integration"
 PWC_RULE_INTEGRATION_SPEED_DESC: "Adjusts compliance growth under city administration. In owned and fully controlled non-core states, reaching 80% compliance removes one military factory level if present; reaching 90% makes the state a core automatically."
 PWC_RULE_INTEGRATION_SPEED_FAST: "Fast"
 PWC_RULE_INTEGRATION_SPEED_FAST_DESC: "Use fast city administration with base compliance growth of 0.6 for quicker postwar integration. The 80% factory stage and 90% core threshold still apply; cores are not granted immediately."
 PWC_RULE_INTEGRATION_SPEED_STANDARD: "Standard"
 PWC_RULE_INTEGRATION_SPEED_STANDARD_DESC: "Use standard city administration with base compliance growth of 0.3. Owned, fully controlled non-core states lose one military factory level at 80% if present, and become cores at 90%. Other modifiers affect actual growth."
 PWC_RULE_INTEGRATION_SPEED_STRICT: "Strict"
 PWC_RULE_INTEGRATION_SPEED_STRICT_DESC: "Use strict city administration with base compliance growth of 0.15, lengthening postwar integration. Ownership and full control remain required, with the same 80% factory and 90% core thresholds."
 PWC_RULE_OPTION_BLOCKED: "Blocked"
 PWC_RULE_PEACE_CONFERENCE: "Peace conferences"
 PWC_RULE_PEACE_CONFERENCE_DESC: "Conferences decide territory and survival; only final annexation eliminates a city."
 PWC_RULE_PEACE_CONFERENCE_OFF: "Disabled (automatic settlement)"
 PWC_RULE_PEACE_CONFERENCE_OFF_DESC: "Use the mod's automatic territorial settlement after capitulation, without a peace conference. Existing settlement and city-elimination rules apply."
 PWC_RULE_PEACE_CONFERENCE_ON: "Enabled"
 PWC_RULE_PEACE_CONFERENCE_ON_DESC: "Native peace conferences decide territory and survival after capitulation. A defeated city may remain independent; only a city finally annexed is eliminated."
 PWC_RULE_PROTECTION_PERIOD: "Opening protection"
 PWC_RULE_PROTECTION_PERIOD_DAYS_180: "Standard (180 days)"
 PWC_RULE_PROTECTION_PERIOD_DAYS_180_DESC: "All cities are protected from city wars for 180 days from 1 January 2026. After protection ends, the selected war-warning rule applies."
 PWC_RULE_PROTECTION_PERIOD_DAYS_90: "Fast (90 days)"
 PWC_RULE_PROTECTION_PERIOD_DAYS_90_DESC: "All cities are protected from city wars for 90 days from 1 January 2026. After protection ends, the selected war-warning rule applies."
 PWC_RULE_PROTECTION_PERIOD_DESC: "All cities share the same protection window from 1 January 2026."
 PWC_RULE_PROTECTION_PERIOD_NONE: "No protection"
 PWC_RULE_PROTECTION_PERIOD_NONE_DESC: "Eligible cities may request war immediately from the start. The selected war-warning rule and legal-target checks still apply."
 PWC_RULE_STATE_TRANSFER: "State transfer tool"
 PWC_RULE_STATE_TRANSFER_DESC: "Players may preview and transfer peaceful states; capitals, last states and NTR are excluded."
 PWC_RULE_STATE_TRANSFER_OFF: "Disabled"
 PWC_RULE_STATE_TRANSFER_OFF_DESC: "Hide the player state-transfer tool. Wars and other normal game mechanisms may still change territorial ownership."
 PWC_RULE_STATE_TRANSFER_ON: "Enabled (players)"
 PWC_RULE_STATE_TRANSFER_ON_DESC: "All human city players may select states and a recipient, preview, then confirm. Only peaceful, owned, fully controlled states qualify; capitals, last states, NTR and territory in peace conferences are excluded."
 PWC_RULE_UNIT_LIMIT: "Division capacity"
 PWC_RULE_UNIT_LIMIT_AI_ONLY: "AI only"
 PWC_RULE_UNIT_LIMIT_AI_ONLY_DESC: "Only AI cities have the capacity limit and excess penalties; players are exempt. AI capacity is 8 plus 4 per owned, fully controlled state, capped at 500 divisions."
 PWC_RULE_UNIT_LIMIT_DESC: "Capacity is 8 plus 4 divisions per owned and controlled city; excess reduces recovery."

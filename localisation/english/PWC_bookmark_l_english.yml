 PWC_RULE_ADMINISTRATIVE_PRESSURE: "Expansion consumer goods"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_DESC: "Choose whether extra owned cities increase the consumer-goods factory factor for players and AI. The capital is exempt; cores cost less than non-cores."
 PWC_RULE_ADMINISTRATIVE_PRESSURE_KEEP: "Extra consumer goods"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_KEEP_DESC: "§YApplies to§!\n - Players and AI; the §Ycapital is exempt§!.\n\n§YConsumer-goods burden§!\n - Each owned non-core: §R+0.5%§! consumer-goods factory factor.\n - Each owned core: §R+0.2%§! consumer-goods factory factor.\n - Total cap: §Y10%§!.\n\n§YNotes§!\n - This changes the factor, not a fixed factory count.\n - Losing control §Rdoes not exempt§! an owned state.\n - Coring a state §Greduces its burden§!."
 PWC_RULE_ADMINISTRATIVE_PRESSURE_REMOVE: "No extra consumer goods"
 PWC_RULE_ADMINISTRATIVE_PRESSURE_REMOVE_DESC: "§YEffect§!\n - Extra city states §Gno longer add§! administrative consumer-goods costs.\n - Applies to players and AI.\n\n§YStill applies§!\n - Expansion and core integration continue normally.\n - Consumer-goods requirements from other sources remain."
 PWC_RULE_AI_DIFFICULTY: "AI difficulty"
 PWC_RULE_AI_DIFFICULTY_DESC: "Easy prioritizes basic equipment; Standard and above strengthen tank production and upgrades. Challenging adds bonuses; Hard and Extreme also add equipment aid and organization support. Extreme grows stronger as fewer powers remain."
 PWC_RULE_AI_DIFFICULTY_T0: "Easy"
 PWC_RULE_AI_DIFFICULTY_T0_DESC: "§YAI behavior§!\n - Prioritizes basic equipment shortages.\n - No extra priority for main battle tanks.\n\n§YDifficulty bonuses§!\n - Research, construction, factory output and supply: §Ynone§!."
 PWC_RULE_AI_DIFFICULTY_T0_EFFECTS: "§YAI behavior§!\n - Prioritizes basic equipment shortages.\n - No extra priority for main battle tanks.\n\n§YDifficulty bonuses§!\n - Research, construction, factory output and supply: §Ynone§!."
 PWC_RULE_AI_DIFFICULTY_T10: "Challenging"
 PWC_RULE_AI_DIFFICULTY_T10_DESC: "§YAI behavior§!\n - Uses Standard production and unit-upgrade priorities.\n\n§YAI bonuses§!\n - §GModerate bonuses§! to research, construction, factory output and supply.\n\n§YHuman takeover§!\n - Base bonuses are removed at the §Ynext monthly check§!."
 PWC_RULE_AI_DIFFICULTY_T10_EFFECTS: "§YAI behavior§!\n - Uses Standard production and unit-upgrade priorities.\n\n§YAI bonuses§!\n - §GModerate bonuses§! to research, construction, factory output and supply.\n\n§YHuman takeover§!\n - Base bonuses are removed at the §Ynext monthly check§!."
 PWC_RULE_AI_DIFFICULTY_T20: "Hard"
 PWC_RULE_AI_DIFFICULTY_T20_DESC: "§YAI bonuses§!\n - Uses Standard production and unit-upgrade priorities.\n - §GStrong bonuses§! to research, construction, factory output and supply.\n\n§YFocus equipment aid§!\n - Completed focuses can grant §Gextra equipment§!.\n - Subject to stock needs, aid budgets and cooldowns.\n\n§YOrganization support§!\n - Requires §YArms Against Tyranny DLC§!.\n - AI organizations §Ggrow faster§! and can use stronger exclusive variants.\n - Exclusive variants are §Runavailable to players§!.\n\n§YHuman takeover§!\n - Base difficulty bonuses leave at the §Ynext monthly check§!."
 PWC_RULE_AI_DIFFICULTY_T20_EFFECTS: "§YAI bonuses§!\n - Uses Standard production and unit-upgrade priorities.\n - §GStrong bonuses§! to research, construction, factory output and supply.\n\n§YFocus equipment aid§!\n - Completed focuses can grant §Gextra equipment§!.\n - Subject to stock needs, aid budgets and cooldowns.\n\n§YOrganization support§!\n - Requires §YArms Against Tyranny DLC§!.\n - AI organizations §Ggrow faster§! and can use stronger exclusive variants.\n - Exclusive variants are §Runavailable to players§!.\n\n§YHuman takeover§!\n - Base difficulty bonuses leave at the §Ynext monthly check§!."
 PWC_RULE_AI_DIFFICULTY_T30: "Extreme"
 PWC_RULE_AI_DIFFICULTY_T30_DESC: "§YAI bonuses§!\n - Uses Standard production and unit-upgrade priorities.\n - §GHighest base bonuses§! to research, construction, factory output and supply.\n\n§YFocus equipment aid§!\n - Completed focuses can grant §Gextra equipment§!. Aid can exceed Hard.\n - Subject to stock needs, aid budgets and cooldowns.\n\n§YOrganization support§!\n - Requires §YArms Against Tyranny DLC§!.\n - AI organizations §Ggrow faster§! and can use stronger exclusive variants.\n - Exclusive variants are §Runavailable to players§!.\n\n§YHuman takeover§!\n - Base difficulty bonuses leave at the §Ynext monthly check§!.\n\n§YExtreme difficulty: extra contest bonuses§!\nAt §Y100/50/20/10/5§! remaining powers, AI gains the matching bonuses:\n(The count includes players and excludes the neutral zone.)\n  - Army attack: §G+5%/+10%/+15%/+20%/+25%§!\n  - Army defence: §G+5%/+10%/+15%/+20%/+25%§!\n  - Army organization: §G+5%/+10%/+15%/+20%/+25%§!\n  - Factory output: §G+10%/+20%/+30%/+40%/+50%§!\n  - Construction speed: §G+10%/+20%/+30%/+40%/+50%§!\n§YUpdated weekly§!; only the strongest eligible stage applies.\n§RDisabled§! under human control, after elimination, or when one power remains."
 PWC_RULE_AI_DIFFICULTY_T30_EFFECTS: "§YAI bonuses§!\n - Uses Standard production and unit-upgrade priorities.\n - §GHighest base bonuses§! to research, construction, factory output and supply.\n\n§YFocus equipment aid§!\n - Completed focuses can grant §Gextra equipment§!. Aid can exceed Hard.\n - Subject to stock needs, aid budgets and cooldowns.\n\n§YOrganization support§!\n - Requires §YArms Against Tyranny DLC§!.\n - AI organizations §Ggrow faster§! and can use stronger exclusive variants.\n - Exclusive variants are §Runavailable to players§!.\n\n§YHuman takeover§!\n - Base difficulty bonuses leave at the §Ynext monthly check§!.\n\n§YExtreme difficulty: extra contest bonuses§!\nAt §Y100/50/20/10/5§! remaining powers, AI gains the matching bonuses:\n(The count includes players and excludes the neutral zone.)\n  - Army attack: §G+5%/+10%/+15%/+20%/+25%§!\n  - Army defence: §G+5%/+10%/+15%/+20%/+25%§!\n  - Army organization: §G+5%/+10%/+15%/+20%/+25%§!\n  - Factory output: §G+10%/+20%/+30%/+40%/+50%§!\n  - Construction speed: §G+10%/+20%/+30%/+40%/+50%§!\n§YUpdated weekly§!; only the strongest eligible stage applies.\n§RDisabled§! under human control, after elimination, or when one power remains."
 PWC_RULE_AI_DIFFICULTY_TSTANDARD: "Standard"
 PWC_RULE_AI_DIFFICULTY_TSTANDARD_DESC: "§YAI behavior§!\n - §YRecommended default§!.\n - Coordinates main battle tank research, production and unit upgrades.\n - Uses spare industry for tanks once basic equipment is sufficient.\n\n§YDifficulty bonuses§!\n - Research, construction, factory output and supply: §Ynone§!."
 PWC_RULE_AI_DIFFICULTY_TSTANDARD_EFFECTS: "§YAI behavior§!\n - §YRecommended default§!.\n - Coordinates main battle tank research, production and unit upgrades.\n - Uses spare industry for tanks once basic equipment is sufficient.\n\n§YDifficulty bonuses§!\n - Research, construction, factory output and supply: §Ynone§!."
 PWC_RULE_AI_WAR_PACING: "AI war timing"
 PWC_RULE_AI_WAR_PACING_DESC: "Set AI opening eligibility and the wait before new requests after an enemy city capitulates. This rule does not restrict players or stop existing wars. Other declaration conditions still apply."
 PWC_RULE_AI_WAR_PACING_OFF: "No staggering or cooldown"
 PWC_RULE_AI_WAR_PACING_OFF_DESC: "§YAI war eligibility§!\n - All AI cities §Yunlock together§! after protection.\n - No staggering or extra waiting after an enemy city capitulates.\n\n§YStill active§!\n - AI only; §Ydoes not force simultaneous wars§!.\n - Strength, readiness, target conditions and declaration delays still apply."
 PWC_RULE_AI_WAR_PACING_SLOW: "Slower, longer cooldown"
 PWC_RULE_AI_WAR_PACING_SLOW_DESC: "§YStaggered AI opening§!\n - After protection, AI unlocks in groups over §Y300 days§!.\n\n§YWait after capitulation§!\n - When an enemy city capitulates, AI fighting it waits §Y150 days§!.\n - During this wait, §Rnew war requests are blocked§!.\n - Existing wars continue.\n - Pending warnings still require valid conditions at expiry before war starts.\n\n§YScope§!\n - AI only; players still follow protection and target restrictions."
 PWC_RULE_AI_WAR_PACING_STAGGERED: "Staggered (default)"
 PWC_RULE_AI_WAR_PACING_STAGGERED_DESC: "§YStaggered AI opening§!\n - After protection, AI unlocks in groups over §Y180 days§!.\n\n§YWait after capitulation§!\n - When an enemy city capitulates, AI fighting it waits §Y30 days§!.\n - During this wait, §Rnew war requests are blocked§!.\n - Existing wars continue.\n - Pending warnings still require valid conditions at expiry before war starts.\n\n§YScope§!\n - AI only; players still follow protection and target restrictions."
 PWC_RULE_AI_WAR_TENDENCY: "AI aggression"
 PWC_RULE_AI_WAR_TENDENCY_AGGRESSIVE: "Aggressive"
 PWC_RULE_AI_WAR_TENDENCY_AGGRESSIVE_DESC: "§YAI aggression§!\n - War propensity: §Yhigher§!.\n - Required strength advantage: §Ysmaller§!.\n - Wars may be more frequent.\n\n§YStill active§!\n - Protection, legal targets, adjacency and cross-strait readiness."
 PWC_RULE_AI_WAR_TENDENCY_DESC: "Changes AI war scores and required strength advantages. Land targets must border current territory. Cross-strait wars require ports and AI readiness. Protection and city survival checks still apply."
 PWC_RULE_AI_WAR_TENDENCY_STANDARD: "Standard"
 PWC_RULE_AI_WAR_TENDENCY_STANDARD_DESC: "§YAI aggression§!\n - War propensity and strength thresholds: §Ystandard§!.\n - Target assessment follows each city's development style.\n\n§YStill active§!\n - Protection, legal targets, adjacency and cross-strait readiness."
 PWC_RULE_AI_WAR_TENDENCY_STEADY: "Cautious"
 PWC_RULE_AI_WAR_TENDENCY_STEADY_DESC: "§YAI aggression§!\n - War propensity: §Ylower§!.\n - Required strength advantage: §Ylarger§!.\n - Allows a longer development period.\n\n§YStill active§!\n - Protection, legal targets, adjacency and cross-strait readiness."
 PWC_RULE_ALLOW_GUARANTEES: "Guarantees: blocked"
 PWC_RULE_ALLOW_GUARANTEES_DESC: "§YGuarantees§!\n  - Cities §Rcannot guarantee another country's independence§!."
 PWC_RULE_ALLOW_RELEASE_NATIONS: "Nation release: blocked"
 PWC_RULE_ALLOW_RELEASE_NATIONS_DESC: "§YNation release§!\n  - Eliminated cities §Rcannot return through nation release§!."
 PWC_RULE_ALLOW_REVOKE_GUARANTEES: "Revoking guarantees: blocked"
 PWC_RULE_ALLOW_REVOKE_GUARANTEES_DESC: "§YFixed diplomatic rules§!\n  - Guarantee creation and revocation are §Rblocked§!."
 PWC_RULE_ALLOW_WARGOALS: "War entry: city war rules"
 PWC_RULE_ALLOW_WARGOALS_DESC: "§YWar declaration§!\n  - Use §Ycity war decisions§!.\n  - Opening protection and legal target conditions still apply."
 PWC_RULE_ARCHETYPE_SEED: "AI city development styles"
 PWC_RULE_ARCHETYPE_SEED_DESC: "Random mode picks an AI development style once for each city and saves it without changing geography, starting units or resources."
 PWC_RULE_ARCHETYPE_SEED_FIXED: "Fixed styles"
 PWC_RULE_ARCHETYPE_SEED_FIXED_DESC: "§YDevelopment styles§!\n - Each city keeps its preset AI development style.\n - Opening strategic preferences remain repeatable across games."
 PWC_RULE_ARCHETYPE_SEED_RANDOM: "Random each game"
 PWC_RULE_ARCHETYPE_SEED_RANDOM_DESC: "§YRandom styles§!\n - At a new game's start, pick one of each city's supported AI styles.\n - Save the result; reloading §Ydoes not reroll§! it.\n\n§YScope§!\n - Geography, starting units and resources remain unchanged."
 PWC_RULE_DEMOBILIZATION: "Peacetime law limits"
 PWC_RULE_DEMOBILIZATION_AI_ONLY: "AI only"
 PWC_RULE_DEMOBILIZATION_AI_ONLY_DESC: "§YPeacetime law limits§!\n - Applies to §YAI only§!; players are exempt.\n - While at peace and outside the demobilization grace period:\n - Conscription cap: §Y$PWC_LAW_CONSCRIPTION_L3$§!.\n - Economy cap: §Y$PWC_LAW_ECONOMY_MOBILIZATION_L3$§!.\n\n§YPostwar demobilization§!\n - Higher laws receive a §Y90-day§! grace period.\n - Higher laws may still be kept or changed during the grace period.\n - If still at peace on expiry: §Ronly higher laws return to these levels§!.\n\n§YRenewed war§!\n - §GCancels the demobilization timer§!; this rule does not disband units."
 PWC_RULE_DEMOBILIZATION_DESC: "Choose who must lower wartime conscription and economy laws after a peacetime grace period. This changes laws without disbanding divisions; renewed war cancels the demobilization timer."
 PWC_RULE_DEMOBILIZATION_OFF: "Disabled"
 PWC_RULE_DEMOBILIZATION_OFF_DESC: "§YPeacetime mobilization§!\n - §GDisable law caps and automatic demobilization§! for players and AI.\n\n§YAfter a war§!\n - This rule no longer lowers conscription or economy laws."
 PWC_RULE_DEMOBILIZATION_STANDARD: "Players and AI"
 PWC_RULE_DEMOBILIZATION_STANDARD_DESC: "§YPeacetime law limits§!\n - Applies to §Yplayers and AI§!.\n - While at peace and outside the demobilization grace period:\n - Conscription cap: §Y$PWC_LAW_CONSCRIPTION_L3$§!.\n - Economy cap: §Y$PWC_LAW_ECONOMY_MOBILIZATION_L3$§!.\n\n§YPostwar demobilization§!\n - Higher laws receive a §Y90-day§! grace period.\n - Higher laws may still be kept or changed during the grace period.\n - If still at peace on expiry: §Ronly higher laws return to these levels§!.\n\n§YRenewed war§!\n - §GCancels the demobilization timer§!; this rule does not disband units."
 PWC_RULE_FIXED: "Fixed"
 PWC_RULE_GEOGRAPHIC_SUPPLY: "Northwest supply bonus"
 PWC_RULE_GEOGRAPHIC_SUPPLY_DESC: "Whether northwest and Inner Mongolia city states keep extra local supply."
 PWC_RULE_GEOGRAPHIC_SUPPLY_KEEP: "Keep bonus"
 PWC_RULE_GEOGRAPHIC_SUPPLY_KEEP_DESC: "§YRegions§!\n - City states in Xinjiang, Qinghai, Gansu, Ningxia and Inner Mongolia.\n - §RThe neutral zone is excluded§!.\n\n§YSupply effect§!\n - Keep §Gextra local supply§! to ease pressure on troops stationed there.\n - Choosing generic city focuses also keeps this bonus."
 PWC_RULE_GEOGRAPHIC_SUPPLY_REMOVE: "Remove bonus"
 PWC_RULE_GEOGRAPHIC_SUPPLY_REMOVE_DESC: "§YRegions§!\n - City states in Xinjiang, Qinghai, Gansu, Ningxia and Inner Mongolia.\n\n§YSupply effect§!\n - §RRemove extra local supply§!; stationed troops may face more pressure.\n\n§YScope§!\n - Normal supply sources, infrastructure and physical geography remain."
 PWC_RULE_GEOGRAPHY_MODE: "City-specific focuses"
 PWC_RULE_GEOGRAPHY_MODE_CURRENT: "Keep city-specific focuses"
 PWC_RULE_GEOGRAPHY_MODE_CURRENT_DESC: "§YFocus content§!\n - Keep the §Y8§! focuses tied to the city's geographic type.\n\n§YScope§!\n - Physical geography and other opening-rule choices remain independent."
 PWC_RULE_GEOGRAPHY_MODE_DESC: "Choose the city's existing 8 geographic focuses or 8 generic city focuses; geography stays intact."
 PWC_RULE_GEOGRAPHY_MODE_GENERIC: "Use generic city focuses"
 PWC_RULE_GEOGRAPHY_MODE_GENERIC_DESC: "§YFocus content§!\n - Replace the city's §Y8§! geographic focuses with:\n - §Y8§! generic city-cooperation focuses.\n\n§YScope§!\n - Only this focus group changes.\n - Physical ports, borders and islands retain their real geography."
 PWC_RULE_GROUP_COMMON: "Common settings"
 PWC_RULE_GROUP_FIXED: "Fixed rules (locked)"
 PWC_RULE_GROUP_GEOGRAPHY: "Cities and economy"
 PWC_RULE_GROUP_MILITARY: "Army and mobilization"
 PWC_RULE_GROUP_TOOLS: "Territory and tools"
 PWC_RULE_GROUP_WAR: "War and expansion"
 PWC_RULE_INDUSTRY_CALIBRATION: "Starting factories"
 PWC_RULE_INDUSTRY_CALIBRATION_BALANCE: "Equal factories per city"
 PWC_RULE_INDUSTRY_CALIBRATION_BALANCE_DESC: "§YStarting adjustment§!\n - §RRemove§! city off-map civilian and military factories.\n - Set each city state's map factories to:\n - §Y2§! civilian and §Y1§! military factories.\n - Keep dockyards.\n\n§YTiming§!\n - Runs §Yonce§! at the start of a new game.\n\n§YOff-map factories§!\n - They contribute national production capacity without occupying a state."
 PWC_RULE_INDUSTRY_CALIBRATION_DESC: "Keep existing factories, remove only off-map civilian and military factories, or also set each city to 2 civilian and 1 military factory. Dockyards are kept."
 PWC_RULE_INDUSTRY_CALIBRATION_KEEP: "Keep city differences"
 PWC_RULE_INDUSTRY_CALIBRATION_KEEP_DESC: "§YStarting factories§!\n - Keep existing map factories.\n - Keep off-map civilian and military factories and city differences.\n\n§YOff-map factories§!\n - They contribute national production capacity without occupying a state."
 PWC_RULE_INDUSTRY_CALIBRATION_NORMALIZE: "Remove off-map factories"
 PWC_RULE_INDUSTRY_CALIBRATION_NORMALIZE_DESC: "§YStarting adjustment§!\n - §RRemove§! city off-map civilian and military factories.\n - Keep map factories and dockyards.\n\n§YTiming§!\n - Runs §Yonce§! at the start of a new game.\n - Reloading does not remove factories gained later.\n\n§YOff-map factories§!\n - They contribute national production capacity without occupying a state."
 PWC_RULE_INTEGRATION_SPEED: "Occupation / core speed"
 PWC_RULE_INTEGRATION_SPEED_DESC: "Adjust occupation law compliance growth to change how quickly occupied land becomes a core. Owned, fully controlled non-core states lose one military factory level at 80% compliance if present, and become cores at 90%."
 PWC_RULE_INTEGRATION_SPEED_FAST: "Fast"
 PWC_RULE_INTEGRATION_SPEED_FAST_DESC: "§YOccupation law§!\n - Players and AI share this law: §YFaster coring§!.\n - Extra daily compliance growth modifier: §G+0.6 percentage points§!.\n - Actual net daily growth also depends on other modifiers and high-compliance decay.\n\n§YCoring conditions§!\n - Only §Yowned, fully controlled non-core states§! qualify.\n - At §Y80%§! compliance: §Rremove one military factory level§!, if present.\n - At §Y90%§! compliance: §Gautomatically becomes a core§!.\n\n§YAvailability§!\n - This choice is §Rlocked§! after starting the game."
 PWC_RULE_INTEGRATION_SPEED_STANDARD: "Standard"
 PWC_RULE_INTEGRATION_SPEED_STANDARD_DESC: "§YOccupation law§!\n - Players and AI share this law: §YStandard speed§!.\n - Extra daily compliance growth modifier: §G+0.3 percentage points§!.\n - Actual net daily growth also depends on other modifiers and high-compliance decay.\n\n§YCoring conditions§!\n - Only §Yowned, fully controlled non-core states§! qualify.\n - At §Y80%§! compliance: §Rremove one military factory level§!, if present.\n - At §Y90%§! compliance: §Gautomatically becomes a core§!.\n\n§YAvailability§!\n - This choice is §Rlocked§! after starting the game."
 PWC_RULE_INTEGRATION_SPEED_STRICT: "Slow"
 PWC_RULE_INTEGRATION_SPEED_STRICT_DESC: "§YOccupation law§!\n - Players and AI share this law: §YSlower coring§!.\n - Extra daily compliance growth modifier: §G+0.15 percentage points§!.\n - Actual net daily growth also depends on other modifiers and high-compliance decay.\n\n§YCoring conditions§!\n - Only §Yowned, fully controlled non-core states§! qualify.\n - At §Y80%§! compliance: §Rremove one military factory level§!, if present.\n - At §Y90%§! compliance: §Gautomatically becomes a core§!.\n\n§YAvailability§!\n - This choice is §Rlocked§! after starting the game."
 PWC_RULE_OPTION_BLOCKED: "Blocked"
 PWC_RULE_PEACE_CONFERENCE: "Postwar territory"
 PWC_RULE_PEACE_CONFERENCE_DESC: "Choose automatic division of defeated cities' land or native peace conferences. Automatic settlement eliminates the defeated city; conferences may preserve its independence."
 PWC_RULE_PEACE_CONFERENCE_OFF: "Automatic (default)"
 PWC_RULE_PEACE_CONFERENCE_OFF_DESC: "§YCapitulation result§!\n - Divide the city's land automatically and §Reliminate the defeated city§!.\n - No peace conference takes place.\n\n§YAllocation order§!\n - Defeated states controlled by enemies go to their controllers.\n - Remaining land goes first to the §Ycapital controller§!.\n - Otherwise, it goes to the surviving enemy with the §Ymost state gains§!.\n - Count only states gained from the defeated city in this settlement."
 PWC_RULE_PEACE_CONFERENCE_ON: "Peace conference"
 PWC_RULE_PEACE_CONFERENCE_ON_DESC: "§YCapitulation result§!\n - Native peace conferences decide territory and survival.\n - The defeated city §Gmay remain independent§!.\n\n§YElimination condition§!\n - Only a city finally annexed and gone is §Rpermanently eliminated§!."
 PWC_RULE_PROTECTION_PERIOD: "Opening protection"
 PWC_RULE_PROTECTION_PERIOD_DAYS_180: "180 days (default)"
 PWC_RULE_PROTECTION_PERIOD_DAYS_180_DESC: "§YOpening protection§!\n - Applies to §Yplayers and AI§!.\n - Lasts §Y180 days§! from §Y1 January 2026§!.\n - City war requests are §Rblocked§! during protection.\n\n§YAfter protection§!\n - Target conditions and the chosen declaration delay still apply.\n - AI follows the selected staggered opening schedule."
 PWC_RULE_PROTECTION_PERIOD_DAYS_90: "90 days"
 PWC_RULE_PROTECTION_PERIOD_DAYS_90_DESC: "§YOpening protection§!\n - Applies to §Yplayers and AI§!.\n - Lasts §Y90 days§! from §Y1 January 2026§!.\n - City war requests are §Rblocked§! during protection.\n\n§YAfter protection§!\n - Target conditions and the chosen declaration delay still apply.\n - AI follows the selected staggered opening schedule."
 PWC_RULE_PROTECTION_PERIOD_DESC: "All cities share the same protection window from 1 January 2026."
 PWC_RULE_PROTECTION_PERIOD_NONE: "No protection"
 PWC_RULE_PROTECTION_PERIOD_NONE_DESC: "§YOpening protection§!\n - §GRemove shared protection§!.\n - Players can request wars against eligible targets from the start.\n\n§YStill active§!\n - Declaration delays and target restrictions still apply.\n - AI war timing remains active.\n - A staggered setting §Rdoes not unlock every AI city immediately§!."
 PWC_RULE_PROVINCE_PRIORITY: "Home province first"
 PWC_RULE_PROVINCE_PRIORITY_DESC: "Unite the starting province before expanding outside it. Applies to players and AI; disabled by default."
 PWC_RULE_PROVINCE_PRIORITY_OFF: "Unrestricted (default)"
 PWC_RULE_PROVINCE_PRIORITY_OFF_DESC: "§YTarget scope§!\n - Players and AI §Gneed not unite their home province first§!.\n - Eligible outside powers can be attacked.\n\n§YStill active§!\n - Protection, warnings and border/strait conditions."
 PWC_RULE_PROVINCE_PRIORITY_ON: "Unite before expanding"
 PWC_RULE_PROVINCE_PRIORITY_ON_DESC: "§YWar restriction§!\n - Until unification, players and AI §Rcannot attack outside powers§!.\n - Home powers and holders of home cities §Gremain valid targets§!.\n - Defense is unrestricted.\n\n§YUnification§!\n - Own and fully control §Yevery home city§!; cores are not required.\n - Home province follows the starting city, even after moving the capital.\n\n§YSpecial assignments§!\n - Beijing, Tianjin → §YHebei§!; Shanghai → §YJiangsu§!.\n - Chongqing → §YSichuan§!; Hong Kong, Macao → §YGuangdong§!."
 PWC_RULE_STATE_TRANSFER: "Player territory transfers"
 PWC_RULE_STATE_TRANSFER_DESC: "Enable a territory-adjustment tool for city players. It can move other players' or AI cities' land. Transferring the last state eliminates its source; preview and confirmation are required."
 PWC_RULE_STATE_TRANSFER_OFF: "Disabled"
 PWC_RULE_STATE_TRANSFER_OFF_DESC: "§YTerritory tool§!\n - The player territory-adjustment tool stays §Rdisabled§!.\n\n§YNormal territory changes§!\n - War settlements and other normal mechanisms can still transfer territory."
 PWC_RULE_STATE_TRANSFER_ON: "Allow player transfers"
 PWC_RULE_STATE_TRANSFER_ON_DESC: "§YScope§!\n - Every city player can use the territory-adjustment tool.\n - Source and recipient cities may be other players or AI.\n - Transfers are not limited to your land and §Ydo not require peace§!.\n\n§YSteps§!\n - Select a source city's states and a different recipient city.\n - §YPreview, then confirm§!.\n\n§YConditions§!\n - States must be §Yfully controlled§! by their owner.\n - §RExclude§! neutral powers and cities in or awaiting a peace conference.\n - Capitals and the last state §Gcan also be transferred§!.\n\n§YLast state§!\n - §RTransferring the last state eliminates the source city§!.\n - The recipient §Rannexes the source city's remaining troops§!."
 PWC_RULE_UNIT_LIMIT: "Division capacity"
 PWC_RULE_UNIT_LIMIT_AI_ONLY: "Limit AI only"
 PWC_RULE_UNIT_LIMIT_AI_ONLY_DESC: "§YPenalty-free capacity§!\n - Applies to §YAI only§!.\n - Base 8 divisions; §G+4§! per owned, fully controlled state.\n - Maximum capacity: §Y500 divisions§!.\n\n§YExcess penalties§!\n - A larger excess increases both penalties:\n - §RReduced organization recovery§!, up to §R25%§!.\n - §RIncreased supply use§!, up to §R25%§!.\n\n§YRecruitment§!\n - Players are §Gexempt§! and can keep recruiting.\n - Manpower, equipment and supply are still required."
 PWC_RULE_UNIT_LIMIT_DESC: "Choose who receives recovery and supply penalties above division capacity. Capacity is a penalty-free threshold, not a hard player recruitment limit."
 PWC_RULE_UNIT_LIMIT_OFF: "Disabled"
 PWC_RULE_UNIT_LIMIT_OFF_DESC: "§YDivision capacity§!\n - §GDisable capacity limits and excess penalties§! for players and AI.\n\n§YNormal requirements§!\n - Divisions still need manpower, equipment and supply."
 PWC_RULE_UNIT_LIMIT_STANDARD: "Limit players and AI"
 PWC_RULE_UNIT_LIMIT_STANDARD_DESC: "§YPenalty-free capacity§!\n - Applies to §Yplayers and AI§!.\n - Base 8 divisions; §G+4§! per owned, fully controlled state.\n - Maximum capacity: §Y500 divisions§!.\n\n§YExcess penalties§!\n - A larger excess increases both penalties:\n - §RReduced organization recovery§!, up to §R25%§!.\n - §RIncreased supply use§!, up to §R25%§!.\n\n§YRecruitment§!\n - Players §Gcan still recruit above capacity§!.\n - AI also reduces recruitment targets at capacity."
 PWC_RULE_WAR_WARNING: "War declaration delay"
 PWC_RULE_WAR_WARNING_DESC: "Choose immediate declaration or a 30-day warning for valid war requests. Expiry still requires valid conditions; protection, target and AI timing limits remain."
 PWC_RULE_WAR_WARNING_OFF: "Immediate declaration"
 PWC_RULE_WAR_WARNING_OFF_DESC: "§YImmediate declaration§!\n - Applies to §Yplayers and AI§!.\n - Valid requests §Ydeclare war immediately§!, without a 30-day warning.\n\n§YStill required§!\n - Opening protection, home-province and border/strait conditions.\n - AI must also satisfy readiness and war-timing requirements."
 PWC_RULE_WAR_WARNING_ON: "Wait 30 days"
 PWC_RULE_WAR_WARNING_ON_DESC: "§YWar warning§!\n - Applies to §Yplayers and AI§!.\n - A valid request issues a §Y30-day§! warning to the target.\n - War starts only if target conditions and AI readiness still hold at expiry.\n\n§YRestrictions§!\n - §RManual cancellation is unavailable§!.\n - Invalid targets or failed conditions §Rprevent war§!.\n - Protection and home-province restrictions still apply."
 PWC_SETUP_APPLY: "Apply"
 PWC_SETUP_APPLY_TT: "Apply these rules and return to city selection. Rules lock after Play."
 PWC_SETUP_ENTRY: "Game Setup"
 PWC_SETUP_ENTRY_TT: "Common settings: AI difficulty, occupation / core speed and opening protection. Other settings cover war, army, city economy and territory tools.\nHover an option for details. Settings lock after starting."
 PWC_SETUP_LOAD: "Load preset"
 PWC_SETUP_LOAD_TT: "Open saved rule presets. After loading, review the choices and apply them."
 PWC_SETUP_RESET: "Reset defaults"
 PWC_SETUP_RESET_TT: "Reset every opening rule to its default option."
 PWC_SETUP_SAVE: "Save preset"
 PWC_SETUP_SAVE_TT: "Name and save the current rule choices for a future new game."
 PWC_SETUP_TITLE: "Game Setup"
 PWC_TRANSFER_ALL: "All"

 PWC_STATE_OPERATIONS_SUPPLY_STAGING_CAPTION:0 "Supply Staging"
 PWC_STATE_OPERATIONS_SUPPLY_STAGING_COST:0 "15 CP"
 PWC_STATE_OPERATIONS_SUPPLY_STAGING_TOOLTIP:0 "§HSupply Staging§!\nReduce out-of-supply penalties in this state. No benefit at full supply; creates no supplies or equipment.\n\n§HState bonuses§!\nout-of-supply penalty: §G-10%§!\nTarget: a controlled or hostile state.\nOnly the issuing power's army benefits in this state.\n\nCost: §Y15 CP§!\nDuration: §Y10 days§! (immediate)\nCategory reuse: §Y30 days§!\nRequires: §YWar Reserve Administration§!\n\n§HOrder rules§!\nOne order per category.\nCategory cooldowns cover all states.\nLegacy and joint-operation locks may block orders.\nAir and naval orders remain in decisions.\nCapture keeps the remaining time.\nEnds on peace, elimination or transfer\nto a non-hostile power.\nNo refund; the cooldown continues."

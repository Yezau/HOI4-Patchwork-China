 PWC_STATE_OPERATIONS_ACTIVE:0 "§GActive here§!"
 PWC_STATE_OPERATIONS_COST_BLOCKED:0 "§RLow command power§!"
 PWC_STATE_OPERATIONS_DEEP_THRUST_CAPTION:0 "Mobile Exploitation"
 PWC_STATE_OPERATIONS_DEEP_THRUST_COST:0 "20 CP"
 PWC_STATE_OPERATIONS_DEEP_THRUST_TOOLTIP:0 "§HMobile Exploitation§!\nTrade specialized combat strength and defense for mobility after capture. Best for continued movement, not holding ground.\n\n§HState bonuses§!\narmy attack: §G+5%§!\nbreakthrough: §G+5%§!\narmy speed: §G+10%§!\narmy defence: §R-5%§!\nTarget: a hostile state.\nOnly the issuing power's army benefits in this state.\nCombat bonuses also apply to attacks into this state.\nMovement uses the unit's current state.\n\nCost: §Y20 CP§!\nDuration: §Y7 days§! (immediate)\nCategory reuse: §Y21 days§!\nRequires: §YMobile Reserves or Deep Exploitation§!\n\n§HOrder rules§!\nOne order per category.\nCategory cooldowns cover all states.\nLegacy and joint-operation locks may block orders.\nAir and naval orders remain in decisions.\nCapture keeps the remaining time.\nEnds on peace, elimination or transfer\nto a non-hostile power.\nNo refund; the cooldown continues."
 PWC_STATE_OPERATIONS_DELIBERATE_ASSAULT_CAPTION:0 "Assault Cover"
 PWC_STATE_OPERATIONS_DELIBERATE_ASSAULT_COST:0 "20 CP"
 PWC_STATE_OPERATIONS_DELIBERATE_ASSAULT_TOOLTIP:0 "§HAssault Cover§!\nCover assault troops with additional breakthrough to withstand defensive fire. Does not increase attack damage.\n\n§HState bonuses§!\nbreakthrough: §G+10%§!\nTarget: a hostile state.\nOnly the issuing power's army benefits in this state.\nCombat bonuses also apply to attacks into this state.\n\nCost: §Y20 CP§!\nDuration: §Y7 days§! (immediate)\nCategory reuse: §Y21 days§!\nRequires: §YOperational Reserve or Deliberate Breakthrough or Operational Counterstroke§!\n\n§HOrder rules§!\nOne order per category.\nCategory cooldowns cover all states.\nLegacy and joint-operation locks may block orders.\nAir and naval orders remain in decisions.\nCapture keeps the remaining time.\nEnds on peace, elimination or transfer\nto a non-hostile power.\nNo refund; the cooldown continues."
 PWC_STATE_OPERATIONS_ELASTIC_COUNTERATTACK_CAPTION:0 "Position Defense"
 PWC_STATE_OPERATIONS_ELASTIC_COUNTERATTACK_COST:0 "20 CP"
 PWC_STATE_OPERATIONS_ELASTIC_COUNTERATTACK_TOOLTIP:0 "§HPosition Defense§!\nImprove defense when holding controlled positions or consolidating captured ground. No attack or breakthrough bonus.\n\n§HState bonuses§!\narmy defence: §G+10%§!\nTarget: a controlled or hostile state.\nOnly the issuing power's army benefits in this state.\nCombat bonuses also apply to attacks into this state.\n\nCost: §Y20 CP§!\nDuration: §Y7 days§! (immediate)\nCategory reuse: §Y21 days§!\nRequires: §YDefence in Depth or Urban Fortification§!\n\n§HOrder rules§!\nOne order per category.\nCategory cooldowns cover all states.\nLegacy and joint-operation locks may block orders.\nAir and naval orders remain in decisions.\nCapture keeps the remaining time.\nEnds on peace, elimination or transfer\nto a non-hostile power.\nNo refund; the cooldown continues."
 PWC_STATE_OPERATIONS_EVACUATION_POSTS_CAPTION:0 "Field Recovery"
 PWC_STATE_OPERATIONS_EVACUATION_POSTS_COST:0 "15 CP"
 PWC_STATE_OPERATIONS_EVACUATION_POSTS_TOOLTIP:0 "§HField Recovery§!\nArrange evacuation and rotation to improve organisation recovery here. No instant recovery, extra maximum organisation or manpower.\n\n§HState bonuses§!\narmy organisation recovery: §G+10%§!\nTarget: a controlled or hostile state.\nOnly the issuing power's army benefits in this state.\nRecovery uses the unit's current state.\n\nCost: §Y15 CP§!\nDuration: §Y10 days§! (immediate)\nCategory reuse: §Y30 days§!\nRequires: §YMedical Evacuation or Operational Reserve§!\n\n§HOrder rules§!\nOne order per category.\nCategory cooldowns cover all states.\nLegacy and joint-operation locks may block orders.\nAir and naval orders remain in decisions.\nCapture keeps the remaining time.\nEnds on peace, elimination or transfer\nto a non-hostile power.\nNo refund; the cooldown continues."
 PWC_STATE_OPERATIONS_FIRE_COORDINATION_CAPTION:0 "Concentrated Fire"
 PWC_STATE_OPERATIONS_FIRE_COORDINATION_COST:0 "20 CP"
 PWC_STATE_OPERATIONS_FIRE_COORDINATION_TOOLTIP:0 "§HConcentrated Fire§!\nConcentrate observed fire to increase army attack in this state. No breakthrough or speed bonus.\n\n§HState bonuses§!\narmy attack: §G+10%§!\nTarget: a hostile state.\nOnly the issuing power's army benefits in this state.\nCombat bonuses also apply to attacks into this state.\n\nCost: §Y20 CP§!\nDuration: §Y7 days§! (immediate)\nCategory reuse: §Y21 days§!\nRequires: §YOperational Intelligence or Sensor-to-Shooter Network§!\n\n§HOrder rules§!\nOne order per category.\nCategory cooldowns cover all states.\nLegacy and joint-operation locks may block orders.\nAir and naval orders remain in decisions.\nCapture keeps the remaining time.\nEnds on peace, elimination or transfer\nto a non-hostile power.\nNo refund; the cooldown continues."

 PWC_HERITAGE_WUNU_MOUNTAIN_CITY_TT: "§HWunu Mountain City§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_wunu_mountain_city_photo£\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nSet on Wunu Mountain northeast of Huanren, its cliffs sheer on every side, the site is generally identified as Holbon, the first Koguryo capital, walled around 34 BC. It joined the World Heritage List in 2004 with the Koguryo capitals and tombs."
 PWC_HERITAGE_SHENYANG_PALACE_AND_TOMBS_TT: "§HShenyang Imperial Palace, Fuling and Zhaoling§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_shenyang_palace_and_tombs_photo£\n\n\n\n\n\n\n\n§gPalaces and Imperial Gardens§!\nBegun in 1625, the Shenyang palace served the Qing before they entered the Great Wall; building continued until 1783. Fuling to the northeast holds Nurhaci and Zhaoling to the north holds Hong Taiji. All are World Heritage sites."
 PWC_HERITAGE_YONGLING_TOMB_TT: "§HQing Yongling Tomb§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yongling_tomb_photo£\n\n\n\n\n\n\n\n\n§gTombs and Burials§!\nIn Yongling town, Xinbin county, the tomb was begun in 1598 for Nurhaci's ancestors. It ranks first of the three Shengjing tombs by seniority, though it is the smallest. It was added to the Ming and Qing imperial tombs World Heritage site in 2004."
 PWC_HERITAGE_NIUHELIANG_SITE_TT: "§HNiuheliang Hongshan Culture Site§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_niuheliang_site_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn valleys where Jianping and Lingyuan meet, Niuheliang was a ritual and burial centre of the late Hongshan culture about 5,500 to 5,000 years ago. Excavations found a goddess temple, stone cairns and altars, and dragon-shaped jades."
 PWC_HERITAGE_KOGURYO_JIAN_TT: "§HGuonei City, Wandu Mountain City and Koguryo Tombs§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_koguryo_jian_photo£\n\n\n\n\n\n\n§gArchaeological Sites§!\nGuonei City in present-day Ji'an was the second Koguryo capital, from the 3rd century to 427; Wandu Mountain City was its hillside stronghold. Some royal tombs are known for wide, pillarless ceilings. World Heritage since 2004."
 PWC_HERITAGE_JILIN_CONFUCIAN_TEMPLE_AND_ASHIHADA_TT: "§HJilin Confucian Temple and Ashihada Inscriptions§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jilin_confucian_temple_and_ashihada_photo£\n\n\n\n\n\n\n\n\n§gAcademies and Temples of Learning§!\nThe Ashihada inscriptions are two Ming carvings on a Songhua River cliff, linked to Ming shipbuilding and frontier administration in the northeast. The Jilin Confucian Temple, begun in 1736, was the first Qing Confucian temple in the northeast."
 PWC_HERITAGE_JIN_SHANGJING_TT: "§HJin Upper Capital Huining Site§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jin_shangjing_photo£\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn Acheng district of Harbin, this was the Jin dynasty capital from 1115 to 1153. The site covers about 6 square kilometres with north and south cities and an imperial city modelled on Northern Song Kaifeng; walls and palace bases survive."
 PWC_HERITAGE_YAGOU_CARVINGS_TT: "§HYagou Rock Carvings§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yagou_carvings_photo£\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nAt Yagou in Acheng district, Harbin, these Jin-era Jurchen cliff carvings show a man and a woman, the man dressed as a warrior holding a short sword. Their meaning is debated; they are physical evidence for early Jin history."
 PWC_HERITAGE_BOHAI_SHANGJING_TT: "§HBohai Upper Capital Longquan Site§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_bohai_shangjing_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn Bohai town, Ning'an, this was the Bohai kingdom capital from 755, laid out after Tang Chang'an with outer, inner and palace cities over about 16 square kilometres. The city was destroyed after the Liao conquered Bohai in 926."
 PWC_HERITAGE_BEIJING_CENTRAL_AXIS_TT: "§HBeijing Central Axis and Forbidden City§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_beijing_central_axis_photo£\n\n\n\n\n\n\n\n§gPalaces and Imperial Gardens§!\nThe Central Axis runs north to south through old Beijing, linking palaces, altars and ceremonial buildings. Begun under Yuan Dadu and completed by the Ming and Qing, it follows the ideal capital plan of the Kaogongji. The Forbidden City was the imperial palace from 1416 to 1911; the axis became World Heritage in 2024."
 PWC_HERITAGE_YUNJU_TEMPLE_STONE_SUTRAS_TT: "§HYunju Temple Stone Sutras§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yunju_temple_stone_sutras_photo£\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nYunju Temple in Fangshan, Beijing, is known for the stone sutras of Shijing Mountain and the caves that store them. Monks began carving Buddhist scriptures on stone in the Sui period, and work continued through the Tang, Liao, Jin, Yuan and Ming. The collection became one of China's largest and longest-lived stone-scripture projects, with more than fourteen thousand slabs."
 PWC_HERITAGE_JUYONGGUAN_BADALING_TT: "§HJuyong Pass and Badaling Great Wall§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_juyongguan_badaling_photo£\n\n\n\n\n\n\n§gPasses and Fortifications§!\nJuyong Pass is a famous Ming Great Wall fortress that, with nearby Badaling, guarded northwest Beijing; with Daoma and Zijing passes it formed the Inner Three Passes. The wall was built from the 3rd century BC to the Ming and became World Heritage in 1987."
 PWC_HERITAGE_DULE_TEMPLE_TT: "§HDule Temple, Jizhou§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dule_temple_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nIn Jizhou, Tianjin, Dule Temple is one of three surviving Liao-dynasty temples. Its gate and Guanyin Pavilion both date to 984 and are landmarks of Liao timber building; Liang Sicheng saw them as a bridge from Tang style to Song methods."
 PWC_HERITAGE_QIANXIANG_TEMPLE_CARVINGS_TT: "§HQianxiang Temple Carvings§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qianxiang_temple_carvings_photo£\n\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nOn the slope north of Qianxiang Temple on Mount Pan, Jizhou, these carvings date from the Tang and Liao, some as late as Yuan and Ming. They are the largest Liao stone carving group yet found and a national key cultural relic."
 PWC_HERITAGE_GRAND_CANAL_TIANJIN_TT: "§HGrand Canal, Tianjin Section§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_grand_canal_tianjin_photo£\n\n\n\n\n\n\n\n§gWaterworks and Canals§!\nAt Sanchakou in Tianjin the North and South Canals meet the Hai River; this stretch is part of the Grand Canal World Heritage site. The river junction is also regarded as the earliest birthplace of the city of Tianjin."
 PWC_HERITAGE_SHANHAIGUAN_TT: "§HShanhai Pass§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_shanhaiguan_photo£\n\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nBetween the Yan Mountains and the Bohai Sea, Shanhai Pass is the easternmost pass of the Ming Great Wall, called the First Pass Under Heaven. The present pass was built in 1381, with outer and guard forts added under Chongzhen."
 PWC_HERITAGE_ZHENGDING_OLD_TOWN_TT: "§HZhengding Historic Town§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhengding_old_town_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nZhengding Historic Town is defined by its prefectural layout, walls and dense historic buildings. Longxing, Kaiyuan, Linji, Guanghui and Tianning temples preserve layers of Buddhist, administrative and street life that developed from the Sui and Tang onward. The image shows the paifang of Zhengding Confucius Temple within the old town."
 PWC_HERITAGE_ZHAOZHOU_BRIDGE_TT: "§HZhaozhou Bridge§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhaozhou_bridge_photo£\n\n\n\n\n\n\n\n§gAncient Roads and Bridges§!\nAlso called Anji Bridge, it spans the Xiao River in Zhao county. Usually credited to the Sui craftsman Li Chun and built around 605, it is a classic open-spandrel single arch; repeated repairs, notably in the 1950s, altered parts of its form."
 PWC_HERITAGE_CHENGDE_MOUNTAIN_RESORT_TT: "§HChengde Mountain Resort and Outlying Temples§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_chengde_mountain_resort_photo£\n\n\n\n\n\n\n\n\n§gPalaces and Imperial Gardens§!\nBuilt from 1703 to 1792 as the Qing summer palace, the resort is ringed by twelve outlying temples, some in ethnic minority styles. Kangxi and Qianlong governed here and received ethnic leaders and foreign envoys."
 PWC_HERITAGE_PINGYAO_ANCIENT_CITY_TT: "§HAncient City of Pingyao§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_pingyao_ancient_city_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nFounded in the 14th century, Pingyao keeps its walls, streets, shops, houses and temples intact. From the 19th to the early 20th century it was China's financial centre; Shuanglin and Zhenguo temples outside the walls are also World Heritage."
 PWC_HERITAGE_YUNGANG_GROTTOES_TT: "§HYungang Grottoes§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yungang_grottoes_photo£\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nCarved near Datong from the mid-5th to early 6th century under the Northern Wei, Yungang has 252 caves and niches and about 51,000 statues. Cut under imperial sponsorship, its Five Caves of Tan Yao are early Buddhist masterpieces."
 PWC_HERITAGE_MOUNT_WUTAI_TT: "§HMount Wutai Temples§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_mount_wutai_photo£\n\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nMount Wutai, with five flat peaks, is the centre of Manjusri worship; temples were built here from the 1st century to the early 20th. Foguang Temple's East Hall is the highest-ranking surviving Tang timber building; Shuxiang Temple holds 500 Ming suspended sculptures."
 PWC_HERITAGE_YINGXIAN_WOODEN_PAGODA_TT: "§HYingxian Wooden Pagoda§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yingxian_wooden_pagoda_photo£\n\n\n\n\n\n\n§gTemples and Shrines§!\nThe Sakyamuni Pagoda of Fogong Temple was built in 1056 under the Liao. At 67.31 m it is the oldest and tallest surviving timber pagoda, five storeys outside with hidden mezzanines, and it has stood through earthquakes and war."
 PWC_HERITAGE_MOUNT_TAI_TT: "§HMount Tai§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_mount_tai_photo£\n\n\n\n\n\n\n\n\n§gCultural Landscapes§!\nChina's most famous sacred mountain, where the First Qin Emperor performed the Fengshan rites in 219 BC. It holds 22 temples and about 1,800 stelae and inscriptions, and emperors worshipped heaven and earth here. World Heritage since 1987."
 PWC_HERITAGE_QUFU_THREE_CONFUCIAN_SITES_TT: "§HTemple, Cemetery and Mansion of Confucius, Qufu§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qufu_three_confucian_sites_photo£\n\n\n\n\n\n\n\n§gAcademies and Temples of Learning§!\nQufu is Confucius's hometown. His temple, begun in 478 BC, has 104 buildings from the Jin to Qing; the cemetery holds him and over 100,000 descendants; the Kong mansion grew from a small house. World Heritage since 1994."
 PWC_HERITAGE_QI_GREAT_WALL_CHANGQING_TT: "§HGreat Wall of Qi, Changqing Section§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qi_great_wall_changqing_photo£\n\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nThe Great Wall of Qi was a defensive system of the Eastern Zhou state of Qi. It starts near Guangli village in Changqing, Jinan, and runs over 600 km east to the Yellow Sea at Qingdao, crossing much of Shandong."
 PWC_HERITAGE_GRAND_CANAL_NANWANG_TT: "§HNanwang Water-Division Hub of the Grand Canal§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_grand_canal_nanwang_photo£\n\n\n\n\n\n\n§gWaterworks and Canals§!\nThe Nanwang water-division hub in Wenshang, Shandong, solved the problem of water supply and north–south diversion on the Shandong section of the Grand Canal. Under the Ming, Dai Village Dam stored Wen River water and the Nanwang division regulated levels with reservoirs, sluices and dams to keep grain transport moving. The image is a diagram of the system."
 PWC_HERITAGE_GRAND_CANAL_TAIERZHUANG_TT: "§HGrand Canal, Taierzhuang Section§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_grand_canal_taierzhuang_photo£\n\n\n\n\n\n\n§gWaterworks and Canals§!\nThe Taierzhuang stretch of the Middle Canal is one component of the Grand Canal World Heritage site. The canal was first built as a unified grain transport route under the Sui in the 7th century, linking five major river systems including the Yellow River and the Yangtze."
 PWC_HERITAGE_YINXU_TT: "§HYin Xu§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yinxu_photo£\n\n\n\n\n\n\n§gArchaeological Sites§!\nOn both banks of the Huan River at Anyang, Yin Xu was the late Shang capital for 255 years after King Pan Geng moved here around 1300 BC. It includes palace and royal tomb areas; its oracle bones carry one of the world's oldest scripts."
 PWC_HERITAGE_LONGMEN_GROTTOES_TT: "§HLongmen Grottoes§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_longmen_grottoes_photo£\n\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nOn both banks of the Yi River south of Luoyang, a 1 km cliff holds over 2,300 caves and niches and nearly 110,000 Buddhas, carved mainly from the late 5th to mid-8th century; the Tang giant Buddha of Fengxiansi is the peak of royal cave art."
 PWC_HERITAGE_DENGFENG_CENTRE_OF_HEAVEN_AND_EARTH_TT: "§HHistoric Monuments of Dengfeng§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dengfeng_centre_of_heaven_and_earth_photo£\n\n\n\n\n\n\n§gTemples and Shrines§!\nAt the foot of Mount Song, eight groups of monuments, including three Han que gates, Zhongyue Temple, Songyue Pagoda, Shaolin Temple, Songyang Academy and the Observatory, were built over nine dynasties around the idea of the centre of heaven and earth. World Heritage since 2010."
 PWC_HERITAGE_WHITE_HORSE_TEMPLE_TT: "§HWhite Horse Temple§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_white_horse_temple_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nEast of old Luoyang, White Horse Temple was founded in 68 AD under the Eastern Han and is regarded as the first Buddhist temple built in China, the source and ancestral court of Chinese Buddhism. It keeps Yuan-era dry-lacquer statues."
 PWC_HERITAGE_GUANGFULIN_SITE_TT: "§HGuangfulin Site§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_guangfulin_site_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn Songjiang, Shanghai, Guangfulin is a site of about 4,000 to 2,500 years ago, found by local residents in 1958. One of its cultural layers gave its name to the Guangfulin culture; it became a national key cultural relic in 2013."
 PWC_HERITAGE_QINGLONG_TOWN_SITE_TT: "§HQinglong Town Site§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qinglong_town_site_photo£\n\n\n\n\n\n\n\n\n§gPorts and Maritime Sites§!\nThe Qinglong Town Site in Qingpu, Shanghai, was a Tang and Song port and transport node on the lower Wusong River. Archaeology has found ceramics from several kiln centres, shipping traces and the foundation of Longping Temple Pagoda, evidence of Jiangnan water transport and maritime exchange. The site entered the national protected-heritage list in 2019."
 PWC_HERITAGE_ZHUJIAJIAO_TOWN_TT: "§HZhujiajiao Ancient Town§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhujiajiao_canal_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nZhujiajiao in Qingpu, Shanghai, is shaped by canals, bridges and streets that follow the water. Its protected historic area retains traditional houses, commercial lanes and links to boat transport, showing the spatial character of a Jiangnan water town. The image is a canal view in the old quarter."
 PWC_HERITAGE_SONGJIANG_SQUARE_PAGODA_TT: "§HSongjiang Square Pagoda§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_songjiang_fangta_photo£\n\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nSongjiang Square Pagoda is the Xingshengjiao Temple Pagoda in Fangta Park, Shanghai. Built during the Northern Song between 1068 and 1094, it is a nine-storey square brick-and-timber pagoda set among the remains of a temple compound. It entered the fourth national protected-heritage batch in 1996."
 PWC_HERITAGE_SUZHOU_CLASSICAL_GARDENS_TT: "§HClassical Gardens of Suzhou§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_suzhou_classical_gardens_photo£\n\n\n\n\n\n\n\n§gPalaces and Imperial Gardens§!\nNine Suzhou gardens are World Heritage, among them the Humble Administrator's Garden, Lingering Garden, Master of the Nets Garden, Canglang Pavilion and Lion Grove. The oldest, Canglang Pavilion, dates to the early 11th century; the gardens recreate nature in miniature."
 PWC_HERITAGE_YANGZHOU_CANAL_AND_SALT_TT: "§HYangzhou Canal and Salt Merchant Heritage§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yangzhou_canal_and_salt_photo£\n\n\n\n\n\n\n\n\n§gWaterworks and Canals§!\nThe Yangzhou stretch of the Huaiyang Canal forms part of the Grand Canal World Heritage site; salt merchants built gardens along the city moat. The image shows the canal above Ge Garden, covering both components."
 PWC_HERITAGE_QINGKOU_HYDRAULIC_HUB_TT: "§HQingkou Waterworks Hub§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qingkou_hydraulic_hub_photo£\n\n\n\n\n\n\n§gWaterworks and Canals§!\nQingkou in Huai'an, Jiangsu, is an ancient water-management node where the Yellow River, Huai River and Grand Canal met. Dams, sluices, embankments and feeder channels controlled the three waters, protected grain transport and limited Yellow River silt. The Qing-period system worked with Hongze Lake, Gaojiayan and Huai'an's canal network; the image is a present-day aerial view."
 PWC_HERITAGE_MING_XIAOLING_TT: "§HMing Xiaoling Mausoleum§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_ming_xiaoling_photo£\n\n\n\n\n\n\n\n§gTombs and Burials§!\nOn Purple Mountain in Nanjing, Xiaoling is the joint tomb of the first Ming emperor, Zhu Yuanzhang, and Empress Ma. It set the basic plan for Ming and Qing imperial tombs later built in Beijing, Hubei and Liaoning. World Heritage since 2003."
 PWC_HERITAGE_LIANGZHU_ANCIENT_CITY_TT: "§HArchaeological Ruins of Liangzhu City§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_liangzhu_ancient_city_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn Yuhang, Hangzhou, Liangzhu dates to about 3300-2300 BC. A city site, an outer water-management system and graded cemeteries yield many ritual jades; it represents an early regional state in the Yangtze basin."
 PWC_HERITAGE_WEST_LAKE_TT: "§HWest Lake Cultural Landscape§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_west_lake_photo£\n\n\n\n\n\n\n\n§gCultural Landscapes§!\nHills surround West Lake on three sides and the city lies on the fourth. Its two causeways and three islands grew from dredging between the 9th and 12th centuries. The Ten Scenes named since the Southern Song shaped garden design in China, Japan and Korea. World Heritage since 2011."
 PWC_HERITAGE_GRAND_CANAL_HANGZHOU_TT: "§HHangzhou Section of the Grand Canal§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_grand_canal_hangzhou_photo£\n\n\n\n\n\n\n\n\n§gWaterworks and Canals§!\nThe Hangzhou section forms the southern end of the Grand Canal system, linking the Beijing-Hangzhou route with the Qiantang water network. Bridges, storehouses, historic districts and transport traces survive along it. The Grand Canal became World Heritage in 2014, and Hangzhou is one section of that single serial property."
 PWC_HERITAGE_LONGQUAN_KILNS_TT: "§HLongquan Kiln Sites§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_longquan_kilns_photo£\n\n\n\n\n\n\n\n\n§gKiln Sites§!\nThe Longquan kiln sites around Dayao and Jincun in Longquan, Lishui, began in the Five Dynasties and Northern Song and flourished under the Yuan and Ming. Kilns, saggars, sherd deposits and workshops reveal a complete celadon industry; the image shows Fengdongyan kiln remains from above."
 PWC_HERITAGE_XIDI_HONGCUN_TT: "§HXidi and Hongcun§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_xidi_hongcun_photo£\n\n\n\n\n\n\n\n§gTraditional Villages§!\nIn Yi county, Huangshan, the two villages keep the layout, buildings and decoration of Huizhou villages from the 14th to 20th centuries. Most were built by officials and merchants returning home; Hongcun lies by a stream with its Moon Pond."
 PWC_HERITAGE_HUIZHOU_OLD_TOWN_AND_TANGYUE_TT: "§HHuizhou Old Town and Tangyue Memorial Archways§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_huizhou_old_town_and_tangyue_photo£\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nShe county, set up under the Qin, long led the Huizhou prefecture and became a national historic city in 1986. Tangyue village's seven memorial archways date from the Ming Yongle to Qing Jiaqing reigns; one honours salt merchant Bao Shufang and his son for their donations."
 PWC_HERITAGE_SHOUXIAN_CITY_WALL_TT: "§HShouxian City Wall§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_shouxian_city_wall_photo£\n\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nIn Shou county, Huainan, this is one of China's well-preserved ancient city walls, with all four gates and barbicans intact. A military stronghold prone to Huai River floods, the town was often repaired; the present wall was rebuilt under the Southern Song."
 PWC_HERITAGE_QUANZHOU_MARITIME_HERITAGE_TT: "§HQuanzhou: Emporium of the Song-Yuan World§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_quanzhou_maritime_heritage_photo£\n\n\n\n\n\n\n\n\n§gPorts and Maritime Sites§!\nIn the Song and Yuan, from the 10th to 14th centuries, Quanzhou was a world port, known in Arabic texts as Zayton. Its heritage includes Qingjing Mosque, Islamic tombs, stone docks, kilns, iron works, bridges and pagodas. World Heritage since 2021."
 PWC_HERITAGE_FUJIAN_TULOU_YONGDING_TT: "§HFujian Tulou, Yongding§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_fujian_tulou_yongding_photo£\n\n\n\n\n\n\n\n\n§gTraditional Villages§!\nFujian tulou are rammed-earth buildings, round or square, with a single entrance, built for both living and defence. They cluster in Yongding of Longyan and in Nanjing and Hua'an of Zhangzhou; 46 were inscribed as World Heritage in 2008."
 PWC_HERITAGE_FUJIAN_TULOU_ZHANGZHOU_TT: "§HFujian Tulou, Nanjing and Hua'an§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_fujian_tulou_zhangzhou_photo£\n\n\n\n\n\n\n\n\n§gTraditional Villages§!\nA tulou can house hundreds of people from a single clan, each family holding two or three rooms per floor in a vertical share, behind thick outer walls and finely decorated interiors. 46 tulou in Longyan and Zhangzhou became World Heritage in 2008."
 PWC_HERITAGE_CHENGCUN_HAN_CITY_TT: "§HChengcun Han City Site, Mount Wuyi§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_chengcun_han_city_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nAt Chengcun in Xingtian, Wuyishan, this is a Han-dynasty walled city whose builders are still debated; it is also called the Minyue royal city. It was inscribed in 1999 as part of the Mount Wuyi World Heritage site."
 PWC_HERITAGE_FUZHOU_THREE_LANES_SEVEN_ALLEYS_TT: "§HThree Lanes and Seven Alleys, Fuzhou§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_fuzhou_three_lanes_seven_alleys_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nIn Gulou, Fuzhou, three lanes lie west and seven alleys east of Nanhou Street, a well-preserved ward district called a museum of Ming and Qing architecture. It is a national key cultural relic and on the World Heritage Tentative List."
 PWC_HERITAGE_TAMSUI_FORT_SANTO_DOMINGO_TT: "§HFort San Domingo and Tamsui Estuary§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tamsui_fort_santo_domingo_photo£\n\n\n\n\n\n\n\n\n§gPorts and Maritime Sites§!\nIn Tamsui, New Taipei, the Spanish built Fort Santo Domingo in 1628; the Dutch rebuilt it nearby in 1644, and locals called it the Red-hair Fort after the Dutch. In 1724 Qing officials repaired it and added outer gates."
 PWC_HERITAGE_ANPING_FORT_TT: "§HAnping Fort§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_anping_fort_photo£\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nAnping Fort was Fort Zeelandia of the Dutch East India Company, rebuilt on site in 1624 and finished in 1634. The oldest fortress in Taiwan, it was the seat of Dutch and later Ming-Zheng rule; parts of its walls remain."
 PWC_HERITAGE_LUKANG_OLD_STREET_TT: "§HLukang Old Streets and Longshan Temple§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_lukang_longshan_temple_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nLongshan Temple was a major religious building in the Qing-period port town of Lukang. Its predecessor is traditionally dated to 1653, while the surviving complex follows a three-court plan with a gate, opera stage, main hall and rear hall. The surrounding old streets retain shop houses and spaces shaped by trade, lineage and popular belief."
 PWC_HERITAGE_KINMEN_SETTLEMENTS_TT: "§HTraditional Settlements of Kinmen§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_kinmen_shuitou_village_photo£\n\n\n\n\n\n\n\n\n§gTraditional Villages§!\nKinmen's traditional settlements are represented by villages such as Shuitou and Zhushan, where Fujian courtyard houses stand beside overseas-Chinese villas. Homes, ancestral halls and temples built by returning merchants preserve evidence of lineage organisation and island migration; the image uses Shuitou as its example."
 PWC_HERITAGE_WUDANG_MOUNTAINS_TT: "§HAncient Buildings in the Wudang Mountains§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_wudang_mountains_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nWudang became a Taoist centre in the early Tang and was built up on a grand scale under the Ming Yongle emperor. 53 buildings and 9 sites survive, including the ancient bronze shrine cast in 1307 and the stone-walled Forbidden City of 1419."
 PWC_HERITAGE_JINGZHOU_CITY_WALL_TT: "§HJingzhou City Wall§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jingzhou_city_wall_photo£\n\n\n\n\n\n\n§gPasses and Fortifications§!\nJingzhou's surviving brick wall was built under the Ming: 3.75 km east to west, 1.2 km north to south, 11.28 km around and 9 m high. It remains largely intact and is on the World Heritage Tentative List among Ming and Qing city walls."
 PWC_HERITAGE_GULONGZHONG_TT: "§HGulongzhong§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_gulongzhong_photo£\n\n\n\n\n\n\n\n\n§gCultural Landscapes§!\nIn Xiangyang, Hubei, Gulongzhong is a group of Ming and Qing buildings. It was listed by Hubei in 1956 as the Longzhong former residence of Zhuge Liang and became a national key cultural relic in 1996."
 PWC_HERITAGE_MING_XIANLING_TT: "§HMing Xianling Mausoleum§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_ming_xianling_photo£\n\n\n\n\n\n\n\n\n§gTombs and Burials§!\nIn Zhongxiang, Hubei, Xianling holds the parents of the Jiajing emperor and is the largest single Ming imperial tomb. Its one-tomb, two-mound layout and dragon-shaped spirit way are unique among Ming tombs. World Heritage since 2000."
 PWC_HERITAGE_YUELU_ACADEMY_TT: "§HYuelu Academy§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yuelu_academy_photo£\n\n\n\n\n\n\n\n\n§gAcademies and Temples of Learning§!\nAt the eastern foot of Yuelu Mountain in Changsha, the academy was founded in 976 under the Northern Song and is one of China's four great ancient academies. It became Hunan High School in 1903 and is still part of Hunan University."
 PWC_HERITAGE_FENGHUANG_OLD_TOWN_TT: "§HFenghuang Old Town§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_fenghuang_old_town_photo£\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nIn Tuojiang town, Fenghuang county, the town was the Wuzhai garrison city under the Ming and Qing, a southwestern transport hub and seat of the Zhengan commander. Early Qing called it a frontier fort of 6,000 residents and 8,000 soldiers; trade boomed under Qianlong."
 PWC_HERITAGE_TONGGUAN_KILNS_TT: "§HChangsha Tongguan Kiln Site§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tongguan_kilns_photo£\n\n\n\n\n\n\n\n\n§gKiln Sites§!\nIn Wangcheng, Changsha, this was a southern folk kiln of the Tang and Five Dynasties, founded in the mid-Tang and busiest in the late Tang. Its many underglaze-painted wares are seen as the origin of underglaze decoration; national key relic since 1988."
 PWC_HERITAGE_YUEYANG_TOWER_TT: "§HYueyang Tower§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yueyang_tower_photo£\n\n\n\n\n\n\n\n\n§gCultural Landscapes§!\nAbove the west gate of old Yueyang, overlooking Dongting Lake, the tower is famed through Fan Zhongyan's essay. Said to descend from Lu Su's troop-review tower, it took its name in the mid-Tang and is the only one of the three great southern towers still in original form."
 PWC_HERITAGE_LUSHAN_BAILUDONG_ACADEMY_TT: "§HMount Lu and White Deer Grotto Academy§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_lushan_bailudong_academy_photo£\n\n\n\n\n\n\n\n§gAcademies and Temples of Learning§!\nMount Lu, with the Yangtze to the north and Poyang Lake to the south, has over 200 historic buildings. The White Deer Grotto Academy was founded in 940; in the Southern Song Zhu Xi rebuilt it, taught there and set its rules."
 PWC_HERITAGE_JINGDEZHEN_IMPERIAL_KILNS_TT: "§HJingdezhen Porcelain Industry Sites§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jingdezhen_imperial_kilns_photo£\n\n\n\n\n\n\n\n\n§gKiln Sites§!\nThe sites trace Jingdezhen's porcelain system from the 10th to 19th centuries, including imperial and civilian kilns, the Hutian kiln site and the Gaoling clay mine. The kaolin binary formula and blue-and-white ware made it the world's porcelain centre. World Heritage since 2026."
 PWC_HERITAGE_LONGHU_MOUNTAIN_TT: "§HLonghu Mountain Taoist Sites and Cliff Tombs§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_longhu_mountain_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nIn Guixi, Jiangxi, Longhu's danxia peaks are part of the China Danxia World Heritage site. It is the ancestral seat of Zhengyi Taoism with the Celestial Master's Mansion; cliff coffins of the ancient Yue over 2,000 years old are a national key relic."
 PWC_HERITAGE_TENGWANG_PAVILION_TT: "§HTengwang Pavilion§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tengwang_pavilion_photo£\n\n\n\n\n\n\n\n§gCultural Landscapes§!\nOn the east bank of the Gan River in Nanchang, it ranks with Yueyang Tower and Yellow Crane Tower as a great southern tower. Destroyed and rebuilt many times, the present pavilion was rebuilt on the old site in 1989 from sketches by Liang Sicheng."
 PWC_HERITAGE_NANYUE_PALACE_AND_TOMB_TT: "§HNanyue Palace Site and Tomb of the Nanyue King§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_nanyue_palace_and_tomb_photo£\n\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn Yuexiu, Guangzhou, the palace site reveals Nanyue palace and garden remains and Southern Han halls. The tomb on Xianggang Hill holds Zhao Mo, second Nanyue king, with his golden imperial seal; it is the largest tomb yet found in Lingnan."
 PWC_HERITAGE_NANHAI_GOD_TEMPLE_TT: "§HTemple of the South Sea God§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_nanhai_god_temple_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nAlso called Boluo Temple, in Huangpu, Guangzhou, it was founded in the Sui Kaihuang era for imperial worship of the South Sea god. It is the only one of the four sea god temples fully preserved; national key relic since 2013."
 PWC_HERITAGE_HUAISHENG_LIGHTHOUSE_MINARET_TT: "§HHuaisheng Mosque Lighthouse Minaret§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_huaisheng_lighthouse_minaret_photo£\n\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nOn Guangta Road in Yuexiu, Guangzhou, Huaisheng Mosque dates from the Tang and is among the oldest surviving mosques in China. Its minaret stood near the Pearl River, and its night light guided ships, hence the name Light Pagoda."
 PWC_HERITAGE_CHAOZHOU_OLD_TOWN_TT: "§HChaozhou Old Town and Guangji Bridge§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_chaozhou_guangji_bridge_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nChaozhou Old Town grew beside the Han River. Guangji Bridge outside the eastern gate of Xiangqiao was begun in 1171 under the Southern Song and rebuilt many times. Its stone piers, fixed spans and detachable boat bridge record the river transport that connected the prefectural city."
 PWC_HERITAGE_LINGQU_CANAL_TT: "§HLingqu Canal§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_lingqu_canal_photo£\n\n\n\n\n\n\n\n§gWaterworks and Canals§!\nIn Xing'an county, Guilin, Lingqu was dug under the Qin to join the Xiang River of the Yangtze system with the Li River of the Pearl system. One of the oldest known canals, it long linked Lingnan with the Central Plains; listed as world irrigation heritage in 2018."
 PWC_HERITAGE_ZUOJIANG_HUASHAN_ROCK_ART_TT: "§HZuojiang Huashan Rock Art§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zuojiang_huashan_rock_art_photo£\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nOn cliffs along the Zuojiang and Mingjiang rivers, 38 rock art sites painted by the Luoyue people from the 5th century BC to the 2nd century AD depict rituals tied to bronze drum culture. World Heritage since 2016."
 PWC_HERITAGE_HEPU_HAN_TOMBS_AND_PORT_TT: "§HHepu Han Tombs and Ancient Port§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_hepu_han_tombs_and_port_photo£\n\n\n\n\n\n\n\n\n§gPorts and Maritime Sites§!\nThe Hepu Han Tombs and Ancient Port in Hepu, Beihai, were used from the Western to Eastern Han. Tomb clusters and the harbor together document Hepu's role at the beginning of the Maritime Silk Road. The image is a museum distribution map of the tombs; the entry also covers the ancient port."
 PWC_HERITAGE_HUANGYAO_OLD_TOWN_TT: "§HHuangyao Old Town§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_huangyao_old_town_photo£\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nIn Zhaoping county, Hezhou, Huangyao is a town of nearly a thousand years: founded in the Song, built up under Ming Wanli and at its height under Qing Qianlong. Ringed by hills and isolated, it keeps many Ming and Qing buildings, stages and ancestral halls."
 PWC_HERITAGE_YAZHOU_OLD_TOWN_TT: "§HYazhou Old Town and School Temple§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yazhou_old_town_photo£\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nThe Yazhou wall enclosed the old prefectural seat; the south gate and part of the north wall remain. Inside, the Yacheng school temple was founded in the Northern Song; its present buildings were rebuilt after moving here in the Qing Daoguang era."
 PWC_HERITAGE_DONGPO_ACADEMY_TT: "§HDongpo Academy§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dongpo_academy_photo£\n\n\n\n\n\n\n\n§gAcademies and Temples of Learning§!\nEast of Zhonghe town in Danzhou, the academy stands on the site of Su Shi's residence. Rebuilt in the Ming and Qing, destroyed with its relics during the Cultural Revolution and rebuilt in 1982, it now serves as an exhibition hall."
 PWC_HERITAGE_LI_BOAT_SHAPED_HOUSES_TT: "§HLi Boat-shaped House Villages§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_li_boat_shaped_houses_photo£\n\n\n\n\n\n\n§gTraditional Villages§!\nBoat-shaped houses are traditional Li dwellings in Hainan. Baicha village is one of the representative villages in the Tentative List property of Hainan's rainforest and Li settlements; Ming and Qing picture scrolls already recorded such villages."
 PWC_HERITAGE_PING_SHAN_HERITAGE_TRAIL_TT: "§HPing Shan Heritage Trail and Tsui Sing Lau Pagoda§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_ping_shan_heritage_trail_photo£\n\n\n\n\n\n\n\n\n§gTraditional Villages§!\nHong Kong's first heritage trail opened in 1993, linking the Tang clan's ancestral halls, study halls, temples and walled villages at Ping Shan. Its Tsui Sing Lau was built by the seventh-generation ancestor Tang Yin-tung and is Hong Kong's only ancient pagoda."
 PWC_HERITAGE_WALLED_VILLAGES_LUNG_YEUK_TAU_KAM_TIN_TT: "§HLung Yeuk Tau and Kam Tin Walled Villages§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_walled_villages_lung_yeuk_tau_kam_tin_photo£\n\n\n\n\n\n\n\n§gTraditional Villages§!\nThe Lung Yeuk Tau Tang clan, from Jishui in Jiangxi, moved from Kam Tin at the end of the Yuan and grew into five walled villages and six villages, including Lo Wai, Ma Wat Wai and Wing Ning Wai. Kam Tin, also a Tang seat, is known for Kat Hing Wai."
 PWC_HERITAGE_TUNG_LUNG_FORT_TT: "§HTung Lung Fort§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tung_lung_fort_photo£\n\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nAt the northeast tip of Tung Lung Chau overlooking Fat Tong Mun, the fort was built in the Kangxi reign against pirates, per the Xin'an gazetteer; another record credits Viceroy Yang Lin, 1719-1724. It had 15 guardhouses and 8 cannons."
 PWC_HERITAGE_HISTORIC_CENTRE_OF_MACAO_TT: "§HHistoric Centre of Macao§!\n\n\n\n£PWC_HERITAGE_ART_historic_centre_of_macao_photo£\n\n\n\n§gHistoric Towns and Districts§!\nThe Historic Centre of Macao has 22 principal buildings and public squares that witness East-West exchange in trade, religion, architecture and technology since the mid-16th century, including the oldest lighthouse in China. World Heritage since 2005."
 PWC_HERITAGE_MACAO_A_MA_TEMPLE_AND_RUINS_TT: "§HA-Ma Temple, Ruins of St. Paul's and Mount Fortress§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_macao_a_ma_temple_photo£\n\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nA-Ma Temple, the Ruins of St. Paul's and Mount Fortress stand on the Macau peninsula within the Historic Centre of Macao. The temple preserves a maritime Mazu tradition, the ruins retain the stone facade of St. Paul's, and the fortress records early coastal defence and the meeting of Chinese and European communities."
 PWC_HERITAGE_DUJIANGYAN_AND_QINGCHENG_TT: "§HDujiangyan and Mount Qingcheng§!\n\n\n\n\n\n£PWC_HERITAGE_ART_dujiangyan_and_qingcheng_photo£\n\n\n\n\n\n§gWaterworks and Canals§!\nBuilt around 256 BC, Dujiangyan divides the Min River without a dam using the Fish Mouth, Flying Sand Weir and Bottle Neck, and still waters the Chengdu plain. Nearby Mount Qingcheng is a birthplace of Taoism; both became World Heritage in 2000."
 PWC_HERITAGE_SANXINGDUI_SITE_TT: "§HSanxingdui Site§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_sanxingdui_site_photo£\n\n\n\n\n\n\n§gArchaeological Sites§!\nBy the Yazi River in Sanxingdui town, Guanghan, the site dates to about 2800-1100 BC and represents the bronze civilisation of ancient Shu, showing that early Sichuan was highly developed. It is on the Tentative List together with Jinsha."
 PWC_HERITAGE_JINSHA_SITE_TT: "§HJinsha Site§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jinsha_site_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn Qingyang, Chengdu, Jinsha was found in 2001 and covers over 5 square kilometres. Dated to about 1250-650 BC, it marks a shift of the ancient Shu political centre and is on the Tentative List together with Sanxingdui."
 PWC_HERITAGE_JIANMEN_SHU_ROAD_TT: "§HJianmen Pass on the Shu Roads§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jianmen_shu_road_photo£\n\n\n\n\n\n\n\n\n§gAncient Roads and Bridges§!\nJianmen Pass in Jiange county, Guangyuan, is an ancient pass ranked with Yanmen, Hangu and Xianxia among the four great passes, famed as the most perilous under heaven. The Jinniu branch of the Shu Roads left Sichuan through Guangyuan over the Jianmen ranges."
 PWC_HERITAGE_DAZU_ROCK_CARVINGS_TT: "§HDazu Rock Carvings§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dazu_rock_carvings_photo£\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nCarved on five cliffs in Dazu, Chongqing, from the 9th to 13th centuries, Beishan holds over 10,000 figures, Shizhuanshan rarely sets Buddhist, Taoist and Confucian images side by side, and Baodingshan crowns Tantric carving. World Heritage since 1999."
 PWC_HERITAGE_DIAOYU_FORTRESS_TT: "§HDiaoyu Fortress§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_diaoyu_fortress_photo£\n\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nOn Diaoyu Hill south of the Jialing River in Hechuan, it was a Southern Song mountain fortress against the Mongols. In 1259 its garrison held out and the Great Khan Mongke died during the campaign; it is called China's best-preserved ancient battlefield."
 PWC_HERITAGE_BAIDI_CITY_TT: "§HBaidi City§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_baidi_city_photo£\n\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nOn the north bank of the Yangtze at the mouth of Qutang Gorge in Fengjie, Baidi faces the gorge with high cliffs behind. Besides the Ming-Qing Baidi Temple it holds sites from the Stone Age to the Qing; national key relic since 2006."
 PWC_HERITAGE_LIJIANG_OLD_TOWN_TT: "§HOld Town of Lijiang§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_lijiang_old_town_photo£\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nAt 2,400 m, Lijiang comprises Dayan old town, Baisha and Shuhe. Dayan grew as a commercial centre under the Ming; its houses blend Han and Tibetan elements in the Naxi tradition, and its ancient water network still works."
 PWC_HERITAGE_HONGHE_HANI_TERRACES_TT: "§HHonghe Hani Rice Terraces§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_honghe_hani_terraces_photo£\n\n\n\n\n\n\n\n§gCultural Landscapes§!\nOn the Ailao slopes south of the Hong River, the Hani carved terraces over 1,300 years, watered from the forests above, with buffalo, ducks and fish farmed alongside red rice. Most of the 82 villages have mushroom-shaped houses."
 PWC_HERITAGE_DALI_THREE_PAGODAS_TT: "§HThree Pagodas of Chongsheng Temple, Dali§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dali_three_pagodas_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nNorthwest of old Dali, the three brick pagodas date from the late Nanzhao. The main Qianxun Pagoda has dense eaves and the two smaller ones are pavilion-style. Repaired under the Ming and Qing, they yielded many relics in the 1978-1981 restoration."
 PWC_HERITAGE_JIANSHUI_OLD_TOWN_TT: "§HJianshui Old Town§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jianshui_old_city_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nKnown historically as Lin'an, Jianshui Old Town in Honghe, Yunnan, preserves a southern Yunnan prefectural layout of lanes, gates, the Confucian temple and traditional houses. Trade and examination culture from the Ming and Qing left guild halls, ancestral buildings and schools; everyday old-town life remains around Chaoyang Gate."
 PWC_HERITAGE_SHAXI_OLD_TOWN_TT: "§HShaxi Ancient Town§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_shaxi_old_theatre_photo£\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nShaxi in Jianchuan, Dali, Yunnan, grew as a relay town on the Tea Horse Road. Sideng Street, its old stage, Xingjiao Temple and merchant courtyards preserve the historic layout, showing links among mountain transport, Bai communities and long-distance trade in western Yunnan."
 PWC_HERITAGE_HAILONGTUN_TT: "§HHailongtun Tusi Fortress§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_hailongtun_photo£\n\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nOn Longyan Mountain in Huichuan, Zunyi, Hailongtun was the fortress of the Yang tusi of Bozhou, who ruled for 27 generations until it fell in the 1600 campaign. It became World Heritage in 2015 as part of the Tusi Sites."
 PWC_HERITAGE_ZHENYUAN_OLD_TOWN_TT: "§HZhenyuan Ancient Town§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhenyuan_ancient_town_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nZhenyuan Ancient Town stands beside the Wuyang River in Guizhou's Qiandongnan region. Walls, lanes, guild halls and houses follow the water and the slopes. Its surviving Ming and Qing layout records the meeting of mountain-town life, many ethnic communities and trade routes in southeast Guizhou."
 PWC_HERITAGE_QINGYAN_OLD_TOWN_TT: "§HQingyan Old Town§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qingyan_old_town_photo£\n\n\n\n\n\n\n\n\n§gHistoric Towns and Districts§!\nIn Huaxi, Guiyang, Qingyan was founded in 1378 under the Ming as a military post. Ming and Qing buildings crowd the town with carved temples and towers; it is one of Guizhou's four great old towns and a national historic town."
 PWC_HERITAGE_BAOJIATUN_WATERWORKS_TT: "§HBaojiatun Ancient Waterworks§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_baojiatun_waterworks_photo£\n\n\n\n\n\n\n\n§gWaterworks and Canals§!\nBaotun in Daxiqiao, Xixiu district, Anshun, is a garrison village settled by soldier farmers after the early Ming southern campaign. Its Ming weir and fish-mouth divider still irrigate the fields after more than 600 years."
 PWC_HERITAGE_XANADU_SITE_TT: "§HSite of Xanadu§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_xanadu_site_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn Zhenglan banner, Xilingol, Xanadu was planned in 1256 by Kublai Khan's adviser Liu Bingzhong, served as Yuan capital from 1263 to 1273 and then as summer capital. Its palace, imperial and outer cities show nomadic and farming cultures fused."
 PWC_HERITAGE_JUYAN_SITE_TT: "§HJuyan Sites and Han Slips§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_juyan_site_photo£\n\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nThe Juyan sites along the lower Ejin River preserve Han frontier garrisons, beacon lines and administrative routes. Excavated wooden slips record military orders, grain accounts and correspondence. The image shows two Juyan slips held by the Inner Mongolia Museum, rather than the desert ruins themselves."
 PWC_HERITAGE_QIN_STRAIGHT_ROAD_TT: "§HQin Straight Road§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qin_straight_road_photo£\n\n\n\n\n\n\n\n§gAncient Roads and Bridges§!\nBegun in 212 BC, the Straight Road was a Qin trunk highway. Its confirmed Inner Mongolian stretch runs from Dalad banner across the central Ordos plateau to Ejin Horo, cutting through hills and filling valleys."
 PWC_HERITAGE_YILIN_POST_STATION_TT: "§HYilin Post Station Site§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yilin_post_station_photo£\n\n\n\n\n\n\n\n\n§gAncient Roads and Bridges§!\nThe Yilin Post Station Site lies about nine kilometres northeast of central Erenhot on the northwest slope of Yanchi. Covering roughly 1,600 square metres, it was a station on the Zhangjiakou–Erenhot–Kulun tea route. The remains record Qing-era courier travel, caravan trade and transport between northern China and Mongolia."
 PWC_HERITAGE_DAZHAO_TEMPLE_TT: "§HDazhao Temple§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dazhao_temple_photo£\n\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nDazhao Temple in Yuquan, Hohhot, was founded during the Ming Wanli reign and became an important Tibetan Buddhist monastery in Mongolia. Its silver Buddha, dragon carvings and murals reflect religious and commercial exchange in a steppe city, while much of the surviving complex was repaired in later periods."
 PWC_HERITAGE_WEIYANG_PALACE_TT: "§HWeiyang Palace Site of Han Chang'an§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_weiyang_palace_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nWeiyang was the main palace of Han Chang'an, built from 200 BC under Xiao He and long the emperor's residence and seat of government. Rammed-earth platforms remain; it became World Heritage in 2014 with the Silk Roads."
 PWC_HERITAGE_QIN_MAUSOLEUM_TT: "§HMausoleum of the First Qin Emperor§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qin_mausoleum_photo£\n\n\n\n\n\n\n\n§gTombs and Burials§!\nAt the northern foot of Mount Li in Lintong, Xi'an, the tomb was begun in 246 BC; its mound still stands 51.3 m high. Nearly 200 pits hold thousands of life-size terracotta warriors, horses and bronze chariots. World Heritage since 1987."
 PWC_HERITAGE_ZHANG_QIAN_TOMB_BAOXIE_ROAD_TT: "§HTomb of Zhang Qian and the Baoxie Road§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_zhang_qian_tomb_baoxie_road_photo£\n\n\n\n\n\n\n\n\n§gAncient Roads and Bridges§!\nZhang Qian's tomb lies in Chenggu, Hanzhong; the Baoxie Road crossed the Qinling along the Bao River and Shimen. The image shows the tomb above the Shimen Plank Road scenic area; the original Shimen section was partly submerged by the reservoir."
 PWC_HERITAGE_FAMEN_TEMPLE_CRYPT_TT: "§HFamen Temple Crypt§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_famen_temple_crypt_photo£\n\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nFamen Temple in Fufeng county is called the ancestor of pagoda temples in Guanzhong. Its crypt, found in 1987, yielded the Buddha's finger relic, the eight nested caskets and thousands of Tang treasures."
 PWC_HERITAGE_MOGAO_CAVES_TT: "§HMogao Caves§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_mogao_caves_photo£\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nCut into cliffs southeast of the Dunhuang oasis from 366, Mogao keeps 492 caves with about 45,000 square metres of murals and over 2,000 painted sculptures spanning the 4th to 14th centuries, a treasure house of Silk Road Buddhist art."
 PWC_HERITAGE_YUMEN_AND_YANG_PASSES_TT: "§HYumen and Yang Passes§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_yumen_and_yang_passes_photo£\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nYumen Pass, the Small Square Fort, was set up under Han Wudi and named for the jade brought from the Western Regions; beyond it ran the northern route. Yang Pass to the southwest guarded the southern route. Yumen is part of the Silk Roads World Heritage."
 PWC_HERITAGE_MAIJISHAN_GROTTOES_TT: "§HMaijishan Grottoes§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_maijishan_grottoes_photo£\n\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nIn Maiji district, Tianshui, the grottoes were begun under the Later Qin and extended over a dozen dynasties. 194 caves and about 7,200 figures survive, famed for clay sculpture; World Heritage since 2014 with the Silk Roads."
 PWC_HERITAGE_BINGLING_TEMPLE_GROTTOES_TT: "§HBingling Temple Grottoes§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_bingling_temple_grottoes_photo£\n\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nCut into cliffs of Dasi gully on the north bank of the Yellow River in Yongjing, Bingling's Cave 169 bears an ink inscription dated 420, the earliest here. 34 caves and 149 niches remain; part of the Silk Roads World Heritage."
 PWC_HERITAGE_LEITAI_HAN_TOMB_TT: "§HLeitai Han Tomb§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_leitai_han_tomb_photo£\n\n\n\n\n\n\n\n\n§gTombs and Burials§!\nThe Leitai Han Tomb lies at Leitai in Wuwei, Gansu, and dates from the late Eastern Han to the early Wei and Jin period. Its finds include the famous Flying Horse bronze and a procession of figurines, illuminating burial practice, transport and daily life in the Hexi corridor. It became a national protected site in 2001."
 PWC_HERITAGE_WESTERN_XIA_TOMBS_TT: "§HXixia Imperial Tombs§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_western_xia_tombs_photo£\n\n\n\n\n\n\n\n\n§gTombs and Burials§!\nAt the eastern foot of the Helan Mountains near Yinchuan, the Western Xia necropolis holds 9 imperial tombs, 271 subordinate tombs and 32 flood works. The Tanguts founded Xia in 1038 and fell to the Mongols in 1227; World Heritage since 2025."
 PWC_HERITAGE_XUMISHAN_GROTTOES_TT: "§HXumishan Grottoes§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_xumishan_grottoes_photo£\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nOn Mount Xumi northwest of Yuanzhou, Guyuan, the caves were cut from the Northern Dynasties to the Tang, a few in the Ming and Qing. The Buddhist and Taoist temples around them are gone; national key relic since 1982."
 PWC_HERITAGE_HELAN_ROCK_ART_TT: "§HHelan Mountain Rock Art§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_helan_rock_art_photo£\n\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nRock art spreads through the Helan Mountains from Shizuishan to Zhongwei. First found at Helankou in 1969, it shows human faces and nomadic life, with some Tangut script; its dating is still unsettled."
 PWC_HERITAGE_GUYUAN_OLD_CITY_TT: "§HGuyuan Old City Site§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_guyuan_old_city_photo£\n\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nGuyuan was founded in 114 BC under the Western Han and given an outer city under the Northern Zhou, then often ruined and rebuilt. The 1920 Haiyuan earthquake badly damaged it; most walls were later removed and only the outer northwest corner remains."
 PWC_HERITAGE_JIAOHE_GAOCHANG_TT: "§HJiaohe and Gaochang Ancient Cities§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jiaohe_gaochang_photo£\n\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nJiaohe, built around the 2nd century BC, is the largest earthen city ruin and was the capital of Nearer Jushi; Gaochang was the leading town of the Turpan basin from the 1st century BC to the 14th. Both fell in 14th-century wars; Silk Roads World Heritage."
 PWC_HERITAGE_KIZIL_SUBASHI_TT: "§HKizil Caves and Subashi Temple§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_kizil_subashi_photo£\n\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nOn cliffs of Mingwutage southeast of Kizil town in Baicheng, 236 numbered caves survive, 81 with murals, from the ancient Kucha kingdom; the Subashi ruins in Kuqa are the great Zhaohuli temple. Both belong to the Silk Roads World Heritage."
 PWC_HERITAGE_BEITING_ANCIENT_CITY_TT: "§HBeiting Ancient City§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_beiting_ancient_city_photo£\n\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nIn Jimsar county, Beiting is usually identified with Beshbaliq. Under the Tang it was Tingzhou and seat of the Beiting Protectorate, after 840 a Qocho Uyghur capital and secondary capital, and it fell in 15th-century wars. Silk Roads World Heritage."
 PWC_HERITAGE_TURPAN_KAREZ_TT: "§HTurpan Karez Wells§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_turpan_karez_photo£\n\n\n\n\n\n\n\n§gWaterworks and Canals§!\nA karez combines an open channel, an underground channel, vertical wells and a small reservoir, bringing groundwater out at the dragon mouth. Turpan has over 1,100, with 294 million cubic metres a year watering about 30 percent of its farmland."
 PWC_HERITAGE_JIRZANKAL_CEMETERY_TT: "§HJirzankal Cemetery§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jirzankal_cemetery_photo£\n\n\n\n\n\n\n\n\n§gTombs and Burials§!\nOn river terraces at Quman village in Tashkurgan county, graves marked by black and white stone stripes date to about 2,500 years ago. Wooden fire altars found here are seen as the first Zoroastrian remains of around 500 BC found in Eurasia."
 PWC_HERITAGE_RIYUE_MOUNTAIN_TANG_TIBET_ROAD_TT: "§HRiyue Mountain and the Tang-Tibet Road§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_riyue_mountain_tang_tibet_road_photo£\n\n\n\n\n\n\n\n\n§gAncient Roads and Bridges§!\nRiyue Mountain, once called Chiling, lies southwest of Huangyuan and divides Qinghai's farmland from its pastures; the Tang-Tibet Road passed through it. After peace in 822 the Tang and Tibet drew their border here."
 PWC_HERITAGE_KUMBUM_MONASTERY_TT: "§HKumbum Monastery§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_kumbum_monastery_photo£\n\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nIn Lushar town, Huangzhong, Kumbum is one of the six great Gelug monasteries, built at Tsongkhapa's birthplace. His mother raised a memorial stupa in 1379, monks founded the monastery beside it in 1560, and it grew through the Ming and Qing."
 PWC_HERITAGE_DULAN_RESHUI_TOMBS_TT: "§HReshui Tombs, Dulan§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_dulan_reshui_tombs_photo£\n\n\n\n\n\n\n\n§gTombs and Burials§!\nOn both banks of the Chahanwusu River in Reshui, Dulan county, nearly 300 tombs of the Tuyuhun and Tibetan periods lie. Found in 1982 and excavated several times, they became a national key relic in 1996."
 PWC_HERITAGE_POTALA_JOKHANG_NORBULINGKA_TT: "§HPotala Palace, Jokhang and Norbulingka§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_potala_jokhang_norbulingka_photo£\n\n\n\n\n\n\n\n§gPalaces and Imperial Gardens§!\nThe Potala rises on Red Hill in Lhasa, first built under the Tibetan king Songtsen Gampo and rebuilt in the 17th century as the Dalai Lamas' winter palace. The Jokhang also dates to the 7th century; Norbulingka is an 18th-century summer palace."
 PWC_HERITAGE_SAMYE_MONASTERY_TT: "§HSamye Monastery§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_samye_monastery_photo£\n\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nOn the north bank of the Yarlung Tsangpo in Dranang, Shannan, Samye was founded in the 8th century under the Tibetan empire as Tibet's first monastery to ordain monks. Laid out as a Buddhist cosmos, its main hall blends Tibetan, Han and Indian styles."
 PWC_HERITAGE_SAKYA_MONASTERY_TT: "§HSakya Monastery§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_sakya_monastery_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nBelow Mount Bonpo in Sakya county, Shigatse, it is the main seat of the Sakya school, founded in 1073 by Khon Konchog Gyalpo. Its rich collections have earned it the name second Dunhuang."
 PWC_HERITAGE_TASHILHUNPO_MONASTERY_TT: "§HTashilhunpo Monastery§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tashilhunpo_monastery_photo£\n\n\n\n\n\n\n§gTemples and Shrines§!\nOn the southern slope of Nyiwo Hill in Shigatse, Tashilhunpo was founded in 1447. It is the largest monastery of Tsang, seat of the Panchen Lamas and former centre of Tsang's religion and government, one of the six great Gelug monasteries."
 PWC_HERITAGE_PELKOR_CHODE_MONASTERY_TT: "§HPelkor Chode Monastery§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_pelkor_chode_monastery_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nBelow Gyantse Dzong, Pelkor Chode was founded between 1418 and 1436 and shared by the Sakya, Shalu and Gelug schools. Its Kumbum stupa, begun in 1414, is 42.4 m high with 108 doors and 76 chapels."
 PWC_HERITAGE_GUGE_KINGDOM_RUINS_TT: "§HRuins of the Guge Kingdom§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_guge_kingdom_ruins_photo£\n\n\n\n\n\n\n\n§gArchaeological Sites§!\nGuge was an ancient kingdom of western Tibet from the late 10th century until Ladakh conquered it in 1635. Its ruins in Zanda county, Ngari, record the late 10th-century revival of Tibetan Buddhism and are on the Tentative List."
 PWC_HERITAGE_LESHAN_GIANT_BUDDHA_TT: "§HLeshan Giant Buddha and Lingyun Temple§!\n\n\n\n\n\n\n£PWC_HERITAGE_ART_leshan_giant_buddha_photo£\n\n\n\n\n\n\n§gGrottoes, Carvings and Rock Art§!\nCarved into the Qiluan Peak cliff beside three converging rivers, the Leshan Giant Buddha was begun in 713 and completed in 803. The statue and Lingyun Temple express Tang mastery of monumental cliff sculpture and landscape design."
 PWC_HERITAGE_JIAYUGUAN_PASS_TT: "§HJiayuguan Pass and Ming Great Wall§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jiayuguan_pass_photo£\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nBuilt from 1372 at the western end of the Hexi Corridor, Jiayuguan guarded the route between the Qilian and Black Mountains. Its inner and outer walls, barbicans, enceinte and beacon towers form a complete Ming frontier defense system."
 PWC_HERITAGE_JINCI_TEMPLE_TT: "§HJinci Temple§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jinci_temple_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nAt the foot of Mount Xuanweng in Taiyuan, Jinci preserves the ancestral shrine of the Jin state. The Song-period Holy Mother Hall, Fish Marsh Flying Bridge and Offering Hall stand beside carved figures and the Never-Old Spring."
 PWC_HERITAGE_EASTERN_QING_TOMBS_TT: "§HEastern Qing Tombs§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_eastern_qing_tombs_photo£\n\n\n\n\n\n\n\n§gTombs and Burials§!\nSet against Changrui Mountain near Zunhua, the Eastern Qing Tombs were established in 1661 as the first imperial necropolis after the Qing entered China. Xiaoling, Jingling and Yuling preserve the ceremonial axis and monumental stele pavilions."
 PWC_HERITAGE_XUANKONG_TEMPLE_TT: "§HHanging Temple of Hengshan§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_xuankong_temple_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nThe Hanging Temple clings to a cliff in Hengshan's Golden Dragon Gorge, where timber beams are anchored into rock to support its halls and walkways. Its compact complex brings Buddhist, Daoist and Confucian traditions together."
 PWC_HERITAGE_KAIFENG_IRON_PAGODA_TT: "§HIron Pagoda and Fan Pagoda of Kaifeng§!\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_kaifeng_iron_pagoda_photo£\n\n\n\n\n\n\n\n§gTemples and Shrines§!\nKaifeng's Iron Pagoda, rebuilt in 1049, is an octagonal thirteen-storey relic tower faced with rust-coloured glazed bricks. Fan Pagoda, begun in 974, preserves Northern Song brick carving and together they recall the city's Buddhist landscape."
 PWC_HERITAGE_TIANYI_PAVILION_TT: "§HTianyi Pavilion§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_tianyi_pavilion_photo£\n\n\n\n\n\n\n\n\n§gAcademies and Temples of Learning§!\nBuilt by Fan Qin between 1561 and 1566, Tianyi Pavilion is one of the world's oldest surviving private libraries. Its library hall, Tianyi Pool, rockeries and gardens embody Ming strategies for protecting books from fire."
 PWC_HERITAGE_QIANLING_MAUSOLEUM_TT: "§HQianling Mausoleum and Wordless Stele§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_qianling_mausoleum_photo£\n\n\n\n\n\n\n\n\n§gTombs and Burials§!\nSet into three peaks of Mount Liang, Qianling is the joint mausoleum of Emperor Gaozong and Empress Wu, begun in 683. Its spirit way, stone animals and famous Wordless Stele create a powerful landscape of Tang imperial burial."
 PWC_HERITAGE_GANZHOU_SONG_CITY_WALL_TT: "§HSong Dynasty City Wall of Ganzhou§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_ganzhou_song_city_wall_photo£\n\n\n\n\n\n\n\n\n§gPasses and Fortifications§!\nGanzhou's old city is enclosed on three sides by water and retains more than three kilometres of masonry wall from the Northern Song. Gates, bastions and the Fushou drainage network joined flood control, transport and defense."
 PWC_HERITAGE_JINGMAI_TEA_FOREST_TT: "§HAncient Tea Forests of Jingmai Mountain§!\n\n\n\n\n\n\n\n\n£PWC_HERITAGE_ART_jingmai_tea_forest_photo£\n\n\n\n\n\n\n\n\n§gCultural Landscapes§!\nOn Jingmai Mountain, Blang and Dai communities have tended tea beneath forest canopies since about the tenth century. Ancient trees, villages, water forests and sacred groves form a living agricultural landscape shaped by long-term ecological knowledge."
